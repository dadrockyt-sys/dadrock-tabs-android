name: V143 render V5 shadow professional PDF

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - '.github/workflows/v143-render-v5-shadow-professional-pdf.yml'
      - 'analyzer/materialize_v143_combined_content_shadow_v5_render_stream.py'
      - 'analyzer/validate_v143_v5_neutral_metadata_policy.py'
      - 'analyzer/v143_contextual_prune_attack_shadow_v3_replay_validator.py'
      - 'analyzer/v143_contextual_prune_combined_content_shadow_v5_replay_validator.py'
      - 'analyzer/materialize_v143_precision_fixture.py'
      - 'scripts/v143-render-v5-shadow-pdf.mjs'
      - 'lib/createV143RhythmPdf.js'
      - 'lib/v143RenderContract.js'
      - 'debug/v143-contextual-prune/electric-tabcnn-subfloor-attack-evidence.json'
      - 'debug/v143-contextual-prune/attack-shadow-v3-replay-validation.json'
      - 'debug/v143-contextual-prune/contextual-harmonic-primary-shadow-v4-validation.json'
      - 'debug/v143-contextual-prune/combined-content-shadow-v5-validation.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 1
      - name: Reverify protected runtime and durable V5 identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = '7f72f8ed9b14af8bc93e95544195204d99c6bec1'
          test "$(sha256sum debug/v143-contextual-prune/attack-shadow-v3-replay-validation.json | awk '{print $1}')" = '039a42d06abdc60a111cd85f0db9ac07b81caf1c1d91fd65e260ffb6119b1892'
          test "$(sha256sum debug/v143-contextual-prune/combined-content-shadow-v5-validation.json | awk '{print $1}')" = 'eb2cd7172ec2edd49e37709b1a4b638c0eb61607524827b3192993ab4b0d52ee'
      - name: Materialize immutable paid capture CPU-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin c1451df43cc1162ed2b38aa3f3300b7af4d9b527
          python3 analyzer/materialize_v143_precision_fixture.py \
            --output-dir debug/v143-contextual-prune-ci/pinned-capture
      - name: Materialize validated V5 render stream
        shell: bash
        run: |
          set -euo pipefail
          OUT=debug/v143-contextual-prune/v5-professional-pdf
          mkdir -p "$OUT"
          PYTHONPATH=analyzer python3 analyzer/materialize_v143_combined_content_shadow_v5_render_stream.py \
            debug/v143-contextual-prune-ci/pinned-capture/repaired-timing-precision-candidate-product.json \
            debug/v143-contextual-prune/electric-tabcnn-subfloor-attack-evidence.json \
            debug/v143-contextual-prune/attack-shadow-v3-replay-validation.json \
            debug/v143-contextual-prune/contextual-harmonic-primary-shadow-v4-validation.json \
            debug/v143-contextual-prune/combined-content-shadow-v5-validation.json \
            --output "$OUT/v5-render-stream.json" | tee "$OUT/materialize-report.txt"
      - name: Validate conservative neutral metadata policy
        shell: bash
        run: |
          set -euo pipefail
          OUT=debug/v143-contextual-prune/v5-professional-pdf
          PYTHONPATH=analyzer python3 analyzer/validate_v143_v5_neutral_metadata_policy.py \
            debug/v143-contextual-prune-ci/pinned-capture/repaired-timing-precision-candidate-product.json \
            "$OUT/v5-render-stream.json" \
            --output "$OUT/neutral-metadata-policy-report.json"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install renderer dependencies
        run: npm ci --ignore-scripts
      - name: Install PDF inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y poppler-utils
      - name: Render and inspect validated V5 shadow
        shell: bash
        run: |
          set -euo pipefail
          OUT=debug/v143-contextual-prune/v5-professional-pdf
          node --experimental-default-type=module scripts/v143-render-v5-shadow-pdf.mjs \
            "$OUT/v5-render-stream.json" \
            "$OUT/v5-rhythm-shadow.pdf" | tee "$OUT/render-report.json"
          pdfinfo "$OUT/v5-rhythm-shadow.pdf" | tee "$OUT/pdfinfo.txt"
          pdftoppm -png -r 150 "$OUT/v5-rhythm-shadow.pdf" "$OUT/page"
          PAGE_COUNT=$(pdfinfo "$OUT/v5-rhythm-shadow.pdf" | awk '/^Pages:/ {print $2}')
          MID_PAGE=$(( (PAGE_COUNT + 1) / 2 ))
          cp "$OUT/page-1.png" "$OUT/inspection-first.png"
          cp "$OUT/page-${MID_PAGE}.png" "$OUT/inspection-middle.png"
          cp "$OUT/page-${PAGE_COUNT}.png" "$OUT/inspection-last.png"
          sha256sum "$OUT/v5-render-stream.json" "$OUT/v5-rhythm-shadow.pdf" \
            "$OUT/inspection-first.png" "$OUT/inspection-middle.png" "$OUT/inspection-last.png" \
            | tee "$OUT/sha256.txt"
      - name: Persist compact V5 professional render evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=debug/v143-contextual-prune/v5-professional-pdf
          rm -f "$OUT"/page-*.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          if ! git diff --cached --quiet; then
            git commit -m 'Persist V5 professional PDF shadow render'
            git push origin HEAD:v143-contextual-prune-lobo
          fi
      - name: Upload V5 PDF and inspection images
        uses: actions/upload-artifact@v4
        with:
          name: v143-v5-professional-pdf-shadow
          path: debug/v143-contextual-prune/v5-professional-pdf/
          retention-days: 1
