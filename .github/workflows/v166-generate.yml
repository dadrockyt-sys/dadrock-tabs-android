name: V166 one-shot paired-window CPU generation

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v166-generate.yml

permissions:
  contents: write

concurrency:
  group: v166-generation-once
  cancel-in-progress: false

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: f2c068e45d60ad233968dc185fc3406e7c3558c0
  SOURCE_AUDIO: /tmp/v166-source.m4a
  NORM_WAV: /tmp/v166-normalized.wav
  DEMUCS_DIR: /tmp/v166-demucs
  STEM_DIR: /tmp/v166-demucs/htdemucs_6s/v166-normalized
  PREREG: debug/v166-cpu-autonomous/preregistration.json
  CONTRACT: debug/v166-cpu-autonomous/implementation-contract.json
  PRE_RUN: debug/v166-cpu-autonomous/pre-run-identity-receipt.json
  ENV_RECEIPT: debug/v166-cpu-autonomous/environment-receipt.json
  NEGATIVE_GUARD: debug/v166-cpu-autonomous/negative-runtime-guard.py
  EVENT_LOGIC: validation/v166_cpu_autonomous/event_logic_v166.py
  PAIRED_TEST: validation/v166_cpu_autonomous/test_paired_template_v166.py
  RUNTIME_TEST: validation/v166_cpu_autonomous/test_runtime_compat_v166.py
  TIMEBASE_BUILDER: validation/v166_cpu_autonomous/build_timebase_v166.py
  TIMEBASE_QC_CODE: validation/v166_cpu_autonomous/timebase_qc_v166.py
  TRANSCRIBER: validation/v166_cpu_autonomous/transcribe_v166.py
  STRUCTURAL_QC_CODE: validation/v166_cpu_autonomous/structural_qc_v166.py
  JSON_NATIVE_TEST: validation/v166_cpu_autonomous/test_json_native_v166.py
  TIMEBASE: debug/v166-cpu-autonomous/timebase.json
  TIMEBASE_QC: debug/v166-cpu-autonomous/timebase-qc.json
  OUTPUT: debug/v166-cpu-autonomous/generated.json
  GENERATION_RECEIPT: debug/v166-cpu-autonomous/generation-receipt.json
  STRUCTURAL_QC: debug/v166-cpu-autonomous/structural-qc.json
  TERMINAL_FREEZE: debug/v166-cpu-autonomous/terminal-freeze.json
  CUDA_VISIBLE_DEVICES: ""
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  generate-once:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact one-shot V166 arm
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify V166 one-shot identity and sealed boundaries
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v166-generate.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"

          test "$(git hash-object "$PREREG")" = "ca45241b4ab4689c8ceb3a7107e158367814cc1d"
          test "$(git hash-object "$CONTRACT")" = "9ab505ee8c7de732b6e9a8928854ae99d3ebb0c7"
          test "$(git hash-object "$PRE_RUN")" = "097d309d27f34ef0c02548b31a2440e3054aac00"
          test "$(git hash-object "$ENV_RECEIPT")" = "cec6af69f7fb0e35e25784c9cdcec5c8b5f907c1"
          test "$(git hash-object "$EVENT_LOGIC")" = "6561194742093d76bab452ef0bbb0b889724dc4e"
          test "$(git hash-object "$PAIRED_TEST")" = "59fd7379bf0fe6538e44f33732b91a04e0200046"
          test "$(git hash-object "$RUNTIME_TEST")" = "cf1eec33be04a9c4c2c0bb27425f93c2520f0a0e"
          test "$(git hash-object "$TIMEBASE_BUILDER")" = "6a5fddf7a8a7d3cc29256a67c21a75fd0d894eab"
          test "$(git hash-object "$TIMEBASE_QC_CODE")" = "5d59eda867f7252dff86faa0ec3a30bdb1c8c289"
          test "$(git hash-object "$TRANSCRIBER")" = "f04ca86525b2ce71680a90b84ed476943e9e6426"
          test "$(git hash-object "$STRUCTURAL_QC_CODE")" = "f69203ebd37c479ee06652f842f3e927e16beb9d"
          test "$(git hash-object "$JSON_NATIVE_TEST")" = "bead3542375d4364db080cbe0ffce2de499ca325"
          test "$(git hash-object "$NEGATIVE_GUARD")" = "fad6ea1a3d6750e86affc2214a417652c2261446"
          test "$(git hash-object .github/workflows/v166-static-preflight.yml)" = "e148c696dd77963f62129f74adccc852e84587d5"
          test "$(git hash-object .github/workflows/v166-environment-seal.yml)" = "fe4cfcb8b30a1a70d6bbc8d9a97b93a62a258be6"

          for path in "$TIMEBASE" "$TIMEBASE_QC" "$OUTPUT" "$GENERATION_RECEIPT" "$STRUCTURAL_QC" "$TERMINAL_FREEZE"; do
            test ! -e "$path"
          done

          python "$NEGATIVE_GUARD" \
            --event-logic "$EVENT_LOGIC" \
            --transcriber "$TRANSCRIBER" \
            --paired-test "$PAIRED_TEST" \
            --runtime-test "$RUNTIME_TEST" \
            --timebase-builder "$TIMEBASE_BUILDER" \
            --timebase-qc "$TIMEBASE_QC_CODE" \
            --structural-qc "$STRUCTURAL_QC_CODE" \
            --json-test "$JSON_NATIVE_TEST"

          python - <<'PY'
          import json
          from pathlib import Path
          prereg = json.loads(Path("debug/v166-cpu-autonomous/preregistration.json").read_text())
          contract = json.loads(Path("debug/v166-cpu-autonomous/implementation-contract.json").read_text())
          pre = json.loads(Path("debug/v166-cpu-autonomous/pre-run-identity-receipt.json").read_text())
          env = json.loads(Path("debug/v166-cpu-autonomous/environment-receipt.json").read_text())

          assert prereg["version"] == "V166" and prereg["validation"] == "PASS"
          assert prereg["status"] == "PREREGISTERED_BEFORE_NUMERIC_CONTRACT_OR_IMPLEMENTATION_CODE"
          assert prereg["hypothesis"]["combinedOffsets"] == [-1,0,1,2,3,4]
          assert contract["version"] == "V166" and contract["validation"] == "PASS"
          assert contract["status"] == "SEALED_BEFORE_IMPLEMENTATION_CODE"
          assert contract["pairedTemplate"]["combinedOffsets"] == [-1,0,1,2,3,4]
          assert contract["pairedTemplate"]["frameCount"] == 6
          runtime = contract["runtimeBoundaries"]
          assert runtime["generationMaximum"] == 1
          assert runtime["generationAttemptMaximum"] == 1
          assert runtime["generationRerunForbidden"] is True
          assert runtime["professionalReferenceReadDuringGenerationForbidden"] is True
          assert runtime["scorerReadDuringGenerationForbidden"] is True
          assert runtime["V165CandidateReadDuringGenerationForbidden"] is True
          assert runtime["V165ScoreReadDuringGenerationForbidden"] is True
          assert runtime["gpuCudaModalForbidden"] is True

          assert pre["schema"] == "dadrock.tabs.v166.pre-run-identity-receipt.v1"
          assert pre["version"] == "V166" and pre["validation"] == "PASS"
          pins = pre["pinnedGitBlobs"]
          expected = {
              "preregistration": "ca45241b4ab4689c8ceb3a7107e158367814cc1d",
              "implementationContract": "9ab505ee8c7de732b6e9a8928854ae99d3ebb0c7",
              "eventLogic": "6561194742093d76bab452ef0bbb0b889724dc4e",
              "transcriber": "f04ca86525b2ce71680a90b84ed476943e9e6426",
              "timebaseBuilder": "6a5fddf7a8a7d3cc29256a67c21a75fd0d894eab",
              "timebaseQc": "5d59eda867f7252dff86faa0ec3a30bdb1c8c289",
              "structuralQc": "f69203ebd37c479ee06652f842f3e927e16beb9d",
              "pairedWindowFixture": "59fd7379bf0fe6538e44f33732b91a04e0200046",
              "runtimeCompatibilityFixture": "cf1eec33be04a9c4c2c0bb27425f93c2520f0a0e",
              "jsonNativeFixture": "bead3542375d4364db080cbe0ffce2de499ca325",
              "negativeRuntimeGuard": "fad6ea1a3d6750e86affc2214a417652c2261446",
              "staticPreflightWorkflow": "e148c696dd77963f62129f74adccc852e84587d5",
          }
          for k,v in expected.items(): assert pins[k] == v, k
          for k in ("timebaseMustNotExistAtSeal","timebaseQcReceiptMustNotExistAtSeal","candidateMustNotExistAtSeal","generationReceiptMustNotExistAtSeal","structuralQcReceiptMustNotExistAtSeal","terminalFreezeMustNotExistAtSeal","environmentReceiptMustNotExistAtSeal","generationWorkflowMustNotExistAtSeal"):
              assert pre[k] is True, k
          assert pre["referenceReadAtSeal"] is False
          assert pre["professionalReferencePathsOpenedAtSeal"] == 0
          assert pre["frozenScorerReadAtSeal"] is False
          assert pre["V165CandidateReadAtSeal"] is False
          assert pre["V165ScoreReadAtSeal"] is False
          assert pre["songAudioExecutionsAtSeal"] == 0
          assert pre["pitchInferenceExecutionsAtSeal"] == 0
          assert pre["gpuExecutionsAtSeal"] == 0

          assert env["schema"] == "dadrock.tabs.v166.cpu-environment-receipt.v1"
          assert env["version"] == "V166" and env["validation"] == "PASS"
          assert env["status"] == "VERIFIED_BEFORE_SONG_PROCESSING"
          assert env["device"] == "cpu"
          assert env["pythonVersion"] == "3.10.21"
          assert env["torchVersion"] == "2.8.0+cpu"
          assert env["torchCudaVersion"] is None
          assert env["cudaAvailable"] is False
          assert env["workflowRunId"] == 33226566787
          assert env["workflowRunNumber"] == 1
          assert env["workflowRunAttempt"] == 1
          assert env["environmentWorkflowGitBlob"] == "fe4cfcb8b30a1a70d6bbc8d9a97b93a62a258be6"
          assert env["preRunIdentityReceiptGitBlob"] == "097d309d27f34ef0c02548b31a2440e3054aac00"
          assert env["plannedSeparation"] == {"device":"cpu","executedAtSeal":False,"jobs":1,"model":"htdemucs_6s","repeatCount":1,"shifts":1}
          safety = env["safety"]
          for k in ("referenceRead","frozenScorerRead","V165CandidateRead","V165ScoreRead","priorGeneratedCandidateRead","priorScoreRead","referenceGuidedFiltering","thresholdSweep","variantSelection","humanCorrection","songAudioRead","normalizationExecuted","demucsExecuted","pitchInferenceExecuted","cudaGpuUsed","modalUsed","mainOrProductionModified"):
              assert safety[k] is False, k
          assert safety["professionalReferencePathsOpened"] == 0
          assert safety["referenceFacingScoreCalls"] == 0
          PY

      - name: Execute sole V166 CPU pipeline
        id: pipeline
        shell: bash
        run: |
          set -u
          mkdir -p debug/v166-cpu-autonomous
          printf '%s\n' "PIPELINE_STARTED" > /tmp/v166-stage
          printf '%s\n' "PIPELINE_UNEXPECTED_FAILURE" > /tmp/v166-outcome

          fail_stage() {
            printf '%s\n' "$1" > /tmp/v166-outcome
            exit 0
          }

          if ! python -m pip install --disable-pip-version-check --upgrade pip; then fail_stage "DEPENDENCY_BOOTSTRAP_FAIL"; fi
          if ! python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0; then fail_stage "TORCH_INSTALL_FAIL"; fi
          if ! python -m pip install --disable-pip-version-check \
            numpy==1.26.4 scipy==1.13.1 soundfile==0.12.1 \
            basic-pitch==0.4.0 demucs==4.1.0 imageio-ffmpeg==0.6.0 librosa==0.11.0; then
            fail_stage "DEPENDENCY_INSTALL_FAIL"
          fi

          if ! python - <<'PY'
          import importlib.metadata as md, json, platform
          from pathlib import Path
          import torch
          env = json.loads(Path("debug/v166-cpu-autonomous/environment-receipt.json").read_text())
          assert platform.python_version() == env["pythonVersion"]
          assert torch.__version__ == env["torchVersion"] == "2.8.0+cpu"
          assert torch.version.cuda is None and env["torchCudaVersion"] is None
          assert torch.cuda.is_available() is False and env["cudaAvailable"] is False
          for package, expected in env["dependencyVersions"].items():
              assert md.version(package) == expected, (package, md.version(package), expected)
          PY
          then fail_stage "CPU_ENVIRONMENT_REPRODUCTION_FAIL"; fi
          printf '%s\n' "DEPENDENCIES_VERIFIED" > /tmp/v166-stage

          if ! git show 74b0f815ff3f66f325220975c410621503de440f:public/gomywayfullaitest.m4a > "$SOURCE_AUDIO"; then fail_stage "SOURCE_MATERIALIZATION_FAIL"; fi
          if ! python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path("/tmp/v166-source.m4a")
          assert p.stat().st_size == 3478611
          assert hashlib.sha256(p.read_bytes()).hexdigest() == "215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f"
          PY
          then fail_stage "SOURCE_IDENTITY_FAIL"; fi
          printf '%s\n' "SOURCE_VERIFIED" > /tmp/v166-stage

          FFMPEG_EXE="$(python - <<'PY'
          import imageio_ffmpeg
          print(imageio_ffmpeg.get_ffmpeg_exe())
          PY
          )"
          if ! "$FFMPEG_EXE" -hide_banner -loglevel error -y -i "$SOURCE_AUDIO" -ar 44100 -ac 2 -c:a pcm_s16le "$NORM_WAV"; then fail_stage "NORMALIZATION_FAIL"; fi
          test -s "$NORM_WAV" || fail_stage "NORMALIZED_MIX_MISSING"
          printf '%s\n' "NORMALIZED_VERIFIED" > /tmp/v166-stage

          if ! python - <<'PY'
          import random, numpy as np, torch
          from demucs.separate import main
          random.seed(0); np.random.seed(0); torch.manual_seed(0)
          torch.set_num_threads(1); torch.set_num_interop_threads(1); torch.use_deterministic_algorithms(True)
          main(["-n","htdemucs_6s","-d","cpu","--shifts","1","-j","1","-o","/tmp/v166-demucs","/tmp/v166-normalized.wav"])
          PY
          then fail_stage "DEMUCS_FAIL"; fi
          for stem in guitar bass drums; do test -s "$STEM_DIR/$stem.wav" || fail_stage "DEMUCS_STEM_MISSING_${stem^^}"; done
          printf '%s\n' "DEMUCS_VERIFIED" > /tmp/v166-stage

          set +e
          python "$TIMEBASE_BUILDER" --source-audio "$SOURCE_AUDIO" --mix "$NORM_WAV" --drums "$STEM_DIR/drums.wav" --bass "$STEM_DIR/bass.wav" --guitar "$STEM_DIR/guitar.wav" --preregistration "$PREREG" --implementation-contract "$CONTRACT" --output "$TIMEBASE"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then rm -f "$TIMEBASE"; fail_stage "TIMEBASE_BUILD_FAIL"; fi
          test -s "$TIMEBASE" || fail_stage "TIMEBASE_BUILD_MISSING_ARTIFACT"
          printf '%s\n' "TIMEBASE_BUILT" > /tmp/v166-stage

          set +e
          python "$TIMEBASE_QC_CODE" --timebase "$TIMEBASE" --source-audio "$SOURCE_AUDIO" --mix "$NORM_WAV" --drums "$STEM_DIR/drums.wav" --bass "$STEM_DIR/bass.wav" --guitar "$STEM_DIR/guitar.wav" --preregistration "$PREREG" --implementation-contract "$CONTRACT" --receipt "$TIMEBASE_QC"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || [ ! -s "$TIMEBASE_QC" ]; then rm -f "$OUTPUT" "$GENERATION_RECEIPT" "$STRUCTURAL_QC"; fail_stage "TIMEBASE_QC_FAIL"; fi
          if ! python - <<'PY'
          import json
          q=json.load(open("debug/v166-cpu-autonomous/timebase-qc.json"))
          assert q["schema"]=="dadrock.tabs.v166.local-evidence-timebase-qc.v1" and q["version"]=="V166" and q["validation"]=="PASS"
          assert q["safety"]["pitchInferenceInvoked"] is False
          assert q["safety"]["referenceRead"] is False
          assert q["safety"]["gpuUsed"] is False
          PY
          then fail_stage "TIMEBASE_QC_BOUNDARY_FAIL"; fi
          printf '%s\n' "TIMEBASE_QC_PASS" > /tmp/v166-stage

          set +e
          python "$TRANSCRIBER" --mix "$NORM_WAV" --guitar "$STEM_DIR/guitar.wav" --bass "$STEM_DIR/bass.wav" --drums "$STEM_DIR/drums.wav" --timebase "$TIMEBASE" --timebase-qc "$TIMEBASE_QC" --preregistration "$PREREG" --implementation-contract "$CONTRACT" --pre-run-receipt "$PRE_RUN" --environment-receipt "$ENV_RECEIPT" --output "$OUTPUT" --receipt "$GENERATION_RECEIPT"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then rm -f "$OUTPUT" "$GENERATION_RECEIPT"; fail_stage "TRANSCRIBER_FAIL"; fi
          test -s "$OUTPUT" || fail_stage "TRANSCRIBER_MISSING_CANDIDATE"
          test -s "$GENERATION_RECEIPT" || fail_stage "TRANSCRIBER_MISSING_RECEIPT"
          printf '%s\n' "CANDIDATE_CREATED" > /tmp/v166-stage

          set +e
          python "$STRUCTURAL_QC_CODE" --candidate "$OUTPUT" --generation-receipt "$GENERATION_RECEIPT" --timebase "$TIMEBASE" --timebase-qc "$TIMEBASE_QC" --mix "$NORM_WAV" --drums "$STEM_DIR/drums.wav" --guitar "$STEM_DIR/guitar.wav" --bass "$STEM_DIR/bass.wav" --preregistration "$PREREG" --implementation-contract "$CONTRACT" --pre-run-receipt "$PRE_RUN" --environment-receipt "$ENV_RECEIPT" --event-logic "$EVENT_LOGIC" --transcriber "$TRANSCRIBER" --timebase-builder "$TIMEBASE_BUILDER" --timebase-qc-code "$TIMEBASE_QC_CODE" --negative-runtime-guard "$NEGATIVE_GUARD" --receipt "$STRUCTURAL_QC"
          rc=$?
          set -e
          if [ ! -s "$STRUCTURAL_QC" ]; then fail_stage "STRUCTURAL_QC_RUNTIME_FAIL"; fi
          sqc="$(python - <<'PY'
          import json
          print(json.load(open("debug/v166-cpu-autonomous/structural-qc.json"))["validation"])
          PY
          )"
          if [ "$rc" -ne 0 ]; then
            if [ "$sqc" = "FAIL" ]; then printf '%s\n' "STRUCTURAL_QC_FAIL" > /tmp/v166-outcome; exit 0; fi
            fail_stage "STRUCTURAL_QC_RUNTIME_FAIL"
          fi
          [ "$sqc" = "PASS" ] || fail_stage "STRUCTURAL_QC_NONPASS_WITH_ZERO_EXIT"
          printf '%s\n' "STRUCTURAL_QC_PASS" > /tmp/v166-stage
          printf '%s\n' "STRUCTURAL_QC_PASS" > /tmp/v166-outcome

      - name: Freeze terminal V166 state and self-seal
        if: always()
        env:
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          outcome="$(cat /tmp/v166-outcome 2>/dev/null || printf '%s' 'PIPELINE_UNEXPECTED_FAILURE')"
          stage="$(cat /tmp/v166-stage 2>/dev/null || printf '%s' 'UNKNOWN')"
          if [ "$GUARD_OUTCOME" != "success" ]; then outcome="PRE_RUN_GUARD_FAIL"; stage="PRE_RUN_GUARD"; fi
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"

          OUTCOME="$outcome" STAGE="$stage" python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          paths={
            "environmentReceipt":Path("debug/v166-cpu-autonomous/environment-receipt.json"),
            "timebase":Path("debug/v166-cpu-autonomous/timebase.json"),
            "timebaseQc":Path("debug/v166-cpu-autonomous/timebase-qc.json"),
            "candidate":Path("debug/v166-cpu-autonomous/generated.json"),
            "generationReceipt":Path("debug/v166-cpu-autonomous/generation-receipt.json"),
            "structuralQc":Path("debug/v166-cpu-autonomous/structural-qc.json"),
          }
          def sha(path):
            h=hashlib.sha256()
            with path.open("rb") as f:
              for chunk in iter(lambda:f.read(1024*1024),b""): h.update(chunk)
            return h.hexdigest()
          def blob(path): return subprocess.check_output(["git","hash-object",str(path)],text=True).strip()
          artifacts={name:{"exists":p.is_file(),"sha256":sha(p) if p.is_file() else None,"gitBlob":blob(p) if p.is_file() else None} for name,p in paths.items()}
          outcome=os.environ["OUTCOME"]
          authoritative=outcome=="STRUCTURAL_QC_PASS"
          if outcome in {"STRUCTURAL_QC_PASS","STRUCTURAL_QC_FAIL"}:
            assert artifacts["candidate"]["exists"] and artifacts["generationReceipt"]["exists"] and artifacts["structuralQc"]["exists"]
          freeze={
            "schema":"dadrock.tabs.v166.terminal-freeze.v1","version":"V166","status":"TERMINAL","outcome":outcome,"lastCompletedStage":os.environ["STAGE"],
            "workflowRunId":int(os.environ["GITHUB_RUN_ID"]),"workflowRunNumber":int(os.environ["GITHUB_RUN_NUMBER"]),"workflowRunAttempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),"workflowHeadSha":os.environ["GITHUB_SHA"],
            "generationWorkflowGitBlob":blob(".github/workflows/v166-generate.yml"),
            "preRunIdentityReceiptGitBlob":"097d309d27f34ef0c02548b31a2440e3054aac00","environmentReceiptGitBlob":"cec6af69f7fb0e35e25784c9cdcec5c8b5f907c1",
            "candidateAuthoritative":authoritative,"professionalReferenceScoringAuthorized":False,"neverRearmV166":True,"artifacts":artifacts,
            "pairedWindow":{"offsets":[-1,0,1,2,3,4],"frameCount":6,"contractGitBlob":"9ab505ee8c7de732b6e9a8928854ae99d3ebb0c7"},
            "safety":{"referenceRead":False,"professionalReferencePathsOpened":0,"referenceFacingScoreCalls":0,"frozenScorerRead":False,"V165CandidateRead":False,"V165ScoreRead":False,"priorGeneratedCandidateRead":False,"priorScoreRead":False,"referenceGuidedFiltering":False,"thresholdSweep":False,"variantSelection":False,"humanCorrection":False,"cudaGpuUsed":False,"modalUsed":False,"mainOrProductionModified":False}
          }
          assert freeze["workflowRunNumber"]==1 and freeze["workflowRunAttempt"]==1
          Path("debug/v166-cpu-autonomous/terminal-freeze.json").write_text(json.dumps(freeze,indent=2,sort_keys=True,allow_nan=False)+"\n")
          PY

          rm .github/workflows/v166-generate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- debug/v166-cpu-autonomous .github/workflows/v166-generate.yml
          changed="$(git diff --cached --name-only)"
          test -n "$changed"
          if echo "$changed" | grep -Ev '^debug/v166-cpu-autonomous/(timebase\.json|timebase-qc\.json|generated\.json|generation-receipt\.json|structural-qc\.json|terminal-freeze\.json)$|^\.github/workflows/v166-generate\.yml$'; then
            echo "Unexpected path in V166 terminal freeze commit" >&2
            exit 1
          fi
          case "$outcome" in
            STRUCTURAL_QC_PASS) message="research: freeze sole V166 paired-window CPU candidate [skip ci]" ;;
            TIMEBASE_QC_FAIL|TIMEBASE_QC_BOUNDARY_FAIL) message="research: freeze terminal V166 timebase-QC failure [skip ci]" ;;
            STRUCTURAL_QC_FAIL) message="research: freeze terminal V166 structural-QC failure [skip ci]" ;;
            *) message="research: freeze terminal V166 execution failure [skip ci]" ;;
          esac
          git commit -m "$message"
          git push origin HEAD:"$BRANCH"
          if [ "$outcome" != "STRUCTURAL_QC_PASS" ]; then exit 1; fi
