name: V143 Reference History Inventory

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-reference-history-inventory.yml

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Inventory scorer-related branch commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: v143-contextual-prune-lobo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug/v143-contextual-prune
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']; branch=os.environ['BRANCH']
          needles=('reference','holdout','chunk','score','scorer','transcrib','professional','measure','freeze')
          rows=[]; scanned=0
          for page in range(1,11):
              url=f'https://api.github.com/repos/{repo}/commits?sha={urllib.parse.quote(branch)}&per_page=100&page={page}'
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'dadrock-v143-history'})
              with urllib.request.urlopen(req,timeout=30) as r: items=json.load(r)
              if not items: break
              scanned+=len(items)
              for item in items:
                  c=item.get('commit') or {}; msg=str(c.get('message') or '')
                  if any(n in msg.lower() for n in needles):
                      rows.append({'sha':item.get('sha'),'message':msg,'authorDate':((c.get('author') or {}).get('date')),'committerDate':((c.get('committer') or {}).get('date'))})
              if len(items)<100: break
          out={'schemaVersion':1,'gate':'v143-reference-history-inventory','branch':branch,'commitsScanned':scanned,'matches':rows,'matchCount':len(rows),'referencePayloadOpened':False,'productionModified':False}
          Path('debug/v143-contextual-prune/reference-history-inventory.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - name: Commit history inventory
        shell: bash
        run: |
          set -euo pipefail
          git add debug/v143-contextual-prune/reference-history-inventory.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record scorer-related branch history'
          git fetch origin v143-contextual-prune-lobo
          git rebase origin/v143-contextual-prune-lobo
          git push origin HEAD:v143-contextual-prune-lobo
