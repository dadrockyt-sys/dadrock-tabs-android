name: V143 Professional Holdout Source Inspect

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-professional-holdout-source-inspect.yml

permissions:
  contents: write

concurrency:
  group: v143-professional-holdout-source-inspect
  cancel-in-progress: true

jobs:
  inspect-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Inspect scorer-only professional source structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug/v143-contextual-prune .scorer
          python - <<'PY'
          import gzip, json, subprocess, urllib.request
          from collections import Counter
          from pathlib import Path

          SONG_ID = 243
          RHYTHM_TRACK_INDEX = 3
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36'
          NORMAL_HOSTS = ['dqsljvtekg760', 'd34shlm8p2ums2', 'd3cqchs6g3b5ew']
          STAGE_HOST = 'd3d3l6a6rcgkaf'
          EXPECTED_PROTECTED = '7f72f8ed9b14af8bc93e95544195204d99c6bec1'

          def get_bytes(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': '*/*', 'Accept-Encoding': 'gzip'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read()
              if data[:2] == b'\x1f\x8b':
                  data = gzip.decompress(data)
              return data

          def get_json(url):
              return json.loads(get_bytes(url))

          def truthy(value):
              return value not in (None, False, 0, '', [], {})

          meta = get_json(f'https://www.songsterr.com/api/meta/{SONG_ID}')
          try:
              revisions = get_json(f'https://www.songsterr.com/api/meta/{SONG_ID}/revisions')
          except Exception as exc:
              revisions = {'error': type(exc).__name__ + ': ' + str(exc)}

          revision_id = int(meta['revisionId'])
          image = str(meta.get('image') or '')
          tracks = meta.get('tracks') or []
          track_summaries = []
          rhythm_track_saved = False
          rhythm_playable_summary = None
          for index, track in enumerate(tracks):
              if image.endswith('-stage'):
                  hosts = [STAGE_HOST]
              elif image:
                  hosts = NORMAL_HOSTS
              else:
                  hosts = ['d3rrfvx08uyjp1', 'dodkcbujl0ebx', 'dj1usja78sinh']
              part = None
              last_error = None
              for host in hosts:
                  url = (f'https://{host}.cloudfront.net/{SONG_ID}/{revision_id}/{image}/{index}.json'
                         if image else f'https://{host}.cloudfront.net/part/{revision_id}/{index}')
                  try:
                      part = get_json(url)
                      break
                  except Exception as exc:
                      last_error = type(exc).__name__ + ': ' + str(exc)
              summary = {'index': index, 'trackMeta': track, 'fetchSucceeded': part is not None,
                         'fetchError': last_error if part is None else None}
              if isinstance(part, dict):
                  if index == RHYTHM_TRACK_INDEX:
                      Path('.scorer/rhythm-track.json').write_text(json.dumps(part, separators=(',', ':')) + '\n')
                      Path('.scorer/song-meta.json').write_text(json.dumps(meta, separators=(',', ':')) + '\n')
                      rhythm_track_saved = True
                  measures = part.get('measures') or []
                  beat_count = note_count = voice_count = 0
                  measure_keys=set(); beat_keys=set(); note_keys=set()
                  if index == RHYTHM_TRACK_INDEX:
                      agg = Counter()
                      beat_duration_values = Counter()
                      note_flag_combos = Counter()
                  for measure in measures:
                      if not isinstance(measure, dict): continue
                      measure_keys.update(measure.keys())
                      voices = measure.get('voices') or []
                      voice_count += len(voices)
                      for voice in voices:
                          if not isinstance(voice, dict): continue
                          for beat in voice.get('beats') or []:
                              if not isinstance(beat, dict): continue
                              beat_count += 1; beat_keys.update(beat.keys())
                              notes = [n for n in (beat.get('notes') or []) if isinstance(n, dict)]
                              note_count += len(notes)
                              for note in notes: note_keys.update(note.keys())
                              if index == RHYTHM_TRACK_INDEX:
                                  agg['beats'] += 1
                                  if truthy(beat.get('rest')): agg['beatRestTruthy'] += 1
                                  beat_duration_values[str(beat.get('duration'))] += 1
                                  positional=[]; live=[]; live_non_tie=[]
                                  for note in notes:
                                      agg['notes'] += 1
                                      has_pos = isinstance(note.get('fret'), (int,float)) and isinstance(note.get('string'), (int,float))
                                      is_rest = truthy(note.get('rest'))
                                      is_dead = truthy(note.get('dead'))
                                      is_tie = truthy(note.get('tie'))
                                      if has_pos: agg['notesWithPosition'] += 1
                                      if is_rest: agg['noteRestTruthy'] += 1
                                      if is_dead: agg['noteDeadTruthy'] += 1
                                      if is_tie: agg['noteTieTruthy'] += 1
                                      note_flag_combos[f'pos={int(has_pos)} rest={int(is_rest)} dead={int(is_dead)} tie={int(is_tie)}'] += 1
                                      if has_pos: positional.append(note)
                                      if has_pos and not is_rest and not is_dead: live.append(note)
                                      if has_pos and not is_rest and not is_dead and not is_tie: live_non_tie.append(note)
                                  if positional: agg['beatsWithPositionNote'] += 1
                                  if live: agg['beatsWithPlayableLiveNote'] += 1
                                  if live_non_tie: agg['beatsWithPlayableLiveNonTieNote'] += 1
                                  agg['playableLiveNotes'] += len(live)
                                  agg['playableLiveNonTieNotes'] += len(live_non_tie)
                      
                  summary['structure'] = {
                      'topLevelKeys': sorted(part.keys()), 'measureCount': len(measures),
                      'voiceCount': voice_count, 'beatCount': beat_count, 'noteCount': note_count,
                      'measureKeys': sorted(measure_keys), 'beatKeys': sorted(beat_keys), 'noteKeys': sorted(note_keys),
                      'partName': part.get('name'), 'instrument': part.get('instrument'), 'tuning': part.get('tuning'),
                      'capo': part.get('capo'), 'frets': part.get('frets'), 'strings': part.get('strings')}
                  if index == RHYTHM_TRACK_INDEX:
                      rhythm_playable_summary = {
                          'aggregate': dict(sorted(agg.items())),
                          'beatDurationHistogram': dict(sorted(beat_duration_values.items())),
                          'noteFlagCombinations': dict(sorted(note_flag_combos.items())),
                          'targetPriorVerifiedPlayableOnsets': 577,
                          'targetPriorVerifiedPlayableNotes': 925,
                      }
              track_summaries.append(summary)

          protected_blob = subprocess.check_output(['git','hash-object','analyzer/v143_reference_free_rhythm_pipeline.py'], text=True).strip()
          out = {
              'schemaVersion': 3, 'gate': 'v143-professional-holdout-source-inspect',
              'runId': int('${{ github.run_id }}'), 'runAttempt': int('${{ github.run_attempt }}'),
              'triggerSha': '${{ github.sha }}', 'artifactName': 'v143-professional-source-raw-track',
              'songId': SONG_ID, 'rhythmTrackIndex': RHYTHM_TRACK_INDEX,
              'meta': {'artist': meta.get('artist'), 'title': meta.get('title'), 'revisionId': revision_id,
                       'image': image, 'trackCount': len(tracks), 'defaultTrack': meta.get('defaultTrack'),
                       'popularTrack': meta.get('popularTrack'), 'keys': sorted(meta.keys())},
              'revisionsSummary': revisions, 'tracks': track_summaries,
              'rhythmPlayableStructure': rhythm_playable_summary,
              'rhythmTrackTemporaryArtifactSaved': rhythm_track_saved,
              'professionalReferenceOpenedOnlyAfterFreshFreeze': True,
              'referenceUsedByAnalyzer': False, 'runtimeLabelsRequired': False,
              'protectedPipelineBlob': protected_blob, 'protectedPipelineUnchanged': protected_blob == EXPECTED_PROTECTED,
              'productionModified': False, 'copyrightedNotePayloadCommitted': False}
          out['passed'] = out['protectedPipelineUnchanged'] and rhythm_track_saved
          Path('debug/v143-contextual-prune/professional-source-structure.json').write_text(json.dumps(out, indent=2) + '\n')
          if not out['passed']: raise SystemExit('professional source structure inspection failed')
          PY

      - name: Upload scorer-only raw rhythm track
        uses: actions/upload-artifact@v4
        with:
          name: v143-professional-source-raw-track
          path: |
            .scorer/rhythm-track.json
            .scorer/song-meta.json
          retention-days: 1

      - name: Commit non-copyrighted structure diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git add debug/v143-contextual-prune/professional-source-structure.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record professional holdout source structure'
          git fetch origin v143-contextual-prune-lobo
          git rebase origin/v143-contextual-prune-lobo
          git push origin HEAD:v143-contextual-prune-lobo
