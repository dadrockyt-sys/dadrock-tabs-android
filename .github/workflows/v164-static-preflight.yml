name: V164 CPU Static Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v164-static-preflight
  cancel-in-progress: false

jobs:
  static-preflight:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sealed branch state
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install static dependency only
        run: python -m pip install --disable-pip-version-check numpy==2.0.2

      - name: Syntax compile V164 implementation and guards
        run: |
          python -m py_compile \
            validation/v164_cpu_autonomous/event_logic_v164.py \
            validation/v164_cpu_autonomous/test_event_logic_v164.py \
            validation/v164_cpu_autonomous/build_timebase_v164.py \
            validation/v164_cpu_autonomous/timebase_qc_v164.py \
            validation/v164_cpu_autonomous/transcribe_v164.py \
            validation/v164_cpu_autonomous/structural_qc_v164.py \
            validation/v164_cpu_autonomous/test_json_native_v164.py \
            debug/v164-cpu-autonomous/negative-runtime-guard.py

      - name: Run song-blind local-evidence invariance fixtures
        run: python validation/v164_cpu_autonomous/test_event_logic_v164.py

      - name: Run JSON-native local-provenance fixture
        run: python validation/v164_cpu_autonomous/test_json_native_v164.py

      - name: Run negative runtime guard including workflow
        run: >-
          python debug/v164-cpu-autonomous/negative-runtime-guard.py
          --event-logic validation/v164_cpu_autonomous/event_logic_v164.py
          --event-test validation/v164_cpu_autonomous/test_event_logic_v164.py
          --timebase-builder validation/v164_cpu_autonomous/build_timebase_v164.py
          --timebase-qc validation/v164_cpu_autonomous/timebase_qc_v164.py
          --transcriber validation/v164_cpu_autonomous/transcribe_v164.py
          --structural-qc validation/v164_cpu_autonomous/structural_qc_v164.py
          --json-native-test validation/v164_cpu_autonomous/test_json_native_v164.py
          --workflow .github/workflows/v164-static-preflight.yml
