name: V165 one-shot adapter-repair CPU generation

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v165-generate.yml

permissions:
  contents: write

concurrency:
  group: v165-generation-once
  cancel-in-progress: false

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: c2e9b5f616ab08bafbb5409f1485e24aec531820
  SOURCE_AUDIO: /tmp/v165-source.m4a
  NORM_WAV: /tmp/v165-normalized.wav
  DEMUCS_DIR: /tmp/v165-demucs
  STEM_DIR: /tmp/v165-demucs/htdemucs_6s/v165-normalized
  PREREG: debug/v165-cpu-autonomous/preregistration.json
  CONTRACT: debug/v165-cpu-autonomous/implementation-contract.json
  PRE_RUN: debug/v165-cpu-autonomous/pre-run-identity-receipt.json
  ENV_RECEIPT: debug/v165-cpu-autonomous/environment-receipt.json
  NEGATIVE_GUARD: debug/v165-cpu-autonomous/negative-runtime-guard.py
  EVENT_LOGIC: validation/v165_cpu_autonomous/event_logic_v165.py
  EVENT_TEST: validation/v165_cpu_autonomous/test_event_logic_v165.py
  ADAPTER_TEST: validation/v165_cpu_autonomous/test_transcriber_adapter_v165.py
  TIMEBASE_BUILDER: validation/v165_cpu_autonomous/build_timebase_v165.py
  TIMEBASE_QC_CODE: validation/v165_cpu_autonomous/timebase_qc_v165.py
  TRANSCRIBER: validation/v165_cpu_autonomous/transcribe_v165.py
  STRUCTURAL_QC_CODE: validation/v165_cpu_autonomous/structural_qc_v165.py
  JSON_NATIVE_TEST: validation/v165_cpu_autonomous/test_json_native_v165.py
  TIMEBASE: debug/v165-cpu-autonomous/timebase.json
  TIMEBASE_QC: debug/v165-cpu-autonomous/timebase-qc.json
  OUTPUT: debug/v165-cpu-autonomous/generated.json
  GENERATION_RECEIPT: debug/v165-cpu-autonomous/generation-receipt.json
  STRUCTURAL_QC: debug/v165-cpu-autonomous/structural-qc.json
  TERMINAL_FREEZE: debug/v165-cpu-autonomous/terminal-freeze.json
  CUDA_VISIBLE_DEVICES: ""
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  generate-once:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact one-shot V165 arm
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify V165 one-shot identity and sealed boundaries
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v165-generate.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"

          test "$(git hash-object "$PREREG")" = "1ca5c7b91263c99c0150db085d12f4c0853940b7"
          test "$(git hash-object "$CONTRACT")" = "727782651e14699a0205ea97abc6e82b387299dc"
          test "$(git hash-object "$PRE_RUN")" = "a2acd7839a2ec05ca0be04c4ed38e532b9af3559"
          test "$(git hash-object "$ENV_RECEIPT")" = "84160ae885316450ad59c3dca5bbb9692e4dfdc9"
          test "$(git hash-object "$EVENT_LOGIC")" = "b296b3c322c13f8963f253f9b0666db66766a178"
          test "$(git hash-object "$EVENT_TEST")" = "92bacaa37b4ccc7913309d677eeb88732132376d"
          test "$(git hash-object "$ADAPTER_TEST")" = "b7f92b0c9ade4c76472499999b63414564a68530"
          test "$(git hash-object "$TIMEBASE_BUILDER")" = "62d67becb768e1e5e3e8de1cd3b121eb863b2a18"
          test "$(git hash-object "$TIMEBASE_QC_CODE")" = "3c11a490d24d06647894ee8c3700d9ff7decd993"
          test "$(git hash-object "$TRANSCRIBER")" = "45d595853302b077fbf4f3094e9a4922fba02435"
          test "$(git hash-object "$STRUCTURAL_QC_CODE")" = "36b4738cc7c00fa32aa684b3d395a67d5294a61d"
          test "$(git hash-object "$JSON_NATIVE_TEST")" = "dbff545295c97fe075462efce034f59394b6f1e3"
          test "$(git hash-object "$NEGATIVE_GUARD")" = "6c78189eb72a2017dd1bcdc35330cd14e8b4c274"
          test "$(git hash-object .github/workflows/v165-static-preflight.yml)" = "51d996c28ec0c10c5f7b4658ee50a9479e978fb6"
          test "$(git hash-object .github/workflows/v165-environment-seal.yml)" = "24f4a0631229044e4d8990627b0f38c4f7edce8c"

          for path in "$TIMEBASE" "$TIMEBASE_QC" "$OUTPUT" "$GENERATION_RECEIPT" "$STRUCTURAL_QC" "$TERMINAL_FREEZE"; do
            test ! -e "$path"
          done

          python - <<'PY'
          import json
          from pathlib import Path

          prereg = json.loads(Path("debug/v165-cpu-autonomous/preregistration.json").read_text())
          contract = json.loads(Path("debug/v165-cpu-autonomous/implementation-contract.json").read_text())
          pre = json.loads(Path("debug/v165-cpu-autonomous/pre-run-identity-receipt.json").read_text())
          env = json.loads(Path("debug/v165-cpu-autonomous/environment-receipt.json").read_text())

          assert prereg["version"] == "V165" and prereg["validation"] == "PASS"
          assert prereg["status"] == "PREREGISTERED_BEFORE_NUMERIC_CONTRACT_OR_IMPLEMENTATION_CODE"
          assert contract["version"] == "V165" and contract["validation"] == "PASS"
          assert contract["status"] == "SEALED_BEFORE_IMPLEMENTATION_CODE"
          runtime = contract["runtimeBoundaries"]
          assert runtime["generationMaximum"] == 1
          assert runtime["generationRerunForbidden"] is True
          assert runtime["generationMayReadProfessionalReference"] is False
          assert runtime["generationMayReadFrozenScorer"] is False
          assert runtime["generationMayReadV163Candidate"] is False
          assert runtime["generationMayReadV163Score"] is False
          repair = contract["adapterRepairContract"]
          assert repair["V164ExpectedOccurrenceCount"] == 2
          assert repair["pinnedFrozenSourceActualOccurrenceCount"] == 3
          assert repair["V165RequiredOccurrenceCount"] == 3
          assert repair["allThreeOccurrencesMustBeReplaced"] is True
          assert repair["countCheckedReplacementRequired"] is True
          assert repair["noFallbackToUnboundedReplace"] is True

          assert pre["schema"] == "dadrock.tabs.v165.pre-run-identity-receipt.v1"
          assert pre["version"] == "V165" and pre["validation"] == "PASS"
          assert pre["status"] == "SEALED_AFTER_STATIC_PREFLIGHT_BEFORE_SONG_PROCESSING"
          pins = pre["pinnedGitBlobs"]
          expected_subset = {
              "preregistration": "1ca5c7b91263c99c0150db085d12f4c0853940b7",
              "implementationContract": "727782651e14699a0205ea97abc6e82b387299dc",
              "eventLogic": "b296b3c322c13f8963f253f9b0666db66766a178",
              "timebaseBuilder": "62d67becb768e1e5e3e8de1cd3b121eb863b2a18",
              "timebaseQc": "3c11a490d24d06647894ee8c3700d9ff7decd993",
              "transcriber": "45d595853302b077fbf4f3094e9a4922fba02435",
              "structuralQc": "36b4738cc7c00fa32aa684b3d395a67d5294a61d",
              "negativeRuntimeGuard": "6c78189eb72a2017dd1bcdc35330cd14e8b4c274",
              "staticPreflightWorkflow": "51d996c28ec0c10c5f7b4658ee50a9479e978fb6",
          }
          for key, value in expected_subset.items():
              assert pins[key] == value, key
          for key in (
              "timebaseMustNotExistAtSeal", "timebaseQcReceiptMustNotExistAtSeal",
              "candidateMustNotExistAtSeal", "generationReceiptMustNotExistAtSeal",
              "structuralQcReceiptMustNotExistAtSeal", "terminalFreezeMustNotExistAtSeal",
              "environmentReceiptMustNotExistAtSeal", "generationWorkflowMustNotExistAtSeal",
          ):
              assert pre[key] is True, key
          assert pre["referenceReadAtSeal"] is False
          assert pre["professionalReferencePathsOpenedAtSeal"] == 0
          assert pre["frozenScorerReadAtSeal"] is False
          assert pre["V163CandidateReadAtSeal"] is False
          assert pre["V163ScoreReadAtSeal"] is False
          assert pre["V164RuntimeArtifactReadAtSeal"] is False
          assert pre["songAudioReadAtSeal"] is False
          assert pre["normalizationExecutedAtSeal"] is False
          assert pre["demucsInvokedAtSeal"] is False
          assert pre["pitchInferenceInvokedAtSeal"] is False
          assert pre["gpuUsedAtSeal"] is False
          assert pre["modalUsedAtSeal"] is False

          assert env["schema"] == "dadrock.tabs.v165.cpu-environment-receipt.v1"
          assert env["version"] == "V165" and env["validation"] == "PASS"
          assert env["status"] == "VERIFIED_BEFORE_SONG_PROCESSING"
          assert env["device"] == "cpu"
          assert env["pythonVersion"] == "3.10.21"
          assert env["torchVersion"] == "2.8.0+cpu"
          assert env["torchCudaVersion"] is None
          assert env["cudaAvailable"] is False
          assert env["workflowRunId"] == 33223054612
          assert env["workflowRunNumber"] == 1
          assert env["workflowRunAttempt"] == 1
          assert env["environmentWorkflowGitBlob"] == "24f4a0631229044e4d8990627b0f38c4f7edce8c"
          assert env["preRunIdentityReceiptGitBlob"] == "a2acd7839a2ec05ca0be04c4ed38e532b9af3559"
          assert env["plannedSeparation"] == {"device":"cpu","executedAtSeal":False,"jobs":1,"model":"htdemucs_6s","repeatCount":1,"shifts":1}
          safety = env["safety"]
          for key in (
              "referenceRead", "frozenScorerRead", "V163CandidateRead", "V163ScoreRead",
              "V164RuntimeArtifactRead", "priorGeneratedCandidateRead", "priorScoreRead",
              "referenceGuidedFiltering", "thresholdSweep", "variantSelection", "humanCorrection",
              "songAudioRead", "normalizationExecuted", "demucsExecuted", "pitchInferenceExecuted",
              "cudaGpuUsed", "modalUsed", "mainOrProductionModified",
          ):
              assert safety[key] is False, key
          assert safety["professionalReferencePathsOpened"] == 0
          assert safety["referenceFacingScoreCalls"] == 0
          PY

      - name: Execute sole V165 CPU pipeline
        id: pipeline
        shell: bash
        run: |
          set -u
          mkdir -p debug/v165-cpu-autonomous
          printf '%s\n' "PIPELINE_STARTED" > /tmp/v165-stage
          printf '%s\n' "PIPELINE_UNEXPECTED_FAILURE" > /tmp/v165-outcome

          fail_stage() {
            printf '%s\n' "$1" > /tmp/v165-outcome
            exit 0
          }

          if ! python -m pip install --disable-pip-version-check --upgrade pip; then fail_stage "DEPENDENCY_BOOTSTRAP_FAIL"; fi
          if ! python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0; then fail_stage "TORCH_INSTALL_FAIL"; fi
          if ! python -m pip install --disable-pip-version-check \
            numpy==1.26.4 scipy==1.13.1 soundfile==0.12.1 \
            basic-pitch==0.4.0 demucs==4.1.0 imageio-ffmpeg==0.6.0 librosa==0.11.0; then
            fail_stage "DEPENDENCY_INSTALL_FAIL"
          fi

          if ! python - <<'PY'
          import importlib.metadata as md, json, platform
          from pathlib import Path
          import torch
          env = json.loads(Path("debug/v165-cpu-autonomous/environment-receipt.json").read_text())
          assert platform.python_version() == env["pythonVersion"]
          assert torch.__version__ == env["torchVersion"] == "2.8.0+cpu"
          assert torch.version.cuda is None and env["torchCudaVersion"] is None
          assert torch.cuda.is_available() is False and env["cudaAvailable"] is False
          for package, expected in env["dependencyVersions"].items():
              assert md.version(package) == expected, (package, md.version(package), expected)
          PY
          then fail_stage "CPU_ENVIRONMENT_REPRODUCTION_FAIL"; fi
          printf '%s\n' "DEPENDENCIES_VERIFIED" > /tmp/v165-stage

          if ! git show 74b0f815ff3f66f325220975c410621503de440f:public/gomywayfullaitest.m4a > "$SOURCE_AUDIO"; then
            fail_stage "SOURCE_MATERIALIZATION_FAIL"
          fi
          if ! python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path("/tmp/v165-source.m4a")
          assert p.stat().st_size == 3478611
          assert hashlib.sha256(p.read_bytes()).hexdigest() == "215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f"
          PY
          then fail_stage "SOURCE_IDENTITY_FAIL"; fi
          printf '%s\n' "SOURCE_VERIFIED" > /tmp/v165-stage

          FFMPEG_EXE="$(python - <<'PY'
          import imageio_ffmpeg
          print(imageio_ffmpeg.get_ffmpeg_exe())
          PY
          )"
          if ! "$FFMPEG_EXE" -hide_banner -loglevel error -y \
            -i "$SOURCE_AUDIO" -ar 44100 -ac 2 -c:a pcm_s16le "$NORM_WAV"; then
            fail_stage "NORMALIZATION_FAIL"
          fi
          test -s "$NORM_WAV" || fail_stage "NORMALIZED_MIX_MISSING"
          printf '%s\n' "NORMALIZED_VERIFIED" > /tmp/v165-stage

          if ! python - <<'PY'
          import random
          import numpy as np
          import torch
          from demucs.separate import main
          random.seed(0)
          np.random.seed(0)
          torch.manual_seed(0)
          torch.set_num_threads(1)
          torch.set_num_interop_threads(1)
          torch.use_deterministic_algorithms(True)
          main([
              "-n", "htdemucs_6s", "-d", "cpu", "--shifts", "1", "-j", "1",
              "-o", "/tmp/v165-demucs", "/tmp/v165-normalized.wav",
          ])
          PY
          then fail_stage "DEMUCS_FAIL"; fi
          for stem in guitar bass drums; do
            test -s "$STEM_DIR/$stem.wav" || fail_stage "DEMUCS_STEM_MISSING_${stem^^}"
          done
          printf '%s\n' "DEMUCS_VERIFIED" > /tmp/v165-stage

          set +e
          python "$TIMEBASE_BUILDER" \
            --source-audio "$SOURCE_AUDIO" --mix "$NORM_WAV" \
            --drums "$STEM_DIR/drums.wav" --bass "$STEM_DIR/bass.wav" --guitar "$STEM_DIR/guitar.wav" \
            --preregistration "$PREREG" --implementation-contract "$CONTRACT" --output "$TIMEBASE"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then rm -f "$TIMEBASE"; fail_stage "TIMEBASE_BUILD_FAIL"; fi
          test -s "$TIMEBASE" || fail_stage "TIMEBASE_BUILD_MISSING_ARTIFACT"
          printf '%s\n' "TIMEBASE_BUILT" > /tmp/v165-stage

          set +e
          python "$TIMEBASE_QC_CODE" \
            --timebase "$TIMEBASE" --source-audio "$SOURCE_AUDIO" --mix "$NORM_WAV" \
            --drums "$STEM_DIR/drums.wav" --bass "$STEM_DIR/bass.wav" --guitar "$STEM_DIR/guitar.wav" \
            --preregistration "$PREREG" --implementation-contract "$CONTRACT" --receipt "$TIMEBASE_QC"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || [ ! -s "$TIMEBASE_QC" ]; then
            rm -f "$OUTPUT" "$GENERATION_RECEIPT" "$STRUCTURAL_QC"
            fail_stage "TIMEBASE_QC_FAIL"
          fi
          if ! python - <<'PY'
          import json
          q = json.load(open("debug/v165-cpu-autonomous/timebase-qc.json"))
          assert q["schema"] == "dadrock.tabs.v165.local-evidence-timebase-qc.v1"
          assert q["version"] == "V165"
          assert q["validation"] == "PASS"
          assert q["safety"]["pitchInferenceInvoked"] is False
          assert q["safety"]["referenceRead"] is False
          assert q["safety"]["V163CandidateRead"] is False
          assert q["safety"]["V163ScoreRead"] is False
          assert q["safety"]["gpuUsed"] is False
          PY
          then fail_stage "TIMEBASE_QC_BOUNDARY_FAIL"; fi
          printf '%s\n' "TIMEBASE_QC_PASS" > /tmp/v165-stage

          set +e
          python "$TRANSCRIBER" \
            --mix "$NORM_WAV" --guitar "$STEM_DIR/guitar.wav" --bass "$STEM_DIR/bass.wav" --drums "$STEM_DIR/drums.wav" \
            --timebase "$TIMEBASE" --timebase-qc "$TIMEBASE_QC" \
            --preregistration "$PREREG" --implementation-contract "$CONTRACT" \
            --pre-run-receipt "$PRE_RUN" --environment-receipt "$ENV_RECEIPT" \
            --output "$OUTPUT" --receipt "$GENERATION_RECEIPT"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then rm -f "$OUTPUT" "$GENERATION_RECEIPT"; fail_stage "TRANSCRIBER_FAIL"; fi
          test -s "$OUTPUT" || fail_stage "TRANSCRIBER_MISSING_CANDIDATE"
          test -s "$GENERATION_RECEIPT" || fail_stage "TRANSCRIBER_MISSING_RECEIPT"
          printf '%s\n' "CANDIDATE_CREATED" > /tmp/v165-stage

          set +e
          python "$STRUCTURAL_QC_CODE" \
            --candidate "$OUTPUT" --generation-receipt "$GENERATION_RECEIPT" \
            --timebase "$TIMEBASE" --timebase-qc "$TIMEBASE_QC" \
            --mix "$NORM_WAV" --drums "$STEM_DIR/drums.wav" --guitar "$STEM_DIR/guitar.wav" --bass "$STEM_DIR/bass.wav" \
            --preregistration "$PREREG" --implementation-contract "$CONTRACT" \
            --pre-run-receipt "$PRE_RUN" --environment-receipt "$ENV_RECEIPT" \
            --event-logic "$EVENT_LOGIC" --transcriber "$TRANSCRIBER" \
            --timebase-builder "$TIMEBASE_BUILDER" --timebase-qc-code "$TIMEBASE_QC_CODE" \
            --negative-runtime-guard "$NEGATIVE_GUARD" --receipt "$STRUCTURAL_QC"
          rc=$?
          set -e
          if [ ! -s "$STRUCTURAL_QC" ]; then fail_stage "STRUCTURAL_QC_RUNTIME_FAIL"; fi
          sqc="$(python - <<'PY'
          import json
          print(json.load(open("debug/v165-cpu-autonomous/structural-qc.json"))["validation"])
          PY
          )"
          if [ "$rc" -ne 0 ]; then
            if [ "$sqc" = "FAIL" ]; then printf '%s\n' "STRUCTURAL_QC_FAIL" > /tmp/v165-outcome; exit 0; fi
            fail_stage "STRUCTURAL_QC_RUNTIME_FAIL"
          fi
          [ "$sqc" = "PASS" ] || fail_stage "STRUCTURAL_QC_NONPASS_WITH_ZERO_EXIT"
          printf '%s\n' "STRUCTURAL_QC_PASS" > /tmp/v165-stage
          printf '%s\n' "STRUCTURAL_QC_PASS" > /tmp/v165-outcome

      - name: Freeze terminal V165 state and self-seal
        if: ${{ always() && github.run_number == 1 && github.run_attempt == 1 }}
        shell: bash
        env:
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
        run: |
          set -euo pipefail
          outcome="$(cat /tmp/v165-outcome 2>/dev/null || printf '%s' 'PIPELINE_UNEXPECTED_FAILURE')"
          stage="$(cat /tmp/v165-stage 2>/dev/null || printf '%s' 'UNKNOWN')"
          if [ "$GUARD_OUTCOME" != "success" ]; then outcome="PRE_RUN_GUARD_FAIL"; stage="PRE_RUN_GUARD"; fi

          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"

          OUTCOME="$outcome" STAGE="$stage" python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          paths = {
              "environmentReceipt": Path("debug/v165-cpu-autonomous/environment-receipt.json"),
              "timebase": Path("debug/v165-cpu-autonomous/timebase.json"),
              "timebaseQc": Path("debug/v165-cpu-autonomous/timebase-qc.json"),
              "candidate": Path("debug/v165-cpu-autonomous/generated.json"),
              "generationReceipt": Path("debug/v165-cpu-autonomous/generation-receipt.json"),
              "structuralQc": Path("debug/v165-cpu-autonomous/structural-qc.json"),
          }

          def sha(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def git_blob(path):
              return subprocess.check_output(["git", "hash-object", path], text=True).strip()

          artifacts = {
              name: {
                  "exists": path.is_file(),
                  "sha256": sha(path) if path.is_file() else None,
                  "gitBlob": git_blob(path) if path.is_file() else None,
              }
              for name, path in paths.items()
          }
          outcome = os.environ["OUTCOME"]
          authoritative = outcome == "STRUCTURAL_QC_PASS"
          if outcome in {"STRUCTURAL_QC_PASS", "STRUCTURAL_QC_FAIL"}:
              assert artifacts["candidate"]["exists"] is True
              assert artifacts["generationReceipt"]["exists"] is True
              assert artifacts["structuralQc"]["exists"] is True
          if outcome == "TRANSCRIBER_FAIL":
              assert artifacts["candidate"]["exists"] is False
              assert artifacts["generationReceipt"]["exists"] is False
          freeze = {
              "schema": "dadrock.tabs.v165.terminal-freeze.v1",
              "version": "V165",
              "status": "TERMINAL",
              "outcome": outcome,
              "lastCompletedStage": os.environ["STAGE"],
              "workflowRunId": int(os.environ["GITHUB_RUN_ID"]),
              "workflowRunNumber": int(os.environ["GITHUB_RUN_NUMBER"]),
              "workflowRunAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflowHeadSha": os.environ["GITHUB_SHA"],
              "generationWorkflowGitBlob": git_blob(".github/workflows/v165-generate.yml"),
              "preRunIdentityReceiptGitBlob": "a2acd7839a2ec05ca0be04c4ed38e532b9af3559",
              "environmentReceiptGitBlob": "84160ae885316450ad59c3dca5bbb9692e4dfdc9",
              "candidateAuthoritative": authoritative,
              "professionalReferenceScoringAuthorized": False,
              "neverRearmV165": True,
              "artifacts": artifacts,
              "safety": {
                  "referenceRead": False,
                  "professionalReferencePathsOpened": 0,
                  "referenceFacingScoreCalls": 0,
                  "frozenScorerRead": False,
                  "V163CandidateRead": False,
                  "V163ScoreRead": False,
                  "V164RuntimeArtifactRead": False,
                  "priorGeneratedCandidateRead": False,
                  "priorScoreRead": False,
                  "referenceGuidedFiltering": False,
                  "thresholdSweep": False,
                  "variantSelection": False,
                  "humanCorrection": False,
                  "cudaGpuUsed": False,
                  "modalUsed": False,
                  "mainOrProductionModified": False
              }
          }
          assert freeze["workflowRunNumber"] == 1
          assert freeze["workflowRunAttempt"] == 1
          assert freeze["professionalReferenceScoringAuthorized"] is False
          Path("debug/v165-cpu-autonomous/terminal-freeze.json").write_text(
              json.dumps(freeze, indent=2, sort_keys=True, allow_nan=False) + "\n"
          )
          PY

          rm .github/workflows/v165-generate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- debug/v165-cpu-autonomous .github/workflows/v165-generate.yml
          changed="$(git diff --cached --name-only)"
          test -n "$changed"
          if echo "$changed" | grep -Ev '^debug/v165-cpu-autonomous/(timebase\.json|timebase-qc\.json|generated\.json|generation-receipt\.json|structural-qc\.json|terminal-freeze\.json)$|^\.github/workflows/v165-generate\.yml$'; then
            echo "Unexpected path in V165 terminal freeze commit" >&2
            exit 1
          fi
          case "$outcome" in
            STRUCTURAL_QC_PASS) message="research: freeze sole V165 adapter-repair CPU candidate [skip ci]" ;;
            TIMEBASE_QC_FAIL|TIMEBASE_QC_BOUNDARY_FAIL) message="research: freeze terminal V165 timebase-QC failure [skip ci]" ;;
            STRUCTURAL_QC_FAIL) message="research: freeze terminal V165 structural-QC failure [skip ci]" ;;
            *) message="research: freeze terminal V165 execution failure [skip ci]" ;;
          esac
