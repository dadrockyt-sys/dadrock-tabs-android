name: V148 score checkpoint freeze once

on:
  push:
    paths:
      - '.github/workflows/v148-score-checkpoint-freeze-once.yml'

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0
      - name: Verify frozen identities
        run: |
          set -euo pipefail
          test "$(git hash-object debug/v148-singleton-only/phase-c-scoring-authorization.json)" = "2647f1b985339f80b7b9d09afea3eebe49fdabb0"
          test "$(git hash-object validation/v148_singleton_only/score_once.py)" = "8137734218a722bb12f364ecfea3d1b8e526cc2c"
          test "$(git hash-object debug/v148-singleton-only/candidate/candidate.json)" = "0d3df7336db965dc111fec067d0abe75ea3926cc"
      - name: Append checkpoint and self-seal
        run: |
          set -euo pipefail
          marker='## V148 Phase C one-use Gold calibration score — AUTHORIZED / FROZEN / STOP BEFORE EXECUTION — 2026-08-27 UTC'
          if grep -Fq "$marker" docs/checkpoints/CURRENT_STATE.md; then
            echo 'Checkpoint marker already exists; refusing duplicate append.' >&2
            exit 1
          fi
          echo '' | base64 -d >> docs/checkpoints/CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v148-score-checkpoint-freeze-once.yml
          git add docs/checkpoints/CURRENT_STATE.md
          git commit -m 'docs: checkpoint frozen V148 scoring phase [skip ci]'
          git push origin HEAD:v143-contextual-prune-lobo
