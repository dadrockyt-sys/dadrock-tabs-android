name: Songsterr Fresh Synthetic Hardware Marker Clock Map V1

on:
  workflow_dispatch:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - "scripts/songsterr-fresh/synthetic_hardware_marker_clock_map_v1.py"
      - "scripts/songsterr-fresh/test_synthetic_hardware_marker_clock_map_v1.py"
      - ".github/workflows/songsterr-fresh-synthetic-hardware-marker-clock-map-v1.yml"

jobs:
  synthetic-clock-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen dependency
        run: python -m pip install --disable-pip-version-check "numpy==2.1.3"
      - name: Compile clock-map harness and tests
        run: python -m py_compile scripts/songsterr-fresh/synthetic_hardware_marker_clock_map_v1.py scripts/songsterr-fresh/test_synthetic_hardware_marker_clock_map_v1.py
      - name: Run synthetic contract tests first
        run: python scripts/songsterr-fresh/test_synthetic_hardware_marker_clock_map_v1.py
      - name: Run official frozen synthetic clock-map harness
        run: python scripts/songsterr-fresh/synthetic_hardware_marker_clock_map_v1.py --output synthetic-hardware-marker-clock-map-v1-result.json
      - name: Print frozen clock-map summary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          path = Path("synthetic-hardware-marker-clock-map-v1-result.json")
          result = json.loads(path.read_text())
          print("contract", result["contract"])
          print("algorithmContractId", result["algorithmContractId"])
          print("caseCount", result["caseCount"])
          print("frozenStructuralTimingBoundSeconds", result["frozenStructuralTimingBoundSeconds"])
          for case in result["cases"]:
              transform = case["transform"]
              print(
                  "CASE",
                  case["caseId"],
                  "intercept", transform["interceptSeconds"],
                  "secondsPerTick", transform["secondsPerLoggerTick"],
                  "markerMaxResidual", transform["maxAbsoluteMarkerResidualSeconds"],
                  "markerRmsResidual", transform["rmsMarkerResidualSeconds"],
                  "truthMaxError", case["maxAbsoluteTruthMappingErrorSeconds"],
                  "truthRmsError", case["rmsTruthMappingErrorSeconds"],
                  "within025", case["syntheticTruthWithinFrozen025SecondStructuralBound"],
                  "markerSha", transform["markerInputSha256"],
              )
          print("resultSha256", hashlib.sha256(path.read_bytes()).hexdigest())
          print(json.dumps({
              "basicPitchAuthorized": result["basicPitchAuthorized"],
              "v6Authorized": result["v6Authorized"],
              "correctnessAuthorized": result["correctnessAuthorized"],
              "modelValidationComplete": result["modelValidationComplete"],
              "customerEligibleEvents": result["customerEligibleEvents"],
              "mayAdvanceDelivery": result["mayAdvanceDelivery"],
          }, sort_keys=True))
          PY
      - name: Upload canonical synthetic clock-map result
        uses: actions/upload-artifact@v4
        with:
          name: songsterr-fresh-synthetic-hardware-marker-clock-map-v1
          path: synthetic-hardware-marker-clock-map-v1-result.json
          if-no-files-found: error
          retention-days: 30
