name: Songsterr Purpose-Built Contract Tests

on:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - "scripts/songsterr-fresh/purpose_built_capture_manifest_contract_v1.py"
      - "scripts/songsterr-fresh/test_purpose_built_capture_manifest_contract_v1.py"
      - "scripts/songsterr-fresh/purpose_built_capture_manifest_semantic_guard_v1.py"
      - "scripts/songsterr-fresh/test_purpose_built_capture_manifest_semantic_guard_v1.py"
      - "scripts/songsterr-fresh/purpose_built_capture_preregistration_binding_v1.py"
      - "scripts/songsterr-fresh/test_purpose_built_capture_preregistration_binding_v1.py"
      - "scripts/songsterr-fresh/purpose_built_capture_preregistration_git_proof_v1.py"
      - "scripts/songsterr-fresh/test_purpose_built_capture_preregistration_git_proof_v1.py"
      - "scripts/songsterr-fresh/fixtures/purpose_built_synthetic_capture_plan_v1.json"
      - "scripts/songsterr-fresh/fixtures/purpose_built_synthetic_preregistration_evidence_v1.json"
      - ".github/workflows/songsterr-purpose-built-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run synthetic manifest-contract tests
        run: python3 scripts/songsterr-fresh/test_purpose_built_capture_manifest_contract_v1.py

      - name: Run synthetic semantic-guard tests
        run: python3 scripts/songsterr-fresh/test_purpose_built_capture_manifest_semantic_guard_v1.py

      - name: Run synthetic preregistration-binding tests
        run: python3 scripts/songsterr-fresh/test_purpose_built_capture_preregistration_binding_v1.py

      - name: Run synthetic preregistration Git-proof tests
        run: python3 scripts/songsterr-fresh/test_purpose_built_capture_preregistration_git_proof_v1.py
