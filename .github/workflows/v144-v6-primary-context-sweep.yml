name: V144 V6 Primary Context Sweep

on:
  workflow_dispatch:
  push:
    branches:
      - v144-rhythm-post-holdout-calibration
    paths:
      - debug/v144-rhythm-calibration/run-v6-primary-context-sweep.txt

permissions:
  contents: write
  actions: read

concurrency:
  group: v144-v6-primary-context-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact sweep revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify frozen V6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .v144context debug/v144-rhythm-calibration/v6-attack-gate
          echo 'c1e6389fdf9d7a18adb50407f248673fe494b236889d635a467100adb6070ddf  debug/v144-rhythm-calibration/v6-attack-gate/v6-render-stream.json' | sha256sum -c -

      - name: Download exact authorized V2 evidence artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9548666053/zip" \
            -o .v144context/v2.zip
          echo '5104522aab3e6193c6b06fe3abb807994065f858a945a81070c611fc63707d4f  .v144context/v2.zip' | sha256sum -c -
          unzip -q .v144context/v2.zip -d .v144context/v2
          echo 'a2d451a39391b797e55623bb3c616735a3f1b39648103cb630a9bb1035430951  .v144context/v2/repaired-timing-precision-candidate-product.json' | sha256sum -c -

      - name: Fetch exact consumed calibration source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, hashlib, json, urllib.request
          from pathlib import Path
          expected='18cdb4f8afb49562aac5b600730384636070d6ca8650823e759276a81ee4afc8'
          errors=[]
          for host in ['dqsljvtekg760','d34shlm8p2ums2','d3cqchs6g3b5ew']:
              try:
                  url=f'https://{host}.cloudfront.net/243/7868948/v0-3-2-TvYYK-mMQgzBsDxG/3.json'
                  req=urllib.request.Request(url,headers={'User-Agent':'dadrock-v144-v6-primary-context','Accept':'*/*','Accept-Encoding':'gzip'})
                  with urllib.request.urlopen(req,timeout=30) as r: raw=r.read()
                  if raw[:2]==b'\x1f\x8b': raw=gzip.decompress(raw)
                  obj=json.loads(raw)
                  normalized=(json.dumps(obj,separators=(',',':'))+'\n').encode()
                  digest=hashlib.sha256(normalized).hexdigest()
                  if digest==expected:
                      Path('.v144context/structured-source.json').write_bytes(normalized)
                      break
                  errors.append(f'{host}:sha={digest}')
              except Exception as exc:
                  errors.append(f'{host}:{type(exc).__name__}')
          else:
              raise SystemExit('exact consumed calibration source unavailable: '+';'.join(errors))
          PY

      - name: Run source-only primary context sweep
        shell: bash
        run: |
          set -euo pipefail
          python analyzer/v144_v6_primary_context_sweep.py \
            debug/v144-rhythm-calibration/v6-attack-gate/v6-render-stream.json \
            .v144context/v2/repaired-timing-precision-candidate-product.json \
            .v144context/structured-source.json \
            --output debug/v144-rhythm-calibration/v6-attack-gate/v6-primary-context-sweep.json
          rm -rf .v144context

      - name: Persist aggregate context sweep
        shell: bash
        run: |
          set -euo pipefail
          report='debug/v144-rhythm-calibration/v6-attack-gate/v6-primary-context-sweep.json'
          test -s "$report"
          git add "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record V144 V6 source-only primary context sweep'
          for attempt in 1 2 3 4 5; do
            git fetch origin v144-rhythm-post-holdout-calibration
            if git rebase origin/v144-rhythm-post-holdout-calibration && git push origin HEAD:v144-rhythm-post-holdout-calibration; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
