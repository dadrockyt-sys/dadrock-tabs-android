name: AI Tab End-to-End Contract

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - '.github/workflows/ai-tab-end-to-end-contract.yml'
      - 'analyzer/verify_ai_tab_end_to_end_contract.mjs'
      - 'analyzer/verify_ai_tab_conditioning_v1.mjs'
      - 'analyzer/verify_ai_tab_conditioned_shadow_projection_v1.mjs'
      - 'analyzer/verify_ai_tab_mixture_structure_context_v1.mjs'
      - 'analyzer/verify_ai_tab_dual_context_shadow_fusion_v1.mjs'
      - 'app/ai-tab/**'
      - 'app/api/audio-upload/**'
      - 'app/api/analyze-audio-tab/**'
      - 'app/api/generate-tab-preview/**'
      - 'app/api/generate-tab-pdf/**'
      - 'lib/aiTabConditioningV1.mjs'
      - 'lib/aiTabConditionedShadowProjectionV1.mjs'
      - 'lib/aiTabMixtureStructureContextV1.mjs'
      - 'lib/aiTabDualContextShadowFusionV1.mjs'
      - 'lib/jimmyPaigeAnalysisPayload.js'
      - 'lib/createJimmyPaigeProfessionalPdf.js'

concurrency:
  group: ai-tab-end-to-end-contract
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-end-to-end-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify reference-blind conditioning v1
        run: node analyzer/verify_ai_tab_conditioning_v1.mjs

      - name: Verify reference-blind shadow projection v1
        run: node analyzer/verify_ai_tab_conditioned_shadow_projection_v1.mjs

      - name: Verify reference-blind mixture structure context v1
        run: node analyzer/verify_ai_tab_mixture_structure_context_v1.mjs

      - name: Verify reference-blind dual-context shadow fusion v1
        run: node analyzer/verify_ai_tab_dual_context_shadow_fusion_v1.mjs

      - name: Verify complete AI Tab product wiring
        env:
          AI_TAB_E2E_RESULT_PATH: debug/v143-contextual-prune/ai-tab-end-to-end-contract.json
        run: node analyzer/verify_ai_tab_end_to_end_contract.mjs

      - name: Enforce compact safety evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('debug/v143-contextual-prune/ai-tab-end-to-end-contract.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          if data.get('passed') is not True:
              raise SystemExit('AI Tab end-to-end contract did not pass')
          if data.get('instrumentChoices') != ['lead', 'rhythm', 'bass']:
              raise SystemExit('All three instrument choices are not preserved')
          if data.get('conditioningV1Wired') is not True:
              raise SystemExit('Conditioning V1 is not wired')
          if data.get('conditioningV1ReferenceBlind') is not True:
              raise SystemExit('Conditioning V1 must remain reference-blind')
          if data.get('conditioningV1ReferenceScoreAuthorized') is not False:
              raise SystemExit('Conditioning V1 must not authorize reference scoring')
          if data.get('dualContextProvenanceWired') is not True:
              raise SystemExit('Dual-context provenance is not wired')
          if data.get('conditioningShadowProjectionWired') is not True:
              raise SystemExit('Conditioning shadow projection is not wired')
          if data.get('conditioningShadowProjectionShadowOnly') is not True:
              raise SystemExit('Conditioning shadow projection must remain shadow-only')
          if data.get('conditioningShadowProjectionReferenceBlind') is not True:
              raise SystemExit('Conditioning shadow projection must remain reference-blind')
          if data.get('conditioningShadowProjectionReferenceScoreAuthorized') is not False:
              raise SystemExit('Conditioning shadow projection must not authorize reference scoring')
          if data.get('conditioningShadowProjectionProductionEligible') is not False:
              raise SystemExit('Conditioning shadow projection must not be Production eligible')
          if data.get('conditioningShadowProjectionConsumedByPdf') is not False:
              raise SystemExit('PDF routes must not consume shadow projection')
          if data.get('productPayloadMutatedByShadowProjection') is not False:
              raise SystemExit('Shadow projection must not mutate product payload')
          if data.get('mixtureStructureContextWired') is not True:
              raise SystemExit('Mixture structure context is not wired')
          if data.get('mixtureStructureContextReferenceBlind') is not True:
              raise SystemExit('Mixture structure context must remain reference-blind')
          if data.get('mixtureStructureContextReferenceScoreAuthorized') is not False:
              raise SystemExit('Mixture structure context must not authorize reference scoring')
          if data.get('mixtureStructureContextCarrierBorrowingAllowed') is not False:
              raise SystemExit('Carrier structure borrowing must remain forbidden')
          if data.get('mixtureStructureContextProductionEligible') is not False:
              raise SystemExit('Mixture structure context must not be Production eligible')
          if data.get('mixtureStructureContextObservationConnected') is not False:
              raise SystemExit('Phase 3 full-mixture observation channel must remain disconnected')
          if data.get('mixtureStructureContextConsumedByPdf') is not False:
              raise SystemExit('PDF routes must not consume mixture structure context')
          if data.get('productPayloadMutatedByMixtureContext') is not False:
              raise SystemExit('Mixture context must not mutate product payload')
          if data.get('dualContextShadowFusionWired') is not True:
              raise SystemExit('Dual-context shadow fusion is not wired')
          if data.get('dualContextShadowFusionShadowOnly') is not True:
              raise SystemExit('Dual-context fusion must remain shadow-only')
          if data.get('dualContextShadowFusionReferenceBlind') is not True:
              raise SystemExit('Dual-context fusion must remain reference-blind')
          if data.get('dualContextShadowFusionReferenceScoreAuthorized') is not False:
              raise SystemExit('Dual-context fusion must not authorize reference scoring')
          if data.get('dualContextShadowFusionCarrierBorrowingAllowed') is not False:
              raise SystemExit('Dual-context fusion carrier borrowing must remain forbidden')
          if data.get('dualContextShadowFusionProductionEligible') is not False:
              raise SystemExit('Dual-context fusion must not be Production eligible')
          if data.get('dualContextShadowFusionConsumedByPdf') is not False:
              raise SystemExit('PDF routes must not consume dual-context fusion')
          if data.get('productPayloadMutatedByDualContextFusion') is not False:
              raise SystemExit('Dual-context fusion must not mutate product payload')
          if data.get('leadLegacyPreserved') is not True:
              raise SystemExit('Lead legacy rollback path was not preserved')
          if data.get('bassLegacyPreserved') is not True:
              raise SystemExit('Bass legacy rollback path was not preserved')
          if data.get('rhythmDedicatedV143RouteFailClosed') is not True:
              raise SystemExit('Rhythm V143 routing is not fail-closed')
          if data.get('rhythmStructuredProfessionalRendererFailClosed') is not True:
              raise SystemExit('Rhythm professional renderer is not fail-closed')
          if data.get('missingPlacementManufacturedForLegacy') is not False:
              raise SystemExit('Legacy output must not acquire manufactured product placement')
          if data.get('paymentAttempted') is not False:
              raise SystemExit('Safety failure: payment attempted')
          if data.get('tokenRedeemed') is not False:
              raise SystemExit('Safety failure: token redeemed')
          if data.get('customerEmailSent') is not False:
              raise SystemExit('Safety failure: customer email sent')
          if data.get('vercelDeploymentAttempted') is not False:
              raise SystemExit('Safety failure: Vercel deployment attempted')
          if data.get('productionModified') is not False:
              raise SystemExit('Safety failure: Production modified')
          if data.get('productionPromotionAuthorized') is not False:
              raise SystemExit('Safety failure: Production promotion authorized')

          print('AI TAB END-TO-END CONTRACT PASSED')
          print('conditioningV1ReferenceBlind=true')
          print('shadowProjectionReferenceBlind=true')
          print('mixtureStructureContextReferenceBlind=true')
          print('dualContextShadowFusionReferenceBlind=true')
          print('dualContextShadowFusionProductionEligible=false')
          print('carrierStructureBorrowingAllowed=false')
          print('mixtureObservationConnected=false')
          print('referenceScoreAuthorized=false')
          print('leadLegacyPreserved=true')
          print('bassLegacyPreserved=true')
          print('rhythmV143FailClosed=true')
          print('productionModified=false')
          PY

      - name: Commit compact contract evidence
        shell: bash
        run: |
          set -euo pipefail
          file=debug/v143-contextual-prune/ai-tab-end-to-end-contract.json
          git add -- "$file"

          if git diff --cached --quiet; then
            echo 'End-to-end contract evidence unchanged.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record AI Tab end-to-end contract'
          git fetch origin v143-contextual-prune-lobo
          git rebase origin/v143-contextual-prune-lobo
          git push origin HEAD:v143-contextual-prune-lobo
