name: V154 preserve Lead reference once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v154-preserve-lead-reference-once.yml

permissions:
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 1
      - name: Reassemble validate and preserve Lead reference
        shell: bash
        run: |
          set -euo pipefail
          cat .github/lead-preserve-parts/part*.py > /tmp/preserve_lead.py
          echo "6eed0be50f01910b0c94535169fb06b79644f556eb0f39adfa6c5a3ab525c08a  /tmp/preserve_lead.py" | sha256sum -c -
          python /tmp/preserve_lead.py
      - name: Commit Lead reference and self-seal
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/lead-preserve-parts
          rm .github/workflows/v154-preserve-lead-reference-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/lead-preserve-parts \
                     .github/workflows/v154-preserve-lead-reference-once.yml \
                     research/v154-professional-references/lead-professional-reference-machine-readable.json \
                     research/v154-professional-references/lead-source-set-receipt.json \
                     research/v154-professional-references/lead-professional-reference-provenance.json \
                     docs/checkpoints/CURRENT_STATE.md
          git commit -m "research: preserve professional Lead reference [skip ci]"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
