name: V168 SplitMySong CPU environment smoke

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v168-splitmysong-environment-smoke.yml
      - validation/v168_splitmysong_diagnostic/Dockerfile.cpu
      - validation/v168_splitmysong_diagnostic/requirements-cpu.txt
      - validation/v168_splitmysong_diagnostic/verify_environment_v168.py
      - validation/v168_splitmysong_diagnostic/verify_ffmpeg_normalizer_v168.py
      - validation/v168_splitmysong_diagnostic/prepare_historical_context_v168.py
      - validation/v168_splitmysong_diagnostic/run_historical_context_preflight.sh
      - validation/v168_splitmysong_diagnostic/generate_splitmysong_candidate_v168.py

permissions:
  contents: read

concurrency:
  group: v168-splitmysong-cpu-environment-smoke
  cancel-in-progress: true

jobs:
  build-and-verify:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact smoke-test head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Build exact CPU diagnostic image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file validation/v168_splitmysong_diagnostic/Dockerfile.cpu \
            --tag dadrock-splitmysong-v168-cpu:${GITHUB_SHA} \
            .

      - name: Verify exact FFmpeg 7.1.5 normalizer
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint python \
            dadrock-splitmysong-v168-cpu:${GITHUB_SHA} \
            validation/v168_splitmysong_diagnostic/verify_ffmpeg_normalizer_v168.py \
            --receipt /tmp/ffmpeg-normalizer-smoke-receipt.json

      - name: Verify container remains CPU-only and reference-blind
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint python \
            dadrock-splitmysong-v168-cpu:${GITHUB_SHA} \
            validation/v168_splitmysong_diagnostic/verify_environment_v168.py \
            --repo-root /workspace \
            --receipt /tmp/environment-smoke-receipt.json

      - name: Static-check context and generator code without audio or inference
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint python \
            dadrock-splitmysong-v168-cpu:${GITHUB_SHA} \
            -m py_compile \
            validation/v168_splitmysong_diagnostic/prepare_historical_context_v168.py \
            validation/v168_splitmysong_diagnostic/generate_splitmysong_candidate_v168.py

          docker run --rm \
            --entrypoint bash \
            dadrock-splitmysong-v168-cpu:${GITHUB_SHA} \
            -n validation/v168_splitmysong_diagnostic/run_historical_context_preflight.sh

          docker run --rm \
            --entrypoint python \
            dadrock-splitmysong-v168-cpu:${GITHUB_SHA} \
            validation/v168_splitmysong_diagnostic/prepare_historical_context_v168.py --help \
            > /tmp/context-help.txt
          docker run --rm \
            --entrypoint python \
            dadrock-splitmysong-v168-cpu:${GITHUB_SHA} \
            validation/v168_splitmysong_diagnostic/generate_splitmysong_candidate_v168.py --help \
            > /tmp/generator-help.txt

          if grep -E -- '--(reference|scorer)' /tmp/context-help.txt /tmp/generator-help.txt; then
            echo 'Reference/scorer CLI argument unexpectedly exposed' >&2
            exit 1
          fi

          echo 'STATIC REFERENCE-BLIND GENERATION GUARD PASS'
          echo 'No audio, Basic Pitch inference, candidate generation, scorer, or reference access occurred.'
