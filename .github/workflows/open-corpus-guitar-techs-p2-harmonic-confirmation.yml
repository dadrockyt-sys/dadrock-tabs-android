name: Open corpus Guitar-TECHS P2 harmonic confirmation

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/open-corpus-guitar-techs-p2-harmonic-confirmation.yml
  workflow_dispatch:

jobs:
  p2-confirmation:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install exact P1 CPU analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 soundfile==0.13.1 pretty_midi==0.2.11

      - name: Re-run frozen synthetic self-test
        run: python validation/open_corpus/analyze_guitar_techs_harmonic_octave_v169.py --self-test

      - name: Download and verify independent-player P2 single notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guitar-techs-p2/input" "$RUNNER_TEMP/guitar-techs-p2/output"
          cd "$RUNNER_TEMP/guitar-techs-p2"
          curl -L --fail --retry 3 --retry-delay 3 \
            'https://zenodo.org/records/14963133/files/P2_singlenotes.zip?download=1' \
            -o P2_singlenotes.zip
          echo '40fbf03d8b04bb2cf42df20f36dc2254  P2_singlenotes.zip' | md5sum -c -
          sha256sum P2_singlenotes.zip | tee output/archive-sha256.txt
          unzip -l P2_singlenotes.zip | tee output/archive-listing.txt
          unzip -j P2_singlenotes.zip \
            'P2_singlenotes/midi/midi_allsinglenotes.mid' \
            'P2_singlenotes/audio/directinput/directinput_allsinglenotes.wav' \
            'P2_singlenotes/audio/micamp/micamp_allsinglenotes.wav' \
            -d input

      - name: Run exact frozen P1 harmonic formula on P2
        shell: python
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          import json
          import os
          from pathlib import Path
          import numpy as np
          from validation.open_corpus.analyze_guitar_techs_harmonic_octave_v169 import (
              analyze_capture,
              load_mono_audio,
              load_notes,
          )

          root = Path(os.environ['RUNNER_TEMP']) / 'guitar-techs-p2'
          notes, instruments = load_notes(root / 'input' / 'midi_allsinglenotes.mid')
          report = {
              'schema': 'dadrock.tabs.open-corpus.harmonic-octave-study.v1',
              'dataset': 'Guitar-TECHS',
              'scope': 'P2_singlenotes_CONFIRMATORY_EXACT_P1_FORMULA',
              'formulaSource': 'validation/open_corpus/analyze_guitar_techs_harmonic_octave_v169.py',
              'formulaChangedAfterP1': False,
              'midiNoteCount': len(notes),
              'midiInstruments': instruments,
              'captures': {},
              'v168ReferenceFacingScoreCalls': 0,
              'v168PoliciesModified': False,
              'goatHoldoutSelectionModified': False,
          }
          for name, path in (
              ('directInput', root / 'input' / 'directinput_allsinglenotes.wav'),
              ('micAmp', root / 'input' / 'micamp_allsinglenotes.wav'),
          ):
              audio, sample_rate = load_mono_audio(path)
              summary, _ = analyze_capture(audio, sample_rate, notes)
              report['captures'][name] = summary

          def clean(value):
              if isinstance(value, np.generic):
                  return value.item()
              if isinstance(value, dict):
                  return {str(k): clean(v) for k, v in value.items()}
              if isinstance(value, list):
                  return [clean(v) for v in value]
              if isinstance(value, tuple):
                  return [clean(v) for v in value]
              return value

          report = clean(report)
          output = root / 'output' / 'p2-harmonic-confirmation-report.json'
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2, sort_keys=True))

      - name: Hash P2 aggregate report
        shell: bash
        run: sha256sum "$RUNNER_TEMP/guitar-techs-p2/output/p2-harmonic-confirmation-report.json" | tee "$RUNNER_TEMP/guitar-techs-p2/output/report-sha256.txt"

      - name: Preserve aggregate-only P2 confirmation
        uses: actions/upload-artifact@v4
        with:
          name: guitar-techs-p2-harmonic-confirmation
          path: |
            ${{ runner.temp }}/guitar-techs-p2/output/archive-sha256.txt
            ${{ runner.temp }}/guitar-techs-p2/output/archive-listing.txt
            ${{ runner.temp }}/guitar-techs-p2/output/p2-harmonic-confirmation-report.json
            ${{ runner.temp }}/guitar-techs-p2/output/report-sha256.txt
          retention-days: 30
