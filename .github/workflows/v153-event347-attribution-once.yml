name: V153 event-347 CPU Gold attribution once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v153-event347-attribution-once.yml

permissions:
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo
  SENTINEL: debug/v153-reference-free-strength/phase-d-attribution-attempt-sentinel.json
  OUTPUT: debug/v153-reference-free-strength/phase-d-event347-attribution.json
  CUDA_VISIBLE_DEVICES: ""

jobs:
  attribute-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Guard frozen CPU attribution boundary
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          test ! -e "$SENTINEL"
          test ! -e "$OUTPUT"
          test "$(git hash-object debug/v153-reference-free-strength/phase-d-event347-attribution-preregistration.json)" = "5060106c4bf8646562c35dd9b9586e94550de454"
          test "$(git hash-object validation/v153_reference_free_strength/analyze_event347_gold_attribution.py)" = "d9847158e4e00ea551d004840f105f65e3b134e1"
          test "$(git hash-object debug/v153-reference-free-strength/candidate/candidate.json)" = "975ab36c234b423d1b56e59588e960f7d9d7103f"
          test "$(git hash-object debug/v153-reference-free-strength/phase-c-score/score-result.json)" = "02ee60863f2d55a410083e512a972818c3d7102b"
          test "$(git hash-object validation/rhythm_holdout/score_rhythm_holdout.py)" = "cc4bf61a99f22bf87a6c255e5a81220fbc82223b"
          test "$(git hash-object validation/rhythm_holdout/canonical.py)" = "088d44827fb23e20d9aeeb4944a672989af5846c"
          test "$(git hash-object modal/v147_phase_c_artifact_support.py)" = "f4278ffaacaca3f66baf7a3112e2af0f3bc387cf"

      - name: Consume attribution attempt before Gold access
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path(os.environ['SENTINEL'])
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps({
            'schema':'dadrock.tabs.v153.event347.phase-d-attribution-attempt.v1',
            'status':'CONSUMED_BEFORE_GOLD_ATTRIBUTION',
            'runId':os.environ['RUN_ID'],
            'runHeadSha':os.environ['HEAD_SHA'],
            'consumedAtUtc':datetime.now(timezone.utc).isoformat(),
            'analyzerGitBlob':'d9847158e4e00ea551d004840f105f65e3b134e1',
            'preregistrationGitBlob':'5060106c4bf8646562c35dd9b9586e94550de454',
            'scoreWrapperInvoked':False,
            'scoreCallCount':0,
            'candidateModified':False,
            'modalL4CudaGpuUsed':False
          }, indent=2, sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SENTINEL"
          git commit -m 'debug: consume V153 Phase D attribution attempt [skip ci]'
          git push origin "HEAD:$BRANCH"

      - name: Run frozen CPU Gold attribution
        run: |
          set -euo pipefail
          python validation/v153_reference_free_strength/analyze_event347_gold_attribution.py --output "$OUTPUT" | tee /tmp/v153-phase-d-summary.json

      - name: Verify and persist attribution
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path(os.environ['OUTPUT']).read_text())
          assert r['gate']=='GO_EXPLAINED'
          assert r['eventIndex']==347
          assert r['pitchContentMechanism']['globalMatchedDelta']==-1
          assert r['timingAttribution']['tolerantPitch']['totalDelta']==0
          assert r['timingAttribution']['tolerantPosition']['totalDelta']==0
          assert r['timingAttribution']['grossPitch']['totalDelta']==0
          assert r['onsetAttribution']['pitchSet']['totalDelta']==0
          assert r['onsetAttribution']['voicing']['totalDelta']==0
          assert r['criticalMismatchAttribution']['delta']==0
          assert r['safety']['scoreCallCount']==0
          assert r['safety']['candidateModified'] is False
          assert r['safety']['modalL4CudaGpuUsed'] is False
          PY
          git add "$OUTPUT"
          git commit -m 'debug: persist V153 Phase D event-347 attribution [skip ci]'
          git push origin "HEAD:$BRANCH"

      - name: Upload attribution evidence
        uses: actions/upload-artifact@v4
        with:
          name: v153-event347-attribution-${{ github.run_id }}
          path: |
            debug/v153-reference-free-strength/phase-d-attribution-attempt-sentinel.json
            debug/v153-reference-free-strength/phase-d-event347-attribution.json
          retention-days: 30
