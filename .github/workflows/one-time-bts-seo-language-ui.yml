name: One-time BTS SEO and language UI update

on:
  push:
    branches:
      - backing-track-studio
    paths:
      - '.github/workflows/one-time-bts-seo-language-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backing-track-studio
        uses: actions/checkout@v4
        with:
          ref: backing-track-studio
          fetch-depth: 0

      - name: Update BTS page UI and SEO copy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/bts/page.js')
          text = path.read_text()

          text = text.replace(
              "  Music2,\n  ShieldCheck,\n  Upload,\n",
              "  Music2,\n  Upload,\n",
              1,
          )

          old_import = "import BTSPayPalCheckoutButton from '@/components/BTSPayPalCheckoutButton';\n"
          new_import = old_import + "import LanguageSelector from '@/components/LanguageSelector';\n"
          if "@/components/LanguageSelector" not in text:
              if old_import not in text:
                  raise SystemExit('BTS PayPal import anchor not found')
              text = text.replace(old_import, new_import, 1)

          old_badge = '''          <div className="rounded-full border border-orange-500/30 bg-orange-500/10 px-3 py-1 text-xs font-bold text-orange-300">
            PayPal Sandbox · ${PRICE} USD
          </div>'''
          new_badge = '''          <LanguageSelector />'''
          if old_badge not in text:
              raise SystemExit('Top PayPal sandbox badge not found')
          text = text.replace(old_badge, new_badge, 1)

          old_workflow = '''              <section className="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 text-sm text-zinc-400">
                <div className="flex items-start gap-3">
                  <ShieldCheck className="mt-0.5 h-5 w-5 shrink-0 text-green-400" />
                  <div>
                    <p className="font-bold text-white">
                      Isolated BTS workflow
                    </p>
                    <p className="mt-1 text-xs leading-5">
                      The existing AI Tab payment and analyzer routes are not changed. BTS uses its own upload authorization, $1 sandbox order, and backing-track processor.
                    </p>
                  </div>
                </div>
              </section>

'''
          if old_workflow not in text:
              raise SystemExit('Isolated BTS workflow section not found')
          text = text.replace(old_workflow, '', 1)

          old_ai_copy = '''                    <p className="mt-1 text-xs leading-5">
                      The current BTS prototype uses six-source waveform separation and rebuilds the mix without the stem or stems you selected.
                    </p>'''
          new_ai_copy = '''                    <p className="mt-1 text-xs leading-5">
                      BTS uses six-source waveform separation to rebuild the mix without the guitar or bass stems you select. Because instruments can overlap inside a mastered recording, some bleed or separation artifacts may remain in complex mixes.
                    </p>'''
          if old_ai_copy not in text:
              raise SystemExit('AI removal copy not found')
          text = text.replace(old_ai_copy, new_ai_copy, 1)

          grid_close = '''            </aside>
          </div>
        </section>'''
          seo_block = '''            </aside>
          </div>

          <section
            aria-labelledby="bts-seo-heading"
            className="border-t border-zinc-800 bg-black/20 px-5 py-7 sm:px-8"
          >
            <div className="mx-auto max-w-3xl text-center">
              <h2
                id="bts-seo-heading"
                className="text-xl font-black text-white sm:text-2xl"
              >
                AI Guitar and Bass Backing Track Maker
              </h2>
              <p className="mt-3 text-sm leading-7 text-zinc-400 sm:text-base">
                DadRock Tabs Backing Track Studio is an online AI backing track maker for guitarists, bass players, singers, and musicians who want custom practice tracks from audio they have the right to use. Upload an MP3, WAV, M4A, or AAC file, then remove guitar, remove bass, or remove both guitar and bass with six-source AI stem separation and download the rebuilt mix as an MP3. Use it to practice riffs and solos, rehearse bass lines, play along with classic rock, hard rock, metal, blues, and other music, or hear the rest of an arrangement more clearly while learning a part.
              </p>
            </div>
          </section>
        </section>'''
          if grid_close not in text:
              raise SystemExit('BTS page closing anchor not found')
          text = text.replace(grid_close, seo_block, 1)

          path.write_text(text)
          PY

      - name: Add BTS route metadata
        run: |
          cat > app/bts/layout.js <<'EOF'
          const baseUrl =
            process.env.NEXT_PUBLIC_BASE_URL ||
            'https://dadrocktabs.com';

          export const metadata = {
            title:
              'AI Backing Track Maker – Remove Guitar or Bass | DadRock Tabs',
            description:
              'Create custom guitar and bass backing tracks online. Upload audio, remove guitar, bass, or both with AI stem separation, and download an MP3 for practice.',
            keywords: [
              'backing track maker',
              'AI backing track maker',
              'remove guitar from song',
              'remove bass from song',
              'guitar backing track',
              'bass backing track',
              'AI stem separation',
              'guitar practice tracks',
              'bass practice tracks',
            ],
            alternates: {
              canonical: `${baseUrl}/bts`,
            },
            openGraph: {
              title:
                'AI Backing Track Maker – Remove Guitar or Bass | DadRock Tabs',
              description:
                'Create custom practice tracks by removing guitar, bass, or both with AI stem separation.',
              url: `${baseUrl}/bts`,
              siteName: 'DadRock Tabs',
              type: 'website',
            },
            twitter: {
              card: 'summary_large_image',
              title:
                'AI Backing Track Maker | DadRock Tabs',
              description:
                'Remove guitar, bass, or both from audio and build a custom MP3 practice track with AI stem separation.',
            },
            robots: {
              index: true,
              follow: true,
            },
          };

          export default function BTSLayout({ children }) {
            return children;
          }
          EOF

      - name: Save BTS checkpoint during UI update
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/checkpoints/BACKING_TRACK_STUDIO_CURRENT_STATE.md')
          text = path.read_text()
          marker = '## Continuation note — 2026-08-29 22:18–22:21 UTC\n'
          note = '''## UI / SEO / localization-prep continuation — 2026-08-30 UTC
- User confirmed the live BTS generation flow is working end-to-end and produces a playable/downloadable backing track.
- User also reported audible guitar bleed in the separated result; this is consistent with imperfect source separation in dense/mastered mixes and may help explain some AI Tab transcription difficulty.
- Requested branch-only presentation cleanup: remove the internal "Isolated BTS workflow" box, replace the top-right PayPal sandbox badge with the existing 14-language DadRock selector, add search-focused BTS copy, and prepare route-specific SEO metadata.
- The language selector is being exposed now without enabling locale-prefixed BTS routes yet, preventing duplicate/404 localized pages before translations are ready.

'''
          if note not in text:
              if marker not in text:
                  raise SystemExit('Checkpoint insertion marker not found')
              text = text.replace(marker, note + marker, 1)
          path.write_text(text)
          PY

      - name: Validate BTS contracts and requested UI
        run: |
          node validation/bts/validate_bts_contracts.mjs
          python - <<'PY'
          from pathlib import Path
          page = Path('app/bts/page.js').read_text()
          layout = Path('app/bts/layout.js').read_text()

          checks = {
              'language selector added': "<LanguageSelector />" in page,
              'all 14 language source reused': "@/components/LanguageSelector" in page,
              'top sandbox badge removed': 'PayPal Sandbox · ${PRICE} USD' not in page,
              'internal workflow box removed': 'Isolated BTS workflow' not in page,
              'SEO heading added': 'AI Guitar and Bass Backing Track Maker' in page,
              'SEO intent copy added': 'remove guitar, remove bass, or remove both guitar and bass' in page,
              'bleed expectation added': 'some bleed or separation artifacts may remain' in page,
              'BTS canonical metadata': '`${baseUrl}/bts`' in layout,
              'BTS metadata title': 'AI Backing Track Maker' in layout,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('PASS ' if ok else 'FAIL ') + name)
          if failed:
              raise SystemExit('UI validation failed: ' + ', '.join(failed))
          PY

      - name: Commit BTS UI and SEO update
        run: |
          rm .github/workflows/one-time-bts-seo-language-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/bts/page.js app/bts/layout.js docs/checkpoints/BACKING_TRACK_STUDIO_CURRENT_STATE.md .github/workflows/one-time-bts-seo-language-ui.yml
          git commit -m 'Polish BTS SEO and language-ready UI'
          git push origin backing-track-studio
