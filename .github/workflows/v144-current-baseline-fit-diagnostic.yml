name: V144 Rhythm Current-Baseline Fit Diagnostic

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v144-current-baseline-fit-diagnostic.yml

permissions:
  contents: write

concurrency:
  group: v144-rhythm-current-baseline-fit-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: "${{ github.event.head_commit.message == 'v144 execute current baseline fit diagnostic' }}"
    name: Diagnose current accepted baseline on CPU
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify immutable identities and diagnostic implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          test "$(git hash-object debug/v143-contextual-prune/v5-professional-pdf/final-professional-holdout-result.json)" = "511fd244f231b66d08306f97b5a47ed41f5415c7"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json | awk '{print $1}')" = "7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2"
          test "$(sha256sum debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json | awk '{print $1}')" = "18fd868ae960dfcdd1ffb0110f1a9dfd8acc2ffeb46e247d1116cd54291526ac"
          test "$(git hash-object debug/v144-rhythm-calibration/selected/v144-pitch-shift-selected-baseline.json)" = "ee86c40d68e5c5b8e85bc4d008d9713c35e37a6c"
          test "$(git hash-object validation/v144_rhythm_calibration/analyze_current_baseline_fit_mechanisms.py)" = "4a82232f8c7fe65be137b6627f553f7aa3416a31"
          test "$(git hash-object modal/tests/test_v144_rhythm_current_baseline_fit_mechanisms.py)" = "85e2e69a013dc96584118e82749a1ba08251ad4e"
          python -m py_compile validation/v144_rhythm_calibration/analyze_current_baseline_fit_mechanisms.py
          python modal/tests/test_v144_rhythm_current_baseline_fit_mechanisms.py -v

      - name: Run current-baseline fit-only mechanism diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python validation/v144_rhythm_calibration/analyze_current_baseline_fit_mechanisms.py \
            debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json \
            debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json \
            debug/v144-rhythm-calibration/selected/v144-pitch-shift-selected-baseline.json \
            modal/configs/v144_rhythm_context_split_config.json \
            debug/v144-rhythm-calibration/baseline/v144-current-baseline-fit-mechanisms.json \
            > /tmp/v144-current-baseline-fit-mechanisms.log

      - name: Verify diagnostic isolation and accounting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('debug/v144-rhythm-calibration/baseline/v144-current-baseline-fit-mechanisms.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          assert report['classification'] == 'v144-rhythm-current-baseline-fit-error-mechanisms'
          assert report['evaluationRole'] == 'gold-calibration-fit-only-current-baseline-mechanism-diagnostic'
          assert report['mayClaimUnseenGeneralization'] is False
          assert report['candidateConstructionPerformed'] is False
          assert report['candidateRankingPerformed'] is False
          assert report['candidateSelectionPerformed'] is False
          assert report['validationLabelsUsedForDiagnostic'] is False
          assert report['canaryLabelsUsedForDiagnostic'] is False

          baseline = report['baseline']
          assert baseline['name'] == 'pitch-shift-41b7a7470fa3245a'
          assert baseline['eventCount'] == 1144
          assert baseline['eventSha256'] == 'b6e1f8a8be150943d7224c74f9193b1b4050454620063846f6f5f5c773d4cbf6'
          assert baseline['generatedMeasureCount'] == 113
          assert baseline['baselineGeneratedMeasureSetPreserved'] is True
          assert baseline['reconstructionChain'][0]['outputEventSha256'] == '68b8cdf14ed02265c5e3c204b2af51b0aae4849462e7b3e4243192d8855cc3c3'
          assert baseline['reconstructionChain'][1]['outputEventSha256'] == 'b6e1f8a8be150943d7224c74f9193b1b4050454620063846f6f5f5c773d4cbf6'

          fit = report['fit']
          assert fit['generatedNoteCount'] == 643
          assert fit['referenceNoteCount'] == 594
          mechanisms = report['mechanisms']
          assert mechanisms['pitchContentFalsePositiveNotes'] == fit['generatedNoteCount'] - fit['pitchContentMatchedNotes']
          assert mechanisms['pitchContentFalseNegativeNotes'] == fit['referenceNoteCount'] - fit['pitchContentMatchedNotes']
          assert mechanisms['grossUnmatchedGeneratedNotes'] == fit['generatedNoteCount'] - fit['grossPitchTimingMatchedNotes']
          assert mechanisms['grossUnmatchedReferenceNotes'] == fit['referenceNoteCount'] - fit['grossPitchTimingMatchedNotes']
          assert mechanisms['correctPitchTimingButWrongStringFret'] == fit['tightPitchTimingMatchedNotes'] - fit['exactStringFretTimingMatchedNotes']

          signals = report['nextFamilyShapeSignals']
          assert signals['timingOpportunityExistingPitchMatches'] == fit['pitchContentMatchedNotes'] - fit['tightPitchTimingMatchedNotes']
          assert signals['positionOpportunityWithinTightPitchMatches'] == fit['tightPitchTimingMatchedNotes'] - fit['exactStringFretTimingMatchedNotes']
          assert signals['sameOnsetPitchSubstitutionOpportunity'] == mechanisms['sameOnsetWrongPitchSubstitutionSlots']
          assert signals['diagnosticOnly'] is True

          boundary = report['constructionBoundary']
          assert boundary['currentBaselineFitLabelsMayInformNextFamilyShape'] is True
          assert boundary['validationLabelsMayInformNextFamilyShape'] is False
          assert boundary['canaryLabelsMayInformNextFamilyShape'] is False
          assert boundary['consumedPitchShiftFamilyMayBeReplayedOrRetuned'] is False
          assert boundary['runtimeReferenceInputAllowed'] is False
          assert boundary['fixedSelectorThresholdsMayBeChangedFromThisDiagnostic'] is False
          assert boundary['nextFamilyMustBeMateriallyNewAndPreRegistered'] is True
          assert report['safety']['v5Modified'] is False
          assert report['safety']['mainModified'] is False
          assert report['safety']['productionModified'] is False
          assert report['safety']['runtimeReferenceInputUsed'] is False
          assert report['safety']['modalGpuInvoked'] is False
          PY

      - name: Reverify immutable identities after diagnostic
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          test "$(git hash-object debug/v143-contextual-prune/v5-professional-pdf/final-professional-holdout-result.json)" = "511fd244f231b66d08306f97b5a47ed41f5415c7"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json | awk '{print $1}')" = "7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2"
          test "$(git hash-object debug/v144-rhythm-calibration/selected/v144-pitch-shift-selected-baseline.json)" = "ee86c40d68e5c5b8e85bc4d008d9713c35e37a6c"

      - name: Persist only current-baseline fit diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          report='debug/v144-rhythm-calibration/baseline/v144-current-baseline-fit-mechanisms.json'
          git add "$report"
          test "$(git diff --cached --name-only)" = "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Persist V144 current-baseline fit mechanism diagnostic'
          for attempt in 1 2 3 4 5; do
            git fetch origin v143-contextual-prune-lobo
            if git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
