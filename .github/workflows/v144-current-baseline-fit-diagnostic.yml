name: V144 Rhythm Current-Baseline Fit Diagnostic — Archived

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    name: Refuse replay of completed current-baseline fit diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: Refuse replay
        shell: bash
        run: |
          echo 'The V144 current-baseline fit diagnostic has been completed and archived.' >&2
          exit 1
