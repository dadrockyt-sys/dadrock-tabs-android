name: V143 professional PDF fixture

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - '.github/workflows/v143-professional-pdf-fixture.yml'
      - 'lib/createV143RhythmPdf.js'
      - 'lib/v143RenderContract.js'
      - 'scripts/v143-professional-pdf-fixture.mjs'
      - 'public/DadRock-Tabs-Logo.png'
      - 'package.json'
      - 'yarn.lock'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 1
      - name: Reverify protected runtime identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = '7f72f8ed9b14af8bc93e95544195204d99c6bec1'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Render professional fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug/v143-contextual-prune/professional-pdf-render
          node --experimental-default-type=module scripts/v143-professional-pdf-fixture.mjs \
            debug/v143-contextual-prune/professional-pdf-render/fixture.pdf
          pdfinfo debug/v143-contextual-prune/professional-pdf-render/fixture.pdf
          pdftoppm -png -f 1 -singlefile -r 150 \
            debug/v143-contextual-prune/professional-pdf-render/fixture.pdf \
            debug/v143-contextual-prune/professional-pdf-render/page-1
          sha256sum debug/v143-contextual-prune/professional-pdf-render/fixture.pdf \
            debug/v143-contextual-prune/professional-pdf-render/page-1.png
      - name: Persist rendered fixture for visual inspection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/v143-contextual-prune/professional-pdf-render/fixture.pdf \
            debug/v143-contextual-prune/professional-pdf-render/page-1.png
          if ! git diff --cached --quiet; then
            git commit -m 'Persist professional V143 PDF fixture'
            git push origin HEAD:v143-contextual-prune-lobo
          fi
      - name: Upload fixture
        uses: actions/upload-artifact@v4
        with:
          name: v143-professional-pdf-fixture
          path: debug/v143-contextual-prune/professional-pdf-render/
          retention-days: 1
