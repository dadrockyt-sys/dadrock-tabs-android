# staged docs checkpoint append 2026-08-27
name: V152 handoff checkpoint v2
on:
  push:
    paths:
      - .github/workflows/v152-handoff-checkpoint-v2.yml
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0
      - name: Append handoff
        run: |
          set -euo pipefail
          grep -Fq '## V152 Phase C three-note active-recurrence Gold score — COMPLETE / SEALED — 2026-08-27 UTC' docs/checkpoints/CURRENT_STATE.md
          grep -Fq 'Critical mismatches **1712**; delta vs accepted baseline **+0**' docs/checkpoints/CURRENT_STATE.md
          ! grep -Fq '## FRESH-CHAT HANDOFF — V152 SEALED / NEXT TARGET V153 NOT STARTED — 2026-08-27 UTC' docs/checkpoints/CURRENT_STATE.md
          test -f docs/checkpoints/V152_HANDOFF_APPEND.md
          cat docs/checkpoints/V152_HANDOFF_APPEND.md >> docs/checkpoints/CURRENT_STATE.md
      - name: Commit and seal
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v152-handoff-checkpoint-v2.yml
          git rm -f --ignore-unmatch .github/workflows/v152-fresh-chat-handoff-once.yml
          git rm -f --ignore-unmatch debug/v152-fresh-chat-handoff.md
          git rm docs/checkpoints/V152_HANDOFF_APPEND.md
          git add docs/checkpoints/CURRENT_STATE.md
          git commit -m 'docs: save V152 handoff and V153 next steps [skip ci]'
          git push origin HEAD:v143-contextual-prune-lobo
