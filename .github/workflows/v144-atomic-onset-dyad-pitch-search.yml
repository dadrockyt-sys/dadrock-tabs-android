name: V144 Rhythm Atomic Onset Dyad Pitch One-Shot — Archived

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    name: Refuse replay of consumed atomic onset dyad pitch calibration search
    runs-on: ubuntu-latest
    steps:
      - name: Refuse replay
        run: |
          echo "This one-shot atomic onset dyad pitch calibration search is consumed and may not be replayed."
          exit 1
