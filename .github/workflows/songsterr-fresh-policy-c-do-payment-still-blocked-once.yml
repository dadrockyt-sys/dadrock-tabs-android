name: Songsterr Fresh Policy C DigitalOcean Billing Recheck Once

on:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-policy-c-do-payment-still-blocked-once.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: songsterr-fresh-pipeline-v1
          fetch-depth: 0
      - name: Record billing retry and cost strategy
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          p = Path('docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md')
          t = p.read_text(encoding='utf-8')
          old = '- Current external blocker: DigitalOcean provisioning remains blocked at account billing setup. A fresh retry at 2026-09-10 22:15 America/Toronto again returned HTTP 403 with `You need to provide a payment method before trying to create resources under your account` while creating the authority SSH key. The API currently reports account balance/usage `0.00`, an empty Droplet list, and account status `warning` with a conflicting maximum-Droplets message. No Droplet, DigitalOcean SSH key, Policy C probe, or canary was created. The intended first authority host when unblocked is Toronto `tor1`, Intel 4 vCPU / 8 GB size `s-4vcpu-8gb-intel` (listed at $56/month at this check). After billing is enabled, provision that persistent Linux x64 host, register it as the sole `songsterr-fresh-authority-v1` runner, build the dedicated venv, and run `mode=probe`.\n'
          new = '- Current external blocker: DigitalOcean provisioning remains blocked at account billing setup even after the user reported adding a payment method. A fresh resource-creation retry returned HTTP 403 with `You need to provide a payment method before trying to create resources under your account` while creating the authority SSH key. The connected API context is team `My Team`; balance/usage are `0.00`, billing history/invoices are empty, Droplet list is empty, and account status still reports `warning` with a conflicting maximum-Droplets message. No Droplet, DigitalOcean SSH key, Policy C probe, canary, or billable resource was created. Cost strategy is now the least expensive configuration that still meets the established authority runbook minimum: Toronto `tor1`, Ubuntu 22.04 x64, standard shared-CPU 4 vCPU / 8 GB size `s-4vcpu-8gb` (listed at $48/month), rather than the $56 Intel-specific variant. Policy C fingerprints the actual enrolled CPU/toolchain and fails closed on drift. After billing is active for this connected team, provision that persistent host, bootstrap the dedicated venv, register it as the sole `songsterr-fresh-authority-v1` runner, and run `mode=probe`.\n'
          if old not in t:
              raise SystemExit('CURRENT_EXTERNAL_BLOCKER_MARKER_CHANGED')
          t = t.replace(old, new, 1)
          lines = t.splitlines()
          stamp = datetime.now(ZoneInfo('America/Toronto')).strftime('%Y-%m-%d %H:%M America/Toronto')
          for i, line in enumerate(lines):
              if line.startswith('Updated: '):
                  lines[i] = f'Updated: {stamp}'
                  break
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Commit checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dadrockyt-sys'
          git config user.email 'Stephen.s.mcnally@gmail.com'
          git add docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md
          git commit -m 'docs: record DigitalOcean billing retry and cost strategy'
          git push origin HEAD:songsterr-fresh-pipeline-v1
