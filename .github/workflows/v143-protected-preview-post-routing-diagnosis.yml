name: V143 Protected Preview POST Routing Diagnosis

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - '.github/workflows/v143-protected-preview-post-routing-diagnosis.yml'

permissions:
  contents: read

jobs:
  protected-preview-post-routing-diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PREVIEW_URL: https://dadrock-tabs-android-bx51iz9tr-stephen-mcnally-s-projects.vercel.app
      PREVIEW_GIT_BRANCH: v143-contextual-prune-lobo
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_qJrw8Cuze5bCEg9M3Q67XMWt
      VERCEL_PROJECT_ID: prj_6biwsn0iHci6FHNswAUCS8UYrAqF
      VERCEL_TELEMETRY_DISABLED: '1'

    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npm install --global vercel@59.11.2 >/dev/null
          test "$(vercel --version | tail -n 1)" = '59.11.2'

      - name: Prove malformed POST reaches Next route through authenticated Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(
            vercel curl /api/analyze-audio-tab \
              --deployment "$PREVIEW_URL" \
              -- \
              --silent --show-error --max-time 30 \
              --request POST \
              --header 'Content-Type: application/json' \
              --data-binary '{"transcriptionType":"invalid"}' \
              --output response.json \
              --write-out '%{http_code}'
          )"
          echo "malformedPostStatus=$STATUS"
          test "$STATUS" = "400"
          python3 - <<'PY'
          import json
          data = json.load(open('response.json', encoding='utf-8'))
          assert data.get('error') == 'Transcription type must be lead, rhythm, or bass.'
          print('nextRouteReached=true')
          print('analyzerCallPossible=false')
          print('modelBearingStartRequestCount=0')
          print('audioUrlSupplied=false')
          print('referenceFacingInputs=0')
          PY
          rm -f response.json

      - name: Probe V143 runtime analyzer config with fake status token and no audio
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(
            vercel curl /api/analyze-audio-tab \
              --deployment "$PREVIEW_URL" \
              -- \
              --silent --show-error --max-time 30 \
              --request POST \
              --header 'Content-Type: application/json' \
              --data-binary '{"operation":"status","transcriptionType":"rhythm","jobToken":"v143a1.fake-runtime-config-probe"}' \
              --output status-response.json \
              --write-out '%{http_code}'
          )"
          echo "runtimeConfigProbeStatus=$STATUS"
          PROBE_STATUS="$STATUS" python3 - <<'PY'
          import json, os
          from pathlib import Path

          path = Path('status-response.json')
          data = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          error = str(data.get('error') or data.get('detail') or '')
          status = int(os.environ['PROBE_STATUS'])

          if status == 503 and error == 'The audio analyzer is not configured.':
              classification = 'route_runtime_config_missing'
          elif status in (400, 401, 403, 404, 409, 410, 422, 502):
              classification = 'route_config_gate_passed_or_bridge_response'
          elif status >= 500:
              classification = 'route_config_nonempty_but_request_failed_before_bounded_bridge_response'
          else:
              classification = 'unexpected_status'

          print(f'runtimeConfigProbeClass={classification}')
          print('modelBearingStartRequestCount=0')
          print('audioUrlSupplied=false')
          print('analyzerStartOperationSent=false')
          print('workerSpawnPossible=false')
          print('referenceFacingInputs=0')
          print('secretValuesPrinted=false')
          PY
          rm -f status-response.json

      - name: Prove Blob runtime config with invalid-audio fail-fast start
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(
            vercel curl /api/analyze-audio-tab \
              --deployment "$PREVIEW_URL" \
              -- \
              --silent --show-error --max-time 30 \
              --request POST \
              --header 'Content-Type: application/json' \
              --data-binary '{"operation":"start","audioUrl":"INVALID-NO-AUDIO","pathname":"invalid-no-audio.m4a","song":"Runtime Config Probe","artist":"DadRock Diagnostic","transcriptionType":"rhythm"}' \
              --output blob-probe-response.json \
              --write-out '%{http_code}'
          )"
          echo "blobRuntimeProbeStatus=$STATUS"
          PROBE_STATUS="$STATUS" python3 - <<'PY'
          import json, os
          from pathlib import Path

          path = Path('blob-probe-response.json')
          data = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          error = str(data.get('error') or data.get('detail') or '')
          status = int(os.environ['PROBE_STATUS'])

          if status == 503 and error == 'The audio analyzer is not configured.':
              classification = 'route_blob_or_analyzer_config_missing'
          elif status == 400 and error == 'A valid audioUrl is required.':
              classification = 'all_route_runtime_config_present_bridge_fail_fast_green'
          else:
              classification = 'unexpected_fail_fast_response'

          print(f'blobRuntimeProbeClass={classification}')
          print('realAudioUrlSupplied=false')
          print('audioRead=false')
          print('jobIdCreated=false')
          print('workerSpawnPossible=false')
          print('modelBearingStartRequestCount=0')
          print('referenceFacingInputs=0')
          print('secretValuesPrinted=false')

          if classification == 'unexpected_fail_fast_response':
              raise SystemExit(2)
          PY
          rm -f blob-probe-response.json

      - name: Classify critical pulled Preview env without printing values
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel
          vercel pull \
            --yes \
            --environment=preview \
            --git-branch="$PREVIEW_GIT_BRANCH" \
            >/dev/null

          python3 - <<'PY'
          from pathlib import Path

          env_path = Path('.vercel/.env.preview.local')
          if not env_path.exists():
              raise SystemExit('Preview env file was not created by vercel pull.')

          values = {}
          for raw in env_path.read_text(encoding='utf-8', errors='replace').splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              key = key.strip()
              value = value.strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in ('"', "'"):
                  value = value[1:-1]
              values[key] = value

          keys = (
              'ANALYZER_API_URL_V143',
              'ANALYZER_API_TOKEN',
              'BLOB_READ_WRITE_TOKEN',
          )
          bad = False
          for key in keys:
              value = values.get(key)
              if value is None or value == '':
                  classification = 'missing'
                  bad = True
              elif value == '[SENSITIVE]':
                  classification = 'sensitive_placeholder'
                  bad = True
              else:
                  classification = 'present'
              print(f'{key}={classification}')
          print('secretValuesPrinted=false')
          print('modelBearingStartRequestCount=0')
          print('audioUrlSupplied=false')
          print('analyzerCallPossible=false')
          raise SystemExit(1 if bad else 0)
          PY

      - name: Delete pulled Preview env from runner
        if: always()
        shell: bash
        run: rm -rf .vercel
