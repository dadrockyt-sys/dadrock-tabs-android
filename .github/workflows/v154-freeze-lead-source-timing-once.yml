name: V154 freeze Lead source timing once

on:
  push:
    branches: [v143-contextual-prune-lobo]
    paths: [.github/workflows/v154-freeze-lead-source-timing-once.yml]

permissions:
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 1
      - name: Freeze candidate-blind Lead source timing
        run: python validation/v154_cpu_multitrack/freeze_lead_source_timing.py
      - name: Commit Lead source timing and self-seal
        run: |
          set -euo pipefail
          rm .github/workflows/v154-freeze-lead-source-timing-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/v154-professional-references/lead-source-local-attack-timing.json \
                  research/v154-professional-references/lead-source-local-attack-timing-receipt.json \
                  .github/workflows/v154-freeze-lead-source-timing-once.yml
          git commit -m "research: freeze Lead source-local attack timing [skip ci]"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
