name: V143 Current Rhythm Debug Status

on:
  workflow_dispatch:
  push:
    branches: [v143-contextual-prune-lobo]
    paths: [.github/workflows/v143-current-debug-status.yml]

permissions:
  actions: read
  contents: write

jobs:
  status:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Capture current workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug/v143-contextual-prune
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          names=[
            'v143-reference-free-beat-grid-repair.yml',
            'v143-contextual-prune-precision-shadow-proof.yml',
            'v143-contextual-prune-precision-shadow-approved-audio.yml',
          ]
          out={'schemaVersion':1,'workflows':{},'productionModified':False}
          for name in names:
            url=f'https://api.github.com/repos/${{ github.repository }}/actions/workflows/{name}/runs?branch=v143-contextual-prune-lobo&per_page=5'
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'dadrock-v143-status'})
            with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
            out['workflows'][name]=[
              {'id':x.get('id'),'status':x.get('status'),'conclusion':x.get('conclusion'),'headSha':x.get('head_sha'),'runNumber':x.get('run_number'),'runAttempt':x.get('run_attempt'),'createdAt':x.get('created_at'),'updatedAt':x.get('updated_at')}
              for x in (data.get('workflow_runs') or [])
            ]
          Path('debug/v143-contextual-prune/current-debug-workflow-status.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
          git add debug/v143-contextual-prune/current-debug-workflow-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record current Rhythm debug workflow status'
          for attempt in 1 2 3 4; do
            git fetch origin v143-contextual-prune-lobo
            git rebase origin/v143-contextual-prune-lobo
            if git push origin HEAD:v143-contextual-prune-lobo; then exit 0; fi
            sleep 2
          done
          exit 1
