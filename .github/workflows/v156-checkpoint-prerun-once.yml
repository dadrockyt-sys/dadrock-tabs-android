        run: |
          set -euo pipefail
          rm .github/workflows/v156-checkpoint-prerun-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/checkpoints/CURRENT_STATE.md .github/workflows/v156-checkpoint-prerun-once.yml
