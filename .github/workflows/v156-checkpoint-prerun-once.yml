name: V156 checkpoint pre-run boundary once

on:
  push:
    branches: [v143-contextual-prune-lobo]
    paths:
      - .github/workflows/v156-checkpoint-prerun-once.yml

permissions:
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 1
      - name: Append sealed V156 pre-run state
        shell: bash
        run: |
          cat >> docs/checkpoints/CURRENT_STATE.md <<'EOF'

