name: V145 Rhythm Sequence Decoder CPU Proof

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v145-rhythm-sequence-decoder-cpu-proof.yml

permissions:
  contents: write

concurrency:
  group: v145-rhythm-sequence-decoder-cpu-proof
  cancel-in-progress: false

jobs:
  cpu-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen Stage1 and Stage2 identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object modal/v145_rhythm_decoder.py)" = "2fd979aebb4685e86c7f24a0162f69de306c06e9"
          test "$(git hash-object modal/v145_rhythm_sequence_decoder.py)" = "5f86f57d0fd10774690d50528d51bad6e0392bf3"
          test "$(git hash-object modal/tests/test_v145_rhythm_sequence_decoder.py)" = "b16b8d2060e1ea3b47225f1c7c6072cb260c0db8"
          test -f docs/v145-rhythm-decoder-stage2-preregistration.md
          grep -Fq 'No Modal/L4/GPU/live-audio run.' docs/v145-rhythm-decoder-stage2-preregistration.md
          ! grep -Eq '^[[:space:]]*(from[[:space:]]+modal|import[[:space:]]+modal)' modal/v145_rhythm_sequence_decoder.py

      - name: Compile Stage1 Stage2 and tests
        run: |
          python -m py_compile modal/v145_rhythm_decoder.py modal/v145_rhythm_sequence_decoder.py modal/tests/test_v145_rhythm_sequence_decoder.py

      - name: Run exact Stage2 CPU contract tests
        run: |
          python -m unittest modal.tests.test_v145_rhythm_sequence_decoder -v

      - name: Persist Stage2 CPU proof
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          JOB: ${{ github.job }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p debug/v145-rhythm-decoder/proofs
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          proof = {
              "schemaVersion": 14502,
              "proofType": "v145-rhythm-sequence-decoder-cpu-stage2",
              "branch": "v143-contextual-prune-lobo",
              "workflowRunId": int(os.environ["RUN_ID"]),
              "workflowJob": os.environ["JOB"],
              "workflowHeadSha": os.environ["HEAD_SHA"],
              "stage1Blob": "2fd979aebb4685e86c7f24a0162f69de306c06e9",
              "stage2Blob": "5f86f57d0fd10774690d50528d51bad6e0392bf3",
              "stage2TestBlob": "b16b8d2060e1ea3b47225f1c7c6072cb260c0db8",
              "stage2PreregistrationCommit": "9fe0396fc1c320e3da5f5955d823df615a787603",
              "cpuContractTestsPassed": True,
              "runtimeReferenceInput": False,
              "goldInputUsed": False,
              "fitLabelsRead": False,
              "validationLabelsRead": False,
              "canaryLabelsRead": False,
              "newPitchGeneration": False,
              "modalDependency": False,
              "modalGpuUsed": False,
              "liveAudioBenchmarkRun": False,
              "acceptedBaselineChanged": False,
          }
          Path("debug/v145-rhythm-decoder/proofs/cpu-stage2-proof.json").write_text(
              json.dumps(proof, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/v145-rhythm-decoder/proofs/cpu-stage2-proof.json
          git commit -m "v145 persist stage2 timing sequence cpu proof"
          git push origin HEAD:v143-contextual-prune-lobo
