name: V144 Rhythm Contextual Pitch+Step One-Shot — Archived

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    name: Refuse replay of consumed contextual pitch-step calibration search
    runs-on: ubuntu-latest
    steps:
      - name: Refuse replay
        run: |
          echo "This one-shot joint pitch-step calibration search is consumed and may not be replayed."
          exit 1
