name: Astra independent real-development acquisition probe V1

on:
  push:
    branches: [astra-work]
    paths:
      - 'docs/astra/INDEPENDENT_REAL_DEVELOPMENT_ACQUISITION_PROBE_LAUNCH_V1.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'

      - name: Verify bounded launch
        run: |
          python - <<'PY'
          import json,os
          x=json.load(open('docs/astra/INDEPENDENT_REAL_DEVELOPMENT_ACQUISITION_PROBE_LAUNCH_V1.json'))
          assert x['schema']=='astra-independent-real-development-acquisition-probe-launch-v1'
          assert x['status']=='armed'
          assert x['candidateId']=='P01'
          assert x['sourceUrl']=='https://pixabay.com/sound-effects/musical-guitar-riff-in-e-minor-95-bpm-dry-475013/'
          assert x['modelInference'] is False
          assert x['optimizerSteps']==0
          assert x['p1Access'] is False and x['p2Access'] is False and x['p3Access'] is False
          assert int(os.environ.get('GITHUB_RUN_ATTEMPT','1'))==1
          PY

      - name: Install browser runtime
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.55.0' 'mutagen==1.47.0'
          python -m playwright install --with-deps chromium

      - name: Acquire one frozen public web candidate
        run: |
          python astra_backend/synthetic/independent_real_development_acquisition_probe_v1.py \
            --source-url 'https://pixabay.com/sound-effects/musical-guitar-riff-in-e-minor-95-bpm-dry-475013/' \
            --out-dir /tmp/astra-realdev-probe
          python - <<'PY'
          import json,glob
          from mutagen.mp3 import MP3
          p=glob.glob('/tmp/astra-realdev-probe/*.mp3')
          assert len(p)==1,p
          d=float(MP3(p[0]).info.length)
          assert 4.0 <= d <= 10.5,d
          r=json.load(open('/tmp/astra-realdev-probe/result.json'))
          r['durationSeconds']=d
          open('/tmp/astra-realdev-probe/result.json','w').write(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print('PROBE_DURATION_SECONDS='+str(d))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-independent-realdev-acquisition-probe-v1
          path: /tmp/astra-realdev-probe
          if-no-files-found: warn
          retention-days: 7
