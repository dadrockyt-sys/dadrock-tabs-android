name: Songsterr Fresh Demucs Reproducibility Canary

on:
  workflow_dispatch:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-demucs-reproducibility-canary.yml'
      - 'scripts/songsterr-fresh/compare_demucs_stem_reproducibility.py'
      - 'scripts/songsterr-fresh/verify_demucs_model_asset.py'

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  demucs-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out fresh branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch exact authorized fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/songsterr-fresh-demucs-repro
          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/dadrockyt-sys/dadrock-tabs-android/main/public/jimmy-paige-midterm-v1/gomyway-midterm-source.m4a' \
            --output /tmp/gomyway-midterm-source.m4a
          test "$(git hash-object /tmp/gomyway-midterm-source.m4a)" = '4dd709e3fa177b4daeed71ca97f0199757729d4b'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/gomyway-midterm-source.m4a \
            -ac 2 -ar 44100 \
            /tmp/gomyway-midterm-separation.wav
          INPUT_SHA="$(sha256sum /tmp/gomyway-midterm-separation.wav | awk '{print $1}')"
          test "$INPUT_SHA" = 'e03e1885185f4983b3eeaa66f36510b7709d607c14010f964e0aad427ecc474a'
          sha256sum /tmp/gomyway-midterm-separation.wav | tee /tmp/songsterr-fresh-demucs-repro/separation-input.sha256

      - name: Install pinned separation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 \
            torch==2.14.0 \
            huggingface-hub==1.30.0 \
            safetensors==0.8.0 \
            sphn==0.2.1 \
            demucs==4.1.0 \
            soundfile==0.13.1
          python - <<'PY'
          import importlib.metadata
          for name in ('numpy', 'torch', 'huggingface-hub', 'safetensors', 'sphn', 'demucs', 'soundfile'):
              print(f'{name}=={importlib.metadata.version(name)}')
          PY

      - name: Record runtime provenance
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG_VERSION="$(ffmpeg -version | head -n 1)"
          python - <<PY
          import hashlib
          import importlib.metadata
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path
          import torch

          def sha256_file(path):
              h = hashlib.sha256()
              with open(path, 'rb') as handle:
                  while True:
                      block = handle.read(1024 * 1024)
                      if not block:
                          break
                      h.update(block)
              return h.hexdigest()

          def command_text(argv):
              try:
                  return subprocess.check_output(argv, text=True, stderr=subprocess.STDOUT).strip()
              except Exception as exc:
                  return f'UNAVAILABLE:{type(exc).__name__}:{exc}'

          cpu_model = None
          cpuinfo = Path('/proc/cpuinfo')
          if cpuinfo.is_file():
              for line in cpuinfo.read_text(encoding='utf-8', errors='replace').splitlines():
                  if line.lower().startswith('model name') and ':' in line:
                      cpu_model = line.split(':', 1)[1].strip()
                      break

          payload = {
              'contract': 'songsterr-fresh-demucs-runtime-provenance-v2',
              'version': 2,
              'python': platform.python_version(),
              'pythonBuild': platform.python_build(),
              'platform': platform.platform(),
              'uname': list(platform.uname()),
              'machine': platform.machine(),
              'processor': platform.processor() or None,
              'cpuModel': cpu_model,
              'lscpu': command_text(['lscpu']),
              'runnerOS': os.environ.get('RUNNER_OS'),
              'runnerArch': os.environ.get('RUNNER_ARCH'),
              'imageOS': os.environ.get('ImageOS'),
              'imageVersion': os.environ.get('ImageVersion'),
              'ffmpegVersion': '''$FFMPEG_VERSION''',
              'decodedSeparationWavSha256': sha256_file('/tmp/gomyway-midterm-separation.wav'),
              'packages': {
                  name: importlib.metadata.version(name)
                  for name in ('numpy', 'torch', 'huggingface-hub', 'safetensors', 'sphn', 'demucs', 'soundfile')
              },
              'torch': {
                  'version': torch.__version__,
                  'numThreads': torch.get_num_threads(),
                  'numInteropThreads': torch.get_num_interop_threads(),
                  'mkldnnEnabled': bool(torch.backends.mkldnn.enabled),
                  'mklAvailable': bool(torch.backends.mkl.is_available()),
                  'openmpAvailable': bool(torch.backends.openmp.is_available()),
                  'cudaAvailable': bool(torch.cuda.is_available()),
                  'config': torch.__config__.show(),
              },
              'threadingEnvironment': {
                  key: os.environ.get(key)
                  for key in ('OMP_NUM_THREADS', 'MKL_NUM_THREADS', 'OPENBLAS_NUM_THREADS', 'NUMEXPR_NUM_THREADS', 'PYTHONHASHSEED')
              },
          }
          out = Path('/tmp/songsterr-fresh-demucs-repro/runtime-provenance.json')
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({
              'contract': payload['contract'],
              'cpuModel': payload['cpuModel'],
              'runnerOS': payload['runnerOS'],
              'runnerArch': payload['runnerArch'],
              'imageOS': payload['imageOS'],
              'imageVersion': payload['imageVersion'],
              'torch': {k: payload['torch'][k] for k in ('version','numThreads','numInteropThreads','mkldnnEnabled','mklAvailable','openmpAvailable','cudaAvailable')},
          }, indent=2, sort_keys=True))
          PY

      - name: Run fixed Demucs pass A
        shell: bash
        run: |
          set -euo pipefail
          python -m demucs \
            -n htdemucs_6s \
            --device cpu \
            --shifts 0 \
            --overlap 0.25 \
            --segment 7 \
            -o /tmp/songsterr-fresh-demucs-repro/a \
            /tmp/gomyway-midterm-separation.wav
          STEM='/tmp/songsterr-fresh-demucs-repro/a/htdemucs_6s/gomyway-midterm-separation/guitar.wav'
          test -s "$STEM"
          sha256sum "$STEM" | tee /tmp/songsterr-fresh-demucs-repro/stem-a.sha256

      - name: Verify executed Demucs Hugging Face asset
        shell: bash
        run: |
          set -euo pipefail
          python scripts/songsterr-fresh/verify_demucs_model_asset.py \
            --output /tmp/songsterr-fresh-demucs-repro/demucs-model-asset.json
          python - <<'PY'
          import json
          path = '/tmp/songsterr-fresh-demucs-repro/demucs-model-asset.json'
          with open(path, 'r', encoding='utf-8') as handle:
              data = json.load(handle)
          required = {
              'contract': 'songsterr-fresh-demucs-model-asset-v2',
              'primaryLoader': 'huggingface',
              'hfRepoId': 'adefossez/HTDemucs-6s',
              'hfPinnedRevision': '3c5ee475be622df764938de97e4281a7b07ffa58',
              'hfAssetUploadRevision': '053e1404489b3dc58bf718224fac4b7316de8c93',
              'assetFilename': '5c90dfd2.safetensors',
              'assetSha256': 'd2a1745f0744721f6b8ca5bf469b67c651ea5ed1b52998cab033b2158609d411',
          }
          for key, value in required.items():
              if data.get(key) != value:
                  raise SystemExit(f'DEMUCS_REPRO_MODEL_ASSET_CHANGED:{key}:{data.get(key)}')
          if data.get('legacyFallback', {}).get('primary') is not False:
              raise SystemExit('DEMUCS_LEGACY_FALLBACK_MUST_NOT_BE_PRIMARY')
          print(json.dumps(data, indent=2, sort_keys=True))
          PY

      - name: Run fixed Demucs pass B
        shell: bash
        run: |
          set -euo pipefail
          python -m demucs \
            -n htdemucs_6s \
            --device cpu \
            --shifts 0 \
            --overlap 0.25 \
            --segment 7 \
            -o /tmp/songsterr-fresh-demucs-repro/b \
            /tmp/gomyway-midterm-separation.wav
          STEM='/tmp/songsterr-fresh-demucs-repro/b/htdemucs_6s/gomyway-midterm-separation/guitar.wav'
          test -s "$STEM"
          sha256sum "$STEM" | tee /tmp/songsterr-fresh-demucs-repro/stem-b.sha256

      - name: Measure duplicate-stem reproducibility without preference
        shell: bash
        run: |
          set -euo pipefail
          BASE=/tmp/songsterr-fresh-demucs-repro
          INPUT_SHA="$(awk '{print $1}' "$BASE/separation-input.sha256")"
          python scripts/songsterr-fresh/compare_demucs_stem_reproducibility.py \
            --a "$BASE/a/htdemucs_6s/gomyway-midterm-separation/guitar.wav" \
            --b "$BASE/b/htdemucs_6s/gomyway-midterm-separation/guitar.wav" \
            --input-sha256 "$INPUT_SHA" \
            --model-asset "$BASE/demucs-model-asset.json" \
            --runtime-metadata "$BASE/runtime-provenance.json" \
            --output "$BASE/demucs-stem-reproducibility.json"

      - name: Prove diagnostic-only boundaries and summarize
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          base = '/tmp/songsterr-fresh-demucs-repro'
          with open(f'{base}/demucs-stem-reproducibility.json', 'r', encoding='utf-8') as handle:
              payload = json.load(handle)
          if payload.get('contract') != 'songsterr-fresh-demucs-stem-reproducibility-comparison-v1':
              raise SystemExit('DEMUCS_REPRO_CONTRACT_CHANGED')
          if payload.get('diagnosticOnly') is not True or payload.get('referenceBlind') is not True:
              raise SystemExit('DEMUCS_REPRO_SCOPE_CHANGED')
          for key in (
              'changesDuration', 'changesPitchIdentity', 'invokesModel',
              'selectsPreferredStem', 'proposesDemucsSettingChange',
              'thresholdSelection', 'thresholdSweep', 'ownsAcceptanceDecision'
          ):
              if payload.get(key) is not False:
                  raise SystemExit(f'DEMUCS_REPRO_GUARD_CHANGED:{key}')
          hard = payload.get('hardGuards') or {}
          for key in (
              'preferredStemSelection', 'durationWrite', 'sourceEndWrite',
              'pitchIdentityWrite', 'modelInferenceByComparator',
              'thresholdSelection', 'thresholdSweep', 'acceptanceDecision'
          ):
              if hard.get(key) is not False:
                  raise SystemExit(f'DEMUCS_REPRO_HARD_GUARD_CHANGED:{key}')
          source = payload.get('source') or {}
          if source.get('verifiedSeparationInputSha256') != 'e03e1885185f4983b3eeaa66f36510b7709d607c14010f964e0aad427ecc474a':
              raise SystemExit('DEMUCS_REPRO_INPUT_SHA_CHANGED')
          comparison = payload.get('comparison') or {}
          required_metrics = (
              'fileBytesIdentical', 'pcmBytesIdentical', 'exactSampleEquality',
              'differingPcmValueCount', 'differingPcmValueFraction',
              'meanAbsoluteDifference', 'rootMeanSquareDifference',
              'maximumAbsoluteDifference', 'referenceStemRms'
          )
          for key in required_metrics:
              if key not in comparison:
                  raise SystemExit(f'DEMUCS_REPRO_METRIC_MISSING:{key}')

          observation = {
              'contract': 'songsterr-fresh-demucs-reproducibility-observation-v1',
              'version': 1,
              'referenceBlind': True,
              'diagnosticOnly': True,
              'scope': 'same-job-same-runtime-repeatability-observation',
              'crossEnvironmentByteEqualityRequired': False,
              'sourceAudioGitBlobSha': '4dd709e3fa177b4daeed71ca97f0199757729d4b',
              'decodedSeparationWavSha256': source.get('verifiedSeparationInputSha256'),
              'package': 'demucs',
              'packageVersion': '4.1.0',
              'model': 'htdemucs_6s',
              'device': 'cpu',
              'shifts': 0,
              'overlap': 0.25,
              'segmentSeconds': 7,
              'stem': 'guitar',
              'passASha256': source.get('stemAFileSha256'),
              'passBSha256': source.get('stemBFileSha256'),
              'passAPcmSha256': source.get('stemAPcmSha256'),
              'passBPcmSha256': source.get('stemBPcmSha256'),
              'comparison': comparison,
              'preferredStemSelected': False,
              'demucsSettingChangeProposed': False,
              'durationChanged': False,
              'pitchIdentityChanged': False,
              'thresholdSweepUsed': False,
              'acceptanceDecisionMade': False,
              'customerDeliveryInvoked': False,
              'legacyV143ScorerImported': False,
              'professionalScorerUsed': False,
              'referenceTabUsed': False,
          }
          with open(f'{base}/demucs-reproducibility-observation.json', 'w', encoding='utf-8') as handle:
              json.dump(observation, handle, indent=2, sort_keys=True)
              handle.write('\n')
          print(json.dumps(observation, indent=2, sort_keys=True))
          PY

      - name: Run comparator self-test
        run: python scripts/songsterr-fresh/compare_demucs_stem_reproducibility.py --self-test

      - name: Upload reproducibility diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songsterr-fresh-demucs-reproducibility
          path: |
            /tmp/songsterr-fresh-demucs-repro/demucs-model-asset.json
            /tmp/songsterr-fresh-demucs-repro/runtime-provenance.json
            /tmp/songsterr-fresh-demucs-repro/demucs-stem-reproducibility.json
            /tmp/songsterr-fresh-demucs-repro/demucs-reproducibility-observation.json
            /tmp/songsterr-fresh-demucs-repro/separation-input.sha256
            /tmp/songsterr-fresh-demucs-repro/stem-a.sha256
            /tmp/songsterr-fresh-demucs-repro/stem-b.sha256
          if-no-files-found: warn
          retention-days: 14
