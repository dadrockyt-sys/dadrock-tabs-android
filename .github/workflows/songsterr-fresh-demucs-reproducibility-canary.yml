name: Songsterr Fresh Demucs Reproducibility Canary

on:
  workflow_dispatch:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-demucs-reproducibility-canary.yml'
      - 'scripts/songsterr-fresh/verify_demucs_model_asset.py'

permissions:
  contents: read

jobs:
  demucs-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out fresh branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch exact authorized fixture
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/dadrockyt-sys/dadrock-tabs-android/main/public/jimmy-paige-midterm-v1/gomyway-midterm-source.m4a' \
            --output /tmp/gomyway-midterm-source.m4a
          test "$(git hash-object /tmp/gomyway-midterm-source.m4a)" = '4dd709e3fa177b4daeed71ca97f0199757729d4b'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/gomyway-midterm-source.m4a \
            -ac 2 -ar 44100 \
            /tmp/gomyway-midterm-separation.wav

      - name: Install pinned separation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 \
            demucs==4.1.0 \
            soundfile==0.13.1
          python - <<'PY'
          import importlib.metadata
          for name in ('numpy', 'demucs', 'soundfile', 'torch'):
              print(f'{name}=={importlib.metadata.version(name)}')
          PY

      - name: Run deterministic Demucs pass A
        shell: bash
        run: |
          set -euo pipefail
          python -m demucs \
            -n htdemucs_6s \
            --device cpu \
            --shifts 0 \
            --overlap 0.25 \
            --segment 7 \
            -o /tmp/songsterr-fresh-demucs-repro/a \
            /tmp/gomyway-midterm-separation.wav
          STEM='/tmp/songsterr-fresh-demucs-repro/a/htdemucs_6s/gomyway-midterm-separation/guitar.wav'
          test -s "$STEM"
          sha256sum "$STEM" | tee /tmp/songsterr-fresh-demucs-repro/stem-a.sha256

      - name: Verify immutable Demucs model asset
        shell: bash
        run: |
          set -euo pipefail
          python scripts/songsterr-fresh/verify_demucs_model_asset.py \
            --output /tmp/songsterr-fresh-demucs-repro/demucs-model-asset.json
          python - <<'PY'
          import json
          path = '/tmp/songsterr-fresh-demucs-repro/demucs-model-asset.json'
          with open(path, 'r', encoding='utf-8') as handle:
              data = json.load(handle)
          if data.get('contract') != 'songsterr-fresh-demucs-model-asset-v1':
              raise SystemExit('DEMUCS_ASSET_CONTRACT_CHANGED')
          if data.get('modelName') != 'htdemucs_6s' or data.get('modelSignature') != '5c90dfd2':
              raise SystemExit('DEMUCS_ASSET_IDENTITY_CHANGED')
          if data.get('assetFilename') != '5c90dfd2-34c22ccb.th':
              raise SystemExit('DEMUCS_ASSET_FILENAME_CHANGED')
          if data.get('assetChecksumPrefixVerified') is not True:
              raise SystemExit('DEMUCS_ASSET_CHECKSUM_PREFIX_NOT_VERIFIED')
          sha = data.get('assetSha256')
          if not isinstance(sha, str) or len(sha) != 64 or not sha.startswith('34c22ccb'):
              raise SystemExit(f'DEMUCS_ASSET_FULL_SHA_INVALID:{sha}')
          print(json.dumps(data, indent=2))
          PY

      - name: Run deterministic Demucs pass B
        shell: bash
        run: |
          set -euo pipefail
          python -m demucs \
            -n htdemucs_6s \
            --device cpu \
            --shifts 0 \
            --overlap 0.25 \
            --segment 7 \
            -o /tmp/songsterr-fresh-demucs-repro/b \
            /tmp/gomyway-midterm-separation.wav
          STEM='/tmp/songsterr-fresh-demucs-repro/b/htdemucs_6s/gomyway-midterm-separation/guitar.wav'
          test -s "$STEM"
          sha256sum "$STEM" | tee /tmp/songsterr-fresh-demucs-repro/stem-b.sha256

      - name: Prove identical deterministic stem bytes
        shell: bash
        run: |
          set -euo pipefail
          STEM_A='/tmp/songsterr-fresh-demucs-repro/a/htdemucs_6s/gomyway-midterm-separation/guitar.wav'
          STEM_B='/tmp/songsterr-fresh-demucs-repro/b/htdemucs_6s/gomyway-midterm-separation/guitar.wav'
          SHA_A="$(sha256sum "$STEM_A" | awk '{print $1}')"
          SHA_B="$(sha256sum "$STEM_B" | awk '{print $1}')"
          test "$SHA_A" = "$SHA_B"
          cmp -s "$STEM_A" "$STEM_B"
          python - <<PY
          import json
          from pathlib import Path
          import soundfile as sf
          stem = Path('$STEM_A')
          info = sf.info(stem)
          payload = {
              'contract': 'songsterr-fresh-demucs-determinism-proof-v1',
              'version': 1,
              'referenceBlind': True,
              'sourceAudioGitBlobSha': '4dd709e3fa177b4daeed71ca97f0199757729d4b',
              'package': 'demucs',
              'packageVersion': '4.1.0',
              'model': 'htdemucs_6s',
              'modelSignature': '5c90dfd2',
              'device': 'cpu',
              'shifts': 0,
              'overlap': 0.25,
              'segmentSeconds': 7,
              'stem': 'guitar',
              'passASha256': '$SHA_A',
              'passBSha256': '$SHA_B',
              'identicalStemSha256': True,
              'identicalStemBytes': True,
              'sampleRate': info.samplerate,
              'channels': info.channels,
              'frames': info.frames,
              'durationSeconds': info.duration,
              'legacyV143ScorerImported': False,
              'professionalScorerUsed': False,
              'referenceTabUsed': False,
          }
          with open('/tmp/songsterr-fresh-demucs-repro/demucs-determinism-proof.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, indent=2)
              handle.write('\n')
          print(json.dumps(payload, indent=2))
          PY

      - name: Upload reproducibility proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songsterr-fresh-demucs-reproducibility
          path: |
            /tmp/songsterr-fresh-demucs-repro/demucs-model-asset.json
            /tmp/songsterr-fresh-demucs-repro/demucs-determinism-proof.json
            /tmp/songsterr-fresh-demucs-repro/stem-a.sha256
            /tmp/songsterr-fresh-demucs-repro/stem-b.sha256
          if-no-files-found: warn
          retention-days: 14
