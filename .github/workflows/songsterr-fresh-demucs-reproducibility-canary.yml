name: Songsterr Fresh Demucs Reproducibility Canary

on:
  workflow_dispatch:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-demucs-reproducibility-canary.yml'
      - 'scripts/songsterr-fresh/verify_demucs_model_asset.py'

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  demucs-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out fresh branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch exact authorized fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/songsterr-fresh-demucs-repro
          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/dadrockyt-sys/dadrock-tabs-android/main/public/jimmy-paige-midterm-v1/gomyway-midterm-source.m4a' \
            --output /tmp/gomyway-midterm-source.m4a
          test "$(git hash-object /tmp/gomyway-midterm-source.m4a)" = '4dd709e3fa177b4daeed71ca97f0199757729d4b'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/gomyway-midterm-source.m4a \
            -ac 2 -ar 44100 \
            /tmp/gomyway-midterm-separation.wav
          sha256sum /tmp/gomyway-midterm-separation.wav | tee /tmp/songsterr-fresh-demucs-repro/separation-input.sha256

      - name: Install pinned separation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 \
            torch==2.14.0 \
            huggingface-hub==1.30.0 \
            safetensors==0.8.0 \
            sphn==0.2.1 \
            demucs==4.1.0 \
            soundfile==0.13.1
          python - <<'PY'
          import importlib.metadata
          for name in ('numpy', 'torch', 'huggingface-hub', 'safetensors', 'sphn', 'demucs', 'soundfile'):
              print(f'{name}=={importlib.metadata.version(name)}')
          PY

      - name: Record runtime provenance
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG_VERSION="$(ffmpeg -version | head -n 1)"
          python - <<PY
          import hashlib
          import importlib.metadata
          import json
          import os
          import platform
          from pathlib import Path

          def sha256_file(path):
              h = hashlib.sha256()
              with open(path, 'rb') as handle:
                  while True:
                      block = handle.read(1024 * 1024)
                      if not block:
                          break
                      h.update(block)
              return h.hexdigest()

          cpu_model = None
          cpuinfo = Path('/proc/cpuinfo')
          if cpuinfo.is_file():
              for line in cpuinfo.read_text(encoding='utf-8', errors='replace').splitlines():
                  if line.lower().startswith('model name') and ':' in line:
                      cpu_model = line.split(':', 1)[1].strip()
                      break

          payload = {
              'contract': 'songsterr-fresh-demucs-runtime-provenance-v1',
              'version': 1,
              'python': platform.python_version(),
              'platform': platform.platform(),
              'machine': platform.machine(),
              'processor': platform.processor() or None,
              'cpuModel': cpu_model,
              'runnerOS': os.environ.get('RUNNER_OS'),
              'runnerArch': os.environ.get('RUNNER_ARCH'),
              'imageOS': os.environ.get('ImageOS'),
              'imageVersion': os.environ.get('ImageVersion'),
              'ffmpegVersion': '''$FFMPEG_VERSION''',
              'decodedSeparationWavSha256': sha256_file('/tmp/gomyway-midterm-separation.wav'),
              'packages': {
                  name: importlib.metadata.version(name)
                  for name in ('numpy', 'torch', 'huggingface-hub', 'safetensors', 'sphn', 'demucs', 'soundfile')
              },
              'threadingEnvironment': {
                  key: os.environ.get(key)
                  for key in ('OMP_NUM_THREADS', 'MKL_NUM_THREADS', 'OPENBLAS_NUM_THREADS', 'NUMEXPR_NUM_THREADS', 'PYTHONHASHSEED')
              },
          }
          out = Path('/tmp/songsterr-fresh-demucs-repro/runtime-provenance.json')
          out.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, indent=2))
          PY

      - name: Run deterministic Demucs pass A
        shell: bash
        run: |
          set -euo pipefail
          python -m demucs \
            -n htdemucs_6s \
            --device cpu \
            --shifts 0 \
            --overlap 0.25 \
            --segment 7 \
            -o /tmp/songsterr-fresh-demucs-repro/a \
            /tmp/gomyway-midterm-separation.wav
          STEM='/tmp/songsterr-fresh-demucs-repro/a/htdemucs_6s/gomyway-midterm-separation/guitar.wav'
          test -s "$STEM"
          sha256sum "$STEM" | tee /tmp/songsterr-fresh-demucs-repro/stem-a.sha256

      - name: Verify executed Demucs Hugging Face asset
        shell: bash
        run: |
          set -euo pipefail
          python scripts/songsterr-fresh/verify_demucs_model_asset.py \
            --output /tmp/songsterr-fresh-demucs-repro/demucs-model-asset.json
          python - <<'PY'
          import json
          path = '/tmp/songsterr-fresh-demucs-repro/demucs-model-asset.json'
          with open(path, 'r', encoding='utf-8') as handle:
              data = json.load(handle)
          if data.get('contract') != 'songsterr-fresh-demucs-model-asset-v2':
              raise SystemExit('DEMUCS_ASSET_CONTRACT_CHANGED')
          if data.get('modelName') != 'htdemucs_6s' or data.get('modelSignature') != '5c90dfd2':
              raise SystemExit('DEMUCS_ASSET_IDENTITY_CHANGED')
          if data.get('primaryLoader') != 'huggingface' or data.get('hfRepoId') != 'adefossez/HTDemucs-6s':
              raise SystemExit('DEMUCS_PRIMARY_LOADER_CHANGED')
          if data.get('hfPinnedRevision') != '053e1404489b3dc58bf718224fac4b7316de8c93':
              raise SystemExit('DEMUCS_HF_REVISION_CHANGED')
          if data.get('bagModels') != ['5c90dfd2']:
              raise SystemExit('DEMUCS_HF_BAG_CHANGED')
          if data.get('assetFilename') != '5c90dfd2.safetensors':
              raise SystemExit('DEMUCS_HF_ASSET_FILENAME_CHANGED')
          if data.get('assetSha256') != 'd2a1745f0744721f6b8ca5bf469b67c651ea5ed1b52998cab033b2158609d411':
              raise SystemExit(f"DEMUCS_HF_ASSET_SHA_CHANGED:{data.get('assetSha256')}")
          if data.get('legacyFallback', {}).get('primary') is not False:
              raise SystemExit('DEMUCS_LEGACY_FALLBACK_MUST_NOT_BE_PRIMARY')
          print(json.dumps(data, indent=2))
          PY

      - name: Run deterministic Demucs pass B
        shell: bash
        run: |
          set -euo pipefail
          python -m demucs \
            -n htdemucs_6s \
            --device cpu \
            --shifts 0 \
            --overlap 0.25 \
            --segment 7 \
            -o /tmp/songsterr-fresh-demucs-repro/b \
            /tmp/gomyway-midterm-separation.wav
          STEM='/tmp/songsterr-fresh-demucs-repro/b/htdemucs_6s/gomyway-midterm-separation/guitar.wav'
          test -s "$STEM"
          sha256sum "$STEM" | tee /tmp/songsterr-fresh-demucs-repro/stem-b.sha256

      - name: Prove same-environment deterministic stem bytes
        shell: bash
        run: |
          set -euo pipefail
          STEM_A='/tmp/songsterr-fresh-demucs-repro/a/htdemucs_6s/gomyway-midterm-separation/guitar.wav'
          STEM_B='/tmp/songsterr-fresh-demucs-repro/b/htdemucs_6s/gomyway-midterm-separation/guitar.wav'
          SHA_A="$(sha256sum "$STEM_A" | awk '{print $1}')"
          SHA_B="$(sha256sum "$STEM_B" | awk '{print $1}')"
          test "$SHA_A" = "$SHA_B"
          cmp -s "$STEM_A" "$STEM_B"
          python - <<PY
          import json
          from pathlib import Path
          import soundfile as sf

          with open('/tmp/songsterr-fresh-demucs-repro/runtime-provenance.json', 'r', encoding='utf-8') as handle:
              runtime = json.load(handle)
          with open('/tmp/songsterr-fresh-demucs-repro/demucs-model-asset.json', 'r', encoding='utf-8') as handle:
              asset = json.load(handle)

          stem = Path('$STEM_A')
          info = sf.info(stem)
          payload = {
              'contract': 'songsterr-fresh-demucs-determinism-proof-v2',
              'version': 2,
              'referenceBlind': True,
              'scope': 'same-job-same-runtime-byte-determinism',
              'crossEnvironmentByteEqualityRequired': False,
              'sourceAudioGitBlobSha': '4dd709e3fa177b4daeed71ca97f0199757729d4b',
              'decodedSeparationWavSha256': runtime.get('decodedSeparationWavSha256'),
              'package': 'demucs',
              'packageVersion': '4.1.0',
              'model': 'htdemucs_6s',
              'modelSignature': '5c90dfd2',
              'executedAssetSha256': asset.get('assetSha256'),
              'executedAssetRevision': asset.get('hfPinnedRevision'),
              'device': 'cpu',
              'shifts': 0,
              'overlap': 0.25,
              'segmentSeconds': 7,
              'stem': 'guitar',
              'passASha256': '$SHA_A',
              'passBSha256': '$SHA_B',
              'identicalStemSha256': True,
              'identicalStemBytes': True,
              'sampleRate': info.samplerate,
              'channels': info.channels,
              'frames': info.frames,
              'durationSeconds': info.duration,
              'runtimeProvenanceContract': runtime.get('contract'),
              'legacyV143ScorerImported': False,
              'professionalScorerUsed': False,
              'referenceTabUsed': False,
          }
          with open('/tmp/songsterr-fresh-demucs-repro/demucs-determinism-proof.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, indent=2)
              handle.write('\n')
          print(json.dumps(payload, indent=2))
          PY

      - name: Upload reproducibility proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songsterr-fresh-demucs-reproducibility
          path: |
            /tmp/songsterr-fresh-demucs-repro/demucs-model-asset.json
            /tmp/songsterr-fresh-demucs-repro/demucs-determinism-proof.json
            /tmp/songsterr-fresh-demucs-repro/runtime-provenance.json
            /tmp/songsterr-fresh-demucs-repro/separation-input.sha256
            /tmp/songsterr-fresh-demucs-repro/stem-a.sha256
            /tmp/songsterr-fresh-demucs-repro/stem-b.sha256
          if-no-files-found: warn
          retention-days: 14
