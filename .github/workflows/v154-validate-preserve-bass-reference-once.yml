name: V154 validate preserved Bass reference once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v154-validate-preserve-bass-reference-once.yml

permissions:
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo
  REF_JSON: research/v154-professional-references/bass-professional-reference-machine-readable.json
  SOURCE_RECEIPT: research/v154-professional-references/bass-source-set-receipt.json
  PROVENANCE: research/v154-professional-references/bass-professional-reference-provenance.json

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 1

      - name: Validate Bass visual machine-readable reference
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          ref_path = Path('research/v154-professional-references/bass-professional-reference-machine-readable.json')
          receipt_path = Path('research/v154-professional-references/bass-source-set-receipt.json')
          ref = json.loads(ref_path.read_text(encoding='utf-8'))
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))

          assert ref['schema'] == 'dadrock.tabs.v154.professional-bass-reference.visual-machine-readable.v1'
          assert ref['status'] == 'COMPLETE_VISUAL_MACHINE_READABLE_NOT_SCORING_NORMALIZED'
          assert ref['part'] == 'bass'
          assert ref['song'] == {'artist':'Lenny Kravitz','title':'Are You Gonna Go My Way'}
          assert ref['source']['canonicalSetSha256'] == 'abd1748066966ceb93fe40bf8c8df3168f6c871ba006e44d28f8840184e3cde3'
          assert receipt['allCanonicalPageSha256ValuesMatchPreviousReceipt'] is True
          assert len(receipt['canonicalPages']) == 17
          assert ref['representation']['scoringReady'] is False
          assert ref['representation']['requiresTimingNormalizationBeforeScoring'] is True

          measures = ref['measures']
          assert len(measures) == 113
          assert [m['measure'] for m in measures] == list(range(1,114))
          assert measures[103]['measure'] == 104 and measures[103]['timeSignature'] == '2/4'
          m88 = measures[87]
          assert m88['measure'] == 88 and m88['excludeFromScoring'] is True

          open_midi = {0:43,1:38,2:33,3:28}
          event_count = pitched = dead = continuation = 0
          midi_values = []
          for m in measures:
              for e in m['events']:
                  event_count += 1
                  assert 'step' not in e
                  if e.get('continuationOnly'):
                      continuation += 1
                  if e['kind'] == 'deadNote':
                      dead += 1
                      assert e['midi'] is None and e['fret'] is None
                  else:
                      pitched += 1
                      assert e['midi'] == open_midi[int(e['stringIndex'])] + int(e['fret'])
                      midi_values.append(int(e['midi']))

          audit = ref['audit']
          assert audit['storedMeasureObjects'] == 113
          assert audit['eventObjects'] == event_count == 569
          assert audit['pitchedEventObjects'] == pitched == 562
          assert audit['deadNoteObjects'] == dead == 7
          assert audit['continuationOnlyObjects'] == continuation == 8
          assert min(midi_values) == audit['observedMidiMin'] == 28
          assert max(midi_values) == audit['observedMidiMax'] == 56
          assert audit['midiMappingErrors'] == 0
          assert audit['scoringStepFieldsPresent'] is False

          print('Bass visual reference SHA256:', hashlib.sha256(ref_path.read_bytes()).hexdigest())
          print('Measures:', len(measures), 'events:', event_count, 'pitched:', pitched, 'dead:', dead, 'continuations:', continuation)
          print('PASS: no scorer step fields present; measure 88 excluded pending timing normalization')
          PY

      - name: Write provenance and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          ref_path=Path('research/v154-professional-references/bass-professional-reference-machine-readable.json')
          receipt_path=Path('research/v154-professional-references/bass-source-set-receipt.json')
          ref=json.loads(ref_path.read_text(encoding='utf-8'))
          sha=hashlib.sha256(ref_path.read_bytes()).hexdigest()
          blob=subprocess.check_output(['git','hash-object',str(ref_path)],text=True).strip()
          provenance={
            'schema':'dadrock.tabs.v154.professional-reference-provenance.v1',
            'part':'bass',
            'song':ref['song'],
            'researchBranch':'v143-contextual-prune-lobo',
            'preservedAtUtc':datetime.now(timezone.utc).isoformat(),
            'sourceSet':{
              'receiptPath':str(receipt_path),
              'canonicalPageCount':17,
              'canonicalSetSha256':'abd1748066966ceb93fe40bf8c8df3168f6c871ba006e44d28f8840184e3cde3',
              'allCanonicalPagesReprovidedAndHashMatched':True,
              'supplementalView':'1000120386.jpg'
            },
            'machineReadableReference':{
              'repositoryPath':str(ref_path),
              'sha256':sha,
              'gitBlobSha':blob,
              'measureCount':113,
              'eventObjects':ref['audit']['eventObjects'],
              'pitchedEventObjects':ref['audit']['pitchedEventObjects'],
              'deadNoteObjects':ref['audit']['deadNoteObjects'],
              'continuationOnlyObjects':ref['audit']['continuationOnlyObjects'],
              'observedMidiRange':[ref['audit']['observedMidiMin'],ref['audit']['observedMidiMax']],
              'scoringReady':False,
              'exactStepTimingFrozen':False
            },
            'uncertainties':[
              {'measure':10,'type':'ui-overlay','excludedFromNotation':True},
              {'measure':88,'type':'source-timing-annotation','excludeFromScoringUntilResolved':True}
            ],
            'authorization':{
              'userExplicitlyRequestedMachineReadableBassSavedToResearchBranch':True,
              'userProvidedScreenshots':True
            },
            'safety':{
              'screenshotBytesCommitted':False,
              'candidateGenerationMayReadReference':False,
              'referenceFacingScoreCallsDuringPreservation':0,
              'generatedCandidateModified':False,
              'mainOrProductionModified':False,
              'modalUsed':False,
              'cudaGpuUsed':False
            }
          }
          Path('research/v154-professional-references/bass-professional-reference-provenance.json').write_text(json.dumps(provenance,indent=2,sort_keys=True)+'\n',encoding='utf-8')

          cp=Path('docs/checkpoints/CURRENT_STATE.md')
          text=cp.read_text(encoding='utf-8')
          text=text.replace(
            'Active phase: **V154 broad-Other CPU recognition output is COMPLETE / FROZEN / STRUCTURAL-QC PASS. Professional-reference scoring has NOT run because the private Bass/Lead screenshot bytes are not accessible in this active conversation.**',
            'Active phase: **V154 broad-Other CPU recognition output is COMPLETE / FROZEN / STRUCTURAL-QC PASS. Rhythm is preserved machine-readably; Bass screenshots have been re-provided and the complete Bass visual reference is now preserved machine-readably. Lead still needs to be re-provided before three-part scoring normalization. Professional-reference scoring has NOT run.**')
          text=text.replace(
            '- Do not commit user-provided professional-tab screenshot bytes or note-by-note copyrighted reference content to this public repository.',
            '- Do not commit user-provided professional-tab screenshot bytes. By explicit user direction, machine-readable reference transcriptions may be stored only under `research/v154-professional-references/` on research branch `v143-contextual-prune-lobo`; never promote them to `main`/Production and never expose them to candidate generation.')
          text=text.replace(
            '- **Current blocking boundary:** raw Bass/Lead screenshot bytes are absent from the active ChatGPT conversation and Library. Their identities remain frozen, but private note-by-note normalization must not be guessed from receipts/memory.',
            '- Bass screenshot bytes are now re-provided and identity-matched; its visual-order machine-readable transcription is preserved under `research/v154-professional-references/`. Lead screenshot bytes remain the current missing reference input. Exact 16-step Bass timing is intentionally not frozen yet, so the Bass file is not scorer-ready.')
          marker='## V154 professional Bass preservation — COMPLETE VISUAL MACHINE-READABLE / TIMING NOT YET SCORER-NORMALIZED'
          if marker not in text:
              text += f'''\n\n{marker}\n- User re-provided the complete Bass reference and explicitly requested machine-readable preservation on research branch `v143-contextual-prune-lobo`.\n- The 17 canonical pages match the previously frozen page SHA256 identities exactly; prior set SHA256 remains `abd1748066966ceb93fe40bf8c8df3168f6c871ba006e44d28f8840184e3cde3`. A supplemental overlapping screenshot `1000120386.jpg` covers measures 63–67 but is excluded from the canonical 17-page identity.\n- Source-set receipt: `research/v154-professional-references/bass-source-set-receipt.json`. Screenshot bytes are **not committed**.\n- Complete visual machine-readable Bass reference: `research/v154-professional-references/bass-professional-reference-machine-readable.json`; SHA256 `{sha}`; Git blob `{blob}`.\n- Coverage: measures 1–113 / 113 measure objects; 569 event objects; 562 pitched event objects; 7 dead-note objects; 8 tie/sustain continuation-only objects; observed MIDI 28–56; tuning/MIDI mapping errors 0.\n- Measure 10 green selection UI is ignored as interface overlay. Measure 88 retains the visible `Timing mishap here` uncertainty and is explicitly excluded from scoring until timing normalization is resolved.\n- This file preserves left-to-right note/string/fret/MIDI/technique identity but intentionally contains **no `step` onset fields**. It is machine-readable but **not yet V154 scorer-normalized**; a dedicated timing-normalization pass must occur before scoring.\n- Provenance: `research/v154-professional-references/bass-professional-reference-provenance.json`.\n- Candidate generation remains frozen and reference-blind. Reference-facing score calls remain `0`; generated candidate unchanged; `main`/Production unchanged; Modal/L4/CUDA/GPU not used.\n- Current missing professional input is Lead. Once Lead screenshots are re-provided and preserved, freeze exact three-part scoring timing identity before the one-time reference-facing score.\n'''
          cp.write_text(text,encoding='utf-8')
          PY

      - name: Commit provenance checkpoint and self-seal
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v154-validate-preserve-bass-reference-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/v154-professional-references/bass-professional-reference-provenance.json docs/checkpoints/CURRENT_STATE.md .github/workflows/v154-validate-preserve-bass-reference-once.yml
          git commit -m "research: validate and seal professional Bass reference [skip ci]"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
