name: V154 freeze frontend reference payload once

on:
  push:
    branches: [v143-contextual-prune-lobo]
    paths: [.github/workflows/v154-freeze-frontend-reference-payload-once.yml]

permissions:
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 1
      - name: Build immutable three-part reference payload
        run: python validation/v154_cpu_multitrack/build_frontend_reference_payload.py
      - name: Commit payload receipt and self-seal
        run: |
          set -euo pipefail
          rm .github/workflows/v154-freeze-frontend-reference-payload-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/v154-professional-references/scorer-ready/frontend-reference-payload.json \
                  research/v154-professional-references/scorer-ready/frontend-reference-payload-receipt.json \
                  .github/workflows/v154-freeze-frontend-reference-payload-once.yml
          git commit -m "research: freeze immutable frontend reference payload [skip ci]"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
