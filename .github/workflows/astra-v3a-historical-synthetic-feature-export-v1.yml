name: Astra V3A historical synthetic feature export v1

on:
  push:
    branches: [astra-work]
    paths:
      - 'docs/astra/V3A_SYNTHETIC_EXPORT_LAUNCH_V1.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: astra-v3a-historical-synthetic-feature-export-v1
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'
      - name: Verify V3 authorization and launch
        run: |
          python - <<'PY'
          import json
          d=json.load(open('docs/astra/UPSTREAM_TRANSFER_DIAGNOSIS_V3_DESIGN_V1.json'))
          l=json.load(open('docs/astra/V3A_SYNTHETIC_EXPORT_LAUNCH_V1.json'))
          assert d['schema']=='astra-upstream-transfer-diagnosis-v3-design-v1'
          assert l['schema']=='astra-v3a-synthetic-export-launch-v1'
          assert l['explicitlyAuthorized'] is True
          assert l['modelInference'] is False
          assert l['optimizerSteps']==0
          assert l['expectedInterventionFeatureArraySha256']=='6d12754ba68360090d70408c8a2de8b5f99273d5bc51c003a2bf76a1ea79d113'
          PY
      - name: Install exact historical CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          python -m pip check
      - name: Regenerate frozen S9 synthetic features only
        run: |
          mkdir -p /tmp/astra-v3a
          PYTHONPATH=astra_backend python astra_backend/synthetic/s0_pilot_v1.py generate --out /tmp/astra-v3a/control.npz --receipt /tmp/astra-v3a/control-render-receipt.json
          PYTHONPATH=astra_backend python astra_backend/synthetic/s9_pilot_v1.py build-intervention --control-dataset /tmp/astra-v3a/control.npz --out /tmp/astra-v3a/intervention.npz --receipt /tmp/astra-v3a/intervention-receipt.json
          PYTHONPATH=astra_backend python - <<'PY'
          import json, numpy as np
          from synthetic.s2_pilot_v1 import array_content_sha256
          c=np.load('/tmp/astra-v3a/control.npz',allow_pickle=False)
          i=np.load('/tmp/astra-v3a/intervention.npz',allow_pickle=False)
          got_c=array_content_sha256(c['features'])
          got_i=array_content_sha256(i['features'])
          assert got_c=='2119d9b953cf2fabde0dcab211004a89e385439108847d2e736a6cdea6e82ce4', got_c
          assert got_i=='6d12754ba68360090d70408c8a2de8b5f99273d5bc51c003a2bf76a1ea79d113', got_i
          out={
            'schema':'astra-v3a-historical-synthetic-feature-export-receipt-v1',
            'controlFeatureArraySha256':got_c,
            'interventionFeatureArraySha256':got_i,
            'examples':int(i['features'].shape[0]),
            'framesPerExample':int(i['features'].shape[1]),
            'featureBins':int(i['features'].shape[2]),
            'modelInferenceCount':0,
            'optimizerSteps':0
          }
          open('/tmp/astra-v3a/export-receipt.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload verified feature artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-v3a-historical-synthetic-features-v1
          path: |
            /tmp/astra-v3a/intervention.npz
            /tmp/astra-v3a/export-receipt.json
            /tmp/astra-v3a/intervention-receipt.json
            /tmp/astra-v3a/control-render-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/astra-v3a
