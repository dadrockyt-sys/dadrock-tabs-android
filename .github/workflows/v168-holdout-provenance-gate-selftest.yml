name: V168 holdout provenance gate self-test

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v168-holdout-provenance-gate-selftest.yml

permissions:
  contents: write

concurrency:
  group: v168-holdout-provenance-gate-selftest-once
  cancel-in-progress: false

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: e9ec8562e016cf2b5230e1a7da59b0159b312aaa
  BASE_VALIDATOR: validation/v168_holdout/validate_holdout_asset_manifest_v168.py
  PROVENANCE_VALIDATOR: validation/v168_holdout/validate_holdout_asset_provenance_v168.py
  INTAKE_DOC: docs/checkpoints/V168_HOLDOUT_ASSET_INTAKE_REQUIREMENTS_20260829.md
  CHECKPOINT: docs/checkpoints/CURRENT_STATE.md
  RECEIPT: debug/v168-holdout/provenance-gate-selftest-receipt.json
  CUDA_VISIBLE_DEVICES: ""
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  selftest-once:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact V168 provenance self-test arm
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.21'

      - name: Verify non-scoring provenance self-test boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v168-holdout-provenance-gate-selftest.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"

          test "$(git hash-object "$BASE_VALIDATOR")" = "c9e0b00ffe9cddf8138e63843afa98a715fed579"
          test "$(git hash-object "$PROVENANCE_VALIDATOR")" = "9edb8a65cc809d7fe42a288d6a00cfc602f37dcc"
          test "$(git hash-object "$INTAKE_DOC")" = "3064b8e9000fbab1b031ed32389cb82aab846876"
          test "$(git hash-object "$CHECKPOINT")" = "a4b413ccd1f25ac56c3788ea69fc656d8974182e"
          test ! -e "$RECEIPT"

          python -m py_compile "$BASE_VALIDATOR" "$PROVENANCE_VALIDATOR"

          python - <<'PY'
          from pathlib import Path
          text = Path('validation/v168_holdout/validate_holdout_asset_provenance_v168.py').read_text()
          forbidden = (
              'frontend-reference-payload.json',
              'score_frontend_reference.py',
              '--scorer-code',
              'score_stream(',
          )
          for token in forbidden:
              assert token not in text, token
          assert 'referenceBytesAccessibleToCandidateGeneration' in text
          assert 'derivedFromModelOrCandidateOutput' in text
          assert 'sourceAudioSha256' in text
          assert 'pairBinding' in text
          PY

      - name: Run synthetic metadata self-test only
        shell: bash
        run: |
          set -euo pipefail
          python "$PROVENANCE_VALIDATOR" --self-test | tee /tmp/v168-provenance-selftest.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/v168-provenance-selftest.json'))
          assert data['status'] == 'SELF_TEST_PASS'
          assert data['validSongCount'] == 2
          assert data['referenceFacingScoreCalls'] == 0
          assert data['negativeCasesRejected'] == [
              'source-reference-hash-binding',
              'model-derived-reference',
              'candidate-generation-reference-access',
              'unfrozen-provenance',
              'scorer-incompatible-reference',
          ]
          PY

      - name: Freeze self-test receipt and self-seal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RECEIPT")"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          selftest = json.load(open('/tmp/v168-provenance-selftest.json'))
          receipt = {
              'schema': 'dadrock.tabs.v168.holdout-provenance-gate-selftest-receipt.v1',
              'version': 'V168',
              'status': 'V168_HOLDOUT_PROVENANCE_GATE_SELF_TEST_FROZEN',
              'workflowRunId': int(os.environ['GITHUB_RUN_ID']),
              'workflowRunNumber': int(os.environ['GITHUB_RUN_NUMBER']),
              'workflowRunAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'workflowHeadSha': os.environ['GITHUB_SHA'],
              'baseAdmissionValidatorGitBlob': 'c9e0b00ffe9cddf8138e63843afa98a715fed579',
              'provenanceValidatorGitBlob': '9edb8a65cc809d7fe42a288d6a00cfc602f37dcc',
              'intakeRequirementsGitBlob': '3064b8e9000fbab1b031ed32389cb82aab846876',
              'selfTest': selftest,
              'policy': {
                  'syntheticMetadataOnly': True,
                  'sourceAudioBytesRead': False,
                  'professionalReferenceBytesRead': False,
                  'professionalReferenceNoteEventsRead': False,
                  'generatedCandidatesRead': False,
                  'scorerRead': False,
                  'referenceFacingScoreCalls': 0,
                  'holdoutAssetsAdmitted': 0,
                  'referenceFacingScoringArmed': False,
                  'mainOrProductionModified': False,
                  'gpuCudaModalUsed': False,
              },
          }
          Path('debug/v168-holdout/provenance-gate-selftest-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY

          rm .github/workflows/v168-holdout-provenance-gate-selftest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$RECEIPT" .github/workflows/v168-holdout-provenance-gate-selftest.yml
          changed="$(git diff --cached --name-only)"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 2
          printf '%s\n' "$changed" | grep -Fx "$RECEIPT"
          printf '%s\n' "$changed" | grep -Fx '.github/workflows/v168-holdout-provenance-gate-selftest.yml'
          git commit -m "research: freeze V168 holdout provenance gate self-test [skip ci]"
          git push origin HEAD:"$BRANCH"
