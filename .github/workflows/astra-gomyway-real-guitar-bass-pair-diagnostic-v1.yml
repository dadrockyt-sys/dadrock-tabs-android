name: Astra Go My Way Real Guitar Bass Pair Diagnostic V1

on:
  push:
    branches: [astra-work]
    paths:
      - 'astra_backend/evaluation/gomyway_real_guitar_bass_pair_diagnostic_v1.py'
      - '.github/workflows/astra-gomyway-real-guitar-bass-pair-diagnostic-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'scipy==1.11.4' soundfile torch onnxruntime tensorflow-cpu==2.16.1 tensorflow-hub==0.16.1

      - name: Verify immutable source
        run: test "$(git hash-object public/gomywayfullaitest.m4a)" = "5e34fb55fbd011c55b56bc40cc5d062735b3fcd0"

      - name: Decode source
        run: ffmpeg -hide_banner -loglevel error -y -i public/gomywayfullaitest.m4a -ar 44100 -ac 2 -c:a pcm_f32le gomywayfullaitest.wav

      - name: Download and verify BS-Roformer
        run: |
          set -euo pipefail
          mkdir -p models/bs-roformer
          python - <<'PY'
          from pathlib import Path
          import hashlib, urllib.request
          p=Path("models/bs-roformer/bs_roformer_sw_6stem_fp16.onnx")
          urllib.request.urlretrieve("https://huggingface.co/elicwhite/bs-roformer-sw-6stem-onnx/resolve/main/bs_roformer_sw_6stem_fp16.onnx",p)
          expected="d3d2bac77a7023282cb5f35a5807179e34076b60589867b572275f1a8ec36444"
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          if actual!=expected: raise SystemExit(actual)
          PY

      - name: Separate guitar and bass stems
        env:
          PYTHONPATH: ${{ github.workspace }}/astra_backend:${{ github.workspace }}/astra_backend/evaluation
        run: |
          python - <<'PY'
          from pathlib import Path
          import soundfile as sf
          from astra_backend.evaluation.bs_roformer_sw_6stem_adapter_v1 import BsRoformer6StemOnnxAdapter
          x,sr=sf.read("gomywayfullaitest.wav",dtype="float32",always_2d=True)
          stems=BsRoformer6StemOnnxAdapter(Path("models/bs-roformer/bs_roformer_sw_6stem_fp16.onnx")).separate_array(x,sr)
          sf.write("gomyway-guitar-stem.wav",stems["guitar"],sr,subtype="FLOAT")
          sf.write("gomyway-bass-stem.wav",stems["bass"],sr,subtype="FLOAT")
          PY

      - name: Run reference-blind real pair diagnostic
        run: |
          set -euo pipefail
          python astra_backend/evaluation/gomyway_real_guitar_bass_pair_diagnostic_v1.py \
            --guitar-wav gomyway-guitar-stem.wav \
            --bass-wav gomyway-bass-stem.wav \
            --output-json gomyway-real-guitar-bass-pair-diagnostic-v1.json
          sha256sum gomyway-guitar-stem.wav
          sha256sum gomyway-bass-stem.wav
          sha256sum gomyway-real-guitar-bass-pair-diagnostic-v1.json

      - uses: actions/upload-artifact@v4
        with:
          name: gomyway-real-guitar-bass-pair-diagnostic-v1
          path: gomyway-real-guitar-bass-pair-diagnostic-v1.json
          retention-days: 30

      - if: always()
        run: rm -rf models/bs-roformer gomywayfullaitest.wav gomyway-guitar-stem.wav gomyway-bass-stem.wav
