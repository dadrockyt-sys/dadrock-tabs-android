name: Songsterr EGFxSet V7 Real Evaluation One-Shot

on:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - .github/workflows/songsterr-egfxset-v7-real-evaluation-one-shot.yml

permissions:
  contents: read
  actions: read

jobs:
  egfxset-v7-real-evaluation-one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout prospectively frozen V7 evaluation state
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up frozen Python 3.10.21
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.21'

      - name: Install frozen DSP dependencies only
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'scipy==1.15.3'
          python - <<'PY'
          from importlib.metadata import version
          expected = {'numpy': '1.26.4', 'scipy': '1.15.3'}
          for package, wanted in expected.items():
              actual = version(package)
              if actual != wanted:
                  raise SystemExit(f'Unexpected {package} version: {actual}, wanted {wanted}')
              print(f'{package}={actual}')
          PY

      - name: Verify frozen dependency and new support Git blobs
        id: blobs
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local expected="$1"
            local path="$2"
            local actual
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "Blob mismatch for $path: $actual != $expected" >&2
              exit 1
            fi
            echo "$path=$actual"
          }
          check_blob 2b18ef0ee710a6ad5ecb27253b977495db7d6534 scripts/songsterr-fresh/onset_birth_corroboration_v6.py
          check_blob f9bef389f848c8f003ffa844b1eb2eea5754002d scripts/songsterr-fresh/qualify_basic_pitch_note_births_v2.py
          check_blob df57fcb808a654856826d2825e39854c9e3acb54 scripts/songsterr-fresh/clip_start_pitch_presence_v1.py
          check_blob dbb41317ec985009f0a87c907d2bd703caa12e66 scripts/songsterr-fresh/test_qualify_basic_pitch_note_births_v2.py
          check_blob 45b8f3b66df7500824071489205a732dfe05d759 scripts/songsterr-fresh/physical_template_plausibility_v3.py
          check_blob 7090e17baff60f91700a760f617e905ff53484ab scripts/songsterr-fresh/physical_template_plausibility_v3_iteration2.py
          check_blob 39629250c6d141d5cda9e9d7f570580ec725ae42 scripts/songsterr-fresh/physical_template_plausibility_v3_iteration3.py
          check_blob 6dfadda70db6b902f1dcc4d804f2d66da547314d scripts/songsterr-fresh/onset_birth_corroboration_v7.py
          check_blob a5443cae88f4ba49e5a9712822a5c371b67a1c30 scripts/songsterr-fresh/test_onset_birth_corroboration_v7_integration.py
          check_blob 79d7abd587b8ea055ce493f2e19bb02aab607296 scripts/songsterr-fresh/clip_start_pitch_presence_v7.py
          check_blob 54b1a4be41dcac1fe3f8e70cda1245a76036a4d2 scripts/songsterr-fresh/qualify_basic_pitch_note_births_v7.py
          check_blob 7d943cecdfdd6e0ec3d9623ee5547d56a601248e scripts/songsterr-fresh/test_qualify_basic_pitch_note_births_v7.py

      - name: Run prospectively frozen V7 boundary synthetic prerequisite
        id: synthetic
        run: python scripts/songsterr-fresh/test_qualify_basic_pitch_note_births_v7.py

      - name: Fetch and verify immutable prior Basic Pitch artifact
        id: model
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/egfxset-v7
          curl --fail --location --retry 0 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10383413992/zip" \
            --output /tmp/egfxset-v7/prior-artifact.zip
          echo 'c380d39bdee5c3ec2827c1ae682e83b71eabe3bc738fa27016d3bb409afe566a  /tmp/egfxset-v7/prior-artifact.zip' | sha256sum --check --strict
          unzip -p /tmp/egfxset-v7/prior-artifact.zip basic-pitch.json > /tmp/egfxset-v7/basic-pitch.json
          echo '24bffdb267c580625cb8049bdbe6bc1b74549ae8e048a759f26eb24e49d6dc51  /tmp/egfxset-v7/basic-pitch.json' | sha256sum --check --strict
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('/tmp/egfxset-v7/basic-pitch.json', 'utf8'));
          if (p?.noteInferenceIdentity?.sha256 !== '2e30685479444a8120dc3490c9c41329a89e57aa16979de42053b89a4bbb0444') {
            throw new Error('Immutable note identity mismatch');
          }
          const mids = (p.notes ?? []).map((n) => n.midi);
          if (JSON.stringify(mids) !== JSON.stringify([40, 68])) {
            throw new Error(`Unexpected immutable proposals: ${JSON.stringify(mids)}`);
          }
          if (p?.diagnostics?.predictInvocationCount !== 1) {
            throw new Error('Prior artifact did not record exactly one inference');
          }
          console.log(JSON.stringify({ priorProposalMidis: mids, noteIdentitySha256: p.noteInferenceIdentity.sha256 }));
          NODE

      - name: Fetch exact frozen EGFxSet member
        id: media
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 0 \
            'https://zenodo.org/records/7044411/files/Clean.zip?download=1' \
            --output /tmp/egfxset-v7/Clean.zip
          echo 'cdb1b401960f56becc8640387910e78a  /tmp/egfxset-v7/Clean.zip' | md5sum --check --strict
          unzip -p /tmp/egfxset-v7/Clean.zip 'Clean/Bridge/6-0.wav' > /tmp/egfxset-v7/6-0.wav
          test -s /tmp/egfxset-v7/6-0.wav
          echo '0256fd3c55c577970a4c2a06d760cf5798591adecffaa5e790addc38d1f0378e  /tmp/egfxset-v7/6-0.wav' | sha256sum --check --strict
          test "$(wc -c < /tmp/egfxset-v7/6-0.wav)" -eq 722976

      - name: Run boundary-aware V7 qualifier exactly once
        id: qualify
        shell: bash
        run: |
          set -euo pipefail
          python scripts/songsterr-fresh/qualify_basic_pitch_note_births_v7.py \
            --audio /tmp/egfxset-v7/6-0.wav \
            --model-notes /tmp/egfxset-v7/basic-pitch.json \
            --output /tmp/egfxset-v7/qualification-v7.json

      - name: Score prospectively frozen V7 diagnostic rule
        id: score
        if: always()
        env:
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          BLOBS_OUTCOME: ${{ steps.blobs.outcome }}
          SYNTHETIC_OUTCOME: ${{ steps.synthetic.outcome }}
          MODEL_OUTCOME: ${{ steps.model.outcome }}
          MEDIA_OUTCOME: ${{ steps.media.outcome }}
          QUALIFY_OUTCOME: ${{ steps.qualify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/egfxset-v7
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { enumeratePlayablePositions } from './songsterr_pipeline/index.mjs';

          const root = '/tmp/egfxset-v7';
          const read = (name) => {
            const path = `${root}/${name}`;
            return fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : null;
          };
          const sha = (name) => {
            const path = `${root}/${name}`;
            return fs.existsSync(path) ? crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex') : null;
          };
          const finite = (value) => typeof value === 'number' && Number.isFinite(value);

          const model = read('basic-pitch.json');
          const qualification = read('qualification-v7.json');
          const rawProposalMidis = (model?.notes ?? []).map((n) => n.midi);
          const rows = qualification?.proposals ?? [];
          const row40 = rows.find((row) => row.midi === 40) ?? null;
          const row68 = rows.find((row) => row.midi === 68) ?? null;
          const insufficientCount = rows.filter((row) => row.status === 'insufficient').length;
          const promotedMidis = rows.filter((row) => row.status === 'corroborated').map((row) => row.midi);
          const rejectedMidis = rows.filter((row) => row.status === 'rejected').map((row) => row.midi);
          const config = { role: 'lead', tuningMidi: [40, 45, 50, 55, 59, 64], capoFret: 0 };
          const promotedPositions = promotedMidis.map((midi) => ({ midi, positions: enumeratePlayablePositions(midi, config) }));

          const stepOutcomes = {
            deps: process.env.DEPS_OUTCOME ?? 'unknown',
            blobs: process.env.BLOBS_OUTCOME ?? 'unknown',
            synthetic: process.env.SYNTHETIC_OUTCOME ?? 'unknown',
            model: process.env.MODEL_OUTCOME ?? 'unknown',
            media: process.env.MEDIA_OUTCOME ?? 'unknown',
            qualify: process.env.QUALIFY_OUTCOME ?? 'unknown',
          };
          const prerequisitesPass = Object.values(stepOutcomes).every((value) => value === 'success');
          const inputsPass = prerequisitesPass
            && sha('basic-pitch.json') === '24bffdb267c580625cb8049bdbe6bc1b74549ae8e048a759f26eb24e49d6dc51'
            && qualification?.provenance?.audioSha256 === '0256fd3c55c577970a4c2a06d760cf5798591adecffaa5e790addc38d1f0378e'
            && model?.noteInferenceIdentity?.sha256 === '2e30685479444a8120dc3490c9c41329a89e57aa16979de42053b89a4bbb0444'
            && JSON.stringify(rawProposalMidis) === JSON.stringify([40, 68])
            && qualification?.contract === 'songsterr-fresh-model-note-qualification-v7-boundary-research'
            && qualification?.version === 7
            && qualification?.candidateConfidenceUsedForDecision === false
            && qualification?.provenance?.syntheticPreContextUsed === false;

          const row40Pass = row40?.status === 'corroborated'
            && row40?.provenance?.qualificationMode === 'clip-start-one-sided-pitch-presence-v7'
            && row40?.provenance?.method === 'clip-start-post-spectrum-evidence-v7'
            && row40?.provenance?.evidenceKind === 'clip-start-post-spectrum-evidence'
            && row40?.provenance?.syntheticPreContextUsed === false
            && row40?.provenance?.leftBoundaryZeroPaddingSamples === 0
            && finite(row40?.provenance?.necessityFraction)
            && row40.provenance.necessityFraction >= 0.01
            && finite(row40?.provenance?.candidateEvidenceFraction)
            && row40.provenance.candidateEvidenceFraction >= 0.10
            && Array.isArray(row40?.provenance?.vetoingOwners)
            && row40.provenance.vetoingOwners.length === 0;

          const row68Pass = row68?.status === 'rejected'
            && row68?.provenance?.qualificationMode === 'normal-in-clip-onset-birth-v7'
            && row68?.provenance?.syntheticPreContextUsed === false;

          const qualificationPass = rows.length === 2
            && row40Pass
            && row68Pass
            && insufficientCount === 0;
          const promotionPass = JSON.stringify(promotedMidis) === JSON.stringify([40])
            && JSON.stringify(rejectedMidis) === JSON.stringify([68]);
          const positionPass = promotedPositions.length === 1
            && promotedPositions[0].midi === 40
            && promotedPositions[0].positions.length === 1
            && promotedPositions[0].positions[0].stringNumberHighToLow === 6
            && promotedPositions[0].positions[0].fret === 0
            && promotedPositions[0].positions[0].reconstructedMidi === 40;
          const overallPass = inputsPass && qualificationPass && promotionPass && positionPass;

          const result = {
            contract: 'songsterr-fresh-egfxset-v7-real-evaluation-one-shot-v1',
            nonAuthoritative: true,
            prospectivePre: 'docs/checkpoints/SONGSTERR_FRESH_V7_REAL_EVALUATION_PRE.md',
            historicalBoundaryV2Remains: 'FAIL_BOUNDARY_V2_NON_AUTHORIZING_DIAGNOSTIC',
            frozenV7IntegrationRemains: 'PASS_SYNTHETIC_MECHANICAL_INTEGRATION',
            basicPitchInvokedThisRun: false,
            immutableInput: {
              priorRun: 34936227380,
              priorArtifact: 10383413992,
              priorArtifactZipSha256: 'c380d39bdee5c3ec2827c1ae682e83b71eabe3bc738fa27016d3bb409afe566a',
              basicPitchJsonSha256: sha('basic-pitch.json'),
              noteIdentitySha256: model?.noteInferenceIdentity?.sha256 ?? null,
              rawProposalMidis,
              egfxsetArchiveMd5: 'cdb1b401960f56becc8640387910e78a',
              audioMember: 'Clean.zip#Clean/Bridge/6-0.wav',
              audioSha256: qualification?.provenance?.audioSha256 ?? null,
              audioBytesExpected: 722976,
            },
            stepOutcomes,
            syntheticPrerequisitePassed: stepOutcomes.synthetic === 'success',
            realMediaFetched: stepOutcomes.media === 'success',
            qualificationExecuted: stepOutcomes.qualify === 'success',
            qualificationSha256: sha('qualification-v7.json'),
            proposalRows: rows,
            insufficientCount,
            promotedMidis,
            rejectedMidis,
            promotedPositions,
            gates: {
              inputsPass,
              row40Pass,
              row68Pass,
              qualificationPass,
              promotionPass,
              positionPass,
            },
            score: overallPass
              ? 'PASS_V7_REAL_EVALUATION_NON_AUTHORIZING_DIAGNOSTIC'
              : 'FAIL_V7_REAL_EVALUATION_NON_AUTHORIZING_DIAGNOSTIC',
            globalAuthorization: {
              realCalibrationAuthorized: false,
              realHoldoutCaptureAuthorized: false,
              basicPitchAuthorized: false,
              v6Authorized: false,
              correctnessAuthorized: false,
              modelValidationComplete: false,
              customerEligibleEvents: 0,
              mayAdvanceDelivery: false,
            },
          };
          fs.writeFileSync(`${root}/result-v7.json`, JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result));
          if (!overallPass) process.exit(1);
          NODE

      - name: Upload immutable V7 one-shot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songsterr-egfxset-v7-real-evaluation-one-shot
          if-no-files-found: error
          retention-days: 90
          path: |
            /tmp/egfxset-v7/result-v7.json
            /tmp/egfxset-v7/qualification-v7.json
            /tmp/egfxset-v7/basic-pitch.json
