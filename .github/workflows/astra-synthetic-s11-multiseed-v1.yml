name: Astra synthetic S11 multi-seed diversity robustness v1

on:
  push:
    branches:
      - astra-work
    paths:
      - 'docs/astra/SYNTHETIC_DATA_DIVERSITY_S11_LAUNCH_V1.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: astra-synthetic-s11-multiseed-v1
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'
      - name: Verify standing authorization and source pins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          blob=lambda p: subprocess.check_output(['git','hash-object',p],text=True).strip()
          a=json.load(open('docs/astra/SYNTHETIC_DATA_DIVERSITY_S11_AUTHORIZATION_V1.json'))
          l=json.load(open('docs/astra/SYNTHETIC_DATA_DIVERSITY_S11_LAUNCH_V1.json'))
          assert a['schema']=='astra-synthetic-data-diversity-s11-authorization-v1'
          assert a['standingPolicy']['inexpensiveGitHubModelRunsPreauthorized'] is True
          z=a['authorization']
          assert z['maxModels']==6 and z['maxOptimizerStepsPerModel']==500
          assert not z['automaticRetryAuthorized'] and not z['thresholdSearchAuthorized']
          assert not z['p1Authorized'] and not z['p2Authorized'] and not z['p3Authorized']
          assert not z['codespacesAuthorized'] and not z['vercelAuthorized']
          paths={
            'designGitBlob':'docs/astra/SYNTHETIC_DATA_DIVERSITY_S11_DESIGN_V1.md',
            'generatorGitBlob':'astra_backend/synthetic/s0_pilot_v1.py',
            's9DatasetGitBlob':'astra_backend/synthetic/s9_pilot_v1.py',
            'runnerGitBlob':'astra_backend/synthetic/s11_pilot_v1.py',
            'testsGitBlob':'astra_backend/synthetic/test_s11_pilot_v1.py',
            'runtimeLockGitBlob':'astra_backend/tabcnn_runtime/requirements.lock.txt',
            'workflowGitBlob':'.github/workflows/astra-synthetic-s11-multiseed-v1.yml',
          }
          for k,p in paths.items():
              assert a['sourceIdentities'][k]==blob(p),(k,'auth')
              assert l['sourceIdentities'][k]==blob(p),(k,'launch')
          assert l['authorizationGitBlob']==blob('docs/astra/SYNTHETIC_DATA_DIVERSITY_S11_AUTHORIZATION_V1.json')
          PY
      - name: Install exact CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          python -m pip check
      - name: Run S11 focused tests
        run: PYTHONPATH=astra_backend python astra_backend/synthetic/test_s11_pilot_v1.py
      - name: Regenerate paired S9 datasets once
        run: |
          mkdir -p /tmp/astra-s11
          PYTHONPATH=astra_backend python astra_backend/synthetic/s0_pilot_v1.py generate             --out /tmp/astra-s11/control.npz --receipt /tmp/astra-s11/control-render-receipt.json
          PYTHONPATH=astra_backend python astra_backend/synthetic/s9_pilot_v1.py build-intervention             --control-dataset /tmp/astra-s11/control.npz             --out /tmp/astra-s11/intervention.npz             --receipt /tmp/astra-s11/intervention-receipt.json
      - name: Run six capped S11 models
        run: |
          PYTHONPATH=astra_backend python astra_backend/synthetic/s11_pilot_v1.py             --control-dataset /tmp/astra-s11/control.npz             --intervention-dataset /tmp/astra-s11/intervention.npz             --out /tmp/astra-s11/result.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/astra-s11/result.json'))
          assert x['execution']['modelCount']==6
          assert x['execution']['optimizerStepsTotal']<=3000
          assert x['runSeeds']==[20260927,20260928,20260929]
          assert x['execution']['thresholdSearch'] is False and x['execution']['automaticRetry'] is False
          assert not x['guards']['p1Accessed'] and not x['guards']['p2Accessed'] and not x['guards']['p3Opened']
          assert not x['guards']['codespacesUsed'] and not x['guards']['vercelUsed']
          PY
      - name: Upload bounded S11 evidence
        uses: actions/upload-artifact@v4
        with:
          name: astra-synthetic-data-diversity-s11-v1
          path: |
            /tmp/astra-s11/control-render-receipt.json
            /tmp/astra-s11/intervention-receipt.json
            /tmp/astra-s11/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/astra-s11
