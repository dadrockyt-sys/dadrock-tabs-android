name: V167 score frozen temporal-recurrence Guitar variants

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v167-score-temporal-recurrence-guitar-variants.yml

permissions:
  contents: write

concurrency:
  group: v167-score-temporal-recurrence-guitar-variants-once
  cancel-in-progress: false

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: b85b8999e9749b3833bca6ed86c45cabf2c75527
  I005: debug/v167-single-song-calibration/iteration-005-generated.json
  VARIANT_ROOT: debug/v167-single-song-calibration/temporal-recurrence-variants
  MANIFEST: debug/v167-single-song-calibration/temporal-recurrence-guitar-manifest.json
  GENERATION_RECEIPT: debug/v167-single-song-calibration/temporal-recurrence-generation-receipt.json
  GRADER: validation/v167_single_song_calibration/score_temporal_recurrence_guitar_variants_v167.py
  SCORER: validation/v154_cpu_multitrack/score_frontend_reference.py
  REFERENCE: research/v154-professional-references/scorer-ready/frontend-reference-payload.json
  OUTPUT: debug/v167-single-song-calibration/temporal-recurrence-guitar-sweep.json
  RECEIPT: debug/v167-single-song-calibration/temporal-recurrence-guitar-sweep-receipt.json
  CUDA_VISIBLE_DEVICES: ""
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  score-once:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact recurrence scoring arm
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.21'

      - name: Verify complete frozen pre-reference boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v167-score-temporal-recurrence-guitar-variants.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"

          test "$(git hash-object "$I005")" = "8d68f4d7fac4e094bcd617b026befddd370d9368"
          test "$(git hash-object "$MANIFEST")" = "76077bdbad3e519a09e3105633bc14b8aedb1fe9"
          test "$(git hash-object "$GENERATION_RECEIPT")" = "72dd00101541c8bd63f2271c4cea514f63cdbb3c"
          test "$(git hash-object "$GRADER")" = "e8251df48d03e94a2d53060bc1e82b4e9d5ba4f7"
          test "$(git hash-object docs/checkpoints/CURRENT_STATE.md)" = "433a973fbd6b55edd8dbe0642dd828e45c7ff505"

          test "$(git hash-object "$VARIANT_ROOT/recur-repro-i005.json")" = "73e5ef69a58d42ac511fe16b3c9da8c1060c8002"
          test "$(git hash-object "$VARIANT_ROOT/recur-gap1-earliest.json")" = "13f2613403b82d45ce5fc5c18da26e66dd04e886"
          test "$(git hash-object "$VARIANT_ROOT/recur-gap1-strongest.json")" = "7299ef6d1d31e8157a7a0d7e9d9169aa279fb86b"
          test "$(git hash-object "$VARIANT_ROOT/recur-gap2-strongest.json")" = "10322fcadf4081a833795a03a2deadee33f3cfa6"

          # Identity only: working-tree scorer/reference bytes are not opened here.
          test "$(git rev-parse "HEAD:$SCORER")" = "9644e65719fbd361a9b39778ae9950c5e983e855"
          test "$(git rev-parse "HEAD:$REFERENCE")" = "2fbed60b543c0488934d8642c488aa06bf31bbf5"

          test ! -e "$OUTPUT"
          test ! -e "$RECEIPT"
          python -m py_compile "$GRADER"

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          checks = {
              'debug/v167-single-song-calibration/iteration-005-generated.json': '86329ebc25e589f566d466a7a65cae35a158c25f470b1c034973f3dbc7d38b31',
              'debug/v167-single-song-calibration/temporal-recurrence-guitar-manifest.json': '5e0eaedcf3e78e3b0c4213004a51cc04d935418315f0a281708e36d637b21ed5',
              'debug/v167-single-song-calibration/temporal-recurrence-variants/recur-repro-i005.json': 'ba95511e2a92fa00a5bb335ec7913ea8f8b7559a583fc49874ee8159ea535f19',
              'debug/v167-single-song-calibration/temporal-recurrence-variants/recur-gap1-earliest.json': 'a72ce501c6d4cdbcbbdc67370ef2b35b88ad2358921d1de90f86d7f5af4c4dbe',
              'debug/v167-single-song-calibration/temporal-recurrence-variants/recur-gap1-strongest.json': '0092a24e36ae8857a531dba254764d431811133d6d23df318615202557c13f49',
              'debug/v167-single-song-calibration/temporal-recurrence-variants/recur-gap2-strongest.json': '012768977ba5f06036c04d25462e5ac47e45f4fa44e0672861f113e3fb21228b',
          }
          for path, expected in checks.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert actual == expected, (path, actual, expected)

          manifest = json.load(open('debug/v167-single-song-calibration/temporal-recurrence-guitar-manifest.json'))
          receipt = json.load(open('debug/v167-single-song-calibration/temporal-recurrence-generation-receipt.json'))
          assert manifest['status'] == 'FROZEN_BEFORE_REFERENCE_SCORING'
          assert receipt['status'] == 'TEMPORAL_RECURRENCE_VARIANTS_FROZEN_BEFORE_SCORING'
          assert receipt['manifestSha256'] == '5e0eaedcf3e78e3b0c4213004a51cc04d935418315f0a281708e36d637b21ed5'
          assert receipt['manifestGitBlob'] == '76077bdbad3e519a09e3105633bc14b8aedb1fe9'
          assert receipt['policy']['professionalReferenceReadByGenerationWorkflow'] is False
          assert receipt['policy']['scorerReadByGenerationWorkflow'] is False
          assert receipt['policy']['newReferenceFacingScoreCalls'] == 0
          assert receipt['policy']['allCandidateHashesFrozenBeforeScoring'] is True
          assert manifest['policy']['newGuitarVariantScoreCallsPlanned'] == 3
          assert manifest['policy']['bassScoreCallsPlanned'] == 0
          assert manifest['policy']['reproductionControlScored'] is False
          assert manifest['policy']['automaticIteration006Promotion'] is False
          assert manifest['policy']['noThresholdSweep'] is True
          assert manifest['policy']['promotionEligibility'] == {
              'minimumF1GainPercentagePointsVsI005': 0.1,
              'precisionMustBeAtLeastI005': True,
          }
          expected = {
              'recur-repro-i005': ('ba95511e2a92fa00a5bb335ec7913ea8f8b7559a583fc49874ee8159ea535f19', 48, True),
              'recur-gap1-earliest': ('a72ce501c6d4cdbcbbdc67370ef2b35b88ad2358921d1de90f86d7f5af4c4dbe', 43, False),
              'recur-gap1-strongest': ('0092a24e36ae8857a531dba254764d431811133d6d23df318615202557c13f49', 43, False),
              'recur-gap2-strongest': ('012768977ba5f06036c04d25462e5ac47e45f4fa44e0672861f113e3fb21228b', 40, False),
          }
          for row in manifest['variants']:
              sha, kept, repro = expected[row['id']]
              assert row['sha256'] == sha
              assert row['summary']['keptI005Additions'] == kept
              assert row['reproductionControl'] is repro
              assert row['counts']['bass'] == 512
          assert {row['id'] for row in manifest['variants']} == set(expected)
          PY

      - name: Score exactly three frozen Guitar whole rules
        shell: bash
        run: |
          set -euo pipefail
          # First working-tree scorer/reference read occurs inside this command.
          python "$GRADER" \
            --variant-root "$VARIANT_ROOT" \
            --manifest "$MANIFEST" \
            --i005 "$I005" \
            --reference "$REFERENCE" \
            --scorer-code "$SCORER" \
            --output "$OUTPUT"

          python - <<'PY'
          import json
          report = json.load(open('debug/v167-single-song-calibration/temporal-recurrence-guitar-sweep.json'))
          assert report['schema'] == 'dadrock.tabs.v167.temporal-recurrence-guitar-sweep.v1'
          assert report['status'] == 'REFERENCE_GRADED_COMPLETE_PREDECLARED_TEMPORAL_RECURRENCE_VARIANTS'
          assert report['manifestSha256'] == '5e0eaedcf3e78e3b0c4213004a51cc04d935418315f0a281708e36d637b21ed5'
          assert report['referenceSha256'] == 'b39a203aec3f45800891fe4eca156e37e7571b91ea5c4ccc41b30bbc95fc89e7'
          assert report['selectionPolicy']['guitarScoreCalls'] == 3
          assert report['selectionPolicy']['bassScoreCalls'] == 0
          assert report['selectionPolicy']['reproductionControlScoreCalls'] == 0
          assert report['selectionPolicy']['automaticIteration006Promotion'] is False
          assert report['selectionPolicy']['postScoreCandidateMutation'] is False
          assert report['selectionPolicy']['postScoreRetuning'] is False
          assert report['reproductionControl']['normalizedGuitarExactlyI005'] is True
          assert report['reproductionControl']['normalizedBassExactlyI005'] is True
          assert report['reproductionControl']['scoreCalls'] == 0
          assert len(report['variants']) == 3
          assert {row['id'] for row in report['variants']} == {
              'recur-gap1-earliest', 'recur-gap1-strongest', 'recur-gap2-strongest'
          }
          assert report['policy']['iteration006CreatedByThisSweep'] is False
          assert report['policy']['bassStreamScored'] is False
          print(json.dumps({
              'winner': report['winnerIncludingI005Baseline'],
              'newVariantsBeatingI005': report['newVariantsBeatingI005'],
              'newVariantsMeetingPromotionEligibility': report['newVariantsMeetingPromotionEligibility'],
          }, indent=2, sort_keys=True))
          PY

      - name: Freeze recurrence scoring receipt and self-seal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          output = Path('debug/v167-single-song-calibration/temporal-recurrence-guitar-sweep.json')
          receipt_path = Path('debug/v167-single-song-calibration/temporal-recurrence-guitar-sweep-receipt.json')
          report = json.loads(output.read_text())
          receipt = {
              'schema': 'dadrock.tabs.v167.temporal-recurrence-guitar-sweep-receipt.v1',
              'version': 'V167',
              'status': 'TEMPORAL_RECURRENCE_GUITAR_SWEEP_FROZEN',
              'classification': 'SINGLE_SONG_TRAINING_CALIBRATION_ONLY',
              'workflowRunId': int(os.environ['GITHUB_RUN_ID']),
              'workflowRunNumber': int(os.environ['GITHUB_RUN_NUMBER']),
              'workflowRunAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'workflowHeadSha': os.environ['GITHUB_SHA'],
              'reportSha256': hashlib.sha256(output.read_bytes()).hexdigest(),
              'reportGitBlob': subprocess.check_output(['git', 'hash-object', str(output)], text=True).strip(),
              'manifestSha256': report['manifestSha256'],
              'manifestGitBlob': '76077bdbad3e519a09e3105633bc14b8aedb1fe9',
              'generationReceiptGitBlob': '72dd00101541c8bd63f2271c4cea514f63cdbb3c',
              'implementation': {
                  'graderGitBlob': 'e8251df48d03e94a2d53060bc1e82b4e9d5ba4f7',
                  'scorerGitBlob': '9644e65719fbd361a9b39778ae9950c5e983e855',
              },
              'reference': {
                  'gitBlob': '2fbed60b543c0488934d8642c488aa06bf31bbf5',
                  'sha256': report['referenceSha256'],
              },
              'scoreCallBoundary': {
                  'guitar': report['selectionPolicy']['guitarScoreCalls'],
                  'bass': report['selectionPolicy']['bassScoreCalls'],
                  'reproductionControl': report['selectionPolicy']['reproductionControlScoreCalls'],
              },
              'winnerIncludingI005Baseline': report['winnerIncludingI005Baseline'],
              'newVariantsBeatingI005': report['newVariantsBeatingI005'],
              'newVariantsMeetingPromotionEligibility': report['newVariantsMeetingPromotionEligibility'],
              'variants': report['variants'],
              'policy': {
                  'allCandidatesFrozenBeforeReferenceRead': True,
                  'individualEventSelectionByReference': False,
                  'postScoreCandidateMutation': False,
                  'postScoreRetuning': False,
                  'iteration006Created': False,
                  'bassScored': False,
                  'reproductionControlScored': False,
                  'gpuCudaModalUsed': False,
                  'mainOrProductionModified': False,
                  'generalizationClaim': False,
              },
          }
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

          rm .github/workflows/v167-score-temporal-recurrence-guitar-variants.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$OUTPUT" "$RECEIPT" .github/workflows/v167-score-temporal-recurrence-guitar-variants.yml
          changed="$(git diff --cached --name-only)"
          if echo "$changed" | grep -Ev '^debug/v167-single-song-calibration/temporal-recurrence-guitar-sweep(-receipt)?\.json$|^\.github/workflows/v167-score-temporal-recurrence-guitar-variants\.yml$'; then
            echo 'Unexpected recurrence scoring path' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 3
          git commit -m "research: freeze V167 temporal recurrence Guitar sweep [skip ci]"
          git push origin HEAD:"$BRANCH"
