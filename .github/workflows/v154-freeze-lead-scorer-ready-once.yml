name: V154 freeze Lead scorer-ready once

on:
  push:
    branches: [v143-contextual-prune-lobo]
    paths: [.github/workflows/v154-freeze-lead-scorer-ready-once.yml]

permissions:
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 1
      - name: Build candidate-blind Lead scorer-ready reference
        run: python validation/v154_cpu_multitrack/build_lead_scorer_ready.py
      - name: Commit Lead scorer-ready and self-seal
        run: |
          set -euo pipefail
          rm .github/workflows/v154-freeze-lead-scorer-ready-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/v154-professional-references/scorer-ready/lead-scorer-ready.json \
                  research/v154-professional-references/scorer-ready/lead-scorer-ready-receipt.json \
                  .github/workflows/v154-freeze-lead-scorer-ready-once.yml
          git commit -m "research: freeze Lead scorer-ready reference [skip ci]"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
