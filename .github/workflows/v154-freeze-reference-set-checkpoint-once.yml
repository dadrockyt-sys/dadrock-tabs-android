name: V154 freeze reference set checkpoint once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v154-freeze-reference-set-checkpoint-once.yml

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0
      - name: Append frozen reference checkpoint
        shell: bash
        run: |
          set -euo pipefail
          marker='## V154 three-part professional reference set — RECEIVED / IDENTITY FROZEN — 2026-08-27 UTC'
          if grep -Fq "$marker" docs/checkpoints/CURRENT_STATE.md; then
            echo 'checkpoint already present'
            exit 0
          fi
          cat docs/checkpoints/V154_REFERENCE_SET_FROZEN_20260827.md >> docs/checkpoints/CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/checkpoints/CURRENT_STATE.md
          git commit -m 'docs: append V154 frozen reference checkpoint [skip ci]'
          git pull --rebase origin v143-contextual-prune-lobo
          git push origin HEAD:v143-contextual-prune-lobo
