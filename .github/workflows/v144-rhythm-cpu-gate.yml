permissions:
  contents: read

jobs:
  v144-rhythm-cpu-gate:
    name: V144 rhythm CPU policy + frozen V5 guards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify immutable V5 identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          test "$(git hash-object debug/v143-contextual-prune/v5-professional-pdf/final-professional-holdout-result.json)" = "511fd244f231b66d08306f97b5a47ed41f5415c7"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json | awk '{print $1}')" = "7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-rhythm-shadow.pdf | awk '{print $1}')" = "f4c1238e868cadfb90b8a359b1555b0b90e7740b9ebaa276aa394c8991f37ce5"

      - name: Verify V144 provenance safety contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('debug/v144-rhythm-calibration/reference/professional-target-provenance.json').read_text(encoding='utf-8'))
          assert payload['role'] == 'gold-calibration-reference-not-unseen-holdout'
          assert payload['visualTarget']['mainGitBlob'] == '16106197cc1269cca0b3c443908d5ef75e8b4d3e'
          assert payload['visualTarget']['verifiedFileSha256'] == 'aca2da3e8d551b2fd82b4ab3ecafa0c8932d6c0a27b54b6213ffc990ca08a9a9'
          assert payload['structuredTarget']['builtReferenceSha256'] == '18fd868ae960dfcdd1ffb0110f1a9dfd8acc2ffeb46e247d1116cd54291526ac'
          assert payload['safety']['v5FinalHoldoutConsumed'] is True
          assert payload['safety']['v5ResultMayBeModified'] is False
          assert payload['safety']['v5CandidateMayBeModified'] is False
          assert payload['safety']['v5WorkflowMayBeRetried'] is False
          assert payload['safety']['mainMayBeModified'] is False
          assert payload['safety']['productionMayBeModified'] is False
          assert payload['safety']['modalGpuAuthorized'] is False
          assert payload['v144Usage']['mustLabelScoresAsCalibration'] is True
          assert payload['v144Usage']['mayClaimUnseenGeneralization'] is False
          PY

      - name: Compile V144 calibration tools without executing searches or diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile validation/v144_rhythm_calibration/search_contextual_pitch_shifts.py
          python -m py_compile validation/v144_rhythm_calibration/search_contextual_pitch_step_shifts.py
          python -m py_compile validation/v144_rhythm_calibration/search_contextual_pitch_position_shifts.py
          python -m py_compile validation/v144_rhythm_calibration/search_contextual_pitch_step_position_shifts.py
          python -m py_compile validation/v144_rhythm_calibration/search_atomic_onset_dyad_pitch_rewrites.py
          python -m py_compile validation/v144_rhythm_calibration/analyze_current_baseline_fit_mechanisms.py
          python -m py_compile validation/v144_rhythm_calibration/analyze_current_baseline_fit_onset_topology.py
          python -m py_compile modal/v144_rhythm_pitch_step_shift_policy.py
          python -m py_compile modal/v144_rhythm_pitch_position_shift_policy.py
          python -m py_compile modal/v144_rhythm_pitch_step_position_shift_policy.py
          python -m py_compile modal/v144_rhythm_onset_dyad_pitch_policy.py
          python -m py_compile modal/v144_rhythm_singleton_onset_replacement_policy.py

      - name: Run V144 rhythm CPU unit tests
        shell: bash
        run: |
          set -euo pipefail
          python modal/tests/test_v144_rhythm_context_split_policy.py -v
          python modal/tests/test_v144_rhythm_context_split_selector.py -v
          python modal/tests/test_v144_rhythm_staged_selector.py -v
          python modal/tests/test_v144_rhythm_conjunction_prune_policy.py -v
          python modal/tests/test_v144_rhythm_triple_conjunction_policy.py -v
          python modal/tests/test_v144_rhythm_quad_conjunction_policy.py -v
          python modal/tests/test_v144_rhythm_pitch_shift_policy.py -v
          python modal/tests/test_v144_rhythm_pitch_step_shift_policy.py -v
          python modal/tests/test_v144_rhythm_pitch_position_shift_policy.py -v
          python modal/tests/test_v144_rhythm_pitch_step_position_shift_policy.py -v
          python modal/tests/test_v144_rhythm_onset_dyad_pitch_policy.py -v
          python modal/tests/test_v144_rhythm_singleton_onset_replacement_policy.py -v
          python modal/tests/test_v144_rhythm_pitch_shift_search.py -v
          python modal/tests/test_v144_rhythm_pitch_step_shift_search.py -v
          python modal/tests/test_v144_rhythm_pitch_position_shift_search.py -v
          python modal/tests/test_v144_rhythm_pitch_step_position_shift_search.py -v
          python modal/tests/test_v144_rhythm_onset_dyad_pitch_search.py -v
          python modal/tests/test_v144_rhythm_current_baseline_fit_mechanisms.py -v
          python modal/tests/test_v144_rhythm_current_baseline_fit_onset_topology.py -v
          python modal/tests/test_v144_rhythm_measure_set_guard.py -v

      - name: Verify config stays CPU-safe and fallback-first
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('modal/configs/v144_rhythm_context_split_config.json').read_text(encoding='utf-8'))
          assert payload['instrument'] == 'rhythm'
          assert payload['requiredPdfEventFidelity'] == 1.0
          assert payload['holdoutMustRemainClosed'] is True
          assert payload['maximumPerMetricRegression'] == 0.0
          assert payload['maximumCanaryRegression'] == 0.0
          assert payload['maximumCriticalMismatchIncrease'] == 0
          assert payload['fitPercent'] + payload['validationPercent'] < 100
          PY
