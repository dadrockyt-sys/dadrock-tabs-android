      - debug/v144-rhythm-calibration/reference/professional-target-provenance.json

permissions:
  contents: read

jobs:
  v144-rhythm-cpu-gate:
    name: V144 rhythm CPU policy + frozen V5 guards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify immutable V5 identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          test "$(git hash-object debug/v143-contextual-prune/v5-professional-pdf/final-professional-holdout-result.json)" = "511fd244f231b66d08306f97b5a47ed41f5415c7"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json | awk '{print $1}')" = "7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-rhythm-shadow.pdf | awk '{print $1}')" = "f4c1238e868cadfb90b8a359b1555b0b90e7740b9ebaa276aa394c8991f37ce5"

      - name: Verify V144 provenance safety contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('debug/v144-rhythm-calibration/reference/professional-target-provenance.json').read_text(encoding='utf-8'))
          assert payload['role'] == 'gold-calibration-reference-not-unseen-holdout'
          assert payload['visualTarget']['mainGitBlob'] == '16106197cc1269cca0b3c443908d5ef75e8b4d3e'
          assert payload['visualTarget']['verifiedFileSha256'] == 'aca2da3e8d551b2fd82b4ab3ecafa0c8932d6c0a27b54b6213ffc990ca08a9a9'
          assert payload['structuredTarget']['builtReferenceSha256'] == '18fd868ae960dfcdd1ffb0110f1a9dfd8acc2ffeb46e247d1116cd54291526ac'
          assert payload['safety']['v5FinalHoldoutConsumed'] is True
          assert payload['safety']['v5ResultMayBeModified'] is False
          assert payload['safety']['v5CandidateMayBeModified'] is False
          assert payload['safety']['v5WorkflowMayBeRetried'] is False
          assert payload['safety']['mainMayBeModified'] is False
          assert payload['safety']['productionMayBeModified'] is False
          assert payload['safety']['modalGpuAuthorized'] is False
          assert payload['v144Usage']['mustLabelScoresAsCalibration'] is True
          assert payload['v144Usage']['mayClaimUnseenGeneralization'] is False
          PY

      - name: Compile V144 calibration tools without executing searches or diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile validation/v144_rhythm_calibration/search_contextual_pitch_shifts.py
          python -m py_compile validation/v144_rhythm_calibration/search_contextual_pitch_step_shifts.py
          python -m py_compile validation/v144_rhythm_calibration/search_contextual_pitch_position_shifts.py
          python -m py_compile validation/v144_rhythm_calibration/search_contextual_pitch_step_position_shifts.py
          python -m py_compile validation/v144_rhythm_calibration/search_atomic_onset_dyad_pitch_rewrites.py
          python -m py_compile validation/v144_rhythm_calibration/analyze_current_baseline_fit_mechanisms.py
          python -m py_compile validation/v144_rhythm_calibration/analyze_current_baseline_fit_onset_topology.py
          python -m py_compile modal/v144_rhythm_pitch_step_shift_policy.py
          python -m py_compile modal/v144_rhythm_pitch_position_shift_policy.py
          python -m py_compile modal/v144_rhythm_pitch_step_position_shift_policy.py
          python -m py_compile modal/v144_rhythm_onset_dyad_pitch_policy.py

      - name: Run V144 rhythm CPU unit tests
        shell: bash
        run: |
          set -euo pipefail
          python modal/tests/test_v144_rhythm_context_split_policy.py -v
          python modal/tests/test_v144_rhythm_context_split_selector.py -v
          python modal/tests/test_v144_rhythm_staged_selector.py -v
          python modal/tests/test_v144_rhythm_conjunction_prune_policy.py -v
          python modal/tests/test_v144_rhythm_triple_conjunction_policy.py -v
          python modal/tests/test_v144_rhythm_quad_conjunction_policy.py -v
          python modal/tests/test_v144_rhythm_pitch_shift_policy.py -v
          python modal/tests/test_v144_rhythm_pitch_step_shift_policy.py -v
          python modal/tests/test_v144_rhythm_pitch_position_shift_policy.py -v
          python modal/tests/test_v144_rhythm_pitch_step_position_shift_policy.py -v
          python modal/tests/test_v144_rhythm_onset_dyad_pitch_policy.py -v
          python modal/tests/test_v144_rhythm_pitch_shift_search.py -v
          python modal/tests/test_v144_rhythm_pitch_step_shift_search.py -v
          python modal/tests/test_v144_rhythm_pitch_position_shift_search.py -v
          python modal/tests/test_v144_rhythm_pitch_step_position_shift_search.py -v
          python modal/tests/test_v144_rhythm_onset_dyad_pitch_search.py -v
          python modal/tests/test_v144_rhythm_current_baseline_fit_mechanisms.py -v
          python modal/tests/test_v144_rhythm_current_baseline_fit_onset_topology.py -v
          python modal/tests/test_v144_rhythm_measure_set_guard.py -v

      - name: Verify config stays CPU-safe and fallback-first
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('modal/configs/v144_rhythm_context_split_config.json').read_text(encoding='utf-8'))
          assert payload['instrument'] == 'rhythm'
          assert payload['requiredPdfEventFidelity'] == 1.0
          assert payload['holdoutMustRemainClosed'] is True
          assert payload['maximumPerMetricRegression'] == 0.0
          assert payload['maximumCanaryRegression'] == 0.0
          assert payload['maximumCriticalMismatchIncrease'] == 0
          assert payload['fitPercent'] + payload['validationPercent'] < 100
          PY

  fit-onset-topology-diagnostic-one-shot:
    name: V144 FIT onset topology diagnostic one shot
    needs: v144-rhythm-cpu-gate
    if: github.event_name == 'pull_request' && github.event.action == 'reopened' && github.event.pull_request.base.ref == 'noop' && github.event.pull_request.head.ref == 'v143-contextual-prune-lobo' && github.event.pull_request.title == 'V144 FIT topology diagnostic one shot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out exact PR head, never merge ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact one-shot arming commit and immutable identities
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "${PR_BASE}" = "noop"
          test "${PR_HEAD}" = "v143-contextual-prune-lobo"
          test "$(git rev-parse HEAD)" = "${PR_HEAD_SHA}"
          test "$(git log -1 --format=%s)" = "v144 execute current fit onset topology diagnostic one-shot"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "${changed}" = "debug/v144-rhythm-calibration/diagnostics/.v144-current-fit-onset-topology-trigger"
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          test "$(git hash-object debug/v143-contextual-prune/v5-professional-pdf/final-professional-holdout-result.json)" = "511fd244f231b66d08306f97b5a47ed41f5415c7"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json | awk '{print $1}')" = "7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-rhythm-shadow.pdf | awk '{print $1}')" = "f4c1238e868cadfb90b8a359b1555b0b90e7740b9ebaa276aa394c8991f37ce5"
          test "$(git hash-object debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json)" = "248741bade9665a34648c59a2994bd27d73fc406"
          test "$(git hash-object debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference-build.json)" = "5f1ec40176aa9b69676c7cd9e06b42c412731f37"
          test "$(git hash-object debug/v144-rhythm-calibration/reference/professional-target-provenance.json)" = "3a346289d57c3cbe8de9d4bf5a86886d15774d9c"
          test "$(git hash-object debug/v144-rhythm-calibration/selected/v144-pitch-position-selected-baseline.json)" = "45287a40fbbe88f411d2eca7db3cce072174eda8"
          test "$(git hash-object modal/configs/v144_rhythm_context_split_config.json)" = "9b93205cb47bc7718685b9d41b263778107801ce"
          test "$(git hash-object validation/v144_rhythm_calibration/analyze_current_baseline_fit_onset_topology.py)" = "b4ddb289e2e0e54177e51e1b4ff1140dd304ed46"
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          trigger = json.loads(Path('debug/v144-rhythm-calibration/diagnostics/.v144-current-fit-onset-topology-trigger').read_text(encoding='utf-8'))
          assert trigger['classification'] == 'v144-rhythm-current-baseline-fit-onset-topology-diagnostic-trigger'
          assert trigger['baselineName'] == 'pitch-position-shift-54a6e8d3aa91c422'
          assert trigger['baselineEventSha256'] == '5b36270aaeafa73b2e25722e2576a40424ce5951dcfd2b5d769746bd9eb07e0d'
          assert trigger['analyzerBlob'] == 'b4ddb289e2e0e54177e51e1b4ff1140dd304ed46'
          workflow_blob = subprocess.check_output(['git', 'hash-object', '.github/workflows/v144-rhythm-cpu-gate.yml'], text=True).strip()
          assert trigger['broadCpuWorkflowBlob'] == workflow_blob
          assert trigger['fitOnly'] is True
          assert trigger['candidateConstructionAllowed'] is False
          assert trigger['validationLabelsAllowed'] is False
          assert trigger['canaryLabelsAllowed'] is False
          assert trigger['modalGpuAllowed'] is False
          assert trigger['replayAllowed'] is False
          provenance = json.loads(Path('debug/v144-rhythm-calibration/reference/professional-target-provenance.json').read_text(encoding='utf-8'))
          build = json.loads(Path('debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference-build.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('debug/v144-rhythm-calibration/selected/v144-pitch-position-selected-baseline.json').read_text(encoding='utf-8'))
          assert provenance['role'] == 'gold-calibration-reference-not-unseen-holdout'
          assert provenance['structuredTarget']['builtReferenceSha256'] == '18fd868ae960dfcdd1ffb0110f1a9dfd8acc2ffeb46e247d1116cd54291526ac'
          assert provenance['safety']['v5FinalHoldoutConsumed'] is True
          assert provenance['safety']['v5WorkflowMayBeRetried'] is False
          assert provenance['safety']['mainMayBeModified'] is False
          assert provenance['safety']['productionMayBeModified'] is False
          assert provenance['safety']['modalGpuAuthorized'] is False
          assert build['referenceRole'] == 'gold-calibration-reference-not-unseen-holdout'
          assert build['referenceSha256'] == '18fd868ae960dfcdd1ffb0110f1a9dfd8acc2ffeb46e247d1116cd54291526ac'
          assert build['modalGpuInvoked'] is False
          assert manifest['name'] == 'pitch-position-shift-54a6e8d3aa91c422'
          selected = manifest.get('selectedCandidate') or {}
          assert selected['eventCount'] == 1144
          assert selected['generatedMeasureCount'] == 113
          assert selected['eventSha256'] == '5b36270aaeafa73b2e25722e2576a40424ce5951dcfd2b5d769746bd9eb07e0d'
          assert manifest['promotionScope']['calibrationBaseline'] is True
          assert manifest['promotionScope']['productionPromotionAllowed'] is False
          PY

      - name: Run deterministic FIT-only aggregate topology diagnostic once
        shell: bash
        run: |
          set -euo pipefail
          output="debug/v144-rhythm-calibration/diagnostics/current-pitch-position-baseline-fit-onset-topology.json"
          test ! -e "${output}"
          python validation/v144_rhythm_calibration/analyze_current_baseline_fit_onset_topology.py \
            debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json \
            debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json \
            debug/v144-rhythm-calibration/selected/v144-pitch-position-selected-baseline.json \
            modal/configs/v144_rhythm_context_split_config.json \
            "${output}"

      - name: Verify aggregate-only isolation and baseline identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('debug/v144-rhythm-calibration/diagnostics/current-pitch-position-baseline-fit-onset-topology.json').read_text(encoding='utf-8'))
          assert payload['schemaVersion'] == 14419
          assert payload['classification'] == 'v144-rhythm-current-baseline-fit-onset-topology'
          assert payload['evaluationRole'] == 'gold-calibration-fit-only-current-baseline-topology-diagnostic'
          assert payload['mayClaimUnseenGeneralization'] is False
          assert payload['candidateConstructionPerformed'] is False
          assert payload['candidateRankingPerformed'] is False
          assert payload['candidateSelectionPerformed'] is False
          assert payload['candidateRuleOrShiftHistogramEmitted'] is False
          assert payload['validationLabelsUsedForDiagnostic'] is False
          assert payload['canaryLabelsUsedForDiagnostic'] is False
          assert payload['baseline']['name'] == 'pitch-position-shift-54a6e8d3aa91c422'
          assert payload['baseline']['eventCount'] == 1144
          assert payload['baseline']['generatedMeasureCount'] == 113
          assert payload['baseline']['eventSha256'] == '5b36270aaeafa73b2e25722e2576a40424ce5951dcfd2b5d769746bd9eb07e0d'
          assert payload['fit']['generatedNoteCount'] == 643
          assert payload['fit']['referenceNoteCount'] == 594
          boundary = payload['interpretationBoundary']
          assert boundary['topologyOnly'] is True
          assert boundary['mayInformMateriallyDistinctFamilyUnit'] is True
          assert boundary['mayRankSpecificRuleOrShift'] is False
          assert boundary['validationMayInformFamilyShape'] is False
          assert boundary['canaryMayInformFamilyShape'] is False
          assert boundary['consumedFamilyResultsMayInformFamilyShape'] is False
          assert boundary['fixedSelectorThresholdsMayChange'] is False
          assert boundary['runtimeReferenceInputAllowed'] is False
          safety = payload['safety']
          assert safety['v5Modified'] is False
          assert safety['mainModified'] is False
          assert safety['productionModified'] is False
          assert safety['runtimeReferenceInputUsed'] is False
          assert safety['modalGpuInvoked'] is False
          PY

      - name: Persist only the topology diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          output="debug/v144-rhythm-calibration/diagnostics/current-pitch-position-baseline-fit-onset-topology.json"
          status="$(git status --porcelain)"
          test "${status}" = "?? ${output}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${output}"
          staged="$(git diff --cached --name-only)"
          test "${staged}" = "${output}"
          git commit -m "v144: persist current fit onset topology diagnostic report"
          git push origin HEAD:v143-contextual-prune-lobo