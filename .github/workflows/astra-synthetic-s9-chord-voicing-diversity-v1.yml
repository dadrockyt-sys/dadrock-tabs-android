name: Astra synthetic S9 chord-voicing diversity v1

on:
  push:
    branches:
      - astra-work
    paths:
      - 'docs/astra/SYNTHETIC_DATA_DIVERSITY_S9_LAUNCH_V1.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: astra-synthetic-s9-chord-voicing-diversity-v1
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-22.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'
      - name: Verify authorization and source pins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          blob=lambda p: subprocess.check_output(['git','hash-object',p],text=True).strip()
          a=json.load(open('docs/astra/SYNTHETIC_DATA_DIVERSITY_S9_AUTHORIZATION_V1.json'))
          l=json.load(open('docs/astra/SYNTHETIC_DATA_DIVERSITY_S9_LAUNCH_V1.json'))
          assert a['schema']=='astra-synthetic-data-diversity-s9-authorization-v1'
          assert str(a['userInstruction']).startswith('I authorize')
          z=a['authorization']
          assert z['maxModels']==2 and z['maxOptimizerStepsPerModel']==500
          assert not z['automaticRetryAuthorized'] and not z['thresholdSearchAuthorized']
          assert not z['p1Authorized'] and not z['p2Authorized'] and not z['p3Authorized']
          assert not z['codespacesAuthorized'] and not z['vercelAuthorized']
          paths={
            'designGitBlob':'docs/astra/SYNTHETIC_DATA_DIVERSITY_S9_DESIGN_V1.md',
            'generatorGitBlob':'astra_backend/synthetic/s0_pilot_v1.py',
            'samplingGitBlob':'astra_backend/synthetic/s1_pilot_v1.py',
            'diagnosticsGitBlob':'astra_backend/synthetic/s2_pilot_v1.py',
            'repeatedDiagnosticsGitBlob':'astra_backend/synthetic/s3_pilot_v1.py',
            's6ModelGitBlob':'astra_backend/synthetic/s6_pilot_v1.py',
            'runnerGitBlob':'astra_backend/synthetic/s9_pilot_v1.py',
            'testsGitBlob':'astra_backend/synthetic/test_s9_pilot_v1.py',
            'runtimeLockGitBlob':'astra_backend/tabcnn_runtime/requirements.lock.txt',
            'workflowGitBlob':'.github/workflows/astra-synthetic-s9-chord-voicing-diversity-v1.yml',
          }
          for k,p in paths.items():
              assert a['sourceIdentities'][k]==blob(p),(k,'auth')
              assert l['sourceIdentities'][k]==blob(p),(k,'launch')
          assert l['authorizationGitBlob']==blob('docs/astra/SYNTHETIC_DATA_DIVERSITY_S9_AUTHORIZATION_V1.json')
          PY
      - name: Install exact CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          python -m pip check
      - name: Run authorized S9 focused tests
        run: PYTHONPATH=astra_backend python astra_backend/synthetic/test_s9_pilot_v1.py
      - name: Generate control and paired intervention datasets
        run: |
          mkdir -p /tmp/astra-s9
          PYTHONPATH=astra_backend python astra_backend/synthetic/s0_pilot_v1.py generate             --out /tmp/astra-s9/control.npz --receipt /tmp/astra-s9/control-render-receipt.json
          PYTHONPATH=astra_backend python astra_backend/synthetic/s9_pilot_v1.py build-intervention             --control-dataset /tmp/astra-s9/control.npz             --out /tmp/astra-s9/intervention.npz             --receipt /tmp/astra-s9/intervention-receipt.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/astra-s9/intervention-receipt.json'))
          assert r['controlExamples']==294 and r['interventionExamples']==294
          assert r['controlUniqueTrainChordVoicings']==10 and r['interventionUniqueTrainChordVoicings']==30
          assert r['validationTestBitIdentical'] and r['nonChordBitIdentical'] and r['samplerStrataIdentical']
          assert r['pairedTimbreVariantCounts']=={'0':10,'1':10,'2':10}
          assert r['replacementChordClipsRendered']==30
          PY
      - name: Run exactly two capped S9 arms
        run: |
          PYTHONPATH=astra_backend python astra_backend/synthetic/s9_pilot_v1.py run             --control-dataset /tmp/astra-s9/control.npz             --intervention-dataset /tmp/astra-s9/intervention.npz             --out /tmp/astra-s9/result.json             --identity-out /tmp/astra-s9/identity.json             --control-model /tmp/astra-s9/control.pt             --intervention-model /tmp/astra-s9/intervention.pt
          python - <<'PY'
          import json
          x=json.load(open('/tmp/astra-s9/result.json'))
          assert x['execution']['modelCount']==2 and x['execution']['optimizerStepsTotal']<=1000
          assert x['identity']['batchIndicesIdentical']
          assert x['identity']['validationTestBitIdentical'] and x['identity']['nonChordBitIdentical']
          assert x['identity']['preUpdateModelInitializationIdentical']
          assert x['identity']['preUpdateStateLogitsIdentical'] and x['identity']['preUpdateOnsetLogitsIdentical']
          assert x['fixed']['thresholdSearch'] is False and x['execution']['automaticRetry'] is False
          assert not x['guards']['p1Accessed'] and not x['guards']['p2Accessed'] and not x['guards']['p3Opened']
          assert not x['guards']['codespacesUsed'] and not x['guards']['vercelUsed']
          PY
      - name: Upload bounded S9 evidence
        uses: actions/upload-artifact@v4
        with:
          name: astra-synthetic-data-diversity-s9-v1
          path: |
            /tmp/astra-s9/control-render-receipt.json
            /tmp/astra-s9/intervention-receipt.json
            /tmp/astra-s9/identity.json
            /tmp/astra-s9/result.json
            /tmp/astra-s9/control.pt
            /tmp/astra-s9/intervention.pt
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/astra-s9
