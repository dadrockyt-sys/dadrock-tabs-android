name: V158 generate reference-blind CPU candidate once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v158-generate.yml

permissions:
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo
  CUDA_VISIBLE_DEVICES: ""
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"
  CUBLAS_WORKSPACE_CONFIG: ":4096:8"
  SOURCE_DIR: /tmp/v158-historical-source
  NORM_WAV: /tmp/v158-normalized.wav
  DEMUCS_DIR: /tmp/v158-demucs
  PREREG: debug/v158-cpu-autonomous/preregistration.json
  CONTRACT: debug/v158-cpu-autonomous/implementation-contract.json
  RESOLUTION: debug/v158-cpu-autonomous/sparse-pursuit-contract-resolution.json
  PRE_RUN: debug/v158-cpu-autonomous/pre-run-receipt.json
  TRANSCRIBER: validation/v158_cpu_multitrack/transcribe_v158.py
  BASE_HELPER: validation/v158_cpu_multitrack/transcribe_v158_base.py
  QC: validation/v158_cpu_multitrack/structural_qc.py
  ENV_RECEIPT: debug/v158-cpu-autonomous/environment-receipt.json
  OUTPUT: debug/v158-cpu-autonomous/generated.json
  RECEIPT: debug/v158-cpu-autonomous/generation-receipt.json
  QC_OUTPUT: debug/v158-cpu-autonomous/structural-qc.json

jobs:
  generate-once:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify sole trigger and sealed identities
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object "$PREREG")" = "728cf28646db225f3c266a4bb73a6112b1f60330"
          test "$(git hash-object "$CONTRACT")" = "68f01df155cd27077cea3de5a0cd048ddcb7bd76"
          test "$(git hash-object "$RESOLUTION")" = "b4b6a5c1f8a88d359a981eb1238907805f2fc2a9"
          test "$(git hash-object "$PRE_RUN")" = "e7300529fee191335a6709127e07069210704162"
          test "$(git hash-object "$TRANSCRIBER")" = "91d65049031506fe44b44e034b1ab04022ba0b91"
          test "$(git hash-object "$BASE_HELPER")" = "5617ff1a6ea301ecaeb898b123b05d2a8c915388"
          test "$(git hash-object "$QC")" = "0bbb08225f0a21bc5bf4889189f22d89953371df"
          test ! -e "$OUTPUT"
          test ! -e "$RECEIPT"
          test ! -e "$QC_OUTPUT"
          test ! -e "$ENV_RECEIPT"
          python -m py_compile "$TRANSCRIBER" "$BASE_HELPER" "$QC"
          if grep -En 'research/v154-professional-references|frontend-reference-payload|score_frontend_reference|combined-reference|debug/v157-cpu-autonomous/generated|debug/v157-cpu-autonomous/generation-receipt|debug/v157-cpu-autonomous/structural-qc' "$TRANSCRIBER" "$BASE_HELPER" "$QC"; then
            echo 'Forbidden scored/reference/prior-output path dependency in V158 generation code' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          prereg = json.loads(Path('debug/v158-cpu-autonomous/preregistration.json').read_text())
          contract = json.loads(Path('debug/v158-cpu-autonomous/implementation-contract.json').read_text())
          resolution = json.loads(Path('debug/v158-cpu-autonomous/sparse-pursuit-contract-resolution.json').read_text())
          pre = json.loads(Path('debug/v158-cpu-autonomous/pre-run-receipt.json').read_text())
          assert prereg['version'] == 'V158'
          assert prereg['status'] == 'PREREGISTERED_BEFORE_GENERATION'
          assert contract['version'] == 'V158'
          assert contract['status'] == 'SEALED_BEFORE_GENERATION_CODE'
          assert resolution['status'] == 'SEALED_BEFORE_CANONICAL_EXECUTION_CODE'
          assert pre['schema'] == 'dadrock.tabs.v158.pre-run-identity-receipt.v1'
          assert pre['validation'] == 'PASS'
          assert pre['status'] == 'SEALED_BEFORE_GENERATION'
          assert pre['candidateExistsAtSeal'] is False
          assert pre['generationReceiptAbsentAtSeal'] is True
          assert pre['environmentReceiptAbsentAtSeal'] is True
          assert pre['generationWorkflowAbsentAtSeal'] is True
          assert pre['referenceReadAtSeal'] is False
          assert pre['professionalReferencePathsOpenedAtSeal'] == 0
          assert pre['referenceFacingScoreCallsAtSeal'] == 0
          trigger = pre['triggerSafety']
          assert trigger['generationWorkflowCreationIsSingleTrigger'] is True
          assert trigger['secondArmEditForbidden'] is True
          assert trigger['expectedGenerationWorkflowRunCount'] == 1
          assert trigger['workflowMustSelfSealAfterSuccessfulFreeze'] is True
          assert trigger['duplicateRunAction'] == 'ABORT_V158_WITHOUT_SCORING'
          assert trigger['branchWritesWhileGenerationActiveForbidden'] is True
          PY

      - name: Materialize exact historical audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR"
          git show 74b0f815ff3f66f325220975c410621503de440f:public/gomywayfullaitest.m4a > "$SOURCE_DIR/gomywayfullaitest.m4a"
          test "$(sha256sum "$SOURCE_DIR/gomywayfullaitest.m4a" | awk '{print $1}')" = "215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f"
          test "$(wc -c < "$SOURCE_DIR/gomywayfullaitest.m4a" | tr -d ' ')" = "3478611"

      - name: Install exact CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 soundfile==0.12.1 basic-pitch==0.4.0 demucs==4.1.0 imageio-ffmpeg==0.6.0 librosa==0.11.0
          python - <<'PY'
          import importlib.metadata
          import numpy, scipy, soundfile, torch
          assert numpy.__version__ == '1.26.4'
          assert scipy.__version__ == '1.13.1'
          assert soundfile.__version__ == '0.12.1'
          assert importlib.metadata.version('basic-pitch') == '0.4.0'
          assert importlib.metadata.version('demucs') == '4.1.0'
          assert importlib.metadata.version('imageio-ffmpeg') == '0.6.0'
          assert importlib.metadata.version('librosa') == '0.11.0'
          assert torch.__version__ == '2.8.0+cpu'
          assert torch.version.cuda is None
          assert torch.cuda.is_available() is False
          PY
          python "$TRANSCRIBER" --help >/dev/null
          python "$QC" --help >/dev/null

      - name: Deterministically normalize audio
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          import imageio_ffmpeg
          src = Path('/tmp/v158-historical-source/gomywayfullaitest.m4a')
          out = Path('/tmp/v158-normalized.wav')
          exe = imageio_ffmpeg.get_ffmpeg_exe()
          subprocess.check_call([exe, '-v', 'error', '-i', str(src), '-vn', '-ar', '44100', '-ac', '2', '-c:a', 'pcm_s16le', str(out)])
          assert out.is_file() and out.stat().st_size > 1000000
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          assert digest == '3e61b7926eabc21b758c750f826c7426a29d6de5aafdd5c93f8045ecdc67f87e'
          print('normalized_sha256=' + digest)
          PY

      - name: Seeded in-process CPU Demucs separation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import random
          from pathlib import Path
          import numpy as np
          import torch

          seed = 0
          random.seed(seed)
          np.random.seed(seed)
          torch.manual_seed(seed)
          torch.set_num_threads(1)
          torch.set_num_interop_threads(1)
          torch.use_deterministic_algorithms(True, warn_only=False)
          assert torch.version.cuda is None
          assert torch.cuda.is_available() is False
          assert torch.get_num_threads() == 1
          assert torch.get_num_interop_threads() == 1

          from demucs.separate import main as demucs_main
          args = ['-n', 'htdemucs_6s', '-d', 'cpu', '--shifts', '1', '-j', '1', '-o', '/tmp/v158-demucs', '/tmp/v158-normalized.wav']
          try:
              demucs_main(args)
          except SystemExit as exc:
              if exc.code not in (None, 0):
                  raise
          stem_dir = Path('/tmp/v158-demucs/htdemucs_6s/v158-normalized')
          for name in ('guitar.wav', 'bass.wav', 'drums.wav'):
              path = stem_dir / name
              assert path.is_file() and path.stat().st_size > 1000000, path
          print('stem_dir=' + str(stem_dir))
          PY

      - name: Verify branch stability before candidate boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git hash-object "$PRE_RUN")" = "e7300529fee191335a6709127e07069210704162"
          test "$(git hash-object "$TRANSCRIBER")" = "91d65049031506fe44b44e034b1ab04022ba0b91"
          test "$(git hash-object "$BASE_HELPER")" = "5617ff1a6ea301ecaeb898b123b05d2a8c915388"
          test "$(git hash-object "$QC")" = "0bbb08225f0a21bc5bf4889189f22d89953371df"
          test ! -e "$OUTPUT"
          test ! -e "$RECEIPT"
          test ! -e "$QC_OUTPUT"
          test ! -e "$ENV_RECEIPT"

      - name: Freeze environment and separation receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug/v158-cpu-autonomous
          python - <<'PY'
          import hashlib, importlib.metadata, json, os
          from pathlib import Path
          import numpy, scipy, soundfile, torch

          def sha256(path):
              digest = hashlib.sha256()
              with Path(path).open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          stem_dir = Path('/tmp/v158-demucs/htdemucs_6s/v158-normalized')
          roots = [
              Path.home() / '.cache' / 'torch' / 'hub' / 'checkpoints',
              Path.home() / '.cache' / 'huggingface' / 'hub',
          ]
          by_resolved = {}
          for root in roots:
              if not root.exists():
                  continue
              for logical in sorted(root.rglob('*')):
                  try:
                      if not logical.is_file():
                          continue
                      low_parts = [part.lower() for part in logical.parts]
                      name = logical.name.lower()
                      if '.locks' in low_parts or name.endswith('.lock') or name.endswith('.json') or name.endswith('.txt') or name in {'refs', 'readme', 'readme.md'}:
                          continue
                      resolved = logical.resolve(strict=True)
                      if not resolved.is_file():
                          continue
                      size = resolved.stat().st_size
                      if size < 1048576:
                          continue
                      key = str(resolved)
                      by_resolved.setdefault(key, {
                          'logicalPath': str(logical),
                          'resolvedPath': key,
                          'bytes': size,
                          'sha256': sha256(resolved),
                      })
                  except (FileNotFoundError, OSError):
                      continue
          model_blobs = [by_resolved[key] for key in sorted(by_resolved)]
          assert model_blobs, 'No resolved >=1MiB Demucs model blob found in sealed cache roots'

          receipt = {
              'schema': 'dadrock.tabs.v158.cpu-environment-receipt.v1',
              'validation': 'PASS',
              'workflowRunId': os.environ.get('GITHUB_RUN_ID'),
              'workflowRunNumber': int(os.environ['GITHUB_RUN_NUMBER']),
              'workflowRunAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'generationWorkflowRunCount': 1,
              'triggerCommit': os.environ['GITHUB_SHA'],
              'device': 'cpu',
              'cudaAvailable': False,
              'torchCudaVersion': None,
              'sourceAudioSha256': '215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f',
              'normalizedWavSha256': sha256('/tmp/v158-normalized.wav'),
              'versions': {
                  'python': '3.10',
                  'torch': torch.__version__,
                  'numpy': numpy.__version__,
                  'scipy': scipy.__version__,
                  'soundfile': soundfile.__version__,
                  'demucs': importlib.metadata.version('demucs'),
                  'basic-pitch': importlib.metadata.version('basic-pitch'),
                  'librosa': importlib.metadata.version('librosa'),
                  'imageio-ffmpeg': importlib.metadata.version('imageio-ffmpeg'),
              },
              'demucsModel': 'htdemucs_6s',
              'demucsShifts': 1,
              'demucsJobs': 1,
              'demucsModelBlobFiles': model_blobs,
              'modelCacheRootsScanned': [str(path) for path in roots],
              'determinism': {
                  'seed': 0,
                  'pythonRandomSeed': 0,
                  'numpyRandomSeed': 0,
                  'torchManualSeed': 0,
                  'torchDeterministicAlgorithms': True,
                  'torchDeterministicWarnOnly': False,
                  'torchNumThreads': 1,
                  'torchNumInteropThreads': 1,
                  'ompNumThreads': 1,
                  'mklNumThreads': 1,
                  'openblasNumThreads': 1,
                  'numexprNumThreads': 1,
                  'demucsInvocation': 'in-process demucs.separate.main',
                  'separationRepeatCount': 1,
              },
              'stemSha256': {
                  'guitar': sha256(stem_dir / 'guitar.wav'),
                  'bass': sha256(stem_dir / 'bass.wav'),
                  'drums': sha256(stem_dir / 'drums.wav'),
              },
              'safety': {
                  'referenceRead': False,
                  'professionalReferencePathsOpened': 0,
                  'referenceFacingScoreCalls': 0,
                  'gpuUsed': False,
                  'modalUsed': False,
                  'mainOrProductionModified': False,
              },
          }
          assert receipt['workflowRunNumber'] == 1
          assert receipt['workflowRunAttempt'] == 1
          assert receipt['normalizedWavSha256'] == '3e61b7926eabc21b758c750f826c7426a29d6de5aafdd5c93f8045ecdc67f87e'
          Path('debug/v158-cpu-autonomous/environment-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps({'modelBlobCount': len(model_blobs), 'stemSha256': receipt['stemSha256']}, indent=2, sort_keys=True))
          PY

      - name: Generate exactly one V158 candidate
        shell: bash
        run: |
          set -euo pipefail
          STEM_DIR="$DEMUCS_DIR/htdemucs_6s/v158-normalized"
          python "$TRANSCRIBER" \
            --mix "$NORM_WAV" \
            --guitar "$STEM_DIR/guitar.wav" \
            --bass "$STEM_DIR/bass.wav" \
            --drums "$STEM_DIR/drums.wav" \
            --preregistration "$PREREG" \
            --implementation-contract "$CONTRACT" \
            --sparse-pursuit-resolution "$RESOLUTION" \
            --pre-run-receipt "$PRE_RUN" \
            --structural-qc "$QC" \
            --environment-receipt "$ENV_RECEIPT" \
            --output "$OUTPUT" \
            --receipt "$RECEIPT"
          test -f "$OUTPUT"
          test -f "$RECEIPT"

      - name: Independent reference-blind structural QC
        shell: bash
        run: |
          set -euo pipefail
          python "$QC" \
            --candidate "$OUTPUT" \
            --receipt "$RECEIPT" \
            --environment-receipt "$ENV_RECEIPT" \
            --preregistration "$PREREG" \
            --implementation-contract "$CONTRACT" \
            --sparse-pursuit-resolution "$RESOLUTION" \
            --pre-run-receipt "$PRE_RUN" \
            --transcriber "$TRANSCRIBER" \
            --base-helper "$BASE_HELPER" \
            --output "$QC_OUTPUT"
          python - <<'PY'
          import json
          from pathlib import Path
          qc = json.loads(Path('debug/v158-cpu-autonomous/structural-qc.json').read_text())
          assert qc['validation'] == 'PASS'
          assert qc['safety']['referenceRead'] is False
          assert qc['safety']['professionalReferencePathsOpened'] == 0
          assert qc['safety']['referenceFacingScoreCalls'] == 0
          assert qc['safety']['gpuUsed'] is False
          PY

      - name: Freeze candidate receipts and self-seal
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          rm .github/workflows/v158-generate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT" "$RECEIPT" "$QC_OUTPUT" "$ENV_RECEIPT" .github/workflows/v158-generate.yml
          git commit -m "research: freeze sole V158 reference-blind CPU candidate [skip ci]"
          git push origin HEAD:"$BRANCH"
