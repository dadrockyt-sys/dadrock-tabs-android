name: V155 grid-origin audit v2 once
# armed after preregistration + code freeze

on:
  push:
    branches: [v143-contextual-prune-lobo]
    paths: [.github/workflows/v155-grid-origin-audit-v2-once.yml]

permissions:
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo
  SOURCE_DIR: /tmp/v155-grid-v2-source
  DECODED_WAV: /tmp/v155-grid-v2-mono.wav

jobs:
  audit-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify frozen preregistration and code
        run: |
          set -euo pipefail
          test "$(git hash-object debug/v155-cpu-autonomous/grid-origin-audit-v2-preregistration.json)" = "b8d04ed211873c7a3966e19c14617b25fd65e52e"
          python -m py_compile validation/v155_grid_origin/audit_librosa_beat_grid.py
          mkdir -p "$SOURCE_DIR"
      - name: Materialize exact historical audio
        run: |
          set -euo pipefail
          git show 74b0f815ff3f66f325220975c410621503de440f:public/gomywayfullaitest.m4a > "$SOURCE_DIR/gomywayfullaitest.m4a"
          test "$(wc -c < "$SOURCE_DIR/gomywayfullaitest.m4a" | tr -d ' ')" = "3478611"
          test "$(sha256sum "$SOURCE_DIR/gomywayfullaitest.m4a" | awk '{print $1}')" = "215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f"
      - name: Install frozen CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 librosa==0.11.0 imageio-ffmpeg==0.6.0
      - name: Decode and run reference-blind beat grid audit
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, imageio_ffmpeg
          exe = imageio_ffmpeg.get_ffmpeg_exe()
          subprocess.check_call([
              exe, '-v', 'error', '-i', '/tmp/v155-grid-v2-source/gomywayfullaitest.m4a',
              '-vn', '-ar', '22050', '-ac', '1', '-c:a', 'pcm_s16le', '/tmp/v155-grid-v2-mono.wav'
          ])
          PY
          python validation/v155_grid_origin/audit_librosa_beat_grid.py \
            --audio-m4a "$SOURCE_DIR/gomywayfullaitest.m4a" \
            --decoded-wav "$DECODED_WAV" \
            --output debug/v155-cpu-autonomous/grid-origin-audit-v2.json
      - name: Commit frozen audit and self-seal
        run: |
          set -euo pipefail
          rm .github/workflows/v155-grid-origin-audit-v2-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/v155-cpu-autonomous/grid-origin-audit-v2.json \
                  .github/workflows/v155-grid-origin-audit-v2-once.yml
          git commit -m "validation: freeze V155 librosa beat-grid audit [skip ci]"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
