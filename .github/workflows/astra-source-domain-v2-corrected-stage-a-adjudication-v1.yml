name: Astra V2 corrected Stage A adjudication V1

on:
  push:
    branches: [astra-work]
    paths:
      - 'docs/astra/SOURCE_DOMAIN_V2_CORRECTED_STAGE_A_ADJUDICATION_LAUNCH_V1.json'

permissions:
  contents: read

jobs:
  adjudicate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'

      - name: Validate launch
        run: |
          python - <<'PY'
          import json
          x=json.load(open('docs/astra/SOURCE_DOMAIN_V2_CORRECTED_STAGE_A_ADJUDICATION_LAUNCH_V1.json'))
          assert x['schema']=='astra-source-domain-v2-corrected-stage-a-adjudication-launch-v1'
          assert x['status']=='armed'
          assert x['launchIdentity']=='source-domain-v2-corrected-stage-a-20260928-canonical-01'
          assert x['waveformRenders']==0 and x['modelLoads']==0 and x['optimizerSteps']==0
          assert x['p1Access'] is False and x['p2Access'] is False and x['p3Access'] is False
          PY

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Focused tests
        env:
          PYTHONPATH: astra_backend
        run: pytest -q astra_backend/synthetic/test_source_domain_v2_corrected_stage_a_adjudication_v1.py

      - name: Adjudicate frozen evidence
        env:
          PYTHONPATH: astra_backend
        run: |
          mkdir -p /tmp/astra-v2-corrected-stage-a
          python -m synthetic.source_domain_v2_corrected_stage_a_adjudication_v1 \
            --stage-a docs/astra/SOURCE_DOMAIN_V2_STAGE_A_RESULT_V1.json \
            --isolated docs/astra/SOURCE_DOMAIN_V2_SOURCE_ISOLATING_PITCH_RESULT_V1.json \
            --out /tmp/astra-v2-corrected-stage-a/result.json

      - uses: actions/upload-artifact@v4
        with:
          name: astra-source-domain-v2-corrected-stage-a-adjudication-v1
          path: /tmp/astra-v2-corrected-stage-a/result.json
          if-no-files-found: error
          retention-days: 30
