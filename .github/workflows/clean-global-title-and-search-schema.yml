name: Clean global title and search schema

on:
  push:
    branches:
      - seo-clean-global-title-and-search-schema
    paths:
      - '.github/scripts/clean_global_title_and_search_schema.py'
      - '.github/workflows/clean-global-title-and-search-schema.yml'

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo-clean-global-title-and-search-schema

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply global SEO cleanup
        run: python .github/scripts/clean_global_title_and_search_schema.py

      - name: Verify diff
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Commit global SEO cleanup
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/layout.js
          git commit -m "Clean global title and search schema"
          git push origin seo-clean-global-title-and-search-schema
