name: Open corpus harmonic candidate ranking V2

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - validation/open_corpus/evaluate_harmonic_candidate_ranking_v2_v169.py
      - .github/workflows/open-corpus-harmonic-candidate-ranking-v2.yml
  workflow_dispatch:

jobs:
  candidate-ranking-v2:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pinned CPU dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 soundfile==0.13.1 pretty_midi==0.2.11

      - name: Four frozen synthetic V2 guards
        run: python validation/open_corpus/evaluate_harmonic_candidate_ranking_v2_v169.py --self-test

      - name: Download and verify P1/P2 only after synthetic guards pass
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/harmonic-ranking-v2/P1" "$RUNNER_TEMP/harmonic-ranking-v2/P2" "$RUNNER_TEMP/harmonic-ranking-v2/reports"
          cd "$RUNNER_TEMP/harmonic-ranking-v2"

          curl -L --fail --retry 3 --retry-delay 3 'https://zenodo.org/records/14963133/files/P1_singlenotes.zip?download=1' -o P1.zip
          echo 'ca0c4674dde3805574685a313f7c39eb  P1.zip' | md5sum -c -
          sha256sum P1.zip | tee reports/P1-archive-sha256.txt
          unzip -j P1.zip \
            'P1_singlenotes/midi/midi_allsinglenotes.mid' \
            'P1_singlenotes/audio/directinput/directinput_allsinglenotes.wav' \
            'P1_singlenotes/audio/micamp/micamp_allsinglenotes.wav' \
            -d P1

          curl -L --fail --retry 3 --retry-delay 3 'https://zenodo.org/records/14963133/files/P2_singlenotes.zip?download=1' -o P2.zip
          echo '40fbf03d8b04bb2cf42df20f36dc2254  P2.zip' | md5sum -c -
          sha256sum P2.zip | tee reports/P2-archive-sha256.txt
          unzip -j P2.zip \
            'P2_singlenotes/midi/midi_allsinglenotes.mid' \
            'P2_singlenotes/audio/directinput/directinput_allsinglenotes.wav' \
            'P2_singlenotes/audio/micamp/micamp_allsinglenotes.wav' \
            -d P2

      - name: Run prospectively frozen V2 on all four captures
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/harmonic-ranking-v2"
          python validation/open_corpus/evaluate_harmonic_candidate_ranking_v2_v169.py \
            --midi "$ROOT/P1/midi_allsinglenotes.mid" --audio "$ROOT/P1/directinput_allsinglenotes.wav" \
            --capture-label P1-directInput --output "$ROOT/reports/P1-directInput.json"
          python validation/open_corpus/evaluate_harmonic_candidate_ranking_v2_v169.py \
            --midi "$ROOT/P1/midi_allsinglenotes.mid" --audio "$ROOT/P1/micamp_allsinglenotes.wav" \
            --capture-label P1-micAmp --output "$ROOT/reports/P1-micAmp.json"
          python validation/open_corpus/evaluate_harmonic_candidate_ranking_v2_v169.py \
            --midi "$ROOT/P2/midi_allsinglenotes.mid" --audio "$ROOT/P2/directinput_allsinglenotes.wav" \
            --capture-label P2-directInput --output "$ROOT/reports/P2-directInput.json"
          python validation/open_corpus/evaluate_harmonic_candidate_ranking_v2_v169.py \
            --midi "$ROOT/P2/midi_allsinglenotes.mid" --audio "$ROOT/P2/micamp_allsinglenotes.wav" \
            --capture-label P2-micAmp --output "$ROOT/reports/P2-micAmp.json"

      - name: Evaluate frozen V2 success gate
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'harmonic-ranking-v2' / 'reports'
          names = ['P1-directInput','P1-micAmp','P2-directInput','P2-micAmp']
          captures = {}
          failures = []
          for name in names:
              payload = json.loads((root / f'{name}.json').read_text())
              result = payload['result']
              captures[name] = result
              overall = result['overall']
              weak = result['weakFundamental']
              if overall['trueWinnerPct'] < 95.0:
                  failures.append(f'{name}: overall trueWinnerPct <95')
              if overall['falseLowPct'] > 5.0:
                  failures.append(f'{name}: falseLowPct >5')
              if overall['falseHighPct'] > 5.0:
                  failures.append(f'{name}: falseHighPct >5')
              if weak['count'] >= 10 and weak['trueWinnerPct'] < 90.0:
                  failures.append(f'{name}: weak trueWinnerPct <90')

          summary = {
              'schema': 'dadrock.tabs.open-corpus.harmonic-candidate-ranking-v2-summary.v1',
              'status': 'CANDIDATE_FEATURE_PASS' if not failures else 'CANDIDATE_FEATURE_FAIL',
              'frozenSuccessGateFailures': failures,
              'captures': captures,
              'v168ReferenceFacingScoreCalls': 0,
              'v168PoliciesModified': False,
              'goatHoldoutSelectionModified': False,
          }
          output = root / 'candidate-ranking-v2-summary.json'
          output.write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))

      - name: Hash aggregate reports
        shell: bash
        run: |
          cd "$RUNNER_TEMP/harmonic-ranking-v2/reports"
          sha256sum *.json | sort | tee report-sha256.txt

      - name: Preserve aggregate-only V2 reports
        uses: actions/upload-artifact@v4
        with:
          name: harmonic-candidate-ranking-v2-reports
          path: ${{ runner.temp }}/harmonic-ranking-v2/reports/
          retention-days: 30
