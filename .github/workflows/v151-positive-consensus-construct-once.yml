name: V151 positive consensus construct once

on:
  push:
    paths:
      - '.github/workflows/v151-positive-consensus-construct-once.yml'

permissions:
  contents: write

jobs:
  construct-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Reference-free construction preflight
        run: |
          set -euo pipefail
          test ! -e debug/v151-positive-consensus/candidate
          test ! -e debug/v151-positive-consensus/phase-b-complete-sentinel.json
          test "$(git hash-object debug/v151-positive-consensus/phase-b-preregistration.json)" = "b8a91fbe7c8cb03be2905e86508a921a2ed2759d"
          test "$(git hash-object debug/v151-positive-consensus/phase-b-construction-authorization.json)" = "2882c1daee695dcb14824e18d1a6ec62f9609405"
          test "$(git hash-object validation/v151_positive_consensus/construct_once.py)" = "8bc607c055bae5c8e0757622a3af3a3feb0a9b34"
          test "$(git hash-object debug/v151-positive-consensus/phase-b-construction-attempt-sentinel.json)" = "b89bd7b75ff118588006a1a2c320d9ea254c6fe2"
          test "$(git hash-object modal/v147_phase_c_artifact_support.py)" = "f4278ffaacaca3f66baf7a3112e2af0f3bc387cf"
          test "$(git hash-object validation/rhythm_holdout/canonical.py)" = "088d44827fb23e20d9aeeb4944a672989af5846c"
          test "$(git hash-object lib/v143RenderContract.js)" = "ccbb93c48982798cc474309fd981f6ca02d5c8d4"
          python validation/v151_positive_consensus/construct_once.py --help >/dev/null
      - name: Consume construction attempt and checkpoint
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path('debug/v151-positive-consensus/phase-b-construction-attempt-sentinel.json')
          d = json.loads(p.read_text())
          if d.get('status') != 'ARMED_NOT_CONSUMED' or d.get('candidateConstructedCount') != 0 or d.get('scoreCallCount') != 0:
              raise SystemExit('V151 construction attempt not cleanly armed')
          d['status'] = 'CONSUMED_BEFORE_CONSTRUCTION'
          d['runId'] = os.environ['RUN_ID']
          d['runHeadSha'] = os.environ['HEAD_SHA']
          d['consumedAtUtc'] = datetime.now(timezone.utc).isoformat()
          p.write_text(json.dumps(d, indent=2, sort_keys=True)+'\n')
          cp = Path('docs/checkpoints/CURRENT_STATE.md')
          marker = '## V151 Phase B positive-consensus construction — AUTHORIZED / CONSUMED / REFERENCE-FREE — 2026-08-27 UTC'
          text = cp.read_text()
          if marker not in text:
              text += f'''\n\n{marker}\n- User instruction `Let's make a major breakthrough 🙏` authorizes exactly **one** construction of the frozen 12-event positive-consensus candidate.\n- Frozen event indices: `[46, 132, 141, 282, 347, 457, 610, 811, 1004, 1049, 1206, 1207]`.\n- Preregistration blob `b8a91fbe7c8cb03be2905e86508a921a2ed2759d`; authorization blob `2882c1daee695dcb14824e18d1a6ec62f9609405`; constructor blob `8bc607c055bae5c8e0757622a3af3a3feb0a9b34`; run `{os.environ['RUN_ID']}`.\n- Expected: **1144 events / 113 measures / 12 changed singleton events / 12 changed onsets / 0 polyphonic changes / 1 candidate / 100% PDF fidelity**.\n- Gold/reference **NO**; prior score-result read **NO**; scorer calls **0**; search/variants/threshold sweep/audio/HPSS/CQT/Modal/GPU/main/Production/promotion **NO**. Reference-facing scoring authorization remains **FALSE** during construction.\n'''
              cp.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/v151-positive-consensus/phase-b-construction-attempt-sentinel.json docs/checkpoints/CURRENT_STATE.md
          git commit -m 'debug: checkpoint consumed V151 positive-consensus construction [skip ci]'
          git push origin HEAD:v143-contextual-prune-lobo
      - name: Construct exactly one frozen V151 candidate
        run: |
          set -euo pipefail
          python validation/v151_positive_consensus/construct_once.py --output-dir debug/v151-positive-consensus/candidate | tee /tmp/v151-construction-summary.json
      - name: Verify persist checkpoint and self-seal
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          od = Path('debug/v151-positive-consensus/candidate')
          proof = json.loads((od/'construction-proof.json').read_text())
          pdf = json.loads((od/'pdf-event-fidelity.json').read_text())
          if proof.get('gate') != 'GO': raise SystemExit('V151 construction gate mismatch')
          m = proof.get('metrics') or {}
          if m.get('changedEventCountVersusAccepted') != 12 or m.get('changedOnsetCountVersusAccepted') != 12 or m.get('polyphonicChangedEventsVersusAccepted') != 0:
              raise SystemExit('V151 structural gate mismatch')
          if pdf.get('pdfEventFidelity') != 1.0 or pdf.get('referenceOpened') is not False:
              raise SystemExit('V151 PDF fidelity gate mismatch')
          s = proof.get('safety') or {}
          if s.get('scoreCallCount') != 0 or s.get('goldOrReferenceRead') is not False or s.get('candidateVariantsConstructed') != 1:
              raise SystemExit('V151 construction safety mismatch')
          files = {}
          for name in ('candidate.json','construction-proof.json','pdf-event-fidelity.json','preservation-manifest.json'):
              b=(od/name).read_bytes(); files[name]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          complete = {
              'schema':'dadrock.tabs.v151.positive-consensus.phase-b-completion.v1',
              'classification':'one-use-reference-free-construction-complete',
              'status':'COMPLETE_SEALED_STOP_BEFORE_SCORING',
              'branch':'v143-contextual-prune-lobo',
              'runId':os.environ['RUN_ID'],
              'completedAtUtc':datetime.now(timezone.utc).isoformat(),
              'candidateEventSha256':proof['candidateEventSha256'],
              'changedEvents':12,
              'changedOnsets':12,
              'polyphonicChangedEvents':0,
              'candidateVariantsConstructed':1,
              'pdfEventFidelity':1.0,
              'outputIdentities':files,
              'goldOrReferenceRead':False,
              'priorScoreResultRead':False,
              'scoreCallCount':0,
              'audioRead':False,
              'modalGpuUsed':False,
              'productionIntegrated':False,
              'automaticPromotion':False,
              'referenceFacingScoringAuthorization':False,
          }
          Path('debug/v151-positive-consensus/phase-b-complete-sentinel.json').write_text(json.dumps(complete,indent=2,sort_keys=True)+'\n')
          cp=Path('docs/checkpoints/CURRENT_STATE.md')
          marker='## V151 Phase B positive-consensus construction — COMPLETE / SEALED / STOP BEFORE SCORING — 2026-08-27 UTC'
          text=cp.read_text()
          if marker in text: raise SystemExit('duplicate V151 construction checkpoint')
          text += f'''\n\n{marker}\n- Exactly one reference-free candidate constructed in run `{os.environ['RUN_ID']}` from accepted family #10 plus only the **12** frozen V150 positive-consensus rows.\n- Canonical candidate event SHA256: **`{proof['candidateEventSha256']}`**.\n- Structure: **1144 events / 113 measures / 12 changed singleton events / 12 changed onsets / 0 polyphonic changed events**.\n- Deterministic replay **TRUE**; timing/metadata violations **0**; position violations **0**; V150 projection violations **0**.\n- PDF/render event fidelity: **100.000%**; reference opened during fidelity check **NO**.\n- Candidate file SHA256 **`{files['candidate.json']['sha256']}`**; construction proof SHA256 **`{files['construction-proof.json']['sha256']}`**; PDF proof SHA256 **`{files['pdf-event-fidelity.json']['sha256']}`**.\n- Gold/reference **NO**; prior score result read **NO**; scorer calls **0**; search/variants/alternate subset/additional filter/threshold sweep/audio/GPU/Production/promotion **NO**.\n- Construction authorization is consumed. Reference-facing scoring remains a separate exact-identity phase.\n'''
          cp.write_text(text)
          PY
          git rm .github/workflows/v151-positive-consensus-construct-once.yml
          git add debug/v151-positive-consensus/candidate debug/v151-positive-consensus/phase-b-complete-sentinel.json docs/checkpoints/CURRENT_STATE.md
          git commit -m 'debug: persist and seal V151 positive-consensus candidate [skip ci]'
          git push origin HEAD:v143-contextual-prune-lobo
