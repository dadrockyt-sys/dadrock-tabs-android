name: Astra frozen runtime export

on:
  push:
    branches:
      - astra-work
    paths:
      - '.github/workflows/astra-frozen-runtime-export.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout branch commit
        uses: actions/checkout@v4

      - name: Use exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.21'

      - name: Use uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'

      - name: Install exact hashed runtime
        shell: bash
        run: |
          set -euo pipefail
          PY="$(command -v python)"
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.10.21"
          uv pip sync astra_backend/engine/requirements.lock \
            --python "$PY" \
            --torch-backend cpu \
            --require-hashes
          uv pip check --python "$PY"

      - name: Verify frozen distribution and model identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import importlib.metadata as metadata
          import json
          from pathlib import Path

          expected = json.loads(Path("astra_backend/engine/installed-distributions.json").read_text())
          actual = sorted(
              ({"name": dist.metadata["Name"].lower().replace("_", "-"), "version": dist.version}
               for dist in metadata.distributions()),
              key=lambda row: row["name"],
          )
          if actual != expected:
              expected_pairs={(r["name"],r["version"]) for r in expected}
              actual_pairs={(r["name"],r["version"]) for r in actual}
              raise SystemExit(
                  "installed distribution mismatch\n"
                  f"missing={sorted(expected_pairs-actual_pairs)}\n"
                  f"extra={sorted(actual_pairs-expected_pairs)}"
              )
          model = Path(metadata.distribution("basic-pitch").locate_file(
              "basic_pitch/saved_models/icassp_2022/nmp.tflite"
          ))
          digest = hashlib.sha256(model.read_bytes()).hexdigest()
          if digest != "3db297d54af8e01c6e5618245c956b1d71b6a2b978cb2dedb527173186552676":
              raise SystemExit(f"Basic Pitch model digest mismatch: {digest}")
          print("PASS exact 57-distribution snapshot and Basic Pitch model identity")
          PY

      - name: Archive portable Python prefix
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$(python -c 'import sys; print(sys.prefix)')"
          PARENT="$(dirname "$PREFIX")"
          BASE="$(basename "$PREFIX")"
          tar -C "$PARENT" -czf /tmp/astra-python31021-runtime.tar.gz "$BASE"
          SHA="$(sha256sum /tmp/astra-python31021-runtime.tar.gz | awk '{print $1}')"
          BYTES="$(stat -c '%s' /tmp/astra-python31021-runtime.tar.gz)"
          printf '{"pythonVersion":"3.10.21","requirementsLockSha256":"a5614dbfad0be96aadc0d76297b6a59abe4e09c80bf2d6a484e53a14a58d38a7","installedDistributionsSha256":"a286ef69bdc34636cf96bd6ee952c517c44ffebe22b73329f0390e6e987ab846","basicPitchModelSha256":"3db297d54af8e01c6e5618245c956b1d71b6a2b978cb2dedb527173186552676","archiveSha256":"%s","archiveBytes":%s,"originalPrefix":"%s"}\n' "$SHA" "$BYTES" "$PREFIX" > /tmp/astra-runtime-export-manifest.json
          cat /tmp/astra-runtime-export-manifest.json
          ls -lh /tmp/astra-python31021-runtime.tar.gz

      - name: Upload frozen runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-python31021-frozen-runtime
          path: |
            /tmp/astra-python31021-runtime.tar.gz
            /tmp/astra-runtime-export-manifest.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
