    with:
      fold: p2-train-p1-validate
      train_performer: P2
      validation_performer: P1
      start_epoch: 0
      end_epoch: 200
      resume_artifact: ''
      output_artifact: guitar-techs-v9-p2-resume-e200
      final_segment: false

  p2_200_400:
    needs: p2_0_200
    uses: ./.github/workflows/guitar-techs-v9-resumable-segment.yml
    with:
      fold: p2-train-p1-validate
      train_performer: P2
