name: Guitar-TECHS V9 resumable P1 P2 real training

on:
  workflow_dispatch:
  push:
    branches: [astra-work]
    paths:
      - 'docs/astra/GUITARTECHS_V9_RESUMABLE_LAUNCH_V1.json'

permissions:
  contents: read

concurrency:
  group: guitar-techs-v9-resumable-real-training
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout frozen dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'

      - name: Verify V9 authorization launch and frozen orchestration identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          launch=json.load(open('docs/astra/GUITARTECHS_V9_RESUMABLE_LAUNCH_V1.json'))
          auth=json.load(open('docs/astra/GUITARTECHS_V9_REAL_TRAINING_AUTHORIZATION_V1.json'))
          assert launch['schema']=='astra-guitar-techs-v9-resumable-launch-v1'
          assert launch['singleLaunch'] is True
          assert auth['guards']['realP1P2TrainingAuthorized'] is True
          assert auth['scope']['consistencyWeight']==0.1
          for k in ('p3Opened','p3Authorized','protectedSongUseAuthorized','stageBHoldoutAuthorized','thresholdRetuningAuthorized','seedSelectionAuthorized','paidComputeAuthorized','mainOrProductionMutationAuthorized'):
              assert auth['guards'][k] is False
          for path,expected in launch['sourceBlobs'].items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual==expected,(path,actual,expected)
          assert launch['offlineVerification']=={'runId':37538504464,'conclusion':'success'}
          PY
          echo "GUITAR_TECHS_V9_REAL_TRAINING_AUTHORIZED=true"
          echo "GUITAR_TECHS_P3_OPENED=false"
          echo "CUSTOMER_DELIVERY_ELIGIBLE=false"

      - name: Install exact frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          python -m pip check

      - name: Acquire exact pinned TabCNN source only
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/tabcnn-source/amt_tools
          mkdir -p "$root/models" "$root/tools"
          : > "$root/__init__.py"
          : > "$root/models/__init__.py"
          printf 'from .constants import *\nfrom .instrument import *\n' > "$root/tools/__init__.py"
          base='https://raw.githubusercontent.com/robust-guitar-tabs/code/f50309ad06dc734ddae5e3a0eda756fca221e2e7/AMT-Tools/amt_tools'
          curl --fail --location --retry 4 -o "$root/models/common.py" "$base/models/common.py"
          curl --fail --location --retry 4 -o "$root/models/tabcnn.py" "$base/models/tabcnn.py"
          curl --fail --location --retry 4 -o "$root/tools/instrument.py" "$base/tools/instrument.py"
          curl --fail --location --retry 4 -o "$root/tools/constants.py" "$base/tools/constants.py"
          test "$(git hash-object "$root/models/common.py")" = '84beb4cf251b9cb9274d10cf203318314181af31'
          test "$(git hash-object "$root/models/tabcnn.py")" = 'e09856db2fffd77642e005ab509846acc894b886'
          test "$(git hash-object "$root/tools/instrument.py")" = 'eddc48a8b95de057035cd11ea2d1951e754ef349'
          test "$(git hash-object "$root/tools/constants.py")" = '79666ea0c5b0214ca664da454069b8d286cc5c18'

      - name: Run exact V9 preflight smokes without media
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=astra_backend/guitartechs_training_v9 python astra_backend/guitartechs_training_v9/verify_synthetic_v9.py
          PYTHONPATH=astra_backend python astra_backend/guitartechs_training_v9/train_v9_resumable.py resume-self-test --source-root /tmp/tabcnn-source
          echo "GUITAR_TECHS_P3_OPENED=false"
          echo "CUSTOMER_DELIVERY_ELIGIBLE=false"

  p1_0_200:
    needs: preflight
    uses: ./.github/workflows/guitar-techs-v9-resumable-segment.yml
    with:
      fold: p1-train-p2-validate
      train_performer: P1
      validation_performer: P2
      start_epoch: 0
      end_epoch: 200
      resume_artifact: ''
      output_artifact: guitar-techs-v9-p1-resume-e200
      final_segment: false

  p1_200_400:
    needs: p1_0_200
    uses: ./.github/workflows/guitar-techs-v9-resumable-segment.yml
    with:
      fold: p1-train-p2-validate
      train_performer: P1
      validation_performer: P2
      start_epoch: 200
      end_epoch: 400
