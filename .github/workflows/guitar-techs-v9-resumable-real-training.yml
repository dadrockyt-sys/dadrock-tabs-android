      final_segment: false

  p2_400_600:
    needs: p2_200_400
    uses: ./.github/workflows/guitar-techs-v9-resumable-segment.yml
    with:
      fold: p2-train-p1-validate
      train_performer: P2
      validation_performer: P1
      start_epoch: 400
      end_epoch: 600
      resume_artifact: guitar-techs-v9-p2-resume-e400
      output_artifact: guitar-techs-v9-p2-resume-e600
