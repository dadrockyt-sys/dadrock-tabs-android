name: Songsterr Fresh V3 Duration Diagnostic Tests

on:
  workflow_dispatch:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-v3-inventory-comparator-tests.yml'
      - 'scripts/songsterr-fresh/compare_v3_unresolved_duration_inventories.py'
      - 'scripts/songsterr-fresh/summarize_v3_unresolved_duration_evidence.py'
      - 'scripts/songsterr-fresh/summarize_v3_reattack_structure_context.py'
      - 'scripts/songsterr-fresh/summarize_v3_repeated_note_structure_context.py'
      - 'scripts/songsterr-fresh/probe_v3_activation_spectral_rejection_context.py'
      - 'scripts/songsterr-fresh/probe_v3_spectral_valley_neighborhood_context.py'
      - 'scripts/songsterr-fresh/probe_v3_post_valley_spectral_trajectory_context.py'
      - 'scripts/songsterr-fresh/probe_v3_post_valley_stft_harmonic_context.py'
      - 'scripts/songsterr-fresh/compare_v3_post_valley_representations.py'
      - 'scripts/songsterr-fresh/compare_demucs_stem_reproducibility.py'

permissions:
  contents: read

jobs:
  diagnostic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out fresh branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pinned Demucs comparator test dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 soundfile==0.13.1

      - name: Compile descriptive duration tools
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/songsterr-fresh/summarize_v3_unresolved_duration_evidence.py \
            scripts/songsterr-fresh/compare_v3_unresolved_duration_inventories.py \
            scripts/songsterr-fresh/summarize_v3_reattack_structure_context.py \
            scripts/songsterr-fresh/summarize_v3_repeated_note_structure_context.py \
            scripts/songsterr-fresh/probe_v3_activation_spectral_rejection_context.py \
            scripts/songsterr-fresh/probe_v3_spectral_valley_neighborhood_context.py \
            scripts/songsterr-fresh/probe_v3_post_valley_spectral_trajectory_context.py \
            scripts/songsterr-fresh/probe_v3_post_valley_stft_harmonic_context.py \
            scripts/songsterr-fresh/compare_v3_post_valley_representations.py \
            scripts/songsterr-fresh/compare_demucs_stem_reproducibility.py

      - name: Prove inventory comparator remains fail-closed and deterministic
        run: python scripts/songsterr-fresh/compare_v3_unresolved_duration_inventories.py --self-test

      - name: Prove structure-context diagnostic remains read-only and deterministic
        run: python scripts/songsterr-fresh/summarize_v3_reattack_structure_context.py --self-test

      - name: Prove repeated-note diagnostic remains read-only and deterministic
        run: python scripts/songsterr-fresh/summarize_v3_repeated_note_structure_context.py --self-test

      - name: Prove spectral-rejection context probe remains read-only
        run: python scripts/songsterr-fresh/probe_v3_activation_spectral_rejection_context.py --self-test

      - name: Prove spectral-valley neighborhood probe remains read-only
        run: python scripts/songsterr-fresh/probe_v3_spectral_valley_neighborhood_context.py --self-test

      - name: Prove post-valley CQT trajectory probe remains read-only
        run: python scripts/songsterr-fresh/probe_v3_post_valley_spectral_trajectory_context.py --self-test

      - name: Prove post-valley STFT harmonic probe remains read-only
        run: python scripts/songsterr-fresh/probe_v3_post_valley_stft_harmonic_context.py --self-test

      - name: Prove same-run representation comparator remains read-only
        run: python scripts/songsterr-fresh/compare_v3_post_valley_representations.py --self-test

      - name: Prove Demucs stem reproducibility comparator remains diagnostic-only
        run: python scripts/songsterr-fresh/compare_demucs_stem_reproducibility.py --self-test
