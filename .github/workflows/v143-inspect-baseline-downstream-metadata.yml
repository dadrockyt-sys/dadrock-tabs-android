name: V143 inspect baseline downstream metadata

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - '.github/workflows/v143-inspect-baseline-downstream-metadata.yml'
      - 'analyzer/inspect_v143_baseline_downstream_metadata.py'
      - 'analyzer/materialize_v143_precision_fixture.py'
      - 'analyzer/fixtures/v143_precision_v2_modal_capture_32805316807.json'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 1
      - name: Reverify protected runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = '7f72f8ed9b14af8bc93e95544195204d99c6bec1'
      - name: Materialize immutable paid capture CPU-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin c1451df43cc1162ed2b38aa3f3300b7af4d9b527
          python3 analyzer/materialize_v143_precision_fixture.py \
            --output-dir debug/v143-contextual-prune-ci/pinned-capture
      - name: Inspect existing downstream metadata only
        shell: bash
        run: |
          set -euo pipefail
          OUT=debug/v143-contextual-prune/baseline-downstream-metadata-inspection
          mkdir -p "$OUT"
          python3 analyzer/inspect_v143_baseline_downstream_metadata.py \
            debug/v143-contextual-prune-ci/pinned-capture/repaired-timing-precision-candidate-product.json \
            --output "$OUT/report.json" | tee "$OUT/run-summary.json"
          sha256sum "$OUT/report.json" | tee "$OUT/sha256.txt"
      - name: Persist inspection evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=debug/v143-contextual-prune/baseline-downstream-metadata-inspection
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          if ! git diff --cached --quiet; then
            git commit -m 'Persist V143 downstream metadata inspection'
            git push origin HEAD:v143-contextual-prune-lobo
          fi
      - name: Upload inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: v143-baseline-downstream-metadata-inspection
          path: debug/v143-contextual-prune/baseline-downstream-metadata-inspection/
          retention-days: 1
