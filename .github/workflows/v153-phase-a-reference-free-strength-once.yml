name: V153 Phase A reference-free strength ranking once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v153-phase-a-reference-free-strength-once.yml

permissions:
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo
  SENTINEL: debug/v153-reference-free-strength/phase-a-attempt-sentinel.json
  OUTPUT: debug/v153-reference-free-strength/phase-a-analysis.json

jobs:
  rank-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0

      - name: Guard exact one-use boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          test ! -e "$SENTINEL"
          test ! -e "$OUTPUT"
          test "$(git hash-object validation/v153_reference_free_strength/analyze_reference_free.py)" = "0525ce4a9d441a8fe8c6ffeb7fc99c8b70ebee73"
          test "$(git hash-object debug/v153-reference-free-strength/phase-a-preregistration.json)" = "449d668c5959e97f8f1172bc697a9578c4df03f6"
          test "$(git hash-object debug/v153-reference-free-strength/phase-a-authorization.json)" = "46f38b384d47e9ffc38de3e2bc6c3cfe60bf9642"

      - name: Consume attempt sentinel before analysis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["SENTINEL"])
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps({
              "schema": "dadrock.tabs.v153.reference-free-strength.phase-a-attempt-sentinel.v1",
              "status": "CONSUMED_BEFORE_ANALYSIS",
              "runId": os.environ["GITHUB_RUN_ID"],
              "triggerCommit": os.environ["GITHUB_SHA"],
              "analyzerGitBlob": "0525ce4a9d441a8fe8c6ffeb7fc99c8b70ebee73",
              "preregistrationGitBlob": "449d668c5959e97f8f1172bc697a9578c4df03f6",
              "populationEventIndices": [132, 347, 457]
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SENTINEL"
          git commit -m "debug: consume V153 Phase A ranking attempt [skip ci]"
          git push origin "HEAD:$BRANCH"

      - name: Make reference-facing inputs unreadable
        shell: bash
        run: |
          set -euo pipefail
          chmod 000 debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json 2>/dev/null || true
          chmod 000 public/Professionalexample.jpg 2>/dev/null || true
          chmod 000 debug/v151-positive-consensus/phase-c-score/score-result.json 2>/dev/null || true
          chmod 000 debug/v152-active-recurrence/phase-c-score/score-result.json 2>/dev/null || true

      - name: Execute frozen V153 ranking once
        shell: bash
        run: |
          set -euo pipefail
          python validation/v153_reference_free_strength/analyze_reference_free.py --output "$OUTPUT"
          sha256sum "$OUTPUT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path(os.environ["OUTPUT"]).read_text())
          assert r["safety"]["goldOrReferenceRead"] is False
          assert r["safety"]["priorScoreResultRead"] is False
          assert r["safety"]["candidateConstructed"] is False
          assert r["safety"]["audioReadOrDecoded"] is False
          assert r["safety"]["modalL4CudaOrGpuUsed"] is False
          assert r["safety"]["scoreCallCount"] == 0
          print("gate=", r["gate"])
          print("rankedEventIndices=", r["rankedEventIndices"])
          print("uniqueStrongestEventIndex=", r["uniqueStrongestEventIndex"])
          PY

      - name: Persist immutable ranking result
        shell: bash
        run: |
          set -euo pipefail
          git add "$OUTPUT"
          git commit -m "debug: persist V153 Phase A reference-free ranking [skip ci]"
          git push origin "HEAD:$BRANCH"

      - name: Upload ranking evidence
        uses: actions/upload-artifact@v4
        with:
          name: v153-phase-a-reference-free-strength-${{ github.run_id }}
          path: |
            debug/v153-reference-free-strength/phase-a-attempt-sentinel.json
            debug/v153-reference-free-strength/phase-a-analysis.json
          retention-days: 30
