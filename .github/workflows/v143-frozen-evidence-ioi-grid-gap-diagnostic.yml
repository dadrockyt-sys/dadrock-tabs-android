name: v143 frozen evidence IOI grid-gap diagnostic

# CPU-only, reference-free timing diagnostic.
on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - analyzer/v143_frozen_evidence_ioi_grid_gap_diagnostic.py
      - .github/workflows/v143-frozen-evidence-ioi-grid-gap-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run CPU-only reference-free IOI grid-gap diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile analyzer/v143_frozen_evidence_ioi_grid_gap_diagnostic.py
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = '7f72f8ed9b14af8bc93e95544195204d99c6bec1'
          if grep -E -n 'Professionalexample|professional-rhythm-complete|rhythm-professional-holdout-score|Songsterr' analyzer/v143_frozen_evidence_ioi_grid_gap_diagnostic.py; then
            echo 'Forbidden scorer/reference token in timing diagnostic' >&2
            exit 1
          fi
          python analyzer/v143_frozen_evidence_ioi_grid_gap_diagnostic.py \
            debug/v143-contextual-prune/frozen-approved-audio-preholdout-evidence.json \
            debug/v143-contextual-prune/frozen-evidence-ioi-grid-gap-diagnostic.json
      - name: Commit diagnostic result
        shell: bash
        run: |
          set -euo pipefail
          git add debug/v143-contextual-prune/frozen-evidence-ioi-grid-gap-diagnostic.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record frozen IOI grid-gap timing diagnostic'
          for attempt in 1 2 3 4; do
            git fetch origin v143-contextual-prune-lobo
            git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
