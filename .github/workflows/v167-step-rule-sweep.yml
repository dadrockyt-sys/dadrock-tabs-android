name: V167 fixed audio-evidence step-rule sweep

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v167-step-rule-sweep.yml

permissions:
  contents: write

concurrency:
  group: v167-step-rule-sweep-once
  cancel-in-progress: false

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: 0463a171419c6dc9b4f3604ef28e1a2a43e8db3a
  CANDIDATE: debug/v167-single-song-calibration/iteration-001-generated.json
  REFERENCE: research/v154-professional-references/scorer-ready/frontend-reference-payload.json
  SCORER: validation/v154_cpu_multitrack/score_frontend_reference.py
  SWEEP_CODE: validation/v167_single_song_calibration/step_rule_sweep_v167.py
  OUTPUT: debug/v167-single-song-calibration/step-rule-sweep.json

jobs:
  sweep:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact step-rule arm
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify frozen calibration inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v167-step-rule-sweep.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"
          test "$(git hash-object "$CANDIDATE")" = "1b73d6ece977fb976fa1c503997e6434d4e4811a"
          test "$(git hash-object "$REFERENCE")" = "2fbed60b543c0488934d8642c488aa06bf31bbf5"
          test "$(git hash-object "$SCORER")" = "9644e65719fbd361a9b39778ae9950c5e983e855"
          test "$(git hash-object "$SWEEP_CODE")" = "14cac9e217f65f72933c72ee349523ca9681fc21"
          test ! -e "$OUTPUT"
          python - <<'PY'
          import json
          c=json.load(open('debug/v167-single-song-calibration/iteration-001-generated.json'))
          assert c['calibration']['iteration']==1
          assert c['calibration']['transform']['shiftGridSteps']==-12
          assert c['calibration']['directReferenceEventCopy'] is False
          for stream in ('combinedGuitar','bass'):
              assert c['streams'][stream]
              assert all(len(e['stepSelection']['candidates']) == 3 for e in c['streams'][stream])
          PY

      - name: Sweep fixed whole-stream audio-evidence rules
        shell: bash
        run: |
          set -euo pipefail
          python "$SWEEP_CODE" \
            --candidate "$CANDIDATE" \
            --reference "$REFERENCE" \
            --scorer "$SCORER" \
            --output "$OUTPUT"

      - name: Freeze step-rule sweep and self-seal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('debug/v167-single-song-calibration/step-rule-sweep.json'))
          assert r['version']=='V167'
          assert r['globalPhaseCorrectionGridSteps']==-12
          assert r['policy']['referenceSelectsWholeRuleOnly'] is True
          assert r['policy']['referenceSelectsIndividualEventAlternative'] is False
          assert r['policy']['midiModified'] is False
          assert r['policy']['eventCardinalityModified'] is False
          assert r['policy']['directReferenceCopy'] is False
          print(json.dumps({
            'guitar':{'best':r['combinedGuitar']['best'],'deltaPercent':r['combinedGuitar']['deltaRecognitionPercent']},
            'bass':{'best':r['bass']['best'],'deltaPercent':r['bass']['deltaRecognitionPercent']}
          },indent=2,sort_keys=True))
          PY
          rm .github/workflows/v167-step-rule-sweep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$OUTPUT" .github/workflows/v167-step-rule-sweep.yml
          changed="$(git diff --cached --name-only)"
          if echo "$changed" | grep -Ev '^debug/v167-single-song-calibration/step-rule-sweep\.json$|^\.github/workflows/v167-step-rule-sweep\.yml$'; then
            echo 'Unexpected V167 step-rule path' >&2
            exit 1
          fi
          git commit -m "research: freeze V167 fixed audio-evidence step-rule sweep [skip ci]"
          git push origin HEAD:"$BRANCH"
