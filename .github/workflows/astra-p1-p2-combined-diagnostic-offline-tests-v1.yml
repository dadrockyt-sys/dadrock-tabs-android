name: Astra P1-P2 combined diagnostic offline tests v1
on:
  push:
    branches: [astra-work]
    paths:
      - 'astra_backend/evaluation/p1_p2_combined_diagnostic_v1.py'
      - 'astra_backend/evaluation/test_p1_p2_combined_diagnostic_v1.py'
      - 'docs/astra/P1_P2_COMBINED_DIAGNOSTIC_DESIGN_V1.json'
      - '.github/workflows/astra-p1-p2-combined-diagnostic-offline-tests-v1.yml'
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10.15' }
      - name: Install exact runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
      - name: Run synthetic/offline tests only
        shell: bash
        run: |
          cd astra_backend/evaluation
          PYTHONPATH=..:. python -m unittest -v test_p1_p2_combined_diagnostic_v1.py
          echo "REAL_MEDIA_ACCESSED=false"
          echo "OPTIMIZER_STEPS_EXECUTED=0"
          echo "P3_OPENED=false"
