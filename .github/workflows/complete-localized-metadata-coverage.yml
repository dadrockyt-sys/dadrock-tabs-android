name: Complete localized metadata coverage

on:
  push:
    branches:
      - seo-complete-localized-metadata-coverage
    paths:
      - '.github/scripts/complete_localized_metadata_coverage.py'
      - '.github/workflows/complete-localized-metadata-coverage.yml'
      - 'app/partners/layout.js'
      - 'app/[lang]/partners/layout.js'
      - 'app/tools/layout.js'
      - 'app/[lang]/tools/layout.js'
      - 'app/whats-new/layout.js'
      - 'app/[lang]/whats-new/layout.js'

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo-complete-localized-metadata-coverage

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply remaining metadata patch
        run: python .github/scripts/complete_localized_metadata_coverage.py

      - name: Verify diff
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Commit metadata coverage
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/layout.js app/difficulty/[level]/page.js app/[lang]/difficulty/[level]/page.js app/learn/page.js app/[lang]/learn/page.js app/top-lessons/page.js app/[lang]/top-lessons/page.js
          git commit -m "Complete localized metadata coverage"
          git push origin seo-complete-localized-metadata-coverage
