name: Songsterr Fresh Policy C Lock Hardening V2 Once

on:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-policy-c-lock-hardening-v2-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out fresh branch
        uses: actions/checkout@v4
        with:
          ref: songsterr-fresh-pipeline-v1
          fetch-depth: 0

      - name: Harden authority fingerprint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/songsterr-fresh/verify_pinned_compute_authority.py')
          text = path.read_text(encoding='utf-8')

          insert_at = text.index('\ndef numeric_library_configuration():', text.index('def package_versions():'))
          distribution_fn = '''

          def installed_distribution_lock():
              rows = []
              for dist in importlib.metadata.distributions():
                  raw_name = dist.metadata.get("Name") or ""
                  normalized_name = raw_name.strip().lower().replace("_", "-").replace(".", "-")
                  record = dist.read_text("RECORD")
                  direct_url = dist.read_text("direct_url.json")
                  installer = dist.read_text("INSTALLER")
                  rows.append({
                      "name": normalized_name,
                      "version": str(dist.version),
                      "recordSha256": sha256_text(record) if record is not None else None,
                      "directUrlSha256": sha256_text(direct_url) if direct_url is not None else None,
                      "installerSha256": sha256_text(installer) if installer is not None else None,
                  })
              rows.sort(key=canonical_json)
              return {"distributionCount": len(rows), "sha256": digest_json(rows)}
          '''
          distribution_fn = '\n'.join(line[10:] if line.startswith('          ') else line for line in distribution_fn.splitlines())
          text = text[:insert_at] + distribution_fn + text[insert_at:]

          old = '        "packages": package_versions(),\n        "numericLibraries": numeric_library_configuration(),\n'
          new = '        "packages": package_versions(),\n        "pythonDistributionLock": installed_distribution_lock(),\n        "numericLibraries": numeric_library_configuration(),\n'
          if text.count(old) != 1:
              raise SystemExit('COLLECT_PROBE_MARKER_CHANGED')
          text = text.replace(old, new, 1)

          env_anchor = '        raise AuthorityError("REQUIRED_DETERMINISTIC_ENVIRONMENT_CHANGED")\n\n'
          pos = text.index(env_anchor, text.index('def validate_manifest(')) + len(env_anchor)
          package_contract = '''    expected_packages = {
              "numpy": "1.26.4",
              "torch": "2.14.0",
              "huggingface-hub": "1.30.0",
              "safetensors": "0.8.0",
              "sphn": "0.2.1",
              "demucs": "4.1.0",
              "basic-pitch": "0.4.0",
              "librosa": "0.11.0",
              "soundfile": "0.13.1",
              "tflite-runtime": "2.14.0",
          }
          if manifest.get("requiredPackageVersions") != expected_packages:
              raise AuthorityError("REQUIRED_PACKAGE_VERSION_SET_CHANGED")

          '''
          package_contract = '\n'.join(line[10:] if line.startswith('          ') else line for line in package_contract.splitlines())
          text = text[:pos] + package_contract + text[pos:]

          start = text.index('    packages = fingerprint.get("packages")', text.index('def validate_probe_prerequisites('))
          end = text.index('    python = fingerprint.get("python", {})', start)
          replacement = '''    packages = fingerprint.get("packages")
          if not isinstance(packages, dict):
              raise AuthorityError("PACKAGE_VERSION_MAP_REQUIRED")
          if packages != manifest.get("requiredPackageVersions"):
              raise AuthorityError("PINNED_PACKAGE_VERSION_SET_MISMATCH")
          distribution_lock = fingerprint.get("pythonDistributionLock")
          if not isinstance(distribution_lock, dict):
              raise AuthorityError("PYTHON_DISTRIBUTION_LOCK_REQUIRED")
          count = distribution_lock.get("distributionCount")
          if isinstance(count, bool) or not isinstance(count, int) or count <= 0:
              raise AuthorityError("PYTHON_DISTRIBUTION_COUNT_INVALID")
          require_sha256(distribution_lock.get("sha256"), "pythonDistributionLock.sha256")
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          text = text[:start] + replacement + text[end:]

          syn = text.index('def synthetic_fingerprint():')
          numeric = text.index('        "numericLibraries":', syn)
          text = text[:numeric] + '        "pythonDistributionLock": {"distributionCount": 42, "sha256": "7" * 64},\n' + text[numeric:]

          sw = text.index('    software_drift = copy.deepcopy(probe)')
          assert_pos = text.index('        assert str(exc) == "AUTHORITY_FINGERPRINT_DRIFT"', sw)
          text = text[:assert_pos] + text[assert_pos:].replace(
              '        assert str(exc) == "AUTHORITY_FINGERPRINT_DRIFT"',
              '        assert str(exc) == "PINNED_PACKAGE_VERSION_SET_MISMATCH"',
              1,
          )
          print_pos = text.index('    print(json.dumps({', sw)
          transitive = '''    transitive_drift = copy.deepcopy(probe)
          transitive_drift["fingerprint"]["pythonDistributionLock"]["sha256"] = "8" * 64
          transitive_drift["fingerprintSha256"] = digest_json(transitive_drift["fingerprint"])
          try:
              verify_probe(enrolled, transitive_drift)
          except AuthorityError as exc:
              assert str(exc) == "AUTHORITY_FINGERPRINT_DRIFT"
          else:
              raise AssertionError("transitive distribution drift must fail closed")

          '''
          transitive = '\n'.join(line[10:] if line.startswith('          ') else line for line in transitive.splitlines())
          text = text[:print_pos] + transitive + text[print_pos:]
          text = text.replace(
              '        "softwareDriftFailsClosed": True,\n        "modelValidationComplete": False,\n',
              '        "softwareDriftFailsClosed": True,\n        "transitiveDistributionDriftFailsClosed": True,\n        "modelValidationComplete": False,\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Update authority architecture document
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/checkpoints/SONGSTERR_FRESH_PINNED_COMPUTE_AUTHORITY_V1.md')
          text = path.read_text(encoding='utf-8')
          old = '- pinned Python package versions\n- NumPy build/configuration hash\n'
          new = '- pinned Python package versions\n- full installed Python-distribution lock hash, including normalized versions plus installed `RECORD`, `direct_url.json`, and `INSTALLER` metadata hashes, so transitive/package-content drift invalidates authority\n- NumPy build/configuration hash\n'
          if text.count(old) != 1:
              raise SystemExit('AUTHORITY_DOC_MARKER_CHANGED')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Prove hardened verifier
        run: |
          python -m py_compile scripts/songsterr-fresh/verify_pinned_compute_authority.py
          python scripts/songsterr-fresh/verify_pinned_compute_authority.py --validate-manifest
          python scripts/songsterr-fresh/verify_pinned_compute_authority.py --self-test

      - name: Commit hardening
        run: |
          git config user.name 'dadrockyt-sys'
          git config user.email 'Stephen.s.mcnally@gmail.com'
          git add scripts/songsterr-fresh/verify_pinned_compute_authority.py docs/checkpoints/SONGSTERR_FRESH_PINNED_COMPUTE_AUTHORITY_V1.md
          git commit -m 'harden: bind fresh authority to full Python distribution lock'
          git push origin HEAD:songsterr-fresh-pipeline-v1
