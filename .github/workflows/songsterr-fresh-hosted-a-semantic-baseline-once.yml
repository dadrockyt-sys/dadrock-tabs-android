name: Songsterr Fresh Hosted A Semantic Baseline Once

on:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-hosted-a-semantic-baseline-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: songsterr-fresh-pipeline-v1
          fetch-depth: 0
      - name: Download preserved hosted A artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10179528439/zip" \
            -o /tmp/hosted-a.zip
          rm -rf /tmp/hosted-a
          mkdir -p /tmp/hosted-a
          unzip -q /tmp/hosted-a.zip -d /tmp/hosted-a
          test -s /tmp/hosted-a/evidence-a.json
      - name: Build compact reference-blind semantic baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections, hashlib, json
          from pathlib import Path

          evidence_path = Path('/tmp/hosted-a/evidence-a.json')
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          assert evidence['contract'] == 'songsterr-fresh-isolated-polyphonic-note-evidence-v1'
          assert evidence['referenceBlind'] is True
          assert evidence['structureFrozen'] is True
          provenance = evidence['provenance']
          assert provenance['referenceTabUsed'] is False
          assert provenance['professionalScorerUsed'] is False
          assert provenance['legacyV143ScorerImported'] is False
          assert provenance['modelNoteEndsUsedAsDuration'] is False

          groups = collections.defaultdict(list)
          for event in evidence['onsets']:
              assert event['sourceEnd'] is None
              assert event['durationSeconds'] is None
              key = (event['nearestStructureSlot'], event['selectedMidi'])
              groups[key].append([event['sourceStart'], event['onsetConfidence']])

          canonical = json.dumps(
              evidence,
              sort_keys=True,
              separators=(',', ':'),
              ensure_ascii=False,
              allow_nan=False,
          ).encode('utf-8')
          output = {
              'contract': 'songsterr-fresh-hosted-a-semantic-baseline-v1',
              'version': 1,
              'referenceBlind': True,
              'measurementOnly': True,
              'sourceRunId': 34546969446,
              'sourceArtifactId': 10179528439,
              'sourceObservation': 'A',
              'sourceHeadSha': 'a9671f746935fe18da1c0c48807b81ce4d1ce590',
              'canonicalEvidenceSha256': hashlib.sha256(canonical).hexdigest(),
              'eventCount': len(evidence['onsets']),
              'structureIdentity': evidence['structureIdentity'],
              'groups': [
                  [key[0], key[1], len(rows), sorted(rows)]
                  for key, rows in sorted(groups.items(), key=lambda item: (item[0][0], item[0][1]))
              ],
              'policyBoundary': {
                  'referenceTabUsed': False,
                  'professionalScorerUsed': False,
                  'legacyV143ScorerImported': False,
                  'admissionDecisionMade': False,
                  'modelValidationComplete': False,
                  'mayAdvanceDelivery': False,
                  'durationAuthorityChanged': False,
                  'customerEligibleEvents': 0,
              },
          }
          out = Path('docs/checkpoints/SONGSTERR_FRESH_HOSTED_A_SEMANTIC_BASELINE_V1.json')
          out.write_text(json.dumps(output, separators=(',', ':'), sort_keys=True) + '\n', encoding='utf-8')
          print('HOSTED_A_SEMANTIC_BASELINE_BUILT')
          print(f'eventCount={output["eventCount"]}')
          print(f'canonicalEvidenceSha256={output["canonicalEvidenceSha256"]}')
          print(f'bytes={out.stat().st_size}')
          PY
      - name: Commit baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dadrockyt-sys'
          git config user.email 'Stephen.s.mcnally@gmail.com'
          git add docs/checkpoints/SONGSTERR_FRESH_HOSTED_A_SEMANTIC_BASELINE_V1.json
          git commit -m 'docs: preserve hosted A semantic baseline'
          git push origin HEAD:songsterr-fresh-pipeline-v1
