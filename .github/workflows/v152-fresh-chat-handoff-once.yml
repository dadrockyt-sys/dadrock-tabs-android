name: V152 fresh chat handoff checkpoint once

on:
  push:
    paths:
      - '.github/workflows/v152-fresh-chat-handoff-once.yml'

permissions:
  contents: write

jobs:
  checkpoint-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0
      - name: Verify sealed V152 handoff basis
        run: |
          set -euo pipefail
          test "$(git hash-object docs/checkpoints/CURRENT_STATE.md)" = "813536e7129e57b7d110a088bda35dfa05aa973f"
          grep -Fq '## V152 Phase C three-note active-recurrence Gold score — COMPLETE / SEALED — 2026-08-27 UTC' docs/checkpoints/CURRENT_STATE.md
          grep -Fq 'Critical mismatches **1712**; delta vs accepted baseline **+0**' docs/checkpoints/CURRENT_STATE.md
          test ! -e debug/v153-reference-free-strength/phase-a-preregistration.json
          test ! -e debug/v153-reference-free-strength/phase-a-analysis.json
      - name: Append explicit fresh-chat handoff and next steps
        run: |
          set -euo pipefail
          cat >> docs/checkpoints/CURRENT_STATE.md <<'EOF'


## FRESH-CHAT HANDOFF — V152 SEALED / NEXT TARGET V153 NOT STARTED — 2026-08-27 UTC
- This section is the authoritative resume point requested by the user for a fresh chat. Work remains **only** on branch `v143-contextual-prune-lobo`; do not modify, merge, or promote `main`/Production.
- Handoff basis before this documentation-only append: branch head `b2687bb83a5cc5683bcdda61515339d7924e57b1`; `docs/checkpoints/CURRENT_STATE.md` Git blob `813536e7129e57b7d110a088bda35dfa05aa973f`.
- **Best experimental result so far is V152, sealed.** Candidate canonical event SHA256 `5ebedfb173730bb5e2639e7450841fb113f7db9af2acec19b88e58cca50679e6`; candidate file SHA256 `9b15ab3aa9540438db0750bb11c592a686e87b00b3acba491c80791badd349cb`; exactly **3 changed singleton events / 3 changed onsets / 0 polyphonic changes / 1144 events / 113 measures / 100% PDF fidelity**.
- V152 changed event indices are exactly **`[132, 347, 457]`**. They were chosen reference-free because each survived V151 positive consensus and then had local recurrence favoring the selected note in **both exact-pitch and pitch-class channels**.
- V152 Gold-calibration percentages (pitch content / pitch timing / string-fret timing / chord pitch-set / measure coverage / PDF fidelity): **35.311 / 6.699 / 5.455 / 5.805 / 100.000 / 100.000**.
- Accepted baseline percentages: **35.407 / 6.699 / 5.455 / 5.805 / 100.000 / 100.000**.
- V152 critical mismatches are **1712**, exactly tied with accepted baseline **1712**. V152 therefore fully recovered the mismatch regression and exactly matches baseline on pitch timing, string/fret timing, chord pitch-set, coverage, and PDF fidelity. The only displayed deficit is pitch content: **35.311% vs 35.407%**, a gap of about **0.096 percentage points**.
- Durable V152 score result: `debug/v152-active-recurrence/phase-c-score/score-result.json`; SHA256 **`cc549c6f0a33c0b90648433494ef36a31b5647191058e28b9ea089f12cab7ef4`**; run `33050114109`. V152 score authorization is consumed/sealed; **do not rescore V152**.

### Recommended next scientific phase — V153 reference-free strength ranking
- **V153 has NOT started.** No V153 preregistration, analyzer, candidate, Gold read, or score is authorized by this handoff request. A fresh chat should first read this checkpoint and verify the current branch head before doing anything else.
- Scientific goal: determine whether one of V152's three surviving edits has materially stronger **reference-free positive evidence** than the other two, so the next candidate can make the smallest defensible departure from accepted family #10 and attempt to move from the V152 tie to an actual baseline win.
- Freeze V153 Phase A **before execution**. Population must be exactly the three immutable V152 events **`[132, 347, 457]`**. Do not widen the population and do not inspect Gold/reference or V152 per-event accuracy to choose among them.
- Use only already-preserved reference-free evidence. Recommended strength components are: **(1)** selected-minus-original exact-pitch recurrence support in the same frozen local window, **(2)** selected-minus-original pitch-class recurrence support in that same window, **(3)** two-sided immediate-neighbor voice-leading improvement magnitude, and **(4)** the already-frozen V149/V147 evidence-margin strength (for example nearest/gate excess) only as a deterministic final tie-breaker. Do not recompute audio, HPSS, CQT, or use Modal/GPU.
- Preregister a deterministic ordering/ranking rule before calculating the three-event ranking. Prefer a transparent lexicographic rule over a tunable weighted score. **No threshold sweep, weight tuning, alternate ranking rule, or post-result rule change.** If the preregistered rule does not produce a unique strongest event, fail closed and stop rather than choosing arbitrarily.
- If V153 Phase A yields a unique strongest event, the recommended next boundary is a **separate one-candidate construction phase**: start from accepted family #10 and copy exactly that one corresponding V152 canonical row; preserve every other accepted row exactly. Expected structure would be **1144 events / 113 measures / 1 changed singleton event / 1 changed onset / 0 polyphonic changes / one candidate only**, deterministic replay, zero timing/metadata or position-identity violations, and PDF event fidelity `1.0`.
- Construction must remain reference-free: no Gold/reference, no prior per-event score inspection, no candidate variants/search, no alternate top-N subset, no audio/HPSS/CQT, no Modal/GPU, no main/Production changes, and no automatic promotion.
- Only after that one-event candidate is durably persisted and exact byte/canonical/PDF identities are sealed should a **separate one-use Gold calibration score** be considered. Bind exactly one score to that exact candidate identity; no rescore, no alternate candidate, and no post-score retuning.
- Success target for the next scored candidate: **strictly beat the accepted baseline rather than merely tie it**, while preserving the already recovered metrics. In particular: critical mismatches **<1712** and/or a genuinely improved calibration vector, with special attention to closing or reversing the remaining pitch-content gap without sacrificing pitch timing, string/fret, chord pitch-set, coverage, or PDF fidelity.

### Fresh-chat safety / authorization boundary
- Treat all V148–V152 reference-facing score authorizations as **consumed**. The user's present request authorized **documentation of next steps only**, not V153 execution.
- Do **NOT** read/open Gold/reference again, inspect reference-facing per-event correctness, construct a V153 candidate, score another candidate, search variants, tune thresholds/weights/filters, recompute audio/HPSS/CQT, use Modal/L4/GPU, touch `main`/Production, or promote anything unless the user gives fresh explicit authorization for the corresponding separately frozen phase.
- Any stale V152 construction/recovery workflow files or failed infrastructure attempts are historical only; **do not rerun them**. V152 already has exactly one sealed candidate and exactly one completed Gold score.
- Recommended fresh-chat opening sequence: **(1)** read `docs/checkpoints/CURRENT_STATE.md`; **(2)** verify branch `v143-contextual-prune-lobo` and current head; **(3)** confirm V152 sealed result and consumed score boundary; **(4)** on fresh user authorization, freeze V153 Phase A reference-free ranking exactly as above; **(5)** checkpoint before and after every phase; **(6)** stop at each construction/scoring authorization boundary.
EOF
      - name: Commit handoff and self-delete
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v152-fresh-chat-handoff-once.yml
          git add docs/checkpoints/CURRENT_STATE.md
          git commit -m 'docs: save V152 fresh-chat handoff and V153 next steps [skip ci]'
          git push origin HEAD:v143-contextual-prune-lobo
