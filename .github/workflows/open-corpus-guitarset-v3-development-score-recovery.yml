name: Open corpus GuitarSet V3 development scorer path recovery

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/open-corpus-guitarset-v3-development-score-recovery.yml

permissions:
  contents: read
  actions: read

jobs:
  recover-score-development-candidates:
    name: Score original frozen V3 development candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ORIGINAL_RUN_ID: '33581322528'
      ORIGINAL_HEAD_SHA: 'f494e5b2f586ec335b16dcabce687e63bb1f88fb'
      CANDIDATE_ARTIFACT_ID: '9828683652'
      CANDIDATE_ARTIFACT_NAME: 'guitarset-v3-development-frozen-candidates'
      CANDIDATE_ARTIFACT_DIGEST: 'sha256:1031aaf913b6292ee961051fed76b91bf003139ab6d3f8db1dad5d0dded270c5'
      CANDIDATE_MANIFEST_SHA256: '4568ca0c5f25ba11f17074b43b21e135eb44357c04a963266c61457038120a83'
      FROZEN_SCORER_BLOB: '19ef54155735a6ac1e65441250b47d1572ac0380'

    steps:
      - name: Checkout recovery branch commit
        uses: actions/checkout@v4

      - name: Verify recovery is scorer-only and scientific code is frozen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object validation/open_corpus/score_guitarset_v3_development_candidates.py)" = "$FROZEN_SCORER_BLOB"
          test "$(git hash-object validation/open_corpus/v3_selective_octave_trigger_v169.py)" = "14ddd15fc29bfe947a4e3ce12050b10f43d2435f"
          test "$(git hash-object validation/open_corpus/generate_guitarset_v3_development_candidates.py)" = "61068cee19132c40f3d0b15231d64ea3d428e1ca"
          echo GUITARSET_V3_SCORE_RECOVERY_FROZEN_CODE_PASS
          echo candidateRegenerated=false
          echo guitarSetProspectiveEvaluationProcessed=false
          echo guitarSetProspectiveEvaluationScoreCalls=0
          echo v168ReferenceFacingScoreCalls=0

      - name: Verify original candidate artifact identity before download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/guitarset-v3-development-score-recovery"
          mkdir -p "$ROOT"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID" \
            -o "$ROOT/artifact-metadata.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'guitarset-v3-development-score-recovery'
          a=json.loads((root/'artifact-metadata.json').read_text())
          assert int(a['id']) == int(os.environ['CANDIDATE_ARTIFACT_ID']), a
          assert a['name'] == os.environ['CANDIDATE_ARTIFACT_NAME'], a
          assert a['expired'] is False, a
          assert a.get('digest') == os.environ['CANDIDATE_ARTIFACT_DIGEST'], a.get('digest')
          wr=a.get('workflow_run') or {}
          assert int(wr.get('id')) == int(os.environ['ORIGINAL_RUN_ID']), wr
          assert wr.get('head_sha') == os.environ['ORIGINAL_HEAD_SHA'], wr
          print('GUITARSET_V3_ORIGINAL_CANDIDATE_ARTIFACT_IDENTITY_PASS')
          print('artifactId='+str(a['id']))
          print('artifactDigest='+str(a.get('digest')))
          print('originalRunId='+str(wr.get('id')))
          print('originalHeadSha='+str(wr.get('head_sha')))
          PY
          rm -f "$ROOT/artifact-metadata.json"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install reference parser only
        shell: bash
        run: python -m pip install --disable-pip-version-check jams==0.3.4

      - name: Prove recovery scorer has no Basic Pitch runtime
        shell: python
        run: |
          import importlib.util
          if importlib.util.find_spec('basic_pitch') is not None:
              raise SystemExit('basic_pitch unexpectedly importable in scorer recovery job')
          print('GUITARSET_V3_SCORE_RECOVERY_NO_BASIC_PITCH_PASS')
          print('candidateRegenerated=false')
          print('guitarSetProspectiveEvaluationProcessed=false')
          print('guitarSetProspectiveEvaluationScoreCalls=0')
          print('v168ReferenceFacingScoreCalls=0')

      - name: Download original already-frozen candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: guitarset-v3-development-frozen-candidates
          path: ${{ runner.temp }}/guitarset-v3-development-score-recovery/candidates
          github-token: ${{ github.token }}
          repository: dadrockyt-sys/dadrock-tabs-android
          run-id: 33581322528

      - name: Verify local manifest and every candidate hash before references
        shell: bash
        run: |
          set -euo pipefail
          CAND="$RUNNER_TEMP/guitarset-v3-development-score-recovery/candidates"
          test "$(sha256sum "$CAND/candidate-freeze-manifest.json" | awk '{print $1}')" = "$CANDIDATE_MANIFEST_SHA256"
          test "$(find "$CAND" -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 178
          test "$(find "$CAND" -type f \( -name '*.wav' -o -name '*.jams' -o -name '*.zip' \) | wc -l)" -eq 0
          CAND="$CAND" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['CAND'])
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for b in iter(lambda:f.read(1<<20),b''):
                      h.update(b)
              return h.hexdigest()
          manifest_path=root/'candidate-freeze-manifest.json'
          assert sha(manifest_path)==os.environ['CANDIDATE_MANIFEST_SHA256']
          m=json.loads(manifest_path.read_text())
          assert m['candidateFileCount']==177
          assert m['players']==['02','04','05']
          assert m['sealedEvaluationPlayers']==['00','01','03']
          assert set(m['excludedKnownAnomalies'])=={'04_BN3-154-E_comp','04_Jazz1-200-B_comp','02_Funk2-119-G_comp'}
          assert m['referenceRead'] is False
          assert m['guitarSetJamsNoteEventsRead']==0
          assert m['guitarSetProspectiveEvaluationProcessed'] is False
          assert m['guitarSetProspectiveEvaluationScoreCalls']==0
          assert m['v168ReferenceFacingScoreCalls']==0
          files=m['files']
          assert len(files)==177
          seen=set()
          for receipt in files:
              path=root/receipt['file']
              assert path.is_file(), path
              assert sha(path)==receipt['sha256'], path.name
              p=json.loads(path.read_text())
              stem=p['trackStem']
              assert stem not in seen, stem
              seen.add(stem)
              assert stem[:2] in {'02','04','05'}, stem
              assert stem[:2] not in {'00','01','03'}, stem
              assert stem not in {'04_BN3-154-E_comp','04_Jazz1-200-B_comp','02_Funk2-119-G_comp'}, stem
              assert p['referenceRead'] is False
              assert p['guitarSetJamsNoteEventsRead']==0
          assert len(seen)==177
          print('GUITARSET_V3_SCORE_RECOVERY_ALL_CANDIDATE_HASHES_PASS')
          print('candidateFileCount=177')
          print('candidateFreezeManifestSha256='+sha(manifest_path))
          print('referenceRead=false')
          print('guitarSetDevelopmentScoreCalls=0')
          print('guitarSetProspectiveEvaluationScoreCalls=0')
          print('v168ReferenceFacingScoreCalls=0')
          PY

      - name: Download verify and isolate 177 development JAMS references
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/guitarset-v3-development-score-recovery"
          mkdir -p "$ROOT/reference" "$ROOT/output"
          cd "$ROOT"
          curl -L --fail --retry 3 --retry-delay 3 \
            'https://zenodo.org/records/3371780/files/annotation.zip?download=1' \
            -o annotation.zip
          echo 'b39b78e63d3446f2e54ddb7a54df9b10  annotation.zip' | md5sum -c -
          echo '8daa02e6417ccca1685feb44b135e95928ad7037e5032ecb326b5791856fda99  annotation.zip' | sha256sum -c -
          python - <<'PY'
          import shutil, zipfile
          from pathlib import Path
          root=Path('.')
          out=root/'reference'
          dev={'02','04','05'}
          excluded={'04_BN3-154-E_comp','04_Jazz1-200-B_comp','02_Funk2-119-G_comp'}
          selected=[]
          with zipfile.ZipFile(root/'annotation.zip','r') as z:
              for info in z.infolist():
                  name=Path(info.filename).name
                  if not name.endswith('.jams'):
                      continue
                  stem=name[:-5]
                  if stem[:2] not in dev or stem in excluded:
                      continue
                  dest=out/name
                  if dest.exists(): raise SystemExit(f'duplicate destination {name}')
                  with z.open(info,'r') as src, dest.open('wb') as dst:
                      shutil.copyfileobj(src,dst)
                  selected.append(stem)
          if len(selected)!=177: raise SystemExit(f'expected 177 development JAMS files, got {len(selected)}')
          counts={p:sum(s.startswith(p+'_') for s in selected) for p in sorted(dev)}
          if counts!={'02':59,'04':58,'05':60}: raise SystemExit(f'player counts mismatch {counts}')
          if any(s[:2] in {'00','01','03'} for s in selected): raise SystemExit('sealed evaluation JAMS extracted')
          if any(s in excluded for s in selected): raise SystemExit('excluded anomaly JAMS extracted')
          print('GUITARSET_V3_SCORE_RECOVERY_REFERENCE_SELECTION_PASS',counts)
          PY
          rm -f annotation.zip
          test ! -e annotation.zip
          test "$(find reference -maxdepth 1 -type f -name '*.jams' | wc -l)" -eq 177
          test "$(find "$ROOT" -type f -name '*.wav' | wc -l)" -eq 0
          test "$(find reference -maxdepth 1 -type f \( -name '00_*' -o -name '01_*' -o -name '03_*' \) | wc -l)" -eq 0
          test ! -e reference/04_BN3-154-E_comp.jams
          test ! -e reference/04_Jazz1-200-B_comp.jams
          test ! -e reference/02_Funk2-119-G_comp.jams
          echo GUITARSET_V3_SCORE_RECOVERY_REFERENCE_ONLY_WORKSPACE_PASS
          echo guitarSetProspectiveEvaluationJamsNoteEventsRead=0
          echo guitarSetProspectiveEvaluationScoreCalls=0
          echo v168ReferenceFacingScoreCalls=0

      - name: Score unchanged frozen development candidates and select gate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/guitarset-v3-development-score-recovery"
          python validation/open_corpus/score_guitarset_v3_development_candidates.py \
            --candidate-dir "$ROOT/candidates" \
            --reference-dir "$ROOT/reference" \
            --output "$ROOT/output/guitarset-v3-development-score.json"
          (cd "$ROOT/output" && sha256sum guitarset-v3-development-score.json > score-sha256.txt)

      - name: Print frozen scientific classification
        shell: python
        run: |
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'guitarset-v3-development-score-recovery/output/guitarset-v3-development-score.json'
          r=json.loads(p.read_text())
          print(json.dumps({
            'status':r['status'],
            'candidateFreezeManifestSha256':r['candidateFreezeManifestSha256'],
            'developmentTrackCount':r['developmentTrackCount'],
            'totalReferenceEventCount':r['totalReferenceEventCount'],
            'baselinePrimaryMacroF1Pct':r['baseline']['primary100ms']['macroF1Pct'],
            'baselinePrimaryMicroF1Pct':r['baseline']['primary100ms']['micro']['f1Pct'],
            'baselineStrict50MicroF1Pct':r['baseline']['strict50ms']['micro']['f1Pct'],
            'qualifiedConfigIds':r['qualifiedConfigIds'],
            'selectedConfig':r['selectedConfig'],
            'totalChangedPitchCounts':r['totalChangedPitchCounts'],
            'guitarSetDevelopmentScoreCalls':r['guitarSetDevelopmentScoreCalls'],
            'guitarSetProspectiveEvaluationProcessed':r['guitarSetProspectiveEvaluationProcessed'],
            'guitarSetProspectiveEvaluationScoreCalls':r['guitarSetProspectiveEvaluationScoreCalls'],
            'v168ReferenceFacingScoreCalls':r['v168ReferenceFacingScoreCalls'],
          },indent=2,sort_keys=True))

      - name: Remove references and candidates before preserving score report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/guitarset-v3-development-score-recovery"
          rm -rf "$ROOT/reference" "$ROOT/candidates"
          rm -f "$ROOT/annotation.zip" "$ROOT/artifact-metadata.json"
          if [ -d "$ROOT/output" ]; then
            test "$(find "$ROOT/output" -type f \( -name '*.jams' -o -name '*.wav' -o -name '*.zip' \) | wc -l)" -eq 0
          fi

      - name: Preserve development recovery score report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guitarset-v3-development-score-recovery-report
          path: ${{ runner.temp }}/guitarset-v3-development-score-recovery/output/
          retention-days: 30
          if-no-files-found: ignore
