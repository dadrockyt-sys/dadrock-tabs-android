name: V143 Sealed Reserve Prediction

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-sealed-reserve-predict.yml
      - analyzer/v143_reserve_contextual_prune_predict.py
      - analyzer/v143_reserve_contextual_prune_predict_partial_tail.py
      - public/training/v143-musical-reconstruction-calibration/reserve-97-113-reference-free-cache.json
      - public/training/v143-musical-reconstruction-calibration/fresh-section5-reference-free-cache.json
      - public/training/v143-musical-reconstruction-calibration/fresh-section5-base027-frozen-events.json
      - public/training/v143-musical-reconstruction-calibration/contextual-prune-frozen-model.json
      - public/training/v143-musical-reconstruction-calibration/contextual-prune-freeze-manifest.json
      - public/training/v143-musical-reconstruction-calibration/intro-correlation-safe-grid-event-selector-model.json
      - public/training/v143-musical-reconstruction-calibration/intro-correlation-safe-sequence-event-model.json

permissions:
  contents: write

jobs:
  predict:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run sealed reserve prediction
        run: python analyzer/v143_reserve_contextual_prune_predict_partial_tail.py

      - name: Commit frozen prediction artifacts
        shell: bash
        run: |
          set -euo pipefail
          files=(
            public/training/v143-musical-reconstruction-calibration/reserve-97-113-base027-frozen-events.json
            public/training/v143-musical-reconstruction-calibration/reserve-97-113-contextual-prune-frozen-events.json
            public/training/v143-musical-reconstruction-calibration/reserve-97-113-contextual-prune-prediction-manifest.json
          )
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "No prediction artifact changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record sealed V143 reserve predictions"
          git push origin HEAD:v143-contextual-prune-lobo
