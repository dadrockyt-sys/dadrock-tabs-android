name: V143 Current Reference Grade

on:
  push:
    branches:
      - v143-musical-reconstruction-calibration
    paths:
      - "debug/v143-grading/grade_current_reference.py"
      - ".github/workflows/v143-current-reference-grade.yml"
      - "public/gomyway-professional-rhythm-reference-17-113.json"
      - "public/training/v143-musical-reconstruction-calibration/fresh-17-96-correlation-safe-fixed-count-reranker-frozen-events.json"
      - "public/training/v143-musical-reconstruction-calibration/fresh-17-96-correlation-safe-fixed-count-reranker-freeze-manifest.json"
      - "public/training/v143-musical-reconstruction-calibration/intro-correlation-safe-grid-event-selector-model.json"
      - "public/training/v143-musical-reconstruction-calibration/fresh-*-reference-free-cache.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout grading branch
        uses: actions/checkout@v4
        with:
          ref: v143-musical-reconstruction-calibration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install grader dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run version-locked current-reference grade
        run: python debug/v143-grading/grade_current_reference.py

      - name: Commit immutable grading report
        run: |
          if git diff --quiet -- debug/v143-grading/current-reference-grade.json && \
             git ls-files --error-unmatch debug/v143-grading/current-reference-grade.json >/dev/null 2>&1; then
            echo "Grade report unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/v143-grading/current-reference-grade.json
          git commit -m "Record v143 current-reference grade"
          git push origin HEAD:v143-musical-reconstruction-calibration
