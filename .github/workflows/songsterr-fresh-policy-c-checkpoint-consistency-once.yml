name: Songsterr Fresh Policy C Checkpoint Consistency Once

on:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-policy-c-checkpoint-consistency-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: songsterr-fresh-pipeline-v1
          fetch-depth: 0
      - name: Remove stale pre-Policy-C sentence
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          path = Path('docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md')
          text = path.read_text(encoding='utf-8')
          old = 'Demucs evidence already established: same-run exact determinism (`34435154554`), hosted cross-run exact variation (`34436134514`), dispatch causality (`34438368530`), and failed cross-vendor common-AVX2 byte portability (`34439594582`, five observations, three exact groups). No branch-tracked fresh pinned compute surface is identified.'
          new = 'Demucs evidence already established: same-run exact determinism (`34435154554`), hosted cross-run exact variation (`34436134514`), dispatch causality (`34438368530`), and failed cross-vendor common-AVX2 byte portability (`34439594582`, five observations, three exact groups). Those hosted portability failures motivated the separately defined Policy C pinned-compute authority; they are not authority-selection evidence themselves.'
          if text.count(old) != 1:
              raise SystemExit('STALE_POLICY_B_SENTENCE_NOT_UNIQUE')
          text = text.replace(old, new)
          stamp = datetime.now(ZoneInfo('America/Toronto')).strftime('%Y-%m-%d %H:%M America/Toronto')
          lines = text.splitlines()
          for index, line in enumerate(lines):
              if line.startswith('Updated: '):
                  lines[index] = f'Updated: {stamp}'
                  break
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Commit checkpoint consistency fix
        run: |
          git config user.name 'dadrockyt-sys'
          git config user.email 'Stephen.s.mcnally@gmail.com'
          git add docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md
          git commit -m 'docs: reconcile Policy B history with Policy C authority'
          git push origin HEAD:songsterr-fresh-pipeline-v1
