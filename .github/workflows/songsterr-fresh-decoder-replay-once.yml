name: Songsterr Fresh Decoder Replay Once

on:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-decoder-replay-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  replay-and-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out fresh branch
        uses: actions/checkout@v4
        with:
          ref: songsterr-fresh-pipeline-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pinned array dependency
        run: python -m pip install --disable-pip-version-check numpy==1.26.4

      - name: Repair synthetic tracer fixture only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/songsterr-fresh/trace_basic_pitch_decoder_mechanisms.py')
          text = path.read_text(encoding='utf-8')
          old = "    # Melodia event with no thresholded onset peak, frames 40:56.\n    frames[40:56, col64] = 0.7\n    # Ensure inferred-onset scale is non-degenerate but subthreshold at MIDI64.\n"
          new = "    # Melodia event with no thresholded onset peak, frames 40:56.\n    # 0.4 stays above frameThreshold=0.3 while inferred onset scales to 0.45 < 0.5.\n    frames[40:56, col64] = 0.4\n    # Ensure inferred-onset scale is non-degenerate and remains subthreshold at MIDI64.\n"
          if text.count(old) != 1:
              raise SystemExit('synthetic tracer fixture marker changed; fail closed')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Prove repaired tracer self-test
        run: python scripts/songsterr-fresh/trace_basic_pitch_decoder_mechanisms.py --self-test

      - name: Download completed A B C evidence only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/songsterr/agg /tmp/songsterr/a /tmp/songsterr/b /tmp/songsterr/c /tmp/songsterr/out
          gh run download 34546969446 -n songsterr-fresh-model-evidence-cross-run-measurement -D /tmp/songsterr/agg
          gh run download 34546969446 -n songsterr-fresh-model-evidence-observation-a -D /tmp/songsterr/a
          gh run download 34546969446 -n songsterr-fresh-model-evidence-observation-b -D /tmp/songsterr/b
          gh run download 34546969446 -n songsterr-fresh-model-evidence-observation-c -D /tmp/songsterr/c

      - name: Replay exact decoder mechanics against captured sidecars
        run: |
          set +e
          : > /tmp/songsterr/out/replay-status.tsv
          for label in a b c; do
            python scripts/songsterr-fresh/trace_basic_pitch_decoder_mechanisms.py \
              "/tmp/songsterr/$label/evidence-$label.json" \
              "/tmp/songsterr/$label/basic-pitch-note-activations-$label.json" \
              "/tmp/songsterr/$label/basic-pitch-decision-surface-$label.json" \
              --output "/tmp/songsterr/out/trace-$label.json" \
              2> "/tmp/songsterr/out/trace-$label.stderr"
            printf '%s\t%s\n' "$label" "$?" >> /tmp/songsterr/out/replay-status.tsv
          done
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('/tmp/songsterr/out')
          result = {}
          for row in (out/'replay-status.tsv').read_text().splitlines():
              label, raw_code = row.split('\t')
              code = int(raw_code)
              item = {'exitCode': code, 'exactReplaySucceeded': code == 0}
              if code == 0:
                  trace = json.loads((out/f'trace-{label}.json').read_text())
                  item['eventCount'] = trace['eventCount']
                  item['mechanismCounts'] = trace['mechanismCounts']
                  target = [e for e in trace['events'] if e['selectedMidi'] == 55 and abs(e['nearestStructureSlot'] - 46.151111111111106) < 1e-12]
                  item['midi55At46_151111111111106'] = target
              else:
                  item['stderr'] = (out/f'trace-{label}.stderr').read_text()[-12000:]
              result[label] = item
          (out/'replay-summary.json').write_text(json.dumps({
              'contract': 'songsterr-fresh-basic-pitch-decoder-replay-execution-v1',
              'sourceRun': 34546969446,
              'measurementOnly': True,
              'modelValidationComplete': False,
              'replays': result,
          }, indent=2, sort_keys=True) + '\n')
          PY

      - name: Update canonical checkpoint before CI
        env:
          ONE_SHOT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          cp = Path('docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md')
          text = cp.read_text(encoding='utf-8')
          decision = json.loads(Path('/tmp/songsterr/agg/decision-comparison-ab.json').read_text())
          sample = decision['measurement']['semanticInventory']['unmatchedSemanticEventSamples'][0]
          replay = json.loads(Path('/tmp/songsterr/out/replay-summary.json').read_text())['replays']

          presence = {}
          for label in ('a','b','c'):
              evidence = json.loads(Path(f'/tmp/songsterr/{label}/evidence-{label}.json').read_text())
              rows = evidence['onsets']
              presence[label] = {
                  'count': len(rows),
                  'old64': sum(1 for e in rows if e['selectedMidi'] == 64 and abs(e['nearestStructureSlot'] - 206.22657596371883) < 1e-12),
                  'new55': sum(1 for e in rows if e['selectedMidi'] == 55 and abs(e['nearestStructureSlot'] - 46.151111111111106) < 1e-12),
              }

          first = sample['firstSurface']
          second = sample['secondSurface']
          replay_parts = []
          for label in ('a','b','c'):
              item = replay[label]
              if item['exactReplaySucceeded']:
                  target = item['midi55At46_151111111111106']
                  suffix = f", target={target[0]['decoderMechanism']}" if target else ''
                  replay_parts.append(f"{label.upper()} PASS {item['eventCount']} {item['mechanismCounts']}{suffix}")
              else:
                  replay_parts.append(f"{label.upper()} FAIL exit={item['exitCode']}")

          block = f'''## ACTIVE WORK LOG — A/B/C DECISION SURFACE + DECODER REPLAY

- Inspected completed green run `34546969446` directly: aggregate artifact `10179540711`; observations A `10179528439`, B `10179504174`, C `10179525061`. No Demucs or Basic Pitch rerun was performed.
- A={presence['a']['count']} events, B={presence['b']['count']}, C={presence['c']['count']}. Across A/B/C the aggregate reports exactly one unmatched semantic event: MIDI `{sample['selectedMidi']}` at frozen slot `{sample['nearestStructureSlot']}`, source start `{sample['sourceStart']}` s, present only in B.
- Historical MIDI-64 slot `206.22657596371883` presence is A={presence['a']['old64']}, B={presence['b']['old64']}, C={presence['c']['old64']}; the new MIDI-55 slot presence is A={presence['a']['new55']}, B={presence['b']['new55']}, C={presence['c']['new55']}. B's 1,139-event result is therefore not the historical 1,139 semantic inventory.
- For the unmatched MIDI-55 frame, B's captured effective onset is `{first['effectiveOnsetActivation']}` with threshold margin `{first['effectiveOnsetMinusThreshold']}`; A/C is `{second['effectiveOnsetActivation']}` with margin `{second['effectiveOnsetMinusThreshold']}`. Both are strict local peaks. This sample toggles on the threshold-onset path; the measured margins are descriptive only and are not admission tolerances.
- Tracer focused CI wiring commit `b5a625a4ce12f530af2a63a0e52c5c8728fa9fef` failed in run `34547372731`, job `103102811353` because the synthetic intended-melodia activation `0.7` scaled to inferred onset about `0.7875`, so it correctly entered the threshold-onset pass. The synthetic fixture only is now `0.4`, which remains above frame threshold `0.3` while inferred onset is about `0.45`, below onset threshold `0.5`. No model, production threshold, admission, or duration setting changed.
- Repaired tracer self-test passed in one-shot run `{os.environ['ONE_SHOT_RUN_ID']}`. Exact replay against the already-captured real sidecars: {'; '.join(replay_parts)}. Decoder labels are trusted only where exact replay succeeded.
- `modelValidationComplete` remains false; customer-eligible events remain 0; duration research remains paused.

'''
          marker = '## CURRENT ACCEPTANCE STATE\n'
          old_heading = '## ACTIVE WORK LOG — A/B/C DECISION SURFACE + DECODER REPLAY\n'
          if old_heading in text:
              start = text.index(old_heading)
              end = text.index(marker, start)
              text = text[:start] + block + text[end:]
          else:
              if marker not in text:
                  raise SystemExit('checkpoint acceptance marker missing')
              text = text.replace(marker, block + marker, 1)
          stamp = datetime.now(ZoneInfo('America/Toronto')).strftime('%Y-%m-%d %H:%M America/Toronto')
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('Updated: '):
                  lines[i] = f'Updated: {stamp}'
                  break
          cp.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit tracer fix and checkpoint
        id: fix
        run: |
          rm .github/workflows/songsterr-fresh-decoder-replay-once.yml
          git config user.name 'dadrockyt-sys'
          git config user.email 'Stephen.s.mcnally@gmail.com'
          git add scripts/songsterr-fresh/trace_basic_pitch_decoder_mechanisms.py docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md .github/workflows/songsterr-fresh-decoder-replay-once.yml
          git commit -m 'fix: repair fresh decoder replay test and record evidence'
          git push origin HEAD:songsterr-fresh-pipeline-v1
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch and wait for official focused variation tests
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          FIX_SHA: ${{ steps.fix.outputs.sha }}
        run: |
          gh workflow run songsterr-fresh-model-evidence-variation-tests.yml --ref songsterr-fresh-pipeline-v1
          run_id=''
          for i in $(seq 1 60); do
            run_id=$(gh run list --workflow songsterr-fresh-model-evidence-variation-tests.yml --branch songsterr-fresh-pipeline-v1 --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$FIX_SHA\") | .databaseId" | head -n1)
            [ -n "$run_id" ] && break
            sleep 2
          done
          [ -n "$run_id" ] || { echo 'focused CI run not found' >&2; exit 1; }
          set +e
          gh run watch "$run_id" --exit-status
          watch_code=$?
          set -e
          gh run view "$run_id" --json databaseId,headSha,status,conclusion,jobs > /tmp/songsterr/out/official-ci.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "watch_code=$watch_code" >> "$GITHUB_OUTPUT"

      - name: Update checkpoint with official CI result
        env:
          FIX_SHA: ${{ steps.fix.outputs.sha }}
        run: |
          git pull --ff-only origin songsterr-fresh-pipeline-v1
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          cp = Path('docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md')
          text = cp.read_text(encoding='utf-8')
          ci = json.loads(Path('/tmp/songsterr/out/official-ci.json').read_text())
          jobs = ci.get('jobs') or []
          jobs_text = ', '.join(f"{j.get('databaseId')}:{j.get('conclusion')}" for j in jobs)
          line = f"- Official focused variation-test CI for tracer-fix commit `{os.environ['FIX_SHA']}`: run `{ci['databaseId']}`, conclusion `{ci.get('conclusion')}`, jobs `{jobs_text}`.\n"
          anchor = '- `modelValidationComplete` remains false; customer-eligible events remain 0; duration research remains paused.\n'
          if anchor not in text:
              raise SystemExit('checkpoint active-log anchor missing')
          text = text.replace(anchor, line + anchor, 1)
          stamp = datetime.now(ZoneInfo('America/Toronto')).strftime('%Y-%m-%d %H:%M America/Toronto')
          lines = text.splitlines()
          for i, value in enumerate(lines):
              if value.startswith('Updated: '):
                  lines[i] = f'Updated: {stamp}'
                  break
          cp.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git add docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md
          git commit -m 'docs: record fresh decoder replay focused CI'
          git push origin HEAD:songsterr-fresh-pipeline-v1

      - name: Upload replay diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songsterr-fresh-decoder-replay-followup
          path: /tmp/songsterr/out
          if-no-files-found: warn
          retention-days: 14
