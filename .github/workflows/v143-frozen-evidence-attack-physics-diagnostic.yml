name: V143 Frozen Evidence Attack Physics Diagnostic

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - debug/v143-contextual-prune/RUN_FROZEN_EVIDENCE_ATTACK_PHYSICS_ONCE

permissions:
  contents: write

concurrency:
  group: v143-frozen-evidence-attack-physics
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify sealed CPU-only inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f debug/v143-contextual-prune/RUN_FROZEN_EVIDENCE_ATTACK_PHYSICS_ONCE
          test -s debug/v143-contextual-prune/frozen-approved-audio-preholdout-evidence.json
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = '7f72f8ed9b14af8bc93e95544195204d99c6bec1'
          test "$(sha256sum public/gomywayfullaitest.m4a | awk '{print $1}')" = '215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f'
          python validation/rhythm_holdout/verify_runtime_isolation.py > /tmp/v143-runtime-isolation.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/v143-runtime-isolation.json').read_text())
          if p.get('passed') is not True:
              raise SystemExit('runtime isolation failed')
          PY

      - name: Run reference-free attack physics diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python analyzer/v143_frozen_evidence_attack_physics_diagnostic.py \
            debug/v143-contextual-prune/frozen-approved-audio-preholdout-evidence.json \
            debug/v143-contextual-prune/frozen-evidence-attack-physics-diagnostic.json \
            | tee /tmp/v143-attack-physics-summary.json
          test -s debug/v143-contextual-prune/frozen-evidence-attack-physics-diagnostic.json

      - name: Fail closed on diagnostic invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('debug/v143-contextual-prune/frozen-evidence-attack-physics-diagnostic.json').read_text())
          checks={
            'source': p.get('sourceAudioSha256')=='215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f',
            'referenceFree': p.get('referenceFree') is True,
            'professionalUnused': p.get('professionalReferenceUsed') is False,
            'runtimeInputUnused': p.get('referenceRuntimeInputUsed') is False,
            'modalUnused': p.get('modalUsed') is False,
            'productionUnmodified': p.get('productionModified') is False,
            'protectedRuntimeUnmodified': p.get('protectedRuntimeModified') is False,
            'noCandidate': p.get('candidateRenderProduced') is False,
            'attacks725': int(p.get('attackCount') or 0)==725,
            'noEventMutation': (p.get('invariants') or {}).get('eventsMutated') is False,
            'noGridMutation': (p.get('invariants') or {}).get('attackGridMutated') is False,
            'noPitchMutation': (p.get('invariants') or {}).get('pitchSelectionMutated') is False,
            'noReference': (p.get('invariants') or {}).get('referenceConsulted') is False,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit('attack physics diagnostic invariant failure: '+', '.join(failed))
          print(json.dumps({'passed':True,'checks':checks},sort_keys=True))
          PY

      - name: Commit diagnostic and consume marker
        shell: bash
        run: |
          set -euo pipefail
          git add -- debug/v143-contextual-prune/frozen-evidence-attack-physics-diagnostic.json
          git rm -- debug/v143-contextual-prune/RUN_FROZEN_EVIDENCE_ATTACK_PHYSICS_ONCE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record frozen-evidence attack physics diagnostic'
          for attempt in 1 2 3 4; do
            git fetch origin v143-contextual-prune-lobo
            git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
