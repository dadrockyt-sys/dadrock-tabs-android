name: Astra source-domain V3 final model-free coverage

on:
  push:
    branches: [astra-work]
    paths:
      - 'docs/astra/SOURCE_DOMAIN_JOINT_COVERAGE_V3_LAUNCH_V1.json'

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  v3-final:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'

      - name: Validate one-shot V3 marker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open('docs/astra/SOURCE_DOMAIN_JOINT_COVERAGE_V3_LAUNCH_V1.json'))
          assert x['schema']=='astra-source-domain-joint-coverage-v3-launch-v1'
          assert x['status']=='armed'
          assert x['launchIdentity']=='source-domain-v3-final-20260928-canonical-01'
          assert x['stageBResultSha256']=='d1f4ee0580ca98094fb12adabf76f437e6e3769c85b1fbc7f741205c9a3b13d2'
          assert x['v2InterventionSha256']=='a17a16daeb8d698e325dc6820f18d5eda2fec75d9beebe2a9605a678124dc26b'
          assert x['automaticRetry'] is False
          assert x['p1Access'] is False and x['p2Access'] is False and x['p3Access'] is False
          print('V3_FINAL_LAUNCH_OK')
          PY

      - name: Install frozen CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          python -m pip install --disable-pip-version-check pytest

      - name: Download exact frozen V1 preparation
        uses: actions/download-artifact@v4
        with:
          name: astra-source-domain-simulator-preparation-v1
          path: /tmp/astra-source-domain-v1
          github-token: ${{ github.token }}
          repository: dadrockyt-sys/dadrock-tabs-android
          run-id: '36475263654'

      - name: Download exact failed V2 Stage B artifact
        uses: actions/download-artifact@v4
        with:
          name: astra-source-domain-v2-stage-b-v1
          path: /tmp/astra-source-domain-v2-stage-b
          github-token: ${{ github.token }}
          repository: dadrockyt-sys/dadrock-tabs-android
          run-id: '36485375684'

      - name: Verify exact frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          CONTROL=/tmp/astra-source-domain-v1/datasets/s9-control.npz
          RESULT=/tmp/astra-source-domain-v2-stage-b/stage-b-result.json
          INTERVENTION=/tmp/astra-source-domain-v2-stage-b/v2-intervention.npz
          test "$(sha256sum "$CONTROL" | awk '{print $1}')" = "16123bfab56050e355e424be0050b11e6447b24c32c105da86c0ec971d599894"
          test "$(sha256sum "$RESULT" | awk '{print $1}')" = "d1f4ee0580ca98094fb12adabf76f437e6e3769c85b1fbc7f741205c9a3b13d2"
          test "$(sha256sum "$INTERVENTION" | awk '{print $1}')" = "a17a16daeb8d698e325dc6820f18d5eda2fec75d9beebe2a9605a678124dc26b"
          echo V3_FINAL_INPUTS_OK

      - name: Focused V3 tests
        env:
          PYTHONPATH: astra_backend
        run: |
          pytest -q astra_backend/synthetic/test_source_domain_joint_coverage_v3_final_v1.py

      - name: Run V3 final coverage exactly once
        env:
          PYTHONPATH: astra_backend
        shell: bash
        run: |
          set -euo pipefail
          python -m synthetic.source_domain_joint_coverage_v3_final_v1 \
            --control /tmp/astra-source-domain-v1/datasets/s9-control.npz \
            --stage-b-result /tmp/astra-source-domain-v2-stage-b/stage-b-result.json \
            --intervention /tmp/astra-source-domain-v2-stage-b/v2-intervention.npz \
            --out-dir /tmp/astra-source-domain-v3-final

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-source-domain-v3-final-coverage-v1
          path: /tmp/astra-source-domain-v3-final
          if-no-files-found: warn
          retention-days: 30
