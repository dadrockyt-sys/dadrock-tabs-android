name: V145 Rhythm Decoder CPU Proof

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v145-rhythm-decoder-cpu-proof.yml

permissions:
  contents: write

concurrency:
  group: v145-rhythm-decoder-cpu-proof
  cancel-in-progress: false

jobs:
  cpu-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen V145 identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object modal/v145_rhythm_decoder.py)" = "2fd979aebb4685e86c7f24a0162f69de306c06e9"
          test "$(git hash-object modal/tests/test_v145_rhythm_decoder.py)" = "9d48b02316f4eb364b163b3027c6c4d79304ac27"
          test -f docs/v145-rhythm-decoder-preregistration.md
          grep -Fq 'No Modal execution.' docs/v145-rhythm-decoder-preregistration.md
          grep -Fq 'No L4/GPU execution.' docs/v145-rhythm-decoder-preregistration.md
          ! grep -Eq '^[[:space:]]*(from[[:space:]]+modal|import[[:space:]]+modal)' modal/v145_rhythm_decoder.py

      - name: Compile CPU module and tests
        run: |
          python -m py_compile modal/v145_rhythm_decoder.py modal/tests/test_v145_rhythm_decoder.py

      - name: Run exact V145 CPU contract tests
        run: |
          python -m unittest modal.tests.test_v145_rhythm_decoder -v

      - name: Persist CPU proof
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          JOB: ${{ github.job }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p debug/v145-rhythm-decoder/proofs
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          proof = {
              "schemaVersion": 14501,
              "proofType": "v145-rhythm-decoder-cpu-core",
              "branch": "v143-contextual-prune-lobo",
              "workflowRunId": int(os.environ["RUN_ID"]),
              "workflowJob": os.environ["JOB"],
              "workflowHeadSha": os.environ["HEAD_SHA"],
              "coreBlob": "2fd979aebb4685e86c7f24a0162f69de306c06e9",
              "testBlob": "9d48b02316f4eb364b163b3027c6c4d79304ac27",
              "preregistrationCommit": "5a5c59d305dffba16090bc7dc37d33ecbb17e295",
              "cpuContractTestsPassed": True,
              "runtimeReferenceInput": False,
              "goldInputUsed": False,
              "fitLabelsRead": False,
              "validationLabelsRead": False,
              "canaryLabelsRead": False,
              "modalDependency": False,
              "modalGpuUsed": False,
              "liveAudioBenchmarkRun": False,
              "acceptedBaselineChanged": False,
          }
          Path("debug/v145-rhythm-decoder/proofs/cpu-core-proof.json").write_text(
              json.dumps(proof, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/v145-rhythm-decoder/proofs/cpu-core-proof.json
          git commit -m "v145 persist rhythm decoder cpu proof"
          git push origin HEAD:v143-contextual-prune-lobo
