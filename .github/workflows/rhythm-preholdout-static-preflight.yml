name: Rhythm Pre-Holdout Static Preflight

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - 'validation/rhythm_holdout/**'
      - 'app/ai-tab/page.js'
      - 'app/api/analyze-audio-tab/route.js'
      - 'app/api/generate-tab-preview/route.js'
      - 'app/api/generate-tab-pdf/route.js'
      - 'lib/v143RenderContract.js'
      - 'lib/v143AnalyzerQuality.js'
      - 'lib/jimmyPaigeAnalysisPayload.js'
      - 'lib/createJimmyPaigeProfessionalPdf.js'
      - 'lib/createAiTabPdf.js'
      - 'lib/createV143RhythmPdf.js'
      - '.github/workflows/rhythm-preholdout-static-preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rhythm-preholdout-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        id: install
        run: |
          set -euo pipefail
          mkdir -p .preholdout-static
          npm ci --ignore-scripts 2>&1 | tee .preholdout-static/install.log

      - name: Persist dependency-install diagnostic
        if: ${{ failure() && steps.install.outcome == 'failure' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          log_path = Path('.preholdout-static/install.log')
          lines = log_path.read_text(encoding='utf-8', errors='replace').splitlines()[-24:] if log_path.exists() else []
          clean = []
          for line in lines:
              line = re.sub(r'(?i)(token|secret|authorization|password)(\s*[:=]\s*)\S+', r'\1\2[REDACTED]', line)
              clean.append(line[:500])
          report = {
              'schemaVersion': 7,
              'gate': 'rhythm-preholdout-static-preflight',
              'sourceCommit': os.environ.get('GITHUB_SHA'),
              'passed': False,
              'failedStage': 'install-locked-dependencies',
              'exitStatus': 1,
              'failureLogTail': clean,
              'usesSyntheticAudioResponseOnly': True,
              'realProfessionalReferenceOpened': False,
              'productionModified': False,
              'productionPromotionAuthorized': False,
          }
          Path('.preholdout-static/report.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY

          mkdir -p debug/v143-contextual-prune
          cp .preholdout-static/report.json \
            debug/v143-contextual-prune/rhythm-preholdout-static-preflight.json
          git add debug/v143-contextual-prune/rhythm-preholdout-static-preflight.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record failed Rhythm dependency-install diagnostic' || true
          git fetch origin v143-contextual-prune-lobo || true
          git rebase origin/v143-contextual-prune-lobo || true
          git push origin HEAD:v143-contextual-prune-lobo || true

      - name: Run authoritative AI-tab PDF static pre-holdout gate
        run: |
          set -euo pipefail
          # The reusable runner verifies the analyzer anti-leakage gates,
          # app/ai-tab/page.js, and both PDF routes before rendering. Keep its
          # ESM copies below GITHUB_WORKSPACE so package resolution matches the
          # product environment (including pdf-lib).
          bash validation/rhythm_holdout/run_static_preholdout_preflight.sh \
            "$GITHUB_WORKSPACE/.preholdout-static"

      - name: Commit compact static proof
        run: |
          set -euo pipefail
          mkdir -p debug/v143-contextual-prune
          cp .preholdout-static/report.json \
            debug/v143-contextual-prune/rhythm-preholdout-static-preflight.json

          git add debug/v143-contextual-prune/rhythm-preholdout-static-preflight.json
          if git diff --cached --quiet; then
            echo 'Static preflight evidence already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record Rhythm pre-holdout static preflight'
          git fetch origin v143-contextual-prune-lobo
          git rebase origin/v143-contextual-prune-lobo
          git push origin HEAD:v143-contextual-prune-lobo
