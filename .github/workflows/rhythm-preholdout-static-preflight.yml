name: Rhythm Pre-Holdout Static Preflight

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - 'validation/rhythm_holdout/**'
      - 'app/ai-tab/page.js'
      - 'app/api/generate-tab-preview/route.js'
      - 'app/api/generate-tab-pdf/route.js'
      - 'lib/v143RenderContract.js'
      - 'lib/v143AnalyzerQuality.js'
      - 'lib/jimmyPaigeAnalysisPayload.js'
      - 'lib/createJimmyPaigeProfessionalPdf.js'
      - 'lib/createAiTabPdf.js'
      - 'lib/createV143RhythmPdf.js'
      - '.github/workflows/rhythm-preholdout-static-preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  static-preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts

      - name: Verify the actual AI-tab preview and purchased-PDF wiring
        run: |
          set -euo pipefail
          mkdir -p .preholdout-static/logs
          node validation/rhythm_holdout/verify_ai_tab_pdf_product_contract.mjs \
            .preholdout-static/logs/ai-tab-pdf-product-contract.json

      - name: Run reusable static pre-holdout gate
        run: |
          set -euo pipefail
          # Keep the standalone ESM copies inside the checked-out repository so
          # Node resolves the same installed pdf-lib dependency used by the
          # /ai-tab preview and purchased-PDF routes. The previous /tmp location
          # could fail at the polished PDF stage before the renderer itself ran.
          bash validation/rhythm_holdout/run_static_preholdout_preflight.sh \
            "$GITHUB_WORKSPACE/.preholdout-static"

      - name: Commit compact static proof
        run: |
          set -euo pipefail
          mkdir -p debug/v143-contextual-prune
          cp .preholdout-static/report.json \
            debug/v143-contextual-prune/rhythm-preholdout-static-preflight.json

          git add debug/v143-contextual-prune/rhythm-preholdout-static-preflight.json
          if git diff --cached --quiet; then
            echo 'Static preflight evidence already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record Rhythm pre-holdout static preflight'
          git fetch origin v143-contextual-prune-lobo
          git rebase origin/v143-contextual-prune-lobo
          git push origin HEAD:v143-contextual-prune-lobo
