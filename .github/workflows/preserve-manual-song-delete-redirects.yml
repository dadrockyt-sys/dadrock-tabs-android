name: Preserve manual song delete redirects

on:
  push:
    branches:
      - seo-preserve-manual-song-delete-redirects
    paths:
      - '.github/scripts/preserve_manual_song_delete_redirects.py'
      - '.github/workflows/preserve-manual-song-delete-redirects.yml'

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo-preserve-manual-song-delete-redirects

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply manual deletion redirect patch
        run: python .github/scripts/preserve_manual_song_delete_redirects.py

      - name: Verify diff
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Commit redirect registry fix
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/admin/sync-songs/route.js app/songs/[slug]/page.js app/[lang]/songs/[slug]/page.js
          git commit -m "Preserve redirects for manually deleted song pages"
          git push origin seo-preserve-manual-song-delete-redirects
