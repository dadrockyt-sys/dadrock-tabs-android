name: Songsterr Fresh GFN Train Position Discriminability V1

on:
  workflow_dispatch:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - "scripts/songsterr-fresh/guitar_fretboard_notes_train_discriminability_v1.py"
      - "scripts/songsterr-fresh/test_guitar_fretboard_notes_train_discriminability_v1.py"
      - ".github/workflows/songsterr-fresh-gfn-train-position-discriminability-v1.yml"

jobs:
  train-only-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen study dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.1.3" "pyarrow==18.1.0" "soundfile==0.12.1"
      - name: Compile study and tests
        run: python -m py_compile scripts/songsterr-fresh/guitar_fretboard_notes_train_discriminability_v1.py scripts/songsterr-fresh/test_guitar_fretboard_notes_train_discriminability_v1.py
      - name: Run synthetic contract tests
        run: python scripts/songsterr-fresh/test_guitar_fretboard_notes_train_discriminability_v1.py
      - name: Run pinned train-only real-audio feasibility study
        run: python scripts/songsterr-fresh/guitar_fretboard_notes_train_discriminability_v1.py --output gfn-train-position-discriminability-v1-result.json
      - name: Print frozen primary metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("gfn-train-position-discriminability-v1-result.json").read_text())
          print(json.dumps({
              "datasetRevision": result["datasetRevision"],
              "datasetSplitAccessed": result["datasetSplitAccessed"],
              "reservedSplitsAccessed": result["reservedSplitsAccessed"],
              "observedSources": result["integrity"]["observedSources"],
              "pooled": result["primaryCrossSessionResult"]["pooled"],
              "basicPitchAuthorized": result["basicPitchAuthorized"],
              "v6Authorized": result["v6Authorized"],
              "correctnessAuthorized": result["correctnessAuthorized"],
          }, sort_keys=True, indent=2))
          PY
      - name: Upload canonical feasibility result
        uses: actions/upload-artifact@v4
        with:
          name: songsterr-fresh-gfn-train-position-discriminability-v1
          path: gfn-train-position-discriminability-v1-result.json
          if-no-files-found: error
          retention-days: 30
