name: Astra V3 zero-optimizer boundary diagnostic retry v2

on:
  push:
    branches:
      - astra-work
    paths:
      - 'docs/astra/TINY_FIT_V3_DIAGNOSTIC_LAUNCH_V2.json'

permissions:
  actions: read
  contents: read

concurrency:
  group: astra-v3-zero-optimizer-diagnostic-v2
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact authorized diagnostic launch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'

      - name: Verify diagnostic authorization and pinned identities
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/astra/TINY_FIT_V3_DIAGNOSTIC_AUTHORIZATION_V2.json
          test -f docs/astra/TINY_FIT_V3_DIAGNOSTIC_LAUNCH_V2.json
          python - <<'PY'
          import json, subprocess
          def blob(path):
              return subprocess.check_output(['git','hash-object',path], text=True).strip()
          auth=json.load(open('docs/astra/TINY_FIT_V3_DIAGNOSTIC_AUTHORIZATION_V2.json'))
          launch=json.load(open('docs/astra/TINY_FIT_V3_DIAGNOSTIC_LAUNCH_V2.json'))
          assert auth['schema']=='astra-tiny-fit-v3-diagnostic-authorization-v2'
          assert auth['authorization']['p1MediaAccessAuthorized'] is True
          assert auth['authorization']['optimizerStepsAuthorized']==0
          assert auth['authorization']['p2Authorized'] is False
          assert auth['authorization']['p3Authorized'] is False
          assert auth['authorization']['thresholdRetuningAuthorized'] is False
          assert launch['schema']=='astra-tiny-fit-v3-diagnostic-launch-v2'
          assert launch['singleLaunch'] is True
          expected={
            'authorizationGitBlob':'docs/astra/TINY_FIT_V3_DIAGNOSTIC_AUTHORIZATION_V2.json',
            'diagnosticGitBlob':'astra_backend/evaluation/tiny_fit_v3_diagnostic.py',
            'diagnosticTestsGitBlob':'astra_backend/evaluation/test_tiny_fit_v3_diagnostic.py',
            'tinyFitHarnessGitBlob':'astra_backend/tiny_fit_pilot_v1.py',
            'preparedEventAdapterGitBlob':'astra_backend/evaluation/prepared_event_adapter_v1.py',
            'eventContractV2GitBlob':'astra_backend/evaluation/event_contract_v2.py',
            'runtimeLockGitBlob':'astra_backend/tabcnn_runtime/requirements.lock.txt',
            'alignmentCorrectionsGitBlob':'docs/astra/GUITARTECHS_PRIMARY_ALIGNMENT_CORRECTIONS_V1.json',
            'v3ResultReceiptGitBlob':'docs/astra/TINY_FIT_PILOT_REAL_RESULT_V3.json',
            'diagnosticV1FailureReceiptGitBlob':'docs/astra/TINY_FIT_V3_DIAGNOSTIC_FAILURE_V1.json',
            'workflowGitBlob':'.github/workflows/astra-tiny-fit-v3-diagnostic-v2.yml',
          }
          for key,path in expected.items():
              actual=blob(path)
              assert launch['sourceIdentities'][key]==actual,(key,path,'launch')
              if key!='authorizationGitBlob':
                  assert auth['sourceIdentities'][key]==actual,(key,path,'authorization')
          PY
          echo "DIAGNOSTIC_OPTIMIZER_STEPS_AUTHORIZED=0"
          echo "P2_OPENED=false"
          echo "P3_OPENED=false"

      - name: Install exact frozen runtime and source tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check             --extra-index-url https://download.pytorch.org/whl/cpu             --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          python -m pip check
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip
          python - <<'PY'
          import numpy, torch
          assert numpy.__version__ == '1.21.6'
          assert torch.__version__ == '1.11.0+cpu'
          PY

      - name: Download exact frozen V3 model artifact
        uses: actions/download-artifact@v4
        with:
          name: astra-tiny-fit-capped-p1-pilot-v3
          path: /tmp/v3-artifact
          github-token: ${{ github.token }}
          repository: dadrockyt-sys/dadrock-tabs-android
          run-id: 36280547470

      - name: Verify frozen V3 artifact identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /tmp/v3-artifact/tiny-fit-model.pt | awk '{print $1}')" = "fba076f8b6e5fe177ba7b15e5d6780269194f530b2648037ac0763a4937eb67f"
          test "$(sha256sum /tmp/v3-artifact/tiny-fit-result.json | awk '{print $1}')" = "1bda3d5b7c790641742a99c07685c8d477938cd7426ad48f58d84928a3328647"

      - name: Reprepare exactly four frozen P1 examples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/diagnostic-examples /tmp/selected
          while IFS=$'\t' read -r file bytes md5 sha capture; do
            rm -rf /tmp/selected/*
            curl --fail --location --connect-timeout 30 --max-time 1200               --user-agent 'Astra-V3-Zero-Optimizer-Diagnostic/1.0'               -o "/tmp/$file"               "https://zenodo.org/records/14963133/files/$file?download=1"
            test "$(stat -c '%s' "/tmp/$file")" = "$bytes"
            test "$(md5sum "/tmp/$file" | awk '{print $1}')" = "$md5"
            test "$(sha256sum "/tmp/$file" | awk '{print $1}')" = "$sha"
            PYTHONPATH=astra_backend:astra_backend/evaluation               python astra_backend/tiny_fit_pilot_v1.py extract-selected-source               --archive "/tmp/$file" --capture-key "$capture" --output-dir /tmp/selected
            rm -f "/tmp/$file"
            PYTHONPATH=astra_backend:astra_backend/evaluation               python astra_backend/tiny_fit_pilot_v1.py prepare-capture               --root /tmp/selected --capture-key "$capture"               --corrections docs/astra/GUITARTECHS_PRIMARY_ALIGNMENT_CORRECTIONS_V1.json               --output-dir /tmp/diagnostic-examples
          done <<'EOF'
          P1_chords.zip	981741162	be9ef8bbdceb1912d565254e607a6d94	de4aa76ef4b86ce981496161b741dc39bd22dec5250da351e5e68a44da249326	P1|chords|Drop3_7|directinput
          P1_scales.zip	453349723	9c0b98e8fb42a522df727ea8bf545e4f	79d7e9d148820867a9095697c9521e40a4b11c198384edfce1951de7219b3509	P1|scales|Ab|directinput
          P1_singlenotes.zip	108626613	ca0c4674dde3805574685a313f7c39eb	130592ae5555476ea8e4070c0f3421794ef8b5e252dfa780745d07eedd0eb4a4	P1|singlenotes|allsinglenotes|directinput
          P1_techniques.zip	326280863	18634a41a6db5a8de10d07eb3122a872	1e4b80a464182d345e129f3e1158b6c05690c60b5f9be4bde3fb26f23263236e	P1|techniques|PalmMute|directinput
          EOF
          test "$(find /tmp/diagnostic-examples -name meta.json | wc -l)" = '4'
          echo "DIAGNOSTIC_P1_EXAMPLES_PREPARED=4"
          echo "OPTIMIZER_STEPS_EXECUTED=0"

      - name: Run zero-optimizer boundary diagnostic
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=astra_backend:astra_backend/evaluation             python astra_backend/evaluation/tiny_fit_v3_diagnostic.py             --examples-dir /tmp/diagnostic-examples             --model /tmp/v3-artifact/tiny-fit-model.pt             --frozen-result /tmp/v3-artifact/tiny-fit-result.json             --out /tmp/tiny-fit-v3-diagnostic.json

      - name: Verify diagnostic stayed zero-optimizer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open('/tmp/tiny-fit-v3-diagnostic.json'))
          assert x['schema']=='astra-tiny-fit-v3-zero-optimizer-diagnostic-v1'
          assert x['execution']['optimizerStepsExecuted']==0
          assert x['execution']['thresholdsChanged'] is False
          assert x['execution']['modelWeightsChanged'] is False
          assert x['guards']['p2Opened'] is False
          assert x['guards']['p3Opened'] is False
          assert len(x['examples'])==4
          PY
          echo "OPTIMIZER_STEPS_EXECUTED=0"
          echo "P2_OPENED=false"
          echo "P3_OPENED=false"

      - name: Upload bounded diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: astra-v3-zero-optimizer-boundary-diagnostic-v1
          path: /tmp/tiny-fit-v3-diagnostic.json
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup P1 media and prepared arrays
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/diagnostic-examples /tmp/selected /tmp/P1_*.zip /tmp/v3-artifact
          echo "OPTIMIZER_STEPS_EXECUTED=0"
          echo "P2_MEDIA_ACCESSED=false"
          echo "P3_MEDIA_ACCESSED=false"
