name: Songsterr Fresh Demucs Common AVX2 Cross-Host Canary

on:
  workflow_dispatch:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-demucs-common-avx2-cross-host-canary.yml'
      - 'scripts/songsterr-fresh/record_demucs_common_avx2_provenance.py'
      - 'scripts/songsterr-fresh/compare_demucs_common_avx2_cross_host.py'
      - 'scripts/songsterr-fresh/verify_demucs_model_asset.py'

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  common-avx2:
    name: common-avx2-${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sample: [a, b, c, d, e]

    steps:
      - name: Check out fresh branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch and verify exact authorized fixture
        shell: bash
        run: |
          set -euo pipefail
          BASE="/tmp/songsterr-fresh-demucs-common-avx2-${{ matrix.sample }}"
          mkdir -p "$BASE"
          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/dadrockyt-sys/dadrock-tabs-android/main/public/jimmy-paige-midterm-v1/gomyway-midterm-source.m4a' \
            --output /tmp/gomyway-midterm-source.m4a
          test "$(git hash-object /tmp/gomyway-midterm-source.m4a)" = '4dd709e3fa177b4daeed71ca97f0199757729d4b'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/gomyway-midterm-source.m4a \
            -ac 2 -ar 44100 \
            /tmp/gomyway-midterm-separation.wav
          INPUT_SHA="$(sha256sum /tmp/gomyway-midterm-separation.wav | awk '{print $1}')"
          test "$INPUT_SHA" = 'e03e1885185f4983b3eeaa66f36510b7709d607c14010f964e0aad427ecc474a'
          printf '%s\n' "$INPUT_SHA" > "$BASE/separation-input.sha256"

      - name: Install pinned separation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 \
            torch==2.14.0 \
            huggingface-hub==1.30.0 \
            safetensors==0.8.0 \
            sphn==0.2.1 \
            demucs==4.1.0 \
            soundfile==0.13.1

      - name: Capture native host before caps
        id: native
        shell: bash
        run: |
          set -euo pipefail
          CPU_MODEL="$(awk -F: '/^model name/{gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2; exit}' /proc/cpuinfo)"
          CPU_VENDOR_RAW="$(lscpu | awk -F: '/^Vendor ID:/{gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2; exit}')"
          case "$CPU_VENDOR_RAW" in
            GenuineIntel) CPU_VENDOR='Intel' ;;
            AuthenticAMD) CPU_VENDOR='AMD' ;;
            *) CPU_VENDOR="$CPU_VENDOR_RAW" ;;
          esac
          NATIVE_CAP="$(python - <<'PY'
          import torch
          print(torch.backends.cpu.get_cpu_capability())
          PY
          )"
          REGION="$(curl -fsS --max-time 2 -H Metadata:true \
            'http://169.254.169.254/metadata/instance/compute/location?api-version=2021-02-01&format=text' || true)"
          printf 'cpu_model=%s\n' "$CPU_MODEL" >> "$GITHUB_OUTPUT"
          printf 'cpu_vendor=%s\n' "$CPU_VENDOR" >> "$GITHUB_OUTPUT"
          printf 'native_cap=%s\n' "$NATIVE_CAP" >> "$GITHUB_OUTPUT"
          printf 'azure_region=%s\n' "$REGION" >> "$GITHUB_OUTPUT"
          printf 'Native host: vendor=%s model=%s torch_cap=%s region=%s\n' \
            "$CPU_VENDOR" "$CPU_MODEL" "$NATIVE_CAP" "${REGION:-unknown}"

      - name: Verify combined AVX2 controls
        id: caps
        shell: bash
        run: |
          set -euo pipefail
          BASE="/tmp/songsterr-fresh-demucs-common-avx2-${{ matrix.sample }}"
          CAP="$(ATEN_CPU_CAPABILITY=avx2 python - <<'PY'
          import torch
          print(torch.backends.cpu.get_cpu_capability())
          PY
          )"
          test "$CAP" = 'AVX2'
          ONEDNN_VERBOSE=1 ONEDNN_MAX_CPU_ISA=AVX2 python - <<'PY' > "$BASE/onednn-avx2.log" 2>&1
          import torch
          x = torch.randn(2, 16, 64, 64)
          m = torch.nn.Conv2d(16, 16, 3).eval()
          with torch.no_grad():
              for _ in range(3):
                  x = m(x)
                  x = torch.nn.functional.pad(x, (1, 1, 1, 1))
          print(float(x.sum()))
          PY
          ONEDNN_ISA_LINE="$(grep -m1 -E 'onednn_verbose.*cpu,isa:.*AVX2' "$BASE/onednn-avx2.log")"
          test -n "$ONEDNN_ISA_LINE"
          printf 'onednn_isa_line=%s\n' "$ONEDNN_ISA_LINE" >> "$GITHUB_OUTPUT"
          echo "ATen capped capability: $CAP"
          echo "oneDNN capped ISA: $ONEDNN_ISA_LINE"

      - name: Run one fixed Demucs pass under combined AVX2 caps
        shell: bash
        env:
          ATEN_CPU_CAPABILITY: avx2
          ONEDNN_MAX_CPU_ISA: AVX2
        run: |
          set -euo pipefail
          BASE="/tmp/songsterr-fresh-demucs-common-avx2-${{ matrix.sample }}"
          python -m demucs \
            -n htdemucs_6s \
            --device cpu \
            --shifts 0 \
            --overlap 0.25 \
            --segment 7 \
            -o "$BASE/separated" \
            /tmp/gomyway-midterm-separation.wav
          STEM="$BASE/separated/htdemucs_6s/gomyway-midterm-separation/guitar.wav"
          test -s "$STEM"
          sha256sum "$STEM" | tee "$BASE/guitar-stem.sha256"

      - name: Verify exact pinned Demucs model asset
        shell: bash
        run: |
          set -euo pipefail
          BASE="/tmp/songsterr-fresh-demucs-common-avx2-${{ matrix.sample }}"
          python scripts/songsterr-fresh/verify_demucs_model_asset.py \
            --output "$BASE/demucs-model-asset.json"
          python - <<PY
          import json
          data = json.load(open('$BASE/demucs-model-asset.json', encoding='utf-8'))
          required = {
              'contract': 'songsterr-fresh-demucs-model-asset-v2',
              'primaryLoader': 'huggingface',
              'hfRepoId': 'adefossez/HTDemucs-6s',
              'hfPinnedRevision': '3c5ee475be622df764938de97e4281a7b07ffa58',
              'hfAssetUploadRevision': '053e1404489b3dc58bf718224fac4b7316de8c93',
              'assetFilename': '5c90dfd2.safetensors',
              'assetSha256': 'd2a1745f0744721f6b8ca5bf469b67c651ea5ed1b52998cab033b2158609d411',
          }
          for key, expected in required.items():
              if data.get(key) != expected:
                  raise SystemExit(f'DEMUCS_COMMON_AVX2_MODEL_ASSET_CHANGED:{key}:{data.get(key)}')
          if data.get('legacyFallback', {}).get('primary') is not False:
              raise SystemExit('DEMUCS_COMMON_AVX2_LEGACY_FALLBACK_PRIMARY')
          PY

      - name: Record strict common-AVX2 provenance
        shell: bash
        env:
          ATEN_CPU_CAPABILITY: avx2
          ONEDNN_MAX_CPU_ISA: AVX2
        run: |
          set -euo pipefail
          BASE="/tmp/songsterr-fresh-demucs-common-avx2-${{ matrix.sample }}"
          STEM="$BASE/separated/htdemucs_6s/gomyway-midterm-separation/guitar.wav"
          INPUT_SHA="$(cat "$BASE/separation-input.sha256")"
          python scripts/songsterr-fresh/record_demucs_common_avx2_provenance.py \
            --stem "$STEM" \
            --input-sha256 "$INPUT_SHA" \
            --model-asset "$BASE/demucs-model-asset.json" \
            --sample-label '${{ matrix.sample }}' \
            --native-cpu-model '${{ steps.native.outputs.cpu_model }}' \
            --native-cpu-vendor '${{ steps.native.outputs.cpu_vendor }}' \
            --native-torch-capability '${{ steps.native.outputs.native_cap }}' \
            --onednn-isa-line '${{ steps.caps.outputs.onednn_isa_line }}' \
            --azure-region '${{ steps.native.outputs.azure_region }}' \
            --output "$BASE/provenance-${{ matrix.sample }}.json"

      - name: Prove per-host diagnostic boundaries
        shell: bash
        run: |
          set -euo pipefail
          BASE="/tmp/songsterr-fresh-demucs-common-avx2-${{ matrix.sample }}"
          python - <<PY
          import json
          payload = json.load(open('$BASE/provenance-${{ matrix.sample }}.json', encoding='utf-8'))
          if payload.get('contract') != 'songsterr-fresh-demucs-common-avx2-provenance-v1':
              raise SystemExit('DEMUCS_COMMON_AVX2_PROVENANCE_CONTRACT_CHANGED')
          if payload.get('referenceBlind') is not True or payload.get('diagnosticOnly') is not True:
              raise SystemExit('DEMUCS_COMMON_AVX2_PROVENANCE_SCOPE_CHANGED')
          if payload.get('executionContractCandidate', {}).get('productionAuthorized') is not False:
              raise SystemExit('DEMUCS_COMMON_AVX2_PRODUCTION_AUTH_CHANGED')
          hard = payload.get('hardGuards') or {}
          if not hard or any(value is not False for value in hard.values()):
              raise SystemExit('DEMUCS_COMMON_AVX2_PROVENANCE_GUARD_CHANGED')
          PY

      - name: Upload provenance only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songsterr-fresh-demucs-common-avx2-${{ matrix.sample }}
          path: |
            /tmp/songsterr-fresh-demucs-common-avx2-${{ matrix.sample }}/provenance-${{ matrix.sample }}.json
            /tmp/songsterr-fresh-demucs-common-avx2-${{ matrix.sample }}/demucs-model-asset.json
            /tmp/songsterr-fresh-demucs-common-avx2-${{ matrix.sample }}/separation-input.sha256
            /tmp/songsterr-fresh-demucs-common-avx2-${{ matrix.sample }}/guitar-stem.sha256
            /tmp/songsterr-fresh-demucs-common-avx2-${{ matrix.sample }}/onednn-avx2.log
          if-no-files-found: warn
          retention-days: 14

  compare-common-avx2:
    name: compare-common-avx2-cross-host
    needs: common-avx2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out fresh branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download independent common-AVX2 provenance
        uses: actions/download-artifact@v4
        with:
          pattern: songsterr-fresh-demucs-common-avx2-*
          path: /tmp/songsterr-fresh-demucs-common-avx2-inputs
          merge-multiple: true

      - name: Compare exact hashes and vendor coverage only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/songsterr-fresh-demucs-common-avx2-comparison
          python scripts/songsterr-fresh/compare_demucs_common_avx2_cross_host.py \
            --inputs /tmp/songsterr-fresh-demucs-common-avx2-inputs/provenance-*.json \
            --output /tmp/songsterr-fresh-demucs-common-avx2-comparison/comparison.json

      - name: Prove aggregate diagnostic boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          path = '/tmp/songsterr-fresh-demucs-common-avx2-comparison/comparison.json'
          payload = json.load(open(path, encoding='utf-8'))
          if payload.get('contract') != 'songsterr-fresh-demucs-common-avx2-cross-host-comparison-v1':
              raise SystemExit('DEMUCS_COMMON_AVX2_COMPARISON_CONTRACT_CHANGED')
          if payload.get('referenceBlind') is not True or payload.get('diagnosticOnly') is not True:
              raise SystemExit('DEMUCS_COMMON_AVX2_COMPARISON_SCOPE_CHANGED')
          interpretation = payload.get('interpretationGuards') or {}
          if not interpretation or any(value is not False for value in interpretation.values()):
              raise SystemExit('DEMUCS_COMMON_AVX2_INTERPRETATION_GUARD_CHANGED')
          hard = payload.get('hardGuards') or {}
          if not hard or any(value is not False for value in hard.values()):
              raise SystemExit('DEMUCS_COMMON_AVX2_HARD_GUARD_CHANGED')
          if payload.get('observationCount') != 5:
              raise SystemExit('DEMUCS_COMMON_AVX2_EXPECTED_FIVE_HOSTS')
          PY

      - name: Upload aggregate comparison
        uses: actions/upload-artifact@v4
        with:
          name: songsterr-fresh-demucs-common-avx2-cross-host-comparison
          path: /tmp/songsterr-fresh-demucs-common-avx2-comparison/comparison.json
          if-no-files-found: error
          retention-days: 14
