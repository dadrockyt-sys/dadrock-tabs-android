name: V154 explicit next steps checkpoint once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v154-explicit-next-steps-checkpoint-once.yml

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0
      - name: Append explicit next steps
        shell: bash
        run: |
          set -euo pipefail
          marker='## V154 explicit next steps — FROZEN EXECUTION ORDER — 2026-08-27 UTC'
          if grep -Fq "$marker" docs/checkpoints/CURRENT_STATE.md; then
            echo 'explicit next steps already present'
            exit 0
          fi
          cat docs/checkpoints/V154_EXPLICIT_NEXT_STEPS_20260827.md >> docs/checkpoints/CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/checkpoints/CURRENT_STATE.md
          git commit -m 'docs: append V154 explicit next steps [skip ci]'
          git pull --rebase origin v143-contextual-prune-lobo
          git push origin HEAD:v143-contextual-prune-lobo
