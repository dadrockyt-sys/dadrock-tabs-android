name: V168 SplitMySong exact Demucs replay checkpoint

"on":
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v168-splitmysong-demucs-replay-checkpoint.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0
      - name: Append checkpoint and self-delete
        shell: bash
        env:
          SECTION: |
            
            ## 2026-09-01 continuation checkpoint — exact V166 Demucs replay still byte-divergent
            - Replayed the authoritative V166 historical Demucs stage on GitHub Actions without private SplitMySong audio, Basic Pitch inference, candidate generation, scorer/reference access, or artifacts. Replay workflow commit: `c423547214989092855fe6a4e63fb4df0fccf12c`; run **`33562935451`**, job **`100039447509`**.
            - The replay matched the authoritative V166 execution surface that was recoverable from run `33226705813` / job `99031747626`: Ubuntu 24.04.4 runner image `20260823.283.1`, Python `3.10.21`, Torch `2.8.0+cpu`, CUDA unavailable, exact historical source bytes, exact normalized mix SHA256 **`3e61b7926eabc21b758c750f826c7426a29d6de5aafdd5c93f8045ecdc67f87e`**, Demucs `4.1.0`, `htdemucs_6s`, CPU, `--shifts 1`, `-j 1`, deterministic algorithms and one-thread math.
            - The second replay additionally restored the two resolver versions that had drifted since Aug 29 — `joblib==1.5.3` and `platformdirs==4.11.5` — and removed `cloudpickle`, which was absent from the successful V166 environment. The historical dependency-resolution guard passed before separation.
            - Hugging Face model identity also matched: `adefossez/HTDemucs-6s`, snapshot **`3c5ee475be622df764938de97e4281a7b07ffa58`**, `htdemucs_6s.yaml` SHA256 **`207405151270af8fd81c2373c25d27950916682ac91dca7884a11ce13dad6f58`**, and `5c90dfd2.safetensors` SHA256 **`d2a1745f0744721f6b8ca5bf469b67c651ea5ed1b52998cab033b2158609d411`**.
            - Despite those matches, fresh exact-transitive stem bytes remained different. Replay Guitar SHA256 **`b8685062c59f5c62253029f8294afdaf25f3f8adf8868ae97b47db09ab8838f9`**, Bass **`f109347354dd9ae4a293189834b1f6d58199a4eebe5d51dfeeedc6707c4a5316`**, Drums **`7ef184f2fc3b6f7fc12ea5c342bc537f6b69f1680ce36e9d4f7189be85d93e39`**. The frozen authoritative V166 hashes remain unchanged: Guitar **`4c71e9e15dd07e60a5442923b86523bafe4313056ca3c892054a607aa7e4e9d2`**, Bass **`4b34b2bc3367d9f8ed4dce39b95ad3d60c49d6541186df6b0d24a4211b03c7ef`**, Drums **`05890ac9cad62eacf0099c962b137a458228811a85b8ea828bb15f238d2c1e50`**.
            - Current replay CPU was `AMD EPYC 7763 64-Core Processor`; the Aug-29 V166 log did not print its CPU model. Therefore hardware-dependent floating-point behavior is now a strong hypothesis but is **not claimed proven**.
            - Important scope correction: SplitMySong diagnostic candidate construction consumes historical **mix + drums** for the shared onset context and the frozen V166 timebase; historical Demucs Guitar/Bass are not candidate inputs. The frozen shared onset formula is `unit_norm(0.65 * onset_env(drums) + 0.35 * onset_env(mix))`.
            - Next safe research step is a **no-Basic-Pitch downstream timing-equivalence diagnostic**. Using the frozen V166 candidate's persisted `stepSelection` rows, recompute current shared supports from a fresh drifted Drums stem while retaining each historical event's frozen instrument supports, then compare frozen-vs-current selected grid steps and support differences. This tests whether byte-level stem drift actually changes the timing decision surface used by V166 without reading any professional reference or scorer.
            - Do **not** weaken the frozen historical stem hashes and do not run the one-shot SplitMySong candidate generator yet. The failed private Codespace `.building` directory remains preserved for read-only diagnosis.
            - **Project Progress Score remains 60%; Test Score remains NOT RUN; SplitMySong Basic Pitch attempts remain 0; diagnostic/V168 reference-facing score calls remain 0.** No GPU/CUDA/Modal, `main`, or Production change occurred.
        run: |
          set -euo pipefail
          BRANCH=v143-contextual-prune-lobo
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"
          test "$(grep -c 'exact V166 Demucs replay still byte-divergent' docs/checkpoints/CURRENT_STATE.md || true)" = "0"
          printf '%s\n' "$SECTION" >> docs/checkpoints/CURRENT_STATE.md
          rm .github/workflows/v168-splitmysong-demucs-replay-checkpoint.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/checkpoints/CURRENT_STATE.md .github/workflows/v168-splitmysong-demucs-replay-checkpoint.yml
          git commit -m 'Checkpoint exact V166 Demucs replay'
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
