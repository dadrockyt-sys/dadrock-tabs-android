name: V154 checkpoint Rhythm once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v154-checkpoint-rhythm-once.yml

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0

      - name: Update CURRENT_STATE
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/checkpoints/CURRENT_STATE.md')
          text = path.read_text(encoding='utf-8')

          old_active = 'Active phase: **V154 broad-Other CPU recognition output is COMPLETE / FROZEN / STRUCTURAL-QC PASS. Rhythm, Bass, and Lead are now preserved machine-readably. Bass and Lead remain visual-order references without frozen exact 16-step scorer timing. Professional-reference scoring has NOT run.**'
          new_active = 'Active phase: **V154 broad-Other CPU recognition output is COMPLETE / FROZEN / STRUCTURAL-QC PASS. Rhythm scorer-ready timing normalization is now COMPLETE / FROZEN. Bass and Lead remain visual-order references without frozen exact 16-step scorer timing. Professional-reference scoring has NOT run.**'
          if old_active in text:
              text = text.replace(old_active, new_active, 1)

          old_steps = '''## Exact next steps
1. Freeze a scorer-ready Rhythm normalization derived only from the already-frozen Rhythm reference (`measure`, `step`, `midi`), with provenance/count/hash receipt. Save checkpoint.
2. Normalize Bass exact 16-step attacks from the canonical source notation page-by-page. Preserve dead notes/continuations appropriately; exclude only explicitly justified uncertainty (including measure 88 until resolved). Freeze scorer-ready Bass rows and provenance/count/hash receipt. Save checkpoint frequently.
3. Recover the actual 22 Lead source pages. **Do not** infer exact Lead timing from visual-order JSON alone. Normalize Lead from source notation, preserve uncertainty flags, then freeze scorer-ready Lead rows and receipt. Save checkpoint.
4. Assemble one immutable scorer reference payload with authorized private-scoring flags and Rhythm/Lead/Bass rows. Verify its identity before any score call.
5. Score the exact frozen combined Guitar first and Bass second **exactly once** with `score_frontend_reference.py`; interpret preregistered gates; never retune this consumed output afterward.
6. Only after acoustic recognition is scored/frozen: continue Rhythm/Lead role separation, fret/string assignment, techniques, and PDF work.'''
          new_steps = '''## Exact next steps
1. Do not alter the frozen scorer-ready Rhythm normalization (`rhythm-professional-reference-scorer-ready.json`, SHA256 `d6c9416979f25e6a81b9cd4583389b584a59421a0529fcccb4ca6f5dd47e679f`).
2. Normalize Bass exact 16-step attacks from the canonical source notation page-by-page. Preserve dead notes/continuations appropriately; exclude only explicitly justified uncertainty (including measure 88 until resolved). Freeze scorer-ready Bass rows and provenance/count/hash receipt. Save checkpoint frequently.
3. Recover the actual 22 Lead source pages. **Do not** infer exact Lead timing from visual-order JSON alone. Normalize Lead from source notation, preserve uncertainty flags, then freeze scorer-ready Lead rows and receipt. Save checkpoint.
4. Assemble one immutable scorer reference payload with authorized private-scoring flags and Rhythm/Lead/Bass rows. Verify its identity before any score call.
5. Score the exact frozen combined Guitar first and Bass second **exactly once** with `score_frontend_reference.py`; interpret preregistered gates; never retune this consumed output afterward.
6. Only after acoustic recognition is scored/frozen: continue Rhythm/Lead role separation, fret/string assignment, techniques, and PDF work.'''
          if old_steps not in text:
              raise SystemExit('Expected Exact next steps block not found; refusing ambiguous checkpoint edit')
          text = text.replace(old_steps, new_steps, 1)

          section = '''\n\n## V154 Rhythm scorer-ready normalization — COMPLETE / FROZEN\n- One-use CPU GitHub Actions run `33121732460` completed successfully and sealed its workflow.\n- Frozen source: `research/v154-professional-references/rhythm-professional-reference.json`, SHA256 `18fd868ae960dfcdd1ffb0110f1a9dfd8acc2ffeb46e247d1116cd54291526ac`.\n- Frozen scorer-ready output: `research/v154-professional-references/rhythm-professional-reference-scorer-ready.json`, SHA256 `d6c9416979f25e6a81b9cd4583389b584a59421a0529fcccb4ca6f5dd47e679f`.\n- Receipt: `research/v154-professional-references/rhythm-professional-reference-scorer-ready-receipt.json`; Git blob `a62aad39bbc8a05c38c03c1461fc750246110270`.\n- Deterministic flatten: 113 measures, 603 source events, **946 scorer rows**, MIDI 40–71, step range 0–15, exact duplicate-row extras 0.\n- This normalization read only the already-frozen Rhythm professional reference. Candidate read **NO**; generated candidate modified **NO**; reference-facing score calls **0**; human correction **NO**; threshold sweep **NO**; Modal/L4/CUDA/GPU **NO**; `main`/Production modified **NO**.\n- Next active task is Bass exact rhythmic normalization from canonical source notation; Lead timing remains blocked until the actual 22 Lead source pages are recovered.\n'''
          if '## V154 Rhythm scorer-ready normalization — COMPLETE / FROZEN' not in text:
              text = text.rstrip() + section

          path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Commit checkpoint and seal workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dadrock-v154-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/checkpoints/CURRENT_STATE.md
          git rm .github/workflows/v154-checkpoint-rhythm-once.yml
          git commit -m "v154: checkpoint frozen Rhythm scorer normalization"
          git push origin HEAD:v143-contextual-prune-lobo
