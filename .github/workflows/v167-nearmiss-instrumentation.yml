name: V167 reference-blind near-miss instrumentation

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v167-nearmiss-instrumentation.yml

permissions:
  contents: write

concurrency:
  group: v167-nearmiss-instrumentation-once
  cancel-in-progress: false

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: 063afbd94f82677fd95b6ad587a37cebf6c6f800
  SOURCE_AUDIO: /tmp/v167-nearmiss-source.m4a
  NORM_WAV: /tmp/v167-nearmiss-normalized.wav
  STEM_DIR: /tmp/v167-nearmiss-demucs/htdemucs_6s/v167-nearmiss-normalized
  TIMEBASE: debug/v166-cpu-autonomous/timebase.json
  FROZEN_V166: debug/v166-cpu-autonomous/generated.json
  V166_TRANSCRIBER: validation/v166_cpu_autonomous/transcribe_v166.py
  V166_EVENT_LOGIC: validation/v166_cpu_autonomous/event_logic_v166.py
  OBSERVER: validation/v167_single_song_calibration/instrument_v166_nearmiss_v167.py
  RUNNER: validation/v167_single_song_calibration/run_instrument_v166_nearmiss_v167.py
  AUGMENT: validation/v167_single_song_calibration/augment_upstream_pitch_pool_v167.py
  OUTPUT: debug/v167-single-song-calibration/nearmiss-evidence-pool.json
  RECEIPT: debug/v167-single-song-calibration/nearmiss-evidence-receipt.json
  CUDA_VISIBLE_DEVICES: ""
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  observe-once:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact instrumentation re-arm
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.21'

      - name: Verify immutable identities and reference-blind boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "2"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v167-nearmiss-instrumentation.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"
          test "$(git hash-object "$OBSERVER")" = "1224932a841e27bfdfe8d61fd631e5c1f728d485"
          test "$(git hash-object "$RUNNER")" = "af216b9727ca851a32c43c318ee18849c4043752"
          test "$(git hash-object "$AUGMENT")" = "daf4ace1b6eff1da81bb537b38caa4dcb0976b29"
          test "$(git hash-object "$V166_TRANSCRIBER")" = "f04ca86525b2ce71680a90b84ed476943e9e6426"
          test "$(git hash-object "$V166_EVENT_LOGIC")" = "6561194742093d76bab452ef0bbb0b889724dc4e"
          test "$(git hash-object "$TIMEBASE")" = "abebae25801b7ddeb5b933977c4f4a918f7bf9ef"
          test "$(git hash-object "$FROZEN_V166")" = "c36a4d1e14ca66235b51a866ad3908322834efff"
          test ! -e "$OUTPUT"
          test ! -e "$RECEIPT"
          python -m py_compile "$OBSERVER" "$RUNNER" "$AUGMENT"
          python - <<'PY'
          from pathlib import Path
          text=(Path('validation/v167_single_song_calibration/instrument_v166_nearmiss_v167.py').read_text()
                + Path('validation/v167_single_song_calibration/run_instrument_v166_nearmiss_v167.py').read_text()
                + Path('validation/v167_single_song_calibration/augment_upstream_pitch_pool_v167.py').read_text())
          forbidden=(
              'research/v154-professional-references/scorer-ready/frontend-reference-payload.json',
              'score_frontend_reference.py',
          )
          for needle in forbidden:
              assert needle not in text, needle
          PY

      - name: Install exact CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 scipy==1.13.1 soundfile==0.12.1 \
            basic-pitch==0.4.0 demucs==4.1.0 imageio-ffmpeg==0.6.0 librosa==0.11.0
          python - <<'PY'
          import importlib.metadata as md, platform, torch
          assert platform.python_version() == '3.10.21', platform.python_version()
          assert torch.__version__ == '2.8.0+cpu', torch.__version__
          assert torch.version.cuda is None and torch.cuda.is_available() is False
          expected={
            'numpy':'1.26.4','scipy':'1.13.1','soundfile':'0.12.1','basic-pitch':'0.4.0',
            'demucs':'4.1.0','imageio-ffmpeg':'0.6.0','librosa':'0.11.0'
          }
          for package,version in expected.items(): assert md.version(package)==version,(package,md.version(package),version)
          PY

      - name: Reproduce sealed source and CPU stems
        shell: bash
        run: |
          set -euo pipefail
          git show 74b0f815ff3f66f325220975c410621503de440f:public/gomywayfullaitest.m4a > "$SOURCE_AUDIO"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('/tmp/v167-nearmiss-source.m4a')
          assert p.stat().st_size==3478611,p.stat().st_size
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f'
          PY
          FFMPEG_EXE="$(python - <<'PY'
          import imageio_ffmpeg
          print(imageio_ffmpeg.get_ffmpeg_exe())
          PY
          )"
          "$FFMPEG_EXE" -hide_banner -loglevel error -y -i "$SOURCE_AUDIO" -ar 44100 -ac 2 -c:a pcm_s16le "$NORM_WAV"
          python - <<'PY'
          import random, numpy as np, torch
          from demucs.separate import main
          random.seed(0); np.random.seed(0); torch.manual_seed(0)
          torch.set_num_threads(1); torch.set_num_interop_threads(1); torch.use_deterministic_algorithms(True)
          main(['-n','htdemucs_6s','-d','cpu','--shifts','1','-j','1','-o','/tmp/v167-nearmiss-demucs','/tmp/v167-nearmiss-normalized.wav'])
          PY
          for stem in guitar bass drums; do test -s "$STEM_DIR/$stem.wav"; done
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          tb=json.load(open('debug/v166-cpu-autonomous/timebase.json'))
          def sha(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          checks={
            'guitar':Path('/tmp/v167-nearmiss-demucs/htdemucs_6s/v167-nearmiss-normalized/guitar.wav'),
            'bass':Path('/tmp/v167-nearmiss-demucs/htdemucs_6s/v167-nearmiss-normalized/bass.wav'),
            'drums':Path('/tmp/v167-nearmiss-demucs/htdemucs_6s/v167-nearmiss-normalized/drums.wav'),
          }
          for name,path in checks.items():
              record=tb['stemIdentities'][name]
              assert path.stat().st_size==record['bytes'],(name,path.stat().st_size,record['bytes'])
              assert sha(path)==record['sha256'],name
          mix=Path('/tmp/v167-nearmiss-normalized.wav'); record=tb['audioIdentity']['normalizedMix']
          assert mix.stat().st_size==record['bytes']
          assert sha(mix)==record['sha256']
          PY

      - name: Observe near-miss pools without changing musical behavior
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER" \
            --source-audio "$SOURCE_AUDIO" \
            --mix "$NORM_WAV" \
            --guitar "$STEM_DIR/guitar.wav" \
            --bass "$STEM_DIR/bass.wav" \
            --drums "$STEM_DIR/drums.wav" \
            --timebase "$TIMEBASE" \
            --frozen-v166-candidate "$FROZEN_V166" \
            --v166-transcriber "$V166_TRANSCRIBER" \
            --output "$OUTPUT" \
            --receipt "$RECEIPT"

      - name: Add standalone Guitar and Bass upstream pitch evidence
        shell: bash
        run: |
          set -euo pipefail
          python "$AUGMENT" \
            --pool "$OUTPUT" \
            --guitar "$STEM_DIR/guitar.wav" \
            --bass "$STEM_DIR/bass.wav" \
            --v166-transcriber "$V166_TRANSCRIBER"
          python - <<'PY'
          import json
          p=json.load(open('debug/v167-single-song-calibration/nearmiss-evidence-pool.json'))
          r=json.load(open('debug/v167-single-song-calibration/nearmiss-evidence-receipt.json'))
          assert p['reproduction']['exactFrozenV166MusicalStreams'] is True
          assert p['reproduction']['counts']=={'bass':402,'combinedGuitar':1050}
          assert r['exactFrozenV166MusicalStreams'] is True
          assert p['policy']['referenceRead'] is False and p['policy']['scorerRead'] is False
          assert p['policy']['thresholdTuningPerformed'] is False
          assert p['policy']['candidateGenerationBehaviorModified'] is False
          assert p['policy']['gpuCudaModalUsed'] is False
          assert p['policy']['referenceReadDuringUpstreamPitchObservation'] is False
          assert p['policy']['scorerReadDuringUpstreamPitchObservation'] is False
          assert p['policy']['generatedEventsChangedByUpstreamPitchObservation'] is False
          up=p['upstreamPitchPools']
          assert up['guitarStandaloneHarmonic']['candidateCount'] > 0
          assert up['bassPreAdmission']['candidateCount'] > 0
          print('Guitar observed counts',p['guitar']['counts'])
          print('Bass observed counts',p['bass']['counts'])
          print('Guitar grid counts',p['grid']['combinedGuitar']['counts'])
          print('Bass grid counts',p['grid']['bass']['counts'])
          print('Guitar standalone sites/candidates',up['guitarStandaloneHarmonic']['siteCount'],up['guitarStandaloneHarmonic']['candidateCount'])
          print('Bass upstream sites/candidates',up['bassPreAdmission']['siteCount'],up['bassPreAdmission']['candidateCount'])
          PY

      - name: Freeze evidence pool and self-seal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          output=Path('debug/v167-single-song-calibration/nearmiss-evidence-pool.json')
          receipt=Path('debug/v167-single-song-calibration/nearmiss-evidence-receipt.json')
          r=json.loads(receipt.read_text())
          r['status']='EVIDENCE_POOL_FROZEN'
          r['evidencePoolSha256']=hashlib.sha256(output.read_bytes()).hexdigest()
          r['evidencePoolGitBlob']=subprocess.check_output(['git','hash-object',str(output)],text=True).strip()
          r['workflowRunId']=int(os.environ['GITHUB_RUN_ID'])
          r['workflowRunNumber']=int(os.environ['GITHUB_RUN_NUMBER'])
          r['workflowRunAttempt']=int(os.environ['GITHUB_RUN_ATTEMPT'])
          r['workflowHeadSha']=os.environ['GITHUB_SHA']
          r['implementation']={
            'observerGitBlob':subprocess.check_output(['git','hash-object','validation/v167_single_song_calibration/instrument_v166_nearmiss_v167.py'],text=True).strip(),
            'runnerGitBlob':subprocess.check_output(['git','hash-object','validation/v167_single_song_calibration/run_instrument_v166_nearmiss_v167.py'],text=True).strip(),
            'augmentGitBlob':subprocess.check_output(['git','hash-object','validation/v167_single_song_calibration/augment_upstream_pitch_pool_v167.py'],text=True).strip(),
            'v166TranscriberGitBlob':'f04ca86525b2ce71680a90b84ed476943e9e6426',
            'v166EventLogicGitBlob':'6561194742093d76bab452ef0bbb0b889724dc4e',
          }
          receipt.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          rm .github/workflows/v167-nearmiss-instrumentation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$OUTPUT" "$RECEIPT" .github/workflows/v167-nearmiss-instrumentation.yml
          changed="$(git diff --cached --name-only)"
          if echo "$changed" | grep -Ev '^debug/v167-single-song-calibration/(nearmiss-evidence-pool\.json|nearmiss-evidence-receipt\.json)$|^\.github/workflows/v167-nearmiss-instrumentation\.yml$'; then
            echo 'Unexpected V167 instrumentation path' >&2
            exit 1
          fi
          git commit -m "research: freeze V167 reference-blind upstream evidence pool [skip ci]"
          git push origin HEAD:"$BRANCH"
