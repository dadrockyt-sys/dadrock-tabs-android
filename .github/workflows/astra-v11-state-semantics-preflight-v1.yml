name: Astra V11 state semantics preflight

on:
  push:
    branches: [astra-work]
    paths:
      - 'docs/astra/V11_PREFLIGHT_LAUNCH_V1.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: astra-v11-state-semantics-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'
      - name: Verify project authorization and source pins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          blob=lambda p: subprocess.check_output(['git','hash-object',p],text=True).strip()
          a=json.load(open('docs/astra/V11_PROJECT_AUTHORIZATION_V1.json'))
          l=json.load(open('docs/astra/V11_PREFLIGHT_LAUNCH_V1.json'))
          assert a['schema']=='astra-v11-project-authorization-v1'
          assert a['userInstruction']=='I authorize'
          assert a['authorizationScope']['optimizerSteps']==0
          assert a['authorizationScope']['modelInference'] is False
          assert l['schema']=='astra-v11-preflight-launch-v1'
          assert l['status']=='armed-model-free-preflight-only'
          assert l['optimizerSteps']==0 and l['modelInference'] is False
          assert l['waveformRendering'] is False
          for k,p in l['sourcePaths'].items():
              assert l['sourceGitBlobs'][k]==blob(p),(k,p,l['sourceGitBlobs'][k],blob(p))
          PY
      - name: Install exact CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          python -m pip check
      - name: Run pure V11 tests
        run: |
          PYTHONPATH=.:astra_backend python astra_backend/synthetic/test_v11_contract_validator_v1.py
          PYTHONPATH=.:astra_backend python astra_backend/synthetic/test_v11_state_semantics_v1.py
      - name: Validate frozen V11 contract and model-free template audit
        run: |
          mkdir -p /tmp/v11-preflight
          PYTHONPATH=.:astra_backend python astra_backend/synthetic/v11_contract_validator_v1.py             --contract docs/astra/V11_STATE_SEMANTICS_CONTRACT_V1.json             > /tmp/v11-preflight/contract-validation.json
          PYTHONPATH=.:astra_backend python astra_backend/synthetic/v11_state_semantics_v1.py static             --out /tmp/v11-preflight/static-audit.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/v11-preflight/contract-validation.json'))
          a=json.load(open('/tmp/v11-preflight/static-audit.json'))
          assert c['valid'] is True
          assert c['empiricalExecutionAuthorized'] is False
          assert a['controlAttackGroups']==1638 and a['interventionAttackGroups']==1638
          assert a['controlAttackedNoteLabels']==1806 and a['interventionAttackedNoteLabels']==1806
          assert a['restoredNonAttackedContinuationEvents']>0
          assert a['waveformsRendered']==0 and a['optimizerSteps']==0 and a['modelInference']==0 and a['v2bInference']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astra-v11-state-semantics-preflight-v1
          path: |
            /tmp/v11-preflight/contract-validation.json
            /tmp/v11-preflight/static-audit.json
          if-no-files-found: error
          retention-days: 30
