name: V167 self-repeat completion sweep

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v167-repeat-completion-sweep.yml

permissions:
  contents: write

concurrency:
  group: v167-repeat-completion-sweep-once
  cancel-in-progress: false

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: 4f54970edea2978d8489cec10616c54020e56c45
  CANDIDATE: debug/v167-single-song-calibration/iteration-001-generated.json
  REFERENCE: research/v154-professional-references/scorer-ready/frontend-reference-payload.json
  SCORER: validation/v154_cpu_multitrack/score_frontend_reference.py
  SWEEP_CODE: validation/v167_single_song_calibration/repeat_completion_sweep_v167.py
  OUTPUT: debug/v167-single-song-calibration/repeat-completion-sweep.json

jobs:
  sweep:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repeat-sweep arm
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify frozen calibration inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v167-repeat-completion-sweep.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"
          test "$(git hash-object "$CANDIDATE")" = "1b73d6ece977fb976fa1c503997e6434d4e4811a"
          test "$(git hash-object "$REFERENCE")" = "2fbed60b543c0488934d8642c488aa06bf31bbf5"
          test "$(git hash-object "$SCORER")" = "9644e65719fbd361a9b39778ae9950c5e983e855"
          test "$(git hash-object "$SWEEP_CODE")" = "cbd3e5535de78ddd07675ae279a85386bdf29174"
          test ! -e "$OUTPUT"
          python - <<'PY'
          import json
          c=json.load(open('debug/v167-single-song-calibration/iteration-001-generated.json'))
          assert c['version']=='V167'
          assert c['calibration']['iteration']==1
          assert c['calibration']['directReferenceEventCopy'] is False
          PY

      - name: Run generated-only repeat completion parameter sweep
        shell: bash
        run: |
          set -euo pipefail
          python "$SWEEP_CODE" \
            --candidate "$CANDIDATE" \
            --reference "$REFERENCE" \
            --scorer "$SCORER" \
            --output "$OUTPUT"

      - name: Freeze sweep and self-seal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('debug/v167-single-song-calibration/repeat-completion-sweep.json'))
          assert r['version']=='V167'
          assert r['parameters']['recursivePropagation'] is False
          assert r['policy']['addedEventsDerivedFromReference'] is False
          assert r['policy']['addedEventsDerivedOnlyFromGeneratedDonorMeasures'] is True
          assert r['policy']['directReferenceCopy'] is False
          print(json.dumps({
            'guitar':r['combinedGuitar']['selected'],
            'bass':r['bass']['selected']
          },indent=2,sort_keys=True))
          PY
          rm .github/workflows/v167-repeat-completion-sweep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$OUTPUT" .github/workflows/v167-repeat-completion-sweep.yml
          changed="$(git diff --cached --name-only)"
          if echo "$changed" | grep -Ev '^debug/v167-single-song-calibration/repeat-completion-sweep\.json$|^\.github/workflows/v167-repeat-completion-sweep\.yml$'; then
            echo 'Unexpected V167 repeat-sweep path' >&2
            exit 1
          fi
          git commit -m "research: freeze V167 self-repeat completion sweep [skip ci]"
          git push origin HEAD:"$BRANCH"
