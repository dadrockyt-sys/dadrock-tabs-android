name: Run token PDF delivery v3 repair

on:
  push:
    paths:
      - '.github/workflows/run-token-pdf-delivery-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python .github/scripts/fix_token_pdf_delivery_v3.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ai-tab/page.js
          git diff --cached --quiet || git commit -m "Repair token redemption and automatic PDF delivery"
          git push
