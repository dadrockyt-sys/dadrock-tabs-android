name: V143 Direct L4 Gomyway Timing

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - '.github/workflows/v143-direct-l4-gomyway-timing.yml'

concurrency:
  group: v143-direct-l4-gomyway-timing
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODAL_ENVIRONMENT: main
  AUDIO_URL: https://raw.githubusercontent.com/dadrockyt-sys/dadrock-tabs-android/main/public/jimmy-paige-midterm-v1/gomyway-midterm-source.m4a
  AUDIO_BLOB_SHA: 4dd709e3fa177b4daeed71ca97f0199757729d4b
  MAIN_SHA: bb992d901e78ab19645f8edc8e330d5a142ebd8e
  PYTHONUNBUFFERED: '1'

jobs:
  direct-l4-gomyway-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Enforce safety boundary and exact audio identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$ACTUAL_MAIN" = "$MAIN_SHA"
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          echo "mainSource=$MAIN_SHA"
          echo "audioBlobSha=$AUDIO_BLOB_SHA"
          echo 'blobTokenForwarded=false'
          echo 'referenceFacingAccuracyScored=false'
          echo 'referenceScoreCalls=0'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Modal CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install 'modal==1.3.3' >/dev/null
          modal --version

      - name: Authenticate Modal
        shell: bash
        run: |
          set -euo pipefail
          modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET" >/dev/null
          echo 'Modal authentication configured.'

      - name: Run same Gomyway audio directly through deployed L4 worker
        shell: bash
        run: |
          set -euo pipefail
          OUT=debug/v143-contextual-prune/direct-l4-gomyway-timing
          mkdir -p "$OUT"
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          import modal

          out = Path('debug/v143-contextual-prune/direct-l4-gomyway-timing')
          payload = {
              'audioUrl': os.environ['AUDIO_URL'],
              'pathname': 'gomyway-midterm-source.m4a',
              'song': 'Are You Gonna Go My Way',
              'artist': 'Lenny Kravitz',
              'transcriptionType': 'rhythm',
              # Deliberately empty for a public non-Blob origin. This bypasses
              # only Vercel request duration, not analyzer/reference safeguards.
              'blobToken': '',
          }

          fn = modal.Function.from_name(
              'dadrock-v143-ai-tab-live',
              'rhythm_v143_request',
              environment_name='main',
          )

          started = time.monotonic()
          summary = {
              'schemaVersion': 1,
              'gate': 'v143-direct-l4-gomyway-timing',
              'workerApp': 'dadrock-v143-ai-tab-live',
              'workerFunction': 'rhythm_v143_request',
              'modalEnvironment': 'main',
              'audioBlobSha': os.environ['AUDIO_BLOB_SHA'],
              'audioSource': 'public-raw-github-existing-repository-asset',
              'blobTokenForwarded': False,
              'referenceFacingAccuracyScored': False,
              'referenceScoreCalls': 0,
          }

          try:
              result = fn.remote(payload)
              elapsed = time.monotonic() - started
              if not isinstance(result, dict):
                  raise TypeError('Worker returned non-dict result')

              live = result.get('liveV143') if isinstance(result.get('liveV143'), dict) else {}
              events = result.get('events') if isinstance(result.get('events'), list) else []
              note_events = result.get('noteEvents') if isinstance(result.get('noteEvents'), list) else []
              source_events = events if events else note_events
              placed = [
                  row for row in source_events
                  if isinstance(row, dict)
                  and isinstance(row.get('measure'), int)
                  and isinstance(row.get('step'), int)
              ]
              playable = [
                  row for row in source_events
                  if isinstance(row, dict)
                  and isinstance(row.get('stringIndex'), int)
                  and isinstance(row.get('fret'), int)
              ]

              summary.update({
                  'completed': True,
                  'elapsedSeconds': round(elapsed, 3),
                  'generatedTabPresent': bool(str(result.get('generatedTab') or '').strip()),
                  'eventCount': len(source_events),
                  'placedEventCount': len(placed),
                  'playableStringFretEventCount': len(playable),
                  'tempo': result.get('tempo'),
                  'timeSignature': result.get('timeSignature'),
                  'liveV143': {
                      'version': live.get('version'),
                      'modalGpu': live.get('modalGpu'),
                      'rhythmOnly': live.get('rhythmOnly'),
                      'referenceFree': live.get('referenceFree'),
                      'separatorDeterministic': live.get('separatorDeterministic'),
                      'separatorSeed': live.get('separatorSeed'),
                      'demucsShifts': live.get('demucsShifts'),
                      'professionalReferenceUsed': live.get('professionalReferenceUsed'),
                      'referenceRuntimeInputUsed': live.get('referenceRuntimeInputUsed'),
                      'runtimeLabelsRequired': live.get('runtimeLabelsRequired'),
                  },
              })
          except Exception as exc:
              elapsed = time.monotonic() - started
              summary.update({
                  'completed': False,
                  'elapsedSeconds': round(elapsed, 3),
                  'errorType': type(exc).__name__,
                  # Keep only a bounded generic exception string. No payload or
                  # transcription data is written to disk.
                  'error': str(exc)[:500],
              })

          (out / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2))

          if summary.get('completed') is not True:
              raise SystemExit('Direct L4 Gomyway worker call did not complete')
          if summary.get('generatedTabPresent') is not True:
              raise SystemExit('Direct L4 worker returned no generated tablature')

          live = summary.get('liveV143') or {}
          required = {
              'modalGpu': 'L4',
              'referenceFree': True,
              'professionalReferenceUsed': False,
              'referenceRuntimeInputUsed': False,
              'runtimeLabelsRequired': False,
              'separatorDeterministic': True,
              'separatorSeed': 143,
          }
          for key, expected in required.items():
              if live.get(key) != expected:
                  raise SystemExit(f'Direct worker runtime safety contract failed: {key}')
          PY

      - name: Preserve aggregate timing evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-direct-l4-gomyway-timing
          path: debug/v143-contextual-prune/direct-l4-gomyway-timing/summary.json
          if-no-files-found: warn
          retention-days: 14
