name: V144 Rhythm Fit-Only Pruning Ceiling Diagnostic — Archived

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    name: Refuse replay of completed pruning-ceiling diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: Refuse replay
        shell: bash
        run: |
          echo 'The V144 fit-only pruning-ceiling diagnostic is complete and archived. Use its persisted report; do not replay it.' >&2
          exit 1
