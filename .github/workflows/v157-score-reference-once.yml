name: V157 score frozen reference once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v157-score-reference-once.yml

permissions:
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo
  CANDIDATE: debug/v157-cpu-autonomous/generated.json
  QC: debug/v157-cpu-autonomous/structural-qc.json
  PRE_SCORE: debug/v157-cpu-autonomous/frontend-reference-score/pre-score-receipt.json
  GUARD: validation/v157_cpu_multitrack/run_frontend_reference_score_once.py
  SCORER: validation/v154_cpu_multitrack/score_frontend_reference.py
  SCORE: debug/v157-cpu-autonomous/frontend-reference-score/score.json
  SCORE_RECEIPT: debug/v157-cpu-autonomous/frontend-reference-score/score-receipt.json

jobs:
  score-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify sealed pre-score boundary without opening reference
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$(git hash-object "$CANDIDATE")" = "3491814f4cc075aaf3eefaecf2d179f57d2d5dae"
          test "$(sha256sum "$CANDIDATE" | awk '{print $1}')" = "f5dc7094b72f8e3a988b1fdd59808cb056461d7e12a6d41508942cf499de3e71"
          test "$(git hash-object "$QC")" = "3528adbceb640743cc8f0e472d2cd62c49c1ebc3"
          test "$(git hash-object "$PRE_SCORE")" = "d7d6fc5a7eb15a18a8a79293aaa057a44a1dde5a"
          test "$(git hash-object "$GUARD")" = "6396ff11f1b2960fb4c80c1633786c3089ec4883"
          test "$(git hash-object "$SCORER")" = "9644e65719fbd361a9b39778ae9950c5e983e855"
          test ! -e "$SCORE"
          test ! -e "$SCORE_RECEIPT"
          python -m py_compile "$GUARD" "$SCORER"
          python - <<'PY'
          import json
          from pathlib import Path
          pre = json.loads(Path('debug/v157-cpu-autonomous/frontend-reference-score/pre-score-receipt.json').read_text())
          qc = json.loads(Path('debug/v157-cpu-autonomous/structural-qc.json').read_text())
          assert pre['validation'] == 'PASS'
          assert pre['status'] == 'SEALED_BEFORE_REFERENCE_SCORE'
          assert pre['referenceFacingScoreCallsAtSeal'] == 0
          assert pre['scorerInvocationCountAtSeal'] == 0
          assert pre['scorePathAbsentAtSeal'] is True
          assert pre['scoreReceiptPathAbsentAtSeal'] is True
          assert qc['validation'] == 'PASS'
          assert qc['safety']['referenceRead'] is False
          assert qc['safety']['referenceFacingScoreCalls'] == 0
          PY

      - name: Refresh branch before the one reference-facing call
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$(git hash-object "$CANDIDATE")" = "3491814f4cc075aaf3eefaecf2d179f57d2d5dae"
          test "$(git hash-object "$QC")" = "3528adbceb640743cc8f0e472d2cd62c49c1ebc3"
          test "$(git hash-object "$PRE_SCORE")" = "d7d6fc5a7eb15a18a8a79293aaa057a44a1dde5a"
          test "$(git hash-object "$GUARD")" = "6396ff11f1b2960fb4c80c1633786c3089ec4883"
          test "$(git hash-object "$SCORER")" = "9644e65719fbd361a9b39778ae9950c5e983e855"
          test ! -e "$SCORE"
          test ! -e "$SCORE_RECEIPT"

      - name: Invoke the guarded V157 scorer exactly once
        shell: bash
        run: |
          set -euo pipefail
          python "$GUARD"
          test -f "$SCORE"
          test -f "$SCORE_RECEIPT"
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('debug/v157-cpu-autonomous/frontend-reference-score/score-receipt.json').read_text())
          assert r['validation'] == 'PASS'
          assert r['referenceFacingScoreCalls'] == 1
          assert r['scorerInvocationCountInWrapper'] == 1
          print(json.dumps({'gates': r['gates'], 'scoreSha256': r['scoreSha256']}, indent=2, sort_keys=True))
          PY

      - name: Freeze score receipt and self-seal
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v157-score-reference-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SCORE" "$SCORE_RECEIPT" .github/workflows/v157-score-reference-once.yml
          git commit -m "validation: freeze sole V157 reference score [skip ci]"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
