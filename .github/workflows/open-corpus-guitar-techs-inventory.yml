name: Open corpus Guitar-TECHS P1 single-note inventory

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/open-corpus-guitar-techs-inventory.yml
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Download public CC-BY Guitar-TECHS archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guitar-techs"
          cd "$RUNNER_TEMP/guitar-techs"
          curl -L --fail --retry 3 --retry-delay 3 \
            'https://zenodo.org/records/14963133/files/P1_singlenotes.zip?download=1' \
            -o P1_singlenotes.zip
          echo 'ca0c4674dde3805574685a313f7c39eb  P1_singlenotes.zip' | md5sum -c -
          sha256sum P1_singlenotes.zip | tee archive-sha256.txt

      - name: Build metadata-only ZIP inventory
        shell: python
        run: |
          import json
          import os
          import zipfile
          from collections import Counter
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'guitar-techs'
          archive = root / 'P1_singlenotes.zip'
          rows = []
          extensions = Counter()
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  suffix = Path(info.filename).suffix.lower() or '<none>'
                  extensions[suffix] += 1
                  rows.append({
                      'name': info.filename,
                      'uncompressedBytes': info.file_size,
                      'compressedBytes': info.compress_size,
                      'crc32': f'{info.CRC:08x}',
                      'extension': suffix,
                      'isDirectory': info.is_dir(),
                  })
          payload = {
              'schema': 'dadrock.tabs.open-corpus.zip-inventory.v1',
              'dataset': 'Guitar-TECHS',
              'zenodoRecord': '14963133',
              'archive': 'P1_singlenotes.zip',
              'officialMd5': 'ca0c4674dde3805574685a313f7c39eb',
              'entryCount': len(rows),
              'extensions': dict(sorted(extensions.items())),
              'entries': rows,
              'containsAudioBytesInReport': False,
              'containsReferenceNoteEventsInReport': False,
              'v168ReferenceFacingScoreCalls': 0,
          }
          out = root / 'p1-singlenotes-inventory.json'
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({k: payload[k] for k in ['dataset','archive','entryCount','extensions','containsAudioBytesInReport','containsReferenceNoteEventsInReport','v168ReferenceFacingScoreCalls']}, indent=2, sort_keys=True))
          print('FIRST_PATHS')
          for row in rows[:200]:
              print(row['name'])

      - name: Preserve metadata-only inventory
        uses: actions/upload-artifact@v4
        with:
          name: guitar-techs-p1-singlenotes-inventory
          path: |
            ${{ runner.temp }}/guitar-techs/p1-singlenotes-inventory.json
            ${{ runner.temp }}/guitar-techs/archive-sha256.txt
          retention-days: 14
