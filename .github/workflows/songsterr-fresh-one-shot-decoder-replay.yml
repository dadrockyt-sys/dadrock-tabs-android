name: Songsterr Fresh One-Shot Decoder Replay

on:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-one-shot-decoder-replay.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch-replay-checkpoint:
    if: github.event.head_commit.message == 'chore: run fresh decoder replay one-shot'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out fresh branch
        uses: actions/checkout@v4
        with:
          ref: songsterr-fresh-pipeline-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pinned array dependency
        run: python -m pip install --disable-pip-version-check numpy==1.26.4

      - name: Patch synthetic melodia self-test fixture only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/songsterr-fresh/trace_basic_pitch_decoder_mechanisms.py')
          text = path.read_text(encoding='utf-8')
          old = '''    # Melodia event with no thresholded onset peak, frames 40:56.\n    frames[40:56, col64] = 0.7\n    # Ensure inferred-onset scale is non-degenerate but subthreshold at MIDI64.\n'''
          new = '''    # Melodia event with no thresholded onset peak, frames 40:56.\n    # 0.4 stays above frameThreshold=0.3 while inferred onset scales to 0.45 < 0.5.\n    frames[40:56, col64] = 0.4\n    # Ensure inferred-onset scale is non-degenerate and remains subthreshold at MIDI64.\n'''
          if text.count(old) != 1:
              raise SystemExit('synthetic tracer fixture marker changed; fail closed')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Prove fixed tracer self-test
        run: python scripts/songsterr-fresh/trace_basic_pitch_decoder_mechanisms.py --self-test

      - name: Download completed decision-enabled evidence artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/songsterr/agg /tmp/songsterr/a /tmp/songsterr/b /tmp/songsterr/c
          gh run download 34546969446 -n songsterr-fresh-model-evidence-cross-run-measurement -D /tmp/songsterr/agg
          gh run download 34546969446 -n songsterr-fresh-model-evidence-observation-a -D /tmp/songsterr/a
          gh run download 34546969446 -n songsterr-fresh-model-evidence-observation-b -D /tmp/songsterr/b
          gh run download 34546969446 -n songsterr-fresh-model-evidence-observation-c -D /tmp/songsterr/c

      - name: Inspect aggregate evidence and replay exact decoder mechanisms
        run: |
          mkdir -p /tmp/songsterr/out
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/songsterr')
          summary = json.loads((root/'agg/cross-run-measurement-summary.json').read_text())
          pairs = {}
          for pair in ('ab','ac','bc'):
              model = json.loads((root/f'agg/comparison-{pair}.json').read_text())
              decision = json.loads((root/f'agg/decision-comparison-{pair}.json').read_text())
              pairs[pair] = {
                  'modelInventory': model['measurement']['inventory'],
                  'decisionSemanticInventory': decision['measurement']['semanticInventory'],
                  'decisionThresholdPeakInventory': decision['measurement']['effectiveThresholdPeakInventory'],
              }
          evidence_presence = {}
          for label in ('a','b','c'):
              evidence = json.loads((root/label/f'evidence-{label}.json').read_text())
              rows = evidence['onsets']
              hist64 = [r for r in rows if r['selectedMidi'] == 64 and abs(r['nearestStructureSlot'] - 206.22657596371883) < 1e-12]
              new55 = [r for r in rows if r['selectedMidi'] == 55 and abs(r['nearestStructureSlot'] - 46.151111111111106) < 1e-12]
              evidence_presence[label] = {
                  'eventCount': len(rows),
                  'historicalMidi64At206_22657596371883': len(hist64),
                  'midi55At46_151111111111106': len(new55),
                  'midi55Event': new55[0] if new55 else None,
              }
          out = {
              'sourceRun': 34546969446,
              'aggregateArtifact': 10179540711,
              'measurementOnly': True,
              'modelValidationComplete': False,
              'observations': summary['observations'],
              'pairs': pairs,
              'evidencePresence': evidence_presence,
          }
          (root/'out/aggregate-inspection.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          PY

          set +e
          : > /tmp/songsterr/out/replay-status.tsv
          for label in a b c; do
            python scripts/songsterr-fresh/trace_basic_pitch_decoder_mechanisms.py \
              "/tmp/songsterr/$label/evidence-$label.json" \
              "/tmp/songsterr/$label/basic-pitch-note-activations-$label.json" \
              "/tmp/songsterr/$label/basic-pitch-decision-surface-$label.json" \
              --output "/tmp/songsterr/out/trace-$label.json" \
              2> "/tmp/songsterr/out/trace-$label.stderr"
            code=$?
            printf '%s\t%s\n' "$label" "$code" >> /tmp/songsterr/out/replay-status.tsv
          done
          set -e

          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/songsterr/out')
          statuses = {}
          for line in (root/'replay-status.tsv').read_text().splitlines():
              label, code = line.split('\t')
              code = int(code)
              item = {'exitCode': code, 'exactReplaySucceeded': code == 0}
              trace_path = root/f'trace-{label}.json'
              if code == 0:
                  trace = json.loads(trace_path.read_text())
                  item['eventCount'] = trace['eventCount']
                  item['mechanismCounts'] = trace['mechanismCounts']
                  item['hardGuards'] = trace['hardGuards']
                  item['policyBoundary'] = trace['policyBoundary']
              else:
                  item['stderr'] = (root/f'trace-{label}.stderr').read_text()[-12000:]
              statuses[label] = item
          (root/'replay-summary.json').write_text(json.dumps({
              'contract': 'songsterr-fresh-basic-pitch-decoder-mechanism-replay-execution-v1',
              'sourceRun': 34546969446,
              'measurementOnly': True,
              'modelValidationComplete': False,
              'replays': statuses,
          }, indent=2, sort_keys=True) + '\n')
          PY

      - name: Update canonical checkpoint with inspection and replay findings
        env:
          ONE_SHOT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          cp = Path('docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md')
          text = cp.read_text(encoding='utf-8')
          stamp = datetime.now(ZoneInfo('America/Toronto')).strftime('%Y-%m-%d %H:%M America/Toronto')
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('Updated: '):
                  lines[i] = f'Updated: {stamp}'
                  break
          text = '\n'.join(lines) + '\n'

          aggregate = json.loads(Path('/tmp/songsterr/out/aggregate-inspection.json').read_text())
          replay = json.loads(Path('/tmp/songsterr/out/replay-summary.json').read_text())
          ab = aggregate['pairs']['ab']['decisionSemanticInventory']
          sample = ab['unmatchedSemanticEventSamples'][0]
          first = sample['firstSurface']
          second = sample['secondSurface']
          replay_bits = []
          for label in ('a','b','c'):
              item = replay['replays'][label]
              if item['exactReplaySucceeded']:
                  replay_bits.append(f"{label.upper()} PASS {item['eventCount']} events {item['mechanismCounts']}")
              else:
                  replay_bits.append(f"{label.upper()} FAIL exit={item['exitCode']}")
          block = f'''## ACTIVE WORK LOG — A/B/C DECISION SURFACE + DECODER REPLAY\n\n- Aggregate artifact `10179540711` from green run `34546969446` was inspected directly; observation artifacts A `10179528439`, B `10179504174`, C `10179525061` were reused. No Demucs or Basic Pitch model rerun was performed.\n- A and C are the exact historical 1,138-event outcome; B is a distinct 1,139-event Intel outcome. Across A/B/C there is exactly one unmatched semantic event: MIDI `{sample['selectedMidi']}` at frozen slot `{sample['nearestStructureSlot']}`, source start `{sample['sourceStart']}` s, present only in B.\n- The historical MIDI-64 event at frozen slot `206.22657596371883` is absent from all three A/B/C observations. Therefore the new 1,139 count is not the historical 1,139 semantic inventory.\n- At the unmatched MIDI-55 frame, B's captured raw/effective onset is `{first['effectiveOnsetActivation']}` (margin `{first['effectiveOnsetMinusThreshold']}`) while A/C is `{second['effectiveOnsetActivation']}` (margin `{second['effectiveOnsetMinusThreshold']}`); both are strict local peaks. This explains the inventory toggle on the threshold-onset path for this sample only. These margins are descriptive and are **not** admission tolerances.\n- The tracer-focused CI at wiring commit `b5a625a4ce12f530af2a63a0e52c5c8728fa9fef` failed in run `34547372731`, job `103102811353`: the synthetic supposed-melodia fixture used frame activation `0.7`, whose inferred onset scaled to about `0.7875`, so the test correctly exercised the threshold-onset pass instead of melodia.\n- The synthetic fixture only was corrected to frame activation `0.4`, which remains above frame threshold `0.3` while its inferred onset is about `0.45`, below onset threshold `0.5`. Production/model thresholds and evidence semantics are unchanged. The tracer self-test passed in one-shot run `${{ONE_SHOT_RUN_ID}}`.\n- Exact replay against already-captured real sidecars: {'; '.join(replay_bits)}. Decoder labels are trusted only for observations whose exact replay succeeded.\n- `modelValidationComplete` remains false; customer-eligible events remain 0; duration research remains paused.\n\n'''
          marker = '## CURRENT ACCEPTANCE STATE\n'
          if '## ACTIVE WORK LOG — A/B/C DECISION SURFACE + DECODER REPLAY\n' in text:
              start = text.index('## ACTIVE WORK LOG — A/B/C DECISION SURFACE + DECODER REPLAY\n')
              end = text.index(marker, start)
              text = text[:start] + block + text[end:]
          else:
              if marker not in text:
                  raise SystemExit('checkpoint acceptance marker missing; fail closed')
              text = text.replace(marker, block + marker, 1)
          cp.write_text(text, encoding='utf-8')
          PY

      - name: Commit tracer fix and first checkpoint update
        id: fix_commit
        run: |
          rm .github/workflows/songsterr-fresh-one-shot-decoder-replay.yml
          git config user.name 'dadrockyt-sys'
          git config user.email 'Stephen.s.mcnally@gmail.com'
          git add scripts/songsterr-fresh/trace_basic_pitch_decoder_mechanisms.py docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md .github/workflows/songsterr-fresh-one-shot-decoder-replay.yml
          git commit -m 'fix: repair fresh decoder tracer self-test fixture'
          git push origin HEAD:songsterr-fresh-pipeline-v1
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch official variation-test workflow on fixed commit
        id: official
        env:
          GH_TOKEN: ${{ github.token }}
          FIX_SHA: ${{ steps.fix_commit.outputs.sha }}
        run: |
          gh workflow run songsterr-fresh-model-evidence-variation-tests.yml --ref songsterr-fresh-pipeline-v1
          run_id=''
          for i in $(seq 1 60); do
            run_id=$(gh run list --workflow songsterr-fresh-model-evidence-variation-tests.yml --branch songsterr-fresh-pipeline-v1 --limit 30 --json databaseId,headSha,createdAt --jq ".[] | select(.headSha == \"$FIX_SHA\") | .databaseId" | head -n1)
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done
          if [ -z "$run_id" ]; then
            echo 'official variation-test run not found for fixed SHA' >&2
            exit 1
          fi
          set +e
          gh run watch "$run_id" --exit-status
          watch_code=$?
          set -e
          gh run view "$run_id" --json databaseId,headSha,status,conclusion,jobs > /tmp/songsterr/out/official-variation-run.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "watch_code=$watch_code" >> "$GITHUB_OUTPUT"

      - name: Finalize checkpoint with official CI result
        env:
          FIX_SHA: ${{ steps.fix_commit.outputs.sha }}
          OFFICIAL_RUN_ID: ${{ steps.official.outputs.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          cp = Path('docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md')
          text = cp.read_text(encoding='utf-8')
          official = json.loads(Path('/tmp/songsterr/out/official-variation-run.json').read_text())
          jobs = official.get('jobs') or []
          job_bits = ', '.join(f"{j.get('databaseId')}:{j.get('conclusion')}" for j in jobs)
          line = f"- Official focused variation-test CI for tracer-fix commit `{os.environ['FIX_SHA']}`: run `{official['databaseId']}`, conclusion `{official.get('conclusion')}`, jobs `{job_bits}`."
          anchor = '- `modelValidationComplete` remains false; customer-eligible events remain 0; duration research remains paused.\n'
          if anchor not in text:
              raise SystemExit('checkpoint active-log anchor missing; fail closed')
          text = text.replace(anchor, line + '\n' + anchor, 1)
          stamp = datetime.now(ZoneInfo('America/Toronto')).strftime('%Y-%m-%d %H:%M America/Toronto')
          lines = text.splitlines()
          for i, value in enumerate(lines):
              if value.startswith('Updated: '):
                  lines[i] = f'Updated: {stamp}'
                  break
          cp.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git add docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md
          git commit -m 'docs: record fresh decoder replay and focused CI result'
          git push origin HEAD:songsterr-fresh-pipeline-v1

      - name: Upload replay diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songsterr-fresh-decoder-replay-followup
          path: /tmp/songsterr/out
          if-no-files-found: warn
          retention-days: 14
