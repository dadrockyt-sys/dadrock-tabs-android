name: V143 Corrected Rhythm Professional Score

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-corrected-rhythm-professional-score.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: v143-corrected-rhythm-professional-score
  cancel-in-progress: true

jobs:
  score:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download exact corrected freeze only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scorer/freeze-artifact .scorer/freeze
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9499229323/zip \
            -o .scorer/freeze-artifact/freeze.zip
          echo "980070d12011c3c6724d9d7c26da3b2158b0161d6ed54c561454ab254ba1706a  .scorer/freeze-artifact/freeze.zip" | sha256sum -c -
          unzip -q .scorer/freeze-artifact/freeze.zip -d .scorer/freeze

      - name: Validate freeze and PDF identity before any human source access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          sys.path.insert(0, 'validation/rhythm_holdout')
          import score_rhythm_holdout as scorer

          freeze = Path('.scorer/freeze/freeze')
          manifest, events, snapshot = scorer.validate_pre_reference(freeze)
          expected_event = 'c621ab4fd3a14849946a349b1ce2ed430322e3a8b49310f073b51cd8f417a194'
          assert manifest['eventSha256'] == expected_event, manifest['eventSha256']
          assert manifest['pdfEventSha256'] == expected_event
          assert float(manifest['pdfEventFidelity']) == 1.0
          assert len(events) == 2009, len(events)
          print('pre-reference freeze gate green')
          PY

      - name: Download locked scorer-only human source structure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scorer/human-source
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9502117311/zip \
            -o .scorer/human-source/source.zip
          echo "380165b5eb160cc8a35196192032c7d50224402880e453de448eed906c3b7dcb  .scorer/human-source/source.zip" | sha256sum -c -
          unzip -q .scorer/human-source/source.zip -d .scorer/human-source/raw
          test -f .scorer/human-source/raw/rhythm-track.json
          echo "18cdb4f8afb49562aac5b600730384636070d6ca8650823e759276a81ee4afc8  .scorer/human-source/raw/rhythm-track.json" | sha256sum -c -

      - name: Build deterministic scorer-only reference from exact human-written source revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation/rhythm_holdout/reference .scorer/results
          python - <<'PY'
          from fractions import Fraction
          from pathlib import Path
          import hashlib, json

          source_path = Path('.scorer/human-source/raw/rhythm-track.json')
          source = json.loads(source_path.read_text())
          assert source.get('revisionId') == 7868948
          assert source.get('songId') == 243
          assert len(source.get('measures') or []) == 113
          assert source.get('name') == 'Craig Ross | 1953 Gibson Les Paul Goldtop | Rhythm Guitar'

          tuning = source.get('tuning')
          assert tuning == [64, 59, 55, 50, 45, 40]

          measures = []
          playable_onsets = 0
          playable_notes = 0
          populated = 0

          for measure_number, measure in enumerate(source['measures'], 1):
              by_step = {}
              section = None
              marker = measure.get('marker')
              if isinstance(marker, dict):
                  section = marker.get('text') or None

              for voice in measure.get('voices') or []:
                  position = Fraction(0, 1)
                  for beat in voice.get('beats') or []:
                      duration = beat.get('duration') or [1, 4]
                      step = int(round(float(position * 16)))
                      step = max(0, min(15, step))
                      for note in beat.get('notes') or []:
                          if not isinstance(note, dict):
                              continue
                          if note.get('rest') or note.get('dead') or note.get('tie'):
                              continue
                          string_index = note.get('string')
                          fret = note.get('fret')
                          if not isinstance(string_index, int) or not isinstance(fret, int):
                              continue
                          if not (0 <= string_index <= 5 and 0 <= fret <= 36):
                              continue
                          midi = int(tuning[string_index]) + fret
                          by_step.setdefault(step, set()).add((string_index, fret, midi))
                      position += Fraction(int(duration[0]), int(duration[1]))

              events = []
              for step in sorted(by_step):
                  notes = [
                      {'stringIndex': s, 'fret': f, 'midi': m}
                      for s, f, m in sorted(by_step[step])
                  ]
                  if notes:
                      events.append({'step': step, 'notes': notes})
                      playable_onsets += 1
                      playable_notes += len(notes)
              if events:
                  populated += 1
              entry = {'measure': measure_number, 'events': events}
              if section:
                  entry['section'] = section
              measures.append(entry)

          assert playable_onsets == 603, playable_onsets
          assert playable_notes == 946, playable_notes
          assert populated == 104, populated

          reference = {
              'schemaVersion': 1,
              'instrument': 'rhythm',
              'holdout': True,
              'completeReference': True,
              'transcribedFromCompleteSource': True,
              'source': {
                  'kind': 'professional-human-tab',
                  'title': 'Are You Gonna Go My Way',
                  'artist': 'Lenny Kravitz',
                  'provenance': 'Immutable human-written professional source revision 7868948 (2026-07-12), scorer-only structured extraction corresponding to Professionalexample.jpg',
                  'pageCount': 8,
                  'sourceSha256': 'aca2da3e8d551b2fd82b4ab3ecafa0c8932d6c0a27b54b6213ffc990ca08a9a9',
                  'completeSource': True,
                  'sourceRevisionId': 7868948,
                  'structuredSourceSha256': '18cdb4f8afb49562aac5b600730384636070d6ca8650823e759276a81ee4afc8',
              },
              'measureRange': {'firstMeasure': 1, 'lastMeasure': 113, 'measureCount': 113},
              'tempoBpm': 129,
              'timeSignature': {'beats': 4, 'noteValue': 4},
              'stepsPerMeasure': 16,
              'tuning': ['E4', 'B3', 'G3', 'D3', 'A2', 'E2'],
              'measures': measures,
          }
          out = Path('validation/rhythm_holdout/reference/professional-rhythm-structured-source-v2.json')
          out.write_text(json.dumps(reference, indent=2, sort_keys=True) + '\n')
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          meta = {
              'referenceJsonSha256': digest,
              'structuredSourceSha256': '18cdb4f8afb49562aac5b600730384636070d6ca8650823e759276a81ee4afc8',
              'professionalSourceSha256': 'aca2da3e8d551b2fd82b4ab3ecafa0c8932d6c0a27b54b6213ffc990ca08a9a9',
              'measureCount': 113,
              'playableOnsetCount': playable_onsets,
              'playableNoteCount': playable_notes,
              'populatedMeasureCount': populated,
              'oldTemporaryReferenceSha256': '4d3e7ee6b5485c747bc917077b0648747da7f7d7325c8ccce5058fc41090d8cd',
              'sameBytesAsOldTemporaryReference': digest == '4d3e7ee6b5485c747bc917077b0648747da7f7d7325c8ccce5058fc41090d8cd',
          }
          Path('.scorer/results/reference-build.json').write_text(json.dumps(meta, indent=2, sort_keys=True) + '\n')
          print(json.dumps(meta, indent=2, sort_keys=True))
          PY

      - name: Run mandatory professional holdout scorer at unchanged 0.99 threshold
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python validation/rhythm_holdout/run_final_holdout_gate.py \
            .scorer/freeze/freeze \
            validation/rhythm_holdout/reference/professional-rhythm-structured-source-v2.json \
            --output-dir .scorer/results/final-holdout \
            --minimum 0.99
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "Unexpected scorer failure rc=$rc" >&2
            exit "$rc"
          fi
          echo "$rc" > .scorer/results/scorer-return-code.txt

      - name: Record score diagnostic without committing human reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug/v143-contextual-prune
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          build = json.loads(Path('.scorer/results/reference-build.json').read_text())
          score = json.loads(Path('.scorer/results/final-holdout/rhythm-professional-holdout-score.json').read_text())
          final = json.loads(Path('.scorer/results/final-holdout/rhythm-final-holdout-gate.json').read_text())
          completeness = json.loads(Path('.scorer/results/final-holdout/rhythm-reference-completeness.json').read_text())
          rc = int(Path('.scorer/results/scorer-return-code.txt').read_text().strip())
          protected = subprocess.check_output(['git','hash-object','analyzer/v143_reference_free_rhythm_pipeline.py'], text=True).strip()

          report = {
              'schemaVersion': 1,
              'gate': 'v143-corrected-rhythm-professional-score',
              'runId': int('${{ github.run_id }}'),
              'runAttempt': int('${{ github.run_attempt }}'),
              'triggerSha': '${{ github.sha }}',
              'correctedFreezeArtifactId': 9499229323,
              'correctedFreezeArtifactSha256': '980070d12011c3c6724d9d7c26da3b2158b0161d6ed54c561454ab254ba1706a',
              'frozenEventSha256': final.get('frozenEventSha256'),
              'pdfEventSha256': final.get('pdfEventSha256'),
              'pdfEventFidelity': final.get('pdfEventFidelity'),
              'generatedNoteCount': score.get('generatedNoteCount'),
              'referenceNoteCount': score.get('referenceNoteCount'),
              'referenceMeasureCount': build.get('measureCount'),
              'referencePlayableOnsetCount': build.get('playableOnsetCount'),
              'referencePopulatedMeasureCount': build.get('populatedMeasureCount'),
              'referenceJsonSha256': build.get('referenceJsonSha256'),
              'oldTemporaryReferenceSha256': build.get('oldTemporaryReferenceSha256'),
              'sameBytesAsOldTemporaryReference': build.get('sameBytesAsOldTemporaryReference'),
              'structuredHumanSourceSha256': build.get('structuredSourceSha256'),
              'professionalSourceSha256': build.get('professionalSourceSha256'),
              'gatedMetrics': score.get('gatedMetrics'),
              'criticalMismatchCount': score.get('criticalMismatchCount'),
              'grossUnmatchedGeneratedNotes': score.get('grossUnmatchedGeneratedNotes'),
              'grossUnmatchedReferenceNotes': score.get('grossUnmatchedReferenceNotes'),
              'missingReferenceMeasures': score.get('missingReferenceMeasures'),
              'near100ProfessionalGatePassed': score.get('near100ProfessionalGatePassed'),
              'rhythmComplete': final.get('rhythmComplete'),
              'failedChecks': final.get('failedChecks'),
              'scorerReturnCode': rc,
              'referenceCompletenessPassed': completeness.get('passed'),
              'referenceOpenedOnlyAfterFreezeValidation': completeness.get('referenceOpenedOnlyAfterFreezeValidation'),
              'professionalReferenceUsedByAnalyzer': False,
              'referenceRuntimeInputUsed': False,
              'runtimeLabelsRequired': False,
              'protectedPipelineBlob': protected,
              'protectedPipelineUnchanged': protected == '7f72f8ed9b14af8bc93e95544195204d99c6bec1',
              'productionModified': False,
              'productionPromotionAuthorized': False,
              'referencePayloadCommitted': False,
              'note': 'Score uses deterministic scorer-only structured extraction of the exact immutable human-written source revision. It is not byte-identical to the earlier temporary 577-onset/925-note scorer JSON, which was not preserved.',
          }
          Path('debug/v143-contextual-prune/corrected-candidate-professional-score.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          if report['protectedPipelineUnchanged'] is not True:
              raise SystemExit('protected pipeline changed')
          PY
          git status --short
          if git status --short | grep -E 'validation/rhythm_holdout/reference/professional-rhythm-structured-source-v2.json'; then
            :
          fi
          rm -f validation/rhythm_holdout/reference/professional-rhythm-structured-source-v2.json

      - name: Commit score diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          git add debug/v143-contextual-prune/corrected-candidate-professional-score.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record corrected Rhythm professional score'
          git fetch origin v143-contextual-prune-lobo
          git rebase origin/v143-contextual-prune-lobo
          git push origin HEAD:v143-contextual-prune-lobo

      - name: Upload scorer reports only
        uses: actions/upload-artifact@v4
        with:
          name: v143-corrected-rhythm-professional-score
          path: |
            .scorer/results/reference-build.json
            .scorer/results/final-holdout/rhythm-reference-completeness.json
            .scorer/results/final-holdout/rhythm-professional-holdout-score.json
            .scorer/results/final-holdout/rhythm-final-holdout-gate.json
            .scorer/results/scorer-return-code.txt
          retention-days: 14
