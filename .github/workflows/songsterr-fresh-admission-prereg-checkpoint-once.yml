name: Songsterr Fresh Admission Prereg Checkpoint Once

on:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-admission-prereg-checkpoint-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: songsterr-fresh-pipeline-v1
          fetch-depth: 0
      - name: Update canonical checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md')
          text=p.read_text(encoding='utf-8')
          anchor='- Detailed record: `docs/checkpoints/SONGSTERR_FRESH_CODESPACES_MODEL_EVIDENCE_REVIEW.md`.\n'
          addition='- Next model-validation research is preregistered in `docs/checkpoints/SONGSTERR_FRESH_MODEL_EVIDENCE_ADMISSION_PREREGISTRATION_V1.md`: a new two-channel audio-domain corroborator (harmonic-stack spectral competition + independent time-domain periodicity competition) must be frozen and pass controlled synthetic fixtures before any execution on the authorized song. The already-observed CQT values may not tune it. A new Policy C-S epoch will be required for eventual authorized-song evaluation.\n'
          if addition in text:
              raise SystemExit('preregistration pointer already present')
          if anchor not in text:
              raise SystemExit('checkpoint anchor missing')
          text=text.replace(anchor, anchor+addition, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name 'dadrockyt-sys'
          git config user.email 'Stephen.s.mcnally@gmail.com'
          git add docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md
          git commit -m 'docs: checkpoint admission preregistration'
          git push origin HEAD:songsterr-fresh-pipeline-v1
