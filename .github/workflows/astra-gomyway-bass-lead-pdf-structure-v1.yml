name: Astra Go My Way Bass Lead PDF Structure V1

on:
  push:
    branches: [astra-work]
    paths:
      - 'astra_backend/evaluation/inventory_gomyway_bass_lead_pdf_structure_v1.py'
      - '.github/workflows/astra-gomyway-bass-lead-pdf-structure-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-work
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          ref: 74dacf322bb979c26a47786e2380c59d2d40e364
          path: .main-source
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PDF structure runtime
        run: python -m pip install pymupdf numpy opencv-python-headless

      - name: Verify professional PDF identities
        shell: bash
        run: |
          set -euo pipefail
          echo "18e6822394980d22a960a1bd4d923aaddf677f3341b8cc1a2dbb29ea1e8771d0  .main-source/public/Gomywaybassreference.pdf" | sha256sum -c -
          echo "a11a2c04fdda73e667df16df99aedf9ae0a3ed7af85f62f3c1773b7784a97f56  .main-source/public/Gomywayleadreference.pdf" | sha256sum -c -

      - name: Inventory professional PDF structure
        run: |
          python astra_backend/evaluation/inventory_gomyway_bass_lead_pdf_structure_v1.py             --bass-pdf .main-source/public/Gomywaybassreference.pdf             --lead-pdf .main-source/public/Gomywayleadreference.pdf             --output gomyway_bass_lead_pdf_structure_v1.json             --preview-dir gomyway-bass-lead-pdf-structure-v1

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("gomyway_bass_lead_pdf_structure_v1.json"))
          print("# Go My Way Bass/Lead PDF Structure V1")
          for role in ("bass","lead"):
              x=d[role]
              print(f"- {role}: pages={x['pageCount']}, detected tab staves={x['tablatureStaveCount']}, rough boxes={x['roughBoxCountAcrossPages']}")
          print("- Candidate audio used: **no**")
          print("- Candidate predictions used: **no**")
          print("- Semantic note recognition: **not yet**")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: astra-gomyway-bass-lead-pdf-structure-v1
          path: |
            gomyway_bass_lead_pdf_structure_v1.json
            gomyway-bass-lead-pdf-structure-v1/
          retention-days: 30
