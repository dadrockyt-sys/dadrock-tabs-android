name: V143 Async Job Protocol Gate

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - analyzer/v143_async_job_protocol.py
      - analyzer/v143_modal_http_endpoint.py
      - analyzer/v143_async_job_protocol_gate.py
      - .github/workflows/v143-async-job-protocol-gate.yml

permissions:
  contents: read

concurrency:
  group: v143-async-job-protocol-gate
  cancel-in-progress: false

jobs:
  async-protocol-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Run source-only async protocol gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug/v143-contextual-prune/async-protocol-gate
          python3 analyzer/v143_async_job_protocol_gate.py \
            | tee debug/v143-contextual-prune/async-protocol-gate/summary.json

      - name: Preserve aggregate gate evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-async-job-protocol-gate
          path: debug/v143-contextual-prune/async-protocol-gate/summary.json
          if-no-files-found: warn
          retention-days: 14
