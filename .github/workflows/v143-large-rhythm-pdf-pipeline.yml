name: Validate V143 large Rhythm PDF pipeline

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-large-rhythm-pdf-pipeline.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Model-free regression checks
        run: node .github/scripts/v143-large-rhythm-pipeline-regression.mjs

      - name: Next.js compile/build validation
        run: npm run build
