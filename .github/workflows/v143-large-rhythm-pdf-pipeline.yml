            app/api/generate-tab-pdf/route.js \
            lib/jimmyPaigeAnalysisPayload.js \
            lib/v143RenderContract.js \
            lib/v143RhythmPdfArtifacts.js \
            .github/scripts/v143-large-rhythm-pipeline-regression.mjs
          git diff --cached --check
          git commit -m "feat: scale Rhythm upload to PDF artifact flow"
