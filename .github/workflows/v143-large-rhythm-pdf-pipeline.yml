name: Patch V143 large Rhythm PDF pipeline

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-large-rhythm-pdf-pipeline.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0

      - name: Apply exact patch
        run: python3 .github/scripts/apply-v143-large-rhythm-pipeline.py

      - name: Model-free regression checks
        run: node .github/scripts/v143-large-rhythm-pipeline-regression.mjs

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ai-tab/page.js app/api/audio-upload/route.js app/api/analyze-audio-tab/route.js app/api/generate-tab-pdf/route.js lib/jimmyPaigeAnalysisPayload.js lib/v143RenderContract.js lib/v143RhythmPdfArtifacts.js .github/scripts/v143-large-rhythm-pipeline-regression.mjs
          git diff --cached --check
          git commit -m "feat: scale Rhythm upload to PDF artifact flow"
          git push origin HEAD:v143-contextual-prune-lobo
