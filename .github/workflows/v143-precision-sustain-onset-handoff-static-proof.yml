name: V143 Precision Sustain Onset Handoff Static Proof

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-precision-sustain-onset-handoff-static-proof.yml
      - analyzer/check_v143_precision_sustain_onset_handoff.py
      - analyzer/v143_precision_sustain_promotion.py
      - analyzer/v143_contextual_prune_precision_candidate_events.py
      - analyzer/v143_repaired_timing_precision_candidate_product_modal.py
      - analyzer/v143_rhythm_sustain_technique_enricher.py
      - analyzer/v143_reference_free_rhythm_pipeline.py

concurrency:
  group: v143-precision-sustain-onset-handoff-static-proof
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  static-proof:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove corrected onset handoff contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            analyzer/v143_precision_sustain_promotion.py \
            analyzer/check_v143_precision_sustain_onset_handoff.py
          PYTHONPATH=analyzer python analyzer/check_v143_precision_sustain_onset_handoff.py \
            | tee debug/v143-contextual-prune/precision-sustain-onset-handoff.log

      - name: Commit static diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            debug/v143-contextual-prune/precision-sustain-onset-handoff.json \
            debug/v143-contextual-prune/precision-sustain-onset-handoff.log
          if git diff --cached --quiet; then
            echo "No onset handoff diagnostic changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record V143 precision sustain onset handoff proof"
          git push origin HEAD:v143-contextual-prune-lobo

      - name: Enforce corrected static proof
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("debug/v143-contextual-prune/precision-sustain-onset-handoff.json").read_text(encoding="utf-8"))
          required = {
              "passed": True,
              "defectPresent": False,
              "assemblySeparatesPhysicalFromGrid": True,
              "productDelegatesToPurePromotion": True,
              "promotionModuleBundledInCandidateImage": True,
              "eventCountUnchanged": True,
              "attackPitchPositionIdentityUnchanged": True,
              "physicalOnsetPreserved": True,
              "quantizedGridStartPreserved": True,
              "durationContractConsistent": True,
              "physicalOnsetDeltaTruthful": True,
              "sustainTimingMetadataTruthful": True,
              "noInventedAttackOrPitch": True,
              "correctionProven": True,
              "protectedPipelineUnchanged": True,
              "professionalReferenceUsed": False,
              "runtimeLabelsRequired": False,
              "productionModified": False,
              "modalGpuUsed": False,
          }
          failed = [key for key, expected in required.items() if data.get(key) is not expected]
          if failed:
              raise SystemExit(f"V143 corrected onset handoff proof failed: {failed}")
          print("V143 precision sustain physical-onset preservation proof passed")
          PY
