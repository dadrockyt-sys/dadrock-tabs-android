name: Astra Architecture A1 offline verification V1

on:
  push:
    branches: [astra-work]
    paths:
      - 'docs/astra/ARCHITECTURE_RESEARCH_A1_VERIFICATION_LAUNCH_V1.json'

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'

      - name: Validate A1 verification launch
        run: |
          python - <<'PY'
          import json
          x=json.load(open('docs/astra/ARCHITECTURE_RESEARCH_A1_VERIFICATION_LAUNCH_V1.json'))
          assert x['schema']=='astra-architecture-research-a1-verification-launch-v1'
          assert x['status']=='armed'
          assert x['launchIdentity']=='architecture-a1-verify-20260928-canonical-01'
          assert x['optimizerSteps']==0
          assert x['fitCalls']==0
          assert x['automaticRetry'] is False
          assert x['p1Access'] is False and x['p2Access'] is False and x['p3Access'] is False
          print('A1_VERIFICATION_LAUNCH_OK')
          PY

      - name: Install frozen CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          python -m pip install --disable-pip-version-check pytest

      - name: Download exact frozen control
        uses: actions/download-artifact@v4
        with:
          name: astra-source-domain-simulator-preparation-v1
          path: /tmp/astra-a1-control
          github-token: ${{ github.token }}
          repository: dadrockyt-sys/dadrock-tabs-android
          run-id: '36475263654'

      - name: Download exact V2 intervention
        uses: actions/download-artifact@v4
        with:
          name: astra-source-domain-v2-stage-b-v1
          path: /tmp/astra-a1-v2
          github-token: ${{ github.token }}
          repository: dadrockyt-sys/dadrock-tabs-android
          run-id: '36485375684'

      - name: Download exact V3 challenge
        uses: actions/download-artifact@v4
        with:
          name: astra-source-domain-v3-final-coverage-v2
          path: /tmp/astra-a1-v3
          github-token: ${{ github.token }}
          repository: dadrockyt-sys/dadrock-tabs-android
          run-id: '36487005586'

      - name: Download exact frozen V3 comparator
        uses: actions/download-artifact@v4
        with:
          name: astra-source-domain-v3-synthetic-training-v1
          path: /tmp/astra-a1-comparator
          github-token: ${{ github.token }}
          repository: dadrockyt-sys/dadrock-tabs-android
          run-id: '36489648572'

      - name: Verify exact file and source identities
        shell: bash
        run: |
          set -euo pipefail
          CONTROL=/tmp/astra-a1-control/datasets/s9-control.npz
          INTERVENTION=/tmp/astra-a1-v2/v2-intervention.npz
          CHALLENGE=/tmp/astra-a1-v3/v3-primary-challenge.npz
          COMPARATOR=/tmp/astra-a1-comparator/result.json
          test "$(sha256sum "$CONTROL" | awk '{print $1}')" = "16123bfab56050e355e424be0050b11e6447b24c32c105da86c0ec971d599894"
          test "$(sha256sum "$INTERVENTION" | awk '{print $1}')" = "a17a16daeb8d698e325dc6820f18d5eda2fec75d9beebe2a9605a678124dc26b"
          test "$(sha256sum "$CHALLENGE" | awk '{print $1}')" = "368032e81722a4ca97bf2ec81b432b90ef2fc982cac20c8bd543d34f514d9bce"
          test "$(sha256sum "$COMPARATOR" | awk '{print $1}')" = "5b5b9be61196d6e40abb2182f5dd0cff4b21f7c9fe927592324bc20df471f36d"
          python - <<'PY'
          import hashlib,pathlib
          def blob(p):
              b=pathlib.Path(p).read_bytes()
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert blob('astra_backend/synthetic/architecture_research_a1_v1.py')=='c88fab40cb550663d84423b3394a974ee90c9bd0'
          assert blob('astra_backend/synthetic/test_architecture_research_a1_v1.py')=='683006f84bce6f33cf65b17aefb7bd4730ef0285'
          assert blob('astra_backend/synthetic/s11_pilot_v1.py')=='d4aacc4081ed2ff851c7879ee4dc08d757c8a3d8'
          assert blob('docs/astra/ARCHITECTURE_RESEARCH_A1_DESIGN_V1.md')=='83735d26324757e16dc0b9c89b2749f1b960516d'
          assert blob('docs/astra/ARCHITECTURE_RESEARCH_A1_SPEC_V1.json')=='9caa62d0a6d09e6e77b162a9ca08aa56924e38aa'
          print('A1_SOURCE_PINS_OK')
          PY

      - name: Structural A1 tests
        env:
          PYTHONPATH: astra_backend
        run: |
          pytest -q astra_backend/synthetic/test_architecture_research_a1_v1.py

      - name: Frozen-input and batch-plan verification
        env:
          PYTHONPATH: astra_backend
        run: |
          python -m synthetic.architecture_research_a1_v1 verify \
            --control /tmp/astra-a1-control/datasets/s9-control.npz \
            --intervention /tmp/astra-a1-v2/v2-intervention.npz \
            --challenge /tmp/astra-a1-v3/v3-primary-challenge.npz \
            --comparator /tmp/astra-a1-comparator/result.json

      - name: Write zero-optimizer verification receipt
        shell: bash
        run: |
          mkdir -p /tmp/astra-a1-verification
          python - <<'PY'
          import json,pathlib
          r={
            'schema':'astra-architecture-research-a1-offline-verification-v1',
            'status':'passed',
            'sourceGitBlobs':{
              'runner':'c88fab40cb550663d84423b3394a974ee90c9bd0',
              'tests':'683006f84bce6f33cf65b17aefb7bd4730ef0285',
              's11':'d4aacc4081ed2ff851c7879ee4dc08d757c8a3d8',
              'design':'83735d26324757e16dc0b9c89b2749f1b960516d',
              'spec':'9caa62d0a6d09e6e77b162a9ca08aa56924e38aa'
            },
            'execution':{
              'fitCalls':0,'optimizerSteps':0,'modelInference':False,
              'thresholdSearch':False,'thresholdRetuning':False,
              'automaticRetry':False,'p1Accessed':False,'p2Accessed':False,'p3Opened':False,
              'paidComputeDollars':0,'productionMutation':False
            }
          }
          pathlib.Path('/tmp/astra-a1-verification/receipt.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print('A1_OFFLINE_VERIFICATION_OK')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: astra-architecture-a1-offline-verification-v1
          path: /tmp/astra-a1-verification/receipt.json
          if-no-files-found: error
          retention-days: 30
