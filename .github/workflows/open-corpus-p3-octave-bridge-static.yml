name: Open corpus P3 octave bridge static self-test

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - validation/open_corpus/generate_p3_reference_blind_octave_candidates_v169.py
      - validation/open_corpus/score_p3_octave_bridge_v169.py
      - .github/workflows/open-corpus-p3-octave-bridge-static.yml
  workflow_dispatch:

jobs:
  static-self-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Verify frozen scientific identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object validation/open_corpus/evaluate_harmonic_candidate_ranking_v2_v169.py)" = "95e1e7d20a4bb5b15962cb803fa2da4d065743ae"
          test "$(git hash-object validation/open_corpus/analyze_guitar_techs_harmonic_octave_v169.py)" = "c39305df4f875bf6aec0d5e9d5b6448a5f7404df"
          test "$(git hash-object validation/open_corpus/generate_p3_reference_blind_octave_candidates_v169.py)" = "e3fe6f88b585405751dad139d82769dd00743d69"
          test "$(git hash-object validation/open_corpus/score_p3_octave_bridge_v169.py)" = "70ed9ceb69584ce96945688ae45cd9c8ffa3022a"
          echo P3_BRIDGE_BLOB_GUARDS_PASS

      - name: Candidate static reference-isolation guard
        shell: python
        run: |
          import ast
          from pathlib import Path
          p=Path('validation/open_corpus/generate_p3_reference_blind_octave_candidates_v169.py')
          text=p.read_text()
          tree=ast.parse(text)
          imports=set()
          for n in ast.walk(tree):
              if isinstance(n,ast.Import): imports.update(a.name.split('.')[0] for a in n.names)
              elif isinstance(n,ast.ImportFrom) and n.module: imports.add(n.module.split('.')[0])
          forbidden_imports={'pretty_midi','mido','zipfile'}
          bad=sorted(imports & forbidden_imports)
          if bad: raise SystemExit(f'candidate forbidden imports: {bad}')
          forbidden_text=['--reference-dir','--reference','load_reference(','load_notes(','midi_XX.mid']
          hits=[x for x in forbidden_text if x in text]
          if hits: raise SystemExit(f'candidate forbidden reference surface: {hits}')
          print('P3_CANDIDATE_REFERENCE_ISOLATION_STATIC_PASS')
          print('p3ReferenceRead=false')
          print('v168ReferenceFacingScoreCalls=0')

      - name: Scorer static no-audio/no-generation guard
        shell: python
        run: |
          from pathlib import Path
          text=Path('validation/open_corpus/score_p3_octave_bridge_v169.py').read_text()
          forbidden=['basic_pitch','best_candidate_window','load_mono_audio','--audio-root','.wav','soundfile']
          hits=[x for x in forbidden if x in text]
          if hits: raise SystemExit(f'scorer forbidden generation/audio surface: {hits}')
          print('P3_SCORER_NO_AUDIO_STATIC_PASS')
          print('candidateRegenerated=false')
          print('v168ReferenceFacingScoreCalls=0')

      - name: Compile bridge scripts
        run: |
          python -m py_compile validation/open_corpus/generate_p3_reference_blind_octave_candidates_v169.py
          python -m py_compile validation/open_corpus/score_p3_octave_bridge_v169.py

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install frozen CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 \
            tflite-runtime==2.14.0 \
            basic-pitch==0.4.0

      - name: Candidate wrapper self-test
        working-directory: validation/open_corpus
        run: python generate_p3_reference_blind_octave_candidates_v169.py --self-test

      - name: Scorer self-test
        run: python validation/open_corpus/score_p3_octave_bridge_v169.py --self-test

      - name: Reconfirm Basic Pitch model identity
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          from basic_pitch import ICASSP_2022_MODEL_PATH
          h=hashlib.sha256(Path(ICASSP_2022_MODEL_PATH).read_bytes()).hexdigest()
          assert h=='3db297d54af8e01c6e5618245c956b1d71b6a2b978cb2dedb527173186552676', h
          print('BASIC_PITCH_MODEL_HASH_PASS',h)
