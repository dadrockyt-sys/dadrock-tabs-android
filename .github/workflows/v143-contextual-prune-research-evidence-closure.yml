name: V143 Contextual Prune Research Evidence Closure

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-contextual-prune-research-evidence-closure.yml

permissions:
  contents: write

jobs:
  research-evidence-closure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out isolated research branch
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build strict research evidence closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          ROOT = Path("debug/v143-contextual-prune")
          CAL = Path("public/training/v143-musical-reconstruction-calibration")
          paths = {
              "surviving": ROOT / "surviving-band-provenance.json",
              "downstream": ROOT / "downstream-exact-family-closure.json",
              "runtime": ROOT / "runtime-replay-action.json",
              "smoke": ROOT / "shadow-modal-smoke.json",
              "staticAction": ROOT / "shadow-static-action.json",
              "packagingAction": ROOT / "shadow-packaging-action.json",
              "staticReport": CAL / "contextual-prune-shadow-static-report.json",
              "packagingReport": CAL / "contextual-prune-shadow-packaging-report.json",
          }
          output = ROOT / "research-evidence-closure.json"

          def load(path):
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f"Missing closure evidence: {path}")
              value = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise SystemExit(f"Expected JSON object: {path}")
              return value

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def require(group, checks):
              failed = [name for name, ok in checks.items() if ok is not True]
              if failed:
                  raise SystemExit(f"{group} failed: " + ", ".join(failed))

          surviving = load(paths["surviving"])
          result = dict(surviving.get("diagnosticResult") or {})
          bands = dict(result.get("bands") or {})
          s3 = dict(bands.get("section3") or {})
          reserve = dict(bands.get("reserve") or {})
          reserve_scoring = dict(result.get("reserveScoring") or {})
          tail = dict(result.get("partialTailAdapter") or {})
          inv = dict(result.get("invariants") or {})
          s3_proof_inv = dict(s3.get("exactFamilyProofInvariants") or {})

          require("surviving-band wrapper", {
              "action gate": surviving.get("gate") == "v143-contextual-prune-surviving-band-provenance-action",
              "credentials": surviving.get("modalCredentialsAvailableInGitHubActions") is True,
              "attempted": surviving.get("diagnosticAttempted") is True,
              "exit zero": surviving.get("modalCommandExitCode") == 0,
              "result found": surviving.get("diagnosticResultFound") is True,
              "production untouched": surviving.get("productionModified") is False,
          })
          require("33-113 provenance", {
              "diagnostic gate": result.get("gate") == "v143-contextual-prune-surviving-band-provenance",
              "original boundaries": inv.get("originalBandBoundariesPreserved") is True,
              "no monolithic carrier": inv.get("monolithicCarrierUsed") is False,
              "17-32 excluded": inv.get("measures17To32Claimed") is False,
              "claim text excludes 17-32": "17-32 explicitly excluded" in str(result.get("claimScope") or ""),
              "all carriers": result.get("allCarrierProvenancePassed") is True,
              "all surviving bands": result.get("allSurvivingBandsProvenancePassed") is True,
              "exact Family-B evidence": result.get("section3ExactFamilyEvidenceApplied") is True,
              "Section 3 carrier": s3.get("provenanceReplayPassed") is True,
              "Section 3 decision": s3.get("frozenDecisionReplayPassed") is True,
              "Section 3 base": s3.get("frozenBaseScoresReplayPassed") is True,
              "Section 3 sequence": s3.get("frozenSequenceScoresReplayPassed") is True,
              "Section 3 keep": s3.get("frozenKeepProbabilitiesReplayPassed") is True,
              "Section 3 observation retained": isinstance(s3.get("currentContainerObservation"), dict),
              "Section 3 thresholds unchanged": s3_proof_inv.get("thresholdsModified") is False,
              "Section 3 tolerances unchanged": s3_proof_inv.get("comparisonTolerancesWeakened") is False,
              "reserve carrier": reserve.get("provenanceReplayPassed") is True,
              "reserve scoring": reserve_scoring.get("reserveScoringReplayPassed") is True,
              "historical reserve 264 rows": int(tail.get("comparisonGridCount") or -1) == 264,
              "measure 113 steps 0-7": tail.get("comparisonMeasure113Steps") == list(range(8)),
              "synthetic guard hidden": tail.get("syntheticGuardHiddenFromAssignment") is True,
              "historical grid restored": tail.get("trimmedReserveGrid") is True,
              "carrier rows untouched": tail.get("carrierRowsPostHocModified") is False,
              "frozen scorer untouched": tail.get("frozenScorerModified") is False,
              "professional reference unopened": inv.get("professionalReferenceOpened") is False,
              "runtime labels not required": inv.get("runtimeLabelsRequired") is False,
              "frozen model untouched": inv.get("frozenModelModified") is False,
              "frozen predictions untouched": inv.get("frozenPredictionsModified") is False,
              "live endpoint untouched": inv.get("liveEndpointDeployedOrModified") is False,
              "production untouched": inv.get("productionModified") is False,
          })

          downstream = load(paths["downstream"])
          dinv = dict(downstream.get("invariants") or {})
          require("downstream exact-family closure", {
              "gate": downstream.get("gate") == "v143-contextual-prune-downstream-exact-family-closure",
              "same source": str(downstream.get("sourceSha256") or "") == str(result.get("sourceSha256") or ""),
              "decisions exact": downstream.get("allHistoricalBandsDecisionEquivalent") is True,
              "scores exact": downstream.get("allHistoricalBandsFullyEquivalentWithinTolerance") is True,
              "observation retained": dinv.get("historicalSection3CurrentContainerObservationRetained") is True,
              "exact family required": dinv.get("exactFamilyEvidenceRequired") is True,
              "tolerances unchanged": dinv.get("comparisonTolerancesWeakened") is False,
              "thresholds unchanged": dinv.get("thresholdsModified") is False,
              "frozen model untouched": dinv.get("frozenModelModified") is False,
              "frozen predictions untouched": dinv.get("frozenPredictionsModified") is False,
              "professional reference unopened": dinv.get("professionalReferenceOpened") is False,
              "runtime labels not required": dinv.get("runtimeLabelsRequired") is False,
              "live endpoint untouched": dinv.get("liveEndpointDeployedOrModified") is False,
              "production untouched": dinv.get("productionModified") is False,
          })

          runtime = load(paths["runtime"])
          runtime_log = "\n".join(map(str, runtime.get("logTail", []) or []))
          require("frozen runtime replay", {
              "gate": runtime.get("gate") == "v143-contextual-prune-runtime-replay-action",
              "compile zero": runtime.get("compileExitCode") == 0,
              "replay zero": runtime.get("replayExitCode") == 0,
              "report exists": runtime.get("reportExists") is True,
              "dev fingerprint": "DEV_FINGERPRINT_MATCHED True" in runtime_log,
              "reserve base": "EXACT_RESERVE_BASE_REPLAY True" in runtime_log,
              "reserve contextual": "EXACT_RESERVE_CONTEXTUAL_REPLAY True" in runtime_log,
              "reference unopened": "PROFESSIONAL_REFERENCE_OPENED False" in runtime_log,
              "production untouched": runtime.get("productionModified") is False,
          })

          smoke = load(paths["smoke"])
          require("Modal smoke", {
              "gate": smoke.get("gate") == "v143-contextual-prune-shadow-modal-dependency-smoke",
              "credentials": smoke.get("modalCredentialsAvailableInGitHubActions") is True,
              "attempted": smoke.get("smokeAttempted") is True,
              "exit zero": smoke.get("smokeExitCode") == 0,
              "passed": smoke.get("smokePassed") is True,
              "production untouched": smoke.get("productionModified") is False,
          })

          static_action = load(paths["staticAction"])
          static_report = load(paths["staticReport"])
          require("shadow static gate", {
              "action gate": static_action.get("gate") == "v143-contextual-prune-shadow-static-action",
              "action exit": static_action.get("exitCode") == 0,
              "action report": static_action.get("reportExists") is True,
              "report gate": static_report.get("gate") == "v143-contextual-prune-isolated-shadow-static",
              "carrier constants": static_report.get("carrierConstantsMatchedResearch") is True,
              "four sweeps": static_report.get("fourHistoricalWideRecallSweepsRequired") is True,
              "CQT windows": static_report.get("wholeOnsetCqtWindowsMatchedResearch") is True,
              "normalization locked": static_report.get("historicalResearchNormalizationLocked") is True,
              "model fingerprint": static_report.get("frozenContextualModelFingerprintMatched") is True,
              "shadow isolated": static_report.get("shadowAppIsolated") is True,
              "no shadow HTTP endpoint": static_report.get("shadowHttpEndpointExposed") is False,
              "live V143 files unchanged": static_report.get("liveV143FilesUnchanged") is True,
              "professional reference absent": static_report.get("professionalReferencePathPresentInNewRuntimeSources") is False,
              "gate passed": static_report.get("gatePassed") is True,
              "production untouched": static_report.get("productionModified") is False,
          })

          packaging_action = load(paths["packagingAction"])
          packaging_report = load(paths["packagingReport"])
          require("shadow packaging gate", {
              "action gate": packaging_action.get("gate") == "v143-contextual-prune-shadow-packaging-action",
              "action exit": packaging_action.get("exitCode") == 0,
              "action report": packaging_action.get("reportExists") is True,
              "report gate": packaging_report.get("gate") == "v143-contextual-prune-shadow-modal-local-dependency-closure",
              "GPU worker packaged": packaging_report.get("gpuWorkerDependencyPackaged") is True,
              "module files present": packaging_report.get("allPackagedModuleFilesPresent") is True,
              "local imports packaged": packaging_report.get("allLocalImportsPackaged") is True,
              "protected live modules excluded": packaging_report.get("protectedLiveModulesPackaged") is False,
              "professional reference unopened": packaging_report.get("professionalReferenceOpened") is False,
              "live endpoint untouched": packaging_report.get("liveEndpointDeployedOrModified") is False,
              "gate passed": packaging_report.get("gatePassed") is True,
              "production untouched": packaging_report.get("productionModified") is False,
          })

          payload = {
              "schemaVersion": 1,
              "gate": "v143-contextual-prune-research-evidence-closure",
              "status": "passed",
              "claimScope": "research-only surviving historical/reference-free behavior for measures 33-113",
              "explicitExclusions": [
                  "measures 17-32 are not claimed by this closure",
                  "production promotion is not authorized",
                  "live endpoint deployment or modification is not authorized",
              ],
              "sourceSha256": result.get("sourceSha256"),
              "evidenceSha256": {name: digest(path) for name, path in paths.items()},
              "provenance": {
                  "allCarrierProvenancePassed": True,
                  "allSurvivingBandsProvenancePassed": True,
                  "section3HistoricalExactFamily": "B",
                  "section3ExactFamilyEvidenceApplied": True,
                  "section3CurrentContainerObservationRetained": True,
                  "reservePartialTailHistoricalGridCount": 264,
                  "reservePartialTailMeasure113Steps": list(range(8)),
              },
              "downstream": {
                  "allHistoricalBandsDecisionEquivalent": True,
                  "allHistoricalBandsFullyEquivalentWithinTolerance": True,
                  "comparisonTolerancesWeakened": False,
              },
              "runtime": {
                  "developmentFingerprintMatched": True,
                  "reserveBaseReplayExact": True,
                  "reserveContextualReplayExact": True,
              },
              "shadowIsolation": {
                  "modalDependencySmokePassed": True,
                  "staticGatePassed": True,
                  "packagingGatePassed": True,
                  "protectedLiveModulesPackaged": False,
                  "liveV143FilesUnchanged": True,
              },
              "safety": {
                  "professionalReferenceOpened": False,
                  "runtimeLabelsRequired": False,
                  "frozenModelModified": False,
                  "frozenPredictionsModified": False,
                  "thresholdsModified": False,
                  "comparisonTolerancesWeakened": False,
                  "liveEndpointDeployedOrModified": False,
                  "productionModified": False,
                  "productionPromotionAllowed": False,
              },
              "researchEvidenceClosurePassed": True,
          }
          output.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print("RESEARCH_EVIDENCE_CLOSURE", True)
          print("MEASURES_17_32_CLAIMED", False)
          print("PRODUCTION_PROMOTION_ALLOWED", False)
          print("PRODUCTION_MODIFIED", False)
          PY

      - name: Commit research evidence closure
        shell: bash
        run: |
          set -euo pipefail
          git add -- debug/v143-contextual-prune/research-evidence-closure.json
          if git diff --cached --quiet; then
            echo "No research evidence closure changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record V143 research evidence closure"
          git push origin HEAD:v143-contextual-prune-lobo

      - name: Enforce research-only closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("debug/v143-contextual-prune/research-evidence-closure.json").read_text(encoding="utf-8"))
          safety = dict(data.get("safety") or {})
          checks = {
              "closure": data.get("researchEvidenceClosurePassed") is True,
              "scope": data.get("claimScope") == "research-only surviving historical/reference-free behavior for measures 33-113",
              "promotion denied": safety.get("productionPromotionAllowed") is False,
              "production untouched": safety.get("productionModified") is False,
              "endpoint untouched": safety.get("liveEndpointDeployedOrModified") is False,
              "tolerances unchanged": safety.get("comparisonTolerancesWeakened") is False,
              "thresholds unchanged": safety.get("thresholdsModified") is False,
          }
          failed = [name for name, ok in checks.items() if ok is not True]
          if failed:
              raise SystemExit("Research evidence closure enforcement failed: " + ", ".join(failed))
          print("V143 research evidence closure passed; production remains untouched and unauthorized.")
          PY
