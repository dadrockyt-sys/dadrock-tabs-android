name: V143 Preview Protection OIDC Probe

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - '.github/workflows/v143-preview-protection-oidc-probe.yml'

permissions:
  contents: read
  id-token: write

env:
  PREVIEW_DEPLOYMENT_ID: dpl_F6ksguDvc1nVAt33jNxxoVTmyyJA
  PREVIEW_DEPLOYMENT_URL: https://dadrock-tabs-android-r602jctx9-stephen-mcnally-s-projects.vercel.app

jobs:
  oidc-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Get GitHub Actions OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Probe protected Preview with trusted OIDC header
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=debug/v143-contextual-prune/preview-protection-oidc
          mkdir -p "$OUT"
          STATUS="$(
            curl --silent --show-error --location --max-time 30 \
              --header "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN" \
              --output /dev/null --write-out '%{http_code}' \
              "$PREVIEW_DEPLOYMENT_URL/ai-tab"
          )"
          export STATUS
          echo "oidcProtectedPreviewStatus=$STATUS"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          status = int(os.environ['STATUS'])
          summary = {
              'schemaVersion': 1,
              'gate': 'v143-preview-protection-oidc-probe',
              'previewDeploymentId': os.environ['PREVIEW_DEPLOYMENT_ID'],
              'previewDeploymentUrl': os.environ['PREVIEW_DEPLOYMENT_URL'],
              'oidcTokenRequested': True,
              'oidcTokenRetained': False,
              'httpStatus': status,
              'trustedOidcAccessGranted': status == 200,
              'deploymentProtectionDisabled': False,
              'modelBearingStartRequests': 0,
              'audioRead': False,
              'modelExecuted': False,
              'referenceFacingInputs': 0,
              'referenceScoreCalls': 0,
              'qualityVerdictMade': False,
          }
          Path('debug/v143-contextual-prune/preview-protection-oidc/summary.json').write_text(
              json.dumps(summary, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, indent=2))
          PY
          test "$STATUS" = '200'

      - name: Preserve aggregate auth evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-preview-protection-oidc-probe
          path: debug/v143-contextual-prune/preview-protection-oidc/summary.json
          if-no-files-found: warn
          retention-days: 7
