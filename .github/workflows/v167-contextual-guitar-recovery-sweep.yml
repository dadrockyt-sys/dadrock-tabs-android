name: V167 preregistered contextual Guitar recovery sweep

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v167-contextual-guitar-recovery-sweep.yml

permissions:
  contents: write

concurrency:
  group: v167-contextual-guitar-recovery-sweep-once
  cancel-in-progress: false

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: ede1a3aaf02a7424c9b69431db6683d2917fcf19
  BASE: debug/v167-single-song-calibration/iteration-003-generated.json
  POOL: debug/v167-single-song-calibration/nearmiss-evidence-pool.json
  TIMEBASE: debug/v166-cpu-autonomous/timebase.json
  BASE_BUILDER: validation/v167_single_song_calibration/build_upstream_recovery_variants_v167.py
  BUILDER: validation/v167_single_song_calibration/build_contextual_guitar_recovery_variants_v167.py
  GRADER: validation/v167_single_song_calibration/score_contextual_guitar_recovery_variants_v167.py
  SCORER: validation/v154_cpu_multitrack/score_frontend_reference.py
  REFERENCE: research/v154-professional-references/scorer-ready/frontend-reference-payload.json
  VARIANT_ROOT: /tmp/v167-contextual-guitar-recovery-variants
  MANIFEST: debug/v167-single-song-calibration/contextual-guitar-recovery-sweep-manifest.json
  OUTPUT: debug/v167-single-song-calibration/contextual-guitar-recovery-sweep.json
  RECEIPT: debug/v167-single-song-calibration/contextual-guitar-recovery-sweep-receipt.json
  CUDA_VISIBLE_DEVICES: ""
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  sweep-once:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact preregistered contextual sweep arm
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.21'

      - name: Verify immutable preregistration boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v167-contextual-guitar-recovery-sweep.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"
          test "$(git hash-object "$BASE")" = "758f8762632e916306aed9b036a6483af9431dc0"
          test "$(git hash-object "$POOL")" = "aa7da3a55344b1418a291f30fab9ca55858fc094"
          test "$(git hash-object "$TIMEBASE")" = "abebae25801b7ddeb5b933977c4f4a918f7bf9ef"
          test "$(git hash-object "$BASE_BUILDER")" = "24413d321f64bbfcce48812ceb85b4593dcfa80c"
          test "$(git hash-object "$BUILDER")" = "23065c56b5b08d1d9d59fe37a01dfa95f6c6627d"
          test "$(git hash-object "$GRADER")" = "adfd512f53e8839b295129c0768d484b5af09bc7"
          test "$(git hash-object "$SCORER")" = "9644e65719fbd361a9b39778ae9950c5e983e855"
          test "$(git hash-object "$REFERENCE")" = "2fbed60b543c0488934d8642c488aa06bf31bbf5"
          test "$(git hash-object docs/checkpoints/CURRENT_STATE.md)" = "fe418bd4247a620fd1c62da63394628ebe27d5c8"
          test ! -e "$MANIFEST"
          test ! -e "$OUTPUT"
          test ! -e "$RECEIPT"
          python -m py_compile "$BASE_BUILDER" "$BUILDER" "$GRADER" "$SCORER"
          python - <<'PY'
          import hashlib, importlib.util, sys
          from pathlib import Path
          checks={
            'debug/v167-single-song-calibration/iteration-003-generated.json':'f15c6f40dd4b8479c2dfb7eab039cff98a23b45eb796265ffad08c575bf709673',
            'debug/v167-single-song-calibration/nearmiss-evidence-pool.json':'1c983784c2d12a22437a80387525789bcf55a2f4e4a5c7a96608c575bf709673',
            'research/v154-professional-references/scorer-ready/frontend-reference-payload.json':'b39a203aec3f45800891fe4eca156e37e7571b91ea5c4ccc41b30bbc95fc89e7',
          }
          for path,expected in checks.items():
              actual=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert actual==expected,(path,actual,expected)
          text=Path('validation/v167_single_song_calibration/build_contextual_guitar_recovery_variants_v167.py').read_text()
          for forbidden in ('frontend-reference-payload.json','score_frontend_reference.py'):
              assert forbidden not in text,forbidden
          module_dir=Path('validation/v167_single_song_calibration').resolve()
          sys.path.insert(0,str(module_dir))
          path=module_dir/'build_contextual_guitar_recovery_variants_v167.py'
          spec=importlib.util.spec_from_file_location('_v167_contextual_guard',path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          configs=list(module.contextual_configs())
          assert len(configs)==37,len(configs)
          assert sum(bool(c.get('baseline',False)) for c in configs)==1
          nonbase=[c for c in configs if not c.get('baseline',False)]
          assert len(nonbase)==36
          assert {c['onsetSupportMin'] for c in nonbase}=={0.50,0.65}
          assert {c['candidateToMaxActiveTemplateScoreMin'] for c in nonbase}=={0.75,1.00,1.25}
          assert {c['activeStateMode'] for c in nonbase}=={'allow_active','inactive_only'}
          assert {c['intervalContextPolicy'] for c in nonbase}=={'none','exclude_harmonic_octave','chord_interval'}
          assert all(c['templateRankMin']==0.975 for c in nonbase)
          assert all(c['activitySupportMin']==0.05 for c in nonbase)
          assert all(c['fundamentalPresentRequired'] is True for c in nonbase)
          assert all(c['requireBasicPitchActiveContext'] is True for c in nonbase)
          assert all(c['maxAddsPerSite']==1 for c in nonbase)
          assert all(c['polyphonyCap']==6 for c in nonbase)
          PY

      - name: Generate and seal all contextual variants before reference scoring
        shell: bash
        run: |
          set -euo pipefail
          python "$BUILDER" \
            --base "$BASE" \
            --pool "$POOL" \
            --timebase "$TIMEBASE" \
            --output-dir "$VARIANT_ROOT" \
            --manifest "$MANIFEST"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          manifest=Path('debug/v167-single-song-calibration/contextual-guitar-recovery-sweep-manifest.json')
          m=json.loads(manifest.read_text())
          variants=m['variants']
          assert len(variants)==37,len(variants)
          assert sum(bool(v['config'].get('baseline',False)) for v in variants)==1
          assert all(v['stream']=='combinedGuitar' for v in variants)
          assert all(int(v['counts']['bass'])==512 for v in variants)
          assert m['policy']['referenceRead'] is False
          assert m['policy']['scorerRead'] is False
          assert m['policy']['allVariantRulesPredeclaredBeforeScoring'] is True
          assert m['policy']['individualEventSelectionByReference'] is False
          assert m['policy']['bassNormalizedStreamFixedToIteration003'] is True
          root=Path('/tmp/v167-contextual-guitar-recovery-variants')
          for row in variants:
              p=root/row['relativePath']
              assert p.is_file()
              assert hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256'],row['id']
          adds=[int(v['summary']['added']) for v in variants]
          print('Manifest SHA256',hashlib.sha256(manifest.read_bytes()).hexdigest())
          print('Contextual additions min/max',min(adds),max(adds))
          PY
          chmod -R a-w "$VARIANT_ROOT"
          chmod a-w "$MANIFEST"

      - name: Grade complete frozen contextual variants
        shell: bash
        run: |
          set -euo pipefail
          python "$GRADER" \
            --variant-root "$VARIANT_ROOT" \
            --manifest "$MANIFEST" \
            --base "$BASE" \
            --reference "$REFERENCE" \
            --scorer-code "$SCORER" \
            --output "$OUTPUT"
          python - <<'PY'
          import json
          report=json.load(open('debug/v167-single-song-calibration/contextual-guitar-recovery-sweep.json'))
          assert report['selectionPolicy']['allVariantsFrozenBeforeReferenceRead'] is True
          assert report['selectionPolicy']['individualEventSelectionByReference'] is False
          assert report['selectionPolicy']['iteration004CreatedByThisSweep'] is False
          assert report['policy']['bassCoordinateIdentityVerifiedBeforeReferenceRead'] is True
          assert len(report['variants'])==37
          print('winner',json.dumps(report['winner'],sort_keys=True))
          print('nonbaseline beating I003',report['nonBaselineVariantsBeatingIteration003'])
          PY

      - name: Freeze contextual sweep report receipt and self-seal
        shell: bash
        run: |
          set -euo pipefail
          chmod u+w "$MANIFEST"
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          manifest=Path('debug/v167-single-song-calibration/contextual-guitar-recovery-sweep-manifest.json')
          output=Path('debug/v167-single-song-calibration/contextual-guitar-recovery-sweep.json')
          receipt=Path('debug/v167-single-song-calibration/contextual-guitar-recovery-sweep-receipt.json')
          report=json.loads(output.read_text())
          r={
            'schema':'dadrock.tabs.v167.contextual-guitar-recovery-sweep-receipt.v1',
            'version':'V167',
            'status':'CONTEXTUAL_GUITAR_RECOVERY_SWEEP_FROZEN',
            'classification':'SINGLE_SONG_TRAINING_CALIBRATION_ONLY',
            'workflowRunId':int(os.environ['GITHUB_RUN_ID']),
            'workflowRunNumber':int(os.environ['GITHUB_RUN_NUMBER']),
            'workflowRunAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'workflowHeadSha':os.environ['GITHUB_SHA'],
            'manifestSha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),
            'manifestGitBlob':subprocess.check_output(['git','hash-object',str(manifest)],text=True).strip(),
            'reportSha256':hashlib.sha256(output.read_bytes()).hexdigest(),
            'reportGitBlob':subprocess.check_output(['git','hash-object',str(output)],text=True).strip(),
            'inputs':{
              'iteration003GitBlob':'758f8762632e916306aed9b036a6483af9431dc0',
              'evidencePoolGitBlob':'aa7da3a55344b1418a291f30fab9ca55858fc094',
              'timebaseGitBlob':'abebae25801b7ddeb5b933977c4f4a918f7bf9ef',
              'referenceGitBlob':'2fbed60b543c0488934d8642c488aa06bf31bbf5',
              'scorerGitBlob':'9644e65719fbd361a9b39778ae9950c5e983e855',
            },
            'implementation':{
              'baseBuilderGitBlob':'24413d321f64bbfcce48812ceb85b4593dcfa80c',
              'contextualBuilderGitBlob':'23065c56b5b08d1d9d59fe37a01dfa95f6c6627d',
              'graderGitBlob':'adfd512f53e8839b295129c0768d484b5af09bc7',
            },
            'variantCounts':{'baseline':1,'contextual':36,'total':37},
            'winner':report['winner'],
            'nonBaselineVariantsBeatingIteration003':report['nonBaselineVariantsBeatingIteration003'],
            'policy':{
              'variantsFrozenBeforeReferenceRead':True,
              'individualEventSelectionByReference':False,
              'bassCoordinateIdentityVerifiedBeforeReferenceRead':True,
              'postScoreCandidateMutation':False,
              'iteration003Modified':False,
              'iteration004Created':False,
              'gpuCudaModalUsed':False,
              'mainOrProductionModified':False,
              'generalizationClaim':False,
            },
          }
          receipt.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          rm .github/workflows/v167-contextual-guitar-recovery-sweep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$MANIFEST" "$OUTPUT" "$RECEIPT" .github/workflows/v167-contextual-guitar-recovery-sweep.yml
          changed="$(git diff --cached --name-only)"
          if echo "$changed" | grep -Ev '^debug/v167-single-song-calibration/contextual-guitar-recovery-sweep(-manifest|-receipt)?\.json$|^\.github/workflows/v167-contextual-guitar-recovery-sweep\.yml$'; then
            echo 'Unexpected V167 contextual sweep path' >&2
            exit 1
          fi
          git commit -m "research: freeze V167 contextual Guitar recovery sweep [skip ci]"
          git push origin HEAD:"$BRANCH"
