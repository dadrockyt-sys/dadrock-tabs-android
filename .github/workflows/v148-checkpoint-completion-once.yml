name: V148 Checkpoint Completion Once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v148-checkpoint-completion-once.yml

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Append final V148 construction checkpoint and self-seal
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v143-contextual-prune-lobo"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "93e63ecdc99eb36f290caab7022996cafa6ec087"
          test "$(git rev-parse HEAD^^)" = "9ebb46556a4e13ae00faef4116b3a444801c7d8d"
          test "$(git hash-object docs/checkpoints/CURRENT_STATE.md)" = "2c550411b773fc2dd52ede046e0481076fbc952e"
          test "$(git hash-object debug/v148-singleton-only/import-path-recovery-complete-sentinel.json)" = "46389ac79a09c889202537d27036a651b550603f"
          test "$(sha256sum debug/v148-singleton-only/candidate/candidate.json | cut -d' ' -f1)" = "b45034e2a4dd10a3d7784e584fccdbc7e49667a5b93c9a77ea42f5562ae139bb"
          test "$(sha256sum debug/v148-singleton-only/candidate/construction-proof.json | cut -d' ' -f1)" = "688b77376b8aac6b27fe40b93f1f661b4e71cdd2d76f56ac7bfea3c5b15807a4"
          test "$(sha256sum debug/v148-singleton-only/candidate/pdf-event-fidelity.json | cut -d' ' -f1)" = "45cd279822835a1246c0f90bd8af9838ea9a4c72bb07e1fa7db50d8998bcaa46"
          test "$(sha256sum debug/v148-singleton-only/candidate/preservation-manifest.json | cut -d' ' -f1)" = "756dd9854d68839a7fce29e9964b45186c92c3346ea7ee29516c0762feedfbb3"
          test ! -e .github/workflows/v148-singleton-only-construct-once.yml
          test ! -e .github/workflows/v148-singleton-only-recovery-once.yml
          echo '' | base64 -d >> docs/checkpoints/CURRENT_STATE.md
          rm .github/workflows/v148-checkpoint-completion-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin v143-contextual-prune-lobo
          test "$(git rev-parse origin/v143-contextual-prune-lobo)" = "$GITHUB_SHA"
          git add docs/checkpoints/CURRENT_STATE.md .github/workflows/v148-checkpoint-completion-once.yml
          git commit -m "docs: checkpoint completed V148 singleton construction"
          git push origin HEAD:v143-contextual-prune-lobo
