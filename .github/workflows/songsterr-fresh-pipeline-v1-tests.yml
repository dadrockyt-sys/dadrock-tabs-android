name: Songsterr Fresh Pipeline V1 Tests

on:
  workflow_dispatch:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - 'songsterr_pipeline/**'
      - '.github/workflows/songsterr-fresh-pipeline-v1-tests.yml'

permissions:
  contents: read

concurrency:
  group: songsterr-fresh-pipeline-v1-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run isolated CPU-only tests
        working-directory: songsterr_pipeline
        run: npm test
