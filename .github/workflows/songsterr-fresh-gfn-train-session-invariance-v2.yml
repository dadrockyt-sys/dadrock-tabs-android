name: Songsterr Fresh GFN Train Session Invariance V2

on:
  workflow_dispatch:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - "scripts/songsterr-fresh/guitar_fretboard_notes_train_session_invariance_v2.py"
      - "scripts/songsterr-fresh/test_guitar_fretboard_notes_train_session_invariance_v2.py"
      - ".github/workflows/songsterr-fresh-gfn-train-session-invariance-v2.yml"

jobs:
  train-only-session-invariance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen study dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.1.3" "pyarrow==18.1.0" "soundfile==0.12.1"
      - name: Compile study and tests
        run: python -m py_compile scripts/songsterr-fresh/guitar_fretboard_notes_train_session_invariance_v2.py scripts/songsterr-fresh/test_guitar_fretboard_notes_train_session_invariance_v2.py
      - name: Run synthetic contract tests first
        run: python scripts/songsterr-fresh/test_guitar_fretboard_notes_train_session_invariance_v2.py
      - name: Run pinned train-only real-audio V2 study
        run: python scripts/songsterr-fresh/guitar_fretboard_notes_train_session_invariance_v2.py --output gfn-train-session-invariance-v2-result.json
      - name: Print frozen V2 metrics
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          path = Path("gfn-train-session-invariance-v2-result.json")
          result = json.loads(path.read_text())
          primary = result["evaluation"]["primary"]
          print(json.dumps({
              "datasetRevision": result["datasetRevision"],
              "datasetSplitAccessed": result["datasetSplitAccessed"],
              "reservedSplitsAccessed": result["reservedSplitsAccessed"],
              "reservedSourcesAccessed": result["reservedSourcesAccessed"],
              "observedSources": result["integrity"]["observedSources"],
              "trainParquetSha256": result["trainParquetSha256"],
              "featureContractId": result["featureContractId"],
              "normalizationContractId": result["normalizationContractId"],
              "directions": primary["directions"],
              "pooled": primary["pooled"],
              "absoluteDirectionalAccuracyGap": primary["absoluteDirectionalAccuracyGap"],
              "v1Comparison": primary["v1Comparison"],
              "resultSha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              "basicPitchAuthorized": result["basicPitchAuthorized"],
              "v6Authorized": result["v6Authorized"],
              "correctnessAuthorized": result["correctnessAuthorized"],
              "modelValidationComplete": result["modelValidationComplete"],
              "customerEligibleEvents": result["customerEligibleEvents"],
              "mayAdvanceDelivery": result["mayAdvanceDelivery"],
          }, sort_keys=True, indent=2))
          PY
      - name: Upload canonical V2 result
        uses: actions/upload-artifact@v4
        with:
          name: songsterr-fresh-gfn-train-session-invariance-v2
          path: gfn-train-session-invariance-v2-result.json
          if-no-files-found: error
          retention-days: 30
