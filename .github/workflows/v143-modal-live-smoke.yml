name: V143 Modal Live Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - v143-github-modal-smoke
    paths:
      - .github/workflows/v143-modal-live-smoke.yml

permissions:
  contents: read

concurrency:
  group: v143-modal-live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Check out frozen V143 integration branch
        uses: actions/checkout@v4
        with:
          ref: v143-ai-tab-production-integration
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Modal credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}" || { echo "MODAL_TOKEN_ID is not configured"; exit 1; }
          test -n "${MODAL_TOKEN_SECRET:-}" || { echo "MODAL_TOKEN_SECRET is not configured"; exit 1; }
          echo "Modal credentials are available to this workflow."

      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check "modal>=1.0,<2"

      - name: Run strict deployed V143 HTTP smoke
        run: python -m modal run analyzer/v143_modal_http_live_smoke.py
