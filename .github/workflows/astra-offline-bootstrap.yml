name: Astra offline pilot bootstrap

on:
  push:
    branches: [astra-work]
    paths:
      - '.github/workflows/astra-offline-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: astra-offline-pilot-bootstrap
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          ref: astra-work
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'

      - name: Reconstruct and verify offline bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .astra_bootstrap/part0 .astra_bootstrap/part1 .astra_bootstrap/part2 .astra_bootstrap/part3 .astra_bootstrap/part4 .astra_bootstrap/part5 > /tmp/astra_bundle.tgz
          echo '4f16f4326bb6dbcd1577689b600e00e69767d71afeec2747a0309ab78ff683b1  /tmp/astra_bundle.tgz' | sha256sum -c -
          tar -tzf /tmp/astra_bundle.tgz | sort
          tar -xzf /tmp/astra_bundle.tgz -C .
          rm -f .github/workflows/astra-tiny-fit-pilot-real.yml .github/workflows/astra-tiny-fit-pilot-synthetic.yml
          rm -rf .astra_bootstrap
          python -m py_compile             astra_backend/evaluation/prepared_event_adapter_v1.py             astra_backend/evaluation/test_prepared_event_adapter_v1.py             astra_backend/evaluation/test_tiny_fit_pilot_v1.py             astra_backend/tiny_fit_pilot_v1.py             astra_backend/tiny_fit_pilot_verify_synthetic_v1.py
          PYTHONPATH=astra_backend:astra_backend/evaluation             python -m unittest -v astra_backend.evaluation.test_prepared_event_adapter_v1
          python - <<'PY'
          import json
          x=json.load(open('docs/astra/TINY_FIT_PILOT_DESIGN_V1.json'))
          assert x['guards']['realP1TrainingAuthorized'] is False
          assert x['guards']['realOptimizerStepsAuthorized'] == 0
          assert x['guards']['p2Opened'] is False
          assert x['guards']['p3Opened'] is False
          assert x['budget']['automaticFullTraining'] is False
          PY

      - name: Commit staged offline implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'feat(astra): stage event-preserving capped pilot sources [skip ci]'
          git push origin HEAD:astra-work
