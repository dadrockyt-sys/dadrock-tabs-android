name: V143 Repaired Timing Precision Candidate Product

on:
  workflow_dispatch:
    inputs:
      paid_capture_authorized:
        description: 'Explicitly authorize one Modal/L4 carrier capture'
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'YES'

concurrency:
  group: v143-precision-v2-paid-capture
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TARGET_BRANCH: v143-contextual-prune-lobo
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Explicit paid-capture authorization and one-shot lock gate
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.paid_capture_authorized }}' = 'YES'
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$GITHUB_SHA"
          lock='debug/v143-contextual-prune/precision-v2-capture-lock.json'
          if test -f "$lock"; then
            echo 'A precision-v2 capture attempt is already reserved or completed. Refusing another Modal run.' >&2
            cat "$lock" >&2
            exit 1
          fi
      - name: Safety and anti-leakage gate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            analyzer/v143_repaired_timing_precision_candidate_product_modal.py \
            analyzer/v143_contextual_prune_precision_shadow_v2.py \
            analyzer/check_v143_precision_shadow_v2_policy.py \
            analyzer/v143_precision_replay_policy_compare.py \
            analyzer/check_v143_demucs_cpu_dispatch_controls.py \
            analyzer/check_v143_precision_capture_readiness.py
          PYTHONPATH=analyzer python analyzer/check_v143_precision_shadow_v2_policy.py
          python analyzer/v143_precision_replay_policy_compare.py --self-test
          PYTHONPATH=analyzer python analyzer/check_v143_demucs_cpu_dispatch_controls.py
          python analyzer/check_v143_precision_capture_readiness.py
          test "$(sha256sum public/gomywayfullaitest.m4a | awk '{print $1}')" = '215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f'
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = '7f72f8ed9b14af8bc93e95544195204d99c6bec1'
          test -f debug/v143-contextual-prune/repaired-timing-precision-single-pass-smoke.json
          test -f debug/v143-contextual-prune/repaired-timing-precision-cold-exact-proof.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('debug/v143-contextual-prune/repaired-timing-precision-cold-exact-proof.json')
          d=json.loads(p.read_text())
          if d.get('passed') is not True or d.get('productionModified') is not False or d.get('protectedPipelineUnchanged') is not True:
              raise SystemExit('combined cold exact proof is not green')
          PY
          if grep -E -n 'Professionalexample|professional-rhythm-complete|rhythm-professional-holdout-score|Songsterr|Are You Gonna Go My Way|Lenny Kravitz|Craig Ross' \
            analyzer/v143_repaired_timing_precision_candidate_product_modal.py \
            analyzer/v143_contextual_prune_precision_shadow_v2.py \
            analyzer/check_v143_precision_shadow_v2_policy.py \
            analyzer/v143_precision_replay_policy_compare.py \
            analyzer/v143_contextual_prune_precision_candidate_events.py \
            analyzer/v143_seeded_separator.py \
            analyzer/v143_seeded_audio_separator_cli.py; then
            echo 'Forbidden scorer/source token in candidate product path' >&2
            exit 1
          fi
      - name: Reserve the one-shot capture before Modal
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$GITHUB_SHA"
          lock='debug/v143-contextual-prune/precision-v2-capture-lock.json'
          test ! -e "$lock"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          lock = {
              'schemaVersion': 2,
              'locked': True,
              'captureState': 'reserved_before_modal',
              'captureAuthorizationReserved': True,
              'singlePaidCaptureConsumed': False,
              'automaticRetryAllowed': False,
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'triggerSha': os.environ['GITHUB_SHA'],
              'targetBranch': os.environ['TARGET_BRANCH'],
              'approvedAudioSha256': '215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f',
              'protectedPipelineBlob': '7f72f8ed9b14af8bc93e95544195204d99c6bec1',
              'professionalReferenceUsed': False,
              'productionModified': False,
          }
          Path('debug/v143-contextual-prune/precision-v2-capture-lock.json').write_text(
              json.dumps(lock, indent=2, sort_keys=True) + '\n'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$lock"
          git commit -m 'chore: reserve one-shot precision v2 capture'
          git push origin "HEAD:$TARGET_BRANCH"
      - name: Run exactly one approved-audio candidate capture
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet modal
          python -m modal run analyzer/v143_repaired_timing_precision_candidate_product_modal.py::approved_audio \
            --audio-path public/gomywayfullaitest.m4a \
            --output-path debug/v143-contextual-prune/repaired-timing-precision-candidate-product.json
      - name: Validate candidate invariants and replay evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import math
          import subprocess
          from pathlib import Path

          path = Path('debug/v143-contextual-prune/repaired-timing-precision-candidate-product.json')
          data = json.loads(path.read_text())
          candidate = data.get('candidate') or {}
          assembly = data.get('assembly') or {}
          timing = data.get('timing') or {}
          live = data.get('liveV143') or {}
          policy = data.get('precisionPolicy') or {}
          precision = data.get('precisionDiagnostics') or {}
          replay = data.get('precisionReplayEvidence') or {}
          failures = []
          required_true = {
              'candidate.approvedFixture': candidate.get('approvedFixture'),
              'candidate.measureRangeDerivedFromAudio': candidate.get('measureRangeDerivedFromAudio'),
              'candidate.repairedIntervalOutliersZero': candidate.get('repairedIntervalOutliersZero'),
              'assembly.referenceFree': assembly.get('referenceFree'),
              'live.referenceFree': live.get('referenceFree'),
              'timing.measureRangeDerivedFromAudio': timing.get('measureRangeDerivedFromAudio'),
              'replay.referenceFree': replay.get('referenceFree'),
          }
          for key, value in required_true.items():
              if value is not True:
                  failures.append(f'{key}!=true')
          required_false = {
              'candidate.tempoChangedByRepair': candidate.get('tempoChangedByRepair'),
              'candidate.barPhaseChangedByRepair': candidate.get('barPhaseChangedByRepair'),
              'candidate.protectedLivePipelineModified': candidate.get('protectedLivePipelineModified'),
              'candidate.liveEndpointDeployedOrModified': candidate.get('liveEndpointDeployedOrModified'),
              'candidate.productionModified': candidate.get('productionModified'),
              'candidate.professionalReferenceUsed': candidate.get('professionalReferenceUsed'),
              'candidate.runtimeLabelsRequired': candidate.get('runtimeLabelsRequired'),
              'candidate.addsUnobservedAttack': candidate.get('addsUnobservedAttack'),
              'candidate.addsUnobservedPitch': candidate.get('addsUnobservedPitch'),
              'candidate.relocatesAttack': candidate.get('relocatesAttack'),
              'assembly.candidateRelocatesEvents': assembly.get('candidateRelocatesEvents'),
              'assembly.professionalReferenceUsed': assembly.get('professionalReferenceUsed'),
              'assembly.runtimeLabelsRequired': assembly.get('runtimeLabelsRequired'),
              'live.professionalReferenceUsed': live.get('professionalReferenceUsed'),
              'live.referenceRuntimeInputUsed': live.get('referenceRuntimeInputUsed'),
              'live.runtimeLabelsRequired': live.get('runtimeLabelsRequired'),
              'replay.professionalReferenceUsed': replay.get('professionalReferenceUsed'),
              'replay.runtimeLabelsRequired': replay.get('runtimeLabelsRequired'),
              'replay.productionModified': replay.get('productionModified'),
              'replay.candidateAddsUnobservedAttack': replay.get('candidateAddsUnobservedAttack'),
              'replay.candidateAddsUnobservedPitch': replay.get('candidateAddsUnobservedPitch'),
              'policy.professionalReferenceUsed': policy.get('professionalReferenceUsed'),
              'policy.newNumericThresholdIntroduced': policy.get('newNumericThresholdIntroduced'),
          }
          for key, value in required_false.items():
              if value is not False:
                  failures.append(f'{key}!=false')
          if candidate.get('sourceSha256') != '215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f':
              failures.append('candidate.sourceSha256')
          if policy.get('name') != 'envelope-balanced-secondary-v2':
              failures.append('precisionPolicy.name')
          if int(data.get('audioDerivedMeasureCount') or 0) <= 0:
              failures.append('audioDerivedMeasureCount')
          if int(data.get('selectedCount') or 0) <= 0:
              failures.append('selectedCount')
          if int(data.get('noteCount') or 0) <= 0:
              failures.append('noteCount')

          replay_attacks = replay.get('attacks') or []
          replay_attack_count = int(replay.get('retainedAttackCount') or -1)
          replay_pitch_count = int(replay.get('originalPitchHypothesisCount') or -1)
          precision_attack_count = int(precision.get('retainedAttackCount') or -2)
          precision_original_pitch_count = int(precision.get('originalPitchHypothesisCount') or -2)
          precision_retained_pitch_count = int(precision.get('retainedPitchHypothesisCount') or -2)
          if replay_attack_count != precision_attack_count or replay_attack_count != len(replay_attacks):
              failures.append('replay.retainedAttackCount')
          if replay_pitch_count != precision_original_pitch_count:
              failures.append('replay.originalPitchHypothesisCount')

          seen_attack_keys = set()
          replay_candidate_total = 0
          replay_selected_total = 0
          for attack in replay_attacks:
              key = (int(attack.get('measure') or 0), int(attack.get('step') or -1))
              if key in seen_attack_keys:
                  failures.append(f'replay.duplicateAttack:{key}')
              seen_attack_keys.add(key)
              midis = [int(value) for value in (attack.get('candidateMidis') or [])]
              candidates = attack.get('candidates') or []
              candidate_midis = [int(item.get('midi')) for item in candidates]
              if midis != candidate_midis or len(midis) != len(set(midis)):
                  failures.append(f'replay.candidateIdentity:{key}')
              primaries = [item for item in candidates if item.get('primary') is True]
              if len(primaries) != 1 or primaries[0].get('selected') is not True:
                  failures.append(f'replay.primaryIdentity:{key}')
              for item in candidates:
                  for field in ('attack','early','sustain','body','continuity','score'):
                      try:
                          value = float(item[field])
                      except (KeyError, TypeError, ValueError):
                          failures.append(f'replay.{field}:{key}')
                          continue
                      if not math.isfinite(value):
                          failures.append(f'replay.nonFinite{field}:{key}')
                  replay_selected_total += int(item.get('selected') is True)
              replay_candidate_total += len(candidates)
          if replay_candidate_total != replay_pitch_count:
              failures.append('replay.candidateTotal')
          if replay_selected_total != precision_retained_pitch_count:
              failures.append('replay.selectedTotal')

          protected = subprocess.check_output(['git','hash-object','analyzer/v143_reference_free_rhythm_pipeline.py'], text=True).strip()
          if protected != '7f72f8ed9b14af8bc93e95544195204d99c6bec1':
              failures.append('protectedPipelineBlob')
          canonical_events = json.dumps(data.get('events') or [], sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False).encode('utf-8')
          canonical_replay = json.dumps(replay, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False).encode('utf-8')
          data['preFreezeTrace'] = {
              'runId': int('${{ github.run_id }}'),
              'triggerSha': '${{ github.sha }}',
              'eventsSha256': hashlib.sha256(canonical_events).hexdigest(),
              'replayEvidenceSha256': hashlib.sha256(canonical_replay).hexdigest(),
              'eventCount': len(data.get('events') or []),
              'replayAttackCount': replay_attack_count,
              'replayOriginalPitchHypothesisCount': replay_pitch_count,
              'protectedPipelineBlob': protected,
              'protectedPipelineUnchanged': protected == '7f72f8ed9b14af8bc93e95544195204d99c6bec1',
              'productionModified': False,
              'validationFailures': failures,
              'passed': not failures,
          }
          path.write_text(json.dumps(data, indent=2, allow_nan=False) + '\n')
          if failures:
              raise SystemExit('candidate product invariant failure: ' + str(failures))
          PY
      - name: Build CPU replay policy comparison
        shell: bash
        run: |
          set -euo pipefail
          python analyzer/v143_precision_replay_policy_compare.py \
            --input debug/v143-contextual-prune/repaired-timing-precision-candidate-product.json \
            --output debug/v143-contextual-prune/precision-v2-replay-policy-compare.json
      - name: Finalize one-shot capture lock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          product_path = Path('debug/v143-contextual-prune/repaired-timing-precision-candidate-product.json')
          compare_path = Path('debug/v143-contextual-prune/precision-v2-replay-policy-compare.json')
          lock_path = Path('debug/v143-contextual-prune/precision-v2-capture-lock.json')
          product = json.loads(product_path.read_text())
          trace = product.get('preFreezeTrace') or {}
          candidate = product.get('candidate') or {}
          policy = product.get('precisionPolicy') or {}
          lock = json.loads(lock_path.read_text())
          if lock.get('captureState') != 'reserved_before_modal':
              raise SystemExit('capture lock was not reserved before Modal')
          if int(lock.get('runId') or -1) != int(os.environ['GITHUB_RUN_ID']):
              raise SystemExit('capture lock runId mismatch')
          if str(lock.get('triggerSha') or '') != os.environ['GITHUB_SHA']:
              raise SystemExit('capture lock triggerSha mismatch')
          if trace.get('passed') is not True:
              raise SystemExit('cannot finalize a failed capture')
          lock.update({
              'captureState': 'completed',
              'singlePaidCaptureConsumed': True,
              'automaticRetryAllowed': False,
              'approvedAudioSha256': str(candidate['sourceSha256']),
              'policy': str(policy['name']),
              'eventsSha256': str(trace['eventsSha256']),
              'replayEvidenceSha256': str(trace['replayEvidenceSha256']),
              'replayAttackCount': int(trace['replayAttackCount']),
              'replayOriginalPitchHypothesisCount': int(trace['replayOriginalPitchHypothesisCount']),
              'candidateProductSha256': hashlib.sha256(product_path.read_bytes()).hexdigest(),
              'replayPolicyCompareSha256': hashlib.sha256(compare_path.read_bytes()).hexdigest(),
              'professionalReferenceUsed': False,
              'productionModified': False,
          })
          lock_path.write_text(json.dumps(lock, indent=2, sort_keys=True) + '\n')
          PY
      - name: Commit pre-freeze candidate diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git add \
            debug/v143-contextual-prune/repaired-timing-precision-candidate-product.json \
            debug/v143-contextual-prune/precision-v2-replay-policy-compare.json \
            debug/v143-contextual-prune/precision-v2-capture-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record single repaired-timing precision v2 capture with replay evidence'
          for attempt in 1 2 3 4; do
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH" && git push origin "HEAD:$TARGET_BRANCH" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
      - name: Preserve one-shot capture outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-precision-v2-one-shot-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            debug/v143-contextual-prune/repaired-timing-precision-candidate-product.json
            debug/v143-contextual-prune/precision-v2-replay-policy-compare.json
            debug/v143-contextual-prune/precision-v2-capture-lock.json
