name: V148 Singleton Only Recovery Once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v148-singleton-only-recovery-once.yml

permissions:
  contents: write

concurrency:
  group: v148-singleton-only-recovery-once
  cancel-in-progress: false

jobs:
  recover-v148-singleton-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact recovery arming revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Verify frozen recovery boundary and import path before consumption
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v143-contextual-prune-lobo"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object docs/checkpoints/CURRENT_STATE.md)" = "2c550411b773fc2dd52ede046e0481076fbc952e"
          test "$(git hash-object debug/v148-singleton-only/construction-attempt-sentinel.json)" = "52321ef300e7c54ea10d91b9ef98e6f287215f03"
          test "$(git hash-object debug/v148-singleton-only/import-path-recovery-attempt-sentinel.json)" = "7f4b745f539be9eb4856828ac7949e1c6c7c08fc"
          test "$(git hash-object debug/v148-singleton-only/import-path-recovery-preregistration.json)" = "c5825e8a345a52c2aa15f38527334d24eef409af"
          test "$(git hash-object validation/v148_singleton_only/recover_import_path_once.py)" = "0bc6ab8795539eaab084cae5e60680ac0a2cba66"
          test "$(git hash-object validation/v148_singleton_only/construct_once.py)" = "bb43464f48cc8e0eade0f9e98229c859cb117986"
          test "$(git hash-object debug/v148-singleton-only/phase-a-hypothesis-preregistration.json)" = "fd3fb330d3aa80d1058656e3b2dd7eaa201f8e1c"
          test "$(git hash-object debug/v148-singleton-only/construction-authorization.json)" = "006f719c8c71570142cf6990c7542f3d8692d5e4"
          test "$(git hash-object modal/v147_phase_c_artifact_support.py)" = "f4278ffaacaca3f66baf7a3112e2af0f3bc387cf"
          test "$(git hash-object validation/rhythm_holdout/canonical.py)" = "088d44827fb23e20d9aeeb4944a672989af5846c"
          test "$(git hash-object lib/v143RenderContract.js)" = "ccbb93c48982798cc474309fd981f6ca02d5c8d4"
          test ! -e debug/v148-singleton-only/candidate
          test -f .github/workflows/v148-singleton-only-construct-once.yml
          python - <<'PY'
          import json
          from pathlib import Path
          old = json.loads(Path('debug/v148-singleton-only/construction-attempt-sentinel.json').read_text())
          if old.get('status') != 'CONSUMED_BEFORE_CONSTRUCTION':
              raise SystemExit('original attempt sentinel status drifted')
          if old.get('consumedByRunId') != '33043698461':
              raise SystemExit('original failed run identity drifted')
          if old.get('completionPersisted') is not False:
              raise SystemExit('original attempt unexpectedly persisted a candidate')
          recovery = json.loads(Path('debug/v148-singleton-only/import-path-recovery-attempt-sentinel.json').read_text())
          if recovery.get('status') != 'ARMED_NOT_CONSUMED':
              raise SystemExit('recovery attempt is not armed')
          if recovery.get('priorCandidateCountConstructed') != 0:
              raise SystemExit('prior candidate count must be zero')
          if recovery.get('maximumCandidateCountAcrossOriginalAndRecovery') != 1:
              raise SystemExit('maximum total candidate count drifted')
          if recovery.get('referenceFacingScoreCountAllowed') != 0:
              raise SystemExit('reference-facing scoring must remain forbidden')
          PY
          python validation/v148_singleton_only/recover_import_path_once.py --help >/dev/null
          git fetch origin v143-contextual-prune-lobo
          test "$(git rev-parse origin/v143-contextual-prune-lobo)" = "$GITHUB_SHA"

      - name: Consume recovery attempt before construction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('debug/v148-singleton-only/import-path-recovery-attempt-sentinel.json')
          payload = json.loads(path.read_text())
          if payload.get('status') != 'ARMED_NOT_CONSUMED':
              raise SystemExit('recovery attempt already consumed')
          payload['status'] = 'CONSUMED_BEFORE_RECOVERY_CONSTRUCTION'
          payload['consumedByRunId'] = os.environ['GITHUB_RUN_ID']
          payload['consumedAtUtc'] = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          payload['recoveryArmingCommit'] = os.environ['GITHUB_SHA']
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/v148-singleton-only/import-path-recovery-attempt-sentinel.json
          git commit -m "debug: consume V148 import-path recovery attempt"
          git push origin HEAD:v143-contextual-prune-lobo
          echo "RECOVERY_CONSUMED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Make forbidden reference and audio inputs unreadable
        shell: bash
        run: |
          set -euo pipefail
          for dir in validation/rhythm_holdout/reference debug/v144-rhythm-calibration/reference; do
            if test -d "$dir"; then
              find "$dir" -type f -exec chmod 000 {} +
            fi
          done
          for file in public/Professionalexample.jpg public/gomywayfullaitest.m4a; do
            if test -f "$file"; then
              chmod 000 "$file"
            fi
          done

      - name: Construct the one frozen V148 candidate through recovery launcher
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile validation/v148_singleton_only/recover_import_path_once.py validation/v148_singleton_only/construct_once.py
          python validation/v148_singleton_only/recover_import_path_once.py \
            --output-dir debug/v148-singleton-only/candidate \
            2>&1 | tee debug/v148-singleton-only/recovery-construction-output.txt
          grep -Fq '"gate":"GO"' debug/v148-singleton-only/recovery-construction-output.txt

      - name: Verify recovered construction gates and output identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('debug/v148-singleton-only/candidate')
          proof = json.loads((root / 'construction-proof.json').read_text())
          fidelity = json.loads((root / 'pdf-event-fidelity.json').read_text())
          manifest = json.loads((root / 'preservation-manifest.json').read_text())
          metrics = proof.get('metrics') or {}
          required = {
              'gate': 'GO',
              'deterministic': True,
              'pdfEventFidelity': 1.0,
              'candidateVariantsConstructed': 1,
              'referenceRead': False,
              'goldRead': False,
              'professionalImageRead': False,
              'calibrationScoreRun': False,
              'audioRead': False,
              'hpssOrCqtRecomputed': False,
              'candidateSearchRun': False,
              'thresholdRetuningRun': False,
              'modalGpuUsed': False,
              'productionIntegrated': False,
              'automaticPromotion': False,
          }
          for key, expected in required.items():
              if proof.get(key) != expected:
                  raise SystemExit(f'unsafe or failed proof gate {key}={proof.get(key)!r}')
          expected_metrics = {
              'eventCount': 1144,
              'generatedMeasureCount': 113,
              'acceptedOnsetCount': 844,
              'changedEventCountVersusAccepted': 106,
              'changedOnsetCountVersusAccepted': 106,
              'polyphonicChangedEventsVersusAccepted': 0,
              'timingMetadataInvariantViolations': 0,
              'positionIdentityViolations': 0,
          }
          for key, expected in expected_metrics.items():
              if metrics.get(key) != expected:
                  raise SystemExit(f'failed metric {key}={metrics.get(key)!r}, expected {expected!r}')
          if metrics.get('allChangedOnsetsAcceptedCardinalityOne') is not True:
              raise SystemExit('singleton-cardinality gate failed')
          if metrics.get('changedSingletonRowsExactlyV147') is not True:
              raise SystemExit('preserved V147 row identity gate failed')
          if fidelity.get('passed') is not True or fidelity.get('pdfEventFidelity') != 1.0:
              raise SystemExit('PDF event fidelity gate failed')
          if manifest.get('referenceFacingScoringAuthorized') is not False:
              raise SystemExit('manifest unexpectedly authorizes scoring')
          identities = {}
          for name in ('candidate.json', 'construction-proof.json', 'pdf-event-fidelity.json', 'preservation-manifest.json'):
              raw = (root / name).read_bytes()
              identities[name] = {'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
          Path('debug/v148-singleton-only/recovery-output-identities.json').write_text(
              json.dumps(identities, indent=2, sort_keys=True) + '\n'
          )
          print('V148_RECOVERY_OUTPUT_IDENTITIES=' + json.dumps(identities, sort_keys=True, separators=(',', ':')))
          PY

      - name: Persist result and self-seal both construction workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          candidate_root = Path('debug/v148-singleton-only/candidate')
          proof = json.loads((candidate_root / 'construction-proof.json').read_text())
          identities = json.loads(Path('debug/v148-singleton-only/recovery-output-identities.json').read_text())
          sentinel_path = Path('debug/v148-singleton-only/import-path-recovery-attempt-sentinel.json')
          sentinel = json.loads(sentinel_path.read_text())
          if sentinel.get('status') != 'CONSUMED_BEFORE_RECOVERY_CONSTRUCTION':
              raise SystemExit('recovery sentinel was not consumed before construction')
          sentinel['status'] = 'COMPLETED_AND_SEALED'
          sentinel['completionPersisted'] = True
          sentinel['completedAtUtc'] = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          sentinel['candidateEventSha256'] = proof['candidate']['eventSha256']
          sentinel_path.write_text(json.dumps(sentinel, indent=2, sort_keys=True) + '\n')
          completion = {
              'schema': 'dadrock.tabs.v148.singleton-only-import-path-recovery-completion.v1',
              'status': 'COMPLETE_SEALED_STOP_BEFORE_SCORING',
              'originalFailedRunId': '33043698461',
              'originalFailedJobId': '98422759855',
              'priorCandidateCountConstructed': 0,
              'recoveryRunId': os.environ['GITHUB_RUN_ID'],
              'recoveryArmingCommit': os.environ['GITHUB_SHA'],
              'recoveryConsumedSentinelCommit': os.environ['RECOVERY_CONSUMED_SHA'],
              'recoveryPreregistrationGitBlob': 'c5825e8a345a52c2aa15f38527334d24eef409af',
              'recoveryLauncherGitBlob': '0bc6ab8795539eaab084cae5e60680ac0a2cba66',
              'frozenConstructorGitBlob': 'bb43464f48cc8e0eade0f9e98229c859cb117986',
              'candidateEventSha256': proof['candidate']['eventSha256'],
              'eventCount': proof['candidate']['eventCount'],
              'generatedMeasureCount': proof['candidate']['generatedMeasureCount'],
              'changedEvents': proof['metrics']['changedEventCountVersusAccepted'],
              'changedOnsets': proof['metrics']['changedOnsetCountVersusAccepted'],
              'polyphonicChangedEvents': proof['metrics']['polyphonicChangedEventsVersusAccepted'],
              'deterministic': proof['deterministic'],
              'pdfEventFidelity': proof['pdfEventFidelity'],
              'totalV148CandidatesConstructedAcrossOriginalAndRecoveryRuns': 1,
              'outputIdentities': identities,
              'referenceFacingScoringAuthorization': False,
              'goldOrReferenceRead': False,
              'audioRead': False,
              'modalGpuUsed': False,
              'productionIntegrated': False,
              'automaticPromotion': False,
          }
          Path('debug/v148-singleton-only/import-path-recovery-complete-sentinel.json').write_text(
              json.dumps(completion, indent=2, sort_keys=True) + '\n'
          )
          PY
          rm .github/workflows/v148-singleton-only-construct-once.yml
          rm .github/workflows/v148-singleton-only-recovery-once.yml
          git fetch origin v143-contextual-prune-lobo
          test "$(git rev-parse origin/v143-contextual-prune-lobo)" = "$RECOVERY_CONSUMED_SHA"
          git add \
            debug/v148-singleton-only/candidate \
            debug/v148-singleton-only/recovery-construction-output.txt \
            debug/v148-singleton-only/recovery-output-identities.json \
            debug/v148-singleton-only/import-path-recovery-attempt-sentinel.json \
            debug/v148-singleton-only/import-path-recovery-complete-sentinel.json \
            .github/workflows/v148-singleton-only-construct-once.yml \
            .github/workflows/v148-singleton-only-recovery-once.yml
          git commit -m "debug: persist and seal recovered V148 singleton candidate"
          git push origin HEAD:v143-contextual-prune-lobo
