name: V154 resume checkpoint writer once

on:
  push:
    branches:
      - v143-contextual-prune-lobo

permissions:
  contents: write

jobs:
  checkpoint:
    if: github.event.head_commit.message == 'ci: arm V154 resume checkpoint writer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0
      - name: Append resume checkpoint
        shell: bash
        run: |
          cat >> docs/checkpoints/CURRENT_STATE.md <<'EOF'

