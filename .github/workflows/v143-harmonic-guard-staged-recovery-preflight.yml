name: V143 Harmonic Guard Staged Recovery Preflight

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - analyzer/v143_harmonic_guard_staged_recovery_modal.py
      - analyzer/check_v143_harmonic_guard_staged_recovery.py
      - .github/workflows/v143-harmonic-guard-staged-recovery-preflight.yml
      - debug/v143-contextual-prune/RUN_HARMONIC_GUARD_STAGED_RECOVERY_PREFLIGHT_ONCE

permissions:
  contents: write

concurrency:
  group: v143-harmonic-guard-staged-recovery-preflight
  cancel-in-progress: false

jobs:
  prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile and prove staged recovery without Modal execution
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            analyzer/v143_harmonic_guard_staged_recovery_modal.py \
            analyzer/check_v143_harmonic_guard_staged_recovery.py
          python analyzer/check_v143_harmonic_guard_staged_recovery.py
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = '7f72f8ed9b14af8bc93e95544195204d99c6bec1'
          test "$(sha256sum public/gomywayfullaitest.m4a | awk '{print $1}')" = '215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f'
          if grep -E -n 'Professionalexample|professional-rhythm-complete|rhythm-professional-holdout-score|Songsterr|Are You Gonna Go My Way|Lenny Kravitz|Craig Ross' \
            analyzer/v143_harmonic_guard_staged_recovery_modal.py \
            analyzer/check_v143_harmonic_guard_staged_recovery.py; then
            echo 'Forbidden scorer/source token in staged recovery path' >&2
            exit 31
          fi

      - name: Commit zero-Modal preflight proof
        shell: bash
        run: |
          set -euo pipefail
          git add -- debug/v143-contextual-prune/harmonic-guard-staged-recovery-preflight.json
          if test -f debug/v143-contextual-prune/RUN_HARMONIC_GUARD_STAGED_RECOVERY_PREFLIGHT_ONCE; then
            git rm -- debug/v143-contextual-prune/RUN_HARMONIC_GUARD_STAGED_RECOVERY_PREFLIGHT_ONCE
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record staged harmonic guard recovery preflight'
          for attempt in 1 2 3 4; do
            git fetch origin v143-contextual-prune-lobo
            git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
