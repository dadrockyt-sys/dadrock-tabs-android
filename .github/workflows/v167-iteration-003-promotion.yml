name: V167 deterministic Iteration 003 Bass promotion

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v167-iteration-003-promotion.yml

permissions:
  contents: write

concurrency:
  group: v167-iteration-003-promotion-once
  cancel-in-progress: false

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: 5e436ff4fd0178f0fd5cf959ee2b2923e27d7f2f
  BASE: debug/v167-single-song-calibration/iteration-002-generated.json
  POOL: debug/v167-single-song-calibration/nearmiss-evidence-pool.json
  TIMEBASE: debug/v166-cpu-autonomous/timebase.json
  MANIFEST: debug/v167-single-song-calibration/upstream-recovery-rule-sweep-manifest.json
  REPORT: debug/v167-single-song-calibration/upstream-recovery-rule-sweep.json
  BASE_BUILDER: validation/v167_single_song_calibration/build_upstream_recovery_variants_v167.py
  REARM_BUILDER: validation/v167_single_song_calibration/build_upstream_recovery_variants_v167_rearm.py
  PROMOTER: validation/v167_single_song_calibration/promote_upstream_recovery_winner_v167.py
  OUTPUT: debug/v167-single-song-calibration/iteration-003-generated.json
  PROOF: debug/v167-single-song-calibration/iteration-003-promotion-proof.json
  RECEIPT: debug/v167-single-song-calibration/iteration-003-promotion-receipt.json
  CUDA_VISIBLE_DEVICES: ""
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  promote-once:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Iteration 003 arm
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.21'

      - name: Verify frozen promotion boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v167-iteration-003-promotion.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"
          test "$(git hash-object "$BASE")" = "7eba73700116ceeca580a8851abe399aed764834"
          test "$(git hash-object "$POOL")" = "aa7da3a55344b1418a291f30fab9ca55858fc094"
          test "$(git hash-object "$TIMEBASE")" = "abebae25801b7ddeb5b933977c4f4a918f7bf9ef"
          test "$(git hash-object "$MANIFEST")" = "0ee153dbf1004d921c586516bca91e52f7bb1fde"
          test "$(git hash-object "$REPORT")" = "324f1f4e68951ac8653c51c8a436e4d35e5dc16b"
          test "$(git hash-object "$BASE_BUILDER")" = "24413d321f64bbfcce48812ceb85b4593dcfa80c"
          test "$(git hash-object "$REARM_BUILDER")" = "fbbee07493084792912c774d375ca5011672891f"
          test "$(git hash-object "$PROMOTER")" = "9c63f2a0c4732cf3c3a11faf028cf0952c27664e"
          test "$(git hash-object docs/checkpoints/CURRENT_STATE.md)" = "e3cfd3d886629f68a78bc303a0593d793e484d14"
          test ! -e "$OUTPUT"
          test ! -e "$PROOF"
          test ! -e "$RECEIPT"
          python -m py_compile "$BASE_BUILDER" "$REARM_BUILDER" "$PROMOTER"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          checks={
            'debug/v167-single-song-calibration/iteration-002-generated.json':'96fbc329d9ba46b06d430c7c3c7b7f5b0e9077f6e133da5c3165c1fde609b5cc',
            'debug/v167-single-song-calibration/nearmiss-evidence-pool.json':'1c983784c2d12a22437a80387525789bcf55a2f4e4a5c7a96608c575bf709673',
            'debug/v167-single-song-calibration/upstream-recovery-rule-sweep-manifest.json':'c91ee15d702746e082c059b5f99c44fcfa7a89f18e5e9f2fc81eb6513d1baa80',
            'debug/v167-single-song-calibration/upstream-recovery-rule-sweep.json':'1bcc5eca05df31270ff7ff638cca6def3166a0e5084c4874d70d710d4696836f',
          }
          for path,expected in checks.items():
              actual=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert actual==expected,(path,actual,expected)
          promoter=Path('validation/v167_single_song_calibration/promote_upstream_recovery_winner_v167.py').read_text()
          for forbidden in ('frontend-reference-payload.json','score_frontend_reference.py'):
              assert forbidden not in promoter,forbidden
          PY

      - name: Promote frozen Bass winner without new reference score
        shell: bash
        run: |
          set -euo pipefail
          python "$PROMOTER" \
            --base "$BASE" \
            --pool "$POOL" \
            --timebase "$TIMEBASE" \
            --manifest "$MANIFEST" \
            --report "$REPORT" \
            --base-builder "$BASE_BUILDER" \
            --rearm-builder "$REARM_BUILDER" \
            --output "$OUTPUT" \
            --proof "$PROOF" \
            --base-blob "7eba73700116ceeca580a8851abe399aed764834" \
            --pool-blob "aa7da3a55344b1418a291f30fab9ca55858fc094" \
            --timebase-blob "abebae25801b7ddeb5b933977c4f4a918f7bf9ef" \
            --manifest-blob "0ee153dbf1004d921c586516bca91e52f7bb1fde" \
            --report-blob "324f1f4e68951ac8653c51c8a436e4d35e5dc16b"
          python - <<'PY'
          import json
          proof=json.load(open('debug/v167-single-song-calibration/iteration-003-promotion-proof.json'))
          assert proof['status']=='ITERATION_003_NORMALIZED_STREAM_EQUALITY_PROVEN'
          assert proof['selectedWinner']['frozenCandidateSha256']=='2e04edd9cb61795ea9679ce899c7ded9549bb0f5d9f8e04a5d53fdf07ec9fa13'
          assert proof['selectedWinner']['reconstructedCandidateSha256']=='2e04edd9cb61795ea9679ce899c7ded9549bb0f5d9f8e04a5d53fdf07ec9fa13'
          assert proof['streamProof']['combinedGuitar']['iteration003Count']==1050
          assert proof['streamProof']['combinedGuitar']['parentRichListExactlyPreserved'] is True
          assert proof['streamProof']['combinedGuitar']['normalizedEqualFrozenScoredWinner'] is True
          assert proof['streamProof']['bass']['parentCount']==402
          assert proof['streamProof']['bass']['recoveryAdditions']==110
          assert proof['streamProof']['bass']['iteration003Count']==512
          assert proof['streamProof']['bass']['preExistingRichEventDictionaryMultisetExactlyPreserved'] is True
          assert proof['streamProof']['bass']['normalizedEqualFrozenScoredWinner'] is True
          assert proof['policy']['professionalReferenceReadByPromotion'] is False
          assert proof['policy']['scorerReadByPromotion'] is False
          assert proof['policy']['newReferenceFacingScoreCalls']==0
          assert proof['policy']['postSweepRetuning'] is False
          assert proof['policy']['gpuCudaModalUsed'] is False
          assert proof['policy']['mainOrProductionModified'] is False
          metrics=proof['selectedWinner']['frozenMetrics']
          assert abs(metrics['primaryF1']-0.8045325779036827)<1e-12
          assert abs(metrics['primaryPrecision']-0.83203125)<1e-12
          assert abs(metrics['primaryRecall']-0.7787934186471663)<1e-12
          PY

      - name: Freeze Iteration 003 receipt and self-seal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          output=Path('debug/v167-single-song-calibration/iteration-003-generated.json')
          proof_path=Path('debug/v167-single-song-calibration/iteration-003-promotion-proof.json')
          receipt=Path('debug/v167-single-song-calibration/iteration-003-promotion-receipt.json')
          proof=json.loads(proof_path.read_text())
          r={
            'schema':'dadrock.tabs.v167.iteration-003-promotion-receipt.v1',
            'version':'V167',
            'status':'ITERATION_003_FROZEN',
            'classification':'SINGLE_SONG_TRAINING_CALIBRATION_ONLY',
            'workflowRunId':int(os.environ['GITHUB_RUN_ID']),
            'workflowRunNumber':int(os.environ['GITHUB_RUN_NUMBER']),
            'workflowRunAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'workflowHeadSha':os.environ['GITHUB_SHA'],
            'candidateSha256':hashlib.sha256(output.read_bytes()).hexdigest(),
            'candidateGitBlob':subprocess.check_output(['git','hash-object',str(output)],text=True).strip(),
            'proofSha256':hashlib.sha256(proof_path.read_bytes()).hexdigest(),
            'proofGitBlob':subprocess.check_output(['git','hash-object',str(proof_path)],text=True).strip(),
            'selectedWinner':proof['selectedWinner'],
            'streamProof':proof['streamProof'],
            'inheritedFrozenMetrics':{
              'combinedGuitar':{
                'primaryF1':0.419156774457634,
                'primaryPrecision':512/1050,
                'primaryRecall':512/1393,
                'matched':512,'generated':1050,'reference':1393,
              },
              'bass':proof['selectedWinner']['frozenMetrics'],
            },
            'policy':{
              'normalizedStreamsEqualAlreadyScoredFrozenWinner':True,
              'newReferenceFacingScoreCalls':0,
              'professionalReferenceReadByPromotion':False,
              'scorerReadByPromotion':False,
              'individualEventSelectionByReference':False,
              'directReferenceEventCopy':False,
              'postSweepRetuning':False,
              'gpuCudaModalUsed':False,
              'mainOrProductionModified':False,
              'generalizationClaim':False,
            },
          }
          receipt.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          rm .github/workflows/v167-iteration-003-promotion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$OUTPUT" "$PROOF" "$RECEIPT" .github/workflows/v167-iteration-003-promotion.yml
          changed="$(git diff --cached --name-only)"
          if echo "$changed" | grep -Ev '^debug/v167-single-song-calibration/iteration-003-(generated|promotion-proof|promotion-receipt)\.json$|^\.github/workflows/v167-iteration-003-promotion\.yml$'; then
            echo 'Unexpected Iteration 003 path' >&2
            exit 1
          fi
          git commit -m "research: freeze V167 Iteration 003 Bass recovery winner [skip ci]"
          git push origin HEAD:"$BRANCH"
