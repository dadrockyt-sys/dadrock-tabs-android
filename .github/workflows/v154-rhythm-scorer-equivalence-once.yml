name: V154 Rhythm scorer equivalence once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v154-rhythm-scorer-equivalence-once.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0
      - name: Compare frozen Rhythm scorer row identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from collections import Counter
          from pathlib import Path

          authoritative = Path('research/v154-professional-references/scorer-ready/rhythm-scorer-ready.json')
          supplemental = Path('research/v154-professional-references/rhythm-professional-reference-scorer-ready.json')
          output = Path('research/v154-professional-references/rhythm-scorer-ready-equivalence-audit.json')
          expected = {
              authoritative: 'd51083800bfcf30ee15f31a4349eaa2c439f1b8662acd91618ab31bdca321555',
              supplemental: 'd6c9416979f25e6a81b9cd4583389b584a59421a0529fcccb4ca6f5dd47e679f',
          }
          if output.exists():
              raise SystemExit('equivalence audit already exists; frozen artifact is write-once')

          payloads = {}
          for path, sha in expected.items():
              data = path.read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if actual != sha:
                  raise SystemExit(f'frozen input identity mismatch: {path}: {actual} != {sha}')
              payloads[path] = json.loads(data)

          a_raw = payloads[authoritative].get('notes')
          s_raw = payloads[supplemental].get('rows')
          if not isinstance(a_raw, list) or not isinstance(s_raw, list):
              raise SystemExit('unexpected frozen Rhythm scorer schemas')

          def norm(row):
              step = float(row['step'])
              if step.is_integer():
                  step = int(step)
              return (int(row['measure']), step, int(row['midi']))

          a = [norm(r) for r in a_raw]
          s = [norm(r) for r in s_raw]
          ac = Counter(a)
          sc = Counter(s)
          only_a = ac - sc
          only_s = sc - ac
          multiset_equal = ac == sc
          sequence_equal = a == s
          sorted_equal = sorted(a) == sorted(s)
          duplicate_extras_a = sum(max(0, n - 1) for n in ac.values())
          duplicate_extras_s = sum(max(0, n - 1) for n in sc.values())

          def limited(counter, limit=25):
              rows = []
              for (measure, step, midi), count in sorted(counter.items()):
                  rows.append({'measure': measure, 'step': step, 'midi': midi, 'count': count})
                  if len(rows) >= limit:
                      break
              return rows

          audit = {
              'schema': 'dadrock.tabs.v154.rhythm-scorer-ready-equivalence-audit.v1',
              'status': 'PASS' if multiset_equal else 'FAIL',
              'comparisonDefinition': 'Exact multiset equality of normalized (measure, step, midi) scorer rows. Input sequence order is diagnostic only because simultaneous chord-note ordering is musically/scorer irrelevant.',
              'frozenInputs': {
                  str(authoritative): {'sha256': expected[authoritative], 'rowField': 'notes'},
                  str(supplemental): {'sha256': expected[supplemental], 'rowField': 'rows'},
              },
              'counts': {
                  'authoritativeRows': len(a),
                  'supplementalRows': len(s),
                  'authoritativeUniqueRows': len(ac),
                  'supplementalUniqueRows': len(sc),
                  'authoritativeExactDuplicateExtras': duplicate_extras_a,
                  'supplementalExactDuplicateExtras': duplicate_extras_s,
              },
              'results': {
                  'rowIdentityMultisetEquivalent': multiset_equal,
                  'sortedNormalizedRowsEquivalent': sorted_equal,
                  'inputSequenceEquivalent': sequence_equal,
                  'authoritativeOnlyRowIdentities': sum(only_a.values()),
                  'supplementalOnlyRowIdentities': sum(only_s.values()),
                  'authoritativeOnlySample': limited(only_a),
                  'supplementalOnlySample': limited(only_s),
              },
              'policy': {
                  'referenceOnly': True,
                  'generatedCandidateRead': False,
                  'generatedCandidateModified': False,
                  'scoringPerformed': False,
                  'referenceFacingScoreCalls': 0,
                  'humanCandidateCorrection': False,
                  'thresholdSweep': False,
                  'modalL4CudaGpuUsed': False,
                  'mainOrProductionModified': False,
                  'frozenInputsRewritten': False,
              },
          }
          output.write_text(json.dumps(audit, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(audit, indent=2, sort_keys=True))
          PY
      - name: Commit audit and seal workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dadrock-v154-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/v154-professional-references/rhythm-scorer-ready-equivalence-audit.json
          git rm .github/workflows/v154-rhythm-scorer-equivalence-once.yml
          git commit -m "v154: freeze Rhythm scorer equivalence audit"
          git push origin HEAD:v143-contextual-prune-lobo
