name: Canonicalize English-prefixed routes

on:
  push:
    branches:
      - seo-canonicalize-en-prefixed-routes
    paths:
      - '.github/scripts/canonicalize_en_prefixed_routes.py'
      - '.github/workflows/canonicalize-en-prefixed-routes.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo-canonicalize-en-prefixed-routes

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply English canonicalization patch
        run: python .github/scripts/canonicalize_en_prefixed_routes.py

      - name: Verify diff
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Commit canonical redirect
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add middleware.js
          git commit -m "Canonicalize English-prefixed routes"
          git push origin seo-canonicalize-en-prefixed-routes
