name: V143 Seeded Scheduler Runtime Log Diagnosis

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-seeded-scheduler-runtime-log-diagnosis.yml

permissions:
  contents: read

jobs:
  runtime-log-diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MODAL_ENVIRONMENT: main
      PYTHONUNBUFFERED: "1"
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install 'modal==1.5.5' >/dev/null
          modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET" >/dev/null
          modal --version

      - name: Fetch stopped isolated app history and logs only
        shell: bash
        run: |
          set -euo pipefail
          APP='dadrock-v143-seeded-scheduler-runtime-gate'
          echo '=== isolated app history ==='
          modal app history "$APP" --env main --json || true
          echo '=== isolated app recent logs ==='
          modal app logs "$APP" --env main --since 4h --tail 1000 --timestamps --show-function-id --show-function-call-id --show-container-id 2>&1 || true
          echo 'diagnosticOnly=true'
          echo 'approvedFixtureInvoked=false'
          echo 'productionAppTouched=false'
          echo 'referenceFacingInputs=0'
          echo 'referenceScoreCalls=0'
          echo 'qualityVerdictMade=false'
