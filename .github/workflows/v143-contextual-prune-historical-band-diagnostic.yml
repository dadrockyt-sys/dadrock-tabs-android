name: V143 Contextual Prune Historical Band Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-contextual-prune-historical-band-diagnostic.yml
      - analyzer/v143_contextual_prune_historical_band_diagnostic_modal.py

permissions:
  contents: write

jobs:
  historical-band-diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify label-free diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s public/gomywayfullaitest.m4a
          test -s public/training/v143-musical-reconstruction-calibration/fresh-section2-reference-free-cache.json
          test -s public/training/v143-musical-reconstruction-calibration/fresh-section3-reference-free-cache.json
          test -s analyzer/v143_contextual_prune_historical_band_diagnostic_modal.py
          echo "Historical band diagnostic inputs are present."

      - name: Run Sections 2 and 3 carrier diagnostic on Modal
        shell: bash
        run: |
          set +e
          mkdir -p debug/v143-contextual-prune
          log=debug/v143-contextual-prune/historical-band-diagnostic.log
          diagnostic=debug/v143-contextual-prune/historical-band-diagnostic.json

          : > "$log"
          echo "commit=$GITHUB_SHA" >> "$log"
          echo "actor=$GITHUB_ACTOR" >> "$log"

          token_available=false
          attempted=false
          status=99

          if [ -n "${MODAL_TOKEN_ID:-}" ] && [ -n "${MODAL_TOKEN_SECRET:-}" ]; then
            token_available=true
            python -m pip install --disable-pip-version-check modal >> "$log" 2>&1
            install_status=$?
            if [ "$install_status" -eq 0 ]; then
              attempted=true
              python -m modal run analyzer/v143_contextual_prune_historical_band_diagnostic_modal.py::diagnose >> "$log" 2>&1
              status=$?
            else
              status=$install_status
            fi
          else
            echo "Modal GitHub credentials are unavailable; diagnostic not attempted." >> "$log"
          fi

          TOKEN_AVAILABLE="$token_available" \
          ATTEMPTED="$attempted" \
          STATUS="$status" \
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          log_path = Path("debug/v143-contextual-prune/historical-band-diagnostic.log")
          output = Path("debug/v143-contextual-prune/historical-band-diagnostic.json")
          text = log_path.read_text(encoding="utf-8", errors="replace")
          target_gate = "v143-contextual-prune-historical-band-carrier-diagnostic"
          result = None
          decoder = json.JSONDecoder()
          for index, char in enumerate(text):
              if char != "{":
                  continue
              try:
                  value, _ = decoder.raw_decode(text[index:])
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict) and value.get("gate") == target_gate:
                  result = value

          payload = {
              "schemaVersion": 1,
              "gate": "v143-contextual-prune-historical-band-carrier-diagnostic-action",
              "modalCredentialsAvailableInGitHubActions": os.environ["TOKEN_AVAILABLE"] == "true",
              "diagnosticAttempted": os.environ["ATTEMPTED"] == "true",
              "modalCommandExitCode": int(os.environ["STATUS"]) if os.environ["ATTEMPTED"] == "true" else None,
              "diagnosticResultFound": result is not None,
              "diagnosticResult": result,
              "logTail": text.splitlines()[-180:],
              "liveEndpointDeployedOrModified": False,
              "productionModified": False,
          }
          output.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

          exit 0

      - name: Preserve full diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-contextual-prune-historical-band-diagnostic-log
          path: debug/v143-contextual-prune/historical-band-diagnostic.log
          if-no-files-found: error
          retention-days: 7

      - name: Commit compact diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git add -- debug/v143-contextual-prune/historical-band-diagnostic.json

          if git diff --cached --quiet; then
            echo "No historical band diagnostic changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record V143 historical band carrier diagnostic"
          git push origin HEAD:v143-contextual-prune-lobo

      - name: Report diagnostic state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("debug/v143-contextual-prune/historical-band-diagnostic.json").read_text(encoding="utf-8")
          )
          result = data.get("diagnosticResult") or {}
          invariants = result.get("invariants") or {}

          checks = {
              "Modal credentials available": data.get("modalCredentialsAvailableInGitHubActions") is True,
              "Diagnostic attempted": data.get("diagnosticAttempted") is True,
              "Modal command exited zero": data.get("modalCommandExitCode") == 0,
              "Diagnostic result found": data.get("diagnosticResultFound") is True,
              "Professional reference not opened": invariants.get("professionalReferenceOpened") is False,
              "Runtime labels not required": invariants.get("runtimeLabelsRequired") is False,
              "Live endpoint untouched": invariants.get("liveEndpointDeployedOrModified") is False,
              "Production untouched": invariants.get("productionModified") is False,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Historical band diagnostic execution failed: " + ", ".join(failed))

          s2 = result.get("section2") or {}
          s3 = result.get("section3") or {}
          print("SECTION2_EXACT", s2.get("exactSemanticReplayPassed"))
          print("SECTION2_TOLERANCE", s2.get("toleranceSemanticReplayPassed"))
          print("SECTION2_FIRST_MISMATCH", json.dumps(s2.get("firstMismatch"), sort_keys=True))
          print("SECTION3_EXACT", s3.get("exactSemanticReplayPassed"))
          print("SECTION3_TOLERANCE", s3.get("toleranceSemanticReplayPassed"))
          print("SECTION3_FIRST_MISMATCH", json.dumps(s3.get("firstMismatch"), sort_keys=True))
          print("PRODUCTION_MODIFIED", False)
          PY
