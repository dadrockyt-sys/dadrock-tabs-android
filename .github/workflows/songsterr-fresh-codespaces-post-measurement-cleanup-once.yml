name: Songsterr Fresh Codespaces Post Measurement Cleanup Once

on:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-codespaces-post-measurement-cleanup-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: songsterr-fresh-pipeline-v1
          fetch-depth: 0
      - name: Align checkpoint with completed Codespaces test
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          p = Path('docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
              'Next: create the cheapest Codespace using the Songsterr Fresh Workbench configuration, let bootstrap finish, run the measurement harness once, and inspect whether 2 cores / 8 GB is sufficient before choosing any paid persistent authority surface.',
              'Next: stop the 4-core Codespace when idle, use the completed measurement as capacity evidence, and choose the lowest-cost fixed authority surface with at least 4 GB RAM; do not pay for a larger 8 GB authority host solely on memory grounds.'
          )
          t = t.replace(
              '3. Budget-first step: use the non-authority GitHub Codespaces workbench before buying persistent compute. Create a Codespace from `songsterr-fresh-pipeline-v1`, select `.devcontainer/songsterr-fresh-workbench/devcontainer.json`, and choose the smallest compatible 2-core / 8 GB / 32 GB machine. Codespaces work remains measurement/development only.',
              '3. Budget-first Codespaces workbench test is complete. The user account exposed 4 cores / 8 GB / 32 GB as the smallest compatible machine, and that configuration completed the measurement path successfully. Codespaces work remains measurement/development only.'
          )
          t = t.replace(
              '7. After the 2-core / 8 GB result is known, choose the lowest-cost fixed authority surface that can satisfy the measured memory/runtime requirement. Policy C still requires one explicitly enrolled fixed Linux x64 surface and remains `UNENROLLED` until that separate authority surface is deliberately selected and probed.',
              '7. Choose the lowest-cost fixed authority surface that can satisfy the measured requirement: Demucs peak RSS was ~2.38 GiB, so target at least 4 GB RAM; 8 GB is optional headroom rather than a demonstrated requirement. Policy C still requires one explicitly enrolled fixed Linux x64 surface and remains `UNENROLLED` until that separate authority surface is deliberately selected and probed.'
          )
          lines = t.splitlines()
          stamp = datetime.now(ZoneInfo('America/Toronto')).strftime('%Y-%m-%d %H:%M America/Toronto')
          for i, line in enumerate(lines):
              if line.startswith('Updated: '):
                  lines[i] = f'Updated: {stamp}'
                  break
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Commit checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dadrockyt-sys'
          git config user.email 'Stephen.s.mcnally@gmail.com'
          git add docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md
          git commit -m 'docs: align Codespaces post-measurement next steps'
          git push origin HEAD:songsterr-fresh-pipeline-v1
