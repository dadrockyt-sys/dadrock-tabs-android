name: Astra synthetic S5 state-weight pilot v1

on:
  push:
    branches:
      - astra-work
    paths:
      - 'docs/astra/SYNTHETIC_DATA_DIVERSITY_S5_LAUNCH_V1.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: astra-synthetic-s5-state-weight-v1
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-22.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'

      - name: Verify authorization and source pins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          blob=lambda p: subprocess.check_output(['git','hash-object',p],text=True).strip()
          a=json.load(open('docs/astra/SYNTHETIC_DATA_DIVERSITY_S5_AUTHORIZATION_V1.json'))
          l=json.load(open('docs/astra/SYNTHETIC_DATA_DIVERSITY_S5_LAUNCH_V1.json'))
          assert a['schema']=='astra-synthetic-data-diversity-s5-authorization-v1'
          assert str(a['userInstruction']).startswith('I authorize')
          z=a['authorization']
          assert z['maxModels']==2 and z['maxOptimizerStepsPerModel']==500
          assert not z['automaticRetryAuthorized'] and not z['thresholdSearchAuthorized']
          assert not z['p1Authorized'] and not z['p2Authorized'] and not z['p3Authorized']
          assert not z['codespacesAuthorized'] and not z['vercelAuthorized']
          paths={
            'designGitBlob':'docs/astra/SYNTHETIC_DATA_DIVERSITY_S5_DESIGN_V1.md',
            'generatorGitBlob':'astra_backend/synthetic/s0_pilot_v1.py',
            'samplingGitBlob':'astra_backend/synthetic/s1_pilot_v1.py',
            'diagnosticsGitBlob':'astra_backend/synthetic/s2_pilot_v1.py',
            'repeatedDiagnosticsGitBlob':'astra_backend/synthetic/s3_pilot_v1.py',
            'runnerGitBlob':'astra_backend/synthetic/s5_pilot_v1.py',
            'testsGitBlob':'astra_backend/synthetic/test_s5_pilot_v1.py',
            'runtimeLockGitBlob':'astra_backend/tabcnn_runtime/requirements.lock.txt',
            'workflowGitBlob':'.github/workflows/astra-synthetic-s5-state-weight-v1.yml',
          }
          for k,p in paths.items():
              assert a['sourceIdentities'][k]==blob(p),(k,'auth')
              assert l['sourceIdentities'][k]==blob(p),(k,'launch')
          assert l['authorizationGitBlob']==blob('docs/astra/SYNTHETIC_DATA_DIVERSITY_S5_AUTHORIZATION_V1.json')
          PY

      - name: Install exact CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check             --extra-index-url https://download.pytorch.org/whl/cpu             --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          python -m pip check

      - name: Run authorized S5 focused tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=astra_backend python astra_backend/synthetic/test_s5_pilot_v1.py

      - name: Regenerate bounded synthetic corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/astra-s5
          PYTHONPATH=astra_backend python astra_backend/synthetic/s0_pilot_v1.py generate             --out /tmp/astra-s5/dataset.npz             --receipt /tmp/astra-s5/render-receipt.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/astra-s5/render-receipt.json'))
          assert x['examples']==294 and x['audioSeconds']==588.0
          assert x['withinCeilings'] is True and x['externalAudioAssets'] is False
          assert not x['guards']['p1Accessed'] and not x['guards']['p2Accessed'] and not x['guards']['p3Opened']
          PY

      - name: Run exactly two capped S5 arms
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=astra_backend python astra_backend/synthetic/s5_pilot_v1.py             --dataset /tmp/astra-s5/dataset.npz             --out /tmp/astra-s5/result.json             --identity-out /tmp/astra-s5/identity.json             --control-model /tmp/astra-s5/state-weight-6.pt             --intervention-model /tmp/astra-s5/state-weight-9.pt
          python - <<'PY'
          import json
          x=json.load(open('/tmp/astra-s5/result.json'))
          ident=json.load(open('/tmp/astra-s5/identity.json'))
          assert x['execution']['modelCount']==2
          assert x['execution']['optimizerStepsTotal']<=1000
          assert x['control']['fit']['optimizerSteps']<=500
          assert x['weight9']['fit']['optimizerSteps']<=500
          assert x['control']['fit']['initialModelSha256']==x['weight9']['fit']['initialModelSha256']
          assert ident['armsUseSameArrays'] is True and ident['armsUseSameBatchIndices'] is True
          assert x['batchPlan']['identicalAcrossArms'] is True
          assert x['preUpdateForwardLogitsIdentical'] is True
          assert x['fixed']['thresholdSearch'] is False and x['fixed']['thresholdRetuning'] is False
          assert x['execution']['automaticRetry'] is False
          assert not x['guards']['p1Accessed'] and not x['guards']['p2Accessed'] and not x['guards']['p3Opened']
          assert not x['guards']['codespacesUsed'] and not x['guards']['vercelUsed']
          PY

      - name: Upload bounded S5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: astra-synthetic-data-diversity-s5-v1
          path: |
            /tmp/astra-s5/render-receipt.json
            /tmp/astra-s5/identity.json
            /tmp/astra-s5/result.json
            /tmp/astra-s5/state-weight-6.pt
            /tmp/astra-s5/state-weight-9.pt
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf /tmp/astra-s5
