name: Open corpus GuitarSet V5 cross-player development

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/open-corpus-guitarset-v5-cross-player-development.yml

permissions:
  contents: read
  actions: read

jobs:
  develop:
    name: Score frozen V5 family on players 02 04 05
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ORIGINAL_RUN_ID: '33581322528'
      ORIGINAL_HEAD_SHA: 'f494e5b2f586ec335b16dcabce687e63bb1f88fb'
      CANDIDATE_ARTIFACT_ID: '9828683652'
      CANDIDATE_ARTIFACT_NAME: 'guitarset-v3-development-frozen-candidates'
      CANDIDATE_ARTIFACT_DIGEST: 'sha256:1031aaf913b6292ee961051fed76b91bf003139ab6d3f8db1dad5d0dded270c5'
      CANDIDATE_MANIFEST_SHA256: '4568ca0c5f25ba11f17074b43b21e135eb44357c04a963266c61457038120a83'
      V5_EVALUATOR_BLOB: '8a38a0c812fb1979fe01ccad711d3f8e72813d26'
      FROZEN_V3_SCORER_BLOB: '19ef54155735a6ac1e65441250b47d1572ac0380'

    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen V5 contract and code identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object validation/open_corpus/evaluate_guitarset_v5_cross_player_development.py)" = "$V5_EVALUATOR_BLOB"
          test "$(git hash-object validation/open_corpus/score_guitarset_v3_development_candidates.py)" = "$FROZEN_V3_SCORER_BLOB"
          test -f docs/checkpoints/OPEN_CORPUS_V5_GUITARSET_CROSS_PLAYER_DEVELOPMENT_PREREGISTRATION_20260902.md
          echo V5_CROSS_PLAYER_FROZEN_CODE_PASS
          echo v5DevelopmentScoreCalls=0
          echo guitarSetProspectiveEvaluationProcessed=false
          echo guitarSetProspectiveEvaluationScoreCalls=0
          echo v168ReferenceFacingScoreCalls=0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install frozen reference runtime only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 jams==0.3.4
          python - <<'PY'
          import importlib.util, numpy as np, jams
          assert np.__version__ == '1.26.4'
          assert hasattr(np, 'float_')
          if importlib.util.find_spec('basic_pitch') is not None:
              raise SystemExit('basic_pitch unexpectedly importable in V5 development')
          print('V5_CROSS_PLAYER_REFERENCE_RUNTIME_PASS')
          print('basicPitchImportable=false')
          print('v5DevelopmentScoreCalls=0')
          print('guitarSetProspectiveEvaluationScoreCalls=0')
          print('v168ReferenceFacingScoreCalls=0')
          PY

      - name: Verify original candidate artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/guitarset-v5-cross-player"
          mkdir -p "$ROOT"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID" \
            -o "$ROOT/artifact-metadata.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'guitarset-v5-cross-player/artifact-metadata.json'
          a=json.loads(p.read_text())
          wr=a.get('workflow_run') or {}
          assert int(a['id'])==int(os.environ['CANDIDATE_ARTIFACT_ID'])
          assert a['name']==os.environ['CANDIDATE_ARTIFACT_NAME']
          assert a['expired'] is False
          assert a.get('digest')==os.environ['CANDIDATE_ARTIFACT_DIGEST']
          assert int(wr.get('id'))==int(os.environ['ORIGINAL_RUN_ID'])
          assert wr.get('head_sha')==os.environ['ORIGINAL_HEAD_SHA']
          print('V5_CROSS_PLAYER_ARTIFACT_IDENTITY_PASS')
          PY
          rm -f "$ROOT/artifact-metadata.json"

      - name: Download immutable V3 candidates
        uses: actions/download-artifact@v4
        with:
          name: guitarset-v3-development-frozen-candidates
          path: ${{ runner.temp }}/guitarset-v5-cross-player/candidates
          github-token: ${{ github.token }}
          repository: dadrockyt-sys/dadrock-tabs-android
          run-id: 33581322528

      - name: Reverify manifest and all 177 candidate hashes before references
        shell: bash
        run: |
          set -euo pipefail
          CAND="$RUNNER_TEMP/guitarset-v5-cross-player/candidates"
          test "$(sha256sum "$CAND/candidate-freeze-manifest.json" | awk '{print $1}')" = "$CANDIDATE_MANIFEST_SHA256"
          test "$(find "$CAND" -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 178
          test "$(find "$CAND" -type f \( -name '*.wav' -o -name '*.jams' -o -name '*.zip' \) | wc -l)" -eq 0
          CAND="$CAND" python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['CAND'])
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1<<20),b''): h.update(b)
              return h.hexdigest()
          m=json.loads((root/'candidate-freeze-manifest.json').read_text())
          assert len(m['files'])==177
          assert m['players']==['02','04','05']
          assert m['sealedEvaluationPlayers']==['00','01','03']
          counts={'02':0,'04':0,'05':0}
          for r in m['files']:
              p=root/r['file']
              assert p.is_file() and sha(p)==r['sha256'], r['file']
              counts[r['player']]+=1
          assert counts=={'02':59,'04':58,'05':60}, counts
          print('V5_CROSS_PLAYER_ALL_177_CANDIDATE_HASHES_PASS')
          print('candidateRegenerated=false')
          print('v5DevelopmentScoreCalls=0')
          print('guitarSetProspectiveEvaluationScoreCalls=0')
          print('v168ReferenceFacingScoreCalls=0')
          PY

      - name: Download verify and isolate all development references only
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/guitarset-v5-cross-player"
          mkdir -p "$ROOT/reference" "$ROOT/output"
          cd "$ROOT"
          curl -L --fail --retry 3 --retry-delay 3 \
            'https://zenodo.org/records/3371780/files/annotation.zip?download=1' \
            -o annotation.zip
          echo 'b39b78e63d3446f2e54ddb7a54df9b10  annotation.zip' | md5sum -c -
          echo '8daa02e6417ccca1685feb44b135e95928ad7037e5032ecb326b5791856fda99  annotation.zip' | sha256sum -c -
          python - <<'PY'
          import shutil, zipfile
          from pathlib import Path
          root=Path('.')
          out=root/'reference'
          dev={'02','04','05'}
          excluded={'04_BN3-154-E_comp','04_Jazz1-200-B_comp','02_Funk2-119-G_comp'}
          selected=[]
          with zipfile.ZipFile(root/'annotation.zip','r') as z:
              for info in z.infolist():
                  name=Path(info.filename).name
                  if not name.endswith('.jams'): continue
                  stem=name[:-5]
                  if stem[:2] not in dev or stem in excluded: continue
                  dest=out/name
                  if dest.exists(): raise SystemExit(f'duplicate {name}')
                  with z.open(info,'r') as src, dest.open('wb') as dst: shutil.copyfileobj(src,dst)
                  selected.append(stem)
          counts={p:sum(s.startswith(p+'_') for s in selected) for p in sorted(dev)}
          assert counts=={'02':59,'04':58,'05':60}, counts
          assert len(selected)==177
          assert not any(s[:2] in {'00','01','03'} for s in selected)
          print('V5_CROSS_PLAYER_REFERENCE_SELECTION_PASS',counts)
          PY
          rm -f annotation.zip
          test "$(find reference -maxdepth 1 -type f -name '*.jams' | wc -l)" -eq 177
          test "$(find reference -maxdepth 1 -type f \( -name '00_*' -o -name '01_*' -o -name '03_*' \) | wc -l)" -eq 0
          test "$(find "$ROOT" -type f -name '*.wav' | wc -l)" -eq 0
          echo V5_CROSS_PLAYER_REFERENCE_BOUNDARY_PASS
          echo guitarSetProspectiveEvaluationProcessed=false
          echo guitarSetProspectiveEvaluationScoreCalls=0
          echo v168ReferenceFacingScoreCalls=0

      - name: Run frozen V5 development exactly once
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/guitarset-v5-cross-player"
          cd validation/open_corpus
          python evaluate_guitarset_v5_cross_player_development.py \
            --candidate-dir "$ROOT/candidates" \
            --reference-dir "$ROOT/reference" \
            --output "$ROOT/output/v5-cross-player-development.json"
          cd "$ROOT/output"
          sha256sum v5-cross-player-development.json > development-sha256.txt

      - name: Print frozen V5 development classification
        shell: python
        run: |
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'guitarset-v5-cross-player/output/v5-cross-player-development.json'
          r=json.loads(p.read_text())
          selected=r.get('selectedConfigId')
          out={
            'status':r['status'],
            'developmentTrackCount':r['developmentTrackCount'],
            'totalReferenceEventCount':r['totalReferenceEventCount'],
            'configCount':r['configCount'],
            'qualifiedConfigCount':len(r['qualifiedConfigIds']),
            'qualifiedConfigIds':r['qualifiedConfigIds'],
            'selectedConfigId':selected,
            'selectedConfig':r.get('selectedConfig'),
            'baselinePrimaryMacroF1Pct':r['baseline']['primary100ms']['macroF1Pct'],
            'baselinePrimaryMicroF1Pct':r['baseline']['primary100ms']['micro']['f1Pct'],
            'developmentSha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'v5DevelopmentScoreCalls':r['v5DevelopmentScoreCalls'],
            'guitarSetProspectiveEvaluationScoreCalls':r['guitarSetProspectiveEvaluationScoreCalls'],
            'v168ReferenceFacingScoreCalls':r['v168ReferenceFacingScoreCalls'],
          }
          if selected:
              out['selectedQualification']=r['qualifications'][selected]
              out['selectedChangedPitchCount']=r['totalChangedPitchCounts'][selected]
          print(json.dumps(out,indent=2,sort_keys=True))

      - name: Remove references and candidates before preserving report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/guitarset-v5-cross-player"
          rm -rf "$ROOT/reference" "$ROOT/candidates"
          rm -f "$ROOT/annotation.zip" "$ROOT/artifact-metadata.json"
          if [ -d "$ROOT/output" ]; then
            test "$(find "$ROOT/output" -type f \( -name '*.jams' -o -name '*.wav' -o -name '*.zip' \) | wc -l)" -eq 0
          fi

      - name: Preserve V5 development report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guitarset-v5-cross-player-development
          path: ${{ runner.temp }}/guitarset-v5-cross-player/output/
          retention-days: 30
          if-no-files-found: ignore
