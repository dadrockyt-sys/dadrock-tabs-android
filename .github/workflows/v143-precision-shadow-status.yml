name: V143 Precision Shadow Status

on:
  workflow_dispatch:
  push:
    branches: [v143-contextual-prune-lobo]
    paths: [.github/workflows/v143-precision-shadow-status.yml]

permissions:
  actions: read
  contents: write

jobs:
  status:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Capture matching workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p debug/v143-contextual-prune
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          url='https://api.github.com/repos/${{ github.repository }}/actions/workflows/v143-contextual-prune-precision-shadow-approved-audio.yml/runs?branch=v143-contextual-prune-lobo&per_page=10'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'dadrock-v143-status'})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          runs=[]
          for x in data.get('workflow_runs') or []:
            runs.append({'id':x.get('id'),'status':x.get('status'),'conclusion':x.get('conclusion'),'event':x.get('event'),'headSha':x.get('head_sha'),'runNumber':x.get('run_number'),'runAttempt':x.get('run_attempt'),'createdAt':x.get('created_at'),'updatedAt':x.get('updated_at')})
          out={'schemaVersion':1,'gate':'v143-precision-shadow-status','triggerSha':'${{ github.sha }}','runs':runs,'productionModified':False}
          Path('debug/v143-contextual-prune/precision-shadow-run-status.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
          git add debug/v143-contextual-prune/precision-shadow-run-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record precision shadow workflow status'
          git fetch origin v143-contextual-prune-lobo
          git rebase origin/v143-contextual-prune-lobo
          git push origin HEAD:v143-contextual-prune-lobo
