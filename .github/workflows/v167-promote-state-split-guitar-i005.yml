name: V167 promote frozen state-split Guitar winner to I005

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v167-promote-state-split-guitar-i005.yml

permissions:
  contents: write

concurrency:
  group: v167-promote-state-split-guitar-i005-once
  cancel-in-progress: false

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: 6d2b9f180384a3dbb6614485868b844b9b5f2898
  I003: debug/v167-single-song-calibration/iteration-003-generated.json
  I004: debug/v167-single-song-calibration/iteration-004-generated.json
  POOL: debug/v167-single-song-calibration/nearmiss-evidence-pool.json
  TIMEBASE: debug/v166-cpu-autonomous/timebase.json
  MANIFEST: debug/v167-single-song-calibration/state-split-guitar-sweep-manifest.json
  REPORT: debug/v167-single-song-calibration/state-split-guitar-sweep.json
  SWEEP_RECEIPT: debug/v167-single-song-calibration/state-split-guitar-sweep-receipt.json
  BASE_BUILDER: validation/v167_single_song_calibration/build_upstream_recovery_variants_v167.py
  STATE_BUILDER: validation/v167_single_song_calibration/build_state_split_guitar_variants_v167.py
  PROMOTER: validation/v167_single_song_calibration/promote_state_split_guitar_winner_v167.py
  OUTPUT: debug/v167-single-song-calibration/iteration-005-generated.json
  PROOF: debug/v167-single-song-calibration/iteration-005-promotion-proof.json
  RECEIPT: debug/v167-single-song-calibration/iteration-005-freeze-receipt.json
  CUDA_VISIBLE_DEVICES: ""
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  promote-once:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact I005 promotion arm
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.21'

      - name: Verify immutable no-rescore I005 boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v167-promote-state-split-guitar-i005.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"

          test "$(git hash-object "$I003")" = "758f8762632e916306aed9b036a6483af9431dc0"
          test "$(git hash-object "$I004")" = "8dd85049a65f00541f7874ff99511b081a0b5ff2"
          test "$(git hash-object "$POOL")" = "aa7da3a55344b1418a291f30fab9ca55858fc094"
          test "$(git hash-object "$TIMEBASE")" = "abebae25801b7ddeb5b933977c4f4a918f7bf9ef"
          test "$(git hash-object "$MANIFEST")" = "fc5202898adc0d8aabdfce0e02c019f32443a4a1"
          test "$(git hash-object "$REPORT")" = "d26e4128479f760c23fe6c449cc4b3ec5ad7219b"
          test "$(git hash-object "$SWEEP_RECEIPT")" = "c40cd73d857c4d42d87c41c95d17d47be5f15e3c"
          test "$(git hash-object "$BASE_BUILDER")" = "24413d321f64bbfcce48812ceb85b4593dcfa80c"
          test "$(git hash-object "$STATE_BUILDER")" = "6b480d43744a5c67c02510d55162581d896afee4"
          test "$(git hash-object "$PROMOTER")" = "a912018b58f9bd7243229fcba3d8895e33300c44"
          test "$(git hash-object docs/checkpoints/CURRENT_STATE.md)" = "9b3bfab321aee25a4e987dc7cb650d152f462b87"

          test ! -e "$OUTPUT"
          test ! -e "$PROOF"
          test ! -e "$RECEIPT"
          python -m py_compile "$BASE_BUILDER" "$STATE_BUILDER" "$PROMOTER"

          python - <<'PY'
          import hashlib
          from pathlib import Path

          checks = {
              'debug/v167-single-song-calibration/iteration-003-generated.json': 'f15c6f40dd4b8479c2dfb7eab039cff98a23b45eb796265ffad08c5a8ae37115',
              'debug/v167-single-song-calibration/iteration-004-generated.json': '728785c631750cbfcad48cc3243c238d6e7de6f337cce87e125a651ca2793acc',
              'debug/v167-single-song-calibration/nearmiss-evidence-pool.json': '1c983784c2d12a22437a80387525789bcf55a2f4e4a5c7a96608c575bf709673',
              'debug/v167-single-song-calibration/state-split-guitar-sweep-manifest.json': '113add46d50e423708972ed18eb88df48ec1d60968e75d5e251f609f84a365e4',
              'debug/v167-single-song-calibration/state-split-guitar-sweep.json': 'f4dfd04849eab3f15290cadb2b9ff0a2903bc6174beb428b35c71aa7c7347562',
          }
          for path, expected in checks.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert actual == expected, (path, actual, expected)

          promoter = Path('validation/v167_single_song_calibration/promote_state_split_guitar_winner_v167.py').read_text()
          for forbidden in ('frontend-reference-payload.json', 'score_frontend_reference.py', '--reference', '--scorer-code'):
              assert forbidden not in promoter, forbidden
          PY

      - name: Reconstruct frozen winner and promote to rich I005
        shell: bash
        run: |
          set -euo pipefail
          python "$PROMOTER" \
            --base-i003 "$I003" \
            --parent-i004 "$I004" \
            --pool "$POOL" \
            --timebase "$TIMEBASE" \
            --manifest "$MANIFEST" \
            --report "$REPORT" \
            --receipt "$SWEEP_RECEIPT" \
            --base-builder "$BASE_BUILDER" \
            --state-builder "$STATE_BUILDER" \
            --output "$OUTPUT" \
            --proof "$PROOF" \
            --i003-blob "758f8762632e916306aed9b036a6483af9431dc0" \
            --i004-blob "8dd85049a65f00541f7874ff99511b081a0b5ff2" \
            --pool-blob "aa7da3a55344b1418a291f30fab9ca55858fc094" \
            --timebase-blob "abebae25801b7ddeb5b933977c4f4a918f7bf9ef" \
            --manifest-blob "fc5202898adc0d8aabdfce0e02c019f32443a4a1" \
            --report-blob "d26e4128479f760c23fe6c449cc4b3ec5ad7219b" \
            --receipt-blob "c40cd73d857c4d42d87c41c95d17d47be5f15e3c"

          python - <<'PY'
          import json

          output = json.load(open('debug/v167-single-song-calibration/iteration-005-generated.json'))
          proof = json.load(open('debug/v167-single-song-calibration/iteration-005-promotion-proof.json'))

          assert output['version'] == 'V167'
          assert output['status'] == 'CALIBRATION_ITERATION_005_FROZEN_STATE_SPLIT_GUITAR_WINNER_PROMOTED'
          assert output['calibration']['iteration'] == 5
          assert output['calibration']['parentIteration'] == 4
          assert output['calibration']['constructionBaseIteration'] == 3
          assert output['calibration']['selectedRuleId'] == 'gss-active-only'
          assert output['calibration']['frozenScoredWinnerCandidateSha256'] == 'aa042135c542f2025522bb0d8ab9491c8457bf95025db5953b714d452afc0d5e'
          assert output['calibration']['reconstructedScoredWinnerCandidateSha256'] == 'aa042135c542f2025522bb0d8ab9491c8457bf95025db5953b714d452afc0d5e'
          assert len(output['streams']['combinedGuitar']) == 1098
          assert len(output['streams']['bass']) == 512
          assert output['calibration']['streamChanges']['combinedGuitar']['stateSplitRecoveryEventsAdded'] == 48
          assert output['calibration']['streamChanges']['combinedGuitar']['netEventDeltaVsI004'] == -15
          assert output['calibration']['streamChanges']['bass']['richListExactlyPreservedAcrossI003I004I005'] is True
          assert output['calibration']['inheritedFrozenSweepMetrics']['combinedGuitar']['primaryF1'] == 0.42794058610999597
          assert output['calibration']['inheritedFrozenSweepMetrics']['bass']['primaryF1'] == 0.8045325779036827
          assert output['safety']['newReferenceFacingScoreCalls'] == 0
          assert output['safety']['referenceRead'] is False
          assert output['safety']['scorerRead'] is False
          assert output['safety']['gpuCudaModalUsed'] is False
          assert output['safety']['mainOrProductionModified'] is False

          assert proof['status'] == 'ITERATION_005_NORMALIZED_STREAM_EQUALITY_PROVEN'
          assert proof['selectedWinner']['id'] == 'gss-active-only'
          assert proof['selectedWinner']['frozenCandidateSha256'] == 'aa042135c542f2025522bb0d8ab9491c8457bf95025db5953b714d452afc0d5e'
          assert proof['selectedWinner']['reconstructedCandidateSha256'] == 'aa042135c542f2025522bb0d8ab9491c8457bf95025db5953b714d452afc0d5e'
          assert proof['streamProof']['combinedGuitar']['constructionBaseRichEventDictionaryMultisetExactlyPreserved'] is True
          assert proof['streamProof']['combinedGuitar']['newCoordinatesUnique'] is True
          assert proof['streamProof']['combinedGuitar']['normalizedEqualFrozenScoredWinner'] is True
          assert proof['streamProof']['bass']['richListExactlyPreservedAcrossI003I004I005'] is True
          assert proof['streamProof']['bass']['normalizedEqualI004'] is True
          assert proof['policy']['newReferenceFacingScoreCalls'] == 0
          print(json.dumps({
              'iteration005CandidateSha256': proof['iteration005CandidateSha256'],
              'guitarF1Inherited': output['calibration']['inheritedFrozenSweepMetrics']['combinedGuitar']['primaryF1'],
              'bassF1Inherited': output['calibration']['inheritedFrozenSweepMetrics']['bass']['primaryF1'],
          }, sort_keys=True))
          PY

      - name: Freeze I005 promotion receipt and self-seal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          output = Path('debug/v167-single-song-calibration/iteration-005-generated.json')
          proof_path = Path('debug/v167-single-song-calibration/iteration-005-promotion-proof.json')
          receipt_path = Path('debug/v167-single-song-calibration/iteration-005-freeze-receipt.json')
          candidate = json.loads(output.read_text())
          proof = json.loads(proof_path.read_text())

          receipt = {
              'schema': 'dadrock.tabs.v167.iteration-005-freeze-receipt.v1',
              'version': 'V167',
              'status': 'ITERATION_005_FROZEN',
              'classification': 'SINGLE_SONG_TRAINING_CALIBRATION_ONLY',
              'workflowRunId': int(os.environ['GITHUB_RUN_ID']),
              'workflowRunNumber': int(os.environ['GITHUB_RUN_NUMBER']),
              'workflowRunAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'workflowHeadSha': os.environ['GITHUB_SHA'],
              'iteration005CandidateSha256': hashlib.sha256(output.read_bytes()).hexdigest(),
              'iteration005CandidateGitBlob': subprocess.check_output(['git', 'hash-object', str(output)], text=True).strip(),
              'promotionProofSha256': hashlib.sha256(proof_path.read_bytes()).hexdigest(),
              'promotionProofGitBlob': subprocess.check_output(['git', 'hash-object', str(proof_path)], text=True).strip(),
              'implementation': {
                  'baseBuilderGitBlob': '24413d321f64bbfcce48812ceb85b4593dcfa80c',
                  'stateSplitBuilderGitBlob': '6b480d43744a5c67c02510d55162581d896afee4',
                  'promoterGitBlob': 'a912018b58f9bd7243229fcba3d8895e33300c44',
              },
              'inputs': proof['inputs'],
              'selectedWinner': proof['selectedWinner'],
              'streamProof': proof['streamProof'],
              'inheritedFrozenMetrics': candidate['calibration']['inheritedFrozenSweepMetrics'],
              'policy': {
                  'professionalReferenceReadByPromotion': False,
                  'scorerReadByPromotion': False,
                  'newReferenceFacingScoreCalls': 0,
                  'individualEventSelectionByReference': False,
                  'directReferenceEventCopy': False,
                  'postSweepRetuning': False,
                  'gpuCudaModalUsed': False,
                  'mainOrProductionModified': False,
                  'generalizationClaim': False,
              },
          }
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

          rm .github/workflows/v167-promote-state-split-guitar-i005.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            "$OUTPUT" \
            "$PROOF" \
            "$RECEIPT" \
            .github/workflows/v167-promote-state-split-guitar-i005.yml

          changed="$(git diff --cached --name-only)"
          if echo "$changed" | grep -Ev '^debug/v167-single-song-calibration/iteration-005-(generated|promotion-proof|freeze-receipt)\.json$|^\.github/workflows/v167-promote-state-split-guitar-i005\.yml$'; then
            echo 'Unexpected I005 promotion path' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 4

          git commit -m "research: freeze V167 Iteration 005 state-split Guitar winner [skip ci]"
          git push origin HEAD:"$BRANCH"
