name: Remove manual upcoming video form

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/remove-manual-upcoming-video.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove manual upcoming-video UI and code
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('app/page.js')
          text = path.read_text()

          state_start = "  const [newUpcomingTitle, setNewUpcomingTitle] = useState('');\n"
          state_end = "  const [isAddingUpcoming, setIsAddingUpcoming] = useState(false);\n"
          start = text.index(state_start)
          end = text.index(state_end, start) + len(state_end)
          text = text[:start] + text[end:]

          handler_start = "  // Add upcoming video manually\n"
          handler_end = "  // Delete upcoming video\n"
          start = text.index(handler_start)
          end = text.index(handler_end, start)
          text = text[:start] + text[end:]

          ui_start = "            {/* Manual Add Upcoming Video */}\n"
          ui_end = "            {/* List of Upcoming Videos */}\n"
          start = text.index(ui_start)
          end = text.index(ui_end, start)
          text = text[:start] + text[end:]

          old_copy = 'Connect your YouTube account to automatically import scheduled videos, or add them manually.'
          new_copy = 'Connect your YouTube account to automatically import scheduled videos.'
          if old_copy not in text:
              raise SystemExit('Expected upcoming-video description not found')
          text = text.replace(old_copy, new_copy, 1)

          for value in ('Add Upcoming Video Manually', 'handleAddUpcoming', 'newUpcomingTitle', 'isAddingUpcoming'):
              if value in text:
                  raise SystemExit(f'Cleanup incomplete: {value}')

          path.write_text(text)
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          git diff --cached --quiet || git commit -m "Remove manual upcoming video form"
          git push
