name: V161 one-shot professional-reference CPU score

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v161-score.yml

permissions:
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: ff42319742c5168c193256647299ab6a7140acfb
  CANDIDATE: debug/v161-cpu-autonomous/generated.json
  STRUCTURAL_QC: debug/v161-cpu-autonomous/structural-qc.json
  GENERATION_TERMINAL: debug/v161-cpu-autonomous/terminal-freeze.json
  SCORE_PREREG: debug/v161-cpu-autonomous/score-preregistration.json
  SCORER: validation/v154_cpu_multitrack/score_frontend_reference.py
  REFERENCE: research/v154-professional-references/scorer-ready/frontend-reference-payload.json
  SCORE: debug/v161-cpu-autonomous/reference-score.json
  SCORE_TERMINAL: debug/v161-cpu-autonomous/score-terminal-freeze.json
  CUDA_VISIBLE_DEVICES: ""

jobs:
  score-once:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify sealed one-score boundary
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v161-score.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"

          test "$(git hash-object "$CANDIDATE")" = "52178705ef3830f6849b71037cd283877aa7655f"
          test "$(sha256sum "$CANDIDATE" | awk '{print $1}')" = "75c4edd6560ee832bf7df4799c4e9389a7424e7056ac5f3cd5a9e07fc254996a"
          test "$(git hash-object "$STRUCTURAL_QC")" = "2146cf9f7b9e92ce704ef2118e711bd42ae2e093"
          test "$(sha256sum "$STRUCTURAL_QC" | awk '{print $1}')" = "ba17ac241d438e15d13f0d45a93194e97151868805541dc252ea41caa1ae34ba"
          test "$(git hash-object "$GENERATION_TERMINAL")" = "5ff59c993698b00df3503c6e22e036f181140aa4"
          test "$(git hash-object "$SCORE_PREREG")" = "8f50b65d023bd5469935ed3ca70c115bf0b86dda"
          test "$(git hash-object "$SCORER")" = "9644e65719fbd361a9b39778ae9950c5e983e855"
          test "$(git hash-object "$REFERENCE")" = "2fbed60b543c0488934d8642c488aa06bf31bbf5"
          test "$(sha256sum "$REFERENCE" | awk '{print $1}')" = "b39a203aec3f45800891fe4eca156e37e7571b91ea5c4ccc41b30bbc95fc89e7"

          test ! -e "$SCORE"
          test ! -e "$SCORE_TERMINAL"
          test ! -e .github/workflows/v161-generate.yml

          python - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/v161-score.yml").read_text()
          needle = 'python "$SCORER" "$CANDIDATE" "$REFERENCE" --output "$SCORE" > /tmp/v161-score-stdout.json'
          assert sum(line.strip() == needle for line in text.splitlines()) == 1
          PY

          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          candidate = Path("debug/v161-cpu-autonomous/generated.json")
          structural = json.loads(Path("debug/v161-cpu-autonomous/structural-qc.json").read_text())
          terminal = json.loads(Path("debug/v161-cpu-autonomous/terminal-freeze.json").read_text())
          prereg = json.loads(Path("debug/v161-cpu-autonomous/score-preregistration.json").read_text())

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          assert prereg["schema"] == "dadrock.tabs.v161.professional-reference-score-preregistration.v1"
          assert prereg["status"] == "SEALED_BEFORE_REFERENCE_OR_SCORER_OPEN"
          assert prereg["validation"] == "PASS"
          assert prereg["frozenCandidate"]["sha256"] == sha256(candidate)
          assert prereg["frozenCandidate"]["gitBlob"] == "52178705ef3830f6849b71037cd283877aa7655f"
          assert prereg["frozenCandidate"]["candidateAuthoritative"] is True
          assert prereg["frozenCandidate"]["eligibleForProfessionalReferenceScoring"] is True
          assert prereg["frozenCandidate"]["combinedGuitarEvents"] == 895
          assert prereg["frozenCandidate"]["bassEvents"] == 449

          assert structural["validation"] == "PASS"
          assert structural["errors"] == []
          assert structural["candidateSha256"] == prereg["frozenCandidate"]["sha256"]
          assert all(structural["checks"].values())

          assert terminal["status"] == "TERMINAL"
          assert terminal["outcome"] == "STRUCTURAL_QC_PASS"
          assert terminal["candidateAuthoritative"] is True
          assert terminal["eligibleForProfessionalReferenceScoring"] is True
          assert terminal["neverRearmV161"] is True
          assert terminal["workflowRunId"] == 33208183041
          assert terminal["workflowRunNumber"] == 1
          assert terminal["workflowRunAttempt"] == 1
          assert terminal["workflowHeadSha"] == "418a25f82e4aa3742e995e4a3ce341bc48a24151"

          gt = prereg["generationTerminalIdentity"]
          assert gt["terminalCommit"] == "1b58ffcb8c2ee8fc7dd6152bf02c071d75035ade"
          assert gt["workflowRunId"] == 33208183041
          assert gt["workflowRunNumber"] == 1
          assert gt["workflowRunAttempt"] == 1
          assert gt["jobId"] == 98974530460
          assert gt["workflowGitBlob"] == "38cd491453c618f595d42bb6d42e87e478f35f0e"
          assert gt["terminalFreezeGitBlob"] == "5ff59c993698b00df3503c6e22e036f181140aa4"
          assert gt["neverRearmV161"] is True

          assert prereg["structuralQcIdentity"]["gitBlob"] == "2146cf9f7b9e92ce704ef2118e711bd42ae2e093"
          assert prereg["structuralQcIdentity"]["sha256"] == "ba17ac241d438e15d13f0d45a93194e97151868805541dc252ea41caa1ae34ba"
          assert prereg["structuralQcIdentity"]["validation"] == "PASS"
          assert prereg["structuralQcIdentity"]["errors"] == 0

          assert prereg["frozenScorerIdentity"]["gitBlob"] == "9644e65719fbd361a9b39778ae9950c5e983e855"
          assert prereg["frozenProfessionalReferenceIdentity"]["gitBlob"] == "2fbed60b543c0488934d8642c488aa06bf31bbf5"
          assert prereg["frozenProfessionalReferenceIdentity"]["sha256"] == "b39a203aec3f45800891fe4eca156e37e7571b91ea5c4ccc41b30bbc95fc89e7"

          contract = prereg["scoreContract"]
          assert contract["scoringDevice"] == "cpu"
          assert contract["scoreWorkflowPath"] == ".github/workflows/v161-score.yml"
          assert contract["scoreReceiptPath"] == "debug/v161-cpu-autonomous/reference-score.json"
          assert contract["scoreTerminalPath"] == "debug/v161-cpu-autonomous/score-terminal-freeze.json"
          assert contract["workflowCreationIsSoleTrigger"] is True
          assert contract["expectedWorkflowRunCount"] == 1
          assert contract["expectedRunNumber"] == 1
          assert contract["expectedRunAttempt"] == 1
          assert contract["maximumProfessionalReferenceScoreExecutions"] == 1
          for key in (
              "rerunForbidden", "secondArmForbidden", "duplicateRunForbidden",
              "candidateMutationForbidden", "candidateReplacementForbidden",
              "candidateReQcForbidden", "candidateRegenerationForbidden",
              "thresholdSweepForbidden", "variantSelectionForbidden",
              "humanCorrectionForbidden", "postScoreRetuneForbidden",
              "postScoreRescoreForbidden", "workflowMustSelfDeleteAfterSingleScore",
              "workflowMustSelfSealScoreReceipt",
              "assistantOrManualBranchWritesWhileScoreWorkflowActiveForbidden",
          ):
              assert contract[key] is True, key

          gates = prereg["scoreGates"]
          assert gates["guitarTimingAwarePitchF1Minimum"] == 0.8
          assert gates["bassTimingAwarePitchF1Minimum"] == 0.8
          assert gates["bothMustPassToProceedToRoleStringFretTechniquePdfPhase"] is True
          assert gates["candidateConsumedRegardlessOfPassFail"] is True

          safety = prereg["preScoreSafety"]
          assert safety["professionalReferenceUsedForV161ScoreYet"] is False
          assert safety["referenceFacingScoreCalls"] == 0
          assert safety["candidateModifiedAfterStructuralPass"] is False
          assert safety["generationRerun"] is False
          assert safety["timebaseQcRerun"] is False
          assert safety["structuralQcRerun"] is False
          assert safety["gpuExecutions"] == 0
          assert safety["cudaExecutions"] == 0
          assert safety["modalExecutions"] == 0
          assert safety["mainOrProductionModified"] is False
          assert safety["scoreReceiptMustNotExistAtSeal"] is True
          assert safety["scoreTerminalMustNotExistAtSeal"] is True
          assert safety["scoreWorkflowMustNotExistAtSeal"] is True
          PY

      - name: Execute frozen scorer exactly once
        id: score
        shell: bash
        run: |
          set -u
          printf '%s\n' "SCORE_RUNTIME_FAIL" > /tmp/v161-score-outcome
          printf '%s\n' "1" > /tmp/v161-score-execution-count

          set +e
          python "$SCORER" "$CANDIDATE" "$REFERENCE" --output "$SCORE" > /tmp/v161-score-stdout.json
          rc=$?
          set -e
          printf '%s\n' "$rc" > /tmp/v161-score-rc

          if [ "$rc" -ne 0 ]; then
            exit 0
          fi
          if [ ! -s "$SCORE" ]; then
            exit 0
          fi

          if ! python - <<'PY'
          import hashlib, json
          from pathlib import Path

          score = json.loads(Path("debug/v161-cpu-autonomous/reference-score.json").read_text())
          assert score["schema"] == "dadrock.tabs.v154.cpu-front-end-score.v1"
          assert score["song"] == {"artist": "Lenny Kravitz", "title": "Are You Gonna Go My Way"}
          assert score["gates"]["combinedGuitarTimingAwarePitchF1Target"] == 0.80
          assert score["gates"]["bassTimingAwarePitchF1Target"] == 0.80
          assert score["gates"]["primaryToleranceGridSteps"] == 0.50
          assert score["gates"]["grossToleranceGridSteps"] == 2.00
          assert score["policy"]["scoringWritesNoCorrections"] is True
          assert score["policy"]["postScoreRetuningOfSameGeneratedOutputForbidden"] is True

          guitar = float(score["combinedGuitar"]["primaryTimingAwarePitch"]["f1"])
          bass = float(score["bass"]["primaryTimingAwarePitch"]["f1"])
          assert 0.0 <= guitar <= 1.0
          assert 0.0 <= bass <= 1.0

          candidate_sha = hashlib.sha256(Path("debug/v161-cpu-autonomous/generated.json").read_bytes()).hexdigest()
          assert candidate_sha == "75c4edd6560ee832bf7df4799c4e9389a7424e7056ac5f3cd5a9e07fc254996a"

          outcome = "SCORE_GATE_PASS" if guitar >= 0.80 and bass >= 0.80 else "SCORE_GATE_FAIL"
          Path("/tmp/v161-score-outcome").write_text(outcome + "\n")
          PY
          then
            printf '%s\n' "SCORE_RUNTIME_FAIL" > /tmp/v161-score-outcome
            exit 0
          fi

          test "$(git hash-object "$CANDIDATE")" = "52178705ef3830f6849b71037cd283877aa7655f"
          test "$(sha256sum "$CANDIDATE" | awk '{print $1}')" = "75c4edd6560ee832bf7df4799c4e9389a7424e7056ac5f3cd5a9e07fc254996a"
          test "$(git hash-object "$SCORER")" = "9644e65719fbd361a9b39778ae9950c5e983e855"
          test "$(git hash-object "$REFERENCE")" = "2fbed60b543c0488934d8642c488aa06bf31bbf5"

      - name: Freeze score result and self-seal
        if: ${{ always() && github.run_number == 1 && github.run_attempt == 1 }}
        shell: bash
        env:
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
        run: |
          set -euo pipefail

          if [ "$GUARD_OUTCOME" = "success" ]; then
            outcome="$(cat /tmp/v161-score-outcome 2>/dev/null || printf '%s' 'SCORE_RUNTIME_FAIL')"
            score_execution_count="$(cat /tmp/v161-score-execution-count 2>/dev/null || printf '%s' '1')"
          else
            outcome="PRE_SCORE_GUARD_FAIL"
            score_execution_count="0"
          fi

          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"

          OUTCOME="$outcome" SCORE_EXECUTION_COUNT="$score_execution_count" python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          score_path = Path("debug/v161-cpu-autonomous/reference-score.json")

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def git_blob(path):
              return subprocess.check_output(["git", "hash-object", path], text=True).strip()

          outcome = os.environ["OUTCOME"]
          execution_count = int(os.environ["SCORE_EXECUTION_COUNT"])
          score = None
          guitar_f1 = None
          bass_f1 = None
          score_sha = None
          score_git_blob = None

          if score_path.is_file():
              score = json.loads(score_path.read_text())
              score_sha = sha256(score_path)
              score_git_blob = git_blob(score_path)
              guitar_f1 = float(score["combinedGuitar"]["primaryTimingAwarePitch"]["f1"])
              bass_f1 = float(score["bass"]["primaryTimingAwarePitch"]["f1"])

          if outcome in {"SCORE_GATE_PASS", "SCORE_GATE_FAIL"}:
              assert execution_count == 1
              assert score is not None
              assert score["schema"] == "dadrock.tabs.v154.cpu-front-end-score.v1"
              assert score["gates"]["combinedGuitarTimingAwarePitchF1Target"] == 0.80
              assert score["gates"]["bassTimingAwarePitchF1Target"] == 0.80
              assert outcome == ("SCORE_GATE_PASS" if guitar_f1 >= 0.80 and bass_f1 >= 0.80 else "SCORE_GATE_FAIL")
          elif outcome == "SCORE_RUNTIME_FAIL":
              assert execution_count == 1
          elif outcome == "PRE_SCORE_GUARD_FAIL":
              assert execution_count == 0
              assert score is None
          else:
              raise AssertionError(outcome)

          freeze = {
              "schema": "dadrock.tabs.v161.professional-reference-score-terminal.v1",
              "version": "V161",
              "status": "TERMINAL",
              "outcome": outcome,
              "workflowRunId": int(os.environ["GITHUB_RUN_ID"]),
              "workflowRunNumber": int(os.environ["GITHUB_RUN_NUMBER"]),
              "workflowRunAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflowHeadSha": os.environ["GITHUB_SHA"],
              "scoreWorkflowGitBlob": git_blob(".github/workflows/v161-score.yml"),
              "scorePreregistrationGitBlob": "8f50b65d023bd5469935ed3ca70c115bf0b86dda",
              "candidateGitBlob": "52178705ef3830f6849b71037cd283877aa7655f",
              "candidateSha256": "75c4edd6560ee832bf7df4799c4e9389a7424e7056ac5f3cd5a9e07fc254996a",
              "structuralQcGitBlob": "2146cf9f7b9e92ce704ef2118e711bd42ae2e093",
              "generationTerminalGitBlob": "5ff59c993698b00df3503c6e22e036f181140aa4",
              "scorerGitBlob": "9644e65719fbd361a9b39778ae9950c5e983e855",
              "professionalReferenceGitBlob": "2fbed60b543c0488934d8642c488aa06bf31bbf5",
              "professionalReferenceSha256": "b39a203aec3f45800891fe4eca156e37e7571b91ea5c4ccc41b30bbc95fc89e7",
              "scoreExecutionCount": execution_count,
              "scoreReportExists": score is not None,
              "scoreReportGitBlob": score_git_blob,
              "scoreReportSha256": score_sha,
              "combinedGuitarTimingAwarePitchF1": guitar_f1,
              "bassTimingAwarePitchF1": bass_f1,
              "gates": {
                  "combinedGuitarMinimum": 0.80,
                  "bassMinimum": 0.80,
                  "bothMustPass": True,
              },
              "eligibleForRoleStringFretTechniquePdfPhase": outcome == "SCORE_GATE_PASS",
              "candidateConsumed": True,
              "scoreOpportunityConsumed": True,
              "neverRerunOrRescoreV161": True,
              "safety": {
                  "candidateModified": False,
                  "candidateRegenerated": False,
                  "candidateReQc": False,
                  "thresholdSweep": False,
                  "variantSelection": False,
                  "humanCorrection": False,
                  "postScoreRetune": False,
                  "professionalReferenceUsedForScoringOnly": execution_count == 1,
                  "referenceFacingScoreCalls": execution_count,
                  "gpuUsed": False,
                  "cudaUsed": False,
                  "modalUsed": False,
                  "mainOrProductionModified": False,
              },
          }
          assert freeze["workflowRunNumber"] == 1
          assert freeze["workflowRunAttempt"] == 1
          Path("debug/v161-cpu-autonomous/score-terminal-freeze.json").write_text(
              json.dumps(freeze, indent=2, sort_keys=True, allow_nan=False) + "\n"
          )
          PY

          rm .github/workflows/v161-score.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- debug/v161-cpu-autonomous .github/workflows/v161-score.yml

          changed="$(git diff --cached --name-only)"
          test -n "$changed"
          if echo "$changed" | grep -Ev '^debug/v161-cpu-autonomous/(reference-score\.json|score-terminal-freeze\.json)$|^\.github/workflows/v161-score\.yml$'; then
            echo "Unexpected path in V161 score terminal commit" >&2
            exit 1
          fi

          case "$outcome" in
            SCORE_GATE_PASS)
              message="research: freeze sole V161 professional-reference score PASS [skip ci]"
              ;;
            SCORE_GATE_FAIL)
              message="research: freeze sole V161 professional-reference score FAIL [skip ci]"
              ;;
            *)
              message="research: freeze terminal V161 professional-reference scoring failure [skip ci]"
              ;;
          esac

          git commit -m "$message"
          git push origin HEAD:"$BRANCH"

          if [ "$outcome" = "PRE_SCORE_GUARD_FAIL" ] || [ "$outcome" = "SCORE_RUNTIME_FAIL" ]; then
            exit 1
          fi
