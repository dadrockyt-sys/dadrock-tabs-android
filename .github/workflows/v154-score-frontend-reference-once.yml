name: V154 score frontend reference exactly once

on:
  push:
    branches: [v143-contextual-prune-lobo]
    paths: [.github/workflows/v154-score-frontend-reference-once.yml]

permissions:
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo

# Armed after pre-score checkpoint a5fa74575f503e08fa8b39fc129d4fe31cb8dbcc.
jobs:
  score-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 1
      - name: Run guarded frozen CPU score exactly once
        run: python validation/v154_cpu_multitrack/run_frontend_reference_score_once.py
      - name: Commit immutable score receipt and self-seal
        run: |
          set -euo pipefail
          rm .github/workflows/v154-score-frontend-reference-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/v154-cpu-autonomous/v154-frontend-reference-score/score.json \
                  debug/v154-cpu-autonomous/v154-frontend-reference-score/score-receipt.json \
                  .github/workflows/v154-score-frontend-reference-once.yml
          git commit -m "validation: freeze V154 frontend reference score [skip ci]"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
