name: V143 Demucs CPU Thread Policy Probe

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - '.github/workflows/v143-demucs-cpu-thread-policy-probe.yml'

concurrency:
  group: v143-demucs-cpu-thread-policy-probe
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODAL_ENVIRONMENT: main
  AUDIO_URL: https://raw.githubusercontent.com/dadrockyt-sys/dadrock-tabs-android/main/public/jimmy-paige-midterm-v1/gomyway-midterm-source.m4a
  AUDIO_BLOB_SHA: 4dd709e3fa177b4daeed71ca97f0199757729d4b
  MAIN_SHA: bb992d901e78ab19645f8edc8e330d5a142ebd8e
  PYTHONUNBUFFERED: '1'

jobs:
  demucs-cpu-thread-policy-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Enforce isolated diagnostic boundary
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$ACTUAL_MAIN" = "$MAIN_SHA"
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          test -f analyzer/v143_demucs_perf_probe.py
          test -f analyzer/v143_demucs_perf_probe_cli.py
          python3 -m py_compile \
            analyzer/v143_demucs_perf_probe.py \
            analyzer/v143_demucs_perf_probe_cli.py
          grep -q 'dadrock-v143-demucs-perf-probe' analyzer/v143_demucs_perf_probe.py
          grep -q 'referenceFacingAccuracyScored.*False' analyzer/v143_demucs_perf_probe.py
          grep -q 'referenceScoreCalls.*0' analyzer/v143_demucs_perf_probe.py
          grep -q 'gpu="L4"' analyzer/v143_demucs_perf_probe.py
          grep -q 'device.*cpu' analyzer/v143_demucs_perf_probe.py
          echo "diagnosticSourceCommit=$GITHUB_SHA"
          echo "productionWorkerChanged=false"
          echo "productionBridgeChanged=false"
          echo "vercelChanged=false"
          echo "referenceFacingAccuracyScored=false"
          echo "referenceScoreCalls=0"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Modal client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install 'modal==1.3.3' >/dev/null
          modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET" >/dev/null
          modal --version

      - name: Deploy isolated diagnostic app only
        shell: bash
        run: |
          set -euo pipefail
          modal deploy --env main analyzer/v143_demucs_perf_probe.py

      - name: Compare frozen CPU1 against CPU4 on short Gomyway clip
        shell: bash
        run: |
          set -euo pipefail
          OUT=debug/v143-contextual-prune/demucs-cpu-thread-policy-probe
          mkdir -p "$OUT"
          python - <<'PY'
          import json
          import os
          import modal
          from pathlib import Path

          fn = modal.Function.from_name(
              'dadrock-v143-demucs-perf-probe',
              'compare_cpu_thread_policy',
              environment_name='main',
          )
          result = fn.remote(os.environ['AUDIO_URL'], 12.0)
          if not isinstance(result, dict):
              raise SystemExit('Probe returned non-dict aggregate')

          result['diagnosticSourceCommit'] = os.environ.get('GITHUB_SHA')
          result['audioBlobSha'] = os.environ['AUDIO_BLOB_SHA']
          result['productionWorkerChanged'] = False
          result['productionBridgeChanged'] = False
          result['vercelChanged'] = False

          out = Path('debug/v143-contextual-prune/demucs-cpu-thread-policy-probe')
          (out / 'summary.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2))

          if result.get('referenceFacingAccuracyScored') is not False:
              raise SystemExit('Unexpected reference scoring flag')
          if result.get('referenceScoreCalls') != 0:
              raise SystemExit('Unexpected reference score calls')
          if result.get('rawAudioRetained') is not False or result.get('stemBytesRetained') is not False:
              raise SystemExit('Probe retention boundary failed')
          if result.get('frozenRepeatable') is not True:
              raise SystemExit('Frozen short-clip baseline was not byte-repeatable')
          if result.get('candidateRepeatable') is not True:
              raise SystemExit('CPU4 candidate was not byte-repeatable')
          PY

      - name: Preserve aggregate probe evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-demucs-cpu-thread-policy-probe
          path: debug/v143-contextual-prune/demucs-cpu-thread-policy-probe/summary.json
          if-no-files-found: warn
          retention-days: 14
