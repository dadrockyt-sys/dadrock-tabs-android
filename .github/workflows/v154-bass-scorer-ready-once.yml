name: V154 Bass scorer-ready once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v154-bass-scorer-ready-once.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0
      - name: Build frozen candidate-blind Bass scorer rows
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/v154_cpu_multitrack/build_bass_scorer_ready.py
      - name: Commit immutable Bass scorer rows and seal workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dadrock-v154-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/v154-professional-references/scorer-ready/bass-scorer-ready.json
          git add research/v154-professional-references/scorer-ready/bass-scorer-ready-receipt.json
          git rm .github/workflows/v154-bass-scorer-ready-once.yml
          git commit -m "v154: freeze Bass scorer-ready reference"
          git push origin HEAD:v143-contextual-prune-lobo
