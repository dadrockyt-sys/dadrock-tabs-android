name: V167 aggregate Guitar recovery diagnosis

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v167-guitar-recovery-aggregate-analysis.yml

permissions:
  contents: write

concurrency:
  group: v167-guitar-recovery-aggregate-analysis-once
  cancel-in-progress: false

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: 17ecb96f8eddd8122e5074bc66428b954070e036
  REPORT: debug/v167-single-song-calibration/upstream-recovery-rule-sweep.json
  POOL: debug/v167-single-song-calibration/nearmiss-evidence-pool.json
  ANALYZER: validation/v167_single_song_calibration/analyze_guitar_recovery_sweep_v167.py
  OUTPUT: debug/v167-single-song-calibration/guitar-recovery-sweep-aggregate-analysis.json
  RECEIPT: debug/v167-single-song-calibration/guitar-recovery-sweep-aggregate-analysis-receipt.json
  CUDA_VISIBLE_DEVICES: ""
  PYTHONHASHSEED: "0"

jobs:
  analyze-once:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact analysis arm
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.21'

      - name: Verify aggregate-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v167-guitar-recovery-aggregate-analysis.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"
          test "$(git hash-object "$REPORT")" = "324f1f4e68951ac8653c51c8a436e4d35e5dc16b"
          test "$(git hash-object "$POOL")" = "aa7da3a55344b1418a291f30fab9ca55858fc094"
          test "$(git hash-object "$ANALYZER")" = "c6fedb0f5b8404ff472495362e7b37ecdf734f15"
          test "$(git hash-object docs/checkpoints/CURRENT_STATE.md)" = "da2b583f1f1049c0b8b247d4181ec9e651b1ef32"
          test ! -e "$OUTPUT"
          test ! -e "$RECEIPT"
          python -m py_compile "$ANALYZER"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          checks={
            'debug/v167-single-song-calibration/upstream-recovery-rule-sweep.json':'1bcc5eca05df31270ff7ff638cca6def3166a0e5084c4874d70d710d4696836f',
            'debug/v167-single-song-calibration/nearmiss-evidence-pool.json':'1c983784c2d12a22437a80387525789bcf55a2f4e4a5c7a96608c575bf709673',
          }
          for path,expected in checks.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==expected
          text=Path('validation/v167_single_song_calibration/analyze_guitar_recovery_sweep_v167.py').read_text()
          for forbidden in ('frontend-reference-payload.json','score_frontend_reference.py'):
              assert forbidden not in text,forbidden
          PY

      - name: Analyze terminal Guitar sweep and reference-blind structure
        shell: bash
        run: |
          set -euo pipefail
          python "$ANALYZER" --report "$REPORT" --pool "$POOL" --output "$OUTPUT"
          python - <<'PY'
          import json
          a=json.load(open('debug/v167-single-song-calibration/guitar-recovery-sweep-aggregate-analysis.json'))
          assert a['status']=='TERMINAL_SWEEP_AGGREGATE_ANALYSIS_FROZEN'
          assert a['nonBaselineCount']==48
          assert a['nonBaselineVariantsBeatingBaseline']==0
          assert a['policy']['professionalReferenceReadByAnalysis'] is False
          assert a['policy']['scorerReadByAnalysis'] is False
          assert a['policy']['newReferenceFacingScoreCalls']==0
          assert a['policy']['perEventReferenceMatchAssignmentsRead'] is False
          assert a['policy']['newRuleSelectedByThisAnalysis'] is False
          assert a['referenceBlindStructuralEvidence']['siteCount']==272
          assert a['referenceBlindStructuralEvidence']['candidateCount']==13328
          print('best nonbaseline:',json.dumps(a['bestNonBaseline'],sort_keys=True))
          print('correlations:',json.dumps(a['correlationsAcross48WholeRules'],sort_keys=True))
          print('template ratio:',json.dumps(a['referenceBlindStructuralEvidence']['topInactiveToMaxActiveTemplateScoreRatio'],sort_keys=True))
          print('intervals:',json.dumps(a['referenceBlindStructuralEvidence']['nearestActiveSemitoneDistanceHistogramForTopInactive'],sort_keys=True))
          PY

      - name: Freeze aggregate analysis and self-seal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          output=Path('debug/v167-single-song-calibration/guitar-recovery-sweep-aggregate-analysis.json')
          receipt=Path('debug/v167-single-song-calibration/guitar-recovery-sweep-aggregate-analysis-receipt.json')
          a=json.loads(output.read_text())
          r={
            'schema':'dadrock.tabs.v167.guitar-recovery-sweep-aggregate-analysis-receipt.v1',
            'version':'V167',
            'status':'GUITAR_RECOVERY_AGGREGATE_ANALYSIS_FROZEN',
            'classification':'SINGLE_SONG_TRAINING_CALIBRATION_ONLY',
            'workflowRunId':int(os.environ['GITHUB_RUN_ID']),
            'workflowRunNumber':int(os.environ['GITHUB_RUN_NUMBER']),
            'workflowRunAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'workflowHeadSha':os.environ['GITHUB_SHA'],
            'analysisSha256':hashlib.sha256(output.read_bytes()).hexdigest(),
            'analysisGitBlob':subprocess.check_output(['git','hash-object',str(output)],text=True).strip(),
            'bestNonBaseline':a['bestNonBaseline'],
            'nonBaselineVariantsBeatingBaseline':a['nonBaselineVariantsBeatingBaseline'],
            'correlationsAcross48WholeRules':a['correlationsAcross48WholeRules'],
            'referenceBlindStructuralEvidenceSummary':{
              'siteCount':a['referenceBlindStructuralEvidence']['siteCount'],
              'candidateCount':a['referenceBlindStructuralEvidence']['candidateCount'],
              'sitesWithoutAnyBasicPitchActiveMidi':a['referenceBlindStructuralEvidence']['sitesWithoutAnyBasicPitchActiveMidi'],
              'sitesWithAtLeastOneInactiveEligibleCandidateAtFirstGridFloor':a['referenceBlindStructuralEvidence']['sitesWithAtLeastOneInactiveEligibleCandidateAtFirstGridFloor'],
              'topInactiveToMaxActiveTemplateScoreRatio':a['referenceBlindStructuralEvidence']['topInactiveToMaxActiveTemplateScoreRatio'],
              'topVsSecondInactiveTemplateRankGap':a['referenceBlindStructuralEvidence']['topVsSecondInactiveTemplateRankGap'],
              'nearestActiveSemitoneDistanceHistogramForTopInactive':a['referenceBlindStructuralEvidence']['nearestActiveSemitoneDistanceHistogramForTopInactive'],
            },
            'policy':a['policy'],
          }
          receipt.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          rm .github/workflows/v167-guitar-recovery-aggregate-analysis.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$OUTPUT" "$RECEIPT" .github/workflows/v167-guitar-recovery-aggregate-analysis.yml
          changed="$(git diff --cached --name-only)"
          if echo "$changed" | grep -Ev '^debug/v167-single-song-calibration/guitar-recovery-sweep-aggregate-analysis(-receipt)?\.json$|^\.github/workflows/v167-guitar-recovery-aggregate-analysis\.yml$'; then
            echo 'Unexpected aggregate-analysis path' >&2
            exit 1
          fi
          git commit -m "research: freeze V167 Guitar recovery aggregate diagnosis [skip ci]"
          git push origin HEAD:"$BRANCH"
