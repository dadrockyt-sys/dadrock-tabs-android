name: Astra S13 offline package verification V1

on:
  push:
    branches: [astra-work]
    paths:
      - 'astra_backend/synthetic/s13_pilot_v1.py'
      - 'astra_backend/synthetic/test_s13_pilot_v1.py'
      - '.github/workflows/astra-s13-offline-package-verification-v1.yml'
      - 'docs/astra/SYNTHETIC_S13_RUN_SCOPE_V1.json'
      - 'docs/astra/SYNTHETIC_S13_SPEC_V1.json'
      - 'docs/astra/SYNTHETIC_S13_EXECUTION_HISTORY_V1.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'
      - name: Install pinned runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Focused admission tests
        env:
          PYTHONPATH: astra_backend
        run: pytest -q astra_backend/synthetic/test_s13_pilot_v1.py
      - name: Verify frozen scope and complete source pins
        env:
          PYTHONPATH: astra_backend
        run: |
          python -m synthetic.s13_pilot_v1 verify-scope \
            --scope docs/astra/SYNTHETIC_S13_RUN_SCOPE_V1.json \
            --history docs/astra/SYNTHETIC_S13_EXECUTION_HISTORY_V1.json
      - name: Generate canonical S13 datasets without optimizer work
        env:
          PYTHONPATH: astra_backend
        run: python -m synthetic.s13_pilot_v1 prepare-only --out-dir /tmp/astra-s13-preparation-v1
      - name: Assert preparation is model-free
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/astra-s13-preparation-v1/preparation-summary.json'))
          assert p['optimizerSteps']==0
          assert p['modelRun'] is False
          assert not any(p['guards'].values())
          print(json.dumps(p,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-s13-offline-package-verification-v1
          path: /tmp/astra-s13-preparation-v1
          if-no-files-found: error
          retention-days: 30
