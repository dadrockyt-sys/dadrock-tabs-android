name: V143 V5 Final Professional Holdout

# MANUAL ONLY. Creating/editing this workflow must never open the holdout.
# Once a final-result sentinel exists on the branch, every future dispatch/rerun refuses
# to open professional source material again.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v143-v5-final-professional-holdout-once
  cancel-in-progress: false

jobs:
  final-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact dispatched revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Refuse any second holdout opening
        shell: bash
        run: |
          set -euo pipefail
          result='debug/v143-contextual-prune/v5-professional-pdf/final-professional-holdout-result.json'
          git fetch origin v143-contextual-prune-lobo
          if git cat-file -e "origin/v143-contextual-prune-lobo:${result}" 2>/dev/null; then
            echo 'Final V5 professional holdout already has a persisted result; refusing any second opening.' >&2
            exit 90
          fi

      - name: Revalidate immutable V5 before any reference access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .final/freeze .final/results
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = '7f72f8ed9b14af8bc93e95544195204d99c6bec1'
          echo '7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2  debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json' | sha256sum -c -
          echo 'f4c1238e868cadfb90b8a359b1555b0b90e7740b9ebaa276aa394c8991f37ce5  debug/v143-contextual-prune/v5-professional-pdf/v5-rhythm-shadow.pdf' | sha256sum -c -
          python analyzer/validate_v143_v5_source_only_frozen_candidate.py \
            debug/v143-contextual-prune/v5-professional-pdf/source-only-frozen-candidate-manifest.json \
            --output .final/results/source-only-validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('debug/v143-contextual-prune/v5-professional-pdf/scorer-preflight-report.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('passed') is True
          assert d.get('failedChecks') == []
          assert d.get('professionalReferenceUsed') is False
          assert d.get('professionalHoldoutOpened') is False
          assert d.get('referencePayloadOpened') is False
          assert d.get('candidateModified') is False
          assert d.get('canonicalEventSha256') == '7ed5166a73793e3a40c9a21f6532fee5ba784e43ef4180727404a37a038fb6d1'
          assert d.get('pdfEventSha256') == '7ed5166a73793e3a40c9a21f6532fee5ba784e43ef4180727404a37a038fb6d1'
          assert float(d.get('pdfEventFidelity')) == 1.0
          assert int(d.get('eventCount')) == 1209
          assert int(d.get('uniqueMeasureCount')) == 113
          PY

      - name: Rebuild exact scorer freeze and PDF-event identity before reference access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('debug/v143-contextual-prune/v5-professional-pdf')
          m=json.loads((root/'source-only-frozen-candidate-manifest.json').read_text(encoding='utf-8'))
          s=json.loads((root/'v5-render-stream.json').read_text(encoding='utf-8'))
          assert len(s.get('events') or []) == 1209
          payload={
            'instrument':'rhythm',
            'renderEvents':s['events'],
            'tempoBpm':(m.get('boundaries') or {}).get('tempo'),
            'timeSignature':'4/4',
            'tuning':'E Standard',
            'structuredMode':True,
            'sourceAudioSha256':(m.get('authorizedSource') or {}).get('approvedSourceSha256'),
            'referenceFree':True,
            'professionalReferenceUsed':False,
            'referenceRuntimeInputUsed':False,
            'runtimeLabelsRequired':False,
            'v143RuntimeSafetyVerified':True,
          }
          Path('.final/v5-scorer-freeze-input.json').write_text(json.dumps(payload,separators=(',',':'))+'\n',encoding='utf-8')
          PY
          python validation/rhythm_holdout/freeze_rhythm_analysis.py \
            .final/v5-scorer-freeze-input.json .final/freeze --source-commit "${GITHUB_SHA}" \
            > .final/results/freeze.log
          cp lib/v143RenderContract.js .final/v143RenderContract.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { validateV143RenderEvents } from './.final/v143RenderContract.mjs';
          const stream=JSON.parse(await fs.readFile('debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json','utf8'));
          const events=validateV143RenderEvents(stream.events||[]);
          if(events.length!==1209) throw new Error(`expected 1209 renderer events, got ${events.length}`);
          await fs.writeFile('.final/renderer-event-evidence.json',JSON.stringify({
            schemaVersion:1,
            renderEvents:events,
            runtimeSafetyVerified:true,
            runtimeLabelsRequired:false,
            referenceOpened:false,
            professionalReferenceUsed:false,
            productionModified:false,
          })+'\n');
          NODE
          python validation/rhythm_holdout/verify_pdf_event_fidelity.py \
            .final/freeze .final/renderer-event-evidence.json \
            > .final/results/pdf-event-fidelity.log
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'validation/rhythm_holdout')
          import score_rhythm_holdout as scorer
          manifest,events,_=scorer.validate_pre_reference(Path('.final/freeze'))
          assert len(events)==1209
          assert len({int(e['measure']) for e in events})==113
          assert manifest['eventSha256']=='7ed5166a73793e3a40c9a21f6532fee5ba784e43ef4180727404a37a038fb6d1'
          assert manifest['pdfEventSha256']==manifest['eventSha256']
          assert float(manifest['pdfEventFidelity'])==1.0
          print('FINAL PRE-REFERENCE V5 GATE GREEN; HOLDOUT STILL CLOSED')
          PY

      - name: Open exact immutable professional source once, verify completeness, and score
        id: final_score
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .final/source validation/rhythm_holdout/reference .final/results debug/v143-contextual-prune/v5-professional-pdf
          python - <<'PY'
          from __future__ import annotations
          from fractions import Fraction
          from pathlib import Path
          import gzip, hashlib, json, os, subprocess, traceback, urllib.request

          RESULT=Path('debug/v143-contextual-prune/v5-professional-pdf/final-professional-holdout-result.json')
          REF=Path('validation/rhythm_holdout/reference/professional-rhythm-structured-source-v2.json')
          SOURCE=Path('.final/source/rhythm-track.json')
          IMAGE=Path('.final/source/Professionalexample.jpg')
          EXPECTED_CANONICAL='7ed5166a73793e3a40c9a21f6532fee5ba784e43ef4180727404a37a038fb6d1'
          EXPECTED_STRUCTURED='18cdb4f8afb49562aac5b600730384636070d6ca8650823e759276a81ee4afc8'
          EXPECTED_REFERENCE='18fd868ae960dfcdd1ffb0110f1a9dfd8acc2ffeb46e247d1116cd54291526ac'
          EXPECTED_IMAGE='aca2da3e8d551b2fd82b4ab3ecafa0c8932d6c0a27b54b6213ffc990ca08a9a9'
          base={
            'schemaVersion':1,
            'classification':'v143-v5-final-professional-holdout-result',
            'runId':int(os.environ['GITHUB_RUN_ID']),
            'runAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'triggerSha':os.environ['GITHUB_SHA'],
            'finalImmutableHoldoutAttempt':True,
            'professionalHoldoutOpened':True,
            'candidateModified':False,
            'candidateSelectionAllowedAfterHoldout':False,
            'tuningAllowedAfterHoldout':False,
            'thresholdAdjustmentAllowedAfterHoldout':False,
            'modalInvoked':False,
            'productionModified':False,
            'freezeReadyChanged':False,
            'canonicalEventSha256':EXPECTED_CANONICAL,
            'rawV5RenderStreamSha256':'7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2',
            'currentPdfSha256':'f4c1238e868cadfb90b8a359b1555b0b90e7740b9ebaa276aa394c8991f37ce5',
            'minimumProfessionalScore':0.99,
            'maximumCriticalMismatches':0,
            'requiredPdfEventFidelity':1.0,
          }
          phase='opening-source'
          opened=False
          try:
              # Candidate/PDF gate is re-read one last time before the first source byte.
              fm=json.loads(Path('.final/freeze/rhythm-freeze-manifest.json').read_text(encoding='utf-8'))
              if fm.get('eventSha256')!=EXPECTED_CANONICAL or fm.get('pdfEventSha256')!=EXPECTED_CANONICAL or float(fm.get('pdfEventFidelity') or 0)!=1.0:
                  raise RuntimeError('pre-reference manifest changed before source opening')

              # First professional source access: immutable committed image at exact historical commit.
              image_url='https://raw.githubusercontent.com/dadrockyt-sys/dadrock-tabs-android/e0f91e74c815b9ecdf0a72fae6d1523414b34577/public/Professionalexample.jpg'
              req=urllib.request.Request(image_url,headers={'User-Agent':'dadrock-v143-final-holdout'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  image_bytes=r.read()
              opened=True
              IMAGE.write_bytes(image_bytes)
              image_sha=hashlib.sha256(image_bytes).hexdigest()
              if image_sha!=EXPECTED_IMAGE:
                  raise RuntimeError(f'professional image SHA mismatch: {image_sha}')

              phase='fetching-exact-structured-source'
              hosts=['dqsljvtekg760','d34shlm8p2ums2','d3cqchs6g3b5ew']
              part=None
              errors=[]
              for host in hosts:
                  url=f'https://{host}.cloudfront.net/243/7868948/v0-3-2-TvYYK-mMQgzBsDxG/3.json'
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*','Accept-Encoding':'gzip'})
                      with urllib.request.urlopen(req,timeout=30) as r:
                          raw=r.read()
                      if raw[:2]==b'\x1f\x8b': raw=gzip.decompress(raw)
                      candidate=json.loads(raw)
                      normalized=(json.dumps(candidate,separators=(',',':'))+'\n').encode('utf-8')
                      digest=hashlib.sha256(normalized).hexdigest()
                      if digest==EXPECTED_STRUCTURED:
                          part=candidate
                          SOURCE.write_bytes(normalized)
                          break
                      errors.append(f'{host}:sha={digest}')
                  except Exception as exc:
                      errors.append(f'{host}:{type(exc).__name__}')
              if part is None:
                  raise RuntimeError('exact structured source unavailable/mismatched: '+';'.join(errors))
              if part.get('songId')!=243 or int(part.get('revisionId') or 0)!=7868948 or len(part.get('measures') or [])!=113:
                  raise RuntimeError('structured source identity/measure count mismatch')
              if part.get('name')!='Craig Ross | 1953 Gibson Les Paul Goldtop | Rhythm Guitar':
                  raise RuntimeError('structured source track name mismatch')
              tuning=part.get('tuning')
              if tuning!=[64,59,55,50,45,40]:
                  raise RuntimeError(f'unexpected tuning {tuning!r}')

              phase='building-exact-reference'
              measures=[]; onset_count=note_count=populated=0
              for mn,m in enumerate(part['measures'],1):
                  by={}; section=(m.get('marker') or {}).get('text') if isinstance(m.get('marker'),dict) else None
                  for voice in m.get('voices') or []:
                      pos=Fraction(0,1)
                      for beat in voice.get('beats') or []:
                          step=max(0,min(15,int(round(float(pos*16)))))
                          for n in beat.get('notes') or []:
                              if not isinstance(n,dict) or n.get('rest') or n.get('dead') or n.get('tie'): continue
                              s=n.get('string'); f=n.get('fret')
                              if isinstance(s,int) and isinstance(f,int) and 0<=s<=5 and 0<=f<=36:
                                  by.setdefault(step,set()).add((s,f,int(tuning[s])+f))
                          a,d=beat.get('duration') or [1,4]
                          pos += Fraction(int(a),int(d))
                  events=[]
                  for step in sorted(by):
                      notes=[{'stringIndex':s,'fret':f,'midi':midi} for s,f,midi in sorted(by[step])]
                      if notes:
                          events.append({'step':step,'notes':notes}); onset_count+=1; note_count+=len(notes)
                  if events: populated+=1
                  row={'measure':mn,'events':events}
                  if section: row['section']=section
                  measures.append(row)
              if (onset_count,note_count,populated)!=(603,946,104):
                  raise RuntimeError(f'reference counts changed: {(onset_count,note_count,populated)}')
              ref={
                'schemaVersion':1,'instrument':'rhythm','holdout':True,'completeReference':True,
                'transcribedFromCompleteSource':True,
                'source':{
                  'kind':'professional-human-tab','title':'Are You Gonna Go My Way','artist':'Lenny Kravitz',
                  'provenance':'Exact scorer-only structured extraction of immutable human-written revision 7868948 corresponding to Professionalexample.jpg',
                  'pageCount':8,'sourceSha256':EXPECTED_IMAGE,'completeSource':True,
                  'sourceRevisionId':7868948,'structuredSourceSha256':EXPECTED_STRUCTURED},
                'measureRange':{'firstMeasure':1,'lastMeasure':113,'measureCount':113},
                'tempoBpm':129,'timeSignature':{'beats':4,'noteValue':4},'stepsPerMeasure':16,
                'tuning':['E4','B3','G3','D3','A2','E2'],'measures':measures}
              REF.write_text(json.dumps(ref,indent=2,sort_keys=True)+'\n',encoding='utf-8')
              ref_sha=hashlib.sha256(REF.read_bytes()).hexdigest()
              if ref_sha!=EXPECTED_REFERENCE:
                  raise RuntimeError(f'constructed reference SHA mismatch: {ref_sha}')

              phase='verifying-reference-completeness'
              cp=subprocess.run([
                  'python','validation/rhythm_holdout/verify_reference_completeness.py',
                  '.final/freeze',str(REF),'--output','.final/results/reference-completeness.json'
              ],text=True,capture_output=True)
              if cp.returncode!=0:
                  raise RuntimeError('reference completeness failed: '+(cp.stderr or cp.stdout)[-1200:])
              completeness=json.loads(Path('.final/results/reference-completeness.json').read_text(encoding='utf-8'))
              if completeness.get('passed') is not True or completeness.get('referenceJsonSha256')!=EXPECTED_REFERENCE:
                  raise RuntimeError('reference completeness report mismatch')

              phase='scoring-final-holdout'
              sp=subprocess.run([
                  'python','validation/rhythm_holdout/score_rhythm_holdout.py',
                  '.final/freeze',str(REF),'--output','.final/results/score.json','--minimum','0.99'
              ],text=True,capture_output=True)
              if sp.returncode not in (0,2):
                  raise RuntimeError('scorer execution failed: '+(sp.stderr or sp.stdout)[-1200:])
              score=json.loads(Path('.final/results/score.json').read_text(encoding='utf-8'))
              br=score.get('criticalMismatchBreakdown') or {}
              mc=(score.get('metrics') or {}).get('measureCoverage') or {}
              critical=int(score.get('criticalMismatchCount') or 0)
              pdf_fidelity=float(score.get('pdfEventFidelity') or 0.0)
              near100=score.get('near100ProfessionalGatePassed') is True
              completion=near100 and critical==0 and pdf_fidelity==1.0 and score.get('rhythmComplete') is True
              base.update({
                'executionCompleted':True,
                'executionPhase':'complete',
                'professionalReferenceSourceVerified':True,
                'professionalImageSha256':image_sha,
                'structuredSourceSha256':EXPECTED_STRUCTURED,
                'referenceJsonSha256':ref_sha,
                'referenceMeasureCount':113,
                'referencePlayableOnsetCount':onset_count,
                'referenceNoteCount':score.get('referenceNoteCount'),
                'referencePopulatedMeasureCount':populated,
                'referenceCompletenessPassed':True,
                'referenceOpenedOnlyAfterFreezeValidation':completeness.get('referenceOpenedOnlyAfterFreezeValidation') is True,
                'generatedEventCount':score.get('generatedEventCount'),
                'gatedMetrics':score.get('gatedMetrics'),
                'criticalMismatchCount':critical,
                'criticalMismatchBreakdown':{
                  'grossUnmatchedGeneratedNotes':br.get('grossUnmatchedGeneratedNotes'),
                  'grossUnmatchedReferenceNotes':br.get('grossUnmatchedReferenceNotes'),
                },
                'missingReferenceMeasures':mc.get('missingReferenceMeasures'),
                'pdfEventSha256':score.get('pdfEventSha256'),
                'pdfEventFidelity':pdf_fidelity,
                'near100ProfessionalGatePassed':near100,
                'scorerRhythmComplete':score.get('rhythmComplete') is True,
                'scorerReturnCode':sp.returncode,
                'finalCompletionGatePassed':completion,
                'rhythmComplete':completion,
              })
          except Exception as exc:
              base.update({
                'executionCompleted':False,
                'executionPhase':phase,
                'professionalReferenceSourceVerified':False,
                'referenceCompletenessPassed':False,
                'finalCompletionGatePassed':False,
                'rhythmComplete':False,
                'errorType':type(exc).__name__,
                'errorMessage':str(exc)[:1800],
              })
          finally:
              base['professionalHoldoutOpened']=opened
              RESULT.write_text(json.dumps(base,indent=2,sort_keys=True)+'\n',encoding='utf-8')
              for p in (REF,SOURCE,IMAGE):
                  try: p.unlink()
                  except FileNotFoundError: pass
          PY

      - name: Persist the one-shot final result sentinel
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result='debug/v143-contextual-prune/v5-professional-pdf/final-professional-holdout-result.json'
          test -s "$result"
          git add "$result"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record immutable V5 final professional holdout result'
          for attempt in 1 2 3 4 5; do
            git fetch origin v143-contextual-prune-lobo
            if git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
