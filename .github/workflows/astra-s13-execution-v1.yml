name: Astra S13 synthetic execution V1

# Disabled-by-default: this workflow has no manual trigger. It can run only when
# the exact launch marker is created/changed on astra-work after preparation is frozen.
on:
  push:
    branches: [astra-work]
    paths:
      - 'docs/astra/SYNTHETIC_S13_LAUNCH_V1.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: astra-s13-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  s13:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'
      - name: Enforce first workflow attempt before runtime install
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.run_attempt }}" = "1"
          test "${{ github.ref_name }}" = "astra-work"
      - name: Install frozen CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
      - name: Execute one frozen S13 package
        env:
          PYTHONPATH: astra_backend
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          S13_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/tmp/astra-s13-${S13_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -e "$ROOT" ]; then
            echo "Refusing pre-existing S13 run directory: $ROOT" >&2
            exit 1
          fi
          mkdir -p "$ROOT"
          trap 'code=$?; if [ "$code" -ne 0 ]; then printf "{\"schema\":\"astra-s13-failure-receipt-v1\",\"runId\":\"%s\",\"runAttempt\":\"%s\",\"exitCode\":%s}\n" "$S13_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$code" > "$ROOT/failure-receipt.json"; fi' EXIT

          python -m synthetic.s13_pilot_v1 prepare-only --out-dir "$ROOT/preparation"

          python -m synthetic.s13_pilot_v1 run             --control-dataset "$ROOT/preparation/datasets/s9-control.npz"             --intervention-dataset "$ROOT/preparation/datasets/s13-intervention.npz"             --challenge-dataset "$ROOT/preparation/datasets/s13-challenge.npz"             --out "$ROOT/result.json"             --launch docs/astra/SYNTHETIC_S13_LAUNCH_V1.json             --history docs/astra/SYNTHETIC_S13_EXECUTION_HISTORY_V1.json             --scope docs/astra/SYNTHETIC_S13_RUN_SCOPE_V1.json

          printf '{"schema":"astra-s13-workflow-receipt-v1","runId":"%s","runAttempt":"%s","workflowSuccess":true}\n'             "$S13_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$ROOT/workflow-receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-s13-execution-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/astra-s13-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
