name: Astra source-domain training execution V1

on:
  push:
    branches: [astra-work]
    paths:
      - 'docs/astra/SOURCE_DOMAIN_SIMULATOR_TRAINING_LAUNCH_V1.json'

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

concurrency:
  group: astra-source-domain-training-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'
      - name: Enforce first workflow attempt before expensive work
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.run_attempt }}" = "1"
          test "${{ github.ref_name }}" = "astra-work"
      - name: Install frozen CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
      - name: Reserve unique run directory
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/tmp/astra-source-domain-training-${RUN_ID}-${RUN_ATTEMPT}"
          test ! -e "$ROOT"
          mkdir -p "$ROOT"
      - name: Download exact frozen preparation artifact
        uses: actions/download-artifact@v4
        with:
          name: astra-source-domain-simulator-preparation-v1
          path: /tmp/astra-source-domain-training-${{ github.run_id }}-${{ github.run_attempt }}/preparation
          github-token: ${{ github.token }}
          repository: dadrockyt-sys/dadrock-tabs-android
          run-id: '36475263654'
      - name: Execute one frozen source-domain training package
        env:
          PYTHONPATH: astra_backend
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/tmp/astra-source-domain-training-${RUN_ID}-${RUN_ATTEMPT}"
          trap 'code=$?; if [ "$code" -ne 0 ]; then printf "{"schema":"astra-source-domain-training-failure-receipt-v1","runId":"%s","runAttempt":"%s","exitCode":%s}\n" "$RUN_ID" "$RUN_ATTEMPT" "$code" > "$ROOT/failure-receipt.json"; fi' EXIT
          python -m synthetic.source_domain_simulator_training_v1 run             --control "$ROOT/preparation/datasets/s9-control.npz"             --intervention "$ROOT/preparation/datasets/source-domain-intervention.npz"             --challenge "$ROOT/preparation/datasets/source-domain-challenge.npz"             --out "$ROOT/result.json"             --launch docs/astra/SOURCE_DOMAIN_SIMULATOR_TRAINING_LAUNCH_V1.json             --history docs/astra/SOURCE_DOMAIN_SIMULATOR_TRAINING_EXECUTION_HISTORY_V1.json             --scope docs/astra/SOURCE_DOMAIN_SIMULATOR_TRAINING_RUN_SCOPE_V1.json
          printf '{"schema":"astra-source-domain-training-workflow-receipt-v1","runId":"%s","runAttempt":"%s","workflowSuccess":true}\n' "$RUN_ID" "$RUN_ATTEMPT" > "$ROOT/workflow-receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-source-domain-training-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/astra-source-domain-training-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
