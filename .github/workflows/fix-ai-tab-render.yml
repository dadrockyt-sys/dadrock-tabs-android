name: Fix AI Tab Render

on:
  push:
    paths:
      - '.github/workflows/fix-ai-tab-render.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply targeted render fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/ai-tab/page.js')
          text = path.read_text()
          original = text

          if 'CheckCircle2,' not in text:
              text = text.replace('  Check,\n', '  Check,\n  CheckCircle2,\n', 1)
          if re.search(r'^\s*Music,\s*$', text, re.M) is None:
              text = text.replace('  Mail,\n', '  Mail,\n  Music,\n', 1)
          if re.search(r'^\s*Play,\s*$', text, re.M) is None:
              text = text.replace('  Music2,\n', '  Music2,\n  Play,\n', 1)

          text = text.replace('isEmailValid', 'emailIsValid')
          text = text.replace('type.label', 'type.title')
          text = re.sub(
              r'const\s+Icon\s*=\s*type\.icon\s*;',
              'const Icon = Guitar;',
              text,
          )

          if text == original:
              raise SystemExit('No changes were needed; repair may already be applied.')

          path.write_text(text)
          PY

      - name: Commit repair
        run: |
          git config user.name "DadRock Tabs Repair"
          git config user.email "actions@users.noreply.github.com"
          git add app/ai-tab/page.js
          git commit -m "Fix AI tab client render errors"
          git push
