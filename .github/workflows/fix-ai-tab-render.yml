name: Fix AI Tab Render

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  repair:
    name: Repair AI tab page
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply runtime repairs
        run: python .github/scripts/fix_ai_tab.py

      - name: Update hero branding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/ai-tab/page.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('AI Tab Generator', 'Tab Generator Studio')
          text = text.replace(
              'Turn an audio file you possess into professional guitar or bass tablature.',
              'Create professional-quality guitar or bass tablature from your audio.'
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove repeated benefits section
        run: python .github/scripts/remove_ai_tab_benefits.py

      - name: Restore email placement
        run: python .github/scripts/move_ai_tab_email.py

      - name: Enable Android M4A uploads
        run: python .github/scripts/fix_m4a_upload.py

      - name: Repair mobile PDF preview
        run: python .github/scripts/fix_mobile_pdf_preview.py

      - name: Update loading message
        run: python .github/scripts/update_ai_tab_loading_text.py

      - name: Commit repaired page
        shell: bash
        run: |
          if git diff --quiet -- app/ai-tab/page.js; then
            echo "No page changes were required."
            exit 0
          fi

          git config user.name "DadRock Tabs Repair"
          git config user.email "actions@users.noreply.github.com"
          git add app/ai-tab/page.js
          git commit -m "Update Tab Studio analysis message"
          git push
