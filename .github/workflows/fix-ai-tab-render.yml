name: Fix AI Tab Render

on:
  push:
    paths:
      - '.github/workflows/fix-ai-tab-render.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply targeted render fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/ai-tab/page.js')
          text = path.read_text()

          replacements = [
              (
                  "  Check,\n  ChevronDown,",
                  "  Check,\n  CheckCircle2,\n  ChevronDown,",
              ),
              (
                  "  Mail,\n  Music2,",
                  "  Mail,\n  Music,\n  Music2,\n  Play,",
              ),
              (
                  "const Icon =\n                        type.icon;",
                  "const Icon = Guitar;",
              ),
              (
                  "{type.label}",
                  "{type.title}",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old!r}')
              text = text.replace(old, new)

          if 'isEmailValid' not in text:
              raise SystemExit("Expected identifier 'isEmailValid' not found")
          text = text.replace('isEmailValid', 'emailIsValid')

          path.write_text(text)
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/fix-ai-tab-render.yml

      - name: Commit repair
        run: |
          git config user.name "DadRock Tabs Repair"
          git config user.email "actions@users.noreply.github.com"
          git add app/ai-tab/page.js .github/workflows/fix-ai-tab-render.yml
          git commit -m "Fix AI tab client render errors"
          git push
