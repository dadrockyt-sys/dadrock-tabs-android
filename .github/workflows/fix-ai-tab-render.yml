name: Wire AI Tab Preview Metadata

on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/scripts/wire_ai_preview_metadata.py'
      - '.github/workflows/fix-ai-tab-render.yml'

permissions:
  contents: write

jobs:
  repair:
    name: Wire analyzer metadata into preview
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update AI tab preview request
        run: python .github/scripts/wire_ai_preview_metadata.py

      - name: Verify preview metadata wiring
        shell: bash
        run: |
          grep -n "analysisMetadata" app/ai-tab/page.js
          grep -n "analyzerData" app/ai-tab/page.js | tail -n 5

      - name: Commit repaired page
        shell: bash
        run: |
          if git diff --quiet -- app/ai-tab/page.js; then
            echo "No page change was required."
            exit 0
          fi

          git config user.name "DadRock Tabs Repair"
          git config user.email "actions@users.noreply.github.com"
          git add app/ai-tab/page.js
          git commit -m "Pass analyzer metadata to tab preview"
          git push
