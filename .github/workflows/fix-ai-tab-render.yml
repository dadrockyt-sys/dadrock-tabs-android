name: Fix AI Tab Render

on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/fix-ai-tab-render.yml'
      - '.github/scripts/remove_orphaned_process_jsx.py'

permissions:
  contents: write

jobs:
  repair:
    name: Repair AI tab page
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove malformed process JSX
        run: python .github/scripts/remove_orphaned_process_jsx.py

      - name: Verify broken process JSX is gone
        shell: bash
        run: |
          if grep -n "step.title\|step.description" app/ai-tab/page.js; then
            echo "Malformed process-card JSX still remains."
            exit 1
          fi

      - name: Commit repaired page
        shell: bash
        run: |
          if git diff --quiet -- app/ai-tab/page.js; then
            echo "No page change was required."
            exit 0
          fi

          git config user.name "DadRock Tabs Repair"
          git config user.email "actions@users.noreply.github.com"
          git add app/ai-tab/page.js
          git commit -m "Fix AI tab JSX parse error"
          git push
