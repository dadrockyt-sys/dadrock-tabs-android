name: V149 high confidence singleton construct once

on:
  push:
    paths:
      - '.github/workflows/v149-high-confidence-construct-once.yml'

permissions:
  contents: write

jobs:
  construct-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Reference-free construction preflight
        run: |
          set -euo pipefail
          test ! -d debug/v149-singleton-confidence/candidate
          test "$(git hash-object debug/v149-singleton-confidence/phase-b-high-confidence-preregistration.json)" = "d8ebc3d4535ec1484ef64e946089027792715c5c"
          test "$(git hash-object debug/v149-singleton-confidence/phase-b-construction-authorization.json)" = "7f1d47ecee87cd7508addcf86bed5ae56230835e"
          test "$(git hash-object validation/v149_singleton_confidence/construct_once.py)" = "c3337550509532a64ed496cc28a1e80bf1642292"
          test "$(git hash-object debug/v149-singleton-confidence/phase-b-construction-attempt-sentinel.json)" = "2d4ed2e2acb677e5f7ca0598b268ae3a298ed12e"
          python validation/v149_singleton_confidence/construct_once.py --help >/dev/null

      - name: Consume construction attempt and checkpoint
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path('debug/v149-singleton-confidence/phase-b-construction-attempt-sentinel.json')
          d = json.loads(p.read_text())
          if d.get('status') != 'ARMED_NOT_CONSUMED' or d.get('candidateConstructedCount') != 0:
              raise SystemExit('construction sentinel is not cleanly armed')
          if d.get('goldOrReferenceRead') is not False or d.get('scoreCallCount') != 0:
              raise SystemExit('unsafe construction sentinel state')
          d['status'] = 'CONSUMED_BEFORE_CONSTRUCTION'
          d['runId'] = os.environ['RUN_ID']
          d['runHeadSha'] = os.environ['HEAD_SHA']
          d['consumedAtUtc'] = datetime.now(timezone.utc).isoformat()
          p.write_text(json.dumps(d, indent=2, sort_keys=True) + '\n')

          cp = Path('docs/checkpoints/CURRENT_STATE.md')
          marker = '## V149 Phase B high-confidence singleton construction — ARMED / REFERENCE-FREE — 2026-08-27 UTC'
          text = cp.read_text()
          if marker not in text:
              text += f'''\n\n{marker}\n- Phase A reference-free analysis found **52/106 = 49.06%** of V148 singleton edits below 3 dB weakest-gate clearance and **54/106 = 50.94%** at or above 3 dB.\n- Frozen V149 policy keeps exactly those 54 high-confidence singleton overrides and reverts the other 52 to accepted family #10; no other filter/threshold is allowed.\n- Preregistration blob `d8ebc3d4535ec1484ef64e946089027792715c5c`; construction authorization blob `7f1d47ecee87cd7508addcf86bed5ae56230835e`; constructor blob `c3337550509532a64ed496cc28a1e80bf1642292`; run `{os.environ['RUN_ID']}`.\n- At this checkpoint: candidate count **0**; Gold/reference **NO**; scorer calls **0**; audio/HPSS/CQT/Modal/GPU **NO**; main/Production/promotion **NO**.\n'''
              cp.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/v149-singleton-confidence/phase-b-construction-attempt-sentinel.json docs/checkpoints/CURRENT_STATE.md
          git commit -m 'debug: consume V149 construction attempt [skip ci]'
          git push origin HEAD:v143-contextual-prune-lobo

      - name: Construct exactly one frozen V149 candidate
        run: |
          set -euo pipefail
          python validation/v149_singleton_confidence/construct_once.py --output-dir debug/v149-singleton-confidence/candidate | tee /tmp/v149-construct-summary.json

      - name: Verify persist checkpoint and self-seal
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          base = Path('debug/v149-singleton-confidence/candidate')
          proof = json.loads((base/'construction-proof.json').read_text())
          if proof.get('gate') != 'GO' or proof.get('deterministic') is not True or proof.get('pdfEventFidelity') != 1.0:
              raise SystemExit('V149 construction gate mismatch')
          m = proof.get('metrics') or {}
          if m.get('changedEventCountVersusAccepted') != 54 or m.get('changedOnsetCountVersusAccepted') != 54 or m.get('polyphonicChangedEventsVersusAccepted') != 0:
              raise SystemExit('V149 structural gate mismatch')
          if abs(float(m.get('retainedPercentOfV148Changes')) - (100*54/106)) > 1e-9:
              raise SystemExit('V149 retained percent mismatch')
          s = proof.get('safety') or {}
          if s.get('scoreCallCount') != 0 or s.get('scorerInvoked') is not False or s.get('goldOrReferenceRead') is not False:
              raise SystemExit('V149 construction safety mismatch')
          hashes = {}
          for name in ('candidate.json','construction-proof.json','pdf-event-fidelity.json','preservation-manifest.json'):
              p = base/name
              b = p.read_bytes()
              hashes[name] = {'bytes': len(b), 'sha256': hashlib.sha256(b).hexdigest()}
          completion = {
              'schema': 'dadrock.tabs.v149.singleton-confidence.phase-b-completion.v1',
              'classification': 'one-use-reference-free-construction-complete',
              'status': 'COMPLETE_SEALED_STOP_BEFORE_SCORING',
              'branch': 'v143-contextual-prune-lobo',
              'runId': os.environ['RUN_ID'],
              'completedAtUtc': datetime.now(timezone.utc).isoformat(),
              'candidateEventSha256': proof['candidateEventSha256'],
              'changedEvents': 54,
              'changedOnsets': 54,
              'polyphonicChangedEvents': 0,
              'retainedPercentOfV148Changes': m['retainedPercentOfV148Changes'],
              'pdfEventFidelity': 1.0,
              'outputIdentities': hashes,
              'goldOrReferenceRead': False,
              'scoreCallCount': 0,
              'candidateVariantsConstructed': 1,
              'candidateSearchRun': False,
              'audioRead': False,
              'modalGpuUsed': False,
              'productionIntegrated': False,
              'automaticPromotion': False,
              'referenceFacingScoringAuthorization': False,
          }
          Path('debug/v149-singleton-confidence/phase-b-complete-sentinel.json').write_text(json.dumps(completion, indent=2, sort_keys=True)+'\n')

          cp = Path('docs/checkpoints/CURRENT_STATE.md')
          marker = '## V149 Phase B high-confidence singleton construction — COMPLETE / SEALED / STOP BEFORE SCORING — 2026-08-27 UTC'
          text = cp.read_text()
          if marker in text:
              raise SystemExit('duplicate V149 construction checkpoint')
          text += f'''\n\n{marker}\n- Exactly one frozen V149 candidate was constructed reference-free in run `{os.environ['RUN_ID']}`.\n- Candidate canonical event SHA256 **`{proof['candidateEventSha256']}`**; 1144 events / 113 measures.\n- Delta vs accepted baseline: exactly **54 changed singleton events / 54 changed onsets / 0 polyphonic changes**. This retains **{m['retainedPercentOfV148Changes']:.2f}%** of V148 changes and reverts **52/106 = 49.06%**.\n- Deterministic replay **TRUE**; PDF/render event fidelity **100.00%**.\n- `candidate.json` SHA256 **`{hashes['candidate.json']['sha256']}`**; construction proof SHA256 **`{hashes['construction-proof.json']['sha256']}`**; PDF fidelity SHA256 **`{hashes['pdf-event-fidelity.json']['sha256']}`**.\n- Gold/reference read **NO**; score calls **0**; candidate variants **1**; search/retuning/audio/HPSS/CQT/Modal/GPU/main/Production/promotion **NO**.\n- V149 construction authorization is consumed; this construction workflow is deleted in the same sealing commit. The exact candidate may now receive a separately frozen one-use score.\n'''
          cp.write_text(text)
          PY
          git rm .github/workflows/v149-high-confidence-construct-once.yml
          git add debug/v149-singleton-confidence/candidate debug/v149-singleton-confidence/phase-b-complete-sentinel.json docs/checkpoints/CURRENT_STATE.md
          git commit -m 'debug: persist and seal V149 high-confidence candidate [skip ci]'
          git push origin HEAD:v143-contextual-prune-lobo
