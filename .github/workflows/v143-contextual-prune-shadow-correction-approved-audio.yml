name: V143 Contextual Prune Shadow Correction Approved Audio

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-contextual-prune-shadow-correction-approved-audio.yml
      - analyzer/v143_contextual_prune_shadow_correction.py
      - analyzer/v143_contextual_prune_shadow_correction_modal.py
      - analyzer/v143_contextual_prune_reference_free_carrier.py
      - analyzer/v143_contextual_prune_runtime.py
      - analyzer/v143_rhythm_timing_consistency_shadow.py
      - analyzer/v143_rhythm_timing_hypothesis_shadow.py

concurrency:
  group: v143-contextual-prune-shadow-correction-approved-audio
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  approved-audio-shadow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run approved-audio reference-free correction shadow
        shell: bash
        run: |
          set +e
          mkdir -p debug/v143-contextual-prune
          log=debug/v143-contextual-prune/shadow-correction-approved-audio.log
          action=debug/v143-contextual-prune/shadow-correction-approved-audio-action.json
          report=debug/v143-contextual-prune/shadow-correction-approved-audio.json
          : > "$log"

          expected=215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f
          actual=$(sha256sum public/gomywayfullaitest.m4a | awk '{print $1}')
          source_ok=false
          if [ "$actual" = "$expected" ]; then
            source_ok=true
            echo "APPROVED_AUDIO_SHA=PASS:$actual" >> "$log"
          else
            echo "APPROVED_AUDIO_SHA=FAIL:$actual expected=$expected" >> "$log"
          fi

          correction_blob=$(git hash-object analyzer/v143_contextual_prune_shadow_correction.py)
          modal_blob=$(git hash-object analyzer/v143_contextual_prune_shadow_correction_modal.py)
          timing_hypothesis_blob=$(git hash-object analyzer/v143_rhythm_timing_hypothesis_shadow.py)
          checked_out_commit=$(git rev-parse HEAD)
          echo "CORRECTION_SOURCE_BLOB=$correction_blob" >> "$log"
          echo "CORRECTION_MODAL_BLOB=$modal_blob" >> "$log"
          echo "TIMING_HYPOTHESIS_BLOB=$timing_hypothesis_blob" >> "$log"
          echo "CHECKED_OUT_COMMIT=$checked_out_commit" >> "$log"

          token_available=false
          attempted=false
          status=99
          if [ "$source_ok" = true ] && [ -n "${MODAL_TOKEN_ID:-}" ] && [ -n "${MODAL_TOKEN_SECRET:-}" ]; then
            token_available=true
            attempted=true
            python -m pip install --disable-pip-version-check modal >> "$log" 2>&1
            install_status=$?
            if [ "$install_status" -eq 0 ]; then
              python -m modal run \
                analyzer/v143_contextual_prune_shadow_correction_modal.py::approved_audio \
                --audio-path public/gomywayfullaitest.m4a \
                --output-path "$report" >> "$log" 2>&1
              status=$?
            else
              status=$install_status
            fi
          elif [ "$source_ok" != true ]; then
            status=41
            echo "Approved audio identity failed; correction shadow not attempted." >> "$log"
          else
            echo "Modal GitHub credentials unavailable; correction shadow not attempted." >> "$log"
          fi

          TOKEN_AVAILABLE="$token_available" ATTEMPTED="$attempted" STATUS="$status" SOURCE_OK="$source_ok" ACTUAL_SHA="$actual" REPORT_EXISTS="$([ -s "$report" ] && echo true || echo false)" CORRECTION_BLOB="$correction_blob" MODAL_BLOB="$modal_blob" TIMING_HYPOTHESIS_BLOB="$timing_hypothesis_blob" CHECKED_OUT_COMMIT="$checked_out_commit" TRIGGER_SHA="${GITHUB_SHA}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          log_path = Path("debug/v143-contextual-prune/shadow-correction-approved-audio.log")
          output = Path("debug/v143-contextual-prune/shadow-correction-approved-audio-action.json")
          lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines()
          attempted = os.environ["ATTEMPTED"] == "true"
          payload = {
              "schemaVersion": 2,
              "gate": "v143-contextual-prune-shadow-correction-approved-audio",
              "triggerSha": os.environ["TRIGGER_SHA"],
              "checkedOutCommit": os.environ["CHECKED_OUT_COMMIT"],
              "correctionSourceBlob": os.environ["CORRECTION_BLOB"],
              "modalSourceBlob": os.environ["MODAL_BLOB"],
              "timingHypothesisSourceBlob": os.environ["TIMING_HYPOTHESIS_BLOB"],
              "approvedAudioSha256": os.environ["ACTUAL_SHA"],
              "approvedAudioIdentityPassed": os.environ["SOURCE_OK"] == "true",
              "modalCredentialsAvailableInGitHubActions": os.environ["TOKEN_AVAILABLE"] == "true",
              "shadowAttempted": attempted,
              "shadowExitCode": int(os.environ["STATUS"]) if attempted else None,
              "reportExists": os.environ["REPORT_EXISTS"] == "true",
              "professionalReferenceUsed": False,
              "runtimeLabelsRequired": False,
              "liveEndpointDeployedOrModified": False,
              "productionModified": False,
              "logTail": lines[-220:],
          }
          output.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

          exit 0

      - name: Commit approved-audio shadow diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            debug/v143-contextual-prune/shadow-correction-approved-audio.log \
            debug/v143-contextual-prune/shadow-correction-approved-audio-action.json
          report=debug/v143-contextual-prune/shadow-correction-approved-audio.json
          if [ -s "$report" ]; then
            git add -- "$report"
          fi
          if git diff --cached --quiet; then
            echo "No approved-audio correction diagnostic changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record V143 approved-audio shadow correction"
          git fetch origin v143-contextual-prune-lobo
          git rebase origin/v143-contextual-prune-lobo
          git push origin HEAD:v143-contextual-prune-lobo

      - name: Enforce approved-audio shadow invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          action = json.loads(Path("debug/v143-contextual-prune/shadow-correction-approved-audio-action.json").read_text(encoding="utf-8"))
          identity_fields = (
              "checkedOutCommit",
              "correctionSourceBlob",
              "modalSourceBlob",
              "timingHypothesisSourceBlob",
          )
          missing_identity = [key for key in identity_fields if not str(action.get(key) or "").strip()]
          if missing_identity:
              raise SystemExit(f"Approved-audio correction source identity missing: {missing_identity}")
          if action.get("approvedAudioIdentityPassed") is not True:
              raise SystemExit("Approved audio SHA gate failed")
          if action.get("modalCredentialsAvailableInGitHubActions") is not True:
              print("Approved-audio correction shadow is credential-blocked; no production change was made")
              raise SystemExit(0)
          if action.get("shadowAttempted") is not True or int(action.get("shadowExitCode", 1)) != 0:
              raise SystemExit("Approved-audio correction shadow failed; inspect committed diagnostic")
          if action.get("reportExists") is not True:
              raise SystemExit("Approved-audio correction report missing")

          report = json.loads(Path("debug/v143-contextual-prune/shadow-correction-approved-audio.json").read_text(encoding="utf-8"))
          invariants = report.get("invariants") or {}
          required = {
              "sourceIsApprovedFixture": True,
              "referenceFree": True,
              "runtimeLabelsRequired": False,
              "baseEventsPreserved": True,
              "rescuedEventsPhysicallyObserved": True,
              "candidateRelocatesEvents": False,
              "timingDiagnosticChangesGrid": False,
              "timingHypothesisChangesGrid": False,
              "liveRhythmOutputChanged": False,
              "leadChanged": False,
              "bassChanged": False,
              "productionModified": False,
          }
          failed = [key for key, expected in required.items() if invariants.get(key) is not expected]

          timing = report.get("timingConsistency") or {}
          timing_invariants = timing.get("invariants") or {}
          timing_required = {
              "tempoChanged": False,
              "barPhaseChanged": False,
              "attackTimingChanged": False,
              "candidateSelectionChanged": False,
              "pitchChanged": False,
              "professionalReferenceUsed": False,
              "runtimeLabelsRequired": False,
              "productionModified": False,
          }
          failed.extend(
              f"timing.{key}"
              for key, expected in timing_required.items()
              if timing_invariants.get(key) is not expected
          )

          hypothesis = report.get("timingHypothesis") or {}
          hypothesis_invariants = hypothesis.get("invariants") or {}
          failed.extend(
              f"timingHypothesis.{key}"
              for key, expected in timing_required.items()
              if hypothesis_invariants.get(key) is not expected
          )
          phase = hypothesis.get("barPhaseEvidence") or {}
          if phase.get("phaseSelectedOrChanged") is not False:
              failed.append("timingHypothesis.barPhaseEvidence.phaseSelectedOrChanged")

          if failed:
              raise SystemExit(f"Approved-audio correction invariant failure: {failed}")
          print("V143 approved-audio correction shadow completed with reference-free invariants intact")
          PY
