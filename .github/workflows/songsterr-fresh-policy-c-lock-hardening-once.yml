name: Songsterr Fresh Policy C Lock Hardening Once

on:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-policy-c-lock-hardening-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out fresh branch
        uses: actions/checkout@v4
        with:
          ref: songsterr-fresh-pipeline-v1
          fetch-depth: 0

      - name: Harden full Python distribution fingerprint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/songsterr-fresh/verify_pinned_compute_authority.py')
          text = path.read_text(encoding='utf-8')

          marker = '''def package_versions():
              versions = {}
              for name in PACKAGE_NAMES:
                  try:
                      versions[name] = importlib.metadata.version(name)
                  except importlib.metadata.PackageNotFoundError:
                      versions[name] = None
              return versions


          def numeric_library_configuration():
          '''
          replacement = '''def package_versions():
              versions = {}
              for name in PACKAGE_NAMES:
                  try:
                      versions[name] = importlib.metadata.version(name)
                  except importlib.metadata.PackageNotFoundError:
                      versions[name] = None
              return versions


          def installed_distribution_lock():
              rows = []
              for dist in importlib.metadata.distributions():
                  raw_name = dist.metadata.get("Name") or ""
                  normalized_name = raw_name.strip().lower().replace("_", "-").replace(".", "-")
                  record = dist.read_text("RECORD")
                  direct_url = dist.read_text("direct_url.json")
                  installer = dist.read_text("INSTALLER")
                  rows.append({
                      "name": normalized_name,
                      "version": str(dist.version),
                      "recordSha256": sha256_text(record) if record is not None else None,
                      "directUrlSha256": sha256_text(direct_url) if direct_url is not None else None,
                      "installerSha256": sha256_text(installer) if installer is not None else None,
                  })
              rows.sort(key=canonical_json)
              return {
                  "distributionCount": len(rows),
                  "sha256": digest_json(rows),
              }


          def numeric_library_configuration():
          '''
          # Dedent the source fragments exactly as they appear in the file.
          marker = marker.replace('          ', '')
          replacement = replacement.replace('          ', '')
          if text.count(marker) != 1:
              raise SystemExit('PACKAGE_VERSION_FUNCTION_MARKER_CHANGED')
          text = text.replace(marker, replacement, 1)

          old = '        "packages": package_versions(),\n        "numericLibraries": numeric_library_configuration(),\n'
          new = '        "packages": package_versions(),\n        "pythonDistributionLock": installed_distribution_lock(),\n        "numericLibraries": numeric_library_configuration(),\n'
          if text.count(old) != 1:
              raise SystemExit('COLLECT_PROBE_PACKAGE_MARKER_CHANGED')
          text = text.replace(old, new, 1)

          old = '''    required_env = manifest.get("requiredEnvironment")
              if not isinstance(required_env, dict) or required_env != {key: "1" for key in ENV_KEYS[:-1]} | {"PYTHONHASHSEED": "0"}:
                  raise AuthorityError("REQUIRED_DETERMINISTIC_ENVIRONMENT_CHANGED")

              fixed = manifest.get("fixedModelPath")
          '''.replace('              ', '')
          new = '''    required_env = manifest.get("requiredEnvironment")
              if not isinstance(required_env, dict) or required_env != {key: "1" for key in ENV_KEYS[:-1]} | {"PYTHONHASHSEED": "0"}:
                  raise AuthorityError("REQUIRED_DETERMINISTIC_ENVIRONMENT_CHANGED")
              expected_packages = {
                  "numpy": "1.26.4",
                  "torch": "2.14.0",
                  "huggingface-hub": "1.30.0",
                  "safetensors": "0.8.0",
                  "sphn": "0.2.1",
                  "demucs": "4.1.0",
                  "basic-pitch": "0.4.0",
                  "librosa": "0.11.0",
                  "soundfile": "0.13.1",
                  "tflite-runtime": "2.14.0",
              }
              if manifest.get("requiredPackageVersions") != expected_packages:
                  raise AuthorityError("REQUIRED_PACKAGE_VERSION_SET_CHANGED")

              fixed = manifest.get("fixedModelPath")
          '''.replace('              ', '')
          if text.count(old) != 1:
              raise SystemExit('MANIFEST_PACKAGE_MARKER_CHANGED')
          text = text.replace(old, new, 1)

          old = '''    packages = fingerprint.get("packages")
              if not isinstance(packages, dict):
                  raise AuthorityError("PACKAGE_VERSION_MAP_REQUIRED")
              if packages.get("demucs") != manifest["fixedModelPath"]["demucs"]["packageVersion"]:
                  raise AuthorityError("DEMUCS_PACKAGE_VERSION_MISMATCH")
              if packages.get("basic-pitch") != manifest["fixedModelPath"]["basicPitch"]["packageVersion"]:
                  raise AuthorityError("BASIC_PITCH_PACKAGE_VERSION_MISMATCH")
              if any(packages.get(name) is None for name in PACKAGE_NAMES):
                  missing = sorted(name for name in PACKAGE_NAMES if packages.get(name) is None)
                  raise AuthorityError("PINNED_PACKAGE_MISSING:" + ",".join(missing))
              python = fingerprint.get("python", {})
          '''.replace('              ', '')
          new = '''    packages = fingerprint.get("packages")
              if not isinstance(packages, dict):
                  raise AuthorityError("PACKAGE_VERSION_MAP_REQUIRED")
              required_packages = manifest.get("requiredPackageVersions")
              if packages != required_packages:
                  raise AuthorityError("PINNED_PACKAGE_VERSION_SET_MISMATCH")
              distribution_lock = fingerprint.get("pythonDistributionLock")
              if not isinstance(distribution_lock, dict):
                  raise AuthorityError("PYTHON_DISTRIBUTION_LOCK_REQUIRED")
              distribution_count = distribution_lock.get("distributionCount")
              if isinstance(distribution_count, bool) or not isinstance(distribution_count, int) or distribution_count <= 0:
                  raise AuthorityError("PYTHON_DISTRIBUTION_COUNT_INVALID")
              require_sha256(distribution_lock.get("sha256"), "pythonDistributionLock.sha256")
              python = fingerprint.get("python", {})
          '''.replace('              ', '')
          if text.count(old) != 1:
              raise SystemExit('PROBE_PACKAGE_VALIDATION_MARKER_CHANGED')
          text = text.replace(old, new, 1)

          old = '''        "packages": {
                  "numpy": "1.26.4", "torch": "2.14.0", "huggingface-hub": "1.30.0",
                  "safetensors": "0.8.0", "sphn": "0.2.1", "demucs": "4.1.0",
                  "basic-pitch": "0.4.0", "librosa": "0.11.0", "soundfile": "0.13.1",
                  "tflite-runtime": "2.14.0",
              },
              "numericLibraries": {"numpyConfigSha256": "5" * 64, "torchConfigSha256": "6" * 64, "torchVersion": "2.14.0"},
          '''.replace('              ', '')
          new = '''        "packages": {
                  "numpy": "1.26.4", "torch": "2.14.0", "huggingface-hub": "1.30.0",
                  "safetensors": "0.8.0", "sphn": "0.2.1", "demucs": "4.1.0",
                  "basic-pitch": "0.4.0", "librosa": "0.11.0", "soundfile": "0.13.1",
                  "tflite-runtime": "2.14.0",
              },
              "pythonDistributionLock": {"distributionCount": 42, "sha256": "7" * 64},
              "numericLibraries": {"numpyConfigSha256": "5" * 64, "torchConfigSha256": "6" * 64, "torchVersion": "2.14.0"},
          '''.replace('              ', '')
          if text.count(old) != 1:
              raise SystemExit('SYNTHETIC_PACKAGE_MARKER_CHANGED')
          text = text.replace(old, new, 1)

          old = '''    software_drift = copy.deepcopy(probe)
              software_drift["fingerprint"]["packages"]["numpy"] = "1.26.5"
              software_drift["fingerprintSha256"] = digest_json(software_drift["fingerprint"])
              try:
                  verify_probe(enrolled, software_drift)
              except AuthorityError as exc:
                  assert str(exc) == "AUTHORITY_FINGERPRINT_DRIFT"
              else:
                  raise AssertionError("software drift must fail closed")

              print(json.dumps({
          '''.replace('              ', '')
          new = '''    software_drift = copy.deepcopy(probe)
              software_drift["fingerprint"]["packages"]["numpy"] = "1.26.5"
              software_drift["fingerprintSha256"] = digest_json(software_drift["fingerprint"])
              try:
                  verify_probe(enrolled, software_drift)
              except AuthorityError as exc:
                  assert str(exc) == "PINNED_PACKAGE_VERSION_SET_MISMATCH"
              else:
                  raise AssertionError("software drift must fail closed")

              transitive_drift = copy.deepcopy(probe)
              transitive_drift["fingerprint"]["pythonDistributionLock"]["sha256"] = "8" * 64
              transitive_drift["fingerprintSha256"] = digest_json(transitive_drift["fingerprint"])
              try:
                  verify_probe(enrolled, transitive_drift)
              except AuthorityError as exc:
                  assert str(exc) == "AUTHORITY_FINGERPRINT_DRIFT"
              else:
                  raise AssertionError("transitive distribution drift must fail closed")

              print(json.dumps({
          '''.replace('              ', '')
          if text.count(old) != 1:
              raise SystemExit('SELF_TEST_SOFTWARE_DRIFT_MARKER_CHANGED')
          text = text.replace(old, new, 1)

          old = '        "softwareDriftFailsClosed": True,\n        "modelValidationComplete": False,\n'
          new = '        "softwareDriftFailsClosed": True,\n        "transitiveDistributionDriftFailsClosed": True,\n        "modelValidationComplete": False,\n'
          if text.count(old) != 1:
              raise SystemExit('SELF_TEST_OUTPUT_MARKER_CHANGED')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Update Policy C architecture document
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/checkpoints/SONGSTERR_FRESH_PINNED_COMPUTE_AUTHORITY_V1.md')
          text = path.read_text(encoding='utf-8')
          old = '- pinned Python package versions\n- NumPy build/configuration hash\n'
          new = '- pinned Python package versions\n- full installed Python-distribution lock hash, including normalized distribution versions plus installed `RECORD`, `direct_url.json`, and `INSTALLER` metadata hashes; this catches transitive/package-content drift\n- NumPy build/configuration hash\n'
          if text.count(old) != 1:
              raise SystemExit('POLICY_C_DOC_FINGERPRINT_MARKER_CHANGED')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run hardened authority self-tests
        shell: bash
        run: |
          python -m py_compile scripts/songsterr-fresh/verify_pinned_compute_authority.py
          python scripts/songsterr-fresh/verify_pinned_compute_authority.py --validate-manifest
          python scripts/songsterr-fresh/verify_pinned_compute_authority.py --self-test

      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dadrockyt-sys'
          git config user.email 'Stephen.s.mcnally@gmail.com'
          git add scripts/songsterr-fresh/verify_pinned_compute_authority.py docs/checkpoints/SONGSTERR_FRESH_PINNED_COMPUTE_AUTHORITY_V1.md
          git commit -m 'harden: bind fresh authority to full Python distribution lock'
          git push origin HEAD:songsterr-fresh-pipeline-v1
