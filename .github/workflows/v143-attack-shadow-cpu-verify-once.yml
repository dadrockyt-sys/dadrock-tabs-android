name: V143 attack shadow CPU verify once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - debug/v143-contextual-prune/attack-shadow-cpu-verify-request.txt

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0

      - name: Reconstruct pinned paid capture CPU-only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          python analyzer/materialize_v143_precision_fixture.py --output-dir /tmp/v143-fixture

      - name: Replay attack shadow and rescued pitch voicing CPU-only
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=/tmp/v143-fixture/repaired-timing-precision-candidate-product.json
          python analyzer/v143_contextual_prune_attack_shadow_v1.py "$PRODUCT" --output /tmp/attack-shadow.json > /tmp/attack-shadow.stdout
          python analyzer/v143_attack_shadow_v1_replay_validator.py --self-test
          python analyzer/v143_attack_shadow_v1_replay_validator.py --input "$PRODUCT" --output /tmp/attack-shadow-replay.json > /tmp/attack-shadow-replay.stdout
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('/tmp/attack-shadow.json').read_text())
          r = json.loads(Path('/tmp/attack-shadow-replay.json').read_text())
          committed = json.loads(Path('debug/v143-contextual-prune/precision-attack-shadow-v1-validation.json').read_text())
          assert a['baselineRetainedAttackCount'] == 725
          assert a['eligibleAttackCount'] == 984
          assert a['rescuedAttackCount'] == 26
          assert a['shadowRetainedAttackCount'] == 751
          assert a['removedBaselineAttackCount'] == 0
          assert r['attackPolicy']['rescuedAttackCount'] == 26
          assert r['pitchReplay']['rescuedSelectedPitchCount'] == 36
          assert r['pitchReplay']['pitchCountDistribution'] == {'1': 18, '2': 6, '3': 2}
          assert r['pitchReplay']['unobservedPitchCount'] == 0
          assert r['voicingReplay']['renderedPitchCount'] == 36
          assert r['voicingReplay']['voicingDroppedPitchCount'] == 0
          assert r['voicingReplay']['unplayablePrimaryCount'] == 0
          assert r['voicingReplay']['gridTimeCollisionWithBaselineCount'] == 0
          assert r['downstreamBoundary']['freezeReady'] is False
          assert r['modalInvoked'] is False
          assert r['professionalReferenceUsed'] is False
          assert r['productionModified'] is False
          assert committed['attackPolicy']['rescuedAttackCount'] == r['attackPolicy']['rescuedAttackCount']
          assert committed['pitchReplay']['rescuedSelectedPitchCount'] == r['pitchReplay']['rescuedSelectedPitchCount']
          assert committed['voicingReplay']['voicingDroppedPitchCount'] == r['voicingReplay']['voicingDroppedPitchCount']
          print('PASS pinned fixture attack-shadow CPU replay')
          PY

      - name: Save CURRENT_STATE and remove one-shot trigger
        shell: bash
        run: |
          set -euo pipefail
          marker='## Attack-pruning CPU shadow checkpoint — 2026-08-24 America/Montreal'
          if ! grep -Fq "$marker" docs/checkpoints/CURRENT_STATE.md; then
            cat >> docs/checkpoints/CURRENT_STATE.md <<'EOF'

## Attack-pruning CPU shadow checkpoint — 2026-08-24 America/Montreal
- Continued entirely from the pinned successful Modal fixture; **no new Modal/L4 inference and no professional scorer/reference use**.
- Added source-only attack diagnostic `analyzer/v143_contextual_prune_attack_shadow_v1.py` at commit `674dd4de5331e079f80e6f2fc798b9c80de9d289`.
- Baseline attack-policy CPU recomputation exactly reproduces all `725` retained attacks from the `984` eligible universe; baseline mismatch count `0`.
- Diagnosis: legacy borderline attack pruning compares the body-heavy composite `precisionStrength` locally. A conservative shadow rescue instead reuses the existing local radius `2` and margin `0.20` on the actual two-view-minimum transient `attack` dimension, while preserving the existing positive attack/body gates. **No new numeric threshold was introduced.**
- Shadow result: `26` of the `259` pruned attacks are local transient maxima; adds `26`, removes `0`, producing `751` shadow attacks. Reason split: `25` below legacy ratio `0.60` but local attack peaks; `1` in legacy `0.60–0.70` exception band but not a composite-strength maximum.
- All `26` rescues have positive aggregate attack evidence from both source views; `19/26` have grid error tighter than the baseline-retained median.
- Added independent rescued-attack pitch/voicing replay validator `analyzer/v143_attack_shadow_v1_replay_validator.py` at commit `d917e1193bf57d3b31bebce2427fae9523ac7057` and durable summary `debug/v143-contextual-prune/precision-attack-shadow-v1-validation.json` at commit `bf25366d68561fc7c995e2b115e5e1314f8e7ff4`.
- Independent v2 pitch reconstruction for the 26 rescued attacks yields `36` observed/source-supported pitches total: `18` single-note attacks, `6` two-note attacks, `2` three-note attacks; unobserved/invented pitches `0`.
- Deterministic standard-tuning voicing keeps all `36`; voicing drops `0`, unplayable primaries `0`, grid-time collisions with baseline attacks `0`.
- Important boundary: schema-2 intentionally does not persist the full downstream CQT/stem universe needed to recompute technique/sustain for hypothetical newly retained attacks. Therefore this is a validated **precision shadow**, not a freeze-ready candidate; do not fabricate missing technique annotations.
- Next CPU-only work: test whether the 26 rescues are structurally supported across repeated source patterns and inspect the remaining 233 pruned attacks for a second general source-only failure mode. Do not broaden the attack policy or authorize L4 from these results alone.
- `main`/Production untouched. Protected runtime remains blob `7f72f8ed9b14af8bc93e95544195204d99c6bec1`.
EOF
          fi

          rm -f debug/v143-contextual-prune/attack-shadow-cpu-verify-request.txt
          rm -f .github/workflows/v143-attack-shadow-cpu-verify-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/checkpoints/CURRENT_STATE.md debug/v143-contextual-prune/attack-shadow-cpu-verify-request.txt .github/workflows/v143-attack-shadow-cpu-verify-once.yml
          git commit -m "checkpoint: validate attack shadow from pinned CPU fixture"
          git push origin HEAD:v143-contextual-prune-lobo
