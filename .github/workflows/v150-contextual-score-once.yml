name: V150 contextual singleton Gold score once

on:
  push:
    paths:
      - '.github/workflows/v150-contextual-score-once.yml'

permissions:
  contents: write

jobs:
  score-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Reference-free preflight
        run: |
          set -euo pipefail
          test ! -e debug/v150-contextual-singleton/phase-c-score/score-result.json
          test ! -e debug/v150-contextual-singleton/phase-c-score-complete-sentinel.json
          test "$(git hash-object debug/v150-contextual-singleton/phase-c-scoring-authorization.json)" = "5fbf389df62c89702e911dc38097f5833e6e9b05"
          test "$(git hash-object debug/v150-contextual-singleton/phase-c-scoring-identity-addendum.json)" = "f296197fc5738838d91b968a4fe0465121fa4f9c"
          test "$(git hash-object validation/v150_contextual_singleton/score_once.py)" = "8baab9c30b947690d9d2f5876448f4224f69280c"
          test "$(git hash-object debug/v150-contextual-singleton/phase-c-score-attempt-sentinel.json)" = "9ab3767fdab14aae47eeda9bf7767a07c27fce1b"
          test "$(git hash-object debug/v150-contextual-singleton/candidate/candidate.json)" = "3dc0d09833fe236a5fdfdea0412b2bab74f00e65"
          python validation/v150_contextual_singleton/score_once.py --help >/dev/null
      - name: Consume attempt and checkpoint before Gold
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path('debug/v150-contextual-singleton/phase-c-score-attempt-sentinel.json'); d=json.loads(p.read_text())
          if d.get('status')!='ARMED_NOT_CONSUMED' or d.get('goldOpened') is not False or d.get('referenceParsed') is not False or d.get('scoreCallCount')!=0: raise SystemExit('V150 score attempt not cleanly armed')
          d['status']='CONSUMED_BEFORE_REFERENCE_ACCESS'; d['runId']=os.environ['RUN_ID']; d['runHeadSha']=os.environ['HEAD_SHA']; d['consumedAtUtc']=datetime.now(timezone.utc).isoformat(); p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          cp=Path('docs/checkpoints/CURRENT_STATE.md'); marker='## V150 Phase C Gold score — AUTHORIZED / CONSUMED BEFORE REFERENCE ACCESS — 2026-08-27 UTC'; text=cp.read_text()
          if marker in text: raise SystemExit('duplicate V150 pre-score checkpoint')
          text += f'''\n\n{marker}\n- Exactly one score authorized for immutable V150 candidate SHA `72a0582cfc7d03d84cd2f878f191a69b7262b200ce248d1a896207444a3c5e4e`: 1144 events / **33 singleton changes / 0 polyphonic changes / 100.00% PDF fidelity**.\n- Scorer blob `8baab9c30b947690d9d2f5876448f4224f69280c`; authorization blob `5fbf389df62c89702e911dc38097f5833e6e9b05`; identity addendum blob `f296197fc5738838d91b968a4fe0465121fa4f9c`; run `{os.environ['RUN_ID']}`.\n- Expected Gold identity will be read reference-free from the persisted V149 result and required to be 64 lowercase hex.\n- Attempt consumed before Gold. Gold/reference opened **NO**; reference parsed **NO**; score calls **0**. No search/alternate rule/threshold/retuning/audio/GPU/Production.\n'''; cp.write_text(text)
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/v150-contextual-singleton/phase-c-score-attempt-sentinel.json docs/checkpoints/CURRENT_STATE.md
          git commit -m 'debug: consume V150 score attempt before Gold [skip ci]'; git push origin HEAD:v143-contextual-prune-lobo
          echo "CONSUMED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Run exactly one frozen V150 Gold score
        run: |
          set -euo pipefail
          python validation/v150_contextual_singleton/score_once.py --output debug/v150-contextual-singleton/phase-c-score/score-result.json | tee /tmp/v150-score-summary.json
      - name: Persist and seal score result
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          rp=Path('debug/v150-contextual-singleton/phase-c-score/score-result.json'); b=rp.read_bytes(); sh=hashlib.sha256(b).hexdigest(); r=json.loads(b)
          if r.get('classification')!='v150-contextual-singleton-authorized-single-gold-calibration-score' or r.get('authorizationScope')!='exactly-one-v150-contextual-singleton-gold-calibration-score': raise SystemExit('V150 result identity mismatch')
          if (r.get('scoringChain') or {}).get('scoreCallCount')!=1 or (r.get('safety') or {}).get('scoreCallCount')!=1: raise SystemExit('V150 score call mismatch')
          ref=(r.get('reference') or {}).get('sha256','')
          if len(ref)!=64: raise SystemExit('V150 runtime Gold SHA length mismatch')
          completion={'schema':'dadrock.tabs.v150.contextual-singleton.phase-c-score-completion.v1','classification':'one-use-v150-gold-score-complete','status':'COMPLETE_SEALED_AFTER_ONE_SCORE','branch':'v143-contextual-prune-lobo','runId':os.environ['RUN_ID'],'runHeadSha':os.environ['HEAD_SHA'],'consumedAttemptCommit':os.environ['CONSUMED_COMMIT'],'completedAtUtc':datetime.now(timezone.utc).isoformat(),'resultPath':str(rp),'resultSha256':sh,'candidateCanonicalEventSha256':'72a0582cfc7d03d84cd2f878f191a69b7262b200ce248d1a896207444a3c5e4e','goldSha256':ref,'scoreCallCount':1,'candidateSearchRun':False,'alternateCandidateConstructed':False,'alternateContextRuleTested':False,'alternateThresholdTested':False,'retuningRun':False,'audioRecomputed':False,'modalGpuUsed':False,'productionIntegrated':False,'automaticPromotion':False}
          Path('debug/v150-contextual-singleton/phase-c-score-complete-sentinel.json').write_text(json.dumps(completion,indent=2,sort_keys=True)+'\n'); Path('/tmp/v150-result-sha').write_text(sh)
          PY
          git add debug/v150-contextual-singleton/phase-c-score/score-result.json debug/v150-contextual-singleton/phase-c-score-complete-sentinel.json
          git commit -m 'debug: persist one-use V150 Gold score [skip ci]'; git push origin HEAD:v143-contextual-prune-lobo
          echo "RESULT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"; echo "RESULT_SHA=$(cat /tmp/v150-result-sha)" >> "$GITHUB_ENV"
      - name: Final checkpoint and self-seal
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('debug/v150-contextual-singleton/phase-c-score/score-result.json').read_text()); c=r['comparison']; score=r['score']; cv=c['candidateDisplayVectorPercent']; bv=c['acceptedBaselineDisplayVectorPercent']; pv=c['v149DisplayVectorPercent']; fmt=lambda x:' / '.join(f'{float(v):.3f}' for v in x)
          cp=Path('docs/checkpoints/CURRENT_STATE.md'); marker='## V150 Phase C contextual singleton Gold score — COMPLETE / SEALED — 2026-08-27 UTC'; text=cp.read_text()
          if marker in text: raise SystemExit('duplicate V150 final score checkpoint')
          text += f'''\n\n{marker}\n- Exactly one historical Gold score completed in run `{os.environ['RUN_ID']}`; result SHA256 **`{os.environ['RESULT_SHA']}`**; persistence commit **`{os.environ['RESULT_COMMIT']}`**.\n- V150 percentages (pitch content / pitch timing / string-fret timing / chord pitch-set / measure coverage / PDF fidelity): **{fmt(cv)}**.\n- Accepted baseline percentages: **{fmt(bv)}**. V149 percentages: **{fmt(pv)}**.\n- Critical mismatches: **{int(score['criticalMismatchCount'])}**; delta vs baseline **{int(c['criticalMismatchDeltaVsAcceptedBaseline']):+d}**; delta vs V149 **{int(c['criticalMismatchDeltaVsV149']):+d}**.\n- Runtime Gold SHA verified from persisted V149 reference identity: **`{r['reference']['sha256']}`** (64 chars).\n- Safety: total score calls **1**; search/alternate candidate/context rule/threshold/retuning/audio/HPSS/CQT/Modal/GPU/Production/promotion **NO**.\n- V150 score authorization consumed; workflow deleted in this sealing commit. No automatic promotion even if the score crosses baseline.\n'''; cp.write_text(text)
          PY
          git rm .github/workflows/v150-contextual-score-once.yml
          git add docs/checkpoints/CURRENT_STATE.md
          git commit -m 'docs: checkpoint and seal completed V150 Gold score [skip ci]'; git push origin HEAD:v143-contextual-prune-lobo
