name: V163 one-shot V162-algorithm CPU execution

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v163-generate.yml

permissions:
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: d900ee1706c96663b43d3b74f56194bc38ce4afa
  SOURCE_AUDIO: /tmp/v163-source.m4a
  NORM_WAV: /tmp/v163-normalized.wav
  DEMUCS_DIR: /tmp/v163-demucs
  STEM_DIR: /tmp/v163-demucs/htdemucs_6s/v163-normalized
  V163_PREREG: debug/v163-cpu-autonomous/preregistration.json
  PRE_RUN: debug/v163-cpu-autonomous/pre-run-identity-receipt.json
  PREREG: debug/v162-cpu-autonomous/preregistration.json
  CONTRACT: debug/v162-cpu-autonomous/implementation-contract.json
  NEGATIVE_GUARD: debug/v162-cpu-autonomous/negative-runtime-guard.py
  EVENT_LOGIC: validation/v162_cpu_autonomous/event_logic_v162.py
  EVENT_TEST: validation/v162_cpu_autonomous/test_event_logic_v162.py
  TIMEBASE_BUILDER: validation/v162_cpu_autonomous/build_timebase_v162.py
  TIMEBASE_QC_CODE: validation/v162_cpu_autonomous/timebase_qc_v162.py
  TRANSCRIBER: validation/v162_cpu_autonomous/transcribe_v162.py
  STRUCTURAL_QC_CODE: validation/v162_cpu_autonomous/structural_qc_v162.py
  JSON_NATIVE_TEST: validation/v162_cpu_autonomous/test_json_native_v162.py
  ENV_RECEIPT: debug/v163-cpu-autonomous/environment-receipt.json
  TIMEBASE: debug/v163-cpu-autonomous/timebase.json
  TIMEBASE_QC: debug/v163-cpu-autonomous/timebase-qc.json
  OUTPUT: debug/v163-cpu-autonomous/generated.json
  GENERATION_RECEIPT: debug/v163-cpu-autonomous/generation-receipt.json
  STRUCTURAL_QC: debug/v163-cpu-autonomous/structural-qc.json
  TERMINAL_FREEZE: debug/v163-cpu-autonomous/terminal-freeze.json
  CUDA_VISIBLE_DEVICES: ""
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  generate-once:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify V163 one-shot identity and sealed boundaries
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v163-generate.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"

          test "$(git hash-object "$V163_PREREG")" = "33c0eb36423bd5b014035e3a475b4232b0decf9a"
          test "$(git hash-object "$PRE_RUN")" = "ac47d48b3df3842725ab9a3c1995831d487f1b78"
          test "$(git hash-object "$PREREG")" = "5c886fec4ac323b361d9128a51a25c6ccb03952b"
          test "$(git hash-object "$CONTRACT")" = "409da313ed03a6c232d6578d48b0da6aa35b000b"
          test "$(git hash-object "$EVENT_LOGIC")" = "9f9b33fd8c210ad581025b454cf69b6999aa544b"
          test "$(git hash-object "$EVENT_TEST")" = "e301f38db66f44193d799a9c1a02c99169823d45"
          test "$(git hash-object "$TIMEBASE_BUILDER")" = "f7e9483aea16af770bcffe01ad8cfaf689d693b9"
          test "$(git hash-object "$TIMEBASE_QC_CODE")" = "78acc9fd626039801011d039cca12686b72369c0"
          test "$(git hash-object "$TRANSCRIBER")" = "fa163cafe2131aa73cdbb50df10d4e4912cff53b"
          test "$(git hash-object "$STRUCTURAL_QC_CODE")" = "b7d3fa92fc9f3bed00931d19097e08cd91eab62b"
          test "$(git hash-object "$JSON_NATIVE_TEST")" = "654557363745f580f425252395542e9fb91adaad"
          test "$(git hash-object "$NEGATIVE_GUARD")" = "8d40bc7f3dce9c9717e41fa1060c553434ad9959"

          for path in "$ENV_RECEIPT" "$TIMEBASE" "$TIMEBASE_QC" "$OUTPUT" "$GENERATION_RECEIPT" "$STRUCTURAL_QC" "$TERMINAL_FREEZE"; do
            test ! -e "$path"
          done

          python "$NEGATIVE_GUARD" \
            --event-logic "$EVENT_LOGIC" \
            --event-test "$EVENT_TEST" \
            --timebase-builder "$TIMEBASE_BUILDER" \
            --timebase-qc "$TIMEBASE_QC_CODE" \
            --transcriber "$TRANSCRIBER" \
            --structural-qc "$STRUCTURAL_QC_CODE" \
            --json-native-test "$JSON_NATIVE_TEST" \
            --workflow .github/workflows/v163-generate.yml

          python - <<'PY'
          import json
          from pathlib import Path

          carry = json.loads(Path("debug/v163-cpu-autonomous/preregistration.json").read_text())
          assert carry["schema"] == "dadrock.tabs.v163.v162-algorithm-carry-forward-preregistration.v1"
          assert carry["version"] == "V163"
          assert carry["validation"] == "PASS"
          assert carry["carryForwardPolicy"]["algorithmVersion"] == "V162"
          assert carry["carryForwardPolicy"]["executionVersion"] == "V163"
          assert carry["carryForwardPolicy"]["exactV162AlgorithmAndNumericsRequired"] is True
          for key in ("algorithmChangeForbidden", "numericChangeForbidden", "thresholdChangeForbidden", "fixtureChangeForbidden", "implementationCodeChangeForbidden", "referenceGuidedChangeForbidden", "priorCandidateMiningForbidden", "humanCorrectionForbidden"):
              assert carry["carryForwardPolicy"][key] is True, key
          assert carry["predecessorTerminal"]["outcome"] == "PRE_RUN_GUARD_FAIL"
          assert carry["predecessorTerminal"]["pipelineStepExecuted"] is False
          assert carry["predecessorTerminal"]["candidateCreated"] is False
          assert carry["predecessorTerminal"]["neverRearmV162"] is True

          receipt = json.loads(Path("debug/v163-cpu-autonomous/pre-run-identity-receipt.json").read_text())
          assert receipt["schema"] == "dadrock.tabs.v162.pre-run-identity-receipt.v1"
          assert receipt["version"] == "V163"
          assert receipt["implementationVersion"] == "V162"
          assert receipt["executionVersion"] == "V163"
          assert receipt["validation"] == "PASS"
          assert receipt["status"] == "SEALED_BEFORE_GENERATION_WORKFLOW"
          assert receipt["v163Preregistration"]["gitBlob"] == "33c0eb36423bd5b014035e3a475b4232b0decf9a"
          expected = {
              "preregistration": "5c886fec4ac323b361d9128a51a25c6ccb03952b",
              "implementationContract": "409da313ed03a6c232d6578d48b0da6aa35b000b",
              "eventLogic": "9f9b33fd8c210ad581025b454cf69b6999aa544b",
              "eventFixture": "e301f38db66f44193d799a9c1a02c99169823d45",
              "timebaseBuilder": "f7e9483aea16af770bcffe01ad8cfaf689d693b9",
              "timebaseQc": "78acc9fd626039801011d039cca12686b72369c0",
              "transcriber": "fa163cafe2131aa73cdbb50df10d4e4912cff53b",
              "structuralQc": "b7d3fa92fc9f3bed00931d19097e08cd91eab62b",
              "jsonNativeFixture": "654557363745f580f425252395542e9fb91adaad",
              "negativeRuntimeGuard": "8d40bc7f3dce9c9717e41fa1060c553434ad9959",
          }
          assert receipt["pinnedGitBlobs"] == expected
          inherited = receipt["inheritedStaticValidation"]
          assert inherited["runId"] == 33212668072
          assert inherited["runNumber"] == 1
          assert inherited["runAttempt"] == 1
          assert inherited["jobId"] == 98989283094
          assert inherited["conclusion"] == "success"
          for key in ("compile", "negativeRuntimeGuard", "eventSubdivisionFixtures", "jsonNativeFixture", "finalRuntimeAbsenceProof"):
              assert inherited[key] == "PASS", key
          for key in (
              "environmentReceiptMustNotExistAtSeal", "timebaseMustNotExistAtSeal",
              "timebaseQcReceiptMustNotExistAtSeal", "candidateMustNotExistAtSeal",
              "generationReceiptMustNotExistAtSeal", "structuralQcReceiptMustNotExistAtSeal",
              "terminalFreezeMustNotExistAtSeal", "generationWorkflowMustNotExistAtSeal",
          ):
              assert receipt[key] is True, key
          assert receipt["referenceReadAtSeal"] is False
          assert receipt["professionalReferencePathsOpenedAtSeal"] == 0
          assert receipt["frozenScorerReadAtSeal"] is False
          assert receipt["V161CandidateReadAtSeal"] is False
          assert receipt["priorGeneratedCandidateReadAtSeal"] is False
          assert receipt["priorScoreReadAtSeal"] is False
          assert receipt["referenceFacingScoreCallsAtSeal"] == 0
          assert receipt["songAudioExecutionsAtSeal"] == 0
          assert receipt["demucsExecutionsAtSeal"] == 0
          assert receipt["basicPitchExecutionsAtSeal"] == 0
          assert receipt["pyinExecutionsAtSeal"] == 0
          assert receipt["pitchInferenceExecutionsAtSeal"] == 0
          assert receipt["gpuExecutionsAtSeal"] == 0
          assert receipt["cudaExecutionsAtSeal"] == 0
          assert receipt["modalExecutionsAtSeal"] == 0
          assert receipt["mainOrProductionModifiedAtSeal"] is False
          boundary = receipt["generationBoundary"]
          assert boundary["device"] == "cpu"
          assert boundary["workflowPath"] == ".github/workflows/v163-generate.yml"
          assert boundary["runtimeDirectory"] == "debug/v163-cpu-autonomous"
          assert boundary["workflowCreationIsSoleTrigger"] is True
          assert boundary["expectedRunCount"] == 1
          assert boundary["expectedRunNumber"] == 1
          assert boundary["expectedRunAttempt"] == 1
          assert boundary["maximumGenerationRuns"] == 1
          for key in (
              "rerunForbidden", "duplicateRunForbidden", "secondArmForbidden",
              "finishAllBranchWritesBeforeArm", "assistantOrManualBranchWritesWhileActiveForbidden",
              "freshSourceMaterializationRequired", "freshNormalizationRequired", "freshDemucsRequired",
              "environmentReceiptRequired", "freshTimebaseRequired", "freshIndependentTimebaseQcRequired",
              "pitchInferenceBeforeTimebaseQcPassForbidden", "freshPitchInferenceRequiredAfterTimebaseQcPass",
              "freshIndependentStructuralQcRequired", "onlyStructuralQcPassCandidateMayBecomeAuthoritative",
              "onlyAuthoritativeCandidateMayLaterBeScored", "terminalSelfSealRequired", "workflowSelfDeleteRequired",
              "professionalReferenceReadDuringGenerationForbidden", "scorerReadDuringGenerationForbidden",
              "priorCandidateReadDuringGenerationForbidden", "priorScoreReadDuringGenerationForbidden", "gpuCudaModalForbidden",
          ):
              assert boundary[key] is True, key
          PY

      - name: Execute sole V163 CPU pipeline using frozen V162 algorithm
        id: pipeline
        shell: bash
        run: |
          set -u
          mkdir -p debug/v163-cpu-autonomous
          printf '%s\n' "PIPELINE_STARTED" > /tmp/v163-stage
          printf '%s\n' "PIPELINE_UNEXPECTED_FAILURE" > /tmp/v163-outcome

          fail_stage() {
            printf '%s\n' "$1" > /tmp/v163-outcome
            exit 0
          }

          if ! python -m pip install --upgrade pip; then fail_stage "DEPENDENCY_BOOTSTRAP_FAIL"; fi
          if ! python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0; then fail_stage "TORCH_INSTALL_FAIL"; fi
          if ! python -m pip install \
            numpy==1.26.4 scipy==1.13.1 soundfile==0.12.1 \
            basic-pitch==0.4.0 demucs==4.1.0 imageio-ffmpeg==0.6.0 librosa==0.11.0; then
            fail_stage "DEPENDENCY_INSTALL_FAIL"
          fi
          printf '%s\n' "DEPENDENCIES_INSTALLED" > /tmp/v163-stage

          if ! python - <<'PY'
          import importlib.metadata as md
          import torch
          assert torch.__version__ == "2.8.0+cpu", torch.__version__
          assert torch.version.cuda is None
          assert torch.cuda.is_available() is False
          pins = {
              "numpy": "1.26.4", "scipy": "1.13.1", "soundfile": "0.12.1",
              "basic-pitch": "0.4.0", "demucs": "4.1.0",
              "imageio-ffmpeg": "0.6.0", "librosa": "0.11.0",
          }
          for package, expected in pins.items():
              assert md.version(package) == expected, (package, md.version(package), expected)
          PY
          then fail_stage "CPU_DEPENDENCY_ASSERTION_FAIL"; fi

          if ! git show 74b0f815ff3f66f325220975c410621503de440f:public/gomywayfullaitest.m4a > "$SOURCE_AUDIO"; then
            fail_stage "SOURCE_MATERIALIZATION_FAIL"
          fi
          if ! python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path("/tmp/v163-source.m4a")
          assert p.stat().st_size == 3478611
          assert hashlib.sha256(p.read_bytes()).hexdigest() == "215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f"
          PY
          then fail_stage "SOURCE_IDENTITY_FAIL"; fi
          printf '%s\n' "SOURCE_VERIFIED" > /tmp/v163-stage

          FFMPEG_EXE="$(python - <<'PY'
          import imageio_ffmpeg
          print(imageio_ffmpeg.get_ffmpeg_exe())
          PY
          )"
          if ! "$FFMPEG_EXE" -hide_banner -loglevel error -y \
            -i "$SOURCE_AUDIO" -ar 44100 -ac 2 -c:a pcm_s16le "$NORM_WAV"; then
            fail_stage "NORMALIZATION_FAIL"
          fi
          if ! python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path("/tmp/v163-normalized.wav")
          assert hashlib.sha256(p.read_bytes()).hexdigest() == "3e61b7926eabc21b758c750f826c7426a29d6de5aafdd5c93f8045ecdc67f87e"
          PY
          then fail_stage "NORMALIZED_IDENTITY_FAIL"; fi
          printf '%s\n' "NORMALIZED_VERIFIED" > /tmp/v163-stage

          if ! python - <<'PY'
          import random
          import numpy as np
          import torch
          from demucs.separate import main
          random.seed(0)
          np.random.seed(0)
          torch.manual_seed(0)
          torch.set_num_threads(1)
          torch.set_num_interop_threads(1)
          torch.use_deterministic_algorithms(True)
          main([
              "-n", "htdemucs_6s", "-d", "cpu", "--shifts", "1", "-j", "1",
              "-o", "/tmp/v163-demucs", "/tmp/v163-normalized.wav",
          ])
          PY
          then fail_stage "DEMUCS_FAIL"; fi
          for stem in guitar bass drums; do
            test -s "$STEM_DIR/$stem.wav" || fail_stage "DEMUCS_STEM_MISSING_${stem^^}"
          done
          printf '%s\n' "DEMUCS_VERIFIED" > /tmp/v163-stage

          if ! python - <<'PY'
          import hashlib, importlib.metadata as md, json, os, platform, subprocess
          from pathlib import Path
          import torch

          def sha(path):
              h = hashlib.sha256()
              with Path(path).open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def git_blob(path):
              return subprocess.check_output(["git", "hash-object", path], text=True).strip()

          receipt = {
              "schema": "dadrock.tabs.v162.cpu-environment-receipt.v1",
              "version": "V163",
              "implementationVersion": "V162",
              "validation": "PASS",
              "device": "cpu",
              "pythonVersion": platform.python_version(),
              "torchVersion": torch.__version__,
              "torchCudaVersion": torch.version.cuda,
              "cudaAvailable": torch.cuda.is_available(),
              "workflowRunId": int(os.environ["GITHUB_RUN_ID"]),
              "workflowRunNumber": int(os.environ["GITHUB_RUN_NUMBER"]),
              "workflowRunAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflowHeadSha": os.environ["GITHUB_SHA"],
              "generationWorkflowGitBlob": git_blob(".github/workflows/v163-generate.yml"),
              "preRunIdentityReceiptGitBlob": git_blob("debug/v163-cpu-autonomous/pre-run-identity-receipt.json"),
              "dependencyVersions": {
                  "numpy": md.version("numpy"), "scipy": md.version("scipy"),
                  "soundfile": md.version("soundfile"), "basic-pitch": md.version("basic-pitch"),
                  "demucs": md.version("demucs"), "imageio-ffmpeg": md.version("imageio-ffmpeg"),
                  "librosa": md.version("librosa"),
              },
              "determinism": {
                  "seed": 0, "torchDeterministicAlgorithms": True,
                  "torchNumThreads": 1, "torchNumInteropThreads": 1, "mathLibraryThreads": 1,
              },
              "separation": {
                  "model": "htdemucs_6s", "device": "cpu", "shifts": 1, "jobs": 1, "repeatCount": 1,
                  "normalizedMixSha256": sha("/tmp/v163-normalized.wav"),
                  "guitarStemSha256": sha("/tmp/v163-demucs/htdemucs_6s/v163-normalized/guitar.wav"),
                  "bassStemSha256": sha("/tmp/v163-demucs/htdemucs_6s/v163-normalized/bass.wav"),
                  "drumsStemSha256": sha("/tmp/v163-demucs/htdemucs_6s/v163-normalized/drums.wav"),
              },
              "safety": {
                  "referenceRead": False, "professionalReferencePathsOpened": 0,
                  "referenceFacingScoreCalls": 0, "frozenScorerRead": False,
                  "V161CandidateRead": False, "priorGeneratedCandidateRead": False,
                  "priorScoreRead": False, "referenceGuidedFiltering": False,
                  "thresholdSweep": False, "variantSelection": False, "humanCorrection": False,
                  "cudaGpuUsed": False, "modalUsed": False, "mainOrProductionModified": False,
              },
          }
          assert receipt["torchVersion"] == "2.8.0+cpu"
          assert receipt["torchCudaVersion"] is None
          assert receipt["cudaAvailable"] is False
          assert receipt["workflowRunNumber"] == 1
          assert receipt["workflowRunAttempt"] == 1
          assert receipt["preRunIdentityReceiptGitBlob"] == "ac47d48b3df3842725ab9a3c1995831d487f1b78"
          Path("debug/v163-cpu-autonomous/environment-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True, allow_nan=False) + "\n"
          )
          PY
          then fail_stage "ENVIRONMENT_RECEIPT_FAIL"; fi
          printf '%s\n' "ENVIRONMENT_FROZEN" > /tmp/v163-stage

          set +e
          python "$TIMEBASE_BUILDER" \
            --source-audio "$SOURCE_AUDIO" --mix "$NORM_WAV" \
            --drums "$STEM_DIR/drums.wav" --bass "$STEM_DIR/bass.wav" --guitar "$STEM_DIR/guitar.wav" \
            --preregistration "$PREREG" --implementation-contract "$CONTRACT" --output "$TIMEBASE"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then rm -f "$TIMEBASE"; fail_stage "TIMEBASE_BUILD_FAIL"; fi
          test -s "$TIMEBASE" || fail_stage "TIMEBASE_BUILD_MISSING_ARTIFACT"
          printf '%s\n' "TIMEBASE_BUILT" > /tmp/v163-stage

          set +e
          python "$TIMEBASE_QC_CODE" \
            --timebase "$TIMEBASE" --source-audio "$SOURCE_AUDIO" --mix "$NORM_WAV" \
            --drums "$STEM_DIR/drums.wav" --bass "$STEM_DIR/bass.wav" --guitar "$STEM_DIR/guitar.wav" \
            --preregistration "$PREREG" --implementation-contract "$CONTRACT" --receipt "$TIMEBASE_QC"
          rc=$?
          set -e
          if [ ! -s "$TIMEBASE_QC" ]; then fail_stage "TIMEBASE_QC_RUNTIME_FAIL"; fi
          tbq="$(python - <<'PY'
          import json
          print(json.load(open("debug/v163-cpu-autonomous/timebase-qc.json"))["validation"])
          PY
          )"
          if [ "$rc" -ne 0 ]; then
            if [ "$tbq" = "FAIL" ]; then printf '%s\n' "TIMEBASE_QC_FAIL" > /tmp/v163-outcome; exit 0; fi
            fail_stage "TIMEBASE_QC_RUNTIME_FAIL"
          fi
          [ "$tbq" = "PASS" ] || fail_stage "TIMEBASE_QC_NONPASS_WITH_ZERO_EXIT"
          printf '%s\n' "TIMEBASE_QC_PASS" > /tmp/v163-stage

          set +e
          python "$TRANSCRIBER" \
            --mix "$NORM_WAV" --guitar "$STEM_DIR/guitar.wav" --bass "$STEM_DIR/bass.wav" --drums "$STEM_DIR/drums.wav" \
            --timebase "$TIMEBASE" --timebase-qc "$TIMEBASE_QC" \
            --preregistration "$PREREG" --implementation-contract "$CONTRACT" \
            --pre-run-receipt "$PRE_RUN" --environment-receipt "$ENV_RECEIPT" \
            --output "$OUTPUT" --receipt "$GENERATION_RECEIPT"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then rm -f "$OUTPUT" "$GENERATION_RECEIPT"; fail_stage "TRANSCRIBER_FAIL"; fi
          test -s "$OUTPUT" || fail_stage "TRANSCRIBER_MISSING_CANDIDATE"
          test -s "$GENERATION_RECEIPT" || fail_stage "TRANSCRIBER_MISSING_RECEIPT"
          printf '%s\n' "CANDIDATE_CREATED" > /tmp/v163-stage

          set +e
          python "$STRUCTURAL_QC_CODE" \
            --candidate "$OUTPUT" --generation-receipt "$GENERATION_RECEIPT" \
            --timebase "$TIMEBASE" --timebase-qc "$TIMEBASE_QC" \
            --mix "$NORM_WAV" --drums "$STEM_DIR/drums.wav" --guitar "$STEM_DIR/guitar.wav" --bass "$STEM_DIR/bass.wav" \
            --preregistration "$PREREG" --implementation-contract "$CONTRACT" \
            --pre-run-receipt "$PRE_RUN" --environment-receipt "$ENV_RECEIPT" \
            --event-logic "$EVENT_LOGIC" --transcriber "$TRANSCRIBER" \
            --timebase-builder "$TIMEBASE_BUILDER" --timebase-qc-code "$TIMEBASE_QC_CODE" \
            --negative-runtime-guard "$NEGATIVE_GUARD" --receipt "$STRUCTURAL_QC"
          rc=$?
          set -e
          if [ ! -s "$STRUCTURAL_QC" ]; then printf '%s\n' "STRUCTURAL_QC_RUNTIME_FAIL" > /tmp/v163-outcome; exit 0; fi
          sqc="$(python - <<'PY'
          import json
          print(json.load(open("debug/v163-cpu-autonomous/structural-qc.json"))["validation"])
          PY
          )"
          if [ "$rc" -ne 0 ]; then
            if [ "$sqc" = "FAIL" ]; then printf '%s\n' "STRUCTURAL_QC_FAIL" > /tmp/v163-outcome; exit 0; fi
            printf '%s\n' "STRUCTURAL_QC_RUNTIME_FAIL" > /tmp/v163-outcome
            exit 0
          fi
          [ "$sqc" = "PASS" ] || fail_stage "STRUCTURAL_QC_NONPASS_WITH_ZERO_EXIT"
          printf '%s\n' "STRUCTURAL_QC_PASS" > /tmp/v163-stage
          printf '%s\n' "STRUCTURAL_QC_PASS" > /tmp/v163-outcome

      - name: Freeze terminal V163 execution state and self-seal
        if: ${{ always() && github.run_number == 1 && github.run_attempt == 1 }}
        shell: bash
        env:
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
        run: |
          set -euo pipefail
          outcome="$(cat /tmp/v163-outcome 2>/dev/null || printf '%s' 'PIPELINE_UNEXPECTED_FAILURE')"
          stage="$(cat /tmp/v163-stage 2>/dev/null || printf '%s' 'UNKNOWN')"
          if [ "$GUARD_OUTCOME" != "success" ]; then outcome="PRE_RUN_GUARD_FAIL"; stage="PRE_RUN_GUARD"; fi

          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"

          OUTCOME="$outcome" STAGE="$stage" python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          paths = {
              "environmentReceipt": Path("debug/v163-cpu-autonomous/environment-receipt.json"),
              "timebase": Path("debug/v163-cpu-autonomous/timebase.json"),
              "timebaseQc": Path("debug/v163-cpu-autonomous/timebase-qc.json"),
              "candidate": Path("debug/v163-cpu-autonomous/generated.json"),
              "generationReceipt": Path("debug/v163-cpu-autonomous/generation-receipt.json"),
              "structuralQc": Path("debug/v163-cpu-autonomous/structural-qc.json"),
          }

          def sha(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def git_blob(path):
              return subprocess.check_output(["git", "hash-object", path], text=True).strip()

          artifacts = {
              name: {
                  "exists": path.is_file(),
                  "sha256": sha(path) if path.is_file() else None,
                  "gitBlob": git_blob(path) if path.is_file() else None,
              }
              for name, path in paths.items()
          }
          outcome = os.environ["OUTCOME"]
          authoritative = outcome == "STRUCTURAL_QC_PASS"
          if outcome == "TIMEBASE_QC_FAIL":
              assert artifacts["candidate"]["exists"] is False
              assert artifacts["generationReceipt"]["exists"] is False
              assert artifacts["structuralQc"]["exists"] is False
          if outcome in {"STRUCTURAL_QC_PASS", "STRUCTURAL_QC_FAIL"}:
              assert artifacts["candidate"]["exists"] is True
              assert artifacts["generationReceipt"]["exists"] is True
              assert artifacts["structuralQc"]["exists"] is True
          if outcome == "STRUCTURAL_QC_RUNTIME_FAIL":
              assert artifacts["candidate"]["exists"] is True
              assert artifacts["generationReceipt"]["exists"] is True

          freeze = {
              "schema": "dadrock.tabs.v163.v162-algorithm-execution-terminal.v1",
              "version": "V163",
              "implementationVersion": "V162",
              "status": "TERMINAL",
              "outcome": outcome,
              "lastCompletedStage": os.environ["STAGE"],
              "workflowRunId": int(os.environ["GITHUB_RUN_ID"]),
              "workflowRunNumber": int(os.environ["GITHUB_RUN_NUMBER"]),
              "workflowRunAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflowHeadSha": os.environ["GITHUB_SHA"],
              "generationWorkflowGitBlob": git_blob(".github/workflows/v163-generate.yml"),
              "v163PreregistrationGitBlob": "33c0eb36423bd5b014035e3a475b4232b0decf9a",
              "preRunIdentityReceiptGitBlob": "ac47d48b3df3842725ab9a3c1995831d487f1b78",
              "candidateAuthoritative": authoritative,
              "eligibleForProfessionalReferenceScoring": authoritative,
              "neverRearmV163": True,
              "candidateIsExactFrozenV162AlgorithmOutput": artifacts["candidate"]["exists"],
              "artifacts": artifacts,
              "safety": {
                  "referenceRead": False, "professionalReferencePathsOpened": 0,
                  "referenceFacingScoreCalls": 0, "frozenScorerRead": False,
                  "V161CandidateRead": False, "priorGeneratedCandidateRead": False,
                  "priorScoreRead": False, "referenceGuidedFiltering": False,
                  "thresholdSweep": False, "variantSelection": False, "humanCorrection": False,
                  "cudaGpuUsed": False, "modalUsed": False, "mainOrProductionModified": False,
              },
          }
          assert freeze["workflowRunNumber"] == 1
          assert freeze["workflowRunAttempt"] == 1
          Path("debug/v163-cpu-autonomous/terminal-freeze.json").write_text(
              json.dumps(freeze, indent=2, sort_keys=True, allow_nan=False) + "\n"
          )
          PY

          rm .github/workflows/v163-generate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- debug/v163-cpu-autonomous .github/workflows/v163-generate.yml
          changed="$(git diff --cached --name-only)"
          test -n "$changed"
          if echo "$changed" | grep -Ev '^debug/v163-cpu-autonomous/(environment-receipt\.json|timebase\.json|timebase-qc\.json|generated\.json|generation-receipt\.json|structural-qc\.json|terminal-freeze\.json)$|^\.github/workflows/v163-generate\.yml$'; then
            echo "Unexpected path in V163 terminal freeze commit" >&2
            exit 1
          fi
          case "$outcome" in
            STRUCTURAL_QC_PASS) message="research: freeze sole V163 V162-algorithm CPU candidate [skip ci]" ;;
            TIMEBASE_QC_FAIL) message="research: freeze terminal V163 timebase-QC failure [skip ci]" ;;
            STRUCTURAL_QC_FAIL) message="research: freeze terminal V163 structural-QC failure [skip ci]" ;;
            *) message="research: freeze terminal V163 execution failure [skip ci]" ;;
          esac
          git commit -m "$message"
          git push origin HEAD:"$BRANCH"
          if [ "$outcome" != "STRUCTURAL_QC_PASS" ]; then exit 1; fi
