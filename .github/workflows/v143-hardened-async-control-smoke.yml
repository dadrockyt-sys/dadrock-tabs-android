name: V143 Hardened Async Control Smoke

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - '.github/workflows/v143-hardened-async-control-smoke.yml'

permissions:
  contents: read

env:
  MODAL_ENVIRONMENT: main
  PYTHONUNBUFFERED: '1'
  V143_HTTP_APP_NAME: dadrock-v143-async-control-smoke
  V143_ASYNC_RESULT_QUEUE_NAME: dadrock-v143-async-control-smoke-results

jobs:
  hardened-async-control-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install 'modal==1.5.5' >/dev/null
          modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET" >/dev/null

      - name: Deploy exact hardened bridge source to isolated app
        shell: bash
        run: |
          set -euo pipefail
          modal deploy --env main analyzer/v143_modal_http_endpoint.py

      - name: Run synthetic protocol smoke only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug/v143-contextual-prune/hardened-async-control
          python - <<'PY'
          import json
          import modal
          from pathlib import Path

          app_name = 'dadrock-v143-async-control-smoke'
          smoke = modal.Function.from_name(app_name, 'async_protocol_smoke', environment_name='main')
          result = smoke.remote()
          required = {
              'tokenVerified': True,
              'queueRoundtrip': True,
              'queueCleared': True,
              'modelExecuted': False,
              'audioRead': False,
          }
          for key, expected in required.items():
              if result.get(key) != expected:
                  raise SystemExit(f'{key} mismatch: {result.get(key)!r}')
          summary = {
              'schemaVersion': 1,
              'gate': 'v143-hardened-async-control-smoke',
              'isolatedApp': app_name,
              'isolatedQueue': 'dadrock-v143-async-control-smoke-results',
              'protocolSmokePassed': True,
              'resultTtlSeconds': result.get('resultTtlSeconds'),
              'rawAudioQueued': False,
              'stemBytesQueued': False,
              'audioRead': False,
              'modelExecuted': False,
              'referenceFacingInputs': 0,
              'referenceScoreCalls': 0,
              'qualityVerdictMade': False,
          }
          Path('debug/v143-contextual-prune/hardened-async-control/summary.json').write_text(
              json.dumps(summary, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-hardened-async-control-smoke
          path: debug/v143-contextual-prune/hardened-async-control/summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Stop isolated app
        if: always()
        shell: bash
        run: |
          modal app stop "$V143_HTTP_APP_NAME" --env main --yes || true
