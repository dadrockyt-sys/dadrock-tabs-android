name: V148 Gold hash score recovery once

on:
  push:
    paths:
      - '.github/workflows/v148-score-hash-recovery-once.yml'

permissions:
  contents: write

jobs:
  recover-score-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Reference-free recovery preflight
        run: |
          set -euo pipefail
          test ! -e debug/v148-singleton-only/phase-c-score/score-result.json
          test ! -e debug/v148-singleton-only/phase-c-score-complete-sentinel.json
          test "$(git hash-object debug/v148-singleton-only/phase-c-score-recovery-attempt-sentinel.json)" = "be7204f43eb3f1bf158b5714c55f8f19f764157f"
          test "$(git hash-object debug/v148-singleton-only/phase-c-score-attempt-sentinel.json)" = "ff1bab2ab7c707bca28f955e1262ce16e2424ca6"
          test "$(git hash-object debug/v148-singleton-only/phase-c-score-recovery-preregistration.json)" = "f912b656c9bdeaaa2803fcecdfd3b212fddab224"
          test "$(git hash-object debug/v148-singleton-only/phase-c-score-constant-diagnosis.json)" = "aaf74ffe149ec0c5943d3f665611c5dad70cba80"
          test "$(git hash-object validation/v148_singleton_only/recover_gold_hash_once.py)" = "1d5b5d03ad1419f5aebfb4f70e27de63d263f2fb"
          test "$(git hash-object validation/v148_singleton_only/score_once.py)" = "8137734218a722bb12f364ecfea3d1b8e526cc2c"
          test "$(git hash-object validation/v147_phase_d/score_once.py)" = "74b31168b629812acde874b89dfcdf022acf987d"
          test "$(git hash-object debug/v147-phase-d-scoring/phase-d-score-result.json)" = "971359f7dc645169f0f2ef5f084d0610af8e5cc3"
          test "$(git hash-object debug/v148-singleton-only/candidate/candidate.json)" = "0d3df7336db965dc111fec067d0abe75ea3926cc"
          test "$(git hash-object debug/v148-singleton-only/phase-c-scoring-authorization.json)" = "2647f1b985339f80b7b9d09afea3eebe49fdabb0"
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          d = json.loads(Path('debug/v148-singleton-only/phase-c-score-constant-diagnosis.json').read_text())
          if d['v148ExpectedGoldShaLength'] != 65 or d['v147ExpectedGoldShaLength'] != 64 or d['scoreCallCount'] != 0:
              raise SystemExit('constant diagnosis gate failed')
          s = json.loads(Path('debug/v148-singleton-only/phase-c-score-attempt-sentinel.json').read_text())
          if s['status'] != 'CONSUMED_BEFORE_REFERENCE_ACCESS' or s['scoreCallCount'] != 0:
              raise SystemExit('prior attempt score-call gate failed')
          # Import recovery launcher only; do not invoke main and do not touch Gold.
          spec = importlib.util.spec_from_file_location('v148_recovery_preflight', 'validation/v148_singleton_only/recover_gold_hash_once.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          PY
          if [ -e public/Professionalexample.jpg ]; then chmod a-rwx public/Professionalexample.jpg; fi
          if [ -e public/gomywayfullaitest.m4a ]; then chmod a-rwx public/gomywayfullaitest.m4a; fi

      - name: Consume recovery attempt before Gold reread
        env:
          RECOVERY_RUN_ID: ${{ github.run_id }}
          RECOVERY_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path('debug/v148-singleton-only/phase-c-score-recovery-attempt-sentinel.json')
          s = json.loads(p.read_text())
          if s.get('status') != 'ARMED_NOT_CONSUMED':
              raise SystemExit('recovery sentinel is not armed')
          if s.get('maximumTotalV148HistoricalScoreCalls') != 1 or s.get('priorAttempt', {}).get('historicalScoreCallCount') != 0:
              raise SystemExit('score-call budget gate failed')
          s['status'] = 'CONSUMED_BEFORE_RECOVERY_REFERENCE_ACCESS'
          s['recoveryRunId'] = os.environ['RECOVERY_RUN_ID']
          s['recoveryHeadSha'] = os.environ['RECOVERY_HEAD_SHA']
          s['consumedAtUtc'] = datetime.now(timezone.utc).isoformat()
          p.write_text(json.dumps(s, indent=2, sort_keys=True) + '\n')

          cp = Path('docs/checkpoints/CURRENT_STATE.md')
          marker = '## V148 Phase C score recovery — CONSUMED / INFRASTRUCTURE-ONLY / BEFORE GOLD REREAD — 2026-08-27 UTC'
          text = cp.read_text()
          if marker in text:
              raise SystemExit('recovery attempt checkpoint already exists')
          text += f'''\n\n{marker}\n- Reference-free diagnosis proved the V148 frozen expected-Gold constant is malformed at 65 characters, while the historical successful V147 runner constant is a valid 64-character SHA and is independently confirmed by the persisted V147 score result.\n- Prior consumed V148 run `33045568440` read Gold once but failed at that malformed identity comparison **before reference parsing and before any historical score call**; V148 score-call count remains **0**.\n- Recovery run `{os.environ['RECOVERY_RUN_ID']}` is now fail-closed. Its one-use recovery sentinel was consumed before any recovery Gold reread.\n- Recovery may patch only the malformed expected Gold SHA **in memory** from the validated historical V147 runner/result, then delegate to the unchanged frozen V148 scoring path. Maximum additional historical score calls: **1**; maximum total V148 score calls: **1**.\n- Candidate/search/retuning/audio/HPSS/CQT/Modal/L4/GPU/main/Production/promotion remain unchanged and forbidden.\n'''
          cp.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/v148-singleton-only/phase-c-score-recovery-attempt-sentinel.json docs/checkpoints/CURRENT_STATE.md
          git commit -m 'debug: consume V148 score hash recovery before Gold reread [skip ci]'
          git push origin HEAD:v143-contextual-prune-lobo
          echo "RECOVERY_CONSUMED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Complete the one authorized historical score call
        run: |
          set -euo pipefail
          python validation/v148_singleton_only/recover_gold_hash_once.py --output debug/v148-singleton-only/phase-c-score/score-result.json | tee /tmp/v148-recovery-score-output.json

      - name: Verify and persist recovered score
        env:
          RECOVERY_RUN_ID: ${{ github.run_id }}
          RECOVERY_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          result_path = Path('debug/v148-singleton-only/phase-c-score/score-result.json')
          payload = result_path.read_bytes()
          result_sha = hashlib.sha256(payload).hexdigest()
          report = json.loads(payload)
          if report.get('classification') != 'v148-singleton-only-authorized-single-gold-calibration-score':
              raise SystemExit('result classification mismatch')
          if report.get('authorizationScope') != 'exactly-one-v148-singleton-only-gold-calibration-score':
              raise SystemExit('authorization scope mismatch')
          if report.get('candidate', {}).get('canonicalEventSha256') != '1be67004dea62b14740241b536339bb7cad2ecf3ee9e98bfb6109f67e4e1b1fa':
              raise SystemExit('candidate identity mismatch')
          ref_sha = report.get('reference', {}).get('sha256')
          if len(ref_sha or '') != 64:
              raise SystemExit('recovered Gold SHA is not 64 characters')
          if report.get('scoringChain', {}).get('scoreCallCount') != 1 or report.get('safety', {}).get('scoreCallCount') != 1:
              raise SystemExit('score-call count mismatch')
          safety = report.get('safety', {})
          for key in ('candidateSearchRun','alternateCandidateConstructed','retuningRun','audioRecomputed','modalGpuUsed','productionIntegrated','automaticPromotionAllowed'):
              if safety.get(key) is not False:
                  raise SystemExit(f'safety flag mismatch: {key}')
          completion = {
              'schema': 'dadrock.tabs.v148.phase-c-score-recovery-completion.v1',
              'classification': 'one-use-v148-gold-score-recovery-complete',
              'status': 'COMPLETE_SEALED_AFTER_ONE_TOTAL_SCORE_CALL',
              'branch': 'v143-contextual-prune-lobo',
              'recoveryRunId': os.environ['RECOVERY_RUN_ID'],
              'recoveryHeadSha': os.environ['RECOVERY_HEAD_SHA'],
              'recoveryConsumedCommit': os.environ['RECOVERY_CONSUMED_COMMIT'],
              'completedAtUtc': datetime.now(timezone.utc).isoformat(),
              'priorFailedGoldReadRunId': '33045568440',
              'priorReferenceParsed': False,
              'priorScoreCallCount': 0,
              'resultPath': str(result_path),
              'resultSha256': result_sha,
              'candidateCanonicalEventSha256': report['candidate']['canonicalEventSha256'],
              'goldSha256': ref_sha,
              'totalV148ScoreCallCount': 1,
              'candidateSearchRun': False,
              'alternateCandidateConstructed': False,
              'retuningRun': False,
              'audioRecomputed': False,
              'modalGpuUsed': False,
              'productionIntegrated': False,
              'automaticPromotion': False
          }
          Path('debug/v148-singleton-only/phase-c-score-complete-sentinel.json').write_text(json.dumps(completion, indent=2, sort_keys=True) + '\n')
          Path('/tmp/v148-result-sha.txt').write_text(result_sha + '\n')
          PY
          git add debug/v148-singleton-only/phase-c-score/score-result.json debug/v148-singleton-only/phase-c-score-complete-sentinel.json
          git commit -m 'debug: persist recovered one-use V148 Gold score [skip ci]'
          git push origin HEAD:v143-contextual-prune-lobo
          echo "RESULT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RESULT_SHA=$(cat /tmp/v148-result-sha.txt)" >> "$GITHUB_ENV"

      - name: Final checkpoint and seal all V148 score workflows
        env:
          RECOVERY_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('debug/v148-singleton-only/phase-c-score/score-result.json').read_text())
          c = report['comparison']
          cv = c['candidateDisplayVectorPercent']
          bv = c['acceptedBaselineDisplayVectorPercent']
          d = c['gatedMetricDeltas']
          crit = int(report['score']['criticalMismatchCount'])
          crit_delta = int(c['criticalMismatchDelta'])
          marker = '## V148 Phase C singleton-only Gold score — RECOVERED / COMPLETE / SEALED — 2026-08-27 UTC'
          cp = Path('docs/checkpoints/CURRENT_STATE.md')
          text = cp.read_text()
          if marker in text:
              raise SystemExit('final recovered score checkpoint already exists')
          fmt = lambda xs: ' / '.join(f'{float(x):.3f}' for x in xs)
          text += f'''\n\n{marker}\n- Infrastructure-only recovery completed the originally authorized **single** historical Gold calibration score in run `{os.environ['RECOVERY_RUN_ID']}` after proving the prior run made **0** score calls.\n- Root cause of the failed run was only the malformed 65-character V148 expected-Gold constant; recovery sourced the validated 64-character identity from the historically successful V147 runner/result in memory. Candidate/evaluator/baseline/metrics were unchanged.\n- Durable result: `debug/v148-singleton-only/phase-c-score/score-result.json`; SHA256 **`{os.environ['RESULT_SHA']}`**; persistence commit **`{os.environ['RESULT_COMMIT']}`**.\n- Candidate display vector (pitch content / pitch timing / string-fret timing / chord pitch-set / measure coverage / PDF fidelity): **{fmt(cv)}**.\n- Accepted baseline display vector: **{fmt(bv)}**.\n- Critical mismatch count: **{crit}**; delta versus accepted baseline: **{crit_delta:+d}**.\n- Raw F1 deltas versus accepted baseline: pitch content `{d['pitchContentF1']:+.9f}`, pitch timing `{d['pitchTimingTolerantF1']:+.9f}`, string/fret `{d['stringFretTimingTolerantF1']:+.9f}`, chord pitch-set `{d['chordPitchSetTolerantF1']:+.9f}`, exact voicing `{d['exactVoicingTolerantF1']:+.9f}`, measure coverage `{d['measureCoverageRecall']:+.9f}`.\n- Total V148 historical score calls across failed attempt plus recovery: **1**. Candidate search **NO**; alternate candidate **NO**; retuning **NO**; audio/HPSS/CQT **NO**; Modal/L4/GPU **NO**; main/Production integration **NO**; automatic promotion **NO**.\n- V148 reference-facing scoring authorization is consumed and sealed. Both the original scoring workflow and infrastructure recovery workflow are deleted in this final seal. Further reference-facing analysis, candidate construction/search, retuning, Production integration, or promotion requires a new separately frozen phase and fresh explicit user authorization.\n'''
          cp.write_text(text)
          PY
          git rm -f .github/workflows/v148-singleton-only-score-once.yml .github/workflows/v148-score-hash-recovery-once.yml
          git add docs/checkpoints/CURRENT_STATE.md
          git commit -m 'docs: checkpoint and seal recovered V148 Gold score [skip ci]'
          git push origin HEAD:v143-contextual-prune-lobo
