name: V144 Rhythm Measure-Safe Triple Conjunction Search — Archived

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    name: Refuse replay of consumed triple calibration search
    runs-on: ubuntu-latest
    steps:
      - name: Historical protocol guard
        shell: bash
        run: |
          echo 'This V144 triple-conjunction candidate family is historical and consumed.' >&2
          echo 'Use the persisted report at debug/v144-rhythm-calibration/candidates/triple-conjunction-search.json.' >&2
          echo 'The accepted calibration winner must be treated as fixed evidence, not reselected from later results.' >&2
          exit 1
