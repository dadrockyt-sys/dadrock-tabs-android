name: V144 Rhythm Measure-Safe Triple Conjunction Search

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v144-triple-conjunction-search.yml
      - validation/v144_rhythm_calibration/search_triple_conjunction_prunes.py
      - modal/v144_rhythm_triple_conjunction_policy.py
      - modal/v144_rhythm_measure_set_guard.py
      - modal/tests/test_v144_rhythm_triple_conjunction_policy.py
      - modal/tests/test_v144_rhythm_measure_set_guard.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v144-rhythm-measure-safe-triple-conjunction-search
  cancel-in-progress: false

jobs:
  search:
    name: Fit-lock measure-safe triple candidate on CPU
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify immutable inputs and corrected safety tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          test "$(git hash-object debug/v143-contextual-prune/v5-professional-pdf/final-professional-holdout-result.json)" = "511fd244f231b66d08306f97b5a47ed41f5415c7"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json | awk '{print $1}')" = "7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2"
          test "$(sha256sum debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json | awk '{print $1}')" = "18fd868ae960dfcdd1ffb0110f1a9dfd8acc2ffeb46e247d1116cd54291526ac"
          test "$(git hash-object debug/v144-rhythm-calibration/baseline/v5-frozen-calibration-baseline.json)" = "ad5fa9d0b6c552035405c1cca81ee4e3f25b5764"
          python modal/tests/test_v144_rhythm_staged_selector.py -v
          python modal/tests/test_v144_rhythm_measure_set_guard.py -v
          python modal/tests/test_v144_rhythm_triple_conjunction_policy.py -v

      - name: Run fit-only measure-safe triple search and staged gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .v144/triple-search
          python validation/v144_rhythm_calibration/search_triple_conjunction_prunes.py \
            debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json \
            debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json \
            debug/v144-rhythm-calibration/baseline/v5-frozen-calibration-baseline.json \
            modal/configs/v144_rhythm_context_split_config.json \
            debug/v144-rhythm-calibration/candidates/triple-conjunction-search.json \
            .v144/triple-search/locked-events.json \
            --minimum-false-positive-support 3 \
            --maximum-candidates 384 \
            > .v144/triple-search/search.log

      - name: Verify search isolation and measure safety before fidelity proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('debug/v144-rhythm-calibration/candidates/triple-conjunction-search.json').read_text(encoding='utf-8'))
          assert report['classification'] == 'v144-rhythm-fit-only-measure-safe-triple-conjunction-search'
          assert report['mayClaimUnseenGeneralization'] is False
          construction = report['candidateConstruction']
          assert construction['sourceLabels'] == 'fit-only-gross-unmatched-generated-notes'
          assert construction['runtimeRuleInputs'] == 'reference-free-context-signature-triple-only'
          assert construction['candidateRuleShape'] == 'three-signature-conjunction-prune'
          assert construction['minimumFalsePositiveSupport'] == 3
          assert construction['maximumCandidates'] == 384
          assert 0 < construction['candidateCount'] <= 384
          assert construction['fitUnmatchedGeneratedNoteCount'] == 622
          assert construction['validationLabelsUsedForCandidateConstructionOrRanking'] is False
          assert construction['canaryLabelsUsedForCandidateConstructionOrRanking'] is False
          assert construction['historicalValidationOrFullInvariantResultsUsedForConstructionOrRanking'] is False
          assert construction['measureSetGuardUsesProfessionalReference'] is False
          assert report['fitLock']['fitOnlyRanking'] is True
          assert report['fitLock']['baselineGeneratedMeasureSetPreservationRequired'] is True
          assert report['locked']['measureSet']['baselineGeneratedMeasureSetPreserved'] is True
          assert report['locked']['measureSet']['candidateGeneratedMeasureCount'] == 113
          assert report['locked']['measureSet']['missingBaselineGeneratedMeasures'] == []
          assert report['locked']['measureSet']['extraCandidateGeneratedMeasures'] == []
          assert report['locked']['measureSet']['professionalReferenceUsed'] is False
          assert report['alternateAfterGateFailureAllowed'] is False
          assert report['safety']['runtimeReferenceInputUsed'] is False
          assert report['safety']['modalGpuInvoked'] is False
          if report['stoppedAt'] == 'fit':
              assert report['locked']['name'] == 'no-prune'
              assert report['validation'] is None and report['canary'] is None
              assert report['fullCalibration'] is None
          elif report['stoppedAt'] == 'validation':
              assert report['validation']['passed'] is False
              assert report['canary'] is None and report['fullCalibration'] is None
          elif report['stoppedAt'] == 'canary':
              assert report['validation']['passed'] is True
              assert report['canary']['passed'] is False
              assert report['fullCalibration'] is None
          elif report['stoppedAt'] == 'full-calibration':
              assert report['validation']['passed'] is True
              assert report['canary']['passed'] is True
              assert report['fullCalibration'] is not None
          else:
              raise AssertionError(report['stoppedAt'])
          PY

      - name: Reprove locked candidate PDF-event identity independently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .v144/triple-search/freeze
          python - <<'PY'
          import json
          from pathlib import Path
          locked = json.loads(Path('.v144/triple-search/locked-events.json').read_text(encoding='utf-8'))
          assert locked['baselineGeneratedMeasureSetPreserved'] is True
          payload = {
              'instrument': 'rhythm',
              'renderEvents': locked['renderEvents'],
              'tempoBpm': 129.19921875,
              'timeSignature': '4/4',
              'tuning': 'E Standard',
              'structuredMode': True,
              'sourceAudioSha256': '215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f',
              'referenceFree': True,
              'professionalReferenceUsed': False,
              'referenceRuntimeInputUsed': False,
              'runtimeLabelsRequired': False,
              'v143RuntimeSafetyVerified': True,
          }
          Path('.v144/triple-search/freeze-input.json').write_text(json.dumps(payload, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          python validation/rhythm_holdout/freeze_rhythm_analysis.py \
            .v144/triple-search/freeze-input.json .v144/triple-search/freeze \
            --source-commit "${GITHUB_SHA}" > .v144/triple-search/freeze.log
          cp lib/v143RenderContract.js .v144/triple-search/v143RenderContract.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { validateV143RenderEvents } from './.v144/triple-search/v143RenderContract.mjs';
          const locked = JSON.parse(await fs.readFile('.v144/triple-search/locked-events.json', 'utf8'));
          const events = validateV143RenderEvents(locked.renderEvents || []);
          await fs.writeFile('.v144/triple-search/renderer-event-evidence.json', JSON.stringify({
            schemaVersion: 1,
            renderEvents: events,
            runtimeSafetyVerified: true,
            runtimeLabelsRequired: false,
            referenceOpened: false,
            professionalReferenceUsed: false,
            productionModified: false,
          }) + '\n');
          NODE
          python validation/rhythm_holdout/verify_pdf_event_fidelity.py \
            .v144/triple-search/freeze .v144/triple-search/renderer-event-evidence.json \
            > .v144/triple-search/pdf-event-fidelity.log

      - name: Attach fidelity proof and evaluate final full-gold invariant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('debug/v144-rhythm-calibration/candidates/triple-conjunction-search.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          fidelity = json.loads(Path('.v144/triple-search/freeze/rhythm-pdf-event-fidelity.json').read_text(encoding='utf-8'))
          assert fidelity['passed'] is True
          assert fidelity['pdfEventFidelity'] == 1.0
          assert fidelity['frozenEventSha256'] == fidelity['pdfEventSha256']
          assert fidelity['frozenEventSha256'] == report['locked']['eventSha256']
          assert fidelity['frozenEventCount'] == report['locked']['eventCount']

          report['lockedCandidatePdfFidelityProof'] = {
              'passed': True,
              'pdfEventFidelity': 1.0,
              'eventCount': fidelity['frozenEventCount'],
              'eventSha256': fidelity['frozenEventSha256'],
              'referenceOpenedDuringPdfFidelityCheck': False,
          }

          full = report['fullCalibration']
          if full is not None:
              full['pdfEventFidelity'] = 1.0
              full['score']['gatedMetrics']['pdfEventFidelity'] = 1.0
              deltas = full['baselineComparison']['gatedMetricDeltas']
              regressions = {name: float(delta) for name, delta in deltas.items() if float(delta) < 0.0}
              measure_coverage = float(full['score']['gatedMetrics']['measureCoverageRecall'])
              critical_delta = int(full['baselineComparison']['criticalMismatchDelta'])
              invariant = (
                  report['locked']['measureSet']['baselineGeneratedMeasureSetPreserved'] is True
                  and measure_coverage == 1.0
                  and not regressions
                  and critical_delta <= 0
                  and fidelity['pdfEventFidelity'] == 1.0
              )
              full['invariantPassed'] = invariant
              full['invariantEvidence'] = {
                  'baselineGeneratedMeasureSetPreserved': report['locked']['measureSet']['baselineGeneratedMeasureSetPreserved'],
                  'measureCoverageRecall': measure_coverage,
                  'metricRegressions': regressions,
                  'criticalMismatchDelta': critical_delta,
                  'pdfEventFidelity': 1.0,
              }
              report['calibrationPromotionAllowed'] = invariant
              if invariant:
                  report['selectedReason'] = 'locked-candidate-passed-split-and-full-calibration-invariants'
                  report['stoppedAt'] = 'complete'
              else:
                  report['selected'] = 'no-prune'
                  report['selectedReason'] = 'locked-candidate-failed-full-calibration-invariant'
                  report['stoppedAt'] = 'full-calibration'
          else:
              report['calibrationPromotionAllowed'] = False

          report['safety']['lockedCandidatePdfFidelityReproved'] = True
          assert report['safety']['v5Modified'] is False
          assert report['safety']['productionModified'] is False
          assert report['safety']['mainModified'] is False
          assert report['safety']['runtimeReferenceInputUsed'] is False
          assert report['safety']['modalGpuInvoked'] is False
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Reverify immutable V5 after search
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          test "$(git hash-object debug/v143-contextual-prune/v5-professional-pdf/final-professional-holdout-result.json)" = "511fd244f231b66d08306f97b5a47ed41f5415c7"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json | awk '{print $1}')" = "7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-rhythm-shadow.pdf | awk '{print $1}')" = "f4c1238e868cadfb90b8a359b1555b0b90e7740b9ebaa276aa394c8991f37ce5"

      - name: Persist only V144 triple-search report
        shell: bash
        run: |
          set -euo pipefail
          report='debug/v144-rhythm-calibration/candidates/triple-conjunction-search.json'
          git add "$report"
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only)" = "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Persist V144 measure-safe triple calibration result'
          for attempt in 1 2 3 4 5; do
            git fetch origin v143-contextual-prune-lobo
            if git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
