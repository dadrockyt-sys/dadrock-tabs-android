name: V156 generate reference-blind CPU candidate once

on:
  push:
    branches: [v143-contextual-prune-lobo]
    paths:
      - .github/workflows/v156-generate-reference-blind-once.yml

permissions:
  contents: write
  actions: read

env:
  BRANCH: v143-contextual-prune-lobo
  CUDA_VISIBLE_DEVICES: ""
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  SOURCE_DIR: /tmp/v156-historical-source
  NORM_WAV: /tmp/v156-normalized.wav
  DEMUCS_DIR: /tmp/v156-demucs
  PREREG: debug/v156-cpu-autonomous/preregistration.json
  PRE_RUN: debug/v156-cpu-autonomous/pre-run-receipt.json
  TRANSCRIBER: validation/v156_cpu_multitrack/transcribe_hybrid.py
  QC_SCRIPT: validation/v156_cpu_multitrack/structural_qc.py
  ENGINE: validation/v155_cpu_multitrack/transcribe_hybrid.py
  ENV_RECEIPT: debug/v156-cpu-autonomous/environment-receipt.json
  OUTPUT: debug/v156-cpu-autonomous/generated.json
  RECEIPT: debug/v156-cpu-autonomous/generation-receipt.json
  QC_OUTPUT: debug/v156-cpu-autonomous/structural-qc.json

jobs:
  generate-once:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify sealed identities isolation and single-trigger count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object "$PREREG")" = "25a0a921e3245049a7f64fd3cb823e6767fe55da"
          test "$(git hash-object "$TRANSCRIBER")" = "961e18f66766e51abb42f46e529730fcaa2807b4"
          test "$(git hash-object "$QC_SCRIPT")" = "3b1018e751deecdfb0efca100c29848256ee1234"
          test "$(git hash-object "$ENGINE")" = "3357582dd8311b28f4b85f2ebfbc7acb8c9e4fb8"
          test "$(git hash-object "$PRE_RUN")" = "4591695763a1e59d6b1b2bfa2600969ff4b0201f"
          test ! -e "$OUTPUT"
          test ! -e "$RECEIPT"
          test ! -e "$QC_OUTPUT"
          python -m py_compile "$TRANSCRIBER" "$QC_SCRIPT" "$ENGINE"
          if grep -En 'research/v154-professional-references|frontend-reference-payload|score_frontend_reference|debug/v154-cpu-autonomous/broad-other-run|debug/v155-cpu-autonomous/generated|debug/v155-cpu-autonomous/generation-receipt' "$TRANSCRIBER" "$QC_SCRIPT" "$ENGINE"; then
            echo 'Forbidden reference/scored-candidate dependency found in V156 generation path' >&2
            exit 1
          fi
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/v156-generate-reference-blind-once.yml/runs?branch=$BRANCH&per_page=100" \
            > /tmp/v156-workflow-runs.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path('/tmp/v156-workflow-runs.json').read_text())
          runs = p.get('workflow_runs') or []
          current = int(os.environ['GITHUB_RUN_ID'])
          assert len(runs) == 1, f'V156 duplicate generation runs detected: {len(runs)}'
          assert int(runs[0]['id']) == current, (runs[0].get('id'), current)
          prereg = json.loads(Path('debug/v156-cpu-autonomous/preregistration.json').read_text())
          assert prereg['status'] == 'PREREGISTERED_BEFORE_GENERATION_AMENDED_EXECUTION_DETERMINISM'
          assert prereg['triggerSafety']['generationWorkflowCreationIsTheSingleTrigger'] is True
          assert prereg['triggerSafety']['secondArmEditForbidden'] is True
          assert prereg['execution']['device'] == 'CPU_ONLY'
          pre = json.loads(Path('debug/v156-cpu-autonomous/pre-run-receipt.json').read_text())
          assert pre['validation'] == 'PASS'
          assert pre['candidateExistsAtSeal'] is False
          assert pre['referenceFacingScoreCallsAtSeal'] == 0
          print(json.dumps({'validation':'PASS','workflowRunCount':1,'currentRunId':current}, indent=2))
          PY

      - name: Materialize exact historical audio
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR"
          git show 74b0f815ff3f66f325220975c410621503de440f:public/gomywayfullaitest.m4a > "$SOURCE_DIR/gomywayfullaitest.m4a"
          test "$(sha256sum "$SOURCE_DIR/gomywayfullaitest.m4a" | awk '{print $1}')" = "215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f"
          test "$(wc -c < "$SOURCE_DIR/gomywayfullaitest.m4a" | tr -d ' ')" = "3478611"

      - name: Install exact pinned CPU stack
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 scipy==1.13.1 soundfile==0.12.1 \
            basic-pitch==0.4.0 demucs==4.1.0 librosa==0.11.0 imageio-ffmpeg==0.6.0
          python - <<'PY'
          import importlib.metadata, numpy, scipy, soundfile, torch
          assert numpy.__version__ == '1.26.4'
          assert scipy.__version__ == '1.13.1'
          assert soundfile.__version__ == '0.12.1'
          assert importlib.metadata.version('basic-pitch') == '0.4.0'
          assert importlib.metadata.version('demucs') == '4.1.0'
          assert importlib.metadata.version('librosa') == '0.11.0'
          assert importlib.metadata.version('imageio-ffmpeg') == '0.6.0'
          assert torch.__version__ == '2.8.0+cpu'
          assert torch.version.cuda is None
          assert torch.cuda.is_available() is False
          PY

      - name: Deterministically normalize audio
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          import imageio_ffmpeg
          src = Path('/tmp/v156-historical-source/gomywayfullaitest.m4a')
          out = Path('/tmp/v156-normalized.wav')
          exe = imageio_ffmpeg.get_ffmpeg_exe()
          subprocess.check_call([exe, '-v', 'error', '-i', str(src), '-vn', '-ar', '44100', '-ac', '2', '-c:a', 'pcm_s16le', str(out)])
          assert out.is_file() and out.stat().st_size > 1000000
          print('normalized_sha256=' + hashlib.sha256(out.read_bytes()).hexdigest())
          PY

      - name: One seeded in-process CPU Demucs separation
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, random
          from pathlib import Path
          import numpy as np
          import torch
          from demucs.separate import main as demucs_main

          seed = 0
          random.seed(seed)
          np.random.seed(seed)
          torch.manual_seed(seed)
          torch.set_num_threads(1)
          torch.set_num_interop_threads(1)
          torch.use_deterministic_algorithms(True, warn_only=False)
          assert torch.version.cuda is None
          assert torch.cuda.is_available() is False
          assert torch.get_num_threads() == 1
          demucs_main([
              '-n', 'htdemucs_6s',
              '-d', 'cpu',
              '--shifts', '1',
              '-j', '1',
              '-o', '/tmp/v156-demucs',
              '/tmp/v156-normalized.wav',
          ])
          stem_dir = Path('/tmp/v156-demucs/htdemucs_6s/v156-normalized')
          for name in ('guitar.wav','bass.wav','drums.wav'):
              p = stem_dir / name
              assert p.is_file() and p.stat().st_size > 1000000, p
          PY

      - name: Freeze environment and model identity receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, importlib.metadata, json
          from pathlib import Path
          import numpy, scipy, soundfile, torch

          def sha(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda: f.read(1024*1024), b''):
                      h.update(block)
              return h.hexdigest()

          checkpoint_files = []
          roots = [Path.home()/'.cache'/'torch', Path.home()/'.cache'/'huggingface']
          seen = set()
          for root in roots:
              if not root.exists():
                  continue
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  if p in seen or p.stat().st_size < 1_000_000:
                      continue
                  if p.suffix.lower() not in {'.th','.pt','.pth','.ckpt','.bin','.safetensors'}:
                      continue
                  seen.add(p)
                  checkpoint_files.append({'path': str(p), 'sha256': sha(p), 'bytes': p.stat().st_size})
          assert checkpoint_files, 'no Demucs model checkpoint files found'
          stem_dir = Path('/tmp/v156-demucs/htdemucs_6s/v156-normalized')
          receipt = {
              'schema': 'dadrock.tabs.v156.environment-receipt.v1',
              'validation': 'PASS',
              'device': 'cpu',
              'cudaAvailable': False,
              'torchCudaVersion': None,
              'rngSeed': 0,
              'pythonHashSeed': '0',
              'torchDeterministicAlgorithms': True,
              'torchDeterministicWarnOnly': False,
              'torchNumThreads': 1,
              'torchNumInteropThreads': 1,
              'ompNumThreads': 1,
              'mklNumThreads': 1,
              'openblasNumThreads': 1,
              'numexprNumThreads': 1,
              'demucsModel': 'htdemucs_6s',
              'demucsShifts': 1,
              'demucsJobs': 1,
              'separationRepeatCount': 1,
              'demucsModelCheckpointFiles': checkpoint_files,
              'v156EngineGitBlob': '3357582dd8311b28f4b85f2ebfbc7acb8c9e4fb8',
              'versions': {
                  'python': '3.10',
                  'torch': torch.__version__,
                  'numpy': numpy.__version__,
                  'scipy': scipy.__version__,
                  'soundfile': soundfile.__version__,
                  'demucs': importlib.metadata.version('demucs'),
                  'basic-pitch': importlib.metadata.version('basic-pitch'),
                  'librosa': importlib.metadata.version('librosa'),
                  'imageio-ffmpeg': importlib.metadata.version('imageio-ffmpeg'),
              },
              'normalizedMixSha256': sha(Path('/tmp/v156-normalized.wav')),
              'stemSha256': {
                  'guitar': sha(stem_dir/'guitar.wav'),
                  'bass': sha(stem_dir/'bass.wav'),
                  'drums': sha(stem_dir/'drums.wav'),
              },
              'safety': {
                  'referenceRead': False,
                  'professionalReferencePathsOpened': 0,
                  'referenceFacingScoreCalls': 0,
                  'gpuUsed': False,
                  'modalUsed': False,
                  'mainOrProductionModified': False,
              },
          }
          out = Path('debug/v156-cpu-autonomous/environment-receipt.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps({'validation':'PASS','checkpointFiles':len(checkpoint_files),'stemSha256':receipt['stemSha256']}, indent=2))
          PY

      - name: Generate exactly one V156 candidate
        run: |
          set -euo pipefail
          STEM_DIR="$DEMUCS_DIR/htdemucs_6s/v156-normalized"
          python "$TRANSCRIBER" \
            --mix "$NORM_WAV" \
            --guitar "$STEM_DIR/guitar.wav" \
            --bass "$STEM_DIR/bass.wav" \
            --drums "$STEM_DIR/drums.wav" \
            --preregistration "$PREREG" \
            --environment-receipt "$ENV_RECEIPT" \
            --output "$OUTPUT" \
            --receipt "$RECEIPT"

      - name: Independent reference-blind structural QC
        run: |
          set -euo pipefail
          python "$QC_SCRIPT" \
            --candidate "$OUTPUT" \
            --receipt "$RECEIPT" \
            --preregistration "$PREREG" \
            --pre-run-receipt "$PRE_RUN" \
            --output "$QC_OUTPUT"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          candidate = Path('debug/v156-cpu-autonomous/generated.json')
          receipt = json.loads(Path('debug/v156-cpu-autonomous/generation-receipt.json').read_text())
          qc = json.loads(Path('debug/v156-cpu-autonomous/structural-qc.json').read_text())
          assert qc['validation'] == 'PASS'
          assert receipt['candidateSha256'] == hashlib.sha256(candidate.read_bytes()).hexdigest()
          assert qc['candidateSha256'] == receipt['candidateSha256']
          assert qc['safety']['referenceFacingScoreCalls'] == 0
          print(json.dumps({'validation':'PASS','candidateSha256':receipt['candidateSha256'],'counts':receipt['counts'],'scoreCalls':0}, indent=2))
          PY

      - name: Freeze candidate receipt QC and self-seal
        run: |
          set -euo pipefail
          rm .github/workflows/v156-generate-reference-blind-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ENV_RECEIPT" "$OUTPUT" "$RECEIPT" "$QC_OUTPUT" .github/workflows/v156-generate-reference-blind-once.yml
          git commit -m "research: freeze single V156 reference-blind CPU candidate [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH" && git push origin HEAD:"$BRANCH"; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo 'Unable to freeze exact generated V156 candidate after retries' >&2
          exit 1
