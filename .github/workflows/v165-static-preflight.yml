name: V165 CPU Static Preflight

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v165-static-preflight.yml
      - validation/v165_cpu_autonomous/**
      - debug/v165-cpu-autonomous/preregistration.json
      - debug/v165-cpu-autonomous/implementation-contract.json
      - debug/v165-cpu-autonomous/negative-runtime-guard.py

permissions:
  contents: read

concurrency:
  group: v165-static-preflight
  cancel-in-progress: false

jobs:
  static-preflight:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact V165 static head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install static dependency only
        run: python -m pip install --disable-pip-version-check numpy==2.0.2

      - name: Syntax compile V165 implementation and guards
        run: |
          python -m py_compile \
            validation/v165_cpu_autonomous/event_logic_v165.py \
            validation/v165_cpu_autonomous/test_event_logic_v165.py \
            validation/v165_cpu_autonomous/build_timebase_v165.py \
            validation/v165_cpu_autonomous/timebase_qc_v165.py \
            validation/v165_cpu_autonomous/transcribe_v165.py \
            validation/v165_cpu_autonomous/structural_qc_v165.py \
            validation/v165_cpu_autonomous/test_transcriber_adapter_v165.py \
            validation/v165_cpu_autonomous/test_json_native_v165.py \
            debug/v165-cpu-autonomous/negative-runtime-guard.py

      - name: Run preserved song-blind V164 behavior fixtures through V165
        run: python validation/v165_cpu_autonomous/test_event_logic_v165.py

      - name: Run mandatory song-blind transcriber adapter construction fixture
        run: python validation/v165_cpu_autonomous/test_transcriber_adapter_v165.py

      - name: Run JSON-native local-provenance fixture
        run: python validation/v165_cpu_autonomous/test_json_native_v165.py

      - name: Run V165 negative runtime guard including workflow
        run: >-
          python debug/v165-cpu-autonomous/negative-runtime-guard.py
          --preregistration debug/v165-cpu-autonomous/preregistration.json
          --implementation-contract debug/v165-cpu-autonomous/implementation-contract.json
          --event-logic validation/v165_cpu_autonomous/event_logic_v165.py
          --event-test validation/v165_cpu_autonomous/test_event_logic_v165.py
          --timebase-builder validation/v165_cpu_autonomous/build_timebase_v165.py
          --timebase-qc validation/v165_cpu_autonomous/timebase_qc_v165.py
          --transcriber validation/v165_cpu_autonomous/transcribe_v165.py
          --structural-qc validation/v165_cpu_autonomous/structural_qc_v165.py
          --adapter-test validation/v165_cpu_autonomous/test_transcriber_adapter_v165.py
          --json-native-test validation/v165_cpu_autonomous/test_json_native_v165.py
          --workflow .github/workflows/v165-static-preflight.yml
