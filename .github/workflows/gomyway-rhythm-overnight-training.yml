name: Gomyway Rhythm Overnight Training

on:
  workflow_dispatch:
    inputs:
      max_attempts:
        description: Maximum active-regeneration attempts
        required: true
        default: "84"
      max_hours:
        description: Maximum runner hours
        required: true
        default: "5.7"

permissions:
  contents: write

concurrency:
  group: gomyway-rhythm-overnight-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out training branch
        uses: actions/checkout@v4
        with:
          ref: jimmy-paige-v8-section-detection
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify active-regeneration inputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          reference_path = Path("public/gomyway-professional-rhythm-reference-17-113.json")
          source_path = Path("public/gomyway-jimmy-paige-full-song-winner-events.json")
          for path in (reference_path, source_path):
              if not path.exists():
                  raise SystemExit(f"MISSING COMMITTED INPUT: {path}")
          reference = json.loads(reference_path.read_text())
          source = json.loads(source_path.read_text())
          assert reference.get("readyForTraining") is True
          assert int(reference.get("humanApprovedMeasureCount", 0)) == 97
          assert len(source.get("events", [])) == 1629
          print("ACTIVE REGENERATION PREFLIGHT PASSED")
          print("Approved reference measures:", reference["humanApprovedMeasureCount"])
          print("Raw winner events:", len(source["events"]))
          PY

      - name: Run active-regeneration scored training
        env:
          GOMYWAY_PUSH_CHECKPOINTS: "1"
        run: |
          python analyzer/run_gomyway_rhythm_overnight_training.py \
            --max-attempts "${{ inputs.max_attempts }}" \
            --max-hours "${{ inputs.max_hours }}"

      - name: Upload checkpoints and morning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gomyway-rhythm-training-v2-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            public/training/gomyway-rhythm-17-113-v2/
            public/gomyway-professional-rhythm-reference-17-113.json
            public/gomyway-jimmy-paige-full-song-winner-events.json

      - name: Final checkpoint commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/training/gomyway-rhythm-17-113-v2 || true
          if ! git diff --cached --quiet; then
            git commit -m "Save final Gomyway active-regeneration training state"
            git pull --rebase origin jimmy-paige-v8-section-detection
            git push origin HEAD:jimmy-paige-v8-section-detection
          fi
