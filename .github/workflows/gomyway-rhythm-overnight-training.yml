name: Gomyway Rhythm Cost-Controlled Training

on:
  workflow_dispatch:
    inputs:
      max_attempts:
        description: Adaptive attempts for this single manual run
        required: true
        default: "24"
      max_hours:
        description: Maximum runner hours for this single manual run
        required: true
        default: "0.5"

permissions:
  contents: read

concurrency:
  group: gomyway-rhythm-cost-controlled-training
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out training branch
        uses: actions/checkout@v4
        with:
          ref: jimmy-paige-v8-section-detection
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify adaptive inputs
        run: |
          set -euo pipefail
          python analyzer/prepare_gomyway_generation3_state.py
          python - <<'PY'
          import json
          from pathlib import Path
          reference = json.loads(Path("public/gomyway-professional-rhythm-reference-17-113.json").read_text())
          source = json.loads(Path("public/gomyway-jimmy-paige-full-song-winner-events.json").read_text())
          assert reference.get("readyForTraining") is True
          assert int(reference.get("humanApprovedMeasureCount", 0)) == 97
          assert len(source.get("events", [])) == 1629
          print("COST-CONTROLLED PREFLIGHT PASSED")
          PY

      - name: Run one cost-controlled adaptive batch
        env:
          GOMYWAY_PUSH_CHECKPOINTS: "0"
        run: |
          python analyzer/run_gomyway_rhythm_overnight_training.py \
            --max-attempts "${{ inputs.max_attempts }}" \
            --max-hours "${{ inputs.max_hours }}" \
            --stall-generations 3 \
            --minimum-generation-improvement 0.05

      - name: Upload results without committing or deploying
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gomyway-rhythm-cost-controlled-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            public/training/gomyway-rhythm-17-113-v3/
            public/gomyway-professional-rhythm-reference-17-113.json

      - name: Cost-control summary
        if: always()
        run: |
          echo "No checkpoint commits were pushed."
          echo "No automatic continuation was dispatched."
          echo "No Vercel deployment should be triggered by this training run."
