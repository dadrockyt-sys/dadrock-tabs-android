name: Gomyway Rhythm Overnight Training

on:
  workflow_dispatch:
    inputs:
      max_attempts:
        description: Maximum scored attempts
        required: true
        default: "42"
      max_hours:
        description: Maximum runner hours (keep below GitHub-hosted limit)
        required: true
        default: "5.7"

permissions:
  contents: write

concurrency:
  group: gomyway-rhythm-overnight-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out training branch
        uses: actions/checkout@v4
        with:
          ref: jimmy-paige-v8-section-detection
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify committed scored-training inputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          reference_path = Path("public/gomyway-professional-rhythm-reference-17-113.json")
          candidate_path = Path("public/gomyway-full-song-v8-rhythm-candidates.json")

          for path in (reference_path, candidate_path):
              if not path.exists():
                  raise SystemExit(f"MISSING COMMITTED INPUT: {path}")

          reference = json.loads(reference_path.read_text())
          candidates = json.loads(candidate_path.read_text())

          assert reference.get("readyForTraining") is True
          assert int(reference.get("humanApprovedMeasureCount", 0)) == 97
          assert candidates.get("readyForScoredTraining") is True
          assert int(candidates.get("eventCount", 0)) > 0
          assert int(candidates.get("measureCoverageCount", 0)) == 97
          assert candidates.get("measuresCovered", [None])[0] == 17
          assert candidates.get("measuresCovered", [None])[-1] == 113

          print("PREFLIGHT PASSED")
          print("Approved reference measures:", reference["humanApprovedMeasureCount"])
          print("Candidate events:", candidates["eventCount"])
          print("Measures covered:", candidates["measureCoverageCount"])
          print("First/last:", candidates["measuresCovered"][0], candidates["measuresCovered"][-1])
          PY

      - name: Run resumable scored training
        env:
          GOMYWAY_PUSH_CHECKPOINTS: "1"
        run: |
          python analyzer/run_gomyway_rhythm_overnight_training.py \
            --max-attempts "${{ inputs.max_attempts }}" \
            --max-hours "${{ inputs.max_hours }}"

      - name: Upload checkpoints and morning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gomyway-rhythm-training-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            public/training/gomyway-rhythm-17-113/
            public/gomyway-professional-rhythm-reference-17-113.json
            public/gomyway-full-song-v8-rhythm-candidates.json
            public/gomyway-full-song-v8-rhythm-candidates-audit.json

      - name: Final checkpoint commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/training/gomyway-rhythm-17-113 || true
          if ! git diff --cached --quiet; then
            git commit -m "Save final Gomyway overnight training state"
            git pull --rebase origin jimmy-paige-v8-section-detection
            git push origin HEAD:jimmy-paige-v8-section-detection
          fi
