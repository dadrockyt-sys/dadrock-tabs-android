name: V165 one-shot read-only professional-reference score

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v165-score.yml

permissions:
  contents: write

concurrency:
  group: v165-score-once
  cancel-in-progress: false

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: be52879d352d1da024b12edcc8c305c87d4252a9
  SCORE_PREREG: debug/v165-cpu-autonomous/score-preregistration.json
  SCORE_IDENTITY: debug/v165-cpu-autonomous/score-identity-receipt.json
  CANDIDATE: debug/v165-cpu-autonomous/generated.json
  GENERATION_TERMINAL: debug/v165-cpu-autonomous/terminal-freeze.json
  STRUCTURAL_QC: debug/v165-cpu-autonomous/structural-qc.json
  SCORER: validation/v154_cpu_multitrack/score_frontend_reference.py
  REFERENCE: research/v154-professional-references/scorer-ready/frontend-reference-payload.json
  SCORE_REPORT: debug/v165-cpu-autonomous/reference-score.json
  SCORE_TERMINAL: debug/v165-cpu-autonomous/score-terminal-freeze.json
  CUDA_VISIBLE_DEVICES: ""
  PYTHONHASHSEED: "0"

jobs:
  score-once:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact one-shot V165 score arm
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify immutable score identities and absence boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v165-score.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"

          test "$(git hash-object "$SCORE_PREREG")" = "c5e44f8e60da4e7d68e71f384b702149b327a840"
          test "$(git hash-object "$SCORE_IDENTITY")" = "0750b12cc248e177436abc973624caee461c9d29"
          test "$(git hash-object "$CANDIDATE")" = "e70a444cb7778a6f56988cf8cc69dccb9c1d89ce"
          test "$(git hash-object "$GENERATION_TERMINAL")" = "857153fdaedd3c386d5802277cf60e68ae231dc6"
          test "$(git hash-object "$STRUCTURAL_QC")" = "f411e6c98b8ae33ba6f545d1b4dea12c80019a94"
          test "$(git hash-object "$SCORER")" = "9644e65719fbd361a9b39778ae9950c5e983e855"
          test "$(git hash-object "$REFERENCE")" = "2fbed60b543c0488934d8642c488aa06bf31bbf5"
          test "$(sha256sum "$CANDIDATE" | awk '{print $1}')" = "b1ad02001724750ea82d693591a7c0b1f214820de37a590871a6d78eef63e5cb"
          test "$(sha256sum "$REFERENCE" | awk '{print $1}')" = "b39a203aec3f45800891fe4eca156e37e7571b91ea5c4ccc41b30bbc95fc89e7"

          test ! -e "$SCORE_REPORT"
          test ! -e "$SCORE_TERMINAL"
          test ! -e .github/workflows/v165-generate.yml

          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("debug/v165-cpu-autonomous/score-preregistration.json").read_text())
          i = json.loads(Path("debug/v165-cpu-autonomous/score-identity-receipt.json").read_text())
          t = json.loads(Path("debug/v165-cpu-autonomous/terminal-freeze.json").read_text())
          q = json.loads(Path("debug/v165-cpu-autonomous/structural-qc.json").read_text())
          assert p["validation"] == "PASS" and p["version"] == "V165"
          assert p["status"] == "SEALED_BEFORE_SCORER_OR_PROFESSIONAL_REFERENCE_READ"
          assert p["authoritativeCandidate"]["gitBlob"] == "e70a444cb7778a6f56988cf8cc69dccb9c1d89ce"
          assert p["authoritativeCandidate"]["sha256"] == "b1ad02001724750ea82d693591a7c0b1f214820de37a590871a6d78eef63e5cb"
          assert p["fixedQualityGates"]["guitarF1Minimum"] == 0.8
          assert p["fixedQualityGates"]["bassF1Minimum"] == 0.8
          assert p["soleScoreBoundary"]["maximumScoreRuns"] == 1
          assert p["soleScoreBoundary"]["maximumScoreAttempts"] == 1
          assert p["soleScoreBoundary"]["rerunForbidden"] is True
          assert p["soleScoreBoundary"]["candidateWriteForbidden"] is True
          assert p["soleScoreBoundary"]["scoreInformedFollowupRepairForbidden"] is True
          assert i["validation"] == "PASS" and i["version"] == "V165"
          assert i["status"] == "SEALED_BEFORE_SOLE_SCORE_EXECUTION"
          assert i["frozenScorerIdentity"]["gitBlob"] == "9644e65719fbd361a9b39778ae9950c5e983e855"
          assert i["frozenProfessionalReferenceIdentity"]["gitBlob"] == "2fbed60b543c0488934d8642c488aa06bf31bbf5"
          assert i["runtimeAbsenceAtSeal"]["scoreWorkflowAbsent"] is True
          assert i["runtimeAbsenceAtSeal"]["scoreReceiptAbsent"] is True
          assert i["runtimeAbsenceAtSeal"]["scoreTerminalAbsent"] is True
          assert i["identityReadAccounting"]["scoreExecutionPerformed"] is False
          assert t["candidateAuthoritative"] is True and t["neverRearmV165"] is True
          assert t["outcome"] == "STRUCTURAL_QC_PASS"
          assert q["validation"] == "PASS" and q["errors"] == []
          PY

      - name: Execute frozen scorer exactly once and retain aggregate output only
        shell: bash
        run: |
          set -euo pipefail
          RAW=/tmp/v165-raw-score.json
          test ! -e "$RAW"
          python "$SCORER" "$CANDIDATE" "$REFERENCE" --output "$RAW" > /tmp/v165-scorer-stdout.txt
          test -s "$RAW"

          python - <<'PY'
          import json
          from pathlib import Path
          raw = json.loads(Path("/tmp/v165-raw-score.json").read_text())
          guitar = raw["combinedGuitar"]["primaryTimingAwarePitch"]
          bass = raw["bass"]["primaryTimingAwarePitch"]
          gf1 = float(guitar["f1"])
          bf1 = float(bass["f1"])
          gate_g = gf1 >= 0.80
          gate_b = bf1 >= 0.80
          report = {
              "schema": "dadrock.tabs.v165.aggregate-professional-reference-score.v1",
              "version": "V165",
              "song": {"artist": "Lenny Kravitz", "title": "Are You Gonna Go My Way"},
              "candidate": {
                  "gitBlob": "e70a444cb7778a6f56988cf8cc69dccb9c1d89ce",
                  "sha256": "b1ad02001724750ea82d693591a7c0b1f214820de37a590871a6d78eef63e5cb"
              },
              "scorerGitBlob": "9644e65719fbd361a9b39778ae9950c5e983e855",
              "professionalReferenceGitBlob": "2fbed60b543c0488934d8642c488aa06bf31bbf5",
              "primaryTimingAwarePitch": {
                  "combinedGuitar": {
                      "matched": int(guitar["matched"]),
                      "generated": int(guitar["generated"]),
                      "reference": int(guitar["reference"]),
                      "precision": float(guitar["precision"]),
                      "recall": float(guitar["recall"]),
                      "f1": gf1
                  },
                  "bass": {
                      "matched": int(bass["matched"]),
                      "generated": int(bass["generated"]),
                      "reference": int(bass["reference"]),
                      "precision": float(bass["precision"]),
                      "recall": float(bass["recall"]),
                      "f1": bf1
                  }
              },
              "gates": {
                  "combinedGuitarF1Minimum": 0.80,
                  "bassF1Minimum": 0.80,
                  "combinedGuitarPass": gate_g,
                  "bassPass": gate_b,
                  "bothPass": gate_g and gate_b
              },
              "outcome": "SCORE_GATE_PASS" if gate_g and gate_b else "SCORE_GATE_FAIL",
              "policy": {
                  "singleFrozenScorerExecution": True,
                  "aggregateOutputOnly": True,
                  "candidateMutation": False,
                  "candidateRepair": False,
                  "thresholdSweep": False,
                  "variantSelection": False,
                  "humanCorrection": False,
                  "postScoreRetuneOrRescoreForbidden": True
              }
          }
          Path("debug/v165-cpu-autonomous/reference-score.json").write_text(
              json.dumps(report, indent=2, sort_keys=True, allow_nan=False) + "\n"
          )
          print(json.dumps({"outcome": report["outcome"], "guitarF1": gf1, "bassF1": bf1}, sort_keys=True))
          PY

      - name: Freeze terminal V165 score and self-seal
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"
          test "$(git hash-object "$CANDIDATE")" = "e70a444cb7778a6f56988cf8cc69dccb9c1d89ce"
          test "$(sha256sum "$CANDIDATE" | awk '{print $1}')" = "b1ad02001724750ea82d693591a7c0b1f214820de37a590871a6d78eef63e5cb"
          test -s "$SCORE_REPORT"
          test ! -e "$SCORE_TERMINAL"

          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          report_path = Path("debug/v165-cpu-autonomous/reference-score.json")
          report = json.loads(report_path.read_text())
          def sha256(path):
              h = hashlib.sha256()
              with Path(path).open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          def blob(path):
              return subprocess.check_output(["git", "hash-object", str(path)], text=True).strip()
          terminal = {
              "schema": "dadrock.tabs.v165.score-terminal-freeze.v1",
              "version": "V165",
              "status": "TERMINAL",
              "outcome": report["outcome"],
              "workflowRunId": int(os.environ["GITHUB_RUN_ID"]),
              "workflowRunNumber": int(os.environ["GITHUB_RUN_NUMBER"]),
              "workflowRunAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflowHeadSha": os.environ["GITHUB_SHA"],
              "scoreWorkflowGitBlob": blob(".github/workflows/v165-score.yml"),
              "scorePreregistrationGitBlob": "c5e44f8e60da4e7d68e71f384b702149b327a840",
              "scoreIdentityReceiptGitBlob": "0750b12cc248e177436abc973624caee461c9d29",
              "candidateGitBlob": "e70a444cb7778a6f56988cf8cc69dccb9c1d89ce",
              "candidateSha256": "b1ad02001724750ea82d693591a7c0b1f214820de37a590871a6d78eef63e5cb",
              "scoreReportGitBlob": blob(report_path),
              "scoreReportSha256": sha256(report_path),
              "guitarF1": report["primaryTimingAwarePitch"]["combinedGuitar"]["f1"],
              "bassF1": report["primaryTimingAwarePitch"]["bass"]["f1"],
              "guitarGate": report["gates"]["combinedGuitarPass"],
              "bassGate": report["gates"]["bassPass"],
              "bothGates": report["gates"]["bothPass"],
              "neverRescoreV165": True,
              "candidateRemainsImmutable": True,
              "candidateRepairOrRetuneAuthorized": False,
              "safety": {
                  "scoreExecutions": 1,
                  "candidateModified": False,
                  "referenceEventOrMeasureMining": False,
                  "thresholdSweep": False,
                  "variantSelection": False,
                  "humanCorrection": False,
                  "gpuUsed": False,
                  "cudaUsed": False,
                  "modalUsed": False,
                  "mainOrProductionModified": False
              }
          }
          Path("debug/v165-cpu-autonomous/score-terminal-freeze.json").write_text(
              json.dumps(terminal, indent=2, sort_keys=True, allow_nan=False) + "\n"
          )
          PY

          rm .github/workflows/v165-score.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- debug/v165-cpu-autonomous/reference-score.json debug/v165-cpu-autonomous/score-terminal-freeze.json .github/workflows/v165-score.yml
          changed="$(git diff --cached --name-only)"
          test -n "$changed"
          if echo "$changed" | grep -Ev '^debug/v165-cpu-autonomous/(reference-score\.json|score-terminal-freeze\.json)$|^\.github/workflows/v165-score\.yml$'; then
            echo "Unexpected path in V165 score terminal commit" >&2
            exit 1
          fi
          test "$(git hash-object "$CANDIDATE")" = "e70a444cb7778a6f56988cf8cc69dccb9c1d89ce"
          outcome="$(python -c 'import json; print(json.load(open("debug/v165-cpu-autonomous/reference-score.json"))["outcome"])')"
          git commit -m "research: freeze sole V165 professional-reference score ${outcome} [skip ci]"
          git push origin HEAD:"$BRANCH"
