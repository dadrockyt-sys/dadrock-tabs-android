name: Astra Go My Way Timing Origin V4 Diagnostic

on:
  push:
    branches: [astra-work]
    paths:
      - 'astra_backend/evaluation/gomyway_timing_origin_v4_diagnostic.py'
      - '.github/workflows/astra-gomyway-timing-origin-v4-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-and-rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'scipy==1.11.4' soundfile torch onnxruntime
          python -m pip install 'basic-pitch==0.4.0'

      - uses: actions/download-artifact@v4
        with:
          name: gomyway-reference-independent-timebase-v6-frozen
          path: frozen-v6
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37138941466

      - uses: actions/download-artifact@v4
        with:
          name: gomyway-professional-timing-revalidation-v1
          path: revalidated-v3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37141537153

      - name: Verify frozen inputs
        run: |
          set -euo pipefail
          cd frozen-v6
          sha256sum -c gomyway-reference-independent-timebase-v6-bundle.sha256
          cd ..
          test "$(sha256sum revalidated-v3/gomyway-professional-timing-map-v3-revalidated.json | awk '{print $1}')" = "1aeb65d69c8305f79d8a18995464379a28ed56626c8fc2ba32d036e9a63ab4ac"
          test "$(git hash-object public/gomywayfullaitest.m4a)" = "5e34fb55fbd011c55b56bc40cc5d062735b3fcd0"

      - name: Build V4 origin diagnostic map
        run: |
          set -euo pipefail
          mkdir -p out
          python astra_backend/evaluation/gomyway_timing_origin_v4_diagnostic.py             --v6-bundle frozen-v6/gomyway-reference-independent-timebase-v6-bundle.json             --structure-map public/gomyway-professional-timing-map-v2.json             --output-map out/gomyway-professional-timing-map-v4-origin-diagnostic.json             --output-audit out/gomyway-timing-origin-v4-diagnostic-audit.json
          sha256sum out/gomyway-professional-timing-map-v4-origin-diagnostic.json

      - name: Decode source
        run: ffmpeg -hide_banner -loglevel error -y -i public/gomywayfullaitest.m4a -ar 44100 -ac 2 -c:a pcm_f32le gomywayfullaitest.wav

      - name: Download and verify BS-Roformer
        run: |
          set -euo pipefail
          mkdir -p models/bs-roformer
          python - <<'PY'
          from pathlib import Path
          import hashlib, urllib.request
          p=Path("models/bs-roformer/bs_roformer_sw_6stem_fp16.onnx")
          urllib.request.urlretrieve("https://huggingface.co/elicwhite/bs-roformer-sw-6stem-onnx/resolve/main/bs_roformer_sw_6stem_fp16.onnx",p)
          expected="d3d2bac77a7023282cb5f35a5807179e34076b60589867b572275f1a8ec36444"
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          if actual != expected: raise SystemExit(actual)
          PY

      - name: Score V3 vs V4-origin with identical predictions
        env:
          PYTHONPATH: ${{ github.workspace }}/astra_backend:${{ github.workspace }}/astra_backend/evaluation
        run: |
          set -euo pipefail
          python astra_backend/evaluation/gomyway_timing_map_attribution_rescore_v1.py             --audio-source public/gomywayfullaitest.m4a             --audio-wav gomywayfullaitest.wav             --old-timing-map revalidated-v3/gomyway-professional-timing-map-v3-revalidated.json             --new-timing-map out/gomyway-professional-timing-map-v4-origin-diagnostic.json             --rhythm-reference research/v154-professional-references/scorer-ready/rhythm-scorer-ready.json             --lead-reference research/v154-professional-references/scorer-ready/lead-scorer-ready.json             --bass-reference research/v154-professional-references/scorer-ready/bass-scorer-ready.json             --model models/bs-roformer/bs_roformer_sw_6stem_fp16.onnx             --output-json out/gomyway-v3-vs-v4-origin-attribution.json
          sha256sum out/gomyway-v3-vs-v4-origin-attribution.json

      - uses: actions/upload-artifact@v4
        with:
          name: gomyway-timing-origin-v4-diagnostic
          path: out/
          retention-days: 30

      - if: always()
        run: rm -rf models/bs-roformer gomywayfullaitest.wav
