name: V147 Phase E Reference-Free Failure Analysis Once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v147-phase-e-reference-free-analysis-once.yml

permissions:
  contents: write

concurrency:
  group: v147-phase-e-reference-free-analysis-once
  cancel-in-progress: false

jobs:
  analyze:
    name: Reference-free V147 substitution diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact armed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fail closed if durable attempt sentinel already exists
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v143-contextual-prune-lobo
          if git cat-file -e origin/v143-contextual-prune-lobo:debug/v147-phase-e-reference-free/attempt-sentinel.json 2>/dev/null; then
            echo 'Phase E attempt sentinel already exists; refusing rerun.' >&2
            exit 90
          fi

      - name: Verify frozen reference-free identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object debug/v147-phase-e-reference-free/phase-e-failure-analysis-preregistration.json)" = "817c93576edb23adb9225f0211e1413e2d1a161d"
          test "$(git hash-object validation/v147_phase_e/analyze_reference_free_failure.py)" = "5abf362f4d424aac460f12c59c6a1f08081ac1cb"
          test "$(git hash-object modal/v147_phase_c_artifact_support.py)" = "f4278ffaacaca3f66baf7a3112e2af0f3bc387cf"
          test "$(git hash-object modal/v147_pitch_hypothesis.py)" = "49bce8b968406bb0d61ab61394954ef8a8303eb7"
          test "$(git hash-object validation/rhythm_holdout/canonical.py)" = "088d44827fb23e20d9aeeb4944a672989af5846c"
          test "$(sha256sum debug/v147-phase-c-real-audio/preserved-run-33038518285/candidate.json | awk '{print $1}')" = "c0215690d5bfd9d2d47b8784eee886e942fbd28c499f25c643635c45ff7a9636"
          test "$(sha256sum debug/v147-phase-c-real-audio/preserved-run-33038518285/decisions.json | awk '{print $1}')" = "3ec6c42730bf571c29258eca131c4e32da257c1ac6073e5319073818e8ac49b9"

      - name: Make reference and professional-image surfaces unreadable
        shell: bash
        run: |
          set -euo pipefail
          chmod 000 public/Professionalexample.jpg 2>/dev/null || true
          chmod -R 000 debug/v144-rhythm-calibration/reference 2>/dev/null || true
          chmod -R 000 validation/rhythm_holdout/reference 2>/dev/null || true
          test ! -r public/Professionalexample.jpg
          test ! -r debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json

      - name: Persist attempt sentinel and pre-analysis checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug/v147-phase-e-reference-free
          cat > debug/v147-phase-e-reference-free/attempt-sentinel.json <<EOF
          {
            "schema": "dadrock.tabs.v147.phase-e-reference-free-attempt-sentinel.v1",
            "classification": "analysis-attempt-armed-before-execution",
            "githubRunId": "${GITHUB_RUN_ID}",
            "workflowArmingCommit": "${GITHUB_SHA}",
            "preregistrationGitBlob": "817c93576edb23adb9225f0211e1413e2d1a161d",
            "analyzerGitBlob": "5abf362f4d424aac460f12c59c6a1f08081ac1cb",
            "referenceReadable": false,
            "professionalImageReadable": false,
            "audioRead": false,
            "analysisCompleted": false,
            "candidateConstructed": false
          }
          EOF
          cat >> docs/checkpoints/CURRENT_STATE.md <<EOF

          ## V147 Phase E reference-free failure analysis — ARMED / PRE-EXECUTION — 2026-08-27 UTC
          - User authorized continuation of the reference-free V147 failure analysis after the single Phase-D Gold score showed regression.
          - This phase is descriptive only: no Gold/reference, no professional image, no audio decode/CQT, no candidate construction/search, no threshold retuning, no Modal/L4/GPU, no main/Production change.
          - Preregistration: \`debug/v147-phase-e-reference-free/phase-e-failure-analysis-preregistration.json\`; Git blob \`817c93576edb23adb9225f0211e1413e2d1a161d\`.
          - Analyzer: \`validation/v147_phase_e/analyze_reference_free_failure.py\`; Git blob \`5abf362f4d424aac460f12c59c6a1f08081ac1cb\`.
          - Accepted baseline remains family #10 / 1144 events / \`4e6f9f247134f79f30a5448515c52a6ca1012c1f1314c3458b448582999e3881\`.
          - Immutable V147 candidate remains 1144 events / \`ca35c3492295a3079c17c35124df7a483166315e85649e95ded095c6c06b2b77\`; preserved decisions file SHA256 \`3ec6c42730bf571c29258eca131c4e32da257c1ac6073e5319073818e8ac49b9\`.
          - GitHub Actions run \`${GITHUB_RUN_ID}\`; arming commit \`${GITHUB_SHA}\`.
          - Durable attempt sentinel is committed before analysis; reruns fail closed.
          - Gold/reference and \`public/Professionalexample.jpg\` were made unreadable before this checkpoint. Analysis completed at this checkpoint: **NO**.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/v147-phase-e-reference-free/attempt-sentinel.json docs/checkpoints/CURRENT_STATE.md
          git commit -m 'docs: checkpoint V147 Phase E pre-analysis boundary'
          for attempt in 1 2 3 4 5; do
            git fetch origin v143-contextual-prune-lobo
            if git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq 5 ]; then exit 91; fi
            sleep $((attempt * 2))
          done

      - name: Run reference-free preserved-evidence analysis
        shell: bash
        run: |
          set -euo pipefail
          python validation/v147_phase_e/analyze_reference_free_failure.py \
            --v5 debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json \
            --candidate debug/v147-phase-c-real-audio/preserved-run-33038518285/candidate.json \
            --decisions debug/v147-phase-c-real-audio/preserved-run-33038518285/decisions.json \
            --output debug/v147-phase-e-reference-free/failure-analysis.json \
            --markdown debug/v147-phase-e-reference-free/failure-analysis.md | tee debug/v147-phase-e-reference-free/execution-output.txt

      - name: Verify outputs and create execution envelope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('.')
          result_path = root / 'debug/v147-phase-e-reference-free/failure-analysis.json'
          markdown_path = root / 'debug/v147-phase-e-reference-free/failure-analysis.md'
          result = json.loads(result_path.read_text(encoding='utf-8'))
          assert result['classification'] == 'reference-free-descriptive-diagnostic-no-candidate-construction'
          assert result['changeSummary']['changedEventCount'] == 247
          assert result['identities']['acceptedCanonicalEventSha256'] == '4e6f9f247134f79f30a5448515c52a6ca1012c1f1314c3458b448582999e3881'
          assert result['identities']['candidateCanonicalEventSha256'] == 'ca35c3492295a3079c17c35124df7a483166315e85649e95ded095c6c06b2b77'
          safety = result['safety']
          assert all(value is False for value in safety.values())
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          envelope = {
              'schema': 'dadrock.tabs.v147.phase-e-reference-free-execution-envelope.v1',
              'classification': 'reference-free-analysis-complete',
              'githubRunId': os.environ['GITHUB_RUN_ID'],
              'workflowArmingCommit': os.environ['GITHUB_SHA'],
              'preregistrationGitBlob': '817c93576edb23adb9225f0211e1413e2d1a161d',
              'analyzerGitBlob': '5abf362f4d424aac460f12c59c6a1f08081ac1cb',
              'resultSha256': sha(result_path),
              'markdownSha256': sha(markdown_path),
              'safety': safety,
          }
          (root / 'debug/v147-phase-e-reference-free/execution-envelope.json').write_text(
              json.dumps(envelope, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Persist findings, checkpoint, and self-seal workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('debug/v147-phase-e-reference-free/failure-analysis.json')
          result = json.loads(p.read_text(encoding='utf-8'))
          env = json.loads(Path('debug/v147-phase-e-reference-free/execution-envelope.json').read_text(encoding='utf-8'))
          change = result['changeSummary']
          evidence = result['evidenceContext']
          fingering = result['fingeringContext']
          pitch = result['pitchContext']
          q = evidence['nearestGateExcessDb']
          proximity = evidence['fixedGateProximityCounts']
          block = f'''\n## V147 Phase E reference-free failure analysis — COMPLETE / SEALED — 2026-08-27 UTC
          - Deterministic preserved-evidence analysis completed in GitHub Actions run `{env['githubRunId']}`; result SHA256 `{env['resultSha256']}`.
          - Accepted family #10 identity reverified: 1144 events / `{result['identities']['acceptedCanonicalEventSha256']}`.
          - V147 candidate identity reverified: 1144 events / `{result['identities']['candidateCanonicalEventSha256']}`.
          - Exactly **{change['changedEventCount']}** substitutions were confirmed: {change['direction'].get('down-one', 0)} down-one / {change['direction'].get('up-one', 0)} up-one across **{change['changedOnsetCount']}** changed onsets.
          - Changed-onset topology: **{change['singletonChangedOnsets']} singleton** / **{change['polyphonicChangedOnsets']} polyphonic**; changed events by accepted onset size `{change['changedEventsByAcceptedOnsetSize']}`; changed notes per changed onset `{change['changedNotesPerChangedOnset']}`.
          - Evidence distance to the nearest already-frozen V147 gate: median **{q['p50']:.3f} dB**, p10/p90 **{q['p10']:.3f}/{q['p90']:.3f} dB**; within 0.5 dB of a gate **{proximity['within0.5DbOfAnyGate']} / 247**, within 1.0 dB **{proximity['within1DbOfAnyGate']} / 247**.
          - Composite-score winners that were not fundamental-only winners: **{evidence['octaveBonusDependentWinnerCount']} / 247**.
          - Fingering reassignment: same-string **{fingering['sameStringChangedEvents']}**, different-string **{fingering['differentStringChangedEvents']}**; introduced pitch-collision onsets **{pitch['introducedPitchCollisionOnsets']}**; introduced string-collision onsets **{fingering['introducedStringCollisionOnsets']}**.
          - This phase does **not** label any individual change correct/incorrect and does not use Gold/reference content to tune anything. It identifies only reference-free mechanism/risk patterns.
          - Safety: Gold/reference read **NO**; professional image read **NO**; audio decode/HPSS/CQT recompute **NO**; Modal/L4/GPU **NO**; candidate construction/search **NO**; threshold retuning **NO**; main/Production change **NO**.
          - Phase E one-use workflow is deleted in the same persistence commit. Any V148 hypothesis/candidate must be a separate frozen phase before construction.
          '''
          with Path('docs/checkpoints/CURRENT_STATE.md').open('a', encoding='utf-8') as handle:
              handle.write(block)
          sentinel_path = Path('debug/v147-phase-e-reference-free/attempt-sentinel.json')
          sentinel = json.loads(sentinel_path.read_text(encoding='utf-8'))
          sentinel['analysisCompleted'] = True
          sentinel['resultSha256'] = env['resultSha256']
          sentinel_path.write_text(json.dumps(sentinel, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/v147-phase-e-reference-free-analysis-once.yml
          git add \
            debug/v147-phase-e-reference-free/attempt-sentinel.json \
            debug/v147-phase-e-reference-free/failure-analysis.json \
            debug/v147-phase-e-reference-free/failure-analysis.md \
            debug/v147-phase-e-reference-free/execution-output.txt \
            debug/v147-phase-e-reference-free/execution-envelope.json \
            docs/checkpoints/CURRENT_STATE.md
          git commit -m 'debug: persist V147 reference-free failure analysis'
          for attempt in 1 2 3 4 5; do
            git fetch origin v143-contextual-prune-lobo
            if git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 92
