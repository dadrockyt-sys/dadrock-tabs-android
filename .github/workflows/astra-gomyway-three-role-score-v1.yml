name: Astra Go My Way Three Role Professional Score V1

on:
  push:
    branches: [astra-work]
    paths:
      - 'astra_backend/evaluation/score_gomyway_full_song_three_role_v1.py'
      - '.github/workflows/astra-gomyway-three-role-score-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-work
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download frozen prediction bundle from run 37094392537
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream
          conclusion="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/37094392537 --jq .conclusion)"
          test "$conclusion" = "success"
          gh run download 37094392537             -n astra-gomyway-full-song-professional-benchmark-v1             -D upstream
          test -f upstream/gomyway_full_song_professional_benchmark_v1.json

      - name: Score frozen predictions against all three professional roles
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=astra_backend:astra_backend/evaluation           python astra_backend/evaluation/score_gomyway_full_song_three_role_v1.py             --prediction-benchmark upstream/gomyway_full_song_professional_benchmark_v1.json             --intro-reference analyzer/fixtures/gomyway_professional_intro_reference_v1.json             --rhythm-reference public/gomyway-professional-rhythm-reference-17-113.json             --timing-map public/gomyway-professional-timing-map-v2.json             --bass-reference research/v154-professional-references/bass-professional-reference-machine-readable.json             --bass-timing research/v154-professional-references/bass-source-local-attack-timing.json             --lead-reference research/v154-professional-references/lead-professional-reference-machine-readable.json             --lead-timing research/v154-professional-references/lead-source-local-attack-timing.json             --output-json gomyway_full_song_three_role_score_v1.json

      - name: Summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("gomyway_full_song_three_role_score_v1.json"))
          print("# Go My Way Full Song Three-Role Professional Score V1")
          print(f"- Total pitched professional targets: **{d['professionalReferenceCoverage']['totalPitchedScorerRows']}**")
          print(f"- Three-role macro exact MIDI/onset F1: **{d['threeRoleMacroExactMidiOnsetF1']:.4f}**")
          for role in ("rhythm","lead","bass"):
              r=d["roles"][role]
              exact=r["rawRoleStem"]["exactMidiOnset"]
              pc=r["rawRoleStem"]["pitchClassOnset"]
              onset=r["rawRoleStem"]["onsetOnly"]
              whole=r["wholeMixControl"]["exactMidiOnset"]
              print(
                  f"- {role}: targets={r['targetCount']}, "
                  f"exact F1={exact['f1']:.4f}, pitch-class F1={pc['f1']:.4f}, "
                  f"onset-only F1={onset['f1']:.4f}, whole-mix exact F1={whole['f1']:.4f}, "
                  f"separator delta={r['exactF1DeltaRoleStemVsWholeMix']:+.4f}"
              )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: astra-gomyway-full-song-three-role-score-v1
          path: gomyway_full_song_three_role_score_v1.json
          retention-days: 30

      - if: always()
        run: rm -rf upstream
