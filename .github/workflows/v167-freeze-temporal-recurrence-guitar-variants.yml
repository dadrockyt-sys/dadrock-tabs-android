name: V167 freeze temporal-recurrence Guitar variants

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v167-freeze-temporal-recurrence-guitar-variants.yml

permissions:
  contents: write

concurrency:
  group: v167-freeze-temporal-recurrence-guitar-variants-once
  cancel-in-progress: false

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: 67cfba5e486b2a31b842ce6101e57fa543922e8e
  I003: debug/v167-single-song-calibration/iteration-003-generated.json
  I005: debug/v167-single-song-calibration/iteration-005-generated.json
  DIAGNOSIS: debug/v167-single-song-calibration/post-topology-temporal-recurrence-analysis.json
  BUILDER: validation/v167_single_song_calibration/build_temporal_recurrence_guitar_variants_v167.py
  GRADER: validation/v167_single_song_calibration/score_temporal_recurrence_guitar_variants_v167.py
  VARIANT_ROOT: debug/v167-single-song-calibration/temporal-recurrence-variants
  MANIFEST: debug/v167-single-song-calibration/temporal-recurrence-guitar-manifest.json
  RECEIPT: debug/v167-single-song-calibration/temporal-recurrence-generation-receipt.json
  CUDA_VISIBLE_DEVICES: ""
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  freeze-once:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact recurrence generation arm
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.21'

      - name: Verify reference-blind generation boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v167-freeze-temporal-recurrence-guitar-variants.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"

          test "$(git hash-object "$I003")" = "758f8762632e916306aed9b036a6483af9431dc0"
          test "$(git hash-object "$I005")" = "8d68f4d7fac4e094bcd617b026befddd370d9368"
          test "$(git hash-object "$DIAGNOSIS")" = "42a4d4bd9c016b5aee74a14eea4b78fb601a6b6e"
          test "$(git hash-object "$BUILDER")" = "9eab55638625f71949f0877369f543459bcf8fda"
          test "$(git hash-object "$GRADER")" = "e8251df48d03e94a2d53060bc1e82b4e9d5ba4f7"
          test "$(git hash-object docs/checkpoints/CURRENT_STATE.md)" = "4c5e33fc2f87985888d32c0544e76aa8ca5ea8af"

          test ! -e "$VARIANT_ROOT"
          test ! -e "$MANIFEST"
          test ! -e "$RECEIPT"
          python -m py_compile "$BUILDER" "$GRADER"

          python - <<'PY'
          from pathlib import Path
          text = Path('validation/v167_single_song_calibration/build_temporal_recurrence_guitar_variants_v167.py').read_text()
          for forbidden in ('frontend-reference-payload.json', 'score_frontend_reference.py', '--reference', '--scorer-code'):
              assert forbidden not in text, forbidden
          assert 'recur-gap1-earliest' in text
          assert 'recur-gap1-strongest' in text
          assert 'recur-gap2-strongest' in text
          PY

      - name: Generate and verify all preregistered recurrence variants
        shell: bash
        run: |
          set -euo pipefail
          python "$BUILDER" \
            --i003 "$I003" \
            --i005 "$I005" \
            --diagnosis "$DIAGNOSIS" \
            --output-dir "$VARIANT_ROOT" \
            --manifest "$MANIFEST"

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path('debug/v167-single-song-calibration/temporal-recurrence-guitar-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          assert manifest['schema'] == 'dadrock.tabs.v167.predeclared-temporal-recurrence-guitar-manifest.v1'
          assert manifest['status'] == 'FROZEN_BEFORE_REFERENCE_SCORING'
          assert manifest['inputs']['sourceI005AdditionCount'] == 48
          assert manifest['policy']['professionalReferenceReadByGenerator'] is False
          assert manifest['policy']['scorerReadByGenerator'] is False
          assert manifest['policy']['newReferenceFacingScoreCallsByGenerator'] == 0
          assert manifest['policy']['reproductionControlScored'] is False
          assert manifest['policy']['newGuitarVariantScoreCallsPlanned'] == 3
          assert manifest['policy']['bassScoreCallsPlanned'] == 0
          assert manifest['policy']['noThresholdSweep'] is True
          expected = {
              'recur-repro-i005': (48, 1098, True),
              'recur-gap1-earliest': (43, 1093, False),
              'recur-gap1-strongest': (43, 1093, False),
              'recur-gap2-strongest': (40, 1090, False),
          }
          assert len(manifest['variants']) == 4
          for row in manifest['variants']:
              kept, count, repro = expected[row['id']]
              assert row['summary']['keptI005Additions'] == kept
              assert row['counts']['combinedGuitar'] == count
              assert row['counts']['bass'] == 512
              assert row['reproductionControl'] is repro
              path = Path('debug/v167-single-song-calibration/temporal-recurrence-variants') / row['relativePath']
              assert path.is_file()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == row['sha256']
          print(json.dumps({
              'manifestSha256': hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
              'variants': {row['id']: row['summary']['keptI005Additions'] for row in manifest['variants']},
              'referenceRead': False,
              'scorerRead': False,
          }, sort_keys=True))
          PY

      - name: Freeze generation receipt and self-seal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path('debug/v167-single-song-calibration/temporal-recurrence-variants')
          manifest_path = Path('debug/v167-single-song-calibration/temporal-recurrence-guitar-manifest.json')
          receipt_path = Path('debug/v167-single-song-calibration/temporal-recurrence-generation-receipt.json')
          manifest = json.loads(manifest_path.read_text())
          frozen_variants = []
          for row in manifest['variants']:
              path = root / row['relativePath']
              frozen_variants.append({
                  'id': row['id'],
                  'relativePath': row['relativePath'],
                  'sha256': row['sha256'],
                  'gitBlob': subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip(),
                  'counts': row['counts'],
                  'summary': row['summary'],
                  'reproductionControl': row['reproductionControl'],
              })
          receipt = {
              'schema': 'dadrock.tabs.v167.temporal-recurrence-generation-receipt.v1',
              'version': 'V167',
              'status': 'TEMPORAL_RECURRENCE_VARIANTS_FROZEN_BEFORE_SCORING',
              'classification': 'SINGLE_SONG_TRAINING_CALIBRATION_ONLY',
              'workflowRunId': int(os.environ['GITHUB_RUN_ID']),
              'workflowRunNumber': int(os.environ['GITHUB_RUN_NUMBER']),
              'workflowRunAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'workflowHeadSha': os.environ['GITHUB_SHA'],
              'manifestSha256': hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
              'manifestGitBlob': subprocess.check_output(['git', 'hash-object', str(manifest_path)], text=True).strip(),
              'implementation': {
                  'builderGitBlob': '9eab55638625f71949f0877369f543459bcf8fda',
                  'graderGitBlob': 'e8251df48d03e94a2d53060bc1e82b4e9d5ba4f7',
              },
              'inputs': manifest['inputs'],
              'frozenVariants': frozen_variants,
              'policy': {
                  'professionalReferenceReadByGenerationWorkflow': False,
                  'scorerReadByGenerationWorkflow': False,
                  'newReferenceFacingScoreCalls': 0,
                  'allCandidateHashesFrozenBeforeScoring': True,
                  'reproductionControlScored': False,
                  'bassScored': False,
                  'gpuCudaModalUsed': False,
                  'mainOrProductionModified': False,
              },
          }
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

          rm .github/workflows/v167-freeze-temporal-recurrence-guitar-variants.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$VARIANT_ROOT" "$MANIFEST" "$RECEIPT" .github/workflows/v167-freeze-temporal-recurrence-guitar-variants.yml
          changed="$(git diff --cached --name-only)"
          if echo "$changed" | grep -Ev '^debug/v167-single-song-calibration/temporal-recurrence-variants/[^/]+\.json$|^debug/v167-single-song-calibration/temporal-recurrence-(guitar-manifest|generation-receipt)\.json$|^\.github/workflows/v167-freeze-temporal-recurrence-guitar-variants\.yml$'; then
            echo 'Unexpected temporal recurrence generation path' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 7
          git commit -m "research: freeze V167 temporal recurrence Guitar variants before scoring [skip ci]"
          git push origin HEAD:"$BRANCH"
