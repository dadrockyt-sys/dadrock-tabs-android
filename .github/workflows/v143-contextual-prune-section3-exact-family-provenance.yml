name: V143 Section 3 Exact Family Provenance

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-contextual-prune-section3-exact-family-provenance.yml
      - analyzer/v143_section3_exact_family_provenance_capture_modal.py

permissions:
  contents: write

jobs:
  section3-exact-family-provenance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Check out isolated research branch
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact-family inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s public/gomywayfullaitest.m4a
          test -s public/training/v143-musical-reconstruction-calibration/fresh-section3-reference-free-cache.json
          test -s analyzer/v143_section3_exact_family_provenance_capture_modal.py
          test -s analyzer/v143_shift_trace_audio_separator_cli.py
          echo "Section 3 exact-family provenance inputs are present."

      - name: Capture exact historical Family B on Modal
        shell: bash
        run: |
          set +e
          mkdir -p debug/v143-contextual-prune
          log=debug/v143-contextual-prune/section3-exact-family-provenance-capture.log
          output=debug/v143-contextual-prune/section3-exact-family-provenance-capture.json

          : > "$log"
          echo "commit=$GITHUB_SHA" >> "$log"
          echo "actor=$GITHUB_ACTOR" >> "$log"

          token_available=false
          attempted=false
          status=99

          if [ -n "${MODAL_TOKEN_ID:-}" ] && [ -n "${MODAL_TOKEN_SECRET:-}" ]; then
            token_available=true
            python -m pip install --disable-pip-version-check modal >> "$log" 2>&1
            install_status=$?
            if [ "$install_status" -eq 0 ]; then
              attempted=true
              python -m modal run analyzer/v143_section3_exact_family_provenance_capture_modal.py::diagnose >> "$log" 2>&1
              status=$?
            else
              status=$install_status
            fi
          else
            echo "Modal GitHub credentials are unavailable; diagnostic not attempted." >> "$log"
          fi

          TOKEN_AVAILABLE="$token_available" ATTEMPTED="$attempted" STATUS="$status" python - <<'PY'
          import json
          import os
          from pathlib import Path

          log_path = Path("debug/v143-contextual-prune/section3-exact-family-provenance-capture.log")
          output = Path("debug/v143-contextual-prune/section3-exact-family-provenance-capture.json")
          text = log_path.read_text(encoding="utf-8", errors="replace")
          target_gate = "v143-section3-exact-family-provenance-capture"
          result = None
          decoder = json.JSONDecoder()
          for index, char in enumerate(text):
              if char != "{":
                  continue
              try:
                  value, _ = decoder.raw_decode(text[index:])
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict) and value.get("gate") == target_gate:
                  result = value

          payload = {
              "schemaVersion": 1,
              "gate": "v143-section3-exact-family-provenance-capture-action",
              "modalCredentialsAvailableInGitHubActions": os.environ["TOKEN_AVAILABLE"] == "true",
              "diagnosticAttempted": os.environ["ATTEMPTED"] == "true",
              "modalCommandExitCode": int(os.environ["STATUS"]) if os.environ["ATTEMPTED"] == "true" else None,
              "diagnosticResultFound": result is not None,
              "diagnosticResult": result,
              "logTail": text.splitlines()[-240:],
              "liveEndpointDeployedOrModified": False,
              "productionModified": False,
          }
          output.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

          exit 0

      - name: Preserve full exact-family log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-section3-exact-family-provenance-log
          path: debug/v143-contextual-prune/section3-exact-family-provenance-capture.log
          if-no-files-found: error
          retention-days: 7

      - name: Commit compact exact-family result
        shell: bash
        run: |
          set -euo pipefail
          git add -- debug/v143-contextual-prune/section3-exact-family-provenance-capture.json
          if git diff --cached --quiet; then
            echo "No exact-family provenance result changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record V143 Section 3 exact-family provenance"
          git push origin HEAD:v143-contextual-prune-lobo

      - name: Report exact-family provenance state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("debug/v143-contextual-prune/section3-exact-family-provenance-capture.json").read_text(encoding="utf-8"))
          result = data.get("diagnosticResult") or {}
          summary = result.get("summary") or {}
          invariants = result.get("invariants") or {}

          checks = {
              "Modal credentials available": data.get("modalCredentialsAvailableInGitHubActions") is True,
              "Diagnostic attempted": data.get("diagnosticAttempted") is True,
              "Modal command exited zero": data.get("modalCommandExitCode") == 0,
              "Diagnostic result found": data.get("diagnosticResultFound") is True,
              "Historical Family B captured": int(summary.get("historicalFamilyWorkerCount") or 0) >= 1,
              "Exact Section 3 provenance captured": summary.get("section3ExactProvenanceCaptured") is True,
              "Every captured Family B exact": summary.get("allHistoricalFamilyWorkersExact") is True,
              "Original boundary preserved": invariants.get("originalBandBoundaryPreserved") is True,
              "Strict semantic comparison": invariants.get("strictExactSemanticComparison") is True,
              "Strict capture comparison": invariants.get("strictExactCaptureDiagnosticsComparison") is True,
              "Strict decision comparison": invariants.get("strictExactDecisionComparison") is True,
              "Strict score comparison": invariants.get("strictExactScoreComparison") is True,
              "Tolerances not weakened": invariants.get("comparisonTolerancesWeakened") is False,
              "Trace returns original randint": invariants.get("traceWrapperReturnsOriginalRandintValueUnchanged") is True,
              "17-32 not claimed": invariants.get("measures17To32Claimed") is False,
              "Frozen model untouched": invariants.get("frozenModelModified") is False,
              "Frozen predictions untouched": invariants.get("frozenPredictionsModified") is False,
              "Thresholds untouched": invariants.get("thresholdsModified") is False,
              "Live endpoint untouched": invariants.get("liveEndpointDeployedOrModified") is False,
              "Production untouched": invariants.get("productionModified") is False,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Section 3 exact-family provenance failed: " + ", ".join(failed))

          print("WORKERS", result.get("workerCount"))
          print("BATCHES", result.get("batchesRun"))
          print("HISTORICAL_FAMILY_WORKERS", summary.get("historicalFamilyWorkerCount"))
          print("EXACT_PROVENANCE_WORKERS", summary.get("exactHistoricalCarrierAndScoreCount"))
          print("SECTION3_EXACT_PROVENANCE", summary.get("section3ExactProvenanceCaptured"))
          print("PRODUCTION_MODIFIED", False)
          PY
