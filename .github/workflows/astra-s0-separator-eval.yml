name: Astra S0 Separator Evaluation

on:
  push:
    branches:
      - astra-work
    paths:
      - 'docs/astra/S0_SEPARATOR_RUN_TRIGGER.txt'

permissions:
  contents: read

concurrency:
  group: astra-s0-separator-eval
  cancel-in-progress: false

jobs:
  evaluate:
    name: BS-Roformer S0 evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout astra-work
        uses: actions/checkout@v4
        with:
          ref: astra-work
          fetch-depth: 1

      - name: Checkout private S0 fixtures
        uses: actions/checkout@v4
        with:
          repository: dadrockyt-sys/dadrock-tabs-private-fixtures
          token: ${{ secrets.S0_FIXTURE_TOKEN }}
          path: .private-s0-fixtures
          fetch-depth: 1

      - name: Prepare private fixture directory
        shell: bash
        run: |
          set -euo pipefail
          test -d .private-s0-fixtures/s0_sources
          rm -rf s0_sources
          cp -R .private-s0-fixtures/s0_sources ./s0_sources
          test "$(find s0_sources -maxdepth 1 -type f | wc -l)" -eq 16

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install numpy scipy soundfile torch onnxruntime

      - name: Download and verify BS-Roformer FP16 ONNX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models/bs-roformer
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import urllib.request

          url = "https://huggingface.co/elicwhite/bs-roformer-sw-6stem-onnx/resolve/main/bs_roformer_sw_6stem_fp16.onnx"
          path = Path("models/bs-roformer/bs_roformer_sw_6stem_fp16.onnx")
          expected = "d3d2bac77a7023282cb5f35a5807179e34076b60589867b572275f1a8ec36444"
          urllib.request.urlretrieve(url, path)
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          print("model_sha256", actual)
          if actual != expected:
              raise SystemExit(f"model SHA mismatch: {actual}")
          PY

      - name: Compile evaluation code
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            astra_backend/evaluation/build_s0_synthetic_mixtures_v1.py \
            astra_backend/evaluation/bs_roformer_sw_6stem_adapter_v1.py \
            astra_backend/evaluation/stem_bleed_cleanup_v1.py \
            astra_backend/evaluation/stem_bleed_diagnostics_v1.py \
            astra_backend/evaluation/run_bs_roformer_s0_v1.py

      - name: Generate deterministic S0 fixtures
        shell: bash
        run: |
          set -euo pipefail
          rm -rf s0_generated
          python astra_backend/evaluation/build_s0_synthetic_mixtures_v1.py \
            --source-dir s0_sources \
            --output-dir s0_generated

      - name: Run BS-Roformer S0 evaluation
        shell: bash
        run: |
          set -euo pipefail
          python astra_backend/evaluation/run_bs_roformer_s0_v1.py \
            --s0-root s0_generated \
            --model models/bs-roformer/bs_roformer_sw_6stem_fp16.onnx \
            --output-json s0_bs_roformer_result.json

      - name: Write GitHub summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          d = json.loads(Path("s0_bs_roformer_result.json").read_text())
          print("# Astra S0 BS-Roformer evaluation")
          print()
          print(f"- Mixtures: **{d['mixtureCount']}**")
          print(f"- Mean cleanup improvement: **{d['meanCleanupImprovementDb']:.3f} dB**")
          print(f"- Minimum cleanup improvement: **{d['minimumCleanupImprovementDb']:.3f} dB**")
          print(f"- Maximum cleanup improvement: **{d['maximumCleanupImprovementDb']:.3f} dB**")
          print(f"- Total wall time: **{d['totalWallSeconds']:.1f} s**")
          print(f"- Model SHA-256: `{d['modelSha256']}`")
          print()
          print("Synthetic S0 fixture only; this is not commercial-song evidence.")
          PY

      - name: Upload evaluation JSON only
        uses: actions/upload-artifact@v4
        with:
          name: astra-s0-bs-roformer-result
          path: s0_bs_roformer_result.json
          if-no-files-found: error
          retention-days: 30

      - name: Ensure private audio is not persisted
        if: always()
        shell: bash
        run: |
          rm -rf s0_sources s0_generated .private-s0-fixtures models/bs-roformer
