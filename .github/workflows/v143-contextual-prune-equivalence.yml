name: V143 contextual-prune source-artifact equivalence

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - analyzer/v143-intro-1-16-evidence/**
      - public/training/v143-musical-reconstruction-calibration/contextual-prune-frozen-model.json
      - .github/workflows/v143-contextual-prune-equivalence.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify preserved measures 1-16 carrier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify source/artifact equivalence
        id: equivalence
        shell: bash
        run: |
          set +e
          python analyzer/v143-intro-1-16-evidence/run_source_artifact_equivalence_verifier.py > /tmp/v143-static-equivalence.txt 2>&1
          status=$?
          cat /tmp/v143-static-equivalence.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist verification result
        run: |
          cp /tmp/v143-static-equivalence.txt docs/checkpoints/V143_STATIC_EQUIVALENCE_RESULT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/checkpoints/V143_STATIC_EQUIVALENCE_RESULT.txt
          if git diff --cached --quiet; then
            echo "Verification result unchanged."
          else
            git commit -m "Record V143 static equivalence result"
            git push origin HEAD:v143-contextual-prune-lobo
          fi

      - name: Enforce verifier pass
        if: steps.equivalence.outputs.status != '0'
        run: |
          echo "V143 static source/artifact equivalence verifier failed. See persisted result."
          exit 1
