name: Preserve dead-video song pages

on:
  push:
    branches:
      - seo-preserve-song-pages-health-cleanup
    paths:
      - '.github/scripts/preserve_dead_video_song_pages.py'
      - '.github/workflows/preserve-dead-video-song-pages.yml'

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo-preserve-song-pages-health-cleanup

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply preservation patch
        run: python .github/scripts/preserve_dead_video_song_pages.py

      - name: Verify diff
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Commit preservation fix
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/[[...path]]/route.js app/api/admin/health/route.js
          git commit -m "Preserve song pages when source videos disappear"
          git push origin seo-preserve-song-pages-health-cleanup
