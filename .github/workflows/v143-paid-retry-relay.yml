name: V143 Authorized Paid Retry Relay

on:
  push:
    branches: [v143-contextual-prune-lobo]
    paths:
      - .github/workflows/v143-paid-retry-relay.yml
      - debug/v143-contextual-prune/paid-retry-dispatch-authorized.once

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.head_commit.message == 'chore: dispatch authorized precision retry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Reverify one-shot retry boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v143-contextual-prune-lobo"
          test -f debug/v143-contextual-prune/precision-v2-capture-attempt-1-lock.json
          test ! -e debug/v143-contextual-prune/precision-v2-capture-lock.json
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          grep -Fq '@app.function(image=candidate_image, gpu="L4", timeout=3000, memory=12288)' analyzer/v143_repaired_timing_precision_candidate_product_modal.py
      - name: Dispatch exactly one paid retry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/v143-repaired-timing-precision-candidate-product.yml/dispatches" \
            --input - <<'JSON'
          {"ref":"v143-contextual-prune-lobo","inputs":{"paid_capture_authorized":"YES"}}
          JSON
