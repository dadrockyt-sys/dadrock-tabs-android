name: Astra Guitar-TECHS P1 P2 Acquisition

on:
  push:
    branches:
      - astra-work
    paths:
      - .github/workflows/guitar-techs-p1-p2-acquisition.yml

permissions:
  contents: read

jobs:
  acquire-identities:
    if: github.event.head_commit.message == 'Authorize Guitar-TECHS P1/P2 acquisition'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RECORD_BASE: https://zenodo.org/records/14963133/files
      AUTHORIZATION_SCOPE: guitar-techs-p1-p2-development-media-v1
    steps:
      - name: Acquire exact P1/P2 archives and freeze identity receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipt
          cat > receipt/expected.tsv <<'EOF'
          P1_chords.zip	981741162	be9ef8bbdceb1912d565254e607a6d94	P1	chords
          P1_scales.zip	453349723	9c0b98e8fb42a522df727ea8bf545e4f	P1	scales
          P1_singlenotes.zip	108626613	ca0c4674dde3805574685a313f7c39eb	P1	singlenotes
          P1_techniques.zip	326280863	18634a41a6db5a8de10d07eb3122a872	P1	techniques
          P2_chords.zip	1150819056	eb6f74dd19162237189281688ad7ad2e	P2	chords
          P2_scales.zip	471254783	96664853872f51e5f8aa4447313b7cf5	P2	scales
          P2_singlenotes.zip	116133457	40fbf03d8b04bb2cf42df20f36dc2254	P2	singlenotes
          P2_techniques.zip	395839610	f4189251ce50be25f06a173b2c2bba00	P2	techniques
          EOF

          printf '%s
' '{"schema":"astra-guitar-techs-p1-p2-acquisition-receipt-v1","authorizationScope":"guitar-techs-p1-p2-development-media-v1","record":"https://zenodo.org/records/14963133","version":"v1","p3Opened":false,"p3Downloaded":false,"archives":[' > receipt/receipt.partial.json
          first=1

          while IFS=$'\t' read -r file expected_bytes expected_md5 performer category; do
            echo "::group::Acquire $file"
            url="$RECORD_BASE/$file?download=1"
            curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors --output "$file" "$url"

            actual_bytes="$(stat -c %s "$file")"
            actual_md5="$(md5sum "$file" | awk '{print $1}')"
            actual_sha256="$(sha256sum "$file" | awk '{print $1}')"

            test "$actual_bytes" = "$expected_bytes"
            test "$actual_md5" = "$expected_md5"

            if [ "$first" -eq 0 ]; then printf ',' >> receipt/receipt.partial.json; fi
            first=0
            python3 - "$file" "$expected_bytes" "$expected_md5" "$actual_sha256" "$performer" "$category" >> receipt/receipt.partial.json <<'PY'
          import json, sys
          file, size, md5, sha256, performer, category = sys.argv[1:]
          print(json.dumps({
              "file": file,
              "bytes": int(size),
              "publishedMd5": md5,
              "astraSha256": sha256,
              "performer": performer,
              "category": category,
              "identityVerified": True,
              "extracted": False,
          }, separators=(",", ":")), end="")
          PY
            rm -f "$file"
            echo "::endgroup::"
          done < receipt/expected.tsv

          printf '%s
' '],"allPublishedIdentitiesVerified":true,"extracted":false,"trainingStarted":false,"customerDeliveryEligible":false}' >> receipt/receipt.partial.json
          python3 -m json.tool receipt/receipt.partial.json > receipt/GUITARTECHS_P1_P2_ACQUISITION_RECEIPT_V1.json
          sha256sum receipt/GUITARTECHS_P1_P2_ACQUISITION_RECEIPT_V1.json | tee receipt/receipt.sha256
          rm -f receipt/receipt.partial.json receipt/expected.tsv

      - name: Confirm no archive bodies remain
        shell: bash
        run: |
          set -euo pipefail
          if find . -maxdepth 1 -type f -name 'P[123]_*.zip' | grep -q .; then
            echo "archive body remains after identity acquisition" >&2
            exit 1
          fi

      - name: Upload identity receipt only
        uses: actions/upload-artifact@v4
        with:
          name: guitar-techs-p1-p2-acquisition-receipt
          path: receipt/
          if-no-files-found: error
          retention-days: 7
