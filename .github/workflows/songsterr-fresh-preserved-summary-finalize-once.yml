name: Songsterr Fresh Preserved Summary Finalize Once

on:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-preserved-summary-finalize-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: songsterr-fresh-pipeline-v1
          fetch-depth: 0

      - name: Verify preserved measurement and update checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          summary_path = Path('docs/checkpoints/SONGSTERR_FRESH_CODESPACES_WORKBENCH_MEASUREMENT_V2.json')
          d = json.loads(summary_path.read_text(encoding='utf-8'))
          assert d['contract'] == 'songsterr-fresh-codespaces-workbench-measurement-v2'
          assert d['authorityEligible'] is False
          assert d['modelValidationComplete'] is False
          assert d['probeAloneEnrollsAuthority'] is False
          assert d['mayAdvanceDelivery'] is False
          assert d['durationAuthorityChanged'] is False
          assert d['customerEligibleEvents'] == 0
          assert d['workbenchOnly'] is True
          assert d['decodeDiagnostics']['sourceBlobMatchesAuthorizedFixture'] is True
          assert d['structureDiagnostics']['structureIdentityMatchesAuthorityBaseline'] is True
          assert d['structureDiagnostics']['actualStructureSignature'] == 'fnv1a32:2f493225'
          ids = d['identities']
          for k in ['guitarStemSha256','noteInferenceSha256','activationBundleSha256','decisionSurfaceSha256','canonicalEvidenceSha256']:
              assert re.fullmatch(r'[0-9a-f]{64}', ids[k]), (k, ids[k])

          p = Path('docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md')
          t = p.read_text(encoding='utf-8')
          marker = '- Immediate next step before stopping/deleting the current Codespace: run the preservation helper, commit only `docs/checkpoints/SONGSTERR_FRESH_CODESPACES_WORKBENCH_MEASUREMENT_V2.json`, and push it to `songsterr-fresh-pipeline-v1`. After that, stop the Codespace so compute billing stops. Do not enroll the Codespaces fingerprint.'
          replacement = (
              '- Preserved Codespaces measurement committed at `c7c1d5ef1d8c44fe40db597fec554bf590e76028` in `docs/checkpoints/SONGSTERR_FRESH_CODESPACES_WORKBENCH_MEASUREMENT_V2.json`; verification passed. '
              'Exact identities: guitar stem `4bbcefd2b8bdf057af407640604106dc6438560155c378290ccc8b3e1ac9c656`, note inference `8691a162c53b9894b5e3c4f9ddf86695ae8b7b33dc2d465517d2388c99535f63`, activation bundle `92f14a4c18c53b6e1b0490adde45e72da17de0e32e565770a1d8fc7e1246273d`, decision surface `1d089df0116313f20252d3db84fdc21a142e7101e083a0a881d8e6cc508a619f`, canonical evidence `dacd303abb868eb5d5e15877337ac67afeb6f23ebb2aa0cd3f5550810a6172da`. '
              'Source blob and frozen structure identity both match their authorized baselines; decode-byte identity differs only diagnostically. All non-promotion guards remain false/zero. The Codespace may now be stopped or deleted without losing this summary evidence; do not enroll its fingerprint.'
          )
          if marker not in t:
              raise SystemExit('PRESERVATION_NEXT_STEP_MARKER_CHANGED')
          t = t.replace(marker, replacement, 1)
          lines = t.splitlines()
          stamp = datetime.now(ZoneInfo('America/Toronto')).strftime('%Y-%m-%d %H:%M America/Toronto')
          for i, line in enumerate(lines):
              if line.startswith('Updated: '):
                  lines[i] = f'Updated: {stamp}'
                  break
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('PRESERVED_CODESPACES_MEASUREMENT_VERIFIED')
          PY

      - name: Commit checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dadrockyt-sys'
          git config user.email 'Stephen.s.mcnally@gmail.com'
          git add docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md
          git commit -m 'docs: finalize preserved Codespaces measurement'
          git push origin HEAD:songsterr-fresh-pipeline-v1
