name: One-time BTS separator completion fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-bts-separator-success-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Keep completed stems in the BTS output folder
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('analyzer/modal_bts_separator.py')
          text = path.read_text()
          old = '            timeout=3300,\n            env={\n'
          new = '            timeout=3300,\n            cwd=str(output_dir),\n            env={\n'
          if 'cwd=str(output_dir)' not in text:
              if old not in text:
                  raise SystemExit('Expected separator subprocess block not found')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm .github/workflows/one-time-bts-separator-success-fix.yml

      - name: Commit BTS separator completion fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analyzer/modal_bts_separator.py .github/workflows/one-time-bts-separator-success-fix.yml
          git commit -m 'Keep completed BTS stems in output folder'
          git push origin main
