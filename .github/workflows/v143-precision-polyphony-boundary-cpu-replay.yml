name: v143 precision polyphony boundary CPU replay

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - analyzer/v143_precision_polyphony_boundary.py
      - analyzer/test_v143_precision_polyphony_boundary.py
      - analyzer/v143_precision_polyphony_boundary_replay.py
      - debug/v143-contextual-prune/repaired-timing-precision-candidate-product.json
      - .github/workflows/v143-precision-polyphony-boundary-cpu-replay.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile boundary replay only
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            analyzer/v143_precision_polyphony_boundary.py \
            analyzer/test_v143_precision_polyphony_boundary.py \
            analyzer/v143_precision_polyphony_boundary_replay.py \
            analyzer/v143_rhythm_guitar_note_mapper.py \
            analyzer/v143_contextual_prune_precision_shadow.py
      - name: Run boundary unit tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=analyzer python analyzer/test_v143_precision_polyphony_boundary.py
      - name: Replay persisted paid precision evidence CPU-only
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=analyzer python analyzer/v143_precision_polyphony_boundary_replay.py \
            --input debug/v143-contextual-prune/repaired-timing-precision-candidate-product.json \
            --output debug/v143-contextual-prune/precision-polyphony-boundary-replay.json
      - name: Enforce replay invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('debug/v143-contextual-prune/precision-polyphony-boundary-replay.json')
          result = json.loads(p.read_text())
          assert result['classification'] == 'v143-precision-polyphony-boundary-cpu-replay'
          assert result['source']['retainedAttackCount'] == 725
          assert result['source']['originalPitchHypothesisCount'] == 7535
          assert result['source']['storedSelectedPitchCount'] == 970
          assert result['source']['baselineDeterministicRenderedPitchCount'] == 967
          assert result['boundary']['primaryViolationCount'] == 0
          assert result['boundary']['unobservedPitchCount'] == 0
          assert result['boundary']['unobservedAttackCount'] == 0
          assert result['boundary']['promotedHarmonicGuardViolationCount'] == 0
          assert result['boundary']['retainedRenderedPitchLossCount'] == 0
          assert result['referenceFree'] is True
          assert result['newInferenceUsed'] is False
          assert result['paidModelRequired'] is False
          assert result['professionalReferenceUsed'] is False
          assert result['productionModified'] is False
          print(json.dumps(result['boundary'], sort_keys=True))
          PY
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = '7f72f8ed9b14af8bc93e95544195204d99c6bec1'
          if grep -E -n 'Professionalexample|professional-rhythm-complete|rhythm-professional-holdout-score|Songsterr|python -m modal|\.remote\(' \
            analyzer/v143_precision_polyphony_boundary.py \
            analyzer/test_v143_precision_polyphony_boundary.py \
            analyzer/v143_precision_polyphony_boundary_replay.py; then
            echo 'Forbidden paid/reference runtime token in boundary replay path' >&2
            exit 1
          fi
      - name: Persist boundary replay
        shell: bash
        run: |
          set -euo pipefail
          git add debug/v143-contextual-prune/precision-polyphony-boundary-replay.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record precision polyphony boundary CPU replay'
          for attempt in 1 2 3 4; do
            git fetch origin v143-contextual-prune-lobo
            git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
