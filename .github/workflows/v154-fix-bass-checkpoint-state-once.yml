name: V154 fix Bass checkpoint state once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v154-fix-bass-checkpoint-state-once.yml

permissions:
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 1
      - name: Correct stale Bass checkpoint lines
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/checkpoints/CURRENT_STATE.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('- Professional reference note data opened this continuation: **NO**.', '- Professional reference note data opened this continuation: **YES — Bass only, for explicit user-authorized research preservation; no scoring performed. Rhythm was already preserved. Lead remains unopened/unavailable.**')
          s=s.replace('2. Do not perform professional-reference scoring until the frozen Bass/Lead screenshot bytes (or an already normalized private reference payload with verifiable frozen identity) are accessible again.\n3. When private normalized references become accessible, freeze their normalized identity privately, then score this exact combined Guitar first and Bass second **exactly once** with `score_frontend_reference.py`.', '2. Do not perform professional-reference scoring yet. Bass is now preserved visually machine-readably but does not have frozen 16-step scorer timing; Lead screenshots still need to be re-provided and preserved.\n3. After Lead is preserved, run a dedicated reference-normalization pass that freezes exact scorer-ready `(measure, step, MIDI)` identities for Rhythm/Lead/Bass without consulting or altering the frozen generated candidate. Then score this exact combined Guitar first and Bass second **exactly once** with `score_frontend_reference.py`.')
          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/v154-fix-bass-checkpoint-state-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/checkpoints/CURRENT_STATE.md .github/workflows/v154-fix-bass-checkpoint-state-once.yml
          git commit -m "docs: align checkpoint with preserved Bass reference [skip ci]"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
