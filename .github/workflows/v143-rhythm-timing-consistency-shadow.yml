name: V143 Rhythm Timing Consistency Shadow

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-rhythm-timing-consistency-shadow.yml
      - analyzer/v143_rhythm_timing_consistency_shadow.py
      - analyzer/check_v143_rhythm_timing_consistency_shadow.py
      - analyzer/v143_reference_free_rhythm_pipeline.py

concurrency:
  group: v143-rhythm-timing-consistency-shadow
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  timing-shadow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run timing consistency proof
        shell: bash
        run: |
          set +e
          mkdir -p debug/v143-contextual-prune
          log=debug/v143-contextual-prune/rhythm-timing-consistency-shadow.log
          report=debug/v143-contextual-prune/rhythm-timing-consistency-shadow.json
          : > "$log"
          status=0
          python -m py_compile \
            analyzer/v143_rhythm_timing_consistency_shadow.py \
            analyzer/check_v143_rhythm_timing_consistency_shadow.py >> "$log" 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            PYTHONPATH=analyzer python analyzer/check_v143_rhythm_timing_consistency_shadow.py >> "$log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            if grep -E -n \
              'gomyway-professional-rhythm-reference|Professionalexample|professional-rhythm-complete|rhythm-professional-holdout-score' \
              analyzer/v143_rhythm_timing_consistency_shadow.py \
              analyzer/check_v143_rhythm_timing_consistency_shadow.py >> "$log" 2>&1; then
              echo "Forbidden scorer/reference token found" >> "$log"
              status=71
            else
              echo "TIMING_SHADOW_REFERENCE_TOKEN_SCAN=PASS" >> "$log"
            fi
          fi
          protected_blob=$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)
          expected_blob=7f72f8ed9b14af8bc93e95544195204d99c6bec1
          if [ "$protected_blob" != "$expected_blob" ]; then
            echo "PROTECTED_PIPELINE_BLOB_MISMATCH=$protected_blob expected=$expected_blob" >> "$log"
            status=72
          else
            echo "PROTECTED_PIPELINE_BLOB=PASS:$protected_blob" >> "$log"
          fi
          STATUS="$status" PROTECTED_BLOB="$protected_blob" EXPECTED_BLOB="$expected_blob" python - <<'PY'
          import json
          import os
          from pathlib import Path
          log_path=Path("debug/v143-contextual-prune/rhythm-timing-consistency-shadow.log")
          lines=log_path.read_text(encoding="utf-8",errors="replace").splitlines()
          status=int(os.environ["STATUS"])
          payload={
              "schemaVersion":1,
              "gate":"v143-rhythm-timing-consistency-shadow",
              "exitCode":status,
              "passed":status==0,
              "referenceTokenScanPassed":"TIMING_SHADOW_REFERENCE_TOKEN_SCAN=PASS" in lines,
              "protectedPipelineBlob":os.environ["PROTECTED_BLOB"],
              "expectedProtectedPipelineBlob":os.environ["EXPECTED_BLOB"],
              "protectedPipelineUnchanged":os.environ["PROTECTED_BLOB"]==os.environ["EXPECTED_BLOB"],
              "professionalReferenceUsed":False,
              "runtimeLabelsRequired":False,
              "productionModified":False,
              "logTail":lines[-120:],
          }
          Path("debug/v143-contextual-prune/rhythm-timing-consistency-shadow.json").write_text(json.dumps(payload,indent=2)+"\n",encoding="utf-8")
          PY
          exit 0
      - name: Commit timing shadow diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            debug/v143-contextual-prune/rhythm-timing-consistency-shadow.log \
            debug/v143-contextual-prune/rhythm-timing-consistency-shadow.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record V143 timing consistency shadow"
          git push origin HEAD:v143-contextual-prune-lobo
      - name: Enforce timing shadow
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("debug/v143-contextual-prune/rhythm-timing-consistency-shadow.json").read_text())
          required={
              "passed":True,
              "referenceTokenScanPassed":True,
              "protectedPipelineUnchanged":True,
              "professionalReferenceUsed":False,
              "runtimeLabelsRequired":False,
              "productionModified":False,
          }
          failed=[k for k,v in required.items() if data.get(k) is not v]
          if failed: raise SystemExit(f"V143 timing consistency shadow failed: {failed}")
          print("V143 rhythm timing consistency shadow passed")
          PY
