name: V143 Live Worker Startup Smoke

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-live-worker-startup-smoke.yml

concurrency:
  group: v143-live-worker-startup-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  worker-startup-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MODAL_ENVIRONMENT: main
      PYTHONUNBUFFERED: "1"
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deployment-matching Modal client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install 'modal==1.3.3' >/dev/null
          modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET" >/dev/null
          modal --version

      - name: Invoke exactly one no-audio dependency smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug/v143-contextual-prune/live-worker-startup-smoke
          timeout 360s python - <<'PY'
          import json
          import time
          from pathlib import Path
          import modal

          started = time.monotonic()
          safe = {
              'schemaVersion': 1,
              'gate': 'v143-live-worker-startup-smoke',
              'audioRead': False,
              'separatorModelExecuted': False,
              'referenceFacingInputs': 0,
              'referenceScoreCalls': 0,
              'qualityVerdictMade': False,
          }
          try:
              fn = modal.Function.from_name(
                  'dadrock-v143-ai-tab-live',
                  'rhythm_dependency_smoke',
                  environment_name='main',
              )
              result = fn.remote()
              safe.update({
                  'status': 'success',
                  'elapsedSeconds': round(time.monotonic() - started, 3),
                  'cudaAvailable': result.get('cudaAvailable'),
                  'deviceName': result.get('deviceName'),
                  'deterministicSeparatorSeed': result.get('deterministicSeparatorSeed'),
                  'referenceFree': result.get('referenceFree'),
                  'basicPitchImported': result.get('basicPitchImported'),
                  'deterministicProviderImported': result.get('deterministicProviderImported'),
              })
          except BaseException as error:
              safe.update({
                  'status': 'failed',
                  'elapsedSeconds': round(time.monotonic() - started, 3),
                  'errorClass': type(error).__name__,
                  'errorMessage': str(error)[:500],
              })
          Path('debug/v143-contextual-prune/live-worker-startup-smoke/summary.json').write_text(
              json.dumps(safe, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(safe, indent=2, sort_keys=True))
          if safe.get('status') != 'success':
              raise SystemExit(1)
          if safe.get('cudaAvailable') is not True or safe.get('deviceName') != 'NVIDIA L4':
              raise SystemExit(1)
          if safe.get('deterministicSeparatorSeed') != 143 or safe.get('referenceFree') is not True:
              raise SystemExit(1)
          PY

      - name: Preserve aggregate startup evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-live-worker-startup-smoke
          path: debug/v143-contextual-prune/live-worker-startup-smoke/summary.json
          if-no-files-found: warn
          retention-days: 7
