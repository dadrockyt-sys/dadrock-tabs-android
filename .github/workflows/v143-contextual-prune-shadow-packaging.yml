name: V143 Contextual Prune Shadow Packaging Gate

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-contextual-prune-shadow-packaging.yml
      - analyzer/check_v143_contextual_prune_shadow_packaging.py
      - analyzer/v143_contextual_prune_shadow_modal.py
      - analyzer/v143_ai_tab_gpu_worker.py
      - analyzer/v143_candidate_timing_adapter.py
      - analyzer/v143_reference_free_timing.py
      - analyzer/v143_contextual_prune_reference_free_carrier.py
      - analyzer/v143_contextual_prune_runtime.py
      - analyzer/v143_correlation_safe_fixed_count_reranker_freeze.py
      - analyzer/v143_intro_sequence_event_model.py
      - analyzer/v143_intro_learned_grid_event_selector.py
      - analyzer/v143_intro_learned_onset_spectral_set_model.py
      - analyzer/v143_intro_raw_attack_temporal_diagnostic.py
      - analyzer/v143_intro_repetition_recovery_event_selector.py
      - analyzer/v143_intro_supervised_temporal_assignment.py
      - analyzer/v143_deterministic_separator.py
      - analyzer/v143_seeded_separator.py
      - analyzer/v143_production_separator.py
      - analyzer/v143_seeded_audio_separator_cli.py

permissions:
  contents: write

jobs:
  packaging-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out shadow branch
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile packaging gate and shadow source
        run: |
          python -m py_compile \
            analyzer/check_v143_contextual_prune_shadow_packaging.py \
            analyzer/v143_contextual_prune_shadow_modal.py \
            analyzer/v143_ai_tab_gpu_worker.py

      - name: Run local dependency-closure gate
        shell: bash
        run: |
          set +e
          mkdir -p debug/v143-contextual-prune
          log=debug/v143-contextual-prune/shadow-packaging-action.log
          diagnostic=debug/v143-contextual-prune/shadow-packaging-action.json
          report=public/training/v143-musical-reconstruction-calibration/contextual-prune-shadow-packaging-report.json

          python analyzer/check_v143_contextual_prune_shadow_packaging.py > "$log" 2>&1
          status=$?

          STATUS="$status" \
          REPORT_EXISTS="$([ -s "$report" ] && echo true || echo false)" \
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          log_path = Path("debug/v143-contextual-prune/shadow-packaging-action.log")
          diagnostic_path = Path("debug/v143-contextual-prune/shadow-packaging-action.json")
          lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines()
          payload = {
              "schemaVersion": 1,
              "gate": "v143-contextual-prune-shadow-packaging-action",
              "exitCode": int(os.environ["STATUS"]),
              "reportExists": os.environ["REPORT_EXISTS"] == "true",
              "logTail": lines[-120:],
              "productionModified": False,
          }
          diagnostic_path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

          exit 0

      - name: Commit packaging report or diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            debug/v143-contextual-prune/shadow-packaging-action.log \
            debug/v143-contextual-prune/shadow-packaging-action.json

          report=public/training/v143-musical-reconstruction-calibration/contextual-prune-shadow-packaging-report.json
          if [ -s "$report" ]; then
            git add -- "$report"
          fi

          if git diff --cached --quiet; then
            echo "No shadow packaging artifacts changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record V143 contextual prune shadow packaging gate"
          git push origin HEAD:v143-contextual-prune-lobo

      - name: Enforce packaging gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("debug/v143-contextual-prune/shadow-packaging-action.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if int(data.get("exitCode", 1)) != 0:
              raise SystemExit("V143 contextual prune shadow packaging gate failed")
          if data.get("reportExists") is not True:
              raise SystemExit("V143 contextual prune shadow packaging report missing")
          print("V143 contextual prune shadow packaging gate passed")
          PY
