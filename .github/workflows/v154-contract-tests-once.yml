name: V154 reference-free contract tests once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - debug/v154-cpu-autonomous/test-arm.json

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0
      - name: Run synthetic reference-free tests
        run: |
          cd validation/v154_cpu_multitrack
          python test_reference_free_contract.py | tee /tmp/v154-contract-test.log
      - name: Persist test result and seal workflow
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          log = pathlib.Path('/tmp/v154-contract-test.log').read_text(encoding='utf-8')
          payload = {
              'schema': 'dadrock.tabs.v154.reference-free-contract-test-result.v1',
              'status': 'PASS' if 'PASS' in log else 'UNKNOWN',
              'referenceRead': False,
              'audioRead': False,
              'modalUsed': False,
              'cudaGpuUsed': False,
              'testLogSha256': hashlib.sha256(log.encode('utf-8')).hexdigest(),
              'sourceCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
          }
          out = pathlib.Path('debug/v154-cpu-autonomous/reference-free-contract-test-result.json')
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/v154-contract-tests-once.yml
          git config user.name "dadrockyt-sys"
          git config user.email "actions@github.com"
          git add debug/v154-cpu-autonomous/reference-free-contract-test-result.json .github/workflows/v154-contract-tests-once.yml
          git commit -m "v154: persist contract test result and seal workflow [skip ci]"
          git push origin HEAD:v143-contextual-prune-lobo
