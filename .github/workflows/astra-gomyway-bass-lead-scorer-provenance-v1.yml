name: Astra Go My Way Bass Lead Scorer Provenance Recovery V1

on:
  push:
    branches: [astra-work]
    paths:
      - 'astra_backend/evaluation/recover_gomyway_bass_lead_scorer_provenance_v1.py'
      - '.github/workflows/astra-gomyway-bass-lead-scorer-provenance-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-work
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Recover scorer provenance
        run: python astra_backend/evaluation/recover_gomyway_bass_lead_scorer_provenance_v1.py

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("gomyway_bass_lead_scorer_provenance_recovery_v1.json"))
          print("# Bass/Lead Scorer Provenance Recovery")
          for name,x in d["needleResults"].items():
              print(f"- {name}: git-history transitions={len(x['historyHits'])}, reachable content hits={len(d['reachableContentHits'][name])}")
              for hit in d["reachableContentHits"][name][:20]:
                  print(f"  - {hit['paths']} | blob={hit['blob']}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: astra-gomyway-bass-lead-scorer-provenance-v1
          path: gomyway_bass_lead_scorer_provenance_recovery_v1.json
          retention-days: 30
