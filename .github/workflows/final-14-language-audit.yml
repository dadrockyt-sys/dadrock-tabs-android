name: Final 14-language discovery audit

on:
  push:
    branches:
      - seo-clean-rss-feed-discovery
    paths:
      - '.github/scripts/final_14_language_audit_fixes.py'
      - '.github/workflows/final-14-language-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo-clean-rss-feed-discovery

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply final audit fixes
        run: python .github/scripts/final_14_language_audit_fixes.py

      - name: Verify diff
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Commit final audit fixes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/LanguageSelector.js app/songs/[slug]/SongPageClient.js app/coming-soon/ComingSoonClient.js app/api/rss/route.js
          git commit -m "Close final 14-language discovery gaps"
          git push origin seo-clean-rss-feed-discovery
