name: V168 Codespace PASS checkpoint

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v168-codespace-pass-checkpoint.yml

permissions:
  contents: write

jobs:
  append-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 1
      - name: Append Codespace PASS checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path
          payload = ""
          p = Path('docs/checkpoints/CURRENT_STATE.md')
          text = p.read_text()
          block = base64.b64decode(payload).decode()
          if '## 2026-09-01 continuation checkpoint — Codespace CPU environment PASS' not in text:
              p.write_text(text.rstrip() + '\n\n' + block)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/checkpoints/CURRENT_STATE.md
          git rm .github/workflows/v168-codespace-pass-checkpoint.yml
          git commit -m 'Checkpoint Codespace CPU environment PASS'
          git push origin HEAD:v143-contextual-prune-lobo
