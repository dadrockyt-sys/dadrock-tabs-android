name: Astra Go My Way V4-Origin Freeze Note Evidence V1

on:
  push:
    branches: [astra-work]
    paths:
      - 'astra_backend/evaluation/gomyway_v4_origin_freeze_note_evidence_v1.py'
      - '.github/workflows/astra-gomyway-v4-origin-freeze-note-evidence-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  freeze-note-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'scipy==1.11.4' soundfile torch onnxruntime
          python -m pip install 'basic-pitch==0.4.0'

      - uses: actions/download-artifact@v4
        with:
          name: gomyway-timing-origin-v4-diagnostic
          path: v4-origin
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37144194576

      - name: Verify frozen inputs
        run: |
          set -euo pipefail
          test "$(git hash-object public/gomywayfullaitest.m4a)" = "5e34fb55fbd011c55b56bc40cc5d062735b3fcd0"
          test -f v4-origin/gomyway-professional-timing-map-v4-origin-diagnostic.json

      - name: Decode source
        run: ffmpeg -hide_banner -loglevel error -y -i public/gomywayfullaitest.m4a -ar 44100 -ac 2 -c:a pcm_f32le gomywayfullaitest.wav

      - name: Download and verify BS-Roformer
        run: |
          set -euo pipefail
          mkdir -p models/bs-roformer
          python - <<'PY'
          from pathlib import Path
          import hashlib, urllib.request
          p=Path("models/bs-roformer/bs_roformer_sw_6stem_fp16.onnx")
          urllib.request.urlretrieve("https://huggingface.co/elicwhite/bs-roformer-sw-6stem-onnx/resolve/main/bs_roformer_sw_6stem_fp16.onnx",p)
          expected="d3d2bac77a7023282cb5f35a5807179e34076b60589867b572275f1a8ec36444"
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          if actual != expected: raise SystemExit(actual)
          PY

      - name: Freeze note evidence
        env:
          PYTHONPATH: ${{ github.workspace }}/astra_backend:${{ github.workspace }}/astra_backend/evaluation
        run: |
          set -euo pipefail
          python astra_backend/evaluation/gomyway_v4_origin_freeze_note_evidence_v1.py             --audio-source public/gomywayfullaitest.m4a             --audio-wav gomywayfullaitest.wav             --timing-map v4-origin/gomyway-professional-timing-map-v4-origin-diagnostic.json             --model models/bs-roformer/bs_roformer_sw_6stem_fp16.onnx             --output-json gomyway-v4-origin-frozen-note-evidence-v1.json
          sha256sum gomyway-v4-origin-frozen-note-evidence-v1.json > gomyway-v4-origin-frozen-note-evidence-v1.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: gomyway-v4-origin-frozen-note-evidence-v1
          path: |
            gomyway-v4-origin-frozen-note-evidence-v1.json
            gomyway-v4-origin-frozen-note-evidence-v1.sha256
          retention-days: 30

      - if: always()
        run: rm -rf models/bs-roformer gomywayfullaitest.wav
