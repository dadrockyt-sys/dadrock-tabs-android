name: V168 SplitMySong context mismatch checkpoint

"on":
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v168-splitmysong-context-mismatch-checkpoint.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0
      - name: Append checkpoint and self-delete
        shell: bash
        env:
          SECTION_B64: 
        run: |
          set -euo pipefail
          BRANCH=v143-contextual-prune-lobo
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"
          test "$(grep -c 'historical Demucs context mismatch caught before inference' docs/checkpoints/CURRENT_STATE.md || true)" = "0"
          printf '%s' "$SECTION_B64" | base64 -d >> docs/checkpoints/CURRENT_STATE.md
          rm .github/workflows/v168-splitmysong-context-mismatch-checkpoint.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/checkpoints/CURRENT_STATE.md .github/workflows/v168-splitmysong-context-mismatch-checkpoint.yml
          git commit -m 'Checkpoint historical context mismatch'
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
