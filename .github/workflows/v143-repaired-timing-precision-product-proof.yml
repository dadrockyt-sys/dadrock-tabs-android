name: V143 Repaired Timing Precision Product Proof

on:
  workflow_dispatch:
  push:
    branches: [v143-contextual-prune-lobo]
    paths:
      - .github/workflows/v143-repaired-timing-precision-product-proof.yml
      - analyzer/v143_repaired_timing_precision_candidate_product_modal.py
      - analyzer/v143_precision_sustain_promotion.py
      - analyzer/check_v143_precision_sustain_onset_handoff.py
      - analyzer/v143_precision_promoted_harmonic_guard.py
      - analyzer/check_v143_precision_promoted_harmonic_guard.py
      - analyzer/v143_contextual_prune_precision_candidate_events.py
      - debug/v143-contextual-prune/precision-polyphonic-expansion-audit.json
      - debug/v143-contextual-prune/precision-promoted-harmonic-guard-proof.json
      - validation/rhythm_holdout/prepare_repaired_timing_precision_candidate_freeze_payload.mjs
      - validation/rhythm_holdout/check_v143_precision_dual_timing_projection.mjs
      - lib/v143RenderContract.js

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and run isolated safety checkers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet numpy scipy
          python -m py_compile \
            analyzer/v143_repaired_timing_precision_candidate_product_modal.py \
            analyzer/v143_precision_sustain_promotion.py \
            analyzer/check_v143_precision_sustain_onset_handoff.py \
            analyzer/v143_precision_promoted_harmonic_guard.py \
            analyzer/check_v143_precision_promoted_harmonic_guard.py
          node --check validation/rhythm_holdout/prepare_repaired_timing_precision_candidate_freeze_payload.mjs
          node --check validation/rhythm_holdout/check_v143_precision_dual_timing_projection.mjs
          PYTHONPATH=analyzer python analyzer/check_v143_reference_free_beat_grid_repair.py
          PYTHONPATH=analyzer python analyzer/check_v143_contextual_prune_precision_shadow.py
          PYTHONPATH=analyzer python analyzer/check_v143_contextual_prune_precision_primary_adapter.py
          PYTHONPATH=analyzer python analyzer/check_v143_precision_sustain_onset_handoff.py
          PYTHONPATH=analyzer python analyzer/check_v143_precision_promoted_harmonic_guard.py
          node validation/rhythm_holdout/check_v143_precision_dual_timing_projection.mjs
      - name: Enforce anti-leakage and protected runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          if grep -E -n 'Professionalexample|professional-rhythm-complete|rhythm-professional-holdout-score|Songsterr|Are You Gonna Go My Way|Lenny Kravitz|Craig Ross' \
            analyzer/v143_repaired_timing_precision_candidate_product_modal.py \
            analyzer/v143_precision_sustain_promotion.py \
            analyzer/check_v143_precision_sustain_onset_handoff.py \
            analyzer/v143_precision_promoted_harmonic_guard.py \
            validation/rhythm_holdout/prepare_repaired_timing_precision_candidate_freeze_payload.mjs \
            validation/rhythm_holdout/check_v143_precision_dual_timing_projection.mjs; then
            echo 'Forbidden scorer/source token in repaired-timing product path' >&2
            exit 1
          fi
          grep -q 'measureRangeDerivedFromAudio' analyzer/v143_repaired_timing_precision_candidate_product_modal.py
          grep -q 'repairedIntervalOutliersZero' validation/rhythm_holdout/prepare_repaired_timing_precision_candidate_freeze_payload.mjs
          grep -q 'physicalOnsetPreserved' analyzer/v143_precision_sustain_promotion.py
          grep -q 'promotedHarmonicGuardDiagnostics' analyzer/v143_repaired_timing_precision_candidate_product_modal.py
          grep -q 'suppressedStrongestHarmonicCount' analyzer/v143_precision_promoted_harmonic_guard.py
          grep -q 'renderProjectionIndependentOfPhysicalOnset' validation/rhythm_holdout/check_v143_precision_dual_timing_projection.mjs
