name: V143 Frozen Evidence Harmonic Guard Professional Score

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - debug/v143-contextual-prune/RUN_FROZEN_EVIDENCE_HARMONIC_GUARD_SCORE_ONCE

permissions:
  actions: read
  contents: write

concurrency:
  group: v143-frozen-evidence-harmonic-guard-professional-score
  cancel-in-progress: false

jobs:
  score:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate locked corrected freeze before reference access
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          marker='debug/v143-contextual-prune/RUN_FROZEN_EVIDENCE_HARMONIC_GUARD_SCORE_ONCE'
          lease='debug/v143-contextual-prune/harmonic-guard-frozen-evidence-professional-score-lease.json'
          proof='debug/v143-contextual-prune/harmonic-guard-frozen-evidence-preholdout-proof.json'
          expected='07b12f807295219d39198641de3a9e170c684de60d274befd2b6f6f50af9588c'
          test -f "$marker"
          test -s "$proof"
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = '7f72f8ed9b14af8bc93e95544195204d99c6bec1'
          test "$(sha256sum public/gomywayfullaitest.m4a | awk '{print $1}')" = '215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f'
          git fetch origin v143-contextual-prune-lobo
          if git show "origin/v143-contextual-prune-lobo:$lease" >/tmp/existing-score-lease.json 2>/dev/null; then
            echo 'Professional score authorization was already consumed; refusing duplicate score.' >&2
            cat /tmp/existing-score-lease.json >&2
            exit 41
          fi
          mkdir -p .score/download .score/current-freeze .score/results
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/32751771832/artifacts" > .score/results/preholdout-artifacts.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('debug/v143-contextual-prune/harmonic-guard-frozen-evidence-preholdout-proof.json').read_text())
          artifacts=json.loads(Path('.score/results/preholdout-artifacts.json').read_text()).get('artifacts') or []
          matching=[a for a in artifacts if a.get('name')=='v143-frozen-evidence-harmonic-guard-preholdout']
          expected='07b12f807295219d39198641de3a9e170c684de60d274befd2b6f6f50af9588c'
          checks={
            'proofPassed':p.get('passed') is True,
            'proofRun':str(p.get('workflowRunId'))=='32751771832',
            'sourceCommit':p.get('sourceCommit')=='315f9525ff747f2b42e5020c9579713f5f962d7b',
            'eventCount889':int(p.get('eventCount') or 0)==889,
            'measureCount113':int(p.get('uniqueMeasureCount') or 0)==113,
            'frozenHashExact':p.get('frozenEventSha256')==expected,
            'pdfHashExact':p.get('pdfEventSha256')==expected,
            'pdfFidelityExact':p.get('pdfEventFidelity')==1.0,
            'referenceStillSealed':p.get('referenceOpened') is False,
            'professionalScoreNotRun':p.get('professionalScoreRun') is False,
            'modalUnused':p.get('modalUsed') is False,
            'productionUnmodified':p.get('productionModified') is False,
            'artifactUnique':len(matching)==1,
            'artifactAvailable':len(matching)==1 and matching[0].get('expired') is False,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('pre-reference proof gate failed: '+', '.join(failed))
          a=matching[0]
          out={'checks':checks,'failedChecks':failed,'passed':True,'artifactId':a.get('id'),'artifactDigest':a.get('digest'),'artifactName':a.get('name')}
          Path('.score/results/pre-reference-proof-gate.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

          gh run download 32751771832 --repo "$GITHUB_REPOSITORY" --name v143-frozen-evidence-harmonic-guard-preholdout --dir .score/download
          manifest=$(find .score/download -type f -name rhythm-freeze-manifest.json -print -quit)
          test -n "$manifest"
          freeze_root=$(dirname "$manifest")
          cp -a "$freeze_root"/. .score/current-freeze/
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'validation/rhythm_holdout')
          import score_rhythm_holdout as scorer
          manifest,events,_=scorer.validate_pre_reference(Path('.score/current-freeze'))
          expected='07b12f807295219d39198641de3a9e170c684de60d274befd2b6f6f50af9588c'
          assert manifest['eventSha256']==expected
          assert manifest['pdfEventSha256']==expected
          assert float(manifest['pdfEventFidelity'])==1.0
          assert manifest['sourceAudioSha256']=='215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f'
          assert manifest['sourceCommit']=='315f9525ff747f2b42e5020c9579713f5f962d7b'
          assert len(events)==889
          assert int(manifest['uniqueMeasureCount'])==113
          print('PRE-REFERENCE CORRECTED LOCKED FREEZE GATE GREEN')
          PY

      - name: Consume the one professional-score authorization
        shell: bash
        run: |
          set -euo pipefail
          lease='debug/v143-contextual-prune/harmonic-guard-frozen-evidence-professional-score-lease.json'
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('debug/v143-contextual-prune/harmonic-guard-frozen-evidence-professional-score-lease.json').write_text(json.dumps({
            'schemaVersion':1,
            'state':'authorization-consumed-before-reference-open',
            'workflowRunId':os.environ.get('GITHUB_RUN_ID'),
            'triggerSha':os.environ.get('GITHUB_SHA'),
            'preholdoutRunId':'32751771832',
            'frozenEventSha256':'07b12f807295219d39198641de3a9e170c684de60d274befd2b6f6f50af9588c',
            'professionalReferenceOpened':False,
            'professionalScoreRun':False,
          },indent=2,sort_keys=True)+'\n')
          PY
          git add "$lease"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Consume frozen-evidence Rhythm professional score authorization'
          for attempt in 1 2 3 4; do
            git fetch origin v143-contextual-prune-lobo
            git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1

      - name: Open scorer-only structured human source and build exact V2 reference
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .score/source validation/rhythm_holdout/reference .score/results
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9502117311/zip" -o .score/source.zip
          echo "380165b5eb160cc8a35196192032c7d50224402880e453de448eed906c3b7dcb  .score/source.zip" | sha256sum -c -
          unzip -q .score/source.zip -d .score/source
          echo "18cdb4f8afb49562aac5b600730384636070d6ca8650823e759276a81ee4afc8  .score/source/rhythm-track.json" | sha256sum -c -
          python - <<'PY'
          from fractions import Fraction
          from pathlib import Path
          import hashlib, json
          src=json.loads(Path('.score/source/rhythm-track.json').read_text())
          assert src['songId']==243 and src['revisionId']==7868948 and len(src['measures'])==113
          assert src['name']=='Craig Ross | 1953 Gibson Les Paul Goldtop | Rhythm Guitar'
          tuning=src['tuning']; assert tuning==[64,59,55,50,45,40]
          measures=[]; onset_count=note_count=populated=0
          for mn,m in enumerate(src['measures'],1):
              by={}; section=(m.get('marker') or {}).get('text') if isinstance(m.get('marker'),dict) else None
              for voice in m.get('voices') or []:
                  pos=Fraction(0,1)
                  for beat in voice.get('beats') or []:
                      step=max(0,min(15,int(round(float(pos*16)))))
                      for n in beat.get('notes') or []:
                          if not isinstance(n,dict) or n.get('rest') or n.get('dead') or n.get('tie'): continue
                          s=n.get('string'); f=n.get('fret')
                          if isinstance(s,int) and isinstance(f,int) and 0<=s<=5 and 0<=f<=36:
                              by.setdefault(step,set()).add((s,f,int(tuning[s])+f))
                      a,d=beat.get('duration') or [1,4]; pos += Fraction(int(a),int(d))
              events=[]
              for step in sorted(by):
                  notes=[{'stringIndex':s,'fret':f,'midi':midi} for s,f,midi in sorted(by[step])]
                  if notes:
                      events.append({'step':step,'notes':notes}); onset_count+=1; note_count+=len(notes)
              if events: populated+=1
              row={'measure':mn,'events':events}
              if section: row['section']=section
              measures.append(row)
          assert (onset_count,note_count,populated)==(603,946,104),(onset_count,note_count,populated)
          ref={
            'schemaVersion':1,'instrument':'rhythm','holdout':True,'completeReference':True,
            'transcribedFromCompleteSource':True,
            'source':{'kind':'professional-human-tab','title':'Are You Gonna Go My Way','artist':'Lenny Kravitz',
              'provenance':'Exact scorer-only structured extraction of immutable human-written revision 7868948 corresponding to Professionalexample.jpg',
              'pageCount':8,'sourceSha256':'aca2da3e8d551b2fd82b4ab3ecafa0c8932d6c0a27b54b6213ffc990ca08a9a9','completeSource':True,
              'sourceRevisionId':7868948,'structuredSourceSha256':'18cdb4f8afb49562aac5b600730384636070d6ca8650823e759276a81ee4afc8'},
            'measureRange':{'firstMeasure':1,'lastMeasure':113,'measureCount':113},'tempoBpm':129,
            'timeSignature':{'beats':4,'noteValue':4},'stepsPerMeasure':16,'tuning':['E4','B3','G3','D3','A2','E2'],'measures':measures}
          p=Path('validation/rhythm_holdout/reference/professional-rhythm-structured-source-v2.json')
          p.write_text(json.dumps(ref,indent=2,sort_keys=True)+'\n')
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest=='18fd868ae960dfcdd1ffb0110f1a9dfd8acc2ffeb46e247d1116cd54291526ac',digest
          Path('.score/results/reference-build.json').write_text(json.dumps({
            'referenceJsonSha256':digest,'playableOnsetCount':onset_count,'playableNoteCount':note_count,
            'populatedMeasureCount':populated,'measureCount':113,'structuredSourceSha256':'18cdb4f8afb49562aac5b600730384636070d6ca8650823e759276a81ee4afc8',
            'professionalSourceSha256':'aca2da3e8d551b2fd82b4ab3ecafa0c8932d6c0a27b54b6213ffc990ca08a9a9'},indent=2,sort_keys=True)+'\n')
          PY

      - name: Verify completeness and run the single 0.99 professional score
        shell: bash
        run: |
          set -euo pipefail
          REF=validation/rhythm_holdout/reference/professional-rhythm-structured-source-v2.json
          FREEZE=.score/current-freeze
          python validation/rhythm_holdout/verify_reference_completeness.py "$FREEZE" "$REF" --output .score/results/rhythm-reference-completeness.json
          set +e
          python validation/rhythm_holdout/score_rhythm_holdout.py "$FREEZE" "$REF" --output .score/results/rhythm-professional-holdout-score.json --minimum 0.99
          rc=$?
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
          echo "$rc" > .score/results/scorer-return-code.txt

      - name: Commit score diagnostic, close scorer, and consume trigger marker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, os
          from pathlib import Path
          b=json.loads(Path('.score/results/reference-build.json').read_text())
          c=json.loads(Path('.score/results/rhythm-reference-completeness.json').read_text())
          s=json.loads(Path('.score/results/rhythm-professional-holdout-score.json').read_text())
          g=json.loads(Path('.score/results/pre-reference-proof-gate.json').read_text())
          br=s.get('criticalMismatchBreakdown') or {}; mc=(s.get('metrics') or {}).get('measureCoverage') or {}
          protected=subprocess.check_output(['git','hash-object','analyzer/v143_reference_free_rhythm_pipeline.py'],text=True).strip()
          expected='07b12f807295219d39198641de3a9e170c684de60d274befd2b6f6f50af9588c'
          out={
            'schemaVersion':1,'gate':'v143-frozen-evidence-harmonic-guard-professional-score',
            'runId':int(os.environ['GITHUB_RUN_ID']),'runAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'triggerSha':os.environ['GITHUB_SHA'],
            'preholdoutRunId':32751771832,'preholdoutArtifactId':g.get('artifactId'),'preholdoutArtifactDigest':g.get('artifactDigest'),
            'frozenEventSha256':s.get('frozenEventSha256'),'pdfEventSha256':s.get('pdfEventSha256'),'pdfEventFidelity':s.get('pdfEventFidelity'),
            'generatedNoteCount':s.get('generatedEventCount'),'referenceNoteCount':s.get('referenceNoteCount'),'referencePlayableOnsetCount':b.get('playableOnsetCount'),
            'referenceMeasureCount':b.get('measureCount'),'referencePopulatedMeasureCount':b.get('populatedMeasureCount'),'referenceJsonSha256':b.get('referenceJsonSha256'),
            'structuredHumanSourceSha256':b.get('structuredSourceSha256'),'professionalSourceSha256':b.get('professionalSourceSha256'),
            'gatedMetrics':s.get('gatedMetrics'),'criticalMismatchCount':s.get('criticalMismatchCount'),'grossUnmatchedGeneratedNotes':br.get('grossUnmatchedGeneratedNotes'),
            'grossUnmatchedReferenceNotes':br.get('grossUnmatchedReferenceNotes'),'missingReferenceMeasures':mc.get('missingReferenceMeasures'),
            'near100ProfessionalGatePassed':s.get('near100ProfessionalGatePassed'),'rhythmComplete':s.get('rhythmComplete'),
            'scorerReturnCode':int(Path('.score/results/scorer-return-code.txt').read_text()),
            'referenceCompletenessPassed':c.get('passed'),'referenceOpenedOnlyAfterFreezeValidation':c.get('referenceOpenedOnlyAfterFreezeValidation'),
            'professionalReferenceUsedByAnalyzer':False,'referenceRuntimeInputUsed':False,'runtimeLabelsRequired':False,
            'protectedPipelineBlob':protected,'protectedPipelineUnchanged':protected=='7f72f8ed9b14af8bc93e95544195204d99c6bec1',
            'modalUsed':False,'productionModified':False,'productionPromotionAuthorized':False,'referencePayloadCommitted':False,
          }
          assert out['protectedPipelineUnchanged'] and out['referenceCompletenessPassed'] and out['pdfEventFidelity']==1.0
          assert out['referenceJsonSha256']=='18fd868ae960dfcdd1ffb0110f1a9dfd8acc2ffeb46e247d1116cd54291526ac'
          assert out['frozenEventSha256']==expected and out['pdfEventSha256']==expected
          Path('debug/v143-contextual-prune/harmonic-guard-frozen-evidence-professional-score.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          lease_path=Path('debug/v143-contextual-prune/harmonic-guard-frozen-evidence-professional-score-lease.json')
          lease=json.loads(lease_path.read_text())
          lease.update({'state':'score-completed','professionalReferenceOpened':True,'professionalScoreRun':True,'scoreDiagnostic':'debug/v143-contextual-prune/harmonic-guard-frozen-evidence-professional-score.json'})
          lease_path.write_text(json.dumps(lease,indent=2,sort_keys=True)+'\n')
          PY
          rm -f validation/rhythm_holdout/reference/professional-rhythm-structured-source-v2.json
          git add debug/v143-contextual-prune/harmonic-guard-frozen-evidence-professional-score.json \
                  debug/v143-contextual-prune/harmonic-guard-frozen-evidence-professional-score-lease.json
          git rm -- debug/v143-contextual-prune/RUN_FROZEN_EVIDENCE_HARMONIC_GUARD_SCORE_ONCE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record frozen-evidence Rhythm professional score'
          for attempt in 1 2 3 4 5; do
            git fetch origin v143-contextual-prune-lobo
            git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v143-frozen-evidence-harmonic-guard-professional-score
          path: |
            .score/results/pre-reference-proof-gate.json
            .score/results/reference-build.json
            .score/results/rhythm-reference-completeness.json
            .score/results/rhythm-professional-holdout-score.json
            .score/results/scorer-return-code.txt
            debug/v143-contextual-prune/harmonic-guard-frozen-evidence-professional-score.json
          retention-days: 7
