name: Astra S0 Transcription Reliability Observability V1

on:
  push:
    branches: [astra-work]
    paths:
      - '.github/workflows/astra-s0-transcription-reliability-observability-v1.yml'
      - 'astra_backend/evaluation/evaluate_s0_transcription_reliability_observability_v1.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-s0-transcription-reliability-observability-v1
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-work
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: dadrockyt-sys/dadrock-tabs-private-fixtures
          token: ${{ secrets.S0_FIXTURE_TOKEN }}
          path: .private-s0-fixtures
          fetch-depth: 1

      - name: Prepare fixtures
        run: |
          set -euo pipefail
          rm -rf s0_sources
          cp -R .private-s0-fixtures/s0_sources ./s0_sources
          test "$(find s0_sources -maxdepth 1 -type f | wc -l)" -eq 16

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'scipy==1.11.4' soundfile torch onnxruntime
          python -m pip install 'basic-pitch==0.4.0'
          python - <<'PY'
          import numpy
          assert numpy.__version__ == '1.26.4'
          PY

      - name: Download and verify BS-Roformer
        run: |
          set -euo pipefail
          mkdir -p models/bs-roformer
          python - <<'PY'
          from pathlib import Path
          import hashlib, urllib.request
          p=Path("models/bs-roformer/bs_roformer_sw_6stem_fp16.onnx")
          urllib.request.urlretrieve(
              "https://huggingface.co/elicwhite/bs-roformer-sw-6stem-onnx/resolve/main/bs_roformer_sw_6stem_fp16.onnx",
              p,
          )
          expected="d3d2bac77a7023282cb5f35a5807179e34076b60589867b572275f1a8ec36444"
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(actual)
          PY

      - name: Compile
        run: |
          python -m py_compile             astra_backend/evaluation/build_s0_synthetic_mixtures_v1.py             astra_backend/evaluation/bs_roformer_sw_6stem_adapter_v1.py             astra_backend/evaluation/stem_bleed_diagnostics_v1.py             astra_backend/evaluation/stem_bleed_cleanup_v1.py             astra_backend/evaluation/pretrained_note_front_end_v1.py             astra_backend/evaluation/score_note_onsets.py             astra_backend/evaluation/evaluate_s0_transcription_failure_attribution_v1.py             astra_backend/evaluation/evaluate_s0_transcription_reliability_observability_v1.py

      - name: Build frozen S0
        run: |
          rm -rf s0_generated
          python astra_backend/evaluation/build_s0_synthetic_mixtures_v1.py             --source-dir s0_sources             --output-dir s0_generated

      - name: Run observability diagnostic
        run: |
          PYTHONPATH=astra_backend:astra_backend/evaluation           python astra_backend/evaluation/evaluate_s0_transcription_reliability_observability_v1.py             --s0-root s0_generated             --model models/bs-roformer/bs_roformer_sw_6stem_fp16.onnx             --output-json s0_transcription_reliability_observability_v1.json

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("s0_transcription_reliability_observability_v1.json"))
          print("# S0 Transcription Reliability Observability V1")
          print(f"- Present probes: **{d['presentTargetProbeCount']}**")
          print(f"- Absent probes: **{d['absentTargetProbeCount']}**")
          print("- Threshold fit performed: **False**")
          print("## Strongest descriptive associations by |Spearman|")
          for r in d["rankedByAbsoluteSpearmanDescriptiveOnly"][:8]:
              print(
                  f"- {r['feature']}: Spearman={r['spearmanWithTranscriptionAgreementF1']:.3f}, "
                  f"Pearson={r['pearsonWithTranscriptionAgreementF1']:.3f}"
              )
          print("## Absent-target event observations")
          for r in d["absentTargetObservations"]:
              e=r["transcriberDiagnostics"]
              print(f"- {r['id']} {r['target']}: events={e['eventCount']}, density={e['eventDensityPerSecond']:.2f}/s")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: astra-s0-transcription-reliability-observability-v1
          path: s0_transcription_reliability_observability_v1.json
          retention-days: 30

      - if: always()
        run: rm -rf s0_sources s0_generated .private-s0-fixtures models/bs-roformer
