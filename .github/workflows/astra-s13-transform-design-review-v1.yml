name: Astra S13 transform design review V1

on:
  push:
    branches: [astra-work]
    paths:
      - 'astra_backend/synthetic/s13_transform_design_review_v1.py'
      - 'astra_backend/synthetic/test_s13_transform_design_review_v1.py'
      - '.github/workflows/astra-s13-transform-design-review-v1.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'
      - name: Install pinned runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Run focused model-free review
        env:
          PYTHONPATH: astra_backend
        run: |
          pytest -q astra_backend/synthetic/test_s13_transform_design_review_v1.py
          python -m synthetic.s13_transform_design_review_v1 --out s13-transform-review-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-s13-transform-design-review-v1
          path: s13-transform-review-evidence.json
