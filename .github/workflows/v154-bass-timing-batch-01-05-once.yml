name: V154 Bass timing batch 01-05 once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v154-bass-timing-batch-01-05-once.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0
      - name: Validate and freeze source-local Bass attacks pages 01-05
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          skeleton_path = Path('research/v154-professional-references/bass-timing-normalization-skeleton.json')
          out_path = Path('research/v154-professional-references/scorer-ready/bass-source-local-timing-pages-01-05.json')
          receipt_path = Path('research/v154-professional-references/scorer-ready/bass-source-local-timing-pages-01-05-receipt.json')
          skeleton_bytes = skeleton_path.read_bytes()
          expected_skeleton_sha = 'a8e1d123f8a19e69d9c160d78aea7637b5a2012232b23e1f1ddff051e9bc40b3'
          skeleton = json.loads(skeleton_bytes)
          if skeleton.get('sourceSha256') != expected_skeleton_sha:
              raise SystemExit('Bass skeleton source identity mismatch')

          steps = {
            1:[],2:[],3:[],4:[],5:[],6:[],
            7:[6,8,12],
            8:[8,9,10,12,13],
            9:[0,4,7,8,10,14],
            10:[0,4,7,8,10,12,14],
            11:[0,4,7,8,10,14],
            12:[0,3,4,7,8,10,12,13,14],
            13:[0,4,7,8,10,12,14],
            14:[0,4,8,10,12,14],
            15:[0,4,8,10],
            16:[0,4,7,8,10,12,14],
            17:[0,4,8,14],
            18:[0,4,8,12,14],
            19:[0,4,8,12,14],
            20:[0,4,7,8,10,12,14],
            21:[0,4,8,12,14],
            22:[0,4,8,12,14],
            23:[0,4,8,12,14],
            24:[0,4,8,12,14],
            25:[0,4,8,12,14],
            26:[0,4,8,10,12,14],
            27:[0,4,8,12,14],
            28:[0,4,7,10],
            29:[0,4,8,10,12,14],
            30:[0,4,8,10,12,14],
            31:[0,4,8,10,12,14],
            32:[0,4,8,10,12,14],
            33:[0,2,4,6,8,10,12,14],
          }
          page_for = {}
          for a,b,p in [(1,12,1),(13,18,2),(19,23,3),(24,28,4),(29,33,5)]:
              for m in range(a,b+1): page_for[m]=p
          source_files = {
            1:'1000120387.jpg',2:'1000120388.jpg',3:'1000120389.jpg',4:'1000120390.jpg',5:'1000120391.jpg'
          }
          by_measure = {int(m['measure']):m for m in skeleton['measures']}
          rows=[]
          attack_total=0
          dead_total=0
          continuation_total=0
          for m in range(1,34):
              mo=by_measure[m]
              attack_events=[e for e in mo.get('events',[]) if e.get('k') in ('N','X')]
              continuations=[e for e in mo.get('events',[]) if e.get('k') == 'C']
              if len(attack_events) != len(steps[m]):
                  raise SystemExit(f'm{m}: attack count {len(attack_events)} != source steps {len(steps[m])}')
              if steps[m] != sorted(steps[m]) or len(steps[m]) != len(set(steps[m])):
                  raise SystemExit(f'm{m}: steps not strictly ordered/unique')
              if any(not (0 <= s <= 15) for s in steps[m]):
                  raise SystemExit(f'm{m}: out-of-range source step')
              events=[]
              for e,s in zip(attack_events,steps[m]):
                  kind='pitched' if e['k']=='N' else 'dead-note'
                  if kind=='dead-note': dead_total += 1
                  events.append({'visualOrder':e['o'],'kind':kind,'midi':e.get('m'),'sourceLocalStep':s})
              rows.append({
                  'measure':m,'timeSignature':mo.get('timeSignature'),'sourcePage':page_for[m],
                  'sourceFile':source_files[page_for[m]],'excludeFromScoring':bool(mo.get('excludeFromScoring',False)),
                  'attacks':events,'continuationOnlyCount':len(continuations)
              })
              attack_total += len(events)
              continuation_total += len(continuations)

          payload={
            'schema':'dadrock.tabs.v154.bass-source-local-timing-batch.v1',
            'part':'bass','measureRange':{'first':1,'last':33,'count':33},
            'sourceAuthority':'Canonical professional Bass notation pages; timing decoded from explicit rests, stems, beams, dots, and ties. Generated candidate was not read.',
            'canonicalPageSetSha256':'abd1748066966ceb93fe40bf8c8df3168f6c871ba006e44d28f8840184e3cde3',
            'skeletonSourceSha256':expected_skeleton_sha,
            'timingResolution':'16th-note source-local steps',
            'measures':rows,
            'policy':{'generatedCandidateRead':False,'scoringPerformed':False,'generatedCandidateModified':False,'humanCandidateCorrection':False,'gpuUsed':False,'mainOrProductionModified':False}
          }
          out_bytes=(json.dumps(payload,indent=2,sort_keys=True)+'\n').encode()
          out_path.parent.mkdir(parents=True,exist_ok=True)
          out_path.write_bytes(out_bytes)
          receipt={
            'schema':'dadrock.tabs.v154.bass-source-local-timing-batch-receipt.v1',
            'outputPath':str(out_path),'outputSha256':hashlib.sha256(out_bytes).hexdigest(),
            'measureCount':33,'attackCount':attack_total,'deadNoteAttackCount':dead_total,
            'continuationOnlyCount':continuation_total,'sourcePages':[1,2,3,4,5],
            'sourceFiles':[source_files[i] for i in range(1,6)],
            'countAndOrderValidation':'PASS','generatedCandidateRead':False,'scoreCalls':0,'gpuUsed':False,'mainOrProductionModified':False
          }
          receipt_path.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
      - name: Commit batch and seal workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dadrock-v154-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/v154-professional-references/scorer-ready/bass-source-local-timing-pages-01-05.json
          git add research/v154-professional-references/scorer-ready/bass-source-local-timing-pages-01-05-receipt.json
          git rm .github/workflows/v154-bass-timing-batch-01-05-once.yml
          git commit -m "v154: freeze Bass timing pages 01-05"
          git push origin HEAD:v143-contextual-prune-lobo
