name: Astra V13 active non-onset mixture preflight

on:
  push:
    branches: [astra-work]
    paths:
      - 'docs/astra/V13_PREFLIGHT_LAUNCH_V1.json'

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'
      - name: Verify project authorization and source pins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          blob=lambda p: subprocess.check_output(['git','hash-object',p],text=True).strip()
          a=json.load(open('docs/astra/V13_PROJECT_AUTHORIZATION_V1.json'))
          l=json.load(open('docs/astra/V13_PREFLIGHT_LAUNCH_V1.json'))
          assert a['schema']=='astra-v13-project-authorization-v1'
          assert a['userInstruction']=='I authorize'
          assert a['authorizationScope']['optimizerSteps']==0
          assert a['authorizationScope']['modelInference'] is False
          assert l['schema']=='astra-v13-preflight-launch-v1'
          assert l['status']=='armed-model-free-preflight-only'
          assert l['optimizerSteps']==0 and l['modelInference'] is False
          assert l['waveformRendering'] is False
          for k,p in l['sourcePaths'].items():
              assert l['sourceGitBlobs'][k]==blob(p),(k,p,l['sourceGitBlobs'][k],blob(p))
          PY
      - name: Install exact CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          python -m pip check
      - name: Run pure V13 tests
        run: |
          PYTHONPATH=.:astra_backend python astra_backend/synthetic/test_v13_contract_validator_v1.py
          PYTHONPATH=.:astra_backend python astra_backend/synthetic/test_v13_active_nononset_mixture_v1.py
      - name: Validate frozen V13 contract and static allocation
        run: |
          mkdir -p /tmp/v13-preflight
          PYTHONPATH=.:astra_backend python astra_backend/synthetic/v13_contract_validator_v1.py             --contract docs/astra/V13_ACTIVE_NONONSET_MIXTURE_CONTRACT_V1.json             > /tmp/v13-preflight/contract-validation.json
          PYTHONPATH=.:astra_backend python astra_backend/synthetic/v13_active_nononset_mixture_v1.py static             --out /tmp/v13-preflight/static-summary.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/v13-preflight/contract-validation.json'))
          s=json.load(open('/tmp/v13-preflight/static-summary.json'))
          assert c['valid'] is True
          assert c['empiricalExecutionAuthorized'] is False
          assert s['totalActiveNonOnsetSlots']==16000
          assert sum(s['targetActiveNonOnsetSlots'].values())==16000
          assert s['waveformsRendered']==0 and s['optimizerSteps']==0 and s['modelInference']==0 and s['v2bInference']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astra-v13-active-nononset-preflight-v1
          path: |
            /tmp/v13-preflight/contract-validation.json
            /tmp/v13-preflight/static-summary.json
          if-no-files-found: error
          retention-days: 30
