name: Astra independent real-development acquisition probe V2

on:
  push:
    branches: [astra-work]
    paths:
      - 'docs/astra/INDEPENDENT_REAL_DEVELOPMENT_ACQUISITION_PROBE_LAUNCH_V2.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'
      - name: Verify bounded V2 launch
        run: |
          python - <<'PY'
          import json,os
          x=json.load(open('docs/astra/INDEPENDENT_REAL_DEVELOPMENT_ACQUISITION_PROBE_LAUNCH_V2.json'))
          assert x['schema']=='astra-independent-real-development-acquisition-probe-launch-v2'
          assert x['status']=='armed'
          assert x['candidateId']=='P01'
          assert x['automaticRetry'] is False
          assert int(os.environ.get('GITHUB_RUN_ATTEMPT','1'))==1
          PY
      - name: Install minimal parser
        run: python -m pip install --disable-pip-version-check 'mutagen==1.47.0'
      - name: Download exact public CDN candidate
        run: |
          python astra_backend/synthetic/independent_real_development_acquisition_probe_v2.py \
            --source-url 'https://pixabay.com/sound-effects/musical-guitar-riff-in-e-minor-95-bpm-dry-475013/' \
            --audio-url 'https://cdn.pixabay.com/audio/2026/01/28/06-09-01-310.mp3' \
            --out-dir /tmp/astra-realdev-probe-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-independent-realdev-acquisition-probe-v2
          path: /tmp/astra-realdev-probe-v2
          if-no-files-found: warn
          retention-days: 7
