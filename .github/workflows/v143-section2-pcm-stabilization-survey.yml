name: V143 Section 2 PCM Stabilization Survey

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-section2-pcm-stabilization-survey.yml
      - analyzer/v143_section2_pcm_stabilization_survey_modal.py

permissions:
  contents: write

jobs:
  pcm-stabilization-survey:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify label-free survey inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s public/gomywayfullaitest.m4a
          test -s analyzer/v143_section2_pcm_stabilization_survey_modal.py

      - name: Run PCM stabilization survey on Modal
        shell: bash
        run: |
          set +e
          mkdir -p debug/v143-contextual-prune
          log=debug/v143-contextual-prune/section2-pcm-stabilization-survey.log
          diagnostic=debug/v143-contextual-prune/section2-pcm-stabilization-survey.json
          : > "$log"

          token_available=false
          attempted=false
          status=99

          if [ -n "${MODAL_TOKEN_ID:-}" ] && [ -n "${MODAL_TOKEN_SECRET:-}" ]; then
            token_available=true
            python -m pip install --disable-pip-version-check modal >> "$log" 2>&1
            install_status=$?
            if [ "$install_status" -eq 0 ]; then
              attempted=true
              python -m modal run analyzer/v143_section2_pcm_stabilization_survey_modal.py::diagnose >> "$log" 2>&1
              status=$?
            else
              status=$install_status
            fi
          else
            echo "Modal GitHub credentials are unavailable; survey not attempted." >> "$log"
          fi

          TOKEN_AVAILABLE="$token_available" ATTEMPTED="$attempted" STATUS="$status" python - <<'PY'
          import json
          import os
          from pathlib import Path

          log_path = Path("debug/v143-contextual-prune/section2-pcm-stabilization-survey.log")
          output = Path("debug/v143-contextual-prune/section2-pcm-stabilization-survey.json")
          text = log_path.read_text(encoding="utf-8", errors="replace")
          target_gate = "v143-section2-pcm-stabilization-survey"
          result = None
          decoder = json.JSONDecoder()
          for index, char in enumerate(text):
              if char != "{":
                  continue
              try:
                  value, _ = decoder.raw_decode(text[index:])
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict) and value.get("gate") == target_gate:
                  result = value

          payload = {
              "schemaVersion": 1,
              "gate": "v143-section2-pcm-stabilization-survey-action",
              "modalCredentialsAvailableInGitHubActions": os.environ["TOKEN_AVAILABLE"] == "true",
              "diagnosticAttempted": os.environ["ATTEMPTED"] == "true",
              "modalCommandExitCode": int(os.environ["STATUS"]) if os.environ["ATTEMPTED"] == "true" else None,
              "diagnosticResultFound": result is not None,
              "diagnosticResult": result,
              "logTail": text.splitlines()[-160:],
              "productionModified": False,
          }
          output.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          exit 0

      - name: Preserve full survey log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-section2-pcm-stabilization-survey-log
          path: debug/v143-contextual-prune/section2-pcm-stabilization-survey.log
          if-no-files-found: error
          retention-days: 7

      - name: Commit compact survey result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add -- debug/v143-contextual-prune/section2-pcm-stabilization-survey.json
          if git diff --cached --quiet; then
            echo "No survey result changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record V143 PCM stabilization survey"
          git push origin HEAD:v143-contextual-prune-lobo

      - name: Report survey state
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("debug/v143-contextual-prune/section2-pcm-stabilization-survey.json").read_text())
          result = data.get("diagnosticResult") or {}
          invariants = result.get("invariants") or {}
          checks = {
              "Modal credentials available": data.get("modalCredentialsAvailableInGitHubActions") is True,
              "Diagnostic attempted": data.get("diagnosticAttempted") is True,
              "Modal command exited zero": data.get("modalCommandExitCode") == 0,
              "Diagnostic result found": data.get("diagnosticResultFound") is True,
              "Professional reference not opened": invariants.get("professionalReferenceOpened") is False,
              "Runtime labels not required": invariants.get("runtimeLabelsRequired") is False,
              "Frozen model untouched": invariants.get("frozenModelModified") is False,
              "Frozen predictions untouched": invariants.get("frozenPredictionsModified") is False,
              "Thresholds untouched": invariants.get("thresholdsModified") is False,
              "Production untouched": invariants.get("productionModified") is False,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("PCM stabilization survey failed: " + ", ".join(failed))
          print("DIRECT_FIRST_EXACT_BITS", (result.get("directPcmSurvey") or {}).get("firstClearedLowBitsWithExactCrossWorkerPcm"))
          print("CASCADE_FIRST_EXACT_BITS", (result.get("cascadePcmSurvey") or {}).get("firstClearedLowBitsWithExactCrossWorkerPcm"))
          PY
