name: V167 post-I004 contextual Guitar aggregate analysis

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v167-post-i004-contextual-aggregate-analysis.yml

permissions:
  contents: write

concurrency:
  group: v167-post-i004-contextual-aggregate-analysis-once
  cancel-in-progress: false

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: b8b66b4b8b12d7e434ad8f5a89c43daf53a5ea2a
  REPORT: debug/v167-single-song-calibration/contextual-guitar-recovery-sweep.json
  POOL: debug/v167-single-song-calibration/nearmiss-evidence-pool.json
  I004: debug/v167-single-song-calibration/iteration-004-generated.json
  ANALYZER: validation/v167_single_song_calibration/analyze_contextual_guitar_sweep_v167.py
  OUTPUT: debug/v167-single-song-calibration/post-i004-contextual-guitar-aggregate-analysis.json
  RECEIPT: debug/v167-single-song-calibration/post-i004-contextual-guitar-aggregate-analysis-receipt.json
  CUDA_VISIBLE_DEVICES: ""
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  analyze-once:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact diagnosis arm
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.21'

      - name: Verify immutable no-rescore diagnosis boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v167-post-i004-contextual-aggregate-analysis.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"

          test "$(git hash-object "$REPORT")" = "b00e25f5c1fd9f8c40b440156e049317e008ec1d"
          test "$(git hash-object "$POOL")" = "aa7da3a55344b1418a291f30fab9ca55858fc094"
          test "$(git hash-object "$I004")" = "8dd85049a65f00541f7874ff99511b081a0b5ff2"
          test "$(git hash-object "$ANALYZER")" = "9bd0e9f69f63d5886a69af9695d738bbd4c9e897"
          test "$(git hash-object docs/checkpoints/CURRENT_STATE.md)" = "8d58613a8915a4e8ac704222b1e5736fdfe47444"

          test ! -e "$OUTPUT"
          test ! -e "$RECEIPT"
          python -m py_compile "$ANALYZER"

          python - <<'PY'
          import hashlib
          from pathlib import Path
          checks={
            'debug/v167-single-song-calibration/contextual-guitar-recovery-sweep.json':'6b661f6dfa27d31204f4e8a9035d286d5324440b947eb3e49db99205dad9320e',
            'debug/v167-single-song-calibration/nearmiss-evidence-pool.json':'1c983784c2d12a22437a80387525789bcf55a2f4e4a5c7a96608c575bf709673',
            'debug/v167-single-song-calibration/iteration-004-generated.json':'728785c631750cbfcad48cc3243c238d6e7de6f337cce87e125a651ca2793acc',
          }
          for path,expected in checks.items():
              actual=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert actual==expected,(path,actual,expected)
          text=Path('validation/v167_single_song_calibration/analyze_contextual_guitar_sweep_v167.py').read_text()
          for forbidden in ('frontend-reference-payload.json','score_frontend_reference.py'):
              assert forbidden not in text,forbidden
          assert '--reference' not in text
          assert '--scorer' not in text
          PY

      - name: Analyze frozen whole-rule family and reference-blind structure
        shell: bash
        run: |
          set -euo pipefail
          python "$ANALYZER" \
            --report "$REPORT" \
            --pool "$POOL" \
            --i004 "$I004" \
            --output "$OUTPUT"

          python - <<'PY'
          import json
          a=json.load(open('debug/v167-single-song-calibration/post-i004-contextual-guitar-aggregate-analysis.json'))
          assert a['status']=='POST_I004_CONTEXTUAL_AGGREGATE_ANALYSIS_FROZEN'
          assert a['variantCount']==37
          assert a['nonBaselineCount']==36
          assert a['positiveNonBaselineCount']==10
          assert a['winner']['id']=='gctx-o50-q100-allow-noharm'
          assert a['referenceBlindStructuralEvidence']['selectedI004Additions']['additionCount']==63
          assert a['policy']['professionalReferenceReadByAnalysis'] is False
          assert a['policy']['scorerReadByAnalysis'] is False
          assert a['policy']['newReferenceFacingScoreCalls']==0
          assert a['policy']['perEventReferenceMatchAssignmentsRead'] is False
          assert a['policy']['aggregateWholeVariantScoresOnly'] is True
          assert a['policy']['newRuleSelectedByThisAnalysis'] is False
          assert a['policy']['iteration005Created'] is False
          for key,expected in {
              'excludeHarmonicOctaveVsNone':12,
              'chordIntervalVsNone':12,
              'allowActiveVsInactiveOnly':18,
              'ratio100Vs075':12,
              'ratio125Vs100':12,
              'onset65Vs50':18,
          }.items():
              assert a['pairedFactorComparisons'][key]['pairCount']==expected,(key,a['pairedFactorComparisons'][key]['pairCount'])
          print('diagnostic questions:',json.dumps(a['diagnosticQuestions'],sort_keys=True))
          print('correlations:',json.dumps(a['correlationsAcross36WholeRules'],sort_keys=True))
          print('positive ids:',json.dumps(a['positiveVariantIds']))
          PY

      - name: Freeze diagnosis receipt and self-seal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          output=Path('debug/v167-single-song-calibration/post-i004-contextual-guitar-aggregate-analysis.json')
          receipt=Path('debug/v167-single-song-calibration/post-i004-contextual-guitar-aggregate-analysis-receipt.json')
          a=json.loads(output.read_text())
          r={
            'schema':'dadrock.tabs.v167.post-i004-contextual-guitar-aggregate-analysis-receipt.v1',
            'version':'V167',
            'status':'POST_I004_CONTEXTUAL_AGGREGATE_ANALYSIS_FROZEN',
            'classification':'SINGLE_SONG_TRAINING_CALIBRATION_ONLY',
            'workflowRunId':int(os.environ['GITHUB_RUN_ID']),
            'workflowRunNumber':int(os.environ['GITHUB_RUN_NUMBER']),
            'workflowRunAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'workflowHeadSha':os.environ['GITHUB_SHA'],
            'analysisSha256':hashlib.sha256(output.read_bytes()).hexdigest(),
            'analysisGitBlob':subprocess.check_output(['git','hash-object',str(output)],text=True).strip(),
            'inputs':{
              'contextualSweepReportGitBlob':'b00e25f5c1fd9f8c40b440156e049317e008ec1d',
              'contextualSweepReportSha256':'6b661f6dfa27d31204f4e8a9035d286d5324440b947eb3e49db99205dad9320e',
              'referenceBlindEvidencePoolGitBlob':'aa7da3a55344b1418a291f30fab9ca55858fc094',
              'referenceBlindEvidencePoolSha256':'1c983784c2d12a22437a80387525789bcf55a2f4e4a5c7a96608c575bf709673',
              'iteration004GitBlob':'8dd85049a65f00541f7874ff99511b081a0b5ff2',
              'iteration004Sha256':'728785c631750cbfcad48cc3243c238d6e7de6f337cce87e125a651ca2793acc',
              'analyzerGitBlob':'9bd0e9f69f63d5886a69af9695d738bbd4c9e897',
            },
            'winner':a['winner'],
            'positiveNonBaselineCount':a['positiveNonBaselineCount'],
            'positiveVariantIds':a['positiveVariantIds'],
            'factorSummaries':a['factorSummaries'],
            'pairedFactorComparisons':{
              key:{k:v for k,v in value.items() if k!='pairs'}
              for key,value in a['pairedFactorComparisons'].items()
            },
            'correlationsAcross36WholeRules':a['correlationsAcross36WholeRules'],
            'diagnosticQuestions':a['diagnosticQuestions'],
            'selectedI004AdditionStructure':a['referenceBlindStructuralEvidence']['selectedI004Additions'],
            'policy':a['policy'],
          }
          receipt.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY

          rm .github/workflows/v167-post-i004-contextual-aggregate-analysis.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$OUTPUT" "$RECEIPT" .github/workflows/v167-post-i004-contextual-aggregate-analysis.yml
          changed="$(git diff --cached --name-only)"
          if echo "$changed" | grep -Ev '^debug/v167-single-song-calibration/post-i004-contextual-guitar-aggregate-analysis(-receipt)?\.json$|^\.github/workflows/v167-post-i004-contextual-aggregate-analysis\.yml$'; then
            echo 'Unexpected post-I004 diagnosis path' >&2
            exit 1
          fi
          git commit -m "research: freeze V167 post-I004 contextual Guitar aggregate diagnosis [skip ci]"
          git push origin HEAD:"$BRANCH"
