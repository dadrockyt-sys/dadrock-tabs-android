name: V144 V6 Calibration Score

on:
  workflow_dispatch:
  push:
    branches:
      - v144-rhythm-post-holdout-calibration
    paths:
      - debug/v144-rhythm-calibration/run-v6-calibration-score.txt

permissions:
  contents: write

concurrency:
  group: v144-v6-calibration-score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact scoring revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify frozen V5 and V6 identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .v144score debug/v144-rhythm-calibration/v6-attack-gate
          echo '7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2  debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json' | sha256sum -c -
          echo 'c1e6389fdf9d7a18adb50407f248673fe494b236889d635a467100adb6070ddf  debug/v144-rhythm-calibration/v6-attack-gate/v6-render-stream.json' | sha256sum -c -
          echo 'd99d0384ac5d12377bf9656cdfe5d9ef5eede41bc15e3dba97a5a19d1865cc32  debug/v144-rhythm-calibration/v6-attack-gate/v6-generation-manifest.json' | sha256sum -c -

      - name: Fetch exact consumed calibration source after V6 freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, hashlib, json, urllib.request
          from pathlib import Path
          expected='18cdb4f8afb49562aac5b600730384636070d6ca8650823e759276a81ee4afc8'
          errors=[]
          for host in ['dqsljvtekg760','d34shlm8p2ums2','d3cqchs6g3b5ew']:
              try:
                  url=f'https://{host}.cloudfront.net/243/7868948/v0-3-2-TvYYK-mMQgzBsDxG/3.json'
                  req=urllib.request.Request(url,headers={'User-Agent':'dadrock-v144-v6-frozen-calibration-score','Accept':'*/*','Accept-Encoding':'gzip'})
                  with urllib.request.urlopen(req,timeout=30) as r: raw=r.read()
                  if raw[:2]==b'\x1f\x8b': raw=gzip.decompress(raw)
                  obj=json.loads(raw)
                  normalized=(json.dumps(obj,separators=(',',':'))+'\n').encode()
                  digest=hashlib.sha256(normalized).hexdigest()
                  if digest==expected:
                      Path('.v144score/structured-source.json').write_bytes(normalized)
                      break
                  errors.append(f'{host}:sha={digest}')
              except Exception as exc:
                  errors.append(f'{host}:{type(exc).__name__}')
          else:
              raise SystemExit('exact consumed calibration source unavailable: '+';'.join(errors))
          PY

      - name: Independently score frozen V6
        shell: bash
        run: |
          set -euo pipefail
          python analyzer/v144_score_v6_calibration.py \
            debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json \
            debug/v144-rhythm-calibration/v6-attack-gate/v6-render-stream.json \
            .v144score/structured-source.json \
            --output debug/v144-rhythm-calibration/v6-attack-gate/v6-calibration-score.json
          rm -rf .v144score

      - name: Persist aggregate calibration score
        shell: bash
        run: |
          set -euo pipefail
          report='debug/v144-rhythm-calibration/v6-attack-gate/v6-calibration-score.json'
          test -s "$report"
          git add "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record frozen V144 V6 calibration score'
          for attempt in 1 2 3 4 5; do
            git fetch origin v144-rhythm-post-holdout-calibration
            if git rebase origin/v144-rhythm-post-holdout-calibration && git push origin HEAD:v144-rhythm-post-holdout-calibration; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
