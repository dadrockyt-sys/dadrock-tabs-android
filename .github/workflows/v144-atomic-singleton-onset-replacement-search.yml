name: V144 Rhythm Atomic Singleton Onset Replacement One-Shot

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - debug/v144-rhythm-calibration/candidates/.v144-atomic-singleton-onset-replacement-trigger

permissions:
  contents: write

concurrency:
  group: v144-rhythm-atomic-singleton-onset-replacement-one-shot
  cancel-in-progress: false

jobs:
  search:
    if: "${{ github.event.head_commit.message == 'v144 execute atomic singleton onset replacement one-shot' }}"
    name: Fit-lock atomic singleton onset replacement on CPU
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact trigger revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact trigger and immutable pre-registered implementation
        shell: bash
        run: |
          set -euo pipefail
          trigger='debug/v144-rhythm-calibration/candidates/.v144-atomic-singleton-onset-replacement-trigger'
          report='debug/v144-rhythm-calibration/candidates/atomic-singleton-onset-replacement-search.json'
          test "$(git log -1 --format=%s)" = 'v144 execute atomic singleton onset replacement one-shot'
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "${changed}" = "${trigger}"
          test ! -e "${report}"
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          test "$(git hash-object debug/v143-contextual-prune/v5-professional-pdf/final-professional-holdout-result.json)" = "511fd244f231b66d08306f97b5a47ed41f5415c7"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json | awk '{print $1}')" = "7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-rhythm-shadow.pdf | awk '{print $1}')" = "f4c1238e868cadfb90b8a359b1555b0b90e7740b9ebaa276aa394c8991f37ce5"
          test "$(sha256sum debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json | awk '{print $1}')" = "18fd868ae960dfcdd1ffb0110f1a9dfd8acc2ffeb46e247d1116cd54291526ac"
          test "$(git hash-object debug/v144-rhythm-calibration/selected/v144-pitch-position-selected-baseline.json)" = "45287a40fbbe88f411d2eca7db3cce072174eda8"
          test "$(git hash-object validation/v144_rhythm_calibration/search_atomic_singleton_onset_replacements.py)" = "70880d26418d907cc702233af37bcc4b643e3a57"
          test "$(git hash-object modal/v144_rhythm_singleton_onset_replacement_policy.py)" = "1e05e66a3523f98944370837a59e5d6e7293f9ac"
          test "$(git hash-object modal/tests/test_v144_rhythm_singleton_onset_replacement_policy.py)" = "a4e1c52e5f63187e8bad5f853300e644f056e726"
          test "$(git hash-object modal/tests/test_v144_rhythm_singleton_onset_replacement_search.py)" = "3a2adbecbe810e6738718fc72e2cf231555e8c3e"
          test "$(git hash-object modal/v144_rhythm_pitch_position_shift_policy.py)" = "f69755b61bdcdf3a669847ce7e425289b4b0927f"
          test "$(git hash-object modal/v144_rhythm_pitch_shift_policy.py)" = "d9998c59acddba070069668d62bcb1c3cdaf2b05"
          test "$(git hash-object modal/v144_rhythm_triple_conjunction_policy.py)" = "ef9768a127472d7ce0746fdf21164d33e5117ea4"
          test "$(git hash-object modal/v144_rhythm_staged_selector.py)" = "d176a9a69366e192e6fa75bc1039661e977f0bfa"
          test "$(git hash-object modal/v144_rhythm_measure_set_guard.py)" = "4a1364204dd1e720c09d835ec3995c165047de98"
          test "$(git hash-object modal/v144_rhythm_context_split_policy.py)" = "2da58508f2132660ad317ee63d5cb043d58285f0"
          test "$(git hash-object modal/configs/v144_rhythm_context_split_config.json)" = "9b93205cb47bc7718685b9d41b263778107801ce"
          test "$(git hash-object validation/rhythm_holdout/freeze_rhythm_analysis.py)" = "710bb6a3b15b99d3d11ceb4948d7c7175d208afc"
          test "$(git hash-object validation/rhythm_holdout/verify_pdf_event_fidelity.py)" = "5e1564216873046237fb545078a04a6b18f72b27"
          test "$(git hash-object lib/v143RenderContract.js)" = "ccbb93c48982798cc474309fd981f6ca02d5c8d4"
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          path = Path('debug/v144-rhythm-calibration/candidates/.v144-atomic-singleton-onset-replacement-trigger')
          trigger = json.loads(path.read_text(encoding='utf-8'))
          assert trigger['classification'] == 'v144-rhythm-atomic-singleton-onset-replacement-one-shot-trigger'
          assert trigger['baselineName'] == 'pitch-position-shift-54a6e8d3aa91c422'
          assert trigger['baselineEventSha256'] == '5b36270aaeafa73b2e25722e2576a40424ce5951dcfd2b5d769746bd9eb07e0d'
          assert trigger['policyBlob'] == '1e05e66a3523f98944370837a59e5d6e7293f9ac'
          assert trigger['searchBlob'] == '70880d26418d907cc702233af37bcc4b643e3a57'
          assert trigger['policyTestBlob'] == 'a4e1c52e5f63187e8bad5f853300e644f056e726'
          assert trigger['searchTestBlob'] == '3a2adbecbe810e6738718fc72e2cf231555e8c3e'
          assert trigger['cpuWorkflowBlob'] == '961f65cc31e64527fb0510d98211b2a7f2b990cc'
          assert trigger['searchCpuRunId'] == 32995017936
          assert trigger['searchCpuJobId'] == 98261834131
          workflow_blob = subprocess.check_output(['git', 'hash-object', '.github/workflows/v144-atomic-singleton-onset-replacement-search.yml'], text=True).strip()
          assert trigger['oneShotWorkflowBlob'] == workflow_blob
          assert trigger['minimumCorrectionSupport'] == 3
          assert trigger['maximumCandidates'] == 256
          assert trigger['maximumAbsSemitoneShift'] == 12
          assert trigger['candidateConstructionFitOnly'] is True
          assert trigger['validationMayConstructOrRank'] is False
          assert trigger['canaryMayConstructOrRank'] is False
          assert trigger['runtimeReferenceAllowed'] is False
          assert trigger['modalGpuAllowed'] is False
          assert trigger['replayAllowed'] is False
          PY
          python -m py_compile validation/v144_rhythm_calibration/search_atomic_singleton_onset_replacements.py
          python modal/tests/test_v144_rhythm_staged_selector.py -v
          python modal/tests/test_v144_rhythm_measure_set_guard.py -v
          python modal/tests/test_v144_rhythm_singleton_onset_replacement_policy.py -v
          python modal/tests/test_v144_rhythm_singleton_onset_replacement_search.py -v

      - name: Run fixed family ten search and staged gates once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .v144/singleton-onset-search
          python validation/v144_rhythm_calibration/search_atomic_singleton_onset_replacements.py \
            debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json \
            debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json \
            debug/v144-rhythm-calibration/selected/v144-pitch-position-selected-baseline.json \
            modal/configs/v144_rhythm_context_split_config.json \
            debug/v144-rhythm-calibration/candidates/atomic-singleton-onset-replacement-search.json \
            .v144/singleton-onset-search/locked-events.json \
            --minimum-correction-support 3 \
            --maximum-candidates 256 \
            --maximum-abs-semitone-shift 12 \
            > .v144/singleton-onset-search/search.log

      - name: Verify construction isolation and staged-stop semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('debug/v144-rhythm-calibration/candidates/atomic-singleton-onset-replacement-search.json').read_text(encoding='utf-8'))
          assert report['schemaVersion'] == 14420
          assert report['classification'] == 'v144-rhythm-fit-only-atomic-singleton-onset-replacement-search'
          assert report['evaluationRole'] == 'accepted-v144-baseline-atomic-singleton-onset-pitch-explicit-string-replacement-gold-calibration'
          assert report['mayClaimUnseenGeneralization'] is False
          c = report['candidateConstruction']
          assert c['sourceBaselineName'] == 'pitch-position-shift-54a6e8d3aa91c422'
          assert c['sourceBaselineEventCount'] == 1144
          assert c['sourceBaselineEventSha256'] == '5b36270aaeafa73b2e25722e2576a40424ce5951dcfd2b5d769746bd9eb07e0d'
          assert c['sourceLabels'] == 'accepted-baseline-fit-only-shared-singleton-onset-reference-pairs'
          assert c['candidateRuleShape'] == 'atomic-exact-singleton-onset-pitch-explicit-string-replacement'
          assert c['minimumCorrectionSupport'] == 3
          assert c['maximumCandidates'] == 256
          assert c['maximumAbsSemitoneShift'] == 12
          assert 0 <= c['rankedRuleCount'] <= 256
          assert 0 <= c['evaluatedCandidateCount'] <= c['rankedRuleCount']
          assert c['fitGeneratedNoteCount'] == 643
          assert c['fitGeneratedCanonicalEventCount'] == 643
          assert c['fitReferenceNoteCount'] == 594
          assert c['validationLabelsUsedForCandidateConstructionOrRanking'] is False
          assert c['canaryLabelsUsedForCandidateConstructionOrRanking'] is False
          assert c['historicalConsumedFamilyResultsUsedForConstructionOrRanking'] is False
          assert c['measureSetGuardUsesProfessionalReference'] is False
          assert c['eventCountPreservationRequired'] is True
          assert c['generatedMeasureSetPreservationRequired'] is True
          assert c['exactlyOneGeneratedNoteOnsetRequired'] is True
          assert c['exactlyOneReferenceNoteOnsetRequiredForConstruction'] is True
          assert c['atomicOneEventChangeRequired'] is True
          assert c['pitchChangeRequired'] is True
          assert c['stringChangeRequired'] is True
          assert c['explicitTargetStringRequired'] is True
          assert c['adjacentStringOnlyRequired'] is False
          assert c['timingPreservationRequired'] is True
          assert c['durationTechniqueAndOtherMetadataPreservationRequired'] is True
          assert c['tuningDerivedTargetFretRequired'] is True
          assert c['linkedPitchTechniqueEventsEligible'] is False
          assert report['baseline']['eventCount'] == 1144
          assert report['baseline']['eventSha256'] == '5b36270aaeafa73b2e25722e2576a40424ce5951dcfd2b5d769746bd9eb07e0d'
          assert report['baseline']['generatedMeasureCount'] == 113
          assert report['fitLock']['fitOnlyRanking'] is True
          assert report['fitLock']['validationReadDuringLock'] is False
          assert report['fitLock']['canaryReadDuringLock'] is False
          assert report['fitLock']['baselineGeneratedMeasureSetPreservationRequired'] is True
          assert report['alternateAfterGateFailureAllowed'] is False
          locked = report['locked']
          assert locked['eventCount'] == 1144
          assert locked['changedOnsetCount'] == locked['changedEventCount']
          assert locked['measureSet']['baselineGeneratedMeasureCount'] == 113
          assert locked['measureSet']['candidateGeneratedMeasureCount'] == 113
          assert locked['measureSet']['missingBaselineGeneratedMeasures'] == []
          assert locked['measureSet']['extraCandidateGeneratedMeasures'] == []
          assert locked['measureSet']['baselineGeneratedMeasureSetPreserved'] is True
          assert locked['measureSet']['professionalReferenceUsed'] is False
          if locked['name'] != 'accepted-v144-baseline':
              assert isinstance(locked['contextSignature'], str)
              assert isinstance(locked['sourceStringIndex'], int)
              assert isinstance(locked['sourcePitchClass'], int)
              assert isinstance(locked['targetStringIndex'], int)
              assert locked['sourceStringIndex'] != locked['targetStringIndex']
              assert isinstance(locked['semitoneShift'], int)
              assert locked['semitoneShift'] != 0
              assert abs(locked['semitoneShift']) <= 12
              assert locked['changedEventCount'] > 0
          assert report['safety']['v5Modified'] is False
          assert report['safety']['productionModified'] is False
          assert report['safety']['mainModified'] is False
          assert report['safety']['runtimeReferenceInputUsed'] is False
          assert report['safety']['modalGpuInvoked'] is False
          assert report['safety']['deterministic'] is True
          if report['stoppedAt'] == 'fit':
              assert report['selected'] == 'accepted-v144-baseline'
              assert report['validation'] is None
              assert report['canary'] is None
              assert report['fullCalibration'] is None
          elif report['stoppedAt'] == 'validation':
              assert report['selected'] == 'accepted-v144-baseline'
              assert report['validation']['passed'] is False
              assert report['canary'] is None
              assert report['fullCalibration'] is None
          elif report['stoppedAt'] == 'canary':
              assert report['selected'] == 'accepted-v144-baseline'
              assert report['validation']['passed'] is True
              assert report['canary']['passed'] is False
              assert report['fullCalibration'] is None
          elif report['stoppedAt'] == 'full-calibration':
              assert report['selected'] == report['locked']['name']
              assert report['validation']['passed'] is True
              assert report['canary']['passed'] is True
              assert report['fullCalibration'] is not None
          else:
              raise AssertionError(report['stoppedAt'])
          PY

      - name: Reprove locked candidate PDF-event identity independently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .v144/singleton-onset-search/freeze
          python - <<'PY'
          import json
          from pathlib import Path
          locked = json.loads(Path('.v144/singleton-onset-search/locked-events.json').read_text(encoding='utf-8'))
          assert locked['schemaVersion'] == 14420
          assert locked['runtimeReferenceInputUsed'] is False
          assert locked['baselineEventCountPreserved'] is True
          assert locked['baselineGeneratedMeasureSetPreserved'] is True
          assert len(locked['renderEvents']) == 1144
          payload = {
              'instrument': 'rhythm',
              'renderEvents': locked['renderEvents'],
              'tempoBpm': 129.19921875,
              'timeSignature': '4/4',
              'tuning': 'E Standard',
              'structuredMode': True,
              'sourceAudioSha256': '215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f',
              'referenceFree': True,
              'professionalReferenceUsed': False,
              'referenceRuntimeInputUsed': False,
              'runtimeLabelsRequired': False,
              'v143RuntimeSafetyVerified': True,
          }
          Path('.v144/singleton-onset-search/freeze-input.json').write_text(json.dumps(payload, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          python validation/rhythm_holdout/freeze_rhythm_analysis.py \
            .v144/singleton-onset-search/freeze-input.json .v144/singleton-onset-search/freeze \
            --source-commit "${GITHUB_SHA}" > .v144/singleton-onset-search/freeze.log
          cp lib/v143RenderContract.js .v144/singleton-onset-search/v143RenderContract.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { validateV143RenderEvents } from './.v144/singleton-onset-search/v143RenderContract.mjs';
          const locked = JSON.parse(await fs.readFile('.v144/singleton-onset-search/locked-events.json', 'utf8'));
          const events = validateV143RenderEvents(locked.renderEvents || []);
          if (events.length !== 1144) throw new Error(`locked event count changed: ${events.length}`);
          await fs.writeFile('.v144/singleton-onset-search/renderer-event-evidence.json', JSON.stringify({
            schemaVersion: 1,
            renderEvents: events,
            runtimeSafetyVerified: true,
            runtimeLabelsRequired: false,
            referenceOpened: false,
            professionalReferenceUsed: false,
            productionModified: false,
          }) + '\n');
          NODE
          python validation/rhythm_holdout/verify_pdf_event_fidelity.py \
            .v144/singleton-onset-search/freeze .v144/singleton-onset-search/renderer-event-evidence.json \
            > .v144/singleton-onset-search/pdf-event-fidelity.log

      - name: Attach fidelity proof and evaluate final full-gold invariant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('debug/v144-rhythm-calibration/candidates/atomic-singleton-onset-replacement-search.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          fidelity = json.loads(Path('.v144/singleton-onset-search/freeze/rhythm-pdf-event-fidelity.json').read_text(encoding='utf-8'))
          assert fidelity['passed'] is True
          assert fidelity['pdfEventFidelity'] == 1.0
          assert fidelity['frozenEventSha256'] == fidelity['pdfEventSha256'] == report['locked']['eventSha256']
          assert fidelity['frozenEventCount'] == report['locked']['eventCount'] == 1144
          report['lockedCandidatePdfFidelityProof'] = {
              'passed': True,
              'pdfEventFidelity': 1.0,
              'eventCount': fidelity['frozenEventCount'],
              'eventSha256': fidelity['frozenEventSha256'],
              'referenceOpenedDuringPdfFidelityCheck': False,
          }
          full = report['fullCalibration']
          if full is not None:
              full['pdfEventFidelity'] = 1.0
              full['score']['gatedMetrics']['pdfEventFidelity'] = 1.0
              deltas = full['baselineComparison']['gatedMetricDeltas']
              regressions = {name: float(delta) for name, delta in deltas.items() if float(delta) < 0.0}
              measure_coverage = float(full['score']['gatedMetrics']['measureCoverageRecall'])
              critical_delta = int(full['baselineComparison']['criticalMismatchDelta'])
              c = report['candidateConstruction']
              invariant = (
                  report['locked']['eventCount'] == 1144
                  and report['locked']['measureSet']['baselineGeneratedMeasureSetPreserved'] is True
                  and report['locked']['measureSet']['candidateGeneratedMeasureCount'] == 113
                  and c['exactlyOneGeneratedNoteOnsetRequired'] is True
                  and c['exactlyOneReferenceNoteOnsetRequiredForConstruction'] is True
                  and c['atomicOneEventChangeRequired'] is True
                  and c['pitchChangeRequired'] is True
                  and c['stringChangeRequired'] is True
                  and c['explicitTargetStringRequired'] is True
                  and c['adjacentStringOnlyRequired'] is False
                  and c['timingPreservationRequired'] is True
                  and c['durationTechniqueAndOtherMetadataPreservationRequired'] is True
                  and c['tuningDerivedTargetFretRequired'] is True
                  and report['locked']['changedEventCount'] > 0
                  and report['locked']['changedOnsetCount'] == report['locked']['changedEventCount']
                  and report['locked']['sourceStringIndex'] != report['locked']['targetStringIndex']
                  and report['locked']['semitoneShift'] != 0
                  and abs(int(report['locked']['semitoneShift'])) <= 12
                  and measure_coverage == 1.0
                  and not regressions
                  and critical_delta <= 0
                  and fidelity['pdfEventFidelity'] == 1.0
              )
              full['invariantPassed'] = invariant
              full['invariantEvidence'] = {
                  'baselineEventCountPreserved': report['locked']['eventCount'] == 1144,
                  'baselineGeneratedMeasureSetPreserved': report['locked']['measureSet']['baselineGeneratedMeasureSetPreserved'],
                  'candidateGeneratedMeasureCount': report['locked']['measureSet']['candidateGeneratedMeasureCount'],
                  'atomicSingletonUnit': c['atomicOneEventChangeRequired'],
                  'pitchChangeRequired': c['pitchChangeRequired'],
                  'stringChangeRequired': c['stringChangeRequired'],
                  'explicitTargetStringRequired': c['explicitTargetStringRequired'],
                  'adjacentStringOnlyRequired': c['adjacentStringOnlyRequired'],
                  'timingPreservationRequired': c['timingPreservationRequired'],
                  'durationTechniqueAndOtherMetadataPreservationRequired': c['durationTechniqueAndOtherMetadataPreservationRequired'],
                  'tuningDerivedTargetFretRequired': c['tuningDerivedTargetFretRequired'],
                  'changedEventCount': report['locked']['changedEventCount'],
                  'changedOnsetCount': report['locked']['changedOnsetCount'],
                  'measureCoverageRecall': measure_coverage,
                  'metricRegressions': regressions,
                  'criticalMismatchDelta': critical_delta,
                  'pdfEventFidelity': 1.0,
              }
              report['calibrationPromotionAllowed'] = invariant
              if invariant:
                  report['selectedReason'] = 'locked-atomic-singleton-onset-replacement-candidate-passed-split-and-full-calibration-invariants'
                  report['stoppedAt'] = 'complete'
              else:
                  report['selected'] = 'accepted-v144-baseline'
                  report['selectedReason'] = 'locked-atomic-singleton-onset-replacement-candidate-failed-full-calibration-invariant'
                  report['stoppedAt'] = 'full-calibration'
          else:
              report['calibrationPromotionAllowed'] = False
          report['safety']['lockedCandidatePdfFidelityReproved'] = True
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Reverify immutable V5 and accepted baseline after search
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          test "$(git hash-object debug/v143-contextual-prune/v5-professional-pdf/final-professional-holdout-result.json)" = "511fd244f231b66d08306f97b5a47ed41f5415c7"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json | awk '{print $1}')" = "7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2"
          test "$(git hash-object debug/v144-rhythm-calibration/selected/v144-pitch-position-selected-baseline.json)" = "45287a40fbbe88f411d2eca7db3cce072174eda8"
          test "$(git hash-object validation/v144_rhythm_calibration/search_atomic_singleton_onset_replacements.py)" = "70880d26418d907cc702233af37bcc4b643e3a57"
          test "$(git hash-object modal/v144_rhythm_singleton_onset_replacement_policy.py)" = "1e05e66a3523f98944370837a59e5d6e7293f9ac"
          test "$(git hash-object modal/tests/test_v144_rhythm_singleton_onset_replacement_search.py)" = "3a2adbecbe810e6738718fc72e2cf231555e8c3e"

      - name: Persist only family ten search report
        shell: bash
        run: |
          set -euo pipefail
          report='debug/v144-rhythm-calibration/candidates/atomic-singleton-onset-replacement-search.json'
          git add "$report"
          test "$(git diff --cached --name-only)" = "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Persist V144 atomic singleton onset replacement calibration result'
          for attempt in 1 2 3 4 5; do
            git fetch origin v143-contextual-prune-lobo
            if git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
