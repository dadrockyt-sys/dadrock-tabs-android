name: V144 Rhythm Contextual Pitch Shift One-Shot — Archived

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    name: Refuse replay of consumed contextual pitch-shift calibration search
    runs-on: ubuntu-latest
    steps:
      - name: Refuse replay
        shell: bash
        run: |
          echo 'The V144 contextual pitch-shift calibration search family is consumed and may not be replayed or retuned.' >&2
          exit 1
