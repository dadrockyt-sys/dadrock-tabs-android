name: V144 Rhythm Contextual Pitch Shift One-Shot

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v144-contextual-pitch-shift-search.yml

permissions:
  contents: write

concurrency:
  group: v144-rhythm-contextual-pitch-shift-one-shot
  cancel-in-progress: false

jobs:
  search:
    if: "${{ github.event.head_commit.message == 'v144 execute contextual pitch shift one-shot' }}"
    name: Fit-lock contextual pitch correction on CPU
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify immutable inputs and exact pre-registered implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          test "$(git hash-object debug/v143-contextual-prune/v5-professional-pdf/final-professional-holdout-result.json)" = "511fd244f231b66d08306f97b5a47ed41f5415c7"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json | awk '{print $1}')" = "7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2"
          test "$(sha256sum debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json | awk '{print $1}')" = "18fd868ae960dfcdd1ffb0110f1a9dfd8acc2ffeb46e247d1116cd54291526ac"
          test "$(git hash-object debug/v144-rhythm-calibration/selected/v144-triple-selected-baseline.json)" = "ba8dec9a1c3155816f5841a32ee52ced7998c110"
          test "$(git hash-object validation/v144_rhythm_calibration/search_contextual_pitch_shifts.py)" = "9b35de6cf94a190a8700274334fcc85c5ad986c2"
          test "$(git hash-object modal/v144_rhythm_pitch_shift_policy.py)" = "d9998c59acddba070069668d62bcb1c3cdaf2b05"
          test "$(git hash-object modal/configs/v144_rhythm_context_split_config.json)" = "9b93205cb47bc7718685b9d41b263778107801ce"
          python -m py_compile validation/v144_rhythm_calibration/search_contextual_pitch_shifts.py
          python modal/tests/test_v144_rhythm_staged_selector.py -v
          python modal/tests/test_v144_rhythm_measure_set_guard.py -v
          python modal/tests/test_v144_rhythm_pitch_shift_policy.py -v

      - name: Run fit-only contextual pitch-shift search and staged gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .v144/pitch-shift-search
          python validation/v144_rhythm_calibration/search_contextual_pitch_shifts.py \
            debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json \
            debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json \
            debug/v144-rhythm-calibration/selected/v144-triple-selected-baseline.json \
            modal/configs/v144_rhythm_context_split_config.json \
            debug/v144-rhythm-calibration/candidates/contextual-pitch-shift-search.json \
            .v144/pitch-shift-search/locked-events.json \
            --minimum-correction-support 3 \
            --maximum-candidates 256 \
            --maximum-abs-semitone-shift 12 \
            > .v144/pitch-shift-search/search.log

      - name: Verify construction isolation and locked-stream invariants before fidelity proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('debug/v144-rhythm-calibration/candidates/contextual-pitch-shift-search.json').read_text(encoding='utf-8'))
          assert report['classification'] == 'v144-rhythm-fit-only-contextual-pitch-shift-search'
          assert report['evaluationRole'] == 'accepted-v144-baseline-contextual-pitch-correction-gold-calibration'
          assert report['mayClaimUnseenGeneralization'] is False
          construction = report['candidateConstruction']
          assert construction['sourceBaselineName'] == 'prune-triple-67348efe50436fc5'
          assert construction['sourceBaselineEventCount'] == 1144
          assert construction['sourceBaselineEventSha256'] == '68b8cdf14ed02265c5e3c204b2af51b0aae4849462e7b3e4243192d8855cc3c3'
          assert construction['sourceLabels'] == 'accepted-baseline-fit-only-same-onset-generated-reference-substitutions'
          assert construction['runtimeRuleInputs'] == 'reference-free-source-pitch-class-plus-structural-context-and-fixed-shift-only'
          assert construction['candidateRuleShape'] == 'same-string-contextual-pitch-shift'
          assert construction['pairingPolicy'] == 'exact-pitch-removal-then-minimum-absolute-midi-distance-deterministic'
          assert construction['minimumCorrectionSupport'] == 3
          assert construction['maximumCandidates'] == 256
          assert construction['maximumAbsSemitoneShift'] == 12
          assert 0 <= construction['rankedRuleCount'] <= 256
          assert 0 <= construction['evaluatedCandidateCount'] <= construction['rankedRuleCount']
          assert construction['fitGeneratedNoteCount'] == 643
          assert construction['fitGeneratedCanonicalEventCount'] == 643
          assert construction['fitReferenceNoteCount'] == 594
          assert construction['canonicalGeneratedEventsUsedForConstructionAndEligibility'] is True
          assert construction['validationLabelsUsedForCandidateConstructionOrRanking'] is False
          assert construction['canaryLabelsUsedForCandidateConstructionOrRanking'] is False
          assert construction['historicalConsumedFamilyResultsUsedForConstructionOrRanking'] is False
          assert construction['measureSetGuardUsesProfessionalReference'] is False
          assert construction['eventCountPreservationRequired'] is True
          assert construction['nonPitchEventMetadataPreservationRequired'] is True
          assert construction['generatedMeasureSetPreservationRequired'] is True
          assert construction['linkedPitchTechniqueEventsEligible'] is False
          assert report['baseline']['eventCount'] == 1144
          assert report['baseline']['eventSha256'] == '68b8cdf14ed02265c5e3c204b2af51b0aae4849462e7b3e4243192d8855cc3c3'
          assert report['baseline']['generatedMeasureCount'] == 113
          assert report['fitLock']['fitOnlyRanking'] is True
          assert report['fitLock']['validationReadDuringLock'] is False
          assert report['fitLock']['canaryReadDuringLock'] is False
          assert report['fitLock']['baselineGeneratedMeasureSetPreservationRequired'] is True
          assert report['alternateAfterGateFailureAllowed'] is False
          locked = report['locked']
          assert locked['eventCount'] == 1144
          assert locked['measureSet']['baselineGeneratedMeasureCount'] == 113
          assert locked['measureSet']['candidateGeneratedMeasureCount'] == 113
          assert locked['measureSet']['missingBaselineGeneratedMeasures'] == []
          assert locked['measureSet']['extraCandidateGeneratedMeasures'] == []
          assert locked['measureSet']['baselineGeneratedMeasureSetPreserved'] is True
          assert locked['measureSet']['professionalReferenceUsed'] is False
          assert locked['changedEventCount'] >= 0
          assert report['safety']['v5Modified'] is False
          assert report['safety']['productionModified'] is False
          assert report['safety']['mainModified'] is False
          assert report['safety']['runtimeReferenceInputUsed'] is False
          assert report['safety']['modalGpuInvoked'] is False
          assert report['safety']['deterministic'] is True
          assert report['safety']['baselineGeneratedMeasureSetPreserved'] is True
          assert report['safety']['baselineEventCountPreserved'] is True

          if report['stoppedAt'] == 'fit':
              assert report['selected'] == 'accepted-v144-baseline'
              assert report['validation'] is None
              assert report['canary'] is None
              assert report['fullCalibration'] is None
          elif report['stoppedAt'] == 'validation':
              assert report['selected'] == 'accepted-v144-baseline'
              assert report['validation']['passed'] is False
              assert report['canary'] is None
              assert report['fullCalibration'] is None
          elif report['stoppedAt'] == 'canary':
              assert report['selected'] == 'accepted-v144-baseline'
              assert report['validation']['passed'] is True
              assert report['canary']['passed'] is False
              assert report['fullCalibration'] is None
          elif report['stoppedAt'] == 'full-calibration':
              assert report['selected'] == report['locked']['name']
              assert report['validation']['passed'] is True
              assert report['canary']['passed'] is True
              assert report['fullCalibration'] is not None
          else:
              raise AssertionError(report['stoppedAt'])
          PY

      - name: Reprove locked candidate PDF-event identity independently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .v144/pitch-shift-search/freeze
          python - <<'PY'
          import json
          from pathlib import Path

          locked = json.loads(Path('.v144/pitch-shift-search/locked-events.json').read_text(encoding='utf-8'))
          assert locked['runtimeReferenceInputUsed'] is False
          assert locked['baselineEventCountPreserved'] is True
          assert locked['baselineGeneratedMeasureSetPreserved'] is True
          assert len(locked['renderEvents']) == 1144
          payload = {
              'instrument': 'rhythm',
              'renderEvents': locked['renderEvents'],
              'tempoBpm': 129.19921875,
              'timeSignature': '4/4',
              'tuning': 'E Standard',
              'structuredMode': True,
              'sourceAudioSha256': '215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f',
              'referenceFree': True,
              'professionalReferenceUsed': False,
              'referenceRuntimeInputUsed': False,
              'runtimeLabelsRequired': False,
              'v143RuntimeSafetyVerified': True,
          }
          Path('.v144/pitch-shift-search/freeze-input.json').write_text(
              json.dumps(payload, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY
          python validation/rhythm_holdout/freeze_rhythm_analysis.py \
            .v144/pitch-shift-search/freeze-input.json .v144/pitch-shift-search/freeze \
            --source-commit "${GITHUB_SHA}" > .v144/pitch-shift-search/freeze.log
          cp lib/v143RenderContract.js .v144/pitch-shift-search/v143RenderContract.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { validateV143RenderEvents } from './.v144/pitch-shift-search/v143RenderContract.mjs';
          const locked = JSON.parse(await fs.readFile('.v144/pitch-shift-search/locked-events.json', 'utf8'));
          const events = validateV143RenderEvents(locked.renderEvents || []);
          if (events.length !== 1144) throw new Error(`locked event count changed: ${events.length}`);
          await fs.writeFile('.v144/pitch-shift-search/renderer-event-evidence.json', JSON.stringify({
            schemaVersion: 1,
            renderEvents: events,
            runtimeSafetyVerified: true,
            runtimeLabelsRequired: false,
            referenceOpened: false,
            professionalReferenceUsed: false,
            productionModified: false,
          }) + '\n');
          NODE
          python validation/rhythm_holdout/verify_pdf_event_fidelity.py \
            .v144/pitch-shift-search/freeze .v144/pitch-shift-search/renderer-event-evidence.json \
            > .v144/pitch-shift-search/pdf-event-fidelity.log

      - name: Attach fidelity proof and evaluate final full-gold invariant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('debug/v144-rhythm-calibration/candidates/contextual-pitch-shift-search.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          fidelity = json.loads(Path('.v144/pitch-shift-search/freeze/rhythm-pdf-event-fidelity.json').read_text(encoding='utf-8'))
          assert fidelity['passed'] is True
          assert fidelity['pdfEventFidelity'] == 1.0
          assert fidelity['frozenEventSha256'] == fidelity['pdfEventSha256']
          assert fidelity['frozenEventSha256'] == report['locked']['eventSha256']
          assert fidelity['frozenEventCount'] == report['locked']['eventCount'] == 1144

          report['lockedCandidatePdfFidelityProof'] = {
              'passed': True,
              'pdfEventFidelity': 1.0,
              'eventCount': fidelity['frozenEventCount'],
              'eventSha256': fidelity['frozenEventSha256'],
              'referenceOpenedDuringPdfFidelityCheck': False,
          }

          full = report['fullCalibration']
          if full is not None:
              full['pdfEventFidelity'] = 1.0
              full['score']['gatedMetrics']['pdfEventFidelity'] = 1.0
              deltas = full['baselineComparison']['gatedMetricDeltas']
              regressions = {
                  name: float(delta)
                  for name, delta in deltas.items()
                  if float(delta) < 0.0
              }
              measure_coverage = float(full['score']['gatedMetrics']['measureCoverageRecall'])
              critical_delta = int(full['baselineComparison']['criticalMismatchDelta'])
              invariant = (
                  report['locked']['eventCount'] == 1144
                  and report['locked']['measureSet']['baselineGeneratedMeasureSetPreserved'] is True
                  and report['locked']['measureSet']['candidateGeneratedMeasureCount'] == 113
                  and report['candidateConstruction']['nonPitchEventMetadataPreservationRequired'] is True
                  and measure_coverage == 1.0
                  and not regressions
                  and critical_delta <= 0
                  and fidelity['pdfEventFidelity'] == 1.0
              )
              full['invariantPassed'] = invariant
              full['invariantEvidence'] = {
                  'baselineEventCountPreserved': report['locked']['eventCount'] == 1144,
                  'baselineGeneratedMeasureSetPreserved': report['locked']['measureSet']['baselineGeneratedMeasureSetPreserved'],
                  'candidateGeneratedMeasureCount': report['locked']['measureSet']['candidateGeneratedMeasureCount'],
                  'nonPitchEventMetadataPreservationRequired': report['candidateConstruction']['nonPitchEventMetadataPreservationRequired'],
                  'measureCoverageRecall': measure_coverage,
                  'metricRegressions': regressions,
                  'criticalMismatchDelta': critical_delta,
                  'pdfEventFidelity': 1.0,
              }
              report['calibrationPromotionAllowed'] = invariant
              if invariant:
                  report['selectedReason'] = 'locked-pitch-shift-candidate-passed-split-and-full-calibration-invariants'
                  report['stoppedAt'] = 'complete'
              else:
                  report['selected'] = 'accepted-v144-baseline'
                  report['selectedReason'] = 'locked-pitch-shift-candidate-failed-full-calibration-invariant'
                  report['stoppedAt'] = 'full-calibration'
          else:
              report['calibrationPromotionAllowed'] = False

          report['safety']['lockedCandidatePdfFidelityReproved'] = True
          assert report['safety']['v5Modified'] is False
          assert report['safety']['productionModified'] is False
          assert report['safety']['mainModified'] is False
          assert report['safety']['runtimeReferenceInputUsed'] is False
          assert report['safety']['modalGpuInvoked'] is False
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Reverify immutable V5 and accepted baseline after search
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          test "$(git hash-object debug/v143-contextual-prune/v5-professional-pdf/final-professional-holdout-result.json)" = "511fd244f231b66d08306f97b5a47ed41f5415c7"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json | awk '{print $1}')" = "7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-rhythm-shadow.pdf | awk '{print $1}')" = "f4c1238e868cadfb90b8a359b1555b0b90e7740b9ebaa276aa394c8991f37ce5"
          test "$(git hash-object debug/v144-rhythm-calibration/selected/v144-triple-selected-baseline.json)" = "ba8dec9a1c3155816f5841a32ee52ced7998c110"
          test "$(git hash-object validation/v144_rhythm_calibration/search_contextual_pitch_shifts.py)" = "9b35de6cf94a190a8700274334fcc85c5ad986c2"
          test "$(git hash-object modal/v144_rhythm_pitch_shift_policy.py)" = "d9998c59acddba070069668d62bcb1c3cdaf2b05"

      - name: Persist only contextual pitch-shift search report
        shell: bash
        run: |
          set -euo pipefail
          report='debug/v144-rhythm-calibration/candidates/contextual-pitch-shift-search.json'
          git add "$report"
          test "$(git diff --cached --name-only)" = "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Persist V144 contextual pitch-shift calibration result'
          for attempt in 1 2 3 4 5; do
            git fetch origin v143-contextual-prune-lobo
            if git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
