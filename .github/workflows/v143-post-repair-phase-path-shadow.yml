name: V143 Post-Repair Local Phase Path Shadow

on:
  workflow_dispatch:
  push:
    branches: [v143-contextual-prune-lobo]
    paths:
      - analyzer/v143_post_repair_phase_path_shadow.py
      - analyzer/check_v143_post_repair_phase_path_shadow.py
      - analyzer/v143_repair_index_alignment_shadow.py
      - analyzer/check_v143_repair_index_alignment_shadow.py
      - .github/workflows/v143-post-repair-phase-path-shadow.yml

permissions:
  contents: write

concurrency:
  group: v143-post-repair-phase-path-shadow
  cancel-in-progress: true

jobs:
  cpu-shadow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU audio dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check --quiet numpy scipy soundfile

      - name: Static checker and anti-leakage gate
        id: static
        continue-on-error: true
        env:
          PYTHONPATH: analyzer
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/v143-phase-path
          (
            set -euo pipefail
            python -m py_compile \
              analyzer/v143_post_repair_phase_path_shadow.py \
              analyzer/check_v143_post_repair_phase_path_shadow.py \
              analyzer/v143_repair_index_alignment_shadow.py \
              analyzer/check_v143_repair_index_alignment_shadow.py
            python analyzer/check_v143_post_repair_phase_path_shadow.py
            python analyzer/check_v143_repair_index_alignment_shadow.py
            test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
            if grep -E -n 'Professionalexample|professional-rhythm-complete|rhythm-professional-holdout-score|Songsterr|Are You Gonna Go My Way|Lenny Kravitz|Craig Ross' \
              analyzer/v143_post_repair_phase_path_shadow.py \
              analyzer/check_v143_post_repair_phase_path_shadow.py \
              analyzer/v143_repair_index_alignment_shadow.py \
              analyzer/check_v143_repair_index_alignment_shadow.py; then
              echo 'Forbidden scorer/source token in local timing diagnostics' >&2
              exit 1
            fi
          ) > /tmp/v143-phase-path/static.log 2>&1
          status=$?
          cat /tmp/v143-phase-path/static.log
          exit "$status"

      - name: Run approved-audio local phase path
        id: approved
        if: steps.static.outcome == 'success'
        continue-on-error: true
        env:
          PYTHONPATH: analyzer
        shell: bash
        run: |
          set +e
          mkdir -p debug/v143-contextual-prune /tmp/v143-phase-path
          (
            set -euo pipefail
            python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          import soundfile as sf
          from v143_post_repair_phase_path_shadow import assess_post_repair_phase_path_from_samples
          from v143_repair_index_alignment_shadow import summarize_repair_index_alignment
          from v143_reference_free_beat_grid_repair import repair_reference_free_beat_grid_from_samples
          from v143_reference_free_timing import estimate_reference_free_timing

          source=Path('public/gomywayfullaitest.m4a')
          expected='215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f'
          digest=hashlib.sha256(source.read_bytes()).hexdigest()
          assert digest==expected,digest
          normalized=Path('/tmp/v143-local-phase-path.wav')
          subprocess.run([
              'ffmpeg','-y','-v','error','-i',str(source),'-map','0:a:0','-vn',
              '-ar','44100','-ac','2','-c:a','pcm_s16le',str(normalized)
          ],check=True)
          timing=estimate_reference_free_timing(normalized)
          samples,sr=sf.read(str(normalized),always_2d=False)
          repair=repair_reference_free_beat_grid_from_samples(samples,int(sr),timing)
          phase_path=assess_post_repair_phase_path_from_samples(samples,int(sr),repair.repaired_beat_times)
          index_alignment=summarize_repair_index_alignment(
              repair.original_beat_times,
              repair.repaired_beat_times,
              60.0/float(timing.tempo_bpm),
          )
          protected=subprocess.check_output(['git','hash-object','analyzer/v143_reference_free_rhythm_pipeline.py'],text=True).strip()
          out={
            'schemaVersion':2,
            'gate':'v143-post-repair-local-phase-path-approved-audio-shadow',
            'runId':int('${{ github.run_id }}'),
            'runAttempt':int('${{ github.run_attempt }}'),
            'triggerSha':'${{ github.sha }}',
            'approvedAudioSha256':digest,
            'originalTiming':{
              'tempoBpm':float(timing.tempo_bpm),
              'beatCount':len(timing.beat_times),
              'firstBeatInMeasure':int(timing.first_beat_in_measure),
              'downbeatIndexMod4':int(timing.downbeat_index_mod4),
              'barConfidence':float(timing.bar_confidence),
            },
            'repair':repair.diagnostics(),
            'phasePath':phase_path,
            'rawRepairedIndexAlignment':index_alignment,
            'invariants':{
              'referenceFree':True,
              'professionalReferenceUsed':False,
              'runtimeLabelsRequired':False,
              'repairedIntervalOutliersZero':repair.repaired_interval_outlier_count==0,
              'featureExtractionSinglePass':phase_path.get('featureExtractionPassCount')==1,
              'indexAlignmentHasMatches':int(index_alignment.get('matchedBeatCount') or 0)>0,
              'recommendationOnly':True,
              'runtimePhaseChanged':False,
              'liveRhythmOutputChanged':False,
              'productionModified':False,
              'protectedPipelineBlob':protected,
              'protectedPipelineUnchanged':protected=='7f72f8ed9b14af8bc93e95544195204d99c6bec1',
            }
          }
          failed=[key for key in ('referenceFree','repairedIntervalOutliersZero','featureExtractionSinglePass','indexAlignmentHasMatches','recommendationOnly','protectedPipelineUnchanged') if out['invariants'].get(key) is not True]
          failed += [key for key in ('professionalReferenceUsed','runtimeLabelsRequired','runtimePhaseChanged','liveRhythmOutputChanged','productionModified') if out['invariants'].get(key) is not False]
          if failed: raise SystemExit(f'local phase path invariant failure: {failed}')
          output=Path('debug/v143-contextual-prune/post-repair-local-phase-path-approved-audio-shadow.json')
          output.write_text(json.dumps(out,indent=2,allow_nan=False)+'\n')
          print(json.dumps(phase_path['summary'],sort_keys=True))
          print(json.dumps(index_alignment,sort_keys=True))
          print(f'WROTE={output}')
          PY
          ) > /tmp/v143-phase-path/approved.log 2>&1
          status=$?
          cat /tmp/v143-phase-path/approved.log
          exit "$status"

      - name: Write self-report
        if: always()
        env:
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          APPROVED_OUTCOME: ${{ steps.approved.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug/v143-contextual-prune /tmp/v143-phase-path
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def tail(path,limit=50):
              p=Path(path)
              return p.read_text(errors='replace').splitlines()[-limit:] if p.exists() else []
          protected=subprocess.check_output(['git','hash-object','analyzer/v143_reference_free_rhythm_pipeline.py'],text=True).strip()
          approved=Path('debug/v143-contextual-prune/post-repair-local-phase-path-approved-audio-shadow.json')
          out={
            'schemaVersion':2,'gate':'v143-post-repair-local-phase-path-self-report',
            'runId':int('${{ github.run_id }}'),'runAttempt':int('${{ github.run_attempt }}'),'triggerSha':'${{ github.sha }}',
            'staticOutcome':os.environ.get('STATIC_OUTCOME','unknown'),'approvedOutcome':os.environ.get('APPROVED_OUTCOME','unknown'),
            'approvedDiagnosticExists':approved.exists(),'staticLogTail':tail('/tmp/v143-phase-path/static.log'),'approvedLogTail':tail('/tmp/v143-phase-path/approved.log'),
            'referenceFree':True,'professionalReferenceUsed':False,'runtimeLabelsRequired':False,'runtimePhaseChanged':False,
            'liveRhythmOutputChanged':False,'productionModified':False,'protectedPipelineBlob':protected,
            'protectedPipelineUnchanged':protected=='7f72f8ed9b14af8bc93e95544195204d99c6bec1'
          }
          Path('debug/v143-contextual-prune/post-repair-local-phase-path-status.json').write_text(json.dumps(out,indent=2,allow_nan=False)+'\n')
          print(json.dumps({'staticOutcome':out['staticOutcome'],'approvedOutcome':out['approvedOutcome'],'approvedDiagnosticExists':out['approvedDiagnosticExists']},sort_keys=True))
          PY

      - name: Commit diagnostics race-safe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add debug/v143-contextual-prune/post-repair-local-phase-path-status.json
          if test -f debug/v143-contextual-prune/post-repair-local-phase-path-approved-audio-shadow.json; then git add debug/v143-contextual-prune/post-repair-local-phase-path-approved-audio-shadow.json; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record post-repair local phase path shadow'
          for attempt in 1 2 3 4; do
            git fetch origin v143-contextual-prune-lobo
            git rebase origin/v143-contextual-prune-lobo
            if git push origin HEAD:v143-contextual-prune-lobo; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Require successful diagnostic
        if: always()
        env:
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          APPROVED_OUTCOME: ${{ steps.approved.outcome }}
        run: |
          set -euo pipefail
          test "$STATIC_OUTCOME" = success
          test "$APPROVED_OUTCOME" = success
