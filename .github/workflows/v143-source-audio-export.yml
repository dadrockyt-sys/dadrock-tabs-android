name: V143 Source Audio Export One Shot

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-source-audio-export.yml

permissions:
  contents: read

env:
  EXPECTED_SHA256: 215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact approved source
        shell: bash
        run: |
          set -euo pipefail
          test -f public/gomywayfullaitest.m4a
          actual="$(sha256sum public/gomywayfullaitest.m4a | awk '{print $1}')"
          echo "approvedSourceSha256=$actual"
          test "$actual" = "$EXPECTED_SHA256"

      - name: Upload exact approved source
        uses: actions/upload-artifact@v4
        with:
          name: v143-approved-source-audio
          path: public/gomywayfullaitest.m4a
          if-no-files-found: error
          retention-days: 1
