name: V150 contextual singleton analysis once

on:
  push:
    paths:
      - '.github/workflows/v150-contextual-analysis-once.yml'

permissions:
  contents: write

jobs:
  analyze-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Verify frozen V150 identities
        run: |
          set -euo pipefail
          test ! -e debug/v150-contextual-singleton/phase-a-analysis.json
          test "$(git hash-object debug/v150-contextual-singleton/phase-a-reference-free-preregistration.json)" = "33f382e4880fd5c563c712d0ad3f33b167a58e68"
          test "$(git hash-object validation/v150_contextual_singleton/analyze_reference_free.py)" = "ddb7a21db5d4bb58e349bd543ff787f8986d06e6"
          test "$(git hash-object debug/v150-contextual-singleton/phase-a-attempt-sentinel.json)" = "30614d2fdcc9c6550c9242855c078b02ef7b023e"
          test "$(git hash-object debug/v149-singleton-confidence/candidate/candidate.json)" = "2590b7b00ad77bcb297d02764e9df556b5bb487a"
          python validation/v150_contextual_singleton/analyze_reference_free.py --help >/dev/null
      - name: Consume analysis attempt and checkpoint
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path('debug/v150-contextual-singleton/phase-a-attempt-sentinel.json')
          d = json.loads(p.read_text())
          if d.get('status') != 'ARMED_NOT_CONSUMED' or d.get('scoreCallCount') != 0:
              raise SystemExit('V150 attempt is not cleanly armed')
          d['status'] = 'CONSUMED_BEFORE_REFERENCE_FREE_ANALYSIS'
          d['runId'] = os.environ['RUN_ID']
          d['runHeadSha'] = os.environ['HEAD_SHA']
          d['consumedAtUtc'] = datetime.now(timezone.utc).isoformat()
          p.write_text(json.dumps(d, indent=2, sort_keys=True)+'\n')
          cp = Path('docs/checkpoints/CURRENT_STATE.md')
          marker = '## V150 Phase A local-context analysis — ARMED / REFERENCE-FREE — 2026-08-27 UTC'
          text = cp.read_text()
          if marker not in text:
              text += f'''\n\n{marker}\n- V149 completed at **34.450% pitch content / 6.507% pitch timing / 5.359% string-fret / 5.667% chord pitch-set / 100% coverage / 100% PDF**, with critical mismatches **1722** versus accepted baseline **1712**.\n- V150 does not tune another evidence threshold. It profiles exactly the 54 V149 edits using immediate accepted-neighbor voice-leading context only.\n- Preregistration blob `33f382e4880fd5c563c712d0ad3f33b167a58e68`; analyzer blob `ddb7a21db5d4bb58e349bd543ff787f8986d06e6`; run `{os.environ['RUN_ID']}`.\n- Gold/reference **NO**; prior score-result read by analyzer **NO**; scorer calls **0**; candidate construction/search **NO**; audio/HPSS/CQT/Modal/GPU/main/Production/promotion **NO**.\n'''
              cp.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/v150-contextual-singleton/phase-a-attempt-sentinel.json docs/checkpoints/CURRENT_STATE.md
          git commit -m 'debug: checkpoint V150 context analysis attempt [skip ci]'
          git push origin HEAD:v143-contextual-prune-lobo
      - name: Run frozen reference-free contextual analysis
        run: |
          set -euo pipefail
          python validation/v150_contextual_singleton/analyze_reference_free.py --output debug/v150-contextual-singleton/phase-a-analysis.json | tee /tmp/v150-analysis-summary.json
      - name: Verify persist checkpoint and self-seal
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p = Path('debug/v150-contextual-singleton/phase-a-analysis.json')
          payload = p.read_bytes()
          sha = hashlib.sha256(payload).hexdigest()
          r = json.loads(payload)
          if r.get('gate') != 'GO' or (r.get('population') or {}).get('eventCount') != 54:
              raise SystemExit('V150 analysis gate mismatch')
          s = r.get('safety') or {}
          if s.get('scoreCallCount') != 0 or s.get('goldOrReferenceRead') is not False or s.get('priorScoreResultRead') is not False or s.get('candidateConstructed') is not False:
              raise SystemExit('V150 safety mismatch')
          def row(rows, key):
              return next((x for x in rows if x['key'] == key), {'count':0,'percentOf54':0.0})
          worse = row(r['contextRelationship'], 'strict-both-sides-worse')
          better = row(r['contextRelationship'], 'strict-both-sides-better')
          mixed = row(r['contextRelationship'], 'mixed')
          higher = row(r['totalCostDeltaClass'], 'selected-total-cost-higher')
          lower = row(r['totalCostDeltaClass'], 'selected-total-cost-lower')
          pc_orig = row(r['pitchClassWindowSupport'], 'original-pitch-class-more-supported')
          pc_sel = row(r['pitchClassWindowSupport'], 'selected-pitch-class-more-supported')
          q = r['totalVoiceLeadingCostDeltaQuantiles']
          cp = Path('docs/checkpoints/CURRENT_STATE.md')
          marker = '## V150 Phase A local-context analysis — COMPLETE / SEALED — 2026-08-27 UTC'
          text = cp.read_text()
          if marker in text:
              raise SystemExit('duplicate V150 final checkpoint')
          text += f'''\n\n{marker}\n- Frozen reference-free analysis completed in run `{os.environ['RUN_ID']}` over exactly **54/54 V149 changed singleton events**. Result SHA256 **`{sha}`**.\n- Strictly worse to both immediate neighboring onsets: **{worse['count']}/54 = {worse['percentOf54']:.2f}%**; strictly better to both: **{better['count']}/54 = {better['percentOf54']:.2f}%**; mixed: **{mixed['count']}/54 = {mixed['percentOf54']:.2f}%**.\n- Total voice-leading cost higher after V149 change: **{higher['count']}/54 = {higher['percentOf54']:.2f}%**; lower: **{lower['count']}/54 = {lower['percentOf54']:.2f}%**; median total cost delta **{q['p50']:.3f} semitones**.\n- Local +/-2-onset pitch-class support favors original: **{pc_orig['count']}/54 = {pc_orig['percentOf54']:.2f}%**; favors selected: **{pc_sel['count']}/54 = {pc_sel['percentOf54']:.2f}%**.\n- These are context percentages, **not accuracy scores**. Gold/reference **NO**; prior score result read by analyzer **NO**; scorer calls **0**; no candidate/search/threshold sweep/audio/GPU/Production.\n- Phase A is sealed and this workflow is deleted. If strict-both-sides-worse cases exist, the preregistered next candidate may revert exactly that set and nothing else.\n'''
          cp.write_text(text)
          PY
          git rm .github/workflows/v150-contextual-analysis-once.yml
          git add debug/v150-contextual-singleton/phase-a-analysis.json docs/checkpoints/CURRENT_STATE.md
          git commit -m 'debug: persist and seal V150 context analysis [skip ci]'
          git push origin HEAD:v143-contextual-prune-lobo
