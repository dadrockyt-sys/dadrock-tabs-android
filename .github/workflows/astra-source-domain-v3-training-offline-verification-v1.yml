name: Astra source-domain V3 training offline verification V1

on:
  push:
    branches: [astra-work]
    paths:
      - 'docs/astra/SOURCE_DOMAIN_V3_SYNTHETIC_TRAINING_VERIFICATION_LAUNCH_V1.json'

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'

      - name: Validate verification launch
        run: |
          python - <<'PY'
          import json
          x=json.load(open('docs/astra/SOURCE_DOMAIN_V3_SYNTHETIC_TRAINING_VERIFICATION_LAUNCH_V1.json'))
          assert x['schema']=='astra-source-domain-v3-training-verification-launch-v1'
          assert x['status']=='armed'
          assert x['launchIdentity']=='source-domain-v3-training-verify-20260928-canonical-01'
          assert x['optimizerSteps']==0
          assert x['modelFitCalls']==0
          assert x['automaticRetry'] is False
          assert x['p1Access'] is False and x['p2Access'] is False and x['p3Access'] is False
          print('V3_TRAINING_VERIFICATION_LAUNCH_OK')
          PY

      - name: Install frozen CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          python -m pip install --disable-pip-version-check pytest

      - name: Download exact frozen control
        uses: actions/download-artifact@v4
        with:
          name: astra-source-domain-simulator-preparation-v1
          path: /tmp/astra-source-domain-control
          github-token: ${{ github.token }}
          repository: dadrockyt-sys/dadrock-tabs-android
          run-id: '36475263654'

      - name: Download exact V2 training support
        uses: actions/download-artifact@v4
        with:
          name: astra-source-domain-v2-stage-b-v1
          path: /tmp/astra-source-domain-v2-stage-b
          github-token: ${{ github.token }}
          repository: dadrockyt-sys/dadrock-tabs-android
          run-id: '36485375684'

      - name: Download exact V3 challenge
        uses: actions/download-artifact@v4
        with:
          name: astra-source-domain-v3-final-coverage-v2
          path: /tmp/astra-source-domain-v3-final
          github-token: ${{ github.token }}
          repository: dadrockyt-sys/dadrock-tabs-android
          run-id: '36487005586'

      - name: Verify exact artifact files
        shell: bash
        run: |
          set -euo pipefail
          CONTROL=/tmp/astra-source-domain-control/datasets/s9-control.npz
          INTERVENTION=/tmp/astra-source-domain-v2-stage-b/v2-intervention.npz
          CHALLENGE=/tmp/astra-source-domain-v3-final/v3-primary-challenge.npz
          test -f "$CONTROL"
          test -f "$INTERVENTION"
          test -f "$CHALLENGE"
          test "$(sha256sum "$CONTROL" | awk '{print $1}')" = "16123bfab56050e355e424be0050b11e6447b24c32c105da86c0ec971d599894"
          test "$(sha256sum "$INTERVENTION" | awk '{print $1}')" = "a17a16daeb8d698e325dc6820f18d5eda2fec75d9beebe2a9605a678124dc26b"
          test "$(sha256sum "$CHALLENGE" | awk '{print $1}')" = "368032e81722a4ca97bf2ec81b432b90ef2fc982cac20c8bd543d34f514d9bce"
          echo V3_TRAINING_FROZEN_FILES_OK

      - name: Focused V3 training package tests
        env:
          PYTHONPATH: astra_backend
        run: |
          pytest -q astra_backend/synthetic/test_source_domain_v3_synthetic_training_v1.py

      - name: Verify datasets with zero optimizer steps
        env:
          PYTHONPATH: astra_backend
        run: |
          python -m synthetic.source_domain_v3_synthetic_training_v1 verify \
            --control /tmp/astra-source-domain-control/datasets/s9-control.npz \
            --intervention /tmp/astra-source-domain-v2-stage-b/v2-intervention.npz \
            --challenge /tmp/astra-source-domain-v3-final/v3-primary-challenge.npz

      - name: Verify paired initialization and batch plans without fitting
        env:
          PYTHONPATH: astra_backend
        run: |
          python -m synthetic.source_domain_v3_synthetic_training_v1 pairing-check \
            --control /tmp/astra-source-domain-control/datasets/s9-control.npz \
            --intervention /tmp/astra-source-domain-v2-stage-b/v2-intervention.npz

      - name: Write verification receipt
        shell: bash
        run: |
          mkdir -p /tmp/astra-v3-training-verification
          python - <<'PY'
          import hashlib,json,pathlib
          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              return h.hexdigest()
          receipt={
            'schema':'astra-source-domain-v3-training-offline-verification-v1',
            'status':'passed',
            'sourceGitBlobs':{
              'runner':'4200536e693da7fbd0bb8980ebc6a0fd98cf273f',
              'tests':'e9a6c705e54340ca1e1e610830802aef9a1f7755',
              's11':'d4aacc4081ed2ff851c7879ee4dc08d757c8a3d8',
              'v1Gate':'3c9e92d6386707369ef071b60cd9d5d5d5b8558d',
              'design':'c914ccc32af9ceaf5d5e6e7db88835f1e06b1645',
              'spec':'07fe0dba6ed074e40632a8fc47e24f23a519427f',
            },
            'fileSha256':{
              'control':sha('/tmp/astra-source-domain-control/datasets/s9-control.npz'),
              'intervention':sha('/tmp/astra-source-domain-v2-stage-b/v2-intervention.npz'),
              'challenge':sha('/tmp/astra-source-domain-v3-final/v3-primary-challenge.npz'),
            },
            'execution':{
              'modelInitializations':6,
              'modelFitCalls':0,
              'optimizerSteps':0,
              'modelInference':False,
              'thresholdSearch':False,
              'thresholdRetuning':False,
              'automaticRetry':False,
              'p1Accessed':False,'p2Accessed':False,'p3Opened':False,
              'paidComputeDollars':0,'productionMutation':False,
            }
          }
          pathlib.Path('/tmp/astra-v3-training-verification/receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('V3_TRAINING_OFFLINE_VERIFICATION_OK')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: astra-source-domain-v3-training-offline-verification-v1
          path: /tmp/astra-v3-training-verification/receipt.json
          if-no-files-found: error
          retention-days: 30
