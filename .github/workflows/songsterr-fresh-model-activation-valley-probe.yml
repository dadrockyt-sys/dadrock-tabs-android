name: Songsterr Fresh Model Activation Valley Probe

on:
  workflow_dispatch:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-model-activation-valley-probe.yml'
      - 'scripts/songsterr-fresh/probe_model_activation_valleys.py'

permissions:
  contents: read

jobs:
  activation-valley-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out fresh branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch and decode exact authorized fixture
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/dadrockyt-sys/dadrock-tabs-android/main/public/jimmy-paige-midterm-v1/gomyway-midterm-source.m4a' \
            --output /tmp/gomyway-midterm-source.m4a
          test "$(git hash-object /tmp/gomyway-midterm-source.m4a)" = '4dd709e3fa177b4daeed71ca97f0199757729d4b'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -loglevel error -y -i /tmp/gomyway-midterm-source.m4a -ac 1 -ar 22050 /tmp/gomyway-midterm-analysis.wav
          ffmpeg -hide_banner -loglevel error -y -i /tmp/gomyway-midterm-source.m4a -ac 2 -ar 44100 /tmp/gomyway-midterm-separation.wav

      - name: Install pinned analysis dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 \
            demucs==4.1.0 \
            basic-pitch==0.4.0 \
            librosa==0.11.0 \
            soundfile==0.13.1

      - name: Rebuild frozen structure and isolate guitar
        shell: bash
        run: |
          set -euo pipefail
          BASE=/tmp/songsterr-fresh-activation-probe
          mkdir -p "$BASE"
          python scripts/songsterr-fresh/analyze_full_mixture_structure.py \
            --input /tmp/gomyway-midterm-analysis.wav \
            --output "$BASE/raw-structure-analysis.json" \
            --audio-source 'public/jimmy-paige-midterm-v1/gomyway-midterm-source.m4a@main#4dd709e3fa177b4daeed71ca97f0199757729d4b'
          node scripts/songsterr-fresh/build_structure_map.mjs "$BASE/raw-structure-analysis.json" "$BASE/adapted-structure-map.json"
          node scripts/songsterr-fresh/build_note_evidence_context.mjs "$BASE/adapted-structure-map.json" "$BASE/note-evidence-context.json"
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          const c = JSON.parse(await readFile('/tmp/songsterr-fresh-activation-probe/note-evidence-context.json', 'utf8'));
          if (c?.structureIdentity?.signature !== 'fnv1a32:2f493225') throw new Error('FROZEN_STRUCTURE_IDENTITY_CHANGED');
          NODE
          python -m demucs -n htdemucs_6s --device cpu --shifts 1 --overlap 0.25 --segment 7 \
            -o "$BASE/separated" /tmp/gomyway-midterm-separation.wav

      - name: Reproduce current model evidence and v2 durations
        shell: bash
        run: |
          set -euo pipefail
          BASE=/tmp/songsterr-fresh-activation-probe
          STEM="$BASE/separated/htdemucs_6s/gomyway-midterm-separation/guitar.wav"
          STEM_SHA="$(sha256sum "$STEM" | awk '{print $1}')"
          python scripts/songsterr-fresh/transcribe_isolated_guitar_basic_pitch.py \
            --input "$STEM" \
            --output "$BASE/basic-pitch-guitar-notes.json" \
            --audio-source 'public/jimmy-paige-midterm-v1/gomyway-midterm-source.m4a@main#4dd709e3fa177b4daeed71ca97f0199757729d4b' \
            --separation-source "demucs==4.1.0/htdemucs_6s:guitar@sha256:${STEM_SHA}"
          node scripts/songsterr-fresh/build_isolated_polyphonic_note_evidence.mjs \
            "$BASE/note-evidence-context.json" \
            "$BASE/basic-pitch-guitar-notes.json" \
            "$BASE/raw-model-note-evidence-duration-free.json"
          python scripts/songsterr-fresh/estimate_selected_pitch_releases.py \
            --allow-model-upstream \
            --input "$STEM" \
            --evidence "$BASE/raw-model-note-evidence-duration-free.json" \
            --output "$BASE/raw-model-note-evidence-v2.json"

      - name: Probe fixed activation plus spectral valley rule
        shell: bash
        run: |
          set -euo pipefail
          BASE=/tmp/songsterr-fresh-activation-probe
          STEM="$BASE/separated/htdemucs_6s/gomyway-midterm-separation/guitar.wav"
          python scripts/songsterr-fresh/probe_model_activation_valleys.py \
            --input "$STEM" \
            --evidence "$BASE/raw-model-note-evidence-v2.json" \
            --output "$BASE/activation-valley-probe.json"
          python - <<'PY'
          import json
          path = '/tmp/songsterr-fresh-activation-probe/activation-valley-probe.json'
          with open(path, 'r', encoding='utf-8') as handle:
              data = json.load(handle)
          if data.get('contract') != 'songsterr-fresh-model-activation-valley-probe-v1':
              raise SystemExit('ACTIVATION_PROBE_CONTRACT_CHANGED')
          if data.get('descriptiveOnly') is not True or data.get('changesDuration') is not False:
              raise SystemExit('ACTIVATION_PROBE_MUST_REMAIN_DESCRIPTIVE_ONLY')
          identity = data.get('identityProof', {})
          if identity.get('modelEventCount') != 1128 or identity.get('evidenceEventCount') != 1128:
              raise SystemExit('ACTIVATION_PROBE_EXPECTS_EXACT_1128_EVENT_IDENTITY')
          if identity.get('exactMidiIdentityPreserved') is not True:
              raise SystemExit('ACTIVATION_PROBE_MIDI_IDENTITY_CHANGED')
          diagnostics = data.get('diagnostics', {})
          if diagnostics.get('reattackCensoredExaminedCount') != 517:
              raise SystemExit(f"ACTIVATION_PROBE_EXPECTS_517_REATTACK_CASES:{diagnostics.get('reattackCensoredExaminedCount')}")
          guards = data.get('hardGuards', {})
          if any(guards.get(key) is not False for key in ('decodedModelNoteEndsUsed', 'nextOnsetUsedAsDuration', 'writesSourceEnd', 'writesDurationSeconds', 'changesPitchIdentity')):
              raise SystemExit('ACTIVATION_PROBE_GUARDS_CHANGED')
          def forbidden(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key in {'durationSeconds', 'sourceEnd'}:
                          return key
                      found = forbidden(child)
                      if found:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = forbidden(child)
                      if found:
                          return found
              return None
          found = forbidden(data)
          if found:
              raise SystemExit(f'ACTIVATION_PROBE_WROTE_FORBIDDEN_ACTIVE_DURATION_FIELD:{found}')
          print(json.dumps({
              'identityProof': identity,
              'fixedEvidenceRule': data.get('fixedEvidenceRule'),
              'diagnostics': diagnostics,
              'hardGuards': guards,
          }, indent=2))
          PY

      - name: Re-run fresh deterministic suite
        working-directory: songsterr_pipeline
        run: npm test

      - name: Upload activation valley evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songsterr-fresh-model-activation-valley-probe
          path: /tmp/songsterr-fresh-activation-probe/*.json
          if-no-files-found: warn
          retention-days: 14
