name: V153 Phase E measure-35 temporal map once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v153-measure35-temporal-map-once.yml

permissions:
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo
  SENTINEL: debug/v153-reference-free-strength/phase-e-attempt-sentinel.json
  OUTPUT: debug/v153-reference-free-strength/phase-e-measure35-temporal-map.json
  CUDA_VISIBLE_DEVICES: ""

jobs:
  map-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Guard frozen Phase E boundary
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          test ! -e "$SENTINEL"
          test ! -e "$OUTPUT"
          test "$(git hash-object debug/v153-reference-free-strength/phase-e-measure35-temporal-map-preregistration.json)" = "57eca109b51bc3f5c0685c3771d92b369a6d1c80"
          test "$(git hash-object validation/v153_reference_free_strength/map_measure35_temporal_context.py)" = "6ea4ee141863dd6613e689393790e6e6482c1e50"
          test "$(git hash-object debug/v153-reference-free-strength/phase-d-event347-attribution.json)" = "46d934ee48e125ec91b6fd5a070b081477f34472"
          test "$(git hash-object debug/v153-reference-free-strength/candidate/candidate.json)" = "975ab36c234b423d1b56e59588e960f7d9d7103f"

      - name: Checkpoint and consume before Gold temporal map
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          s=Path(os.environ['SENTINEL'])
          s.parent.mkdir(parents=True,exist_ok=True)
          s.write_text(json.dumps({
            'schema':'dadrock.tabs.v153.phase-e-attempt.v1',
            'status':'CONSUMED_BEFORE_GOLD_TEMPORAL_MAP',
            'runId':os.environ['RUN_ID'],
            'runHeadSha':os.environ['HEAD_SHA'],
            'consumedAtUtc':datetime.now(timezone.utc).isoformat(),
            'preregistrationGitBlob':'57eca109b51bc3f5c0685c3771d92b369a6d1c80',
            'analyzerGitBlob':'6ea4ee141863dd6613e689393790e6e6482c1e50',
            'scoreCallCount':0,
            'candidateModified':False,
            'modalL4CudaGpuUsed':False
          },indent=2,sort_keys=True)+'\n')
          cp=Path('docs/checkpoints/CURRENT_STATE.md')
          text=cp.read_text()
          marker='## V153 Phase E measure-35 temporal map — FROZEN / CONSUMED / BEFORE GOLD MAP — 2026-08-27 UTC'
          if marker in text: raise SystemExit('duplicate Phase E pre-execution checkpoint')
          text += f'''\n\n{marker}\n- CPU-only Phase E was frozen before execution under the standing authorization policy.\n- Preregistration blob `57eca109b51bc3f5c0685c3771d92b369a6d1c80`; analyzer blob `6ea4ee141863dd6613e689393790e6e6482c1e50`; run `{os.environ['RUN_ID']}`.\n- Scope: map all accepted/V153/Gold notes in measure 35, locate the Gold MIDI-62 note, calculate event-347 timing distances, and replay scorer matching primitives diagnostically only.\n- At this checkpoint Gold temporal map has not run yet; new score calls `0`; candidate modification/search/tuning/audio/Modal/L4/CUDA/GPU/main/Production/promotion `NO`.\n'''
          cp.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SENTINEL" docs/checkpoints/CURRENT_STATE.md
          git commit -m 'debug: checkpoint consumed V153 Phase E attempt [skip ci]'
          git push origin "HEAD:$BRANCH"

      - name: Run frozen measure-35 temporal map
        run: |
          set -euo pipefail
          python validation/v153_reference_free_strength/map_measure35_temporal_context.py --output "$OUTPUT" | tee /tmp/v153-phase-e-summary.json

      - name: Verify and persist Phase E result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path(os.environ['OUTPUT']).read_text())
          assert r['gate']=='GO_MAPPED'
          assert r['measure']==35
          assert len(r['goldMidi62'])==1
          assert len(r['goldMidi61'])==0
          assert r['event347']['pitchContentCreditClassification']=='MEASURE_LEVEL_ONLY_CREDIT_NO_LOCAL_TIMING_SUPPORT'
          assert r['interpretation']['measureLevelPitchContentShouldBeDiagnosticOnlyForThisEvent'] is True
          assert r['safety']['scoreCallCount']==0
          assert r['safety']['candidateModified'] is False
          assert r['safety']['modalL4CudaGpuUsed'] is False
          PY
          git add "$OUTPUT"
          git commit -m 'debug: persist V153 Phase E measure-35 temporal map [skip ci]'
          git push origin "HEAD:$BRANCH"

      - name: Upload Phase E evidence
        uses: actions/upload-artifact@v4
        with:
          name: v153-measure35-temporal-map-${{ github.run_id }}
          path: |
            debug/v153-reference-free-strength/phase-e-attempt-sentinel.json
            debug/v153-reference-free-strength/phase-e-measure35-temporal-map.json
          retention-days: 30
