name: Full Mixture Product Placement Candidate Validation V1

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - '.github/workflows/full-mixture-product-placement-candidate-validation-v1.yml'
      - 'analyzer/full_mixture_product_placement_candidate_v1.mjs'
      - 'analyzer/verify_full_mixture_product_placement_candidate_validation_v1.mjs'
      - 'lib/jimmyPaigeAnalysisPayload.js'
      - 'lib/v143RenderContract.js'
      - 'lib/aiTabConditioningV1.mjs'
      - 'lib/aiTabMixtureStructureContextV1.mjs'
      - 'lib/aiTabAnalyzerMixtureObservationAdmissionV1.mjs'
      - 'lib/aiTabDualContextShadowFusionV1.mjs'
      - 'lib/aiTabConditionedShadowProjectionV1.mjs'

permissions:
  contents: read

jobs:
  verify-product-placement-candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Phase 10 P1-P12
        env:
          FULL_MIXTURE_PRODUCT_PLACEMENT_CANDIDATE_V1_RESULT_PATH: debug/v143-contextual-prune/full-mixture-product-placement-candidate-validation-v1.json
        run: node analyzer/verify_full_mixture_product_placement_candidate_validation_v1.mjs

      - name: Enforce safety evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const data = JSON.parse(await readFile(
            'debug/v143-contextual-prune/full-mixture-product-placement-candidate-validation-v1.json',
            'utf8'
          ));

          if (data.passed !== true) {
            throw new Error('Phase 10 product-placement candidate contract failed');
          }

          if (
            Object.keys(data.tests || {}).length !== 12 ||
            !Object.values(data.tests || {}).every((value) => value === 'PASS')
          ) {
            throw new Error('Phase 10 P1-P12 evidence incomplete');
          }

          if (
            data.referenceBlind !== true ||
            data.experimentOnly !== true ||
            data.placementOnlyAuthority !== true
          ) {
            throw new Error('Phase 10 must remain reference-blind, experiment-only and placement-only');
          }

          if (
            data.productContractValidatorAcceptedCandidate !== true ||
            data.instrumentAuthorityInvariant !== true ||
            data.existingAuthenticatedRenderEventsOverridden !== false ||
            data.canonicalPayloadMutated !== false
          ) {
            throw new Error('Phase 10 candidate integrity evidence missing');
          }

          if (
            data.syntheticBaselineStructuredPlacementCoverage !== 0 ||
            data.syntheticCandidateStructuredPlacementCoverage !== 1 ||
            data.syntheticCandidateExactKnownTruthRate !== 1
          ) {
            throw new Error('Phase 10 known-truth synthetic placement result is not exact');
          }

          for (const key of [
            'liveProductWiringChanged',
            'pdfAuthorityChanged',
            'canonicalAnalyzerOutputChanged',
            'externalAudioAssetsUsed',
            'guitarSetRead',
            'splitMySongRead',
            'goatRestrictedBytesRead',
            'modalInvoked',
            'gpuUsed',
            'mainModified',
            'productionModified',
            'productionPromotionAuthorized',
          ]) {
            if (data[key] !== false) {
              throw new Error(`Safety invariant failed: ${key}`);
            }
          }

          if (data.referenceScoreCalls !== 0) {
            throw new Error('Reference score calls must remain zero');
          }

          console.log('PHASE 10 PRODUCT PLACEMENT CANDIDATE P1-P12 PASSED');
          NODE
