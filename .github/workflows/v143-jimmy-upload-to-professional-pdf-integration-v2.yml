name: V143 Jimmy PAIge Upload To Professional PDF Integration V2

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-jimmy-upload-to-professional-pdf-integration-v2.yml

permissions:
  contents: write

jobs:
  integrate-upload-to-pdf-v2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic gated integration
        shell: bash
        run: |
          set -euo pipefail
          python analyzer/apply_jimmy_paige_upload_to_pdf_integration.py

      - name: Validate contracts and route syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug/v143-contextual-prune
          node --check lib/jimmyPaigeAnalysisPayload.js
          node --check lib/jimmyPaigeProfessionalPdfContract.js
          node --check lib/createJimmyPaigeProfessionalPdf.js
          node --check app/api/analyze-audio-tab/route.js
          node --check app/api/generate-tab-preview/route.js
          node --check app/api/generate-tab-pdf/route.js
          python analyzer/check_jimmy_paige_professional_pdf_bridge.py \
            > debug/v143-contextual-prune/jimmy-paige-professional-pdf-bridge-check-v2.json
          python analyzer/check_jimmy_paige_upload_to_pdf_path.py \
            | tee debug/v143-contextual-prune/jimmy-paige-upload-to-professional-pdf-path.json

      - name: Enforce feature gate and transport closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path('debug/v143-contextual-prune/jimmy-paige-upload-to-professional-pdf-path.json')
              .read_text(encoding='utf-8')
          )
          assert data['passed'] is True
          assert data['featureGate'] == 'JIMMY_PAIGE_PROFESSIONAL_PDF_V1'
          assert data['featureGateDefault'] == 'off'
          assert data['mainModified'] is False
          assert data['productionPromotionPerformed'] is False
          assert data['nextRequiredStage'] == 'measure-grid-production-from-reference-free-timing'
          print('Gated Jimmy PAIge upload-to-PDF transport PASSED')
          PY

      - name: Commit gated integration
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            app/ai-tab/page.js \
            app/api/generate-tab-pdf/route.js \
            debug/v143-contextual-prune/jimmy-paige-professional-pdf-bridge-check-v2.json \
            debug/v143-contextual-prune/jimmy-paige-upload-to-professional-pdf-path.json

          if git diff --cached --quiet; then
            echo "No gated integration changes to commit." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Wire Jimmy PAIge analysis into gated professional PDF path"
          git push origin HEAD:v143-contextual-prune-lobo
