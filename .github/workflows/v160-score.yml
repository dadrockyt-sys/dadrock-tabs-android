name: V160 one-shot professional-reference CPU score

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v160-score.yml

permissions:
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: 33e6f4286557ce08ce1c6cd10576a20e828039aa
  CANDIDATE: debug/v160-cpu-autonomous/generated.json
  STRUCTURAL_QC: debug/v160-cpu-autonomous/structural-qc.json
  GENERATION_TERMINAL: debug/v160-cpu-autonomous/terminal-freeze.json
  SCORE_PREREG: debug/v160-cpu-autonomous/score-preregistration.json
  SCORER: validation/v154_cpu_multitrack/score_frontend_reference.py
  REFERENCE: research/v154-professional-references/scorer-ready/frontend-reference-payload.json
  SCORE: debug/v160-cpu-autonomous/reference-score.json
  SCORE_TERMINAL: debug/v160-cpu-autonomous/score-terminal-freeze.json
  CUDA_VISIBLE_DEVICES: ""

jobs:
  score-once:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify sealed one-score boundary
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v160-score.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"

          test "$(git hash-object "$CANDIDATE")" = "892be048486c843ae5d3268e35f84cd95b4245af"
          test "$(sha256sum "$CANDIDATE" | awk '{print $1}')" = "db6b8428fac758d5c0fd750b797152dbd9c3f7295c3b6c6872ee631ee8c8ff76"
          test "$(git hash-object "$STRUCTURAL_QC")" = "5372885dfc9e07dfa8394294deafdf32c8f5a356"
          test "$(sha256sum "$STRUCTURAL_QC" | awk '{print $1}')" = "2bb154499a849596f9e6e098df232d69a72379aa8508544dfa748797e23c3f34"
          test "$(git hash-object "$GENERATION_TERMINAL")" = "9690c523290955dcf0ef15074bb6746105ec0810"
          test "$(git hash-object "$SCORE_PREREG")" = "8cdc8f8d561124b7d417d5de7ea96fae5e0ec4ed"
          test "$(git hash-object "$SCORER")" = "9644e65719fbd361a9b39778ae9950c5e983e855"
          test "$(git hash-object "$REFERENCE")" = "2fbed60b543c0488934d8642c488aa06bf31bbf5"
          test "$(sha256sum "$REFERENCE" | awk '{print $1}')" = "b39a203aec3f45800891fe4eca156e37e7571b91ea5c4ccc41b30bbc95fc89e7"

          test ! -e "$SCORE"
          test ! -e "$SCORE_TERMINAL"
          test ! -e .github/workflows/v160-generate.yml

          python - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/v160-score.yml").read_text()
          needle = 'python "$SCORER" "$CANDIDATE" "$REFERENCE" --output "$SCORE" > /tmp/v160-score-stdout.json'
          assert sum(line.strip() == needle for line in text.splitlines()) == 1
          PY

          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          candidate = Path("debug/v160-cpu-autonomous/generated.json")
          structural = json.loads(Path("debug/v160-cpu-autonomous/structural-qc.json").read_text())
          terminal = json.loads(Path("debug/v160-cpu-autonomous/terminal-freeze.json").read_text())
          prereg = json.loads(Path("debug/v160-cpu-autonomous/score-preregistration.json").read_text())

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          assert prereg["schema"] == "dadrock.tabs.v160.professional-reference-score-preregistration.v1"
          assert prereg["status"] == "SEALED_BEFORE_REFERENCE_OR_SCORER_OPEN"
          assert prereg["validation"] == "PASS"
          assert prereg["frozenCandidate"]["sha256"] == sha256(candidate)
          assert prereg["frozenCandidate"]["gitBlob"] == "892be048486c843ae5d3268e35f84cd95b4245af"
          assert prereg["frozenCandidate"]["candidateAuthoritative"] is True
          assert prereg["frozenCandidate"]["eligibleForProfessionalReferenceScoring"] is True

          assert structural["validation"] == "PASS"
          assert structural["errors"] == []
          assert structural["candidateSha256"] == prereg["frozenCandidate"]["sha256"]
          assert all(structural["checks"].values())

          assert terminal["status"] == "TERMINAL"
          assert terminal["outcome"] == "STRUCTURAL_QC_PASS"
          assert terminal["candidateAuthoritative"] is True
          assert terminal["eligibleForProfessionalReferenceScoring"] is True
          assert terminal["neverRearmV160"] is True
          assert terminal["workflowRunId"] == 33205440520
          assert terminal["workflowRunNumber"] == 1
          assert terminal["workflowRunAttempt"] == 1
          assert terminal["workflowHeadSha"] == "a66d4b23ba625ee1583aa9d6f11eb0115efb2de2"

          assert prereg["generationTerminalIdentity"]["terminalCommit"] == "4e4b4c57dafeca61bc4a829929f8c4909133cbff"
          assert prereg["generationTerminalIdentity"]["workflowRunId"] == 33205440520
          assert prereg["generationTerminalIdentity"]["workflowRunNumber"] == 1
          assert prereg["generationTerminalIdentity"]["workflowRunAttempt"] == 1
          assert prereg["generationTerminalIdentity"]["jobId"] == 98965166224
          assert prereg["generationTerminalIdentity"]["terminalFreezeGitBlob"] == "9690c523290955dcf0ef15074bb6746105ec0810"
          assert prereg["structuralQcIdentity"]["sha256"] == "2bb154499a849596f9e6e098df232d69a72379aa8508544dfa748797e23c3f34"
          assert prereg["structuralQcIdentity"]["validation"] == "PASS"

          assert prereg["frozenScorerIdentity"]["gitBlob"] == "9644e65719fbd361a9b39778ae9950c5e983e855"
          assert prereg["frozenProfessionalReferenceIdentity"]["gitBlob"] == "2fbed60b543c0488934d8642c488aa06bf31bbf5"
          assert prereg["frozenProfessionalReferenceIdentity"]["sha256"] == "b39a203aec3f45800891fe4eca156e37e7571b91ea5c4ccc41b30bbc95fc89e7"

          contract = prereg["scoreContract"]
          assert contract["scoringDevice"] == "cpu"
          assert contract["scoreWorkflowPath"] == ".github/workflows/v160-score.yml"
          assert contract["scoreReceiptPath"] == "debug/v160-cpu-autonomous/reference-score.json"
          assert contract["workflowCreationIsSoleTrigger"] is True
          assert contract["expectedWorkflowRunCount"] == 1
          assert contract["expectedRunNumber"] == 1
          assert contract["expectedRunAttempt"] == 1
          assert contract["maximumProfessionalReferenceScoreExecutions"] == 1
          for key in (
              "rerunForbidden", "secondArmForbidden", "duplicateRunForbidden",
              "candidateMutationForbidden", "candidateReplacementForbidden",
              "candidateReQcForbidden", "thresholdSweepForbidden",
              "variantSelectionForbidden", "humanCorrectionForbidden",
              "postScoreRetuneForbidden", "postScoreRescoreForbidden",
              "workflowMustSelfDeleteAfterSingleScore",
              "workflowMustSelfSealScoreReceipt",
              "assistantOrManualBranchWritesWhileScoreWorkflowActiveForbidden",
          ):
              assert contract[key] is True, key

          gates = prereg["scoreGates"]
          assert gates["guitarTimingAwarePitchF1Minimum"] == 0.8
          assert gates["bassTimingAwarePitchF1Minimum"] == 0.8
          assert gates["bothMustPassToProceedToRoleStringFretTechniquePdfPhase"] is True
          assert gates["candidateConsumedRegardlessOfPassFail"] is True

          safety = prereg["preScoreSafety"]
          assert safety["professionalReferenceRead"] is False
          assert safety["professionalReferencePathsOpened"] == 0
          assert safety["frozenScorerContentRead"] is False
          assert safety["referenceFacingScoreCalls"] == 0
          assert safety["candidateModifiedAfterStructuralPass"] is False
          assert safety["generationRerun"] is False
          assert safety["timebaseQcRerun"] is False
          assert safety["structuralQcRerun"] is False
          assert safety["gpuExecutions"] == 0
          assert safety["cudaExecutions"] == 0
          assert safety["modalExecutions"] == 0
          assert safety["mainOrProductionModified"] is False
          PY

      - name: Execute frozen scorer exactly once
        id: score
        shell: bash
        run: |
          set -u
          printf '%s\n' "SCORE_RUNTIME_FAIL" > /tmp/v160-score-outcome
          printf '%s\n' "1" > /tmp/v160-score-execution-count

          set +e
          python "$SCORER" "$CANDIDATE" "$REFERENCE" --output "$SCORE" > /tmp/v160-score-stdout.json
          rc=$?
          set -e
          printf '%s\n' "$rc" > /tmp/v160-score-rc

          if [ "$rc" -ne 0 ]; then
            exit 0
          fi
          if [ ! -s "$SCORE" ]; then
            exit 0
          fi

          if ! python - <<'PY'
          import hashlib, json
          from pathlib import Path

          score = json.loads(Path("debug/v160-cpu-autonomous/reference-score.json").read_text())
          assert score["schema"] == "dadrock.tabs.v154.cpu-front-end-score.v1"
          assert score["song"] == {"artist": "Lenny Kravitz", "title": "Are You Gonna Go My Way"}
          assert score["gates"]["combinedGuitarTimingAwarePitchF1Target"] == 0.80
          assert score["gates"]["bassTimingAwarePitchF1Target"] == 0.80
          assert score["gates"]["primaryToleranceGridSteps"] == 0.50
          assert score["gates"]["grossToleranceGridSteps"] == 2.00
          assert score["policy"]["scoringWritesNoCorrections"] is True
          assert score["policy"]["postScoreRetuningOfSameGeneratedOutputForbidden"] is True

          guitar = float(score["combinedGuitar"]["primaryTimingAwarePitch"]["f1"])
          bass = float(score["bass"]["primaryTimingAwarePitch"]["f1"])
          assert 0.0 <= guitar <= 1.0
          assert 0.0 <= bass <= 1.0

          candidate_sha = hashlib.sha256(Path("debug/v160-cpu-autonomous/generated.json").read_bytes()).hexdigest()
          assert candidate_sha == "db6b8428fac758d5c0fd750b797152dbd9c3f7295c3b6c6872ee631ee8c8ff76"

          outcome = "SCORE_GATE_PASS" if guitar >= 0.80 and bass >= 0.80 else "SCORE_GATE_FAIL"
          Path("/tmp/v160-score-outcome").write_text(outcome + "\n")
          PY
          then
            printf '%s\n' "SCORE_RUNTIME_FAIL" > /tmp/v160-score-outcome
            exit 0
          fi

          test "$(git hash-object "$CANDIDATE")" = "892be048486c843ae5d3268e35f84cd95b4245af"
          test "$(sha256sum "$CANDIDATE" | awk '{print $1}')" = "db6b8428fac758d5c0fd750b797152dbd9c3f7295c3b6c6872ee631ee8c8ff76"
          test "$(git hash-object "$SCORER")" = "9644e65719fbd361a9b39778ae9950c5e983e855"
          test "$(git hash-object "$REFERENCE")" = "2fbed60b543c0488934d8642c488aa06bf31bbf5"

      - name: Freeze score result and self-seal
        if: ${{ always() && github.run_number == 1 && github.run_attempt == 1 }}
        shell: bash
        env:
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
        run: |
          set -euo pipefail

          if [ "$GUARD_OUTCOME" = "success" ]; then
            outcome="$(cat /tmp/v160-score-outcome 2>/dev/null || printf '%s' 'SCORE_RUNTIME_FAIL')"
            score_execution_count="$(cat /tmp/v160-score-execution-count 2>/dev/null || printf '%s' '1')"
          else
            outcome="PRE_SCORE_GUARD_FAIL"
            score_execution_count="0"
          fi

          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"

          OUTCOME="$outcome" SCORE_EXECUTION_COUNT="$score_execution_count" python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          score_path = Path("debug/v160-cpu-autonomous/reference-score.json")

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def git_blob(path):
              return subprocess.check_output(["git", "hash-object", path], text=True).strip()

          outcome = os.environ["OUTCOME"]
          execution_count = int(os.environ["SCORE_EXECUTION_COUNT"])
          score = None
          guitar_f1 = None
          bass_f1 = None
          score_sha = None
          score_git_blob = None

          if score_path.is_file():
              score = json.loads(score_path.read_text())
              score_sha = sha256(score_path)
              score_git_blob = git_blob(score_path)
              guitar_f1 = float(score["combinedGuitar"]["primaryTimingAwarePitch"]["f1"])
              bass_f1 = float(score["bass"]["primaryTimingAwarePitch"]["f1"])

          if outcome in {"SCORE_GATE_PASS", "SCORE_GATE_FAIL"}:
              assert execution_count == 1
              assert score is not None
              assert score["schema"] == "dadrock.tabs.v154.cpu-front-end-score.v1"
              assert score["gates"]["combinedGuitarTimingAwarePitchF1Target"] == 0.80
              assert score["gates"]["bassTimingAwarePitchF1Target"] == 0.80
              assert outcome == ("SCORE_GATE_PASS" if guitar_f1 >= 0.80 and bass_f1 >= 0.80 else "SCORE_GATE_FAIL")
          elif outcome == "SCORE_RUNTIME_FAIL":
              assert execution_count == 1
          elif outcome == "PRE_SCORE_GUARD_FAIL":
              assert execution_count == 0
              assert score is None
          else:
              raise AssertionError(outcome)

          freeze = {
              "schema": "dadrock.tabs.v160.professional-reference-score-terminal.v1",
              "version": "V160",
              "status": "TERMINAL",
              "outcome": outcome,
              "workflowRunId": int(os.environ["GITHUB_RUN_ID"]),
              "workflowRunNumber": int(os.environ["GITHUB_RUN_NUMBER"]),
              "workflowRunAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflowHeadSha": os.environ["GITHUB_SHA"],
              "scoreWorkflowGitBlob": git_blob(".github/workflows/v160-score.yml"),
              "scorePreregistrationGitBlob": "8cdc8f8d561124b7d417d5de7ea96fae5e0ec4ed",
              "candidateGitBlob": "892be048486c843ae5d3268e35f84cd95b4245af",
              "candidateSha256": "db6b8428fac758d5c0fd750b797152dbd9c3f7295c3b6c6872ee631ee8c8ff76",
              "structuralQcGitBlob": "5372885dfc9e07dfa8394294deafdf32c8f5a356",
              "generationTerminalGitBlob": "9690c523290955dcf0ef15074bb6746105ec0810",
              "scorerGitBlob": "9644e65719fbd361a9b39778ae9950c5e983e855",
              "professionalReferenceGitBlob": "2fbed60b543c0488934d8642c488aa06bf31bbf5",
              "professionalReferenceSha256": "b39a203aec3f45800891fe4eca156e37e7571b91ea5c4ccc41b30bbc95fc89e7",
              "scoreExecutionCount": execution_count,
              "scoreReportExists": score is not None,
              "scoreReportGitBlob": score_git_blob,
              "scoreReportSha256": score_sha,
              "combinedGuitarTimingAwarePitchF1": guitar_f1,
              "bassTimingAwarePitchF1": bass_f1,
              "gates": {
                  "combinedGuitarMinimum": 0.80,
                  "bassMinimum": 0.80,
                  "bothMustPass": True,
              },
              "eligibleForRoleStringFretTechniquePdfPhase": outcome == "SCORE_GATE_PASS",
              "candidateConsumed": True,
              "scoreOpportunityConsumed": True,
              "neverRerunOrRescoreV160": True,
              "safety": {
                  "candidateModified": False,
                  "candidateRegenerated": False,
                  "candidateReQc": False,
                  "thresholdSweep": False,
                  "variantSelection": False,
                  "humanCorrection": False,
                  "postScoreRetune": False,
                  "professionalReferenceUsedForScoringOnly": execution_count == 1,
                  "referenceFacingScoreCalls": execution_count,
                  "gpuUsed": False,
                  "cudaUsed": False,
                  "modalUsed": False,
                  "mainOrProductionModified": False,
              },
          }
          assert freeze["workflowRunNumber"] == 1
          assert freeze["workflowRunAttempt"] == 1
          Path("debug/v160-cpu-autonomous/score-terminal-freeze.json").write_text(
              json.dumps(freeze, indent=2, sort_keys=True, allow_nan=False) + "\n"
          )
          PY

          rm .github/workflows/v160-score.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- debug/v160-cpu-autonomous .github/workflows/v160-score.yml

          changed="$(git diff --cached --name-only)"
          test -n "$changed"
          if echo "$changed" | grep -Ev '^debug/v160-cpu-autonomous/(reference-score\.json|score-terminal-freeze\.json)$|^\.github/workflows/v160-score\.yml$'; then
            echo "Unexpected path in V160 score terminal commit" >&2
            exit 1
          fi

          case "$outcome" in
            SCORE_GATE_PASS)
              message="research: freeze sole V160 professional-reference score PASS [skip ci]"
              ;;
            SCORE_GATE_FAIL)
              message="research: freeze sole V160 professional-reference score FAIL [skip ci]"
              ;;
            *)
              message="research: freeze terminal V160 professional-reference scoring failure [skip ci]"
              ;;
          esac

          git commit -m "$message"
          git push origin HEAD:"$BRANCH"

          if [ "$outcome" = "PRE_SCORE_GUARD_FAIL" ] || [ "$outcome" = "SCORE_RUNTIME_FAIL" ]; then
            exit 1
          fi
