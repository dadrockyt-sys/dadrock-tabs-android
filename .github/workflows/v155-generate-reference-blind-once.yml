name: V155 generate reference-blind CPU candidate once

on:
  push:
    branches: [v143-contextual-prune-lobo]
    paths: [.github/workflows/v155-generate-reference-blind-once.yml]

permissions:
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo
  CUDA_VISIBLE_DEVICES: ""
  SOURCE_DIR: /tmp/v155-historical-source
  NORM_WAV: /tmp/v155-normalized.wav
  DEMUCS_DIR: /tmp/v155-demucs
  PREREG: debug/v155-cpu-autonomous/preregistration.json
  GENERATOR: validation/v155_cpu_multitrack/generate_v155.py
  OUTPUT: debug/v155-cpu-autonomous/generated.json
  RECEIPT: debug/v155-cpu-autonomous/generation-receipt.json

jobs:
  generate-once:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify sealed V155 inputs and reference isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$PREREG")" = "9d6979b0d447d137db43017dfd18c9afdcb2a4d2"
          test "$(git hash-object "$GENERATOR")" = "d1ade9d49e4cd1d599844bc054710c146d5d1d92"
          test ! -e "$OUTPUT"
          test ! -e "$RECEIPT"
          python -m py_compile "$GENERATOR"
          if grep -En 'research/v154-professional-references|frontend-reference-payload|score_frontend_reference|v154-frontend-reference-score|broad-other-run-33096559281' "$GENERATOR"; then
            echo 'V155 generator contains forbidden professional-reference/scored-candidate path' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('debug/v155-cpu-autonomous/preregistration.json').read_text())
          assert p['status'] == 'PREREGISTERED_BEFORE_GENERATION'
          iso = p['hardIsolation']
          assert iso['professionalReferenceReadDuringGeneration'] is False
          assert iso['v154CandidateUsedAsGenerationInput'] is False
          assert iso['v154ReferenceDerivedOffsetOrTempoConstantsAllowed'] is False
          assert iso['candidateVariantSelectionAllowed'] is False
          assert iso['thresholdSweepAllowed'] is False
          assert p['execution']['device'] == 'CPU_ONLY'
          assert p['execution']['singleCandidate'] is True
          assert p['execution']['singleGenerationRun'] is True
          PY

      - name: Materialize exact historical audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR"
          git show 74b0f815ff3f66f325220975c410621503de440f:public/gomywayfullaitest.m4a > "$SOURCE_DIR/gomywayfullaitest.m4a"
          test "$(sha256sum "$SOURCE_DIR/gomywayfullaitest.m4a" | awk '{print $1}')" = "215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f"
          test "$(wc -c < "$SOURCE_DIR/gomywayfullaitest.m4a" | tr -d ' ')" = "3478611"

      - name: Install pinned CPU-only stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==1.26.4 basic-pitch==0.4.0 demucs==4.1.0 imageio-ffmpeg==0.6.0 librosa==0.11.0
          python - <<'PY'
          import importlib.metadata, numpy, torch
          assert numpy.__version__ == '1.26.4'
          assert importlib.metadata.version('basic-pitch') == '0.4.0'
          assert importlib.metadata.version('demucs') == '4.1.0'
          assert importlib.metadata.version('imageio-ffmpeg') == '0.6.0'
          assert importlib.metadata.version('librosa') == '0.11.0'
          assert torch.__version__.startswith('2.8.0')
          assert torch.version.cuda is None
          assert torch.cuda.is_available() is False
          PY

      - name: Deterministically normalize audio
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          import imageio_ffmpeg
          src = Path('/tmp/v155-historical-source/gomywayfullaitest.m4a')
          out = Path('/tmp/v155-normalized.wav')
          exe = imageio_ffmpeg.get_ffmpeg_exe()
          subprocess.check_call([exe, '-v', 'error', '-i', str(src), '-vn', '-ar', '44100', '-ac', '2', '-c:a', 'pcm_s16le', str(out)])
          assert out.is_file() and out.stat().st_size > 1000000
          print('normalized_sha256=' + hashlib.sha256(out.read_bytes()).hexdigest())
          PY

      - name: CPU Demucs six-source separation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import torch
          assert torch.version.cuda is None
          assert torch.cuda.is_available() is False
          PY
          python -m demucs -n htdemucs_6s -d cpu --shifts 1 -j 1 -o "$DEMUCS_DIR" "$NORM_WAV"
          STEM_DIR="$DEMUCS_DIR/htdemucs_6s/v155-normalized"
          test -f "$STEM_DIR/guitar.wav"
          test -f "$STEM_DIR/bass.wav"
          test -f "$STEM_DIR/drums.wav"
          echo "stem_dir=$STEM_DIR"
          sha256sum "$STEM_DIR/guitar.wav" "$STEM_DIR/bass.wav" "$STEM_DIR/drums.wav"

      - name: Generate exactly one V155 candidate and run structural QC
        shell: bash
        run: |
          set -euo pipefail
          STEM_DIR="$DEMUCS_DIR/htdemucs_6s/v155-normalized"
          export V155_GENERATOR_GIT_BLOB="$(git hash-object "$GENERATOR")"
          test "$V155_GENERATOR_GIT_BLOB" = "d1ade9d49e4cd1d599844bc054710c146d5d1d92"
          python "$GENERATOR" \
            --mix "$NORM_WAV" \
            --guitar "$STEM_DIR/guitar.wav" \
            --bass "$STEM_DIR/bass.wav" \
            --drums "$STEM_DIR/drums.wav" \
            --preregistration "$PREREG" \
            --output "$OUTPUT" \
            --receipt "$RECEIPT"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          out = Path('debug/v155-cpu-autonomous/generated.json')
          receipt = Path('debug/v155-cpu-autonomous/generation-receipt.json')
          assert out.is_file() and receipt.is_file()
          p = json.loads(out.read_text())
          r = json.loads(receipt.read_text())
          assert p['classification'] == 'single-preregistered-reference-blind-cpu-candidate'
          assert len(p['streams']['combinedGuitar']) > 0
          assert len(p['streams']['bass']) > 0
          for key in ('referenceRead','humanCorrection','referenceGuidedFiltering','thresholdSweep','candidateVariantSelection','modalUsed','cudaGpuUsed','mainOrProductionModified'):
              assert p['safety'][key] is False
          assert r['validation'] == 'PASS'
          assert r['safety']['referenceRead'] is False
          assert r['safety']['professionalReferencePathsOpened'] == 0
          assert r['safety']['referenceFacingScoreCalls'] == 0
          assert r['identities']['generatorGitBlob'] == 'd1ade9d49e4cd1d599844bc054710c146d5d1d92'
          assert r['outputSha256'] == hashlib.sha256(out.read_bytes()).hexdigest()
          print(json.dumps({'candidateSha256': r['outputSha256'], 'counts': r['counts'], 'timebase': r['timebaseSummary'], 'structuralQc': r['structuralQc']}, indent=2, sort_keys=True))
          PY

      - name: Freeze candidate receipt and self-seal
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v155-generate-reference-blind-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT" "$RECEIPT" .github/workflows/v155-generate-reference-blind-once.yml
          git commit -m "research: freeze V155 reference-blind CPU candidate [skip ci]"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
