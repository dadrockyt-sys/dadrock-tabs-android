name: V166 CPU Environment Seal

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v166-environment-seal.yml

permissions:
  contents: read

concurrency:
  group: v166-environment-seal
  cancel-in-progress: false

env:
  CUDA_VISIBLE_DEVICES: ""
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  verify-cpu-environment:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact V166 environment-seal head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify sealed V166 pre-run identity and runtime absence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object debug/v166-cpu-autonomous/pre-run-identity-receipt.json)" = "097d309d27f34ef0c02548b31a2440e3054aac00"
          test "$(git hash-object debug/v166-cpu-autonomous/preregistration.json)" = "ca45241b4ab4689c8ceb3a7107e158367814cc1d"
          test "$(git hash-object debug/v166-cpu-autonomous/implementation-contract.json)" = "9ab505ee8c7de732b6e9a8928854ae99d3ebb0c7"
          test "$(git hash-object validation/v166_cpu_autonomous/event_logic_v166.py)" = "6561194742093d76bab452ef0bbb0b889724dc4e"
          test "$(git hash-object validation/v166_cpu_autonomous/build_timebase_v166.py)" = "6a5fddf7a8a7d3cc29256a67c21a75fd0d894eab"
          test "$(git hash-object validation/v166_cpu_autonomous/timebase_qc_v166.py)" = "5d59eda867f7252dff86faa0ec3a30bdb1c8c289"
          test "$(git hash-object validation/v166_cpu_autonomous/transcribe_v166.py)" = "f04ca86525b2ce71680a90b84ed476943e9e6426"
          test "$(git hash-object validation/v166_cpu_autonomous/structural_qc_v166.py)" = "f69203ebd37c479ee06652f842f3e927e16beb9d"
          test "$(git hash-object validation/v166_cpu_autonomous/test_paired_template_v166.py)" = "59fd7379bf0fe6538e44f33732b91a04e0200046"
          test "$(git hash-object validation/v166_cpu_autonomous/test_runtime_compat_v166.py)" = "cf1eec33be04a9c4c2c0bb27425f93c2520f0a0e"
          test "$(git hash-object validation/v166_cpu_autonomous/test_json_native_v166.py)" = "bead3542375d4364db080cbe0ffce2de499ca325"
          test "$(git hash-object debug/v166-cpu-autonomous/negative-runtime-guard.py)" = "fad6ea1a3d6750e86affc2214a417652c2261446"
          test "$(git hash-object .github/workflows/v166-static-preflight.yml)" = "e148c696dd77963f62129f74adccc852e84587d5"
          for path in \
            debug/v166-cpu-autonomous/environment-receipt.json \
            debug/v166-cpu-autonomous/timebase.json \
            debug/v166-cpu-autonomous/timebase-qc.json \
            debug/v166-cpu-autonomous/generated.json \
            debug/v166-cpu-autonomous/generation-receipt.json \
            debug/v166-cpu-autonomous/structural-qc.json \
            debug/v166-cpu-autonomous/terminal-freeze.json \
            .github/workflows/v166-generate.yml; do
            test ! -e "$path"
          done

      - name: Install exact CPU generation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 scipy==1.13.1 soundfile==0.12.1 \
            basic-pitch==0.4.0 demucs==4.1.0 imageio-ffmpeg==0.6.0 librosa==0.11.0

      - name: Verify exact CPU stack and emit V166 environment receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.metadata as md
          import json
          import os
          import platform
          import random
          import subprocess
          import numpy as np
          import torch

          pins = {
              "numpy": "1.26.4",
              "scipy": "1.13.1",
              "soundfile": "0.12.1",
              "basic-pitch": "0.4.0",
              "demucs": "4.1.0",
              "imageio-ffmpeg": "0.6.0",
              "librosa": "0.11.0",
          }
          assert platform.python_version().startswith("3.10."), platform.python_version()
          assert torch.__version__ == "2.8.0+cpu", torch.__version__
          assert torch.version.cuda is None
          assert torch.cuda.is_available() is False
          for package, expected in pins.items():
              assert md.version(package) == expected, (package, md.version(package), expected)

          random.seed(0)
          np.random.seed(0)
          torch.manual_seed(0)
          torch.set_num_threads(1)
          torch.set_num_interop_threads(1)
          torch.use_deterministic_algorithms(True)
          assert torch.get_num_threads() == 1
          assert torch.get_num_interop_threads() == 1
          assert torch.are_deterministic_algorithms_enabled()

          def git_blob(path):
              return subprocess.check_output(["git", "hash-object", path], text=True).strip()

          receipt = {
              "schema": "dadrock.tabs.v166.cpu-environment-receipt.v1",
              "version": "V166",
              "status": "VERIFIED_BEFORE_SONG_PROCESSING",
              "validation": "PASS",
              "device": "cpu",
              "pythonVersion": platform.python_version(),
              "torchVersion": torch.__version__,
              "torchCudaVersion": torch.version.cuda,
              "cudaAvailable": torch.cuda.is_available(),
              "workflowRunId": int(os.environ["GITHUB_RUN_ID"]),
              "workflowRunNumber": int(os.environ["GITHUB_RUN_NUMBER"]),
              "workflowRunAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflowHeadSha": os.environ["GITHUB_SHA"],
              "environmentWorkflowGitBlob": git_blob(".github/workflows/v166-environment-seal.yml"),
              "preRunIdentityReceiptGitBlob": git_blob("debug/v166-cpu-autonomous/pre-run-identity-receipt.json"),
              "dependencyVersions": pins,
              "determinism": {
                  "seed": 0,
                  "torchDeterministicAlgorithms": True,
                  "torchNumThreads": 1,
                  "torchNumInteropThreads": 1,
                  "mathLibraryThreads": 1
              },
              "plannedSeparation": {
                  "model": "htdemucs_6s",
                  "device": "cpu",
                  "shifts": 1,
                  "jobs": 1,
                  "repeatCount": 1,
                  "executedAtSeal": False
              },
              "safety": {
                  "referenceRead": False,
                  "professionalReferencePathsOpened": 0,
                  "referenceFacingScoreCalls": 0,
                  "frozenScorerRead": False,
                  "V163CandidateRead": False,
                  "V163ScoreRead": False,
                  "V164RuntimeArtifactRead": False,
                  "V165CandidateRead": False,
                  "V165ScoreRead": False,
                  "priorGeneratedCandidateRead": False,
                  "priorScoreRead": False,
                  "referenceGuidedFiltering": False,
                  "thresholdSweep": False,
                  "variantSelection": False,
                  "humanCorrection": False,
                  "songAudioRead": False,
                  "normalizationExecuted": False,
                  "demucsExecuted": False,
                  "pitchInferenceExecuted": False,
                  "cudaGpuUsed": False,
                  "modalUsed": False,
                  "mainOrProductionModified": False
              }
          }
          assert receipt["workflowRunNumber"] == 1
          assert receipt["workflowRunAttempt"] == 1
          assert receipt["preRunIdentityReceiptGitBlob"] == "097d309d27f34ef0c02548b31a2440e3054aac00"
          assert receipt["cudaAvailable"] is False
          assert receipt["torchCudaVersion"] is None
          print("V166_ENVIRONMENT_RECEIPT_JSON=" + json.dumps(receipt, sort_keys=True, allow_nan=False))
          PY
