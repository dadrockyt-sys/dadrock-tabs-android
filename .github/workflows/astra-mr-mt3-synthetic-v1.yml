name: Astra MR-MT3 synthetic verification v1
on:
  push:
    branches: [astra-work]
    paths:
      - 'astra_backend/evaluation/mr_mt3_front_end_v1.py'
      - 'astra_backend/evaluation/test_mr_mt3_front_end_v1.py'
      - 'docs/astra/MR_MT3_FROZEN_PROVENANCE_V1.json'
      - '.github/workflows/astra-mr-mt3-synthetic-v1.yml'
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10.15' }
      - name: Install synthetic-only dependencies
        run: python -m pip install --disable-pip-version-check 'mido==1.3.3'
      - name: Verify mt3-infer release artifact and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mt3pkg
          python -m pip download --no-deps --only-binary=:all: 'mt3-infer==0.2.0' -d /tmp/mt3pkg
          wheel="$(find /tmp/mt3pkg -name 'mt3_infer-0.2.0-*.whl' -print -quit)"
          test -n "$wheel"
          test "$(sha256sum "$wheel" | awk '{print $1}')" = "95209657fafab7eda0e5187f5fb9ae3438a18e2a4e30acd4786f3cda25389ff4"
          python - "$wheel" <<'PY'
          import sys,zipfile
          p=sys.argv[1]
          with zipfile.ZipFile(p) as z:
              about=z.read('mt3_infer/__about__.py').decode()
              adapter=z.read('mt3_infer/adapters/mr_mt3.py').decode()
              cfg=z.read('mt3_infer/config/checkpoints.yaml').decode()
              lic=z.read('mt3_infer-0.2.0.dist-info/licenses/LICENSE').decode() if 'mt3_infer-0.2.0.dist-info/licenses/LICENSE' in z.namelist() else z.read('LICENSE').decode()
          assert '__version__ = "0.2.0"' in about
          assert '826ea84a933f93cd707d11e91af711f1d19c8d79' in adapter
          assert 'b8a3807ed265059abd25ad7f68142c06c35e8f6144dcaa45bd55946a3745398f' in cfg
          assert 'MIT License' in lic
          PY
      - name: Verify immutable MR-MT3 checkpoint identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --connect-timeout 30 --max-time 900 \
            -o /tmp/mt3.pth \
            'https://huggingface.co/gudgud1014/MR-MT3/resolve/539c08b0fe551076db6108a5f5b2a57d774881ed/mt3.pth?download=true'
          test "$(stat -c '%s' /tmp/mt3.pth)" = "183672643"
          test "$(sha256sum /tmp/mt3.pth | awk '{print $1}')" = "b8a3807ed265059abd25ad7f68142c06c35e8f6144dcaa45bd55946a3745398f"
      - name: Run synthetic MIDI projection tests
        shell: bash
        run: |
          cd astra_backend
          PYTHONPATH=. python -m unittest -v evaluation/test_mr_mt3_front_end_v1.py
          echo "REAL_MEDIA_ACCESSED=false"
          echo "OPTIMIZER_STEPS_EXECUTED=0"
          echo "THRESHOLD_SEARCH_EXECUTED=false"
          echo "P3_OPENED=false"
      - name: Write frozen identity receipt
        run: |
          cp docs/astra/MR_MT3_FROZEN_PROVENANCE_V1.json /tmp/mr-mt3-identity.json
      - uses: actions/upload-artifact@v4
        with:
          name: astra-mr-mt3-synthetic-identity-v1
          path: /tmp/mr-mt3-identity.json
          retention-days: 30
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/mt3pkg /tmp/mt3.pth /tmp/mr-mt3-identity.json
