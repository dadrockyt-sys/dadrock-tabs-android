name: V154 checkpoint timebase root cause once
# armed after workflow registration

on:
  push:
    branches: [v143-contextual-prune-lobo]
    paths: [.github/workflows/v154-checkpoint-timebase-root-cause-once.yml]

permissions:
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 1
      - name: Append latest root-cause checkpoint
        run: |
