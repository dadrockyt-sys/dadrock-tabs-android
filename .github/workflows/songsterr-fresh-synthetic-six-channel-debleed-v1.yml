name: Songsterr Fresh Synthetic Six Channel Debleed V1

on:
  workflow_dispatch:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - "scripts/songsterr-fresh/synthetic_six_channel_debleed_v1.py"
      - "scripts/songsterr-fresh/test_synthetic_six_channel_debleed_v1.py"
      - ".github/workflows/songsterr-fresh-synthetic-six-channel-debleed-v1.yml"

jobs:
  synthetic-debleed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen dependency
        run: python -m pip install --disable-pip-version-check "numpy==2.1.3"
      - name: Compile harness and tests
        run: python -m py_compile scripts/songsterr-fresh/synthetic_six_channel_debleed_v1.py scripts/songsterr-fresh/test_synthetic_six_channel_debleed_v1.py
      - name: Run synthetic contract tests first
        run: python scripts/songsterr-fresh/test_synthetic_six_channel_debleed_v1.py
      - name: Run official frozen synthetic harness
        run: python scripts/songsterr-fresh/synthetic_six_channel_debleed_v1.py --output synthetic-six-channel-debleed-v1-result.json
      - name: Print frozen harness summary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          path = Path("synthetic-six-channel-debleed-v1-result.json")
          result = json.loads(path.read_text())
          print("contract", result["contract"])
          print("sourceSha256", result["sourceSha256"])
          print("perturbationSha256", result["perturbationSha256"])
          print("matrixCaseCount", result["matrixCaseCount"])
          print("runCaseCount", result["runCaseCount"])
          for case in result["cases"]:
              print("MATRIX", case["family"], case["bleedLevel"], "cond2", case["conditionNumber2"], "sha", case["matrixSha256"])
              for run in case["runs"]:
                  print(
                      "RUN",
                      "sigma", run["perturbationRmsScale"],
                      "raw", run["raw"]["pooledNrmse"],
                      "direct", run["direct"]["pooledNrmse"],
                      "directDb", run["direct"]["improvementDbOverRaw"],
                      "ridge", run["ridge"]["pooledNrmse"],
                      "ridgeDb", run["ridge"]["improvementDbOverRaw"],
                  )
          print("resultSha256", hashlib.sha256(path.read_bytes()).hexdigest())
          print(json.dumps({
              "basicPitchAuthorized": result["basicPitchAuthorized"],
              "v6Authorized": result["v6Authorized"],
              "correctnessAuthorized": result["correctnessAuthorized"],
              "modelValidationComplete": result["modelValidationComplete"],
              "customerEligibleEvents": result["customerEligibleEvents"],
              "mayAdvanceDelivery": result["mayAdvanceDelivery"],
          }, sort_keys=True))
          PY
      - name: Upload canonical synthetic result
        uses: actions/upload-artifact@v4
        with:
          name: songsterr-fresh-synthetic-six-channel-debleed-v1
          path: synthetic-six-channel-debleed-v1-result.json
          if-no-files-found: error
          retention-days: 30
