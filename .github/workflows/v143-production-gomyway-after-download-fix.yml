name: V143 Production Gomyway After Download Fix

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - '.github/workflows/v143-production-gomyway-after-download-fix.yml'

concurrency:
  group: v143-production-gomyway-after-download-fix
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_qJrw8Cuze5bCEg9M3Q67XMWt
  VERCEL_PROJECT_ID: prj_6biwsn0iHci6FHNswAUCS8UYrAqF
  MAIN_SHA: bb992d901e78ab19645f8edc8e330d5a142ebd8e
  PRODUCTION_DEPLOYMENT_ID: dpl_5BdFAMHeiaA3rQ9QGUdHneY1rexM
  PRODUCTION_DEPLOYMENT_URL: https://dadrock-tabs-android-bbqwbski7-stephen-mcnally-s-projects.vercel.app
  AUDIO_URL: https://raw.githubusercontent.com/dadrockyt-sys/dadrock-tabs-android/main/public/jimmy-paige-midterm-v1/gomyway-midterm-source.m4a
  AUDIO_BLOB_SHA: 4dd709e3fa177b4daeed71ca97f0199757729d4b
  PROMOTED_SCHEDULER_BLOB: fc9b4c45c208d80be7abab64a8959f2a3babcee8
  PROMOTED_WORKER_SOURCE_COMMIT: 86f83f6bba33bbe7378ba1eed7294be884e30e45
  NEXT_TELEMETRY_DISABLED: '1'
  NO_COLOR: '1'

jobs:
  production-gomyway-after-download-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Enforce exact Production source and safety boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          ACTUAL_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$ACTUAL_MAIN" = "$MAIN_SHA"
          echo "productionSourceCommit=$MAIN_SHA"
          echo "productionDeploymentId=$PRODUCTION_DEPLOYMENT_ID"
          echo "promotedWorkerSourceCommit=$PROMOTED_WORKER_SOURCE_COMMIT"
          echo "promotedSchedulerBlob=$PROMOTED_SCHEDULER_BLOB"
          echo 'deploymentProtectionChanged=false'
          echo 'referenceFacingAccuracyScored=false'
          echo 'referenceScoreCalls=0'
          echo 'qualityVerdictMade=false'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global vercel@59.11.2
          test "$(vercel --version | tail -n 1)" = '59.11.2'

      - name: Confirm protected Production route access
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(
            vercel curl /ai-tab \
              --deployment "$PRODUCTION_DEPLOYMENT_URL" \
              -- \
              --silent --show-error --location --max-time 30 \
              --user-agent 'Mozilla/5.0 (compatible; DadRock-V143-Gomyway-Smoke/1.0)' \
              --output /dev/null --write-out '%{http_code}'
          )"
          echo "authenticatedProductionAiTabStatus=$STATUS"
          test "$STATUS" = '200'

      - name: Analyze Gomyway through promoted V143 worker and measure latency
        shell: bash
        run: |
          set -euo pipefail
          OUT=debug/v143-contextual-prune/production-gomyway-after-download-fix
          mkdir -p "$OUT"

          cat > "$OUT/request.json" <<JSON
          {
            "audioUrl": "$AUDIO_URL",
            "pathname": "gomyway-midterm-source.m4a",
            "song": "Are You Gonna Go My Way",
            "artist": "Lenny Kravitz",
            "transcriptionType": "rhythm"
          }
          JSON

          CURL_METRICS="$(
            vercel curl /api/analyze-audio-tab \
              --deployment "$PRODUCTION_DEPLOYMENT_URL" \
              -- \
              --silent --show-error --location \
              --max-time 900 \
              --request POST \
              --user-agent 'Mozilla/5.0 (compatible; DadRock-V143-Breakthrough-Check/1.0)' \
              --header 'Content-Type: application/json' \
              --data-binary "@$OUT/request.json" \
              --output "$OUT/analysis.json" \
              --write-out '%{http_code} %{time_total}'
          )"
          STATUS="${CURL_METRICS%% *}"
          ANALYSIS_SECONDS="${CURL_METRICS#* }"

          export STATUS ANALYSIS_SECONDS PRODUCTION_DEPLOYMENT_URL PRODUCTION_DEPLOYMENT_ID MAIN_SHA AUDIO_BLOB_SHA PROMOTED_SCHEDULER_BLOB PROMOTED_WORKER_SOURCE_COMMIT

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path('debug/v143-contextual-prune/production-gomyway-after-download-fix')
          raw = (out / 'analysis.json').read_text(encoding='utf-8', errors='replace')
          try:
              a = json.loads(raw)
          except Exception:
              a = {}

          status = int(os.environ['STATUS'])
          pc = a.get('payloadContract') if isinstance(a.get('payloadContract'), dict) else {}
          aq = a.get('analysisQuality') if isinstance(a.get('analysisQuality'), dict) else {}
          metrics = aq.get('metrics') if isinstance(aq.get('metrics'), dict) else {}
          conditioning = a.get('conditioningContract') if isinstance(a.get('conditioningContract'), dict) else {}
          mixture = a.get('mixtureStructureContext') if isinstance(a.get('mixtureStructureContext'), dict) else {}
          dual = a.get('dualContextShadowProjection') if isinstance(a.get('dualContextShadowProjection'), dict) else {}
          canary = a.get('productPlacementCandidateCanary') if isinstance(a.get('productPlacementCandidateCanary'), dict) else {}
          promo = a.get('productPlacementPromotion') if isinstance(a.get('productPlacementPromotion'), dict) else {}

          summary = {
              'schemaVersion': 9,
              'gate': 'v143-production-post-promotion-breakthrough-check',
              'productionDeploymentId': os.environ['PRODUCTION_DEPLOYMENT_ID'],
              'productionDeploymentUrl': os.environ['PRODUCTION_DEPLOYMENT_URL'],
              'productionSourceCommit': os.environ['MAIN_SHA'],
              'promotedWorkerSourceCommit': os.environ['PROMOTED_WORKER_SOURCE_COMMIT'],
              'promotedSchedulerBlob': os.environ['PROMOTED_SCHEDULER_BLOB'],
              'audioBlobSha': os.environ['AUDIO_BLOB_SHA'],
              'audioSource': 'public-raw-github-existing-repository-asset',
              'protectedAccessMethod': 'vercel-curl-env-token-auto-bypass',
              'deploymentProtectionDisabled': False,
              'analysisStatus': status,
              'analysisEndToEndSeconds': float(os.environ['ANALYSIS_SECONDS']),
              'rhythmCanaryActive': a.get('rhythmCanaryActive'),
              'analysisEngine': a.get('analysisEngine'),
              'generatedTabPresent': bool(str(a.get('generatedTab') or '').strip()),
              'eventCount': len(a.get('events') or []) if isinstance(a.get('events'), list) else 0,
              'renderEventCount': len(a.get('renderEvents') or []) if isinstance(a.get('renderEvents'), list) else 0,
              'payloadContract': {
                  'version': pc.get('version'),
                  'referenceFree': pc.get('referenceFree'),
                  'professionalReferenceNotUsed': pc.get('professionalReferenceNotUsed'),
                  'referenceRuntimeInputNotUsed': pc.get('referenceRuntimeInputNotUsed'),
                  'runtimeLabelsNotRequired': pc.get('runtimeLabelsNotRequired'),
                  'v143RuntimeSafetyVerified': pc.get('v143RuntimeSafetyVerified'),
                  'boundedEventCount': pc.get('boundedEventCount'),
                  'renderEventCount': pc.get('renderEventCount'),
                  'analyzerQualityGatePassed': pc.get('analyzerQualityGatePassed'),
                  'structuredRenderEligible': pc.get('structuredRenderEligible'),
              },
              'productHealthSignals': {
                  'analysisQualityGatePassed': aq.get('passed'),
                  'analysisQualityFailures': aq.get('failures'),
                  'rawEventCount': metrics.get('rawEventCount'),
                  'consideredRawEventCount': metrics.get('consideredRawEventCount'),
                  'validRenderEventCount': metrics.get('validRenderEventCount'),
                  'renderEventSurvivalPercent': metrics.get('renderEventSurvivalPercent'),
                  'playableStringFretPercent': metrics.get('playableStringFretPercent'),
                  'musicalPlacementPercent': metrics.get('musicalPlacementPercent'),
                  'pitchValidityPercent': metrics.get('pitchValidityPercent'),
                  'measureRange': metrics.get('measureRange'),
                  'stepCoverage': metrics.get('stepCoverage'),
                  'techniqueCoverage': metrics.get('techniqueCoverage'),
                  'sustainCoverage': metrics.get('sustainCoverage'),
              },
              'conditioning': {
                  'referenceBlind': conditioning.get('referenceBlind'),
                  'referenceScoreAuthorized': conditioning.get('referenceScoreAuthorized'),
              },
              'mixtureStructure': {
                  'status': mixture.get('status'),
                  'quantizationStatus': mixture.get('quantizationStatus'),
                  'observationAdmitted': mixture.get('observationAdmitted'),
                  'tempoBpm': mixture.get('tempoBpm'),
                  'timeSignature': mixture.get('timeSignature'),
                  'feel': mixture.get('feel'),
              },
              'dualContext': {
                  'status': dual.get('status'),
                  'renderEventCount': len(dual.get('renderEvents') or []) if isinstance(dual.get('renderEvents'), list) else None,
              },
              'candidateCanary': {
                  'eligible': canary.get('eligible'),
                  'baselineRenderEventCount': canary.get('baselineRenderEventCount'),
                  'candidateRenderEventCount': canary.get('candidateRenderEventCount'),
              },
              'productPlacementPromotion': {
                  'promoted': promo.get('promoted'),
                  'reason': promo.get('reason'),
                  'baselineRenderEventCount': promo.get('baselineRenderEventCount'),
                  'canonicalRenderEventCount': promo.get('canonicalRenderEventCount'),
              },
              'referenceFacingInputs': 0,
              'referenceFacingAccuracyScored': False,
              'referenceScoreCalls': 0,
              'qualityVerdictMade': False,
          }

          if status != 200:
              summary['error'] = a.get('error') or a.get('detail') or 'unknown/non-JSON analyzer error'

          (out / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2))

          if status != 200:
              raise SystemExit(f'Production analysis returned HTTP {status}')
          if summary['rhythmCanaryActive'] is not True:
              raise SystemExit('V143 rhythm canary not active')
          if not summary['generatedTabPresent']:
              raise SystemExit('Production analysis returned no tablature')

          required = {
              'referenceFree': True,
              'professionalReferenceNotUsed': True,
              'referenceRuntimeInputNotUsed': True,
              'runtimeLabelsNotRequired': True,
              'v143RuntimeSafetyVerified': True,
          }
          for key, expected in required.items():
              if summary['payloadContract'].get(key) is not expected:
                  raise SystemExit(f'Runtime safety contract failed: {key}')
          PY

      - name: Delete raw/transcription evidence from runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=debug/v143-contextual-prune/production-gomyway-after-download-fix
          rm -f "$OUT/analysis.json" "$OUT/request.json"

      - name: Preserve aggregate breakthrough evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-production-post-promotion-breakthrough-check
          path: debug/v143-contextual-prune/production-gomyway-after-download-fix/summary.json
          if-no-files-found: warn
          retention-days: 14
