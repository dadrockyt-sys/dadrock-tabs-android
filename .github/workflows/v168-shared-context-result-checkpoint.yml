name: V168 shared-context result checkpoint

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v168-shared-context-result-checkpoint.yml

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0
      - name: Append checkpoint
        shell: bash
        env:
          CHECKPOINT_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('docs/checkpoints/CURRENT_STATE.md')
          marker = '## 2026-09-01 continuation checkpoint — shared-context functional-equivalence result'
          text = p.read_text()
          if marker in text:
              print('checkpoint marker already present; no duplicate append')
          else:
              p.write_text(text + base64.b64decode(os.environ['CHECKPOINT_B64']).decode())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/checkpoints/CURRENT_STATE.md
          if git diff --cached --quiet; then
            echo "No checkpoint change needed"
            exit 0
          fi
          git commit -m "Checkpoint shared-context functional-equivalence result"
          git push origin HEAD:v143-contextual-prune-lobo
