name: V143 V5 Professional Scorer Preflight

# Reference-free only. This workflow MUST NOT open or fetch any professional holdout payload.
on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-v5-professional-scorer-preflight.yml

permissions:
  contents: write

concurrency:
  group: v143-v5-professional-scorer-preflight
  cancel-in-progress: true

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable V5 source-only freeze
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .v5preflight/freeze .v5preflight/results
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = '7f72f8ed9b14af8bc93e95544195204d99c6bec1'
          echo '7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2  debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json' | sha256sum -c -
          echo 'f4c1238e868cadfb90b8a359b1555b0b90e7740b9ebaa276aa394c8991f37ce5  debug/v143-contextual-prune/v5-professional-pdf/v5-rhythm-shadow.pdf' | sha256sum -c -
          python analyzer/validate_v143_v5_source_only_frozen_candidate.py \
            debug/v143-contextual-prune/v5-professional-pdf/source-only-frozen-candidate-manifest.json \
            --output .v5preflight/results/source-only-validation.json

      - name: Build scorer freeze input from exact V5 events only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('debug/v143-contextual-prune/v5-professional-pdf')
          manifest = json.loads((root / 'source-only-frozen-candidate-manifest.json').read_text(encoding='utf-8'))
          stream = json.loads((root / 'v5-render-stream.json').read_text(encoding='utf-8'))
          events = stream.get('events')
          if not isinstance(events, list) or len(events) != 1209:
              raise SystemExit(f'expected exact 1209-event V5 stream, got {0 if not isinstance(events,list) else len(events)}')
          status = manifest.get('status') or {}
          if status.get('sourceOnlyFrozen') is not True or status.get('referenceFree') is not True:
              raise SystemExit('source-only manifest is not frozen/reference-free')
          if status.get('professionalReferenceUsed') is not False or status.get('professionalHoldoutOpened') is not False:
              raise SystemExit('source-only manifest indicates professional reference/holdout access')
          payload = {
              'instrument': 'rhythm',
              'renderEvents': events,
              'tempoBpm': (manifest.get('boundaries') or {}).get('tempo'),
              'timeSignature': '4/4',
              'tuning': 'E Standard',
              'structuredMode': True,
              'sourceAudioSha256': (manifest.get('authorizedSource') or {}).get('approvedSourceSha256'),
              'referenceFree': True,
              'professionalReferenceUsed': False,
              'referenceRuntimeInputUsed': False,
              'runtimeLabelsRequired': False,
              'v143RuntimeSafetyVerified': True,
          }
          Path('.v5preflight/v5-scorer-freeze-input.json').write_text(json.dumps(payload, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          python validation/rhythm_holdout/freeze_rhythm_analysis.py \
            .v5preflight/v5-scorer-freeze-input.json \
            .v5preflight/freeze \
            --source-commit "${GITHUB_SHA}" \
            > .v5preflight/results/freeze.log

      - name: Prove scorer events equal renderer-normalized V5 events
        shell: bash
        run: |
          set -euo pipefail
          cp lib/v143RenderContract.js .v5preflight/v143RenderContract.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { validateV143RenderEvents } from './.v5preflight/v143RenderContract.mjs';

          const stream = JSON.parse(await fs.readFile('debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json', 'utf8'));
          const events = validateV143RenderEvents(stream.events || []);
          if (events.length !== 1209) throw new Error(`renderer contract returned ${events.length}, expected 1209`);
          const measures = new Set(events.map((event) => event.measure));
          if (measures.size !== 113) throw new Error(`renderer contract returned ${measures.size} measures, expected 113`);
          const evidence = {
            schemaVersion: 1,
            purpose: 'v143-v5-reference-free-renderer-event-evidence',
            renderEvents: events,
            runtimeSafetyVerified: true,
            runtimeLabelsRequired: false,
            referenceOpened: false,
            professionalReferenceUsed: false,
            productionModified: false,
          };
          await fs.writeFile('.v5preflight/renderer-event-evidence.json', JSON.stringify(evidence) + '\n');
          NODE
          python validation/rhythm_holdout/verify_pdf_event_fidelity.py \
            .v5preflight/freeze \
            .v5preflight/renderer-event-evidence.json \
            > .v5preflight/results/pdf-event-fidelity.log

      - name: Run generic scorer pre-reference gate only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'validation/rhythm_holdout')
          import score_rhythm_holdout as scorer

          manifest, events, snapshot = scorer.validate_pre_reference(Path('.v5preflight/freeze'))
          assert len(events) == 1209
          assert len({int(event['measure']) for event in events}) == 113
          assert manifest.get('pdfFidelityVerified') is True
          assert float(manifest.get('pdfEventFidelity')) == 1.0
          assert manifest.get('eventSha256') == manifest.get('pdfEventSha256')
          assert (snapshot.get('safety') or {}).get('referenceFree') is True
          Path('.v5preflight/results/pre-reference-gate.json').write_text(json.dumps({
              'passed': True,
              'eventCount': len(events),
              'uniqueMeasureCount': 113,
              'canonicalEventSha256': manifest.get('eventSha256'),
              'pdfEventSha256': manifest.get('pdfEventSha256'),
              'pdfEventFidelity': manifest.get('pdfEventFidelity'),
              'professionalReferenceUsed': False,
              'professionalHoldoutOpened': False,
              'referencePayloadOpened': False,
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Persist non-reference V5 scorer preflight report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          root = Path('debug/v143-contextual-prune/v5-professional-pdf')
          source_validation = json.loads(Path('.v5preflight/results/source-only-validation.json').read_text(encoding='utf-8'))
          freeze_manifest = json.loads(Path('.v5preflight/freeze/rhythm-freeze-manifest.json').read_text(encoding='utf-8'))
          fidelity = json.loads(Path('.v5preflight/freeze/rhythm-pdf-event-fidelity.json').read_text(encoding='utf-8'))
          pre = json.loads(Path('.v5preflight/results/pre-reference-gate.json').read_text(encoding='utf-8'))
          frozen_manifest = json.loads((root / 'source-only-frozen-candidate-manifest.json').read_text(encoding='utf-8'))
          stream = json.loads((root / 'v5-render-stream.json').read_text(encoding='utf-8'))
          render_report = json.loads((root / 'render-report.json').read_text(encoding='utf-8'))

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          protected = subprocess.check_output(['git', 'hash-object', 'analyzer/v143_reference_free_rhythm_pipeline.py'], text=True).strip()
          checks = {
              'sourceOnlyFreezeValidationPassed': source_validation.get('sourceOnlyFreezeValidationPassed') is True,
              'protectedPipelineExact': protected == '7f72f8ed9b14af8bc93e95544195204d99c6bec1',
              'rawV5StreamShaExact': sha256(root / 'v5-render-stream.json') == '7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2',
              'currentPdfShaExact': sha256(root / 'v5-rhythm-shadow.pdf') == 'f4c1238e868cadfb90b8a359b1555b0b90e7740b9ebaa276aa394c8991f37ce5',
              'v5EventCountExact': len(stream.get('events') or []) == 1209,
              'v5MeasureCoverageExact': int((stream.get('summary') or {}).get('measureCoverageCount') or -1) == 113,
              'sourceOnlyFrozen': (frozen_manifest.get('status') or {}).get('sourceOnlyFrozen') is True,
              'professionalReferenceUnused': (frozen_manifest.get('status') or {}).get('professionalReferenceUsed') is False,
              'professionalHoldoutClosed': (frozen_manifest.get('status') or {}).get('professionalHoldoutOpened') is False,
              'freezeFinalSentinelStillFalse': stream.get('freezeReady') is False,
              'renderFinalSentinelStillFalse': render_report.get('freezeReady') is False,
              'canonicalEventCountExact': int(freeze_manifest.get('eventCount') or -1) == 1209,
              'canonicalMeasureCountExact': int(freeze_manifest.get('uniqueMeasureCount') or -1) == 113,
              'pdfEventHashMatchesCanonical': freeze_manifest.get('eventSha256') == freeze_manifest.get('pdfEventSha256'),
              'pdfEventFidelityExact': float(freeze_manifest.get('pdfEventFidelity') or 0.0) == 1.0,
              'fidelityReportPassed': fidelity.get('passed') is True,
              'genericPreReferenceGatePassed': pre.get('passed') is True,
          }
          failed = [key for key, value in checks.items() if not value]
          report = {
              'schemaVersion': 1,
              'classification': 'v143-v5-professional-scorer-reference-free-preflight',
              'triggerSha': '${{ github.sha }}',
              'runId': int('${{ github.run_id }}'),
              'runAttempt': int('${{ github.run_attempt }}'),
              'passed': not failed,
              'checks': checks,
              'failedChecks': failed,
              'canonicalEventSha256': freeze_manifest.get('eventSha256'),
              'pdfEventSha256': freeze_manifest.get('pdfEventSha256'),
              'pdfEventFidelity': freeze_manifest.get('pdfEventFidelity'),
              'eventCount': freeze_manifest.get('eventCount'),
              'uniqueMeasureCount': freeze_manifest.get('uniqueMeasureCount'),
              'rawV5RenderStreamSha256': sha256(root / 'v5-render-stream.json'),
              'currentPdfSha256': sha256(root / 'v5-rhythm-shadow.pdf'),
              'protectedPipelineBlob': protected,
              'referenceFree': True,
              'professionalReferenceUsed': False,
              'professionalHoldoutOpened': False,
              'referencePayloadOpened': False,
              'modalInvoked': False,
              'productionModified': False,
              'candidateModified': False,
              'freezeReadyChanged': False,
          }
          out = root / 'scorer-preflight-report.json'
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          if failed:
              raise SystemExit('V5 scorer preflight failed: ' + ', '.join(failed))
          PY

          git add debug/v143-contextual-prune/v5-professional-pdf/scorer-preflight-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record V5 professional scorer reference-free preflight'
          for attempt in 1 2 3 4 5; do
            git fetch origin v143-contextual-prune-lobo
            if git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
