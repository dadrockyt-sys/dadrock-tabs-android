name: Astra P2 preparation integrity audit offline tests v1

on:
  push:
    branches: [astra-work]
    paths:
      - 'astra_backend/evaluation/p2_attack_preparation_integrity_audit_v1.py'
      - 'astra_backend/evaluation/test_p2_attack_preparation_integrity_audit_v1.py'
      - 'astra_backend/evaluation/real_domain_failure_localization_v1.py'
      - 'astra_backend/evaluation/test_real_domain_failure_localization_v1.py'
      - 'docs/astra/P2_ATTACK_PREPARATION_INTEGRITY_AUDIT_SPEC_V1.json'
      - '.github/workflows/astra-p2-attack-preparation-integrity-audit-offline-tests-v1.yml'

permissions:
  contents: read

concurrency:
  group: astra-p2-preparation-integrity-audit-offline-tests-v1
  cancel-in-progress: false

jobs:
  focused-offline-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}" }

      - uses: actions/setup-python@v5
        with: { python-version: '3.10.15' }

      - name: Verify frozen source pins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          s=json.load(open('docs/astra/P2_ATTACK_PREPARATION_INTEGRITY_AUDIT_SPEC_V1.json'))
          paths={
            'alignmentCorrectionsGitBlob':'docs/astra/GUITARTECHS_PRIMARY_ALIGNMENT_CORRECTIONS_V1.json',
            'preprocessingGitBlob':'astra_backend/tabcnn_runtime/preprocessing.py',
            'p1PreparationGitBlob':'astra_backend/tiny_fit_pilot_v1.py',
            'p2PreparationGitBlob':'astra_backend/evaluation/cross_performer_screen_v1.py',
            'eventAdapterGitBlob':'astra_backend/evaluation/prepared_event_adapter_v1.py',
            'realTrainingGitBlob':'astra_backend/guitartechs_real_training/real_training.py',
            'runtimeLockGitBlob':'astra_backend/tabcnn_runtime/requirements.lock.txt',
          }
          for key,path in paths.items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert s['pins'][key]==actual,(key,s['pins'][key],actual)
          assert s['executionCeiling']['modelsLoaded']==0
          assert s['executionCeiling']['optimizerSteps']==0
          assert s['executionCeiling']['p3Opened'] is False
          print('SOURCE_PINS_OK')
          PY

      - name: Install frozen CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Freeze observed offline toolchain receipt
        run: |
          {
            python --version
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
            python - <<'PY'
          import numpy, librosa, scipy, resampy, soundfile
          print("numpy="+numpy.__version__)
          print("librosa="+librosa.__version__)
          print("scipy="+scipy.__version__)
          print("resampy="+resampy.__version__)
          print("soundfile="+soundfile.__version__)
          PY
          } > /tmp/astra-p2-integrity-toolchain.txt
          cat /tmp/astra-p2-integrity-toolchain.txt

      - uses: actions/upload-artifact@v4
        with:
          name: astra-p2-integrity-offline-toolchain
          path: /tmp/astra-p2-integrity-toolchain.txt
          retention-days: 30

      - name: Run focused integrity-audit synthetic tests
        run: PYTHONPATH=astra_backend:astra_backend/evaluation python astra_backend/evaluation/test_p2_attack_preparation_integrity_audit_v1.py

      - name: Run timestamp bookkeeping regression
        run: PYTHONPATH=astra_backend:astra_backend/evaluation python astra_backend/evaluation/test_real_domain_failure_localization_v1.py
