name: V143 Restore Frozen Modal Production

on:
  push:
    branches:
      - v143-main-integration-20260904
    paths:
      - '.github/workflows/v143-restore-modal-production.yml'

concurrency:
  group: v143-restore-modal-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  V143_SOURCE_SHA: 379ca54cce0f7f962c1e22caebfd6f49b8e4edb9
  V143_WORKER_APP: dadrock-v143-ai-tab-live
  V143_BRIDGE_URL: https://dadrockyt--dadrock-v143-http-bridge-analyze.modal.run
  MODAL_ENVIRONMENT: main
  PYTHONUNBUFFERED: '1'

jobs:
  restore-frozen-modal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout exact frozen V143 checkpoint source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V143_SOURCE_SHA }}
          fetch-depth: 1

      - name: Enforce frozen source and safety boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$V143_SOURCE_SHA"
          test -f analyzer/v143_modal_live_endpoint.py
          test -f analyzer/v143_modal_http_endpoint.py
          grep -q 'app = modal.App("dadrock-v143-ai-tab-live")' analyzer/v143_modal_live_endpoint.py
          grep -q 'def rhythm_v143_request' analyzer/v143_modal_live_endpoint.py
          grep -q 'HTTP_APP_NAME = "dadrock-v143-http-bridge"' analyzer/v143_modal_http_endpoint.py
          grep -q 'WORKER_FUNCTION_NAME = "rhythm_v143_request"' analyzer/v143_modal_http_endpoint.py
          grep -q 'professionalReferenceUsed.*False' analyzer/v143_modal_live_endpoint.py
          grep -q 'runtimeLabelsRequired.*False' analyzer/v143_modal_live_endpoint.py
          echo "referenceFacingAccuracyScored=false"
          echo "referenceScoreCalls=0"
          echo "deploymentProtectionChanged=false"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Modal CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'modal==1.3.3'
          modal --version

      - name: Authenticate Modal
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          case "$MODAL_TOKEN_ID" in
            ak-*) ;;
            *) echo 'Unexpected Modal token id format.' >&2; exit 1 ;;
          esac
          modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET" >/dev/null
          echo 'Modal authentication configured.'

      - name: Deploy exact frozen V143 L4 worker
        shell: bash
        run: |
          set -euo pipefail
          modal deploy --env main analyzer/v143_modal_live_endpoint.py

      - name: Run reference-free worker dependency smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug/v143-contextual-prune/modal-restore
          python - <<'PY'
          import json
          import modal
          from pathlib import Path

          fn = modal.Function.from_name(
              'dadrock-v143-ai-tab-live',
              'rhythm_dependency_smoke',
              environment_name='main',
          )
          result = fn.remote()
          safe = {
              'cudaAvailable': result.get('cudaAvailable'),
              'deviceName': result.get('deviceName'),
              'deterministicSeparatorSeed': result.get('deterministicSeparatorSeed'),
              'featureCount': result.get('featureCount'),
              'referenceFree': result.get('referenceFree'),
              'demucsModel': result.get('demucsModel'),
              'bsRoformerModel': result.get('bsRoformerModel'),
              'demucsShifts': result.get('demucsShifts'),
              'basicPitchImported': result.get('basicPitchImported'),
              'bendEvidenceImported': result.get('bendEvidenceImported'),
              'bendConsensusImported': result.get('bendConsensusImported'),
              'legatoEvidenceImported': result.get('legatoEvidenceImported'),
              'deterministicProviderImported': result.get('deterministicProviderImported'),
              'professionalReferenceUsed': False,
              'runtimeLabelsRequired': False,
              'referenceFacingAccuracyScored': False,
              'referenceScoreCalls': 0,
          }
          Path('debug/v143-contextual-prune/modal-restore/worker-smoke.json').write_text(
              json.dumps(safe, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(safe, indent=2))
          required_true = [
              'cudaAvailable',
              'referenceFree',
              'basicPitchImported',
              'bendEvidenceImported',
              'bendConsensusImported',
              'legatoEvidenceImported',
              'deterministicProviderImported',
          ]
          if not all(safe.get(key) is True for key in required_true):
              raise SystemExit('Frozen V143 worker dependency smoke failed')
          if safe.get('deterministicSeparatorSeed') != 143:
              raise SystemExit('Unexpected deterministic separator seed')
          PY

      - name: Deploy exact frozen lightweight HTTP bridge
        shell: bash
        run: |
          set -euo pipefail
          modal deploy --env main analyzer/v143_modal_http_endpoint.py

      - name: Verify bridge exists and fails closed without analyzer token
        shell: bash
        run: |
          set -euo pipefail
          OUT=debug/v143-contextual-prune/modal-restore
          STATUS="$(curl \
            --silent --show-error --location \
            --max-time 60 \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            --output "$OUT/bridge-unauthorized.json" \
            --write-out '%{http_code}' \
            "$V143_BRIDGE_URL")"
          echo "bridgeUnauthenticatedStatus=$STATUS"
          test "$STATUS" = '401'
          rm -f "$OUT/bridge-unauthorized.json"

          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('debug/v143-contextual-prune/modal-restore')
          worker = json.loads((out / 'worker-smoke.json').read_text())
          summary = {
              'schemaVersion': 1,
              'gate': 'v143-frozen-modal-production-restore',
              'sourceCommit': '379ca54cce0f7f962c1e22caebfd6f49b8e4edb9',
              'workerApp': 'dadrock-v143-ai-tab-live',
              'workerFunction': 'rhythm_v143_request',
              'bridgeApp': 'dadrock-v143-http-bridge',
              'bridgeEndpoint': 'https://dadrockyt--dadrock-v143-http-bridge-analyze.modal.run',
              'workerDependencySmoke': worker,
              'bridgeUnauthenticatedStatus': 401,
              'bridgeFailClosed': True,
              'referenceFacingAccuracyScored': False,
              'referenceScoreCalls': 0,
          }
          (out / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Preserve aggregate restore evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-frozen-modal-production-restore
          path: debug/v143-contextual-prune/modal-restore/summary.json
          if-no-files-found: warn
          retention-days: 14
