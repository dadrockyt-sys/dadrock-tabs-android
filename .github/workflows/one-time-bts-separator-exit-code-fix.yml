name: One-time BTS separator exit-code fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-bts-separator-exit-code-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Trust generated Demucs stems
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('analyzer/modal_bts_separator.py')
          text = path.read_text()
          old = '    if result.returncode != 0 or not outputs:\n'
          new = '    if not outputs:\n'
          if old not in text:
              raise SystemExit('Expected Demucs result check not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/one-time-bts-separator-exit-code-fix.yml

      - name: Commit BTS separator result handling fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analyzer/modal_bts_separator.py .github/workflows/one-time-bts-separator-exit-code-fix.yml
          git commit -m 'Trust completed BTS Demucs stem outputs'
          git push origin main
