          - Added fail-closed no-audio verifier `validation/v168_splitmysong_diagnostic/verify_ffmpeg_normalizer_v168.py`, current blob **`c72dcb121405b0211d6b64f91d33c3de2d5de09a`**. It requires Debian 13, exact dpkg FFmpeg version `7:7.1.5-0+deb13u1`, and matching FFmpeg binary version before arm can proceed.
          - `codespace_status.sh` now runs the exact FFmpeg verifier before the frozen CPU/model/repository verifier; current blob **`434599bf4aab5db0e72e0b3923c46db089072ee7`**.
          - `run_private_arm_preflight.sh` now runs the exact FFmpeg verifier before environment verification and audio normalization; current blob **`7f22cd3832f7d2e64d05da6996edc93d6d1982ad`**.
          - The no-audio GitHub Actions workflow `V168 SplitMySong CPU environment smoke` was extended to build the corrected image and separately verify the exact FFmpeg normalizer plus the CPU/reference-blind environment. Run **33555154045**, job **100014047776**, head commit **`7efef8a230567d97abfa2dfea889454fcef79591`**, completed **SUCCESS**: image build PASS, exact FFmpeg normalizer PASS, CPU/reference-blind environment PASS.
