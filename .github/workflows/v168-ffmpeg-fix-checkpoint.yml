name: V168 SplitMySong FFmpeg fix checkpoint

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v168-ffmpeg-fix-checkpoint.yml

permissions:
  contents: write

jobs:
  append-checkpoint:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0

      - name: Append verified FFmpeg correction checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat >> docs/checkpoints/CURRENT_STATE.md <<'EOF'

          ## 2026-09-01 continuation checkpoint — SplitMySong FFmpeg normalization correction verified
          - The private Codespace normalization diagnostic classified the first arm-preflight failure as **`PCM_DIFFERENCE`**, not a WAV-wrapper-only difference. The exact frozen source SHA256 still matched `6601b8d01cbbbe6b6e70d9ec0ca3c15d17873c78e62ae4acdc258c96f168e3c9`.
          - The old Codespace was Debian 12 / FFmpeg **5.1.9-0+deb12u1**. It produced normalized WAV SHA256 `7717939de51bbb3cafab85427fd8273411935ca03848823d326d8bf4effacfd6` and raw PCM SHA256 **`fe8fd3d83600027afd0827cee6eb821371a3b3ce3a8907fd761be345a94538f3`**, which differs from the frozen raw PCM SHA256 **`2c5dc122c2d37e562d90a13eac0c6dcac534ad7ee562fecd154b98e9124f63dd`**.
          - Root cause is therefore decoder/resampler environment drift. The frozen normalization was produced/reproduced with Debian 13 (`trixie`) FFmpeg package **`7:7.1.5-0+deb13u1`**; the arm gate correctly failed before pitch inference.
