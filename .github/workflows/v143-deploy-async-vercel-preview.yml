name: V143 Deploy Async Vercel Preview

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-deploy-async-vercel-preview.yml

permissions:
  contents: read

concurrency:
  group: v143-deploy-async-vercel-preview
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_qJrw8Cuze5bCEg9M3Q67XMWt
  VERCEL_PROJECT_ID: prj_6biwsn0iHci6FHNswAUCS8UYrAqF
  NEXT_TELEMETRY_DISABLED: '1'
  NO_COLOR: '1'
  EXPECTED_ROUTE_BLOB: '742954146a86aa36485d0bbdb3fbd6691a64a712'
  EXPECTED_PAGE_BLOB: 'de39f2715c6875d757ef730c9e3182ccd4aa00a4'
  EXPECTED_BRIDGE_BLOB: 'e0cecefacead73d69a905fd6bfb2049b21c87bc3'

jobs:
  deploy-async-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Enforce exact preview source boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test "$(git hash-object app/api/analyze-audio-tab/route.js)" = "$EXPECTED_ROUTE_BLOB"
          test "$(git hash-object app/ai-tab/page.js)" = "$EXPECTED_PAGE_BLOB"
          test "$(git hash-object analyzer/v143_modal_http_endpoint.py)" = "$EXPECTED_BRIDGE_BLOB"
          echo 'productionVercelTargeted=false'
          echo 'modelExecuted=false'
          echo 'audioRead=false'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global vercel@59.11.2
          test "$(vercel --version | tail -n 1)" = '59.11.2'

      - name: Pull preview environment
        shell: bash
        run: |
          set -euo pipefail
          vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"

      - name: Build exact preview candidate
        shell: bash
        run: |
          set -euo pipefail
          vercel build --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt preview only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --token "$VERCEL_TOKEN" | tail -n 1)"
          echo "$DEPLOYMENT_URL" | grep -Eq '^https://[^ ]+\.vercel\.app$'
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "previewDeploymentUrl=$DEPLOYMENT_URL"
          echo 'productionPromotionPerformed=false'

      - name: Confirm protected preview page access
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          STATUS="$(vercel curl /ai-tab --deployment "$DEPLOYMENT_URL" -- --silent --show-error --location --max-time 30 --output /dev/null --write-out '%{http_code}')"
          echo "previewAiTabStatus=$STATUS"
          test "$STATUS" = '200'

      - name: Preserve aggregate preview deployment evidence
        if: always()
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          OUT=debug/v143-contextual-prune/async-vercel-preview-deploy
          mkdir -p "$OUT"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          summary = {
              'schemaVersion': 1,
              'gate': 'v143-async-vercel-preview-deploy',
              'sourceCommit': os.environ.get('GITHUB_SHA'),
              'previewDeploymentUrl': os.environ.get('DEPLOYMENT_URL') or None,
              'routeBlob': os.environ['EXPECTED_ROUTE_BLOB'],
              'pageBlob': os.environ['EXPECTED_PAGE_BLOB'],
              'bridgeBlob': os.environ['EXPECTED_BRIDGE_BLOB'],
              'productionPromotionPerformed': False,
              'modelExecuted': False,
              'audioRead': False,
              'referenceFacingInputs': 0,
              'referenceScoreCalls': 0,
              'qualityVerdictMade': False,
          }
          Path('debug/v143-contextual-prune/async-vercel-preview-deploy/summary.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload aggregate preview deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-async-vercel-preview-deploy
          path: debug/v143-contextual-prune/async-vercel-preview-deploy/summary.json
          if-no-files-found: warn
          retention-days: 14
