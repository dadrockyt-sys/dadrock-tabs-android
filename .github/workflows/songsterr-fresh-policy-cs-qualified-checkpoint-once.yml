name: Songsterr Fresh Policy C-S Qualified Checkpoint Once

on:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-policy-cs-qualified-checkpoint-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: songsterr-fresh-pipeline-v1
          fetch-depth: 0
      - name: Record live Policy C-S qualification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          p=Path('docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md')
          t=p.read_text(encoding='utf-8')
          old='- No real Policy C-S probe, enrollment, canary, or qualification has run yet. The next real step is to update the existing 4-core Codespace to the final branch commit, keep the worktree clean, run `probe`, review it, run `enroll`, then run `qualify` without stopping/restarting or pulling further branch changes between enrollment and completion.'
          new=(
              '- LIVE POLICY C-S QUALIFICATION SUCCEEDED on the user\'s active 4-core Codespace boot session at source commit '
              '`b2f246769340e4f7f6929e679692956c731efd93`. Terminal output reported '
              '`CODESPACES_SESSION_AUTHORITY_QUALIFICATION_COMPLETE`, `surfaceQualifiedForCurrentBootSession=true`, '
              '`canaryExecutions=3`, authority epoch `263237f0-b5dc-4710-bef4-e0ac855c2312`, session fingerprint '
              '`665db72ea170c6ebc51ad34348158bb12a5ded423068519f0281f4c67121ccef`, base compute fingerprint '
              '`f2ef7b579bc41b071e3856b1e02e46bc60acfc43f5d0ef7f440026ddc00bd449`, and boot-id SHA-256 '
              '`df14d2784ffff900225b7c48b2d231ee6154ab14eae95b787a55c7c59499db2d`. The exact three-canary aggregator therefore '
              'demonstrated reproducibility for this current boot session only. `modelValidationComplete=false`, customer-eligible events remain 0, '
              '`durationAuthorityChanged=false`. Stopping/restarting/rebuilding or source/fingerprint drift invalidates this qualification.'
          )
          if old not in t:
              raise SystemExit('POLICY_CS_PENDING_MARKER_CHANGED')
          t=t.replace(old,new,1)
          t=t.replace(
              '5. Run `bash scripts/songsterr-fresh/codespaces_session_authority.sh probe` and review `/workspaces/.songsterr-fresh-session-authority/session-probe.json`. Probe alone remains non-authoritative. Then explicitly run `... enroll`; this creates one boot/session/source-bound authority epoch but still does not qualify it.',
              '5. Policy C-S probe/enrollment/three-canary qualification is complete and green for the currently active Codespace epoch `263237f0-b5dc-4710-bef4-e0ac855c2312` at source commit `b2f246769340e4f7f6929e679692956c731efd93`. Do not pull, commit, rebuild, stop, or restart this Codespace while using the qualified session.'
          )
          t=t.replace(
              '6. Without stopping/restarting/rebuilding or changing the source commit, run `bash scripts/songsterr-fresh/codespaces_session_authority.sh qualify`. This performs three fresh full model executions and exact aggregation. Any pre/post session drift or output drift fails closed.',
              '6. Use the still-active qualified Policy C-S session for the separate model-evidence validation review. Reproducibility qualification alone does not establish Basic Pitch correctness and must not change model-validation or delivery state.'
          )
          lines=t.splitlines()
          stamp=datetime.now(ZoneInfo('America/Toronto')).strftime('%Y-%m-%d %H:%M America/Toronto')
          for i,line in enumerate(lines):
              if line.startswith('Updated: '):
                  lines[i]=f'Updated: {stamp}'
                  break
          p.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print('POLICY_CS_LIVE_QUALIFICATION_CHECKPOINTED')
          PY
      - name: Commit checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dadrockyt-sys'
          git config user.email 'Stephen.s.mcnally@gmail.com'
          git add docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md
          git commit -m 'docs: record live Policy C-S qualification'
          git push origin HEAD:songsterr-fresh-pipeline-v1
