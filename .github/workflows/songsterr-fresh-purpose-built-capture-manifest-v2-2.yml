name: Songsterr Fresh Purpose-Built Capture Manifest V2.2

on:
  workflow_dispatch:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - "scripts/songsterr-fresh/purpose_built_capture_manifest_contract_v2_2.py"
      - "scripts/songsterr-fresh/test_purpose_built_capture_manifest_contract_v2_2.py"
      - ".github/workflows/songsterr-fresh-purpose-built-capture-manifest-v2-2.yml"

jobs:
  synthetic-capture-manifest-v22:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile V2.2 validator and tests
        run: python -m py_compile scripts/songsterr-fresh/purpose_built_capture_manifest_contract_v2_2.py scripts/songsterr-fresh/test_purpose_built_capture_manifest_contract_v2_2.py
      - name: Run synthetic contract tests first
        run: python scripts/songsterr-fresh/test_purpose_built_capture_manifest_contract_v2_2.py
      - name: Generate official frozen synthetic V2.2 declaration
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          path = Path("scripts/songsterr-fresh/test_purpose_built_capture_manifest_contract_v2_2.py")
          spec = importlib.util.spec_from_file_location("fixture_v22", path)
          assert spec and spec.loader
          fixture = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fixture)
          manifest = fixture.valid_manifest()
          manifest["corpus"]["referenceCalibrationPackage"]["validationResultSha256"] = (
              "4fd62e62a855031bd3c189253bc04f004d271d53bf2b636c586c15b93e59e98f"
          )
          Path("synthetic-purpose-built-capture-manifest-v2-2.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Run official frozen synthetic V2.2 validator
        run: |
          python scripts/songsterr-fresh/purpose_built_capture_manifest_contract_v2_2.py \
            --manifest synthetic-purpose-built-capture-manifest-v2-2.json \
            --output synthetic-purpose-built-capture-manifest-v2-2-result.json
      - name: Print frozen result summary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          path = Path("synthetic-purpose-built-capture-manifest-v2-2-result.json")
          result = json.loads(path.read_text())
          print("contract", result["contract"])
          print("contractValid", result["contractValid"])
          print("bridgeVersion", result["calibrationPackageBridgeVersion"])
          print("packageBindingSha256", result["calibrationPackageBindingSha256"])
          print("validationResultSha256", result["calibrationPackageValidationResultSha256"])
          print("admittedPopulationManifestSha256", result["admittedPopulationManifestSha256"])
          print("mayAdvanceToReferenceBlindStructuralAudit", result["mayAdvanceToReferenceBlindStructuralAudit"])
          print("resultSha256", hashlib.sha256(path.read_bytes()).hexdigest())
          print(json.dumps({
              "realCalibrationAuthorized": result["realCalibrationAuthorized"],
              "realHoldoutCaptureAuthorized": result["realHoldoutCaptureAuthorized"],
              "basicPitchAuthorized": result["basicPitchAuthorized"],
              "v6Authorized": result["v6Authorized"],
              "correctnessAuthorized": result["correctnessAuthorized"],
              "modelValidationComplete": result["modelValidationComplete"],
              "customerEligibleEvents": result["customerEligibleEvents"],
              "mayAdvanceDelivery": result["mayAdvanceDelivery"],
          }, sort_keys=True))
          PY
      - name: Upload canonical V2.2 result
        uses: actions/upload-artifact@v4
        with:
          name: songsterr-fresh-purpose-built-capture-manifest-v2-2
          path: synthetic-purpose-built-capture-manifest-v2-2-result.json
          if-no-files-found: error
          retention-days: 30
