name: Stop Legacy V143 Modal Crash Loop

on:
  push:
    branches:
      - ops-stop-v143-modal-crash-loop
    paths:
      - .github/workflows/stop-v143-modal-crash-loop.yml

permissions:
  contents: read

jobs:
  stop-modal-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Modal credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}" || { echo "MODAL_TOKEN_ID is not configured"; exit 1; }
          test -n "${MODAL_TOKEN_SECRET:-}" || { echo "MODAL_TOKEN_SECRET is not configured"; exit 1; }

      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check "modal>=1.4,<2"

      - name: Show legacy app before stop
        shell: bash
        run: |
          set -euo pipefail
          modal app list --env main

      - name: Stop legacy crash-looping app
        shell: bash
        run: |
          set -euo pipefail
          modal app stop dadrock-v143-demucs-one-shot-probe --env main --yes

      - name: Verify legacy app after stop
        shell: bash
        run: |
          set -euo pipefail
          modal app list --env main
