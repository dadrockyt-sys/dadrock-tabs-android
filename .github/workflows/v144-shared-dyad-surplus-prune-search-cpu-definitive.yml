name: V144 Family 14 Shared Dyad Surplus Search Definitive CPU Proof

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - debug/v144-rhythm-calibration/triggers/shared-dyad-surplus-prune-search-cpu-definitive.txt

permissions:
  contents: write

jobs:
  definitive-search-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact frozen search/test/dependency blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object validation/v144_rhythm_calibration/search_atomic_shared_dyad_surplus_prunes.py)" = "dd02c492ecfef26bbb15e8d345346ff75bb5fa30"
          test "$(git hash-object modal/tests/test_v144_rhythm_shared_dyad_surplus_prune_search.py)" = "77758ead57a2735ba653bbba64e78c4124d34798"
          test "$(git hash-object modal/v144_rhythm_shared_dyad_surplus_prune_policy.py)" = "1f6cc7fcaf2d4ac7838b48b839c617b04cb1c34e"
          test "$(git hash-object validation/v144_rhythm_calibration/analyze_singleton_baseline_fit_residuals.py)" = "27ac8699279db8fc0208d067479ad3751da1a630"
          test "$(git hash-object validation/v144_rhythm_calibration/analyze_split_baseline.py)" = "1569bf01554be345ca9199a85f700db7743501a5"
          test "$(git hash-object validation/v144_rhythm_calibration/score_selected_conjunction_candidate.py)" = "1ca2b8550d6c08e793f26b3aa91b99fb44fa7ddb"
          test "$(git hash-object validation/v144_rhythm_calibration/search_single_signature_prunes.py)" = "699dd1a16725ecf11797e42829aa409ee5909000"
          test "$(git hash-object modal/v144_rhythm_context_split_policy.py)" = "2da58508f2132660ad317ee63d5cb043d58285f0"
          test "$(git hash-object modal/v144_rhythm_measure_set_guard.py)" = "4a1364204dd1e720c09d835ec3995c165047de98"
          test "$(git hash-object modal/v144_rhythm_staged_selector.py)" = "d176a9a69366e192e6fa75bc1039661e977f0bfa"
          test "$(git hash-object modal/v144_rhythm_pitch_shift_policy.py)" = "d9998c59acddba070069668d62bcb1c3cdaf2b05"
          test "$(git hash-object validation/rhythm_holdout/canonical.py)" = "088d44827fb23e20d9aeeb4944a672989af5846c"
          test "$(git hash-object validation/rhythm_holdout/score_rhythm_holdout.py)" = "cc4bf61a99f22bf87a6c255e5a81220fbc82223b"

      - name: Compile exact frozen family 14 search and tests
        run: |
          python -m py_compile \
            validation/v144_rhythm_calibration/search_atomic_shared_dyad_surplus_prunes.py \
            modal/tests/test_v144_rhythm_shared_dyad_surplus_prune_search.py

      - name: Run exact frozen family 14 synthetic search proof
        run: |
          python -m unittest -v modal.tests.test_v144_rhythm_shared_dyad_surplus_prune_search

      - name: Write success proof only after all checks pass
        env:
          PROOF_TRIGGER_SHA: ${{ github.sha }}
          PROOF_RUN_ID: ${{ github.run_id }}
          PROOF_RUN_ATTEMPT: ${{ github.run_attempt }}
          PROOF_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PROOF_JOB: ${{ github.job }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('debug/v144-rhythm-calibration/proofs/shared-dyad-surplus-prune-search-cpu.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          payload = {
              'schemaVersion': 14428,
              'family': 14,
              'proof': 'shared-dyad-surplus-prune-search-cpu',
              'status': 'success',
              'branch': 'v143-contextual-prune-lobo',
              'triggerSha': os.environ['PROOF_TRIGGER_SHA'],
              'runId': int(os.environ['PROOF_RUN_ID']),
              'runAttempt': int(os.environ['PROOF_RUN_ATTEMPT']),
              'workflowSha': os.environ['PROOF_WORKFLOW_SHA'],
              'job': os.environ['PROOF_JOB'],
              'searchBlob': 'dd02c492ecfef26bbb15e8d345346ff75bb5fa30',
              'testBlob': '77758ead57a2735ba653bbba64e78c4124d34798',
              'policyBlob': '1f6cc7fcaf2d4ac7838b48b839c617b04cb1c34e',
              'testModule': 'modal.tests.test_v144_rhythm_shared_dyad_surplus_prune_search',
              'fitLabelsRead': False,
              'validationLabelsRead': False,
              'canaryLabelsRead': False,
              'runtimeReferenceInput': False,
              'modalGpuUsed': False,
              'liveSearchRun': False,
          }
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/v144-rhythm-calibration/proofs/shared-dyad-surplus-prune-search-cpu.json
          git commit -m "v144 record family 14 search CPU proof"
          git push origin HEAD:v143-contextual-prune-lobo
