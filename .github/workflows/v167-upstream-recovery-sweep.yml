name: V167 preregistered upstream recovery sweep

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v167-upstream-recovery-sweep.yml

permissions:
  contents: write

concurrency:
  group: v167-upstream-recovery-sweep-once
  cancel-in-progress: false

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: d4a9a8443f08ede32f05677bee36f3445ca66d14
  BASE: debug/v167-single-song-calibration/iteration-002-generated.json
  POOL: debug/v167-single-song-calibration/nearmiss-evidence-pool.json
  TIMEBASE: debug/v166-cpu-autonomous/timebase.json
  BASE_BUILDER: validation/v167_single_song_calibration/build_upstream_recovery_variants_v167.py
  BUILDER: validation/v167_single_song_calibration/build_upstream_recovery_variants_v167_rearm.py
  GRADER: validation/v167_single_song_calibration/score_upstream_recovery_variants_v167.py
  SCORER: validation/v154_cpu_multitrack/score_frontend_reference.py
  REFERENCE: research/v154-professional-references/scorer-ready/frontend-reference-payload.json
  VARIANT_ROOT: /tmp/v167-upstream-recovery-variants
  MANIFEST: debug/v167-single-song-calibration/upstream-recovery-rule-sweep-manifest.json
  OUTPUT: debug/v167-single-song-calibration/upstream-recovery-rule-sweep.json
  RECEIPT: debug/v167-single-song-calibration/upstream-recovery-rule-sweep-receipt.json
  CUDA_VISIBLE_DEVICES: ""
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  sweep-once:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact preregistered sweep re-arm
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.21'

      - name: Verify immutable preregistration boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v167-upstream-recovery-sweep.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"
          test "$(git hash-object "$BASE")" = "7eba73700116ceeca580a8851abe399aed764834"
          test "$(git hash-object "$POOL")" = "aa7da3a55344b1418a291f30fab9ca55858fc094"
          test "$(git hash-object "$TIMEBASE")" = "abebae25801b7ddeb5b933977c4f4a918f7bf9ef"
          test "$(git hash-object "$BASE_BUILDER")" = "24413d321f64bbfcce48812ceb85b4593dcfa80c"
          test "$(git hash-object "$BUILDER")" = "fbbee07493084792912c774d375ca5011672891f"
          test "$(git hash-object "$GRADER")" = "32304261ff9e6bec00d22eabea08cf5070cd3d3e"
          test "$(git hash-object "$SCORER")" = "9644e65719fbd361a9b39778ae9950c5e983e855"
          test "$(git hash-object "$REFERENCE")" = "2fbed60b543c0488934d8642c488aa06bf31bbf5"
          test "$(git hash-object docs/checkpoints/CURRENT_STATE.md)" = "7f444821942df7be67ee3b9146056eabad7ba391"
          test ! -e "$MANIFEST"
          test ! -e "$OUTPUT"
          test ! -e "$RECEIPT"
          python -m py_compile "$BASE_BUILDER" "$BUILDER" "$GRADER" "$SCORER"
          python - <<'PY'
          import hashlib, importlib.util
          from pathlib import Path
          checks={
            'debug/v167-single-song-calibration/iteration-002-generated.json':'96fbc329d9ba46b06d430c7c3c7b7f5b0e9077f6e133da5c3165c1fde609b5cc',
            'debug/v167-single-song-calibration/nearmiss-evidence-pool.json':'1c983784c2d12a22437a80387525789bcf55a2f4e4a5c7a96608c575bf709673',
            'research/v154-professional-references/scorer-ready/frontend-reference-payload.json':'b39a203aec3f45800891fe4eca156e37e7571b91ea5c4ccc41b30bbc95fc89e7',
          }
          for path,expected in checks.items():
              actual=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert actual==expected,(path,actual,expected)
          for path in (
              Path('validation/v167_single_song_calibration/build_upstream_recovery_variants_v167.py'),
              Path('validation/v167_single_song_calibration/build_upstream_recovery_variants_v167_rearm.py'),
          ):
              text=path.read_text()
              for forbidden in ('frontend-reference-payload.json','score_frontend_reference.py'):
                  assert forbidden not in text,(path,forbidden)
          path=Path('validation/v167_single_song_calibration/build_upstream_recovery_variants_v167_rearm.py')
          spec=importlib.util.spec_from_file_location('_v167_rearm_guard',path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          configs=list(module.bass_configs())
          assert len(configs)==97,len(configs)
          assert sum(bool(c.get('baseline',False)) for c in configs)==1
          nonbase=[c for c in configs if not c.get('baseline',False)]
          assert all(c.get('newRecoveryCapPerPreviouslyEmptyStep')==1 for c in nonbase)
          assert all(c.get('preExistingIteration002StepCollisionsPreserved') is True for c in nonbase)
          PY

      - name: Generate and seal all variants before reference scoring
        shell: bash
        run: |
          set -euo pipefail
          python "$BUILDER" \
            --base "$BASE" \
            --pool "$POOL" \
            --timebase "$TIMEBASE" \
            --output-dir "$VARIANT_ROOT" \
            --manifest "$MANIFEST"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          manifest=Path('debug/v167-single-song-calibration/upstream-recovery-rule-sweep-manifest.json')
          m=json.loads(manifest.read_text())
          variants=m['variants']
          assert len(variants)==146,len(variants)
          assert sum(v['stream']=='combinedGuitar' for v in variants)==49
          assert sum(v['stream']=='bass' for v in variants)==97
          assert m['policy']['referenceRead'] is False
          assert m['policy']['scorerRead'] is False
          assert m['policy']['allVariantRulesPredeclaredBeforeScoring'] is True
          assert m['policy']['individualEventSelectionByReference'] is False
          root=Path('/tmp/v167-upstream-recovery-variants')
          for row in variants:
              p=root/row['relativePath']
              assert p.is_file()
              assert hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256'],row['id']
          additions={stream:[int(v['summary']['added']) for v in variants if v['stream']==stream] for stream in ('combinedGuitar','bass')}
          print('Manifest SHA256',hashlib.sha256(manifest.read_bytes()).hexdigest())
          print('Guitar variant additions min/max',min(additions['combinedGuitar']),max(additions['combinedGuitar']))
          print('Bass variant additions min/max',min(additions['bass']),max(additions['bass']))
          PY
          chmod -R a-w "$VARIANT_ROOT"
          chmod a-w "$MANIFEST"

      - name: Grade complete frozen variants
        shell: bash
        run: |
          set -euo pipefail
          python "$GRADER" \
            --variant-root "$VARIANT_ROOT" \
            --manifest "$MANIFEST" \
            --reference "$REFERENCE" \
            --scorer-code "$SCORER" \
            --output "$OUTPUT"
          python - <<'PY'
          import json
          report=json.load(open('debug/v167-single-song-calibration/upstream-recovery-rule-sweep.json'))
          assert report['selectionPolicy']['allVariantsFrozenBeforeReferenceRead'] is True
          assert report['selectionPolicy']['individualEventSelectionByReference'] is False
          assert report['selectionPolicy']['automaticIteration003Promotion'] is False
          assert len(report['variants'])==146
          for stream in ('combinedGuitar','bass'):
              print(stream,'winner',json.dumps(report['winners'][stream],sort_keys=True))
          PY

      - name: Freeze sweep report receipt and self-seal
        shell: bash
        run: |
          set -euo pipefail
          chmod u+w "$MANIFEST"
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          manifest=Path('debug/v167-single-song-calibration/upstream-recovery-rule-sweep-manifest.json')
          output=Path('debug/v167-single-song-calibration/upstream-recovery-rule-sweep.json')
          receipt=Path('debug/v167-single-song-calibration/upstream-recovery-rule-sweep-receipt.json')
          report=json.loads(output.read_text())
          r={
            'schema':'dadrock.tabs.v167.upstream-recovery-rule-sweep-receipt.v1',
            'version':'V167',
            'status':'UPSTREAM_RECOVERY_SWEEP_FROZEN',
            'classification':'SINGLE_SONG_TRAINING_CALIBRATION_ONLY',
            'workflowRunId':int(os.environ['GITHUB_RUN_ID']),
            'workflowRunNumber':int(os.environ['GITHUB_RUN_NUMBER']),
            'workflowRunAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'workflowHeadSha':os.environ['GITHUB_SHA'],
            'manifestSha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),
            'manifestGitBlob':subprocess.check_output(['git','hash-object',str(manifest)],text=True).strip(),
            'reportSha256':hashlib.sha256(output.read_bytes()).hexdigest(),
            'reportGitBlob':subprocess.check_output(['git','hash-object',str(output)],text=True).strip(),
            'inputs':{
              'iteration002GitBlob':'7eba73700116ceeca580a8851abe399aed764834',
              'evidencePoolGitBlob':'aa7da3a55344b1418a291f30fab9ca55858fc094',
              'timebaseGitBlob':'abebae25801b7ddeb5b933977c4f4a918f7bf9ef',
              'referenceGitBlob':'2fbed60b543c0488934d8642c488aa06bf31bbf5',
              'scorerGitBlob':'9644e65719fbd361a9b39778ae9950c5e983e855',
            },
            'implementation':{
              'baseBuilderGitBlob':'24413d321f64bbfcce48812ceb85b4593dcfa80c',
              'rearmBuilderGitBlob':'fbbee07493084792912c774d375ca5011672891f',
              'graderGitBlob':'32304261ff9e6bec00d22eabea08cf5070cd3d3e',
            },
            'variantCounts':{'combinedGuitar':49,'bass':97,'total':146},
            'winners':report['winners'],
            'policy':{
              'variantsFrozenBeforeReferenceRead':True,
              'individualEventSelectionByReference':False,
              'postScoreCandidateMutation':False,
              'preExistingIteration002BassStepCollisionsPreserved':True,
              'newBassRecoveryEventsOnlyOnPreviouslyEmptySteps':True,
              'iteration003Created':False,
              'gpuCudaModalUsed':False,
              'mainOrProductionModified':False,
              'generalizationClaim':False,
            },
          }
          receipt.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          rm .github/workflows/v167-upstream-recovery-sweep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$MANIFEST" "$OUTPUT" "$RECEIPT" .github/workflows/v167-upstream-recovery-sweep.yml
          changed="$(git diff --cached --name-only)"
          if echo "$changed" | grep -Ev '^debug/v167-single-song-calibration/upstream-recovery-rule-sweep(-manifest|-receipt)?\.json$|^\.github/workflows/v167-upstream-recovery-sweep\.yml$'; then
            echo 'Unexpected V167 recovery-sweep path' >&2
            exit 1
          fi
          git commit -m "research: freeze V167 upstream recovery rule sweep [skip ci]"
          git push origin HEAD:"$BRANCH"
