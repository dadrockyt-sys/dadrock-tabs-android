name: Songsterr Fresh Model Evidence Variation Tests

on:
  workflow_dispatch:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - 'scripts/songsterr-fresh/compare_basic_pitch_cross_run_evidence.py'
      - 'scripts/songsterr-fresh/aggregate_basic_pitch_cross_run_measurements.py'
      - 'scripts/songsterr-fresh/accumulate_basic_pitch_measurement_sets.py'
      - 'scripts/songsterr-fresh/basic_pitch_decision_surface_diagnostic.py'
      - 'scripts/songsterr-fresh/test_candidate_confidence_diagnostic_only.mjs'
      - 'songsterr_pipeline/noteEvidenceEvaluator.mjs'
      - 'songsterr_pipeline/noteEvidenceDiagnostics.mjs'
      - '.github/workflows/songsterr-fresh-model-evidence-variation-tests.yml'

permissions:
  contents: read

concurrency:
  group: songsterr-fresh-model-evidence-variation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measurement-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out fresh branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pinned array dependency for decision-surface self-test
        run: python -m pip install --disable-pip-version-check numpy==1.26.4

      - name: Compile cross-run measurement contracts
        run: |
          python -m py_compile scripts/songsterr-fresh/compare_basic_pitch_cross_run_evidence.py
          python -m py_compile scripts/songsterr-fresh/aggregate_basic_pitch_cross_run_measurements.py
          python -m py_compile scripts/songsterr-fresh/accumulate_basic_pitch_measurement_sets.py
          python -m py_compile scripts/songsterr-fresh/basic_pitch_decision_surface_diagnostic.py

      - name: Prove pair measurement contract is reference-blind and fail-closed
        run: python scripts/songsterr-fresh/compare_basic_pitch_cross_run_evidence.py --self-test

      - name: Prove measurement-set contract is complete, bound, and non-promotional
        run: python scripts/songsterr-fresh/aggregate_basic_pitch_cross_run_measurements.py --self-test

      - name: Prove measurement-history accumulation is complete and non-promotional
        run: python scripts/songsterr-fresh/accumulate_basic_pitch_measurement_sets.py --self-test

      - name: Prove Basic Pitch decision surface is same-inference diagnostic-only evidence
        run: python scripts/songsterr-fresh/basic_pitch_decision_surface_diagnostic.py

      - name: Prove Basic Pitch candidate confidence is diagnostic-only for acceptance
        run: node scripts/songsterr-fresh/test_candidate_confidence_diagnostic_only.mjs
