name: Songsterr Fresh Independent Pitch Support Canary

on:
  workflow_dispatch:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-independent-pitch-support-canary.yml'
      - 'scripts/songsterr-fresh/probe_independent_pitch_support.py'
      - 'scripts/songsterr-fresh/basic_pitch_activation_evidence.py'
      - 'scripts/songsterr-fresh/transcribe_isolated_guitar_basic_pitch.py'
      - 'scripts/songsterr-fresh/build_isolated_polyphonic_note_evidence.mjs'
      - 'scripts/songsterr-fresh/build_note_evidence_context.mjs'
      - 'scripts/songsterr-fresh/build_note_evidence.mjs'
      - 'scripts/songsterr-fresh/run_model_note_evidence_pipeline_canary.mjs'
      - 'scripts/songsterr-fresh/verify_demucs_model_asset.py'
      - 'songsterr_pipeline/**'

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  independent-pitch-support:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out fresh branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Prove probe source has no model process or network imports
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/songsterr-fresh/probe_independent_pitch_support.py
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('scripts/songsterr-fresh/probe_independent_pitch_support.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          forbidden = (
              'basic_pitch.inference',
              'demucs',
              'torch',
              'tensorflow',
              'tflite_runtime',
              'subprocess',
              'requests',
              'httpx',
              'urllib',
          )
          imported = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported.extend(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imported.append(node.module)
          violations = sorted({
              name for name in imported
              if any(name == prefix or name.startswith(prefix + '.') for prefix in forbidden)
          })
          if violations:
              raise SystemExit(f'PITCH_SUPPORT_FORBIDDEN_IMPORTS:{violations}')
          print({'imports': imported, 'forbiddenImportViolations': violations})
          PY

      - name: Fetch and decode exact authorized fixture
        shell: bash
        run: |
          set -euo pipefail
          BASE=/tmp/songsterr-fresh-pitch-support
          mkdir -p "$BASE"
          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/dadrockyt-sys/dadrock-tabs-android/main/public/jimmy-paige-midterm-v1/gomyway-midterm-source.m4a' \
            --output /tmp/gomyway-midterm-source.m4a
          test "$(git hash-object /tmp/gomyway-midterm-source.m4a)" = '4dd709e3fa177b4daeed71ca97f0199757729d4b'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/gomyway-midterm-source.m4a -ac 1 -ar 22050 \
            /tmp/gomyway-midterm-analysis.wav
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/gomyway-midterm-source.m4a -ac 2 -ar 44100 \
            /tmp/gomyway-midterm-separation.wav
          sha256sum /tmp/gomyway-midterm-analysis.wav | tee "$BASE/analysis-input.sha256"
          sha256sum /tmp/gomyway-midterm-separation.wav | tee "$BASE/separation-input.sha256"

      - name: Install pinned model and analysis dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 \
            torch==2.14.0 \
            huggingface-hub==1.30.0 \
            safetensors==0.8.0 \
            sphn==0.2.1 \
            demucs==4.1.0 \
            basic-pitch==0.4.0 \
            librosa==0.11.0 \
            soundfile==0.13.1
          python - <<'PY'
          import importlib.metadata
          for name in ('numpy', 'torch', 'huggingface-hub', 'safetensors', 'sphn', 'demucs', 'basic-pitch', 'librosa', 'soundfile', 'tflite-runtime'):
              print(f'{name}=={importlib.metadata.version(name)}')
          PY

      - name: Rebuild and verify accepted frozen structure
        shell: bash
        run: |
          set -euo pipefail
          BASE=/tmp/songsterr-fresh-pitch-support
          python scripts/songsterr-fresh/analyze_full_mixture_structure.py \
            --input /tmp/gomyway-midterm-analysis.wav \
            --output "$BASE/raw-structure-analysis.json" \
            --audio-source 'public/jimmy-paige-midterm-v1/gomyway-midterm-source.m4a@main#4dd709e3fa177b4daeed71ca97f0199757729d4b'
          node scripts/songsterr-fresh/build_structure_map.mjs \
            "$BASE/raw-structure-analysis.json" \
            "$BASE/adapted-structure-map.json"
          node scripts/songsterr-fresh/build_note_evidence_context.mjs \
            "$BASE/adapted-structure-map.json" \
            "$BASE/note-evidence-context.json"
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          const context = JSON.parse(await readFile('/tmp/songsterr-fresh-pitch-support/note-evidence-context.json', 'utf8'));
          if (context?.structureIdentity?.signature !== 'fnv1a32:2f493225') {
            throw new Error(`PITCH_SUPPORT_FROZEN_STRUCTURE_CHANGED:${context?.structureIdentity?.signature}`);
          }
          if (context?.structureAcceptance?.accepted !== true) {
            throw new Error('PITCH_SUPPORT_REQUIRES_ACCEPTED_STRUCTURE');
          }
          NODE

      - name: Separate deterministic guitar stem and verify executed asset
        shell: bash
        run: |
          set -euo pipefail
          BASE=/tmp/songsterr-fresh-pitch-support
          python -m demucs \
            -n htdemucs_6s \
            --device cpu \
            --shifts 0 \
            --overlap 0.25 \
            --segment 7 \
            -o "$BASE/separated" \
            /tmp/gomyway-midterm-separation.wav
          STEM="$BASE/separated/htdemucs_6s/gomyway-midterm-separation/guitar.wav"
          test -s "$STEM"
          sha256sum "$STEM" | tee "$BASE/guitar-stem.sha256"
          python scripts/songsterr-fresh/verify_demucs_model_asset.py \
            --output "$BASE/demucs-model-asset.json"
          python - <<'PY'
          import json
          base = '/tmp/songsterr-fresh-pitch-support'
          with open(f'{base}/demucs-model-asset.json', 'r', encoding='utf-8') as handle:
              asset = json.load(handle)
          required = {
              'contract': 'songsterr-fresh-demucs-model-asset-v2',
              'primaryLoader': 'huggingface',
              'hfRepoId': 'adefossez/HTDemucs-6s',
              'hfPinnedRevision': '3c5ee475be622df764938de97e4281a7b07ffa58',
              'assetFilename': '5c90dfd2.safetensors',
              'assetSha256': 'd2a1745f0744721f6b8ca5bf469b67c651ea5ed1b52998cab033b2158609d411',
          }
          for key, expected in required.items():
              if asset.get(key) != expected:
                  raise SystemExit(f'PITCH_SUPPORT_DEMUCS_ASSET_CHANGED:{key}:{asset.get(key)}')
          PY

      - name: Infer duration-free polyphonic pitch evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE=/tmp/songsterr-fresh-pitch-support
          STEM="$BASE/separated/htdemucs_6s/gomyway-midterm-separation/guitar.wav"
          STEM_SHA="$(sha256sum "$STEM" | awk '{print $1}')"
          python scripts/songsterr-fresh/transcribe_isolated_guitar_basic_pitch.py \
            --input "$STEM" \
            --output "$BASE/basic-pitch-guitar-notes.json" \
            --audio-source 'public/jimmy-paige-midterm-v1/gomyway-midterm-source.m4a@main#4dd709e3fa177b4daeed71ca97f0199757729d4b' \
            --separation-source "demucs==4.1.0/htdemucs_6s/shifts=0:guitar@sha256:${STEM_SHA}"
          node scripts/songsterr-fresh/build_isolated_polyphonic_note_evidence.mjs \
            "$BASE/note-evidence-context.json" \
            "$BASE/basic-pitch-guitar-notes.json" \
            "$BASE/raw-model-note-evidence-duration-free.json"
          python - <<'PY'
          import json
          base = '/tmp/songsterr-fresh-pitch-support'
          with open(f'{base}/raw-model-note-evidence-duration-free.json', 'r', encoding='utf-8') as handle:
              evidence = json.load(handle)
          leaking = [
              row.get('onsetId') for row in evidence.get('onsets', [])
              if row.get('durationSeconds') is not None or row.get('sourceEnd') is not None
          ]
          if leaking:
              raise SystemExit(f'PITCH_SUPPORT_UPSTREAM_DURATION_LEAK:{leaking[:5]}')
          if evidence.get('provenance', {}).get('referenceTabUsed') is not False:
              raise SystemExit('PITCH_SUPPORT_REFERENCE_TAB_PROVENANCE_CHANGED')
          print({
              'eventCount': len(evidence.get('onsets', [])),
              'noteIdentity': evidence.get('provenance', {}).get('noteInferenceIdentity'),
          })
          PY

      - name: Run independent pitch-support probe twice
        shell: bash
        run: |
          set -euo pipefail
          BASE=/tmp/songsterr-fresh-pitch-support
          STEM="$BASE/separated/htdemucs_6s/gomyway-midterm-separation/guitar.wav"
          python scripts/songsterr-fresh/probe_independent_pitch_support.py \
            --input "$STEM" \
            --evidence "$BASE/raw-model-note-evidence-duration-free.json" \
            --output "$BASE/independent-pitch-support-a.json"
          python scripts/songsterr-fresh/probe_independent_pitch_support.py \
            --input "$STEM" \
            --evidence "$BASE/raw-model-note-evidence-duration-free.json" \
            --output "$BASE/independent-pitch-support-b.json"
          sha256sum "$BASE/independent-pitch-support-a.json" | tee "$BASE/pitch-support-a.sha256"
          sha256sum "$BASE/independent-pitch-support-b.json" | tee "$BASE/pitch-support-b.sha256"
          cmp "$BASE/independent-pitch-support-a.json" "$BASE/independent-pitch-support-b.json"

      - name: Prove pitch probe is descriptive identity-preserving evidence only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          base = '/tmp/songsterr-fresh-pitch-support'
          with open(f'{base}/raw-model-note-evidence-duration-free.json', 'r', encoding='utf-8') as handle:
              evidence = json.load(handle)
          with open(f'{base}/independent-pitch-support-a.json', 'r', encoding='utf-8') as handle:
              probe = json.load(handle)

          if probe.get('contract') != 'songsterr-fresh-independent-pitch-support-probe-v1':
              raise SystemExit('PITCH_SUPPORT_CONTRACT_CHANGED')
          if probe.get('descriptiveOnly') is not True or probe.get('referenceBlind') is not True:
              raise SystemExit('PITCH_SUPPORT_DESCRIPTIVE_REFERENCE_BLIND_GUARD_MISSING')
          if probe.get('method', {}).get('acceptanceThresholdDefined') is not False:
              raise SystemExit('PITCH_SUPPORT_MUST_NOT_DEFINE_ACCEPTANCE_THRESHOLD')
          if probe.get('method', {}).get('thresholdSweepUsed') is not False:
              raise SystemExit('PITCH_SUPPORT_MUST_NOT_SWEEP_THRESHOLDS')

          guards = probe.get('hardGuards', {})
          required_false = (
              'ownsAcceptanceDecision',
              'setsModelValidationComplete',
              'changesPitchIdentity',
              'writesDurationSeconds',
              'writesSourceEnd',
              'usesDecodedModelNoteEnd',
              'usesBasicPitchActivations',
              'invokesModel',
              'usesReferenceTab',
              'usesProfessionalScorer',
              'importsArchivedV143Logic',
              'thresholdSweepUsed',
              'acceptanceThresholdDefined',
          )
          if guards.get('descriptiveOnly') is not True:
              raise SystemExit('PITCH_SUPPORT_DESCRIPTIVE_GUARD_CHANGED')
          for key in required_false:
              if guards.get(key) is not False:
                  raise SystemExit(f'PITCH_SUPPORT_HARD_GUARD_CHANGED:{key}')

          evidence_rows = [
              (str(row['onsetId']), float(row['sourceStart']), int(row['selectedMidi']))
              for row in evidence.get('onsets', [])
          ]
          probe_rows = [
              (str(row['onsetId']), float(row['sourceStart']), int(row['selectedMidi']))
              for row in probe.get('events', [])
          ]
          if evidence_rows != probe_rows:
              raise SystemExit('PITCH_SUPPORT_EVENT_IDENTITY_CHANGED')
          if probe.get('identityProof', {}).get('noteInferenceIdentity') != evidence.get('provenance', {}).get('noteInferenceIdentity'):
              raise SystemExit('PITCH_SUPPORT_NOTE_IDENTITY_NOT_PRESERVED')
          if probe.get('identityProof', {}).get('reportedEventCount') != len(evidence_rows):
              raise SystemExit('PITCH_SUPPORT_EVENT_COUNT_MISMATCH')
          print(json.dumps(probe.get('summary', {}), indent=2, sort_keys=True))
          PY

      - name: Prove independent diagnostics do not clear evaluator gates
        shell: bash
        run: |
          set -euo pipefail
          BASE=/tmp/songsterr-fresh-pitch-support
          node scripts/songsterr-fresh/build_note_evidence.mjs \
            --allow-model-upstream \
            "$BASE/note-evidence-context.json" \
            "$BASE/raw-model-note-evidence-duration-free.json" \
            "$BASE/adapted-model-note-evidence-duration-free.json"
          node scripts/songsterr-fresh/run_model_note_evidence_pipeline_canary.mjs \
            "$BASE/adapted-structure-map.json" \
            "$BASE/adapted-model-note-evidence-duration-free.json" \
            "$BASE/model-pipeline-duration-free-result.json"
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          const result = JSON.parse(await readFile('/tmp/songsterr-fresh-pitch-support/model-pipeline-duration-free-result.json', 'utf8'));
          const failures = result.evidenceEvaluation?.failureReasons ?? [];
          for (const required of ['MODEL_EVIDENCE_VALIDATION_PENDING', 'DURATION_EVIDENCE_INCOMPLETE']) {
            if (!failures.includes(required)) throw new Error(`PITCH_SUPPORT_FAIL_CLOSED_GATE_MISSING:${required}`);
          }
          if (result.eventExposure?.metrics?.completeTabEligibleEventCount !== 0) {
            throw new Error('PITCH_SUPPORT_CUSTOMER_EVENTS_MUST_REMAIN_ZERO');
          }
          if (result.pipelineSummary?.deliveryReady !== false) {
            throw new Error('PITCH_SUPPORT_DELIVERY_MUST_REMAIN_BLOCKED');
          }
          NODE

      - name: Re-run fresh deterministic suite
        working-directory: songsterr_pipeline
        run: npm test

      - name: Upload independent pitch-support evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songsterr-fresh-independent-pitch-support-evidence
          path: |
            /tmp/songsterr-fresh-pitch-support/*.json
            /tmp/songsterr-fresh-pitch-support/*.sha256
          if-no-files-found: warn
          retention-days: 14
