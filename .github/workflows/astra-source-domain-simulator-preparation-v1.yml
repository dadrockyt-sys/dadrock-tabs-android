name: Astra source-domain simulator preparation V1

on:
  push:
    branches: [astra-work]
    paths:
      - 'astra_backend/synthetic/source_domain_simulator_diversity_v1.py'
      - 'astra_backend/synthetic/source_domain_simulator_preparation_v1.py'
      - 'astra_backend/synthetic/test_source_domain_simulator_diversity_v1.py'
      - 'astra_backend/synthetic/test_source_domain_simulator_preparation_v1.py'
      - 'docs/astra/SOURCE_DOMAIN_SIMULATOR_DIVERSITY_DESIGN_V1.md'
      - 'docs/astra/SOURCE_DOMAIN_SIMULATOR_DIVERSITY_SPEC_V1.json'
      - '.github/workflows/astra-source-domain-simulator-preparation-v1.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Focused model-free tests
        env:
          PYTHONPATH: astra_backend
        run: |
          pytest -q astra_backend/synthetic/test_source_domain_simulator_diversity_v1.py
          pytest -q astra_backend/synthetic/test_source_domain_simulator_preparation_v1.py
      - name: Build one bounded deterministic model-free preparation
        env:
          PYTHONPATH: astra_backend
        run: |
          python -m synthetic.source_domain_simulator_preparation_v1 --out-dir /tmp/astra-source-domain-preparation-v1
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/astra-source-domain-preparation-v1')
          r=json.loads((p/'source-domain-dataset-receipt.json').read_text())
          e=r['execution']
          assert r['controlExamples']==294
          assert r['interventionChangedTrainingRows']==210
          assert r['challengeChangedTestRows']==42
          assert r['fullPreparationRenderedClips']==576
          assert r['fullPreparationAudioSeconds']==1152.0
          assert r['fullPreparationRenderedClips']<=r['ceilings']['renderedClipsMax']
          assert r['fullPreparationAudioSeconds']<=r['ceilings']['audioSecondsMax']
          assert r['persistedDatasetBytes']['total']<=r['ceilings']['persistedBytesMax']
          assert all(r['identity'].values())
          assert e['modelRun'] is False and e['modelsLoaded']==0 and e['modelInference'] is False
          assert e['optimizerSteps']==0 and e['thresholdSearch'] is False and e['thresholdRetuning'] is False
          assert e['p1Accessed'] is False and e['p2Accessed'] is False and e['p3Opened'] is False
          assert e['automaticRetry'] is False and e['paidComputeDollars']==0
          print('SOURCE_DOMAIN_PREPARATION_ADMISSION_OK')
          print('CONTROL_FEATURE_SHA='+r['arrayHashes']['control']['features'])
          print('INTERVENTION_FEATURE_SHA='+r['arrayHashes']['intervention']['features'])
          print('CHALLENGE_FEATURE_SHA='+r['arrayHashes']['challenge']['features'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-source-domain-simulator-preparation-v1
          path: /tmp/astra-source-domain-preparation-v1
          if-no-files-found: error
          retention-days: 30
