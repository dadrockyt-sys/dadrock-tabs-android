name: V154 reference handoff checkpoint once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v154-reference-handoff-checkpoint-once.yml

permissions:
  contents: write

concurrency:
  group: v154-reference-handoff-checkpoint-once
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0

      - name: Persist current state and next steps
        shell: bash
        env:
          BRANCH: v143-contextual-prune-lobo
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          cp = Path('docs/checkpoints/CURRENT_STATE.md')
          text = cp.read_text(encoding='utf-8')
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('Active phase:'):
                  lines[i] = 'Active phase: **V154 CPU MULTITRACK RESET = PAUSED AT REFERENCE HANDOFF. User is fetching professional Rhythm / Lead / Bass references. CPU-only path remains active; no Modal/L4/CUDA/GPU execution is authorized or required.**'
                  break
          text = '\n'.join(lines).rstrip() + '\n'
          marker = '## V154 reference handoff — CURRENT STATE / NEXT STEPS — 2026-08-27 UTC'
          if marker in text:
              raise SystemExit('handoff checkpoint already present')
          text += f'''\n{marker}
- User requested a pause while fetching professional reference tabs for **Lenny Kravitz — Are You Gonna Go My Way**. No reference-facing V154 score should run until those user-provided/authorized references are normalized and frozen.
- New scorer saved: `validation/v154_cpu_multitrack/score_multitrack_reference.py`; Git blob `f58b6cf7349a6f6e5f49b241a585ba5bf3648966`; creation commit `bf7ff4c5e1d5f2aaa14816216354a78ad24712fb`.
- Reference contract saved at `validation/v154_cpu_multitrack/REFERENCE_FORMAT.md` (creation commit `b599d191a82ded6690e2ca203d78a13d8a1abb48`) and an empty non-copyright template at `validation/v154_cpu_multitrack/reference-template.json` (creation commit `d44b684522e51a359061c15b55faa2d507540280`).
- Architecture checkpoint: source separation and guitar-role separation are different stages. The preferred CPU path is **broad Other stem -> combined guitar note/onset transcription -> musical Rhythm/Lead role separation -> fret/string assignment -> PDF**. Bass is transcribed/scored independently from the bass stem.
- Primary scoring policy: timing-aware pitch F1 within ±0.5 grid step for combined Guitar, Rhythm, Lead, and Bass; guitar role-assignment accuracy is conditional on correctly recognized guitar notes; string/fret timing is evaluated after note/role correctness. Gross ±2-step timing is diagnostic. Per-measure pitch-content is **diagnostic only** and forbidden for event-level candidate selection after the V153 Phase D/E nonlocal-credit finding.
- Copyright/reference boundary: **do not scrape, download, commit, or redistribute Songsterr or other third-party tablature into this public repository**. User-provided or otherwise authorized professional references may be normalized for private/ephemeral scoring only. Repository records should retain scorer logic, schema, hashes/manifests, and results—not third-party note-by-note tab content unless the user explicitly owns/has rights to publish it.
- Leakage boundary: candidate generation/transcription must not read the professional references. Freeze candidate/transcription outputs first; open the references only at scoring. No post-score retuning of the scored output and no silent variant search.

### V154 A3 status discovered at handoff
- Run `33088829644`, job `98575791648`: **ENGINEERING FAILURE AFTER SUCCESSFUL RAW CPU INFERENCE**.
- Exact historical audio verification and CPU normalization succeeded. Basic Pitch 0.4.0 inference on the raw normalized mix completed successfully with **572 note events**, with `CUDA_VISIBLE_DEVICES` empty and a true CPU-only PyTorch stack (`torch 2.8.0+cpu`).
- The raw result was written locally and committed locally as `e515ac43`, but push to `v143-contextual-prune-lobo` was rejected as non-fast-forward because another branch update arrived concurrently. This is a persistence/concurrency failure, not a transcription-model failure.
- Demucs/Other separation did **not** run; the separated-guitar branch did **not** run; Gold/reference was never opened; score calls `0`; no human correction, threshold sweep, Modal, L4, CUDA execution, GPU, main/Production modification, or promotion occurred.
- A3 artifact `v154-cpu-pretrained-reset-a3-33088829644`, artifact ID `9653448751`, ZIP SHA256 `4f5164093744796de5a3a124b1c9cea62f65e71d0418e924218f83e490d61a84`, preserves the raw Basic Pitch JSON plus audio/runtime evidence. Do not rerun the consumed A3 workflow as-is.

### Exact next steps after references arrive
1. **Ingest only user-provided/authorized Rhythm, Lead, and Bass references.** Inspect their format and normalize them to the V154 reference contract without publishing third-party note data to the public repo.
2. **Freeze reference identities before scoring.** Record source type, note counts, timing-grid mapping, position-data availability, and cryptographic hashes/manifests. Keep reference bytes/data inaccessible to candidate-generation code.
3. **Freeze the new CPU source architecture before evaluation.** Use a broad **Other** stem for the union of Rhythm+Lead rather than trying to acoustically separate those guitar roles first; keep Bass separate. No threshold sweep or Gold-guided branch selection.
4. **Recover/use the successful A3 raw Basic Pitch evidence where scientifically appropriate**, but supersede the old guitar-specific separation branch with the new broad-Other design. Any necessary CPU engineering rerun must be preregistered as a runtime/persistence repair, not a model/threshold search.
5. **Run CPU-only combined-guitar recognition first.** Transcribe the Other stem into notes/onsets and score against the union of professional Rhythm+Lead while ignoring role labels. This answers whether the acoustic frontend can actually hear the guitar notes.
6. **Score Bass independently** from the CPU bass stem against the professional Bass reference.
7. **Only after note recognition is frozen, split combined guitar notes into Rhythm vs Lead** using musical sequence evidence: polyphony/chords, melodic continuity, repetition, note density/duration, technique trajectories, fretboard continuity, and long-range role consistency. Then score conditional role-assignment accuracy.
8. **Assign strings/frets after note+role recognition**, then score timing-aware position accuracy when reference position data exists. Technique inference follows after stable notes/positions.
9. **Generate professional PDF only after the transcription layers meet preregistered quality gates.** PDF fidelity/layout is downstream and must not mask acoustic transcription errors.
10. **No human correction is part of the target architecture.** No Modal/L4/CUDA/GPU execution without fresh explicit user authorization. Never modify/merge/promote `main` or Production automatically.

### Resume point
- While the user fetches references: **STOP reference-facing experimentation and preserve state**.
- On resume: begin with reference normalization/identity freezing, then preregister the broad-Other CPU benchmark and its success gates **before** opening/scoring against the professional references.
'''
          cp.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/checkpoints/CURRENT_STATE.md
          git commit -m 'docs: checkpoint V154 reference handoff [skip ci]'
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
