name: Open corpus GuitarSet V4 development discovery

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/open-corpus-guitarset-v4-discovery.yml

permissions:
  contents: read
  actions: read

jobs:
  discovery:
    name: V4 counterfactual discovery on players 02 and 04
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ORIGINAL_RUN_ID: '33581322528'
      CANDIDATE_ARTIFACT_ID: '9828683652'
      CANDIDATE_ARTIFACT_DIGEST: 'sha256:1031aaf913b6292ee961051fed76b91bf003139ab6d3f8db1dad5d0dded270c5'
      CANDIDATE_MANIFEST_SHA256: '4568ca0c5f25ba11f17074b43b21e135eb44357c04a963266c61457038120a83'
      DISCOVERY_ANALYZER_BLOB: 'f25706803b5ae0f46be59c95cd3e1485cefd3aba'
      FROZEN_SCORER_BLOB: '19ef54155735a6ac1e65441250b47d1572ac0380'

    steps:
      - uses: actions/checkout@v4

      - name: Verify preregistered code identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object validation/open_corpus/analyze_guitarset_v4_discovery.py)" = "$DISCOVERY_ANALYZER_BLOB"
          test "$(git hash-object validation/open_corpus/score_guitarset_v3_development_candidates.py)" = "$FROZEN_SCORER_BLOB"
          echo V4_DISCOVERY_FROZEN_CODE_PASS
          echo player05ReferenceRead=false
          echo guitarSetProspectiveEvaluationProcessed=false
          echo guitarSetProspectiveEvaluationScoreCalls=0
          echo v168ReferenceFacingScoreCalls=0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install reference parser runtime only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 jams==0.3.4
          python - <<'PY'
          import importlib.util, numpy as np, jams
          assert np.__version__=='1.26.4'
          assert hasattr(np,'float_')
          if importlib.util.find_spec('basic_pitch') is not None:
              raise SystemExit('basic_pitch unexpectedly importable in V4 discovery')
          print('V4_DISCOVERY_REFERENCE_RUNTIME_PASS')
          print('basicPitchImportable=false')
          print('player05ReferenceRead=false')
          print('guitarSetProspectiveEvaluationScoreCalls=0')
          print('v168ReferenceFacingScoreCalls=0')
          PY

      - name: Verify original candidate artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/guitarset-v4-discovery"
          mkdir -p "$ROOT"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID" \
            -o "$ROOT/artifact-metadata.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'guitarset-v4-discovery/artifact-metadata.json'
          a=json.loads(p.read_text())
          assert int(a['id'])==int(os.environ['CANDIDATE_ARTIFACT_ID'])
          assert a['name']=='guitarset-v3-development-frozen-candidates'
          assert a['expired'] is False
          assert a.get('digest')==os.environ['CANDIDATE_ARTIFACT_DIGEST']
          wr=a.get('workflow_run') or {}
          assert int(wr.get('id'))==int(os.environ['ORIGINAL_RUN_ID'])
          assert wr.get('head_sha')=='f494e5b2f586ec335b16dcabce687e63bb1f88fb'
          print('V4_DISCOVERY_ORIGINAL_ARTIFACT_IDENTITY_PASS')
          PY
          rm -f "$ROOT/artifact-metadata.json"

      - name: Download immutable V3 candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: guitarset-v3-development-frozen-candidates
          path: ${{ runner.temp }}/guitarset-v4-discovery/candidates
          github-token: ${{ github.token }}
          repository: dadrockyt-sys/dadrock-tabs-android
          run-id: 33581322528

      - name: Verify candidate manifest and hashes before references
        shell: bash
        run: |
          set -euo pipefail
          CAND="$RUNNER_TEMP/guitarset-v4-discovery/candidates"
          test "$(sha256sum "$CAND/candidate-freeze-manifest.json" | awk '{print $1}')" = "$CANDIDATE_MANIFEST_SHA256"
          test "$(find "$CAND" -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 178
          test "$(find "$CAND" -type f \( -name '*.wav' -o -name '*.jams' -o -name '*.zip' \) | wc -l)" -eq 0
          CAND="$CAND" python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['CAND'])
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1<<20),b''): h.update(b)
              return h.hexdigest()
          m=json.loads((root/'candidate-freeze-manifest.json').read_text())
          assert len(m['files'])==177
          for r in m['files']:
              p=root/r['file']
              assert p.is_file() and sha(p)==r['sha256'], r['file']
          print('V4_DISCOVERY_ALL_177_CANDIDATE_HASHES_PASS')
          print('candidateRegenerated=false')
          print('player05ReferenceRead=false')
          print('guitarSetProspectiveEvaluationScoreCalls=0')
          print('v168ReferenceFacingScoreCalls=0')
          PY

      - name: Download verify and isolate discovery references only
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/guitarset-v4-discovery"
          mkdir -p "$ROOT/reference" "$ROOT/output"
          cd "$ROOT"
          curl -L --fail --retry 3 --retry-delay 3 \
            'https://zenodo.org/records/3371780/files/annotation.zip?download=1' \
            -o annotation.zip
          echo 'b39b78e63d3446f2e54ddb7a54df9b10  annotation.zip' | md5sum -c -
          echo '8daa02e6417ccca1685feb44b135e95928ad7037e5032ecb326b5791856fda99  annotation.zip' | sha256sum -c -
          python - <<'PY'
          import shutil, zipfile
          from pathlib import Path
          root=Path('.')
          out=root/'reference'
          discovery={'02','04'}
          excluded={'04_BN3-154-E_comp','04_Jazz1-200-B_comp','02_Funk2-119-G_comp'}
          selected=[]
          with zipfile.ZipFile(root/'annotation.zip','r') as z:
              for info in z.infolist():
                  name=Path(info.filename).name
                  if not name.endswith('.jams'): continue
                  stem=name[:-5]
                  if stem[:2] not in discovery or stem in excluded: continue
                  dest=out/name
                  if dest.exists(): raise SystemExit(f'duplicate {name}')
                  with z.open(info,'r') as src, dest.open('wb') as dst: shutil.copyfileobj(src,dst)
                  selected.append(stem)
          counts={p:sum(s.startswith(p+'_') for s in selected) for p in sorted(discovery)}
          assert counts=={'02':59,'04':58}, counts
          assert len(selected)==117
          assert not any(s.startswith('05_') for s in selected)
          assert not any(s[:2] in {'00','01','03'} for s in selected)
          print('V4_DISCOVERY_REFERENCE_SELECTION_PASS',counts)
          PY
          rm -f annotation.zip
          test "$(find reference -maxdepth 1 -type f -name '*.jams' | wc -l)" -eq 117
          test "$(find reference -maxdepth 1 -type f -name '05_*' | wc -l)" -eq 0
          test "$(find reference -maxdepth 1 -type f \( -name '00_*' -o -name '01_*' -o -name '03_*' \) | wc -l)" -eq 0
          test "$(find "$ROOT" -type f -name '*.wav' | wc -l)" -eq 0
          echo V4_DISCOVERY_REFERENCE_BOUNDARY_PASS
          echo player05ReferenceRead=false
          echo guitarSetProspectiveEvaluationScoreCalls=0
          echo v168ReferenceFacingScoreCalls=0

      - name: Run preregistered V4 discovery
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/guitarset-v4-discovery"
          cd validation/open_corpus
          python analyze_guitarset_v4_discovery.py \
            --candidate-dir "$ROOT/candidates" \
            --reference-dir "$ROOT/reference" \
            --output "$ROOT/output/v4-discovery-report.json" \
            --rows-output "$ROOT/output/v4-discovery-labeled-rows.jsonl"
          cd "$ROOT/output"
          sha256sum v4-discovery-report.json > report-sha256.txt
          sha256sum v4-discovery-labeled-rows.jsonl > rows-sha256.txt

      - name: Print discovery identities and key counts
        shell: python
        run: |
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'guitarset-v4-discovery/output'
          r=json.loads((root/'v4-discovery-report.json').read_text())
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          print(json.dumps({
            'status':r['status'],
            'discoveryTrackCount':r['discoveryTrackCount'],
            'discoveryEventCount':r['discoveryEventCount'],
            'primaryClassCounts':r['primaryClassCounts'],
            'primaryClassCountsByPlayer':r['primaryClassCountsByPlayer'],
            'primaryClassCountsByDirection':r['primaryClassCountsByDirection'],
            'reportSha256':sha(root/'v4-discovery-report.json'),
            'rowsSha256':sha(root/'v4-discovery-labeled-rows.jsonl'),
            'player05ReferenceRead':r['player05ReferenceRead'],
            'v4TriggerSelected':r['v4TriggerSelected'],
            'guitarSetProspectiveEvaluationScoreCalls':r['guitarSetProspectiveEvaluationScoreCalls'],
            'v168ReferenceFacingScoreCalls':r['v168ReferenceFacingScoreCalls'],
          },indent=2,sort_keys=True))

      - name: Remove references and candidates before upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/guitarset-v4-discovery"
          rm -rf "$ROOT/reference" "$ROOT/candidates"
          rm -f "$ROOT/annotation.zip" "$ROOT/artifact-metadata.json"
          if [ -d "$ROOT/output" ]; then
            test "$(find "$ROOT/output" -type f \( -name '*.jams' -o -name '*.wav' -o -name '*.zip' \) | wc -l)" -eq 0
          fi

      - name: Preserve V4 discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guitarset-v4-discovery-report
          path: ${{ runner.temp }}/guitarset-v4-discovery/output/
          retention-days: 30
          if-no-files-found: ignore
