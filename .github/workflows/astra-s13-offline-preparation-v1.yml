name: Astra S13 offline preparation verification V1

on:
  push:
    branches: [astra-work]
    paths:
      - 'astra_backend/synthetic/s13_pilot_v1.py'
      - 'astra_backend/synthetic/test_s13_pilot_v1.py'
      - 'docs/astra/SYNTHETIC_S13_RUN_SCOPE_V1.json'
      - '.github/workflows/astra-s13-offline-preparation-v1.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'
      - name: Install pinned runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Focused package tests
        env:
          PYTHONPATH: astra_backend
        run: pytest -q astra_backend/synthetic/test_s13_pilot_v1.py
      - name: Generate and hash frozen datasets without models
        env:
          PYTHONPATH: astra_backend
        run: python -m synthetic.s13_pilot_v1 prepare-only --out-dir /tmp/astra-s13-preparation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-s13-offline-preparation-v1
          path: /tmp/astra-s13-preparation
          if-no-files-found: error
          retention-days: 30
