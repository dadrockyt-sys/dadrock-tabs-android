name: v143 precision shadow v2 CPU guard

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - analyzer/v143_contextual_prune_precision_shadow_v2.py
      - analyzer/check_v143_precision_shadow_v2_policy.py
      - analyzer/v143_repaired_timing_precision_candidate_product_modal.py
      - analyzer/v143_precision_optional_candidate_accounting.py
      - analyzer/v143_precision_replay_policy_compare.py
      - .github/workflows/v143-precision-shadow-v2-cpu-guard.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test reference-free v2 policy
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            analyzer/v143_contextual_prune_precision_shadow_v2.py \
            analyzer/check_v143_precision_shadow_v2_policy.py \
            analyzer/v143_repaired_timing_precision_candidate_product_modal.py \
            analyzer/v143_precision_optional_candidate_accounting.py \
            analyzer/v143_precision_replay_policy_compare.py
          PYTHONPATH=analyzer python analyzer/check_v143_precision_shadow_v2_policy.py
          python analyzer/v143_precision_replay_policy_compare.py --self-test
          python analyzer/v143_precision_optional_candidate_accounting.py \
            --input debug/v143-contextual-prune/repaired-timing-precision-candidate-product.json \
            --output /tmp/precision-optional-candidate-accounting.json
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = '7f72f8ed9b14af8bc93e95544195204d99c6bec1'
          if grep -E -n 'Professionalexample|professional-rhythm-complete|rhythm-professional-holdout-score|Songsterr' \
            analyzer/v143_contextual_prune_precision_shadow_v2.py \
            analyzer/check_v143_precision_shadow_v2_policy.py \
            analyzer/v143_repaired_timing_precision_candidate_product_modal.py \
            analyzer/v143_precision_optional_candidate_accounting.py \
            analyzer/v143_precision_replay_policy_compare.py; then
            echo 'Forbidden scorer/reference token in precision v2 path' >&2
            exit 1
          fi
      - name: Persist green CPU guard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug/v143-contextual-prune
          python - <<'PY'
          import json
          from pathlib import Path
          result = {
              'schemaVersion': 1,
              'passed': True,
              'policy': 'envelope-balanced-secondary-v2',
              'sourceSha': '${{ github.sha }}',
              'runId': int('${{ github.run_id }}'),
              'protectedPipelineBlob': '7f72f8ed9b14af8bc93e95544195204d99c6bec1',
              'policySelfTestPassed': True,
              'replayCompareSelfTestPassed': True,
              'historicalOptionalAccountingPassed': True,
              'newInferenceUsed': False,
              'modalInvoked': False,
              'professionalReferenceUsed': False,
              'productionModified': False,
          }
          Path('debug/v143-contextual-prune/precision-v2-cpu-guard-result.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          PY
          git add debug/v143-contextual-prune/precision-v2-cpu-guard-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record precision v2 CPU guard result'
          for attempt in 1 2 3 4; do
            git fetch origin v143-contextual-prune-lobo
            git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
