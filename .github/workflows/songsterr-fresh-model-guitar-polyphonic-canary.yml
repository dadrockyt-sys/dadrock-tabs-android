name: Songsterr Fresh Model Guitar Polyphonic Canary

on:
  workflow_dispatch:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-model-guitar-polyphonic-canary.yml'
      - 'scripts/songsterr-fresh/basic_pitch_activation_evidence.py'
      - 'scripts/songsterr-fresh/verify_demucs_model_asset.py'
      - 'scripts/songsterr-fresh/transcribe_isolated_guitar_basic_pitch.py'
      - 'scripts/songsterr-fresh/build_isolated_polyphonic_note_evidence.mjs'
      - 'scripts/songsterr-fresh/run_model_note_evidence_pipeline_canary.mjs'
      - 'scripts/songsterr-fresh/estimate_selected_pitch_releases.py'
      - 'scripts/songsterr-fresh/build_note_evidence_context.mjs'
      - 'scripts/songsterr-fresh/build_note_evidence.mjs'
      - 'songsterr_pipeline/noteEventExposure.mjs'
      - 'songsterr_pipeline/noteEvidenceAdapter.mjs'
      - 'songsterr_pipeline/noteEvidenceDiagnostics.mjs'
      - 'songsterr_pipeline/noteEvidenceEvaluator.mjs'
      - 'songsterr_pipeline/structureIdentity.mjs'
      - 'songsterr_pipeline/tests/noteEventExposure.test.mjs'
      - 'songsterr_pipeline/tests/noteEvidenceAdapter.test.mjs'
      - 'songsterr_pipeline/tests/noteEvidenceDiagnostics.test.mjs'
      - 'songsterr_pipeline/tests/noteEvidenceEvaluator.test.mjs'

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  model-guitar-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out fresh branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch exact authorized audio fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/songsterr-fresh-model-canary
          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/dadrockyt-sys/dadrock-tabs-android/main/public/jimmy-paige-midterm-v1/gomyway-midterm-source.m4a' \
            --output /tmp/gomyway-midterm-source.m4a
          ACTUAL_BLOB_SHA="$(git hash-object /tmp/gomyway-midterm-source.m4a)"
          EXPECTED_BLOB_SHA='4dd709e3fa177b4daeed71ca97f0199757729d4b'
          echo "Authorized fixture blob: ${ACTUAL_BLOB_SHA}"
          test "${ACTUAL_BLOB_SHA}" = "${EXPECTED_BLOB_SHA}"

      - name: Install audio decoder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Decode analysis and separation WAVs
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/gomyway-midterm-source.m4a -ac 1 -ar 22050 \
            /tmp/gomyway-midterm-analysis.wav
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/gomyway-midterm-source.m4a -ac 2 -ar 44100 \
            /tmp/gomyway-midterm-separation.wav
          sha256sum /tmp/gomyway-midterm-analysis.wav | tee /tmp/songsterr-fresh-model-canary/analysis-input.sha256
          sha256sum /tmp/gomyway-midterm-separation.wav | tee /tmp/songsterr-fresh-model-canary/separation-input.sha256

      - name: Install pinned model and analysis dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 \
            torch==2.14.0 \
            huggingface-hub==1.30.0 \
            safetensors==0.8.0 \
            sphn==0.2.1 \
            demucs==4.1.0 \
            basic-pitch==0.4.0 \
            librosa==0.11.0 \
            soundfile==0.13.1
          python - <<'PY'
          import importlib.metadata
          for name in (
              'numpy', 'torch', 'huggingface-hub', 'safetensors', 'sphn',
              'demucs', 'basic-pitch', 'librosa', 'soundfile', 'tflite-runtime'
          ):
              print(f'{name}=={importlib.metadata.version(name)}')
          PY

      - name: Record runtime provenance
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG_VERSION="$(ffmpeg -version | head -n 1)"
          python - <<PY
          import hashlib
          import importlib.metadata
          import json
          import os
          import platform
          from pathlib import Path

          def sha256_file(path):
              h = hashlib.sha256()
              with open(path, 'rb') as handle:
                  while True:
                      block = handle.read(1024 * 1024)
                      if not block:
                          break
                      h.update(block)
              return h.hexdigest()

          cpu_model = None
          cpuinfo = Path('/proc/cpuinfo')
          if cpuinfo.is_file():
              for line in cpuinfo.read_text(encoding='utf-8', errors='replace').splitlines():
                  if line.lower().startswith('model name') and ':' in line:
                      cpu_model = line.split(':', 1)[1].strip()
                      break

          names = (
              'numpy', 'torch', 'huggingface-hub', 'safetensors', 'sphn',
              'demucs', 'basic-pitch', 'librosa', 'soundfile', 'tflite-runtime'
          )
          payload = {
              'contract': 'songsterr-fresh-model-runtime-provenance-v1',
              'version': 1,
              'python': platform.python_version(),
              'platform': platform.platform(),
              'machine': platform.machine(),
              'processor': platform.processor() or None,
              'cpuModel': cpu_model,
              'runnerOS': os.environ.get('RUNNER_OS'),
              'runnerArch': os.environ.get('RUNNER_ARCH'),
              'imageOS': os.environ.get('ImageOS'),
              'imageVersion': os.environ.get('ImageVersion'),
              'ffmpegVersion': '''$FFMPEG_VERSION''',
              'analysisWavSha256': sha256_file('/tmp/gomyway-midterm-analysis.wav'),
              'separationWavSha256': sha256_file('/tmp/gomyway-midterm-separation.wav'),
              'packages': {name: importlib.metadata.version(name) for name in names},
              'threadingEnvironment': {
                  key: os.environ.get(key)
                  for key in ('OMP_NUM_THREADS', 'MKL_NUM_THREADS', 'OPENBLAS_NUM_THREADS', 'NUMEXPR_NUM_THREADS', 'PYTHONHASHSEED')
              },
          }
          out = Path('/tmp/songsterr-fresh-model-canary/runtime-provenance.json')
          out.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, indent=2))
          PY

      - name: Rebuild accepted frozen structure reference-blind
        shell: bash
        run: |
          set -euo pipefail
          python scripts/songsterr-fresh/analyze_full_mixture_structure.py \
            --input /tmp/gomyway-midterm-analysis.wav \
            --output /tmp/songsterr-fresh-model-canary/raw-structure-analysis.json \
            --audio-source 'public/jimmy-paige-midterm-v1/gomyway-midterm-source.m4a@main#4dd709e3fa177b4daeed71ca97f0199757729d4b'
          node scripts/songsterr-fresh/build_structure_map.mjs \
            /tmp/songsterr-fresh-model-canary/raw-structure-analysis.json \
            /tmp/songsterr-fresh-model-canary/adapted-structure-map.json
          node scripts/songsterr-fresh/build_note_evidence_context.mjs \
            /tmp/songsterr-fresh-model-canary/adapted-structure-map.json \
            /tmp/songsterr-fresh-model-canary/note-evidence-context.json
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          const context = JSON.parse(await readFile('/tmp/songsterr-fresh-model-canary/note-evidence-context.json', 'utf8'));
          if (context?.structureIdentity?.signature !== 'fnv1a32:2f493225') {
            throw new Error(`FROZEN_STRUCTURE_IDENTITY_CHANGED:${context?.structureIdentity?.signature}`);
          }
          NODE

      - name: Separate deterministic guitar stem and verify executed asset
        shell: bash
        run: |
          set -euo pipefail
          BASE=/tmp/songsterr-fresh-model-canary
          python -m demucs \
            -n htdemucs_6s \
            --device cpu \
            --shifts 0 \
            --overlap 0.25 \
            --segment 7 \
            -o "$BASE/separated" \
            /tmp/gomyway-midterm-separation.wav
          STEM="$BASE/separated/htdemucs_6s/gomyway-midterm-separation/guitar.wav"
          test -s "$STEM"
          STEM_SHA="$(sha256sum "$STEM" | awk '{print $1}')"
          echo "Runtime-scoped guitar stem sha256: ${STEM_SHA}"

          python scripts/songsterr-fresh/verify_demucs_model_asset.py \
            --output "$BASE/demucs-model-asset.json"

          python - <<PY
          import json
          import soundfile as sf
          with open('$BASE/demucs-model-asset.json', 'r', encoding='utf-8') as handle:
              asset = json.load(handle)
          if asset.get('contract') != 'songsterr-fresh-demucs-model-asset-v2':
              raise SystemExit('DEMUCS_ASSET_CONTRACT_CHANGED')
          if asset.get('modelName') != 'htdemucs_6s' or asset.get('modelSignature') != '5c90dfd2':
              raise SystemExit('DEMUCS_ASSET_IDENTITY_CHANGED')
          if asset.get('primaryLoader') != 'huggingface' or asset.get('hfRepoId') != 'adefossez/HTDemucs-6s':
              raise SystemExit('DEMUCS_PRIMARY_LOADER_CHANGED')
          if asset.get('hfPinnedRevision') != '3c5ee475be622df764938de97e4281a7b07ffa58':
              raise SystemExit('DEMUCS_HF_REVISION_CHANGED')
          if asset.get('hfAssetUploadRevision') != '053e1404489b3dc58bf718224fac4b7316de8c93':
              raise SystemExit('DEMUCS_HF_ASSET_UPLOAD_REVISION_CHANGED')
          if asset.get('bagModels') != ['5c90dfd2']:
              raise SystemExit('DEMUCS_HF_BAG_CHANGED')
          if asset.get('assetFilename') != '5c90dfd2.safetensors':
              raise SystemExit('DEMUCS_HF_ASSET_FILENAME_CHANGED')
          if asset.get('assetSha256') != 'd2a1745f0744721f6b8ca5bf469b67c651ea5ed1b52998cab033b2158609d411':
              raise SystemExit('DEMUCS_HF_ASSET_SHA_CHANGED')
          if asset.get('modelClass') != 'demucs.htdemucs.HTDemucs':
              raise SystemExit('DEMUCS_HF_MODEL_CLASS_CHANGED')
          if asset.get('legacyFallback', {}).get('primary') is not False:
              raise SystemExit('DEMUCS_LEGACY_FALLBACK_MUST_NOT_BE_PRIMARY')

          info = sf.info('$STEM')
          payload = {
              'contract': 'songsterr-fresh-demucs-guitar-separation-v3',
              'version': 3,
              'referenceBlind': True,
              'package': 'demucs',
              'packageVersion': '4.1.0',
              'model': 'htdemucs_6s',
              'modelSignature': '5c90dfd2',
              'executedAssetLoader': asset.get('primaryLoader'),
              'executedAssetRepo': asset.get('hfRepoId'),
              'executedAssetRevision': asset.get('hfPinnedRevision'),
              'executedAssetSha256': asset.get('assetSha256'),
              'stem': 'guitar',
              'device': 'cpu',
              'shifts': 0,
              'overlap': 0.25,
              'segmentSeconds': 7,
              'gpuInvoked': False,
              'sourceAudio': 'public/jimmy-paige-midterm-v1/gomyway-midterm-source.m4a@main#4dd709e3fa177b4daeed71ca97f0199757729d4b',
              'stemSha256': '$STEM_SHA',
              'sampleRate': info.samplerate,
              'channels': info.channels,
              'frames': info.frames,
              'durationSeconds': info.duration,
              'crossEnvironmentStemShaCanonical': False,
              'legacyV143ScorerImported': False,
              'professionalScorerUsed': False,
              'referenceTabUsed': False,
          }
          with open('$BASE/separation-manifest.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, indent=2)
              handle.write('\n')
          print(json.dumps(payload, indent=2))
          PY

      - name: Infer notes plus same-inference activation sidecar
        shell: bash
        run: |
          set -euo pipefail
          BASE=/tmp/songsterr-fresh-model-canary
          STEM="$BASE/separated/htdemucs_6s/gomyway-midterm-separation/guitar.wav"
          STEM_SHA="$(sha256sum "$STEM" | awk '{print $1}')"
          python scripts/songsterr-fresh/transcribe_isolated_guitar_basic_pitch.py \
            --input "$STEM" \
            --output "$BASE/basic-pitch-guitar-notes.json" \
            --activation-output "$BASE/basic-pitch-note-activations.json" \
            --audio-source 'public/jimmy-paige-midterm-v1/gomyway-midterm-source.m4a@main#4dd709e3fa177b4daeed71ca97f0199757729d4b' \
            --separation-source "demucs==4.1.0/htdemucs_6s/shifts=0:guitar@sha256:${STEM_SHA}"

      - name: Build and verify duration-free isolated polyphonic evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE=/tmp/songsterr-fresh-model-canary
          node scripts/songsterr-fresh/build_isolated_polyphonic_note_evidence.mjs \
            "$BASE/note-evidence-context.json" \
            "$BASE/basic-pitch-guitar-notes.json" \
            "$BASE/raw-model-note-evidence-duration-free.json"
          python - <<'PY'
          import json
          import sys
          sys.path.insert(0, 'scripts/songsterr-fresh')
          from basic_pitch_activation_evidence import decode_and_verify_activation_sidecar

          base = '/tmp/songsterr-fresh-model-canary'
          with open(f'{base}/basic-pitch-guitar-notes.json', 'r', encoding='utf-8') as handle:
              notes = json.load(handle)
          with open(f'{base}/basic-pitch-note-activations.json', 'r', encoding='utf-8') as handle:
              sidecar = json.load(handle)
          with open(f'{base}/raw-model-note-evidence-duration-free.json', 'r', encoding='utf-8') as handle:
              data = json.load(handle)

          decoded = decode_and_verify_activation_sidecar(sidecar, evidence=data)
          bundle = decoded.get('inferenceBundleIdentity')
          if notes.get('activationEvidenceIdentity') != bundle:
              raise SystemExit('MODEL_ACTIVATION_BUNDLE_NOT_BOUND_TO_NOTES')
          if data.get('provenance', {}).get('activationEvidenceIdentity') != bundle:
              raise SystemExit('MODEL_ACTIVATION_BUNDLE_NOT_PROPAGATED_TO_EVIDENCE')
          if notes.get('diagnostics', {}).get('predictInvocationCount') != 1:
              raise SystemExit('MODEL_CAPTURE_MUST_USE_ONE_BASIC_PITCH_PREDICT_CALL')
          if notes.get('diagnostics', {}).get('sameInferenceActivationEvidenceCaptured') is not True:
              raise SystemExit('MODEL_SAME_INFERENCE_ACTIVATION_CAPTURE_MISSING')

          caps = data.get('capabilities', {})
          if caps.get('roleRelevanceResolved') is not True:
              raise SystemExit('MODEL_GUITAR_ROLE_MUST_BE_RESOLVED_BY_SEPARATION')
          if caps.get('polyphonyResolved') is not True:
              raise SystemExit('MODEL_POLYPHONY_MUST_BE_RESOLVED')
          if caps.get('durationResolution') != 'none':
              raise SystemExit('MODEL_PITCH_STAGE_MUST_NOT_OWN_DURATION')
          if data.get('provenance', {}).get('modelInvoked') is not True:
              raise SystemExit('MODEL_PROVENANCE_MISSING')
          leaking = [
              onset.get('onsetId')
              for onset in data.get('onsets', [])
              if onset.get('durationSeconds') is not None or onset.get('sourceEnd') is not None
          ]
          if leaking:
              raise SystemExit(f'MODEL_NOTE_END_LEAK_INTO_DURATION:{leaking[:5]}')
          if data.get('diagnostics', {}).get('modelNoteEndsUsedAsDuration') is not False:
              raise SystemExit('MODEL_NOTE_ENDS_MUST_REMAIN_DIAGNOSTIC_ONLY')

          guards = sidecar.get('hardGuards', {})
          if guards.get('sameInferenceAsDecodedNotes') is not True:
              raise SystemExit('ACTIVATION_SIDECAR_SAME_INFERENCE_GUARD_MISSING')
          for key in ('decodedModelNoteEndsIncluded', 'decodedModelNoteEndsUsedAsDuration', 'writesSourceEnd', 'writesDurationSeconds', 'activeDurationAuthority', 'changesPitchIdentity'):
              if guards.get(key) is not False:
                  raise SystemExit(f'ACTIVATION_SIDECAR_GUARD_CHANGED:{key}:{guards.get(key)}')
          print(json.dumps({
              'noteInferenceIdentity': decoded.get('noteInferenceIdentity'),
              'inferenceBundleIdentity': bundle,
              'activationShape': list(decoded['activations'].shape),
              'frameTimeCount': len(decoded['frameTimesSeconds']),
              'hardGuards': guards,
          }, indent=2))
          PY

      - name: Apply sole release authority without activation sidecar
        shell: bash
        run: |
          set -euo pipefail
          STEM='/tmp/songsterr-fresh-model-canary/separated/htdemucs_6s/gomyway-midterm-separation/guitar.wav'
          python scripts/songsterr-fresh/estimate_selected_pitch_releases.py \
            --allow-model-upstream \
            --input "$STEM" \
            --evidence /tmp/songsterr-fresh-model-canary/raw-model-note-evidence-duration-free.json \
            --output /tmp/songsterr-fresh-model-canary/raw-model-note-evidence.json
          python - <<'PY'
          import json
          path = '/tmp/songsterr-fresh-model-canary/raw-model-note-evidence.json'
          with open(path, 'r', encoding='utf-8') as handle:
              data = json.load(handle)
          release = data.get('diagnostics', {}).get('releaseEvidence', {})
          if release.get('contract') != 'songsterr-fresh-cpu-spectral-release-evidence-v2':
              raise SystemExit('SOLE_RELEASE_CONTRACT_CHANGED')
          if release.get('soleDurationAuthority') is not True or release.get('requiresDurationFreeInput') is not True:
              raise SystemExit('SOLE_RELEASE_AUTHORITY_NOT_PRESERVED')
          if release.get('modelUpstreamAllowedThisRun') is not True:
              raise SystemExit('AUTHORIZED_MODEL_UPSTREAM_NOT_RECORDED')
          if release.get('upstreamModelInvoked') is not True:
              raise SystemExit('MODEL_UPSTREAM_PROVENANCE_NOT_RECORDED')
          if release.get('nextOnsetUsedAsDuration') is not False:
              raise SystemExit('NEXT_ONSET_MUST_NOT_BECOME_DURATION')
          if data.get('provenance', {}).get('durationEvidenceModelInvoked') is not False:
              raise SystemExit('RELEASE_STAGE_MUST_REMAIN_NONMODEL_DURATION_AUTHORITY')
          PY

      - name: Validate and adapt model note evidence
        shell: bash
        run: |
          set -euo pipefail
          DENIED_OUTPUT='/tmp/songsterr-fresh-model-canary/unauthorized-model-adaptation-must-not-exist.json'
          DENIED_LOG='/tmp/songsterr-fresh-model-canary/unauthorized-model-adaptation.log'
          rm -f "$DENIED_OUTPUT" "$DENIED_LOG"
          set +e
          node scripts/songsterr-fresh/build_note_evidence.mjs \
            /tmp/songsterr-fresh-model-canary/note-evidence-context.json \
            /tmp/songsterr-fresh-model-canary/raw-model-note-evidence.json \
            "$DENIED_OUTPUT" >"$DENIED_LOG" 2>&1
          DENIED_STATUS=$?
          set -e
          test "$DENIED_STATUS" -ne 0
          test ! -e "$DENIED_OUTPUT"
          grep -q 'CPU_NOTE_EVIDENCE_CANARY_MODEL_NOT_ALLOWED' "$DENIED_LOG"

          node scripts/songsterr-fresh/build_note_evidence.mjs \
            --allow-model-upstream \
            /tmp/songsterr-fresh-model-canary/note-evidence-context.json \
            /tmp/songsterr-fresh-model-canary/raw-model-note-evidence.json \
            /tmp/songsterr-fresh-model-canary/adapted-model-note-evidence.json

      - name: Exercise model evidence through deterministic pipeline fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node scripts/songsterr-fresh/run_model_note_evidence_pipeline_canary.mjs \
            /tmp/songsterr-fresh-model-canary/adapted-structure-map.json \
            /tmp/songsterr-fresh-model-canary/adapted-model-note-evidence.json \
            /tmp/songsterr-fresh-model-canary/model-pipeline-canary-result.json
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          const result = JSON.parse(await readFile('/tmp/songsterr-fresh-model-canary/model-pipeline-canary-result.json', 'utf8'));
          const failures = result.evidenceEvaluation?.failureReasons ?? [];
          if (!failures.includes('MODEL_EVIDENCE_VALIDATION_PENDING')) {
            throw new Error('MODEL_VALIDATION_GATE_MUST_BLOCK_DELIVERY');
          }
          for (const cleared of ['ROLE_RELEVANCE_UNRESOLVED', 'POLYPHONY_UNRESOLVED', 'PITCH_EVIDENCE_UNRESOLVED']) {
            if (failures.includes(cleared)) throw new Error(`MODEL_CANARY_DID_NOT_CLEAR_${cleared}`);
          }
          const exposure = result.eventExposure?.metrics ?? {};
          if (!(exposure.pitchResolvedEventCount > 0)) throw new Error('MODEL_CANARY_EXPECTS_PITCH_EVENTS');
          if (exposure.roleAcceptedEventCount !== exposure.pitchResolvedEventCount) {
            throw new Error('MODEL_CANARY_ROLE_ACCEPTED_COUNT_MISMATCH');
          }
          if (exposure.completeTabEligibleEventCount !== 0) {
            throw new Error('MODEL_CANARY_MUST_EXPOSE_ZERO_CUSTOMER_EVENTS_PENDING_VALIDATION');
          }
          if (result.pipelineSummary?.deliveryReady !== false) {
            throw new Error('MODEL_CANARY_MUST_FAIL_CLOSED_FROM_DELIVERY');
          }
          NODE

      - name: Re-run fresh deterministic suite
        working-directory: songsterr_pipeline
        run: npm test

      - name: Show compact model diagnostics
        shell: bash
        run: |
          python - <<'PY'
          import json
          base = '/tmp/songsterr-fresh-model-canary'
          for name in (
              'runtime-provenance.json',
              'demucs-model-asset.json',
              'separation-manifest.json',
              'basic-pitch-guitar-notes.json',
              'basic-pitch-note-activations.json',
              'raw-model-note-evidence-duration-free.json',
              'raw-model-note-evidence.json',
              'adapted-model-note-evidence.json',
              'model-pipeline-canary-result.json',
          ):
              with open(f'{base}/{name}', 'r', encoding='utf-8') as handle:
                  data = json.load(handle)
              print(f'--- {name} ---')
              print(json.dumps({
                  'contract': data.get('contract'),
                  'model': data.get('model'),
                  'noteInferenceIdentity': data.get('noteInferenceIdentity'),
                  'activationEvidenceIdentity': data.get('activationEvidenceIdentity'),
                  'inferenceBundleIdentity': data.get('inferenceBundleIdentity'),
                  'hardGuards': data.get('hardGuards'),
                  'capabilities': data.get('capabilities'),
                  'diagnostics': data.get('diagnostics'),
                  'metrics': data.get('metrics'),
                  'eventExposure': data.get('eventExposure'),
                  'evidenceEvaluation': data.get('evidenceEvaluation'),
                  'pipelineSummary': data.get('pipelineSummary'),
                  'provenance': data.get('provenance'),
                  'stemSha256': data.get('stemSha256'),
                  'assetSha256': data.get('assetSha256'),
                  'hfPinnedRevision': data.get('hfPinnedRevision'),
                  'packages': data.get('packages'),
              }, indent=2))
          PY

      - name: Upload model canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songsterr-fresh-model-guitar-polyphonic-evidence
          path: |
            /tmp/songsterr-fresh-model-canary/*.json
            /tmp/songsterr-fresh-model-canary/*.sha256
          if-no-files-found: warn
          retention-days: 14
