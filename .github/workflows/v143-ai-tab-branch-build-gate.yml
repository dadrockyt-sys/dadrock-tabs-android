name: V143 AI Tab Branch Build Gate

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - '.github/workflows/v143-ai-tab-branch-build-gate.yml'
      - 'app/ai-tab/**'
      - 'app/api/analyze-audio-tab/**'
      - 'app/api/audio-upload/**'
      - 'app/api/generate-tab-preview/**'
      - 'app/api/generate-tab-pdf/**'
      - 'lib/jimmyPaigeAnalysisPayload.js'
      - 'lib/jimmyPaigeProfessionalPdfFeature.js'
      - 'lib/v143AnalyzerQuality.js'
      - 'lib/v143RenderContract.js'
      - 'lib/createJimmyPaigeProfessionalPdf.js'
      - 'lib/createV143RhythmPdf.js'
      - 'analyzer/verify_v143_analyzer_quality_gate.mjs'
      - 'analyzer/verify_jimmy_paige_preview_feature_gate.mjs'

permissions:
  contents: write

jobs:
  verify-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        shell: bash
        run: npm ci --ignore-scripts

      - name: Prepare branch build evidence workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .branch-build-gate
          mkdir -p .branch-build-gate debug/v143-contextual-prune

      - name: Run analyzer-quality regression verifier
        shell: bash
        run: |
          set +e
          node --experimental-default-type=module \
            analyzer/verify_v143_analyzer_quality_gate.mjs \
            > .branch-build-gate/analyzer-quality.log 2>&1
          status=$?
          echo "BRANCH_ANALYZER_QUALITY_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Run Preview feature-gate regression verifier
        shell: bash
        run: |
          set +e
          node --experimental-default-type=module \
            analyzer/verify_jimmy_paige_preview_feature_gate.mjs \
            > .branch-build-gate/preview-feature.log 2>&1
          status=$?
          echo "BRANCH_PREVIEW_FEATURE_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Compile full Next.js application
        shell: bash
        run: |
          set +e
          npm run build > .branch-build-gate/next-build.log 2>&1
          status=$?
          echo "BRANCH_NEXT_BUILD_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Write compact branch build diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def code(name):
              try:
                  return int(os.environ.get(name, '99'))
              except ValueError:
                  return 99

          analyzer = code('BRANCH_ANALYZER_QUALITY_EXIT_CODE')
          preview = code('BRANCH_PREVIEW_FEATURE_EXIT_CODE')
          build = code('BRANCH_NEXT_BUILD_EXIT_CODE')

          payload = {
              'schemaVersion': 1,
              'gate': 'v143-ai-tab-branch-build',
              'branch': 'v143-contextual-prune-lobo',
              'nodeVersion': '24',
              'analyzerQualityVerifierExitCode': analyzer,
              'previewFeatureVerifierExitCode': preview,
              'nextBuildExitCode': build,
              'analyzerQualityVerifierPassed': analyzer == 0,
              'previewFeatureVerifierPassed': preview == 0,
              'nextBuildPassed': build == 0,
              'passed': analyzer == 0 and preview == 0 and build == 0,
              'liveEndpointDeployedOrModified': False,
              'vercelDeploymentAttempted': False,
              'productionModified': False,
              'productionPromotionAuthorized': False,
              'paidPurchaseAttempted': False,
              'customerTokenRedeemed': False,
              'customerEmailSent': False,
          }

          path = Path('debug/v143-contextual-prune/ai-tab-branch-build-gate.json')
          path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, indent=2))
          PY

      - name: Preserve build logs as short-retention artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-ai-tab-branch-build-gate
          path: |
            .branch-build-gate/
            debug/v143-contextual-prune/ai-tab-branch-build-gate.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit compact branch build diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file=debug/v143-contextual-prune/ai-tab-branch-build-gate.json
          git add -- "$file"

          if git diff --cached --quiet; then
            echo "Branch build diagnostic is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record V143 AI tab branch build gate"
          git push origin HEAD:v143-contextual-prune-lobo

      - name: Enforce branch build gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('debug/v143-contextual-prune/ai-tab-branch-build-gate.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          if data.get('passed') is not True:
              raise SystemExit(
                  'V143 AI tab branch build gate failed: '
                  f"analyzer={data.get('analyzerQualityVerifierExitCode')}, "
                  f"preview={data.get('previewFeatureVerifierExitCode')}, "
                  f"build={data.get('nextBuildExitCode')}"
              )
          if data.get('productionModified') is not False:
              raise SystemExit('Safety failure: Production was modified')
          if data.get('productionPromotionAuthorized') is not False:
              raise SystemExit('Safety failure: Production promotion was authorized')

          print('V143 AI TAB BRANCH BUILD GATE PASSED')
          print('productionModified=false')
          print('productionPromotionAuthorized=false')
          PY
