name: V143 AI Tab Branch Build Gate

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - '.github/workflows/v143-ai-tab-branch-build-gate.yml'
      - 'app/ai-tab/**'
      - 'app/api/analyze-audio-tab/**'
      - 'app/api/audio-upload/**'
      - 'app/api/generate-tab-preview/**'
      - 'app/api/generate-tab-pdf/**'
      - 'lib/jimmyPaigeAnalysisPayload.js'
      - 'lib/jimmyPaigeProfessionalPdfFeature.js'
      - 'lib/v143AnalyzerQuality.js'
      - 'lib/v143RenderContract.js'
      - 'lib/createJimmyPaigeProfessionalPdf.js'
      - 'lib/createAiTabPdf.js'
      - 'lib/createTabPdfPolishedV7.js'
      - 'lib/createV143RhythmPdf.js'
      - 'analyzer/verify_v143_analyzer_quality_gate.mjs'
      - 'analyzer/verify_jimmy_paige_preview_feature_gate.mjs'
      - 'analyzer/verify_v143_next_preview_route_smoke.mjs'

concurrency:
  group: v143-ai-tab-branch-build-gate
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-build-and-route-smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo

      - name: Prepare gate workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .branch-build-gate
          mkdir -p .branch-build-gate debug/v143-contextual-prune
          echo "BRANCH_GATE_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record gate start heartbeat
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('debug/v143-contextual-prune/next-preview-route-smoke.json')
          path.write_text(json.dumps({
              'schemaVersion': 5,
              'gate': 'v143-next-preview-route-smoke',
              'branch': 'v143-contextual-prune-lobo',
              'sourceCommit': os.environ.get('BRANCH_GATE_SOURCE_COMMIT'),
              'phase': 'started-staged-branch-gate',
              'localNextPreviewSimulation': True,
              'actualVercelPreviewDeployment': False,
              'installExitCode': None,
              'nextBuildExitCode': None,
              'serverReady': False,
              'routeSmokeExitCode': None,
              'passed': False,
              'vercelDeploymentAttempted': False,
              'liveEndpointDeployedOrModified': False,
              'productionModified': False,
              'productionPromotionAuthorized': False,
              'paidPurchaseAttempted': False,
              'customerTokenRedeemed': False,
              'customerEmailSent': False,
              'error': 'staged-branch-gate-in-progress',
          }, indent=2) + '\n', encoding='utf-8')
          PY
          git add debug/v143-contextual-prune/next-preview-route-smoke.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record V143 staged gate start' || true
          git fetch origin v143-contextual-prune-lobo
          git rebase origin/v143-contextual-prune-lobo
          git push origin HEAD:v143-contextual-prune-lobo

      - name: Set up Node.js 22 for regression verifiers
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run analyzer-quality verifier with hard timeout
        shell: bash
        run: |
          set +e
          timeout 120s node --experimental-default-type=module \
            analyzer/verify_v143_analyzer_quality_gate.mjs \
            > .branch-build-gate/analyzer-quality.log 2>&1
          status=$?
          echo "BRANCH_ANALYZER_QUALITY_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Run Preview feature verifier with hard timeout
        shell: bash
        run: |
          set +e
          timeout 120s node --experimental-default-type=module \
            analyzer/verify_jimmy_paige_preview_feature_gate.mjs \
            > .branch-build-gate/preview-feature.log 2>&1
          status=$?
          echo "BRANCH_PREVIEW_FEATURE_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Persist post-verifier progress
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          def code(name):
              try: return int(os.environ.get(name, '99'))
              except ValueError: return 99
          payload = {
              'schemaVersion': 2,
              'gate': 'v143-branch-gate-progress',
              'branch': 'v143-contextual-prune-lobo',
              'sourceCommit': os.environ.get('BRANCH_GATE_SOURCE_COMMIT'),
              'phase': 'post-verifiers',
              'analyzerQualityVerifierExitCode': code('BRANCH_ANALYZER_QUALITY_EXIT_CODE'),
              'previewFeatureVerifierExitCode': code('BRANCH_PREVIEW_FEATURE_EXIT_CODE'),
              'installExitCode': None,
              'nextBuildExitCode': None,
              'localNextPreviewSimulation': True,
              'actualVercelPreviewDeployment': False,
              'vercelDeploymentAttempted': False,
              'liveEndpointDeployedOrModified': False,
              'productionModified': False,
              'productionPromotionAuthorized': False,
          }
          Path('debug/v143-contextual-prune/branch-gate-progress.json').write_text(
              json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY
          cp debug/v143-contextual-prune/branch-gate-progress.json /tmp/v143-progress.json
          git restore -- debug/v143-contextual-prune/branch-gate-progress.json 2>/dev/null || true
          rm -f debug/v143-contextual-prune/branch-gate-progress.json
          git fetch origin v143-contextual-prune-lobo
          git rebase origin/v143-contextual-prune-lobo
          cp /tmp/v143-progress.json debug/v143-contextual-prune/branch-gate-progress.json
          git add debug/v143-contextual-prune/branch-gate-progress.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record V143 post-verifier progress' || true
          git push origin HEAD:v143-contextual-prune-lobo

      - name: Set up Node.js 24 for application build
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies with hard timeout
        shell: bash
        run: |
          set +e
          timeout 600s npm ci --ignore-scripts \
            > .branch-build-gate/npm-ci.log 2>&1
          status=$?
          echo "BRANCH_INSTALL_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Persist post-install progress
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          def code(name):
              try: return int(os.environ.get(name, '99'))
              except ValueError: return 99
          payload = {
              'schemaVersion': 2,
              'gate': 'v143-branch-gate-progress',
              'branch': 'v143-contextual-prune-lobo',
              'sourceCommit': os.environ.get('BRANCH_GATE_SOURCE_COMMIT'),
              'phase': 'post-install',
              'analyzerQualityVerifierExitCode': code('BRANCH_ANALYZER_QUALITY_EXIT_CODE'),
              'previewFeatureVerifierExitCode': code('BRANCH_PREVIEW_FEATURE_EXIT_CODE'),
              'installExitCode': code('BRANCH_INSTALL_EXIT_CODE'),
              'nextBuildExitCode': None,
              'localNextPreviewSimulation': True,
              'actualVercelPreviewDeployment': False,
              'vercelDeploymentAttempted': False,
              'liveEndpointDeployedOrModified': False,
              'productionModified': False,
              'productionPromotionAuthorized': False,
          }
          Path('debug/v143-contextual-prune/branch-gate-progress.json').write_text(
              json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY
          cp debug/v143-contextual-prune/branch-gate-progress.json /tmp/v143-progress.json
          git restore -- debug/v143-contextual-prune/branch-gate-progress.json 2>/dev/null || true
          rm -f debug/v143-contextual-prune/branch-gate-progress.json
          git fetch origin v143-contextual-prune-lobo
          git rebase origin/v143-contextual-prune-lobo
          cp /tmp/v143-progress.json debug/v143-contextual-prune/branch-gate-progress.json
          git add debug/v143-contextual-prune/branch-gate-progress.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record V143 post-install progress' || true
          git push origin HEAD:v143-contextual-prune-lobo

      - name: Compile full Next.js application with hard timeout
        shell: bash
        run: |
          set +e
          status=99
          if [ "${BRANCH_INSTALL_EXIT_CODE:-99}" -eq 0 ]; then
            timeout 600s npm run build \
              > .branch-build-gate/next-build.log 2>&1
            status=$?
          else
            echo 'Next build skipped because npm ci did not pass.' \
              > .branch-build-gate/next-build.log
          fi
          echo "BRANCH_NEXT_BUILD_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Persist post-build progress evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          def code(name):
              try: return int(os.environ.get(name, '99'))
              except ValueError: return 99
          payload = {
              'schemaVersion': 2,
              'gate': 'v143-branch-gate-progress',
              'branch': 'v143-contextual-prune-lobo',
              'sourceCommit': os.environ.get('BRANCH_GATE_SOURCE_COMMIT'),
              'phase': 'post-build',
              'analyzerQualityVerifierExitCode': code('BRANCH_ANALYZER_QUALITY_EXIT_CODE'),
              'previewFeatureVerifierExitCode': code('BRANCH_PREVIEW_FEATURE_EXIT_CODE'),
              'installExitCode': code('BRANCH_INSTALL_EXIT_CODE'),
              'nextBuildExitCode': code('BRANCH_NEXT_BUILD_EXIT_CODE'),
              'localNextPreviewSimulation': True,
              'actualVercelPreviewDeployment': False,
              'vercelDeploymentAttempted': False,
              'liveEndpointDeployedOrModified': False,
              'productionModified': False,
              'productionPromotionAuthorized': False,
          }
          Path('debug/v143-contextual-prune/branch-gate-progress.json').write_text(
              json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY
          cp debug/v143-contextual-prune/branch-gate-progress.json /tmp/v143-progress.json
          git restore -- debug/v143-contextual-prune/branch-gate-progress.json 2>/dev/null || true
          rm -f debug/v143-contextual-prune/branch-gate-progress.json
          git fetch origin v143-contextual-prune-lobo
          git rebase origin/v143-contextual-prune-lobo
          cp /tmp/v143-progress.json debug/v143-contextual-prune/branch-gate-progress.json
          git add debug/v143-contextual-prune/branch-gate-progress.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record V143 post-build progress' || true
          git push origin HEAD:v143-contextual-prune-lobo

      - name: Start built server and verify readiness
        shell: bash
        run: |
          set +e
          ready=false
          if [ "${BRANCH_NEXT_BUILD_EXIT_CODE:-99}" -eq 0 ]; then
            VERCEL_ENV=preview \
            VERCEL_GIT_COMMIT_REF=v143-contextual-prune-lobo \
            HOSTNAME=127.0.0.1 \
            PORT=4310 \
            npm start > .branch-build-gate/next-server.log 2>&1 &
            echo $! > .branch-build-gate/next-server.pid

            for attempt in $(seq 1 60); do
              if curl --silent --show-error --fail \
                --user-agent 'Mozilla/5.0 (compatible; DadRock-V143-Preview-Smoke/1.0)' \
                http://127.0.0.1:4310/ai-tab \
                > /dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 1
            done
          else
            echo 'Server start skipped because Next build did not pass.' \
              > .branch-build-gate/next-server.log
          fi
          echo "BRANCH_PREVIEW_SERVER_READY=$ready" >> "$GITHUB_ENV"
          exit 0

      - name: Exercise built Preview route with hard timeout
        shell: bash
        env:
          V143_PREVIEW_SMOKE_BASE_URL: http://127.0.0.1:4310
          V143_PREVIEW_SMOKE_RESULT_PATH: debug/v143-contextual-prune/next-preview-route-smoke.json
        run: |
          set +e
          status=99
          if [ "${BRANCH_PREVIEW_SERVER_READY:-false}" = true ]; then
            timeout 300s node analyzer/verify_v143_next_preview_route_smoke.mjs \
              > .branch-build-gate/preview-route-smoke.log 2>&1
            status=$?
          else
            echo 'Route smoke skipped because built server was not ready.' \
              > .branch-build-gate/preview-route-smoke.log
          fi
          echo "BRANCH_PREVIEW_ROUTE_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Finalize compact gate evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          def code(name):
              try: return int(os.environ.get(name, '99'))
              except ValueError: return 99

          analyzer = code('BRANCH_ANALYZER_QUALITY_EXIT_CODE')
          preview = code('BRANCH_PREVIEW_FEATURE_EXIT_CODE')
          install = code('BRANCH_INSTALL_EXIT_CODE')
          build = code('BRANCH_NEXT_BUILD_EXIT_CODE')
          route = code('BRANCH_PREVIEW_ROUTE_EXIT_CODE')
          server_ready = os.environ.get('BRANCH_PREVIEW_SERVER_READY') == 'true'
          source = os.environ.get('BRANCH_GATE_SOURCE_COMMIT')

          route_path = Path('debug/v143-contextual-prune/next-preview-route-smoke.json')
          try:
              route_data = json.loads(route_path.read_text(encoding='utf-8'))
          except Exception:
              route_data = {}

          verifier_passed = route_data.get('passed') is True
          route_data.update({
              'schemaVersion': 5,
              'gate': 'v143-next-preview-route-smoke',
              'branch': 'v143-contextual-prune-lobo',
              'sourceCommit': source,
              'phase': 'complete-by-staged-branch-gate',
              'localNextPreviewSimulation': True,
              'actualVercelPreviewDeployment': False,
              'installExitCode': install,
              'nextBuildExitCode': build,
              'serverReady': server_ready,
              'routeSmokeExitCode': route,
              'vercelDeploymentAttempted': False,
              'liveEndpointDeployedOrModified': False,
              'productionModified': False,
              'productionPromotionAuthorized': False,
              'paidPurchaseAttempted': False,
              'customerTokenRedeemed': False,
              'customerEmailSent': False,
          })
          route_data['passed'] = (
              install == 0 and build == 0 and server_ready and route == 0 and verifier_passed
          )
          if route_data['passed']:
              route_data['error'] = None
          elif install != 0:
              route_data['error'] = f'npm-ci-exit-{install}'
          elif build != 0:
              route_data['error'] = f'next-build-exit-{build}'
          elif not server_ready:
              route_data['error'] = 'built-next-server-not-ready'
          elif route != 0:
              route_data['error'] = route_data.get('error') or f'route-smoke-exit-{route}'
          else:
              route_data['error'] = route_data.get('error') or 'route-verifier-did-not-pass'
          route_path.write_text(json.dumps(route_data, indent=2) + '\n', encoding='utf-8')

          gate = {
              'schemaVersion': 5,
              'gate': 'v143-ai-tab-branch-build',
              'branch': 'v143-contextual-prune-lobo',
              'sourceCommit': source,
              'verifierNodeVersion': '22',
              'buildNodeVersion': '24',
              'analyzerQualityVerifierExitCode': analyzer,
              'previewFeatureVerifierExitCode': preview,
              'installExitCode': install,
              'nextBuildExitCode': build,
              'previewRouteServerReady': server_ready,
              'previewRouteSmokeExitCode': route,
              'analyzerQualityVerifierPassed': analyzer == 0,
              'previewFeatureVerifierPassed': preview == 0,
              'installPassed': install == 0,
              'nextBuildPassed': build == 0,
              'previewRouteSmokePassed': route_data.get('passed') is True,
              'passed': (
                  analyzer == 0 and preview == 0 and install == 0 and build == 0
                  and server_ready and route == 0 and route_data.get('passed') is True
              ),
              'localNextPreviewSimulation': True,
              'actualVercelPreviewDeployment': False,
              'liveEndpointDeployedOrModified': False,
              'vercelDeploymentAttempted': False,
              'productionModified': False,
              'productionPromotionAuthorized': False,
              'paidPurchaseAttempted': False,
              'customerTokenRedeemed': False,
              'customerEmailSent': False,
          }
          Path('debug/v143-contextual-prune/ai-tab-branch-build-gate.json').write_text(
              json.dumps(gate, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(gate, indent=2))
          PY

      - name: Preserve staged gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-ai-tab-branch-build-gate
          path: |
            .branch-build-gate/
            debug/v143-contextual-prune/branch-gate-progress.json
            debug/v143-contextual-prune/ai-tab-branch-build-gate.json
            debug/v143-contextual-prune/next-preview-route-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit final compact evidence safely
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp debug/v143-contextual-prune/ai-tab-branch-build-gate.json /tmp/v143-build-gate.json
          cp debug/v143-contextual-prune/next-preview-route-smoke.json /tmp/v143-route-smoke.json
          git restore -- \
            debug/v143-contextual-prune/ai-tab-branch-build-gate.json \
            debug/v143-contextual-prune/next-preview-route-smoke.json \
            2>/dev/null || true
          git fetch origin v143-contextual-prune-lobo
          git rebase origin/v143-contextual-prune-lobo
          cp /tmp/v143-build-gate.json debug/v143-contextual-prune/ai-tab-branch-build-gate.json
          cp /tmp/v143-route-smoke.json debug/v143-contextual-prune/next-preview-route-smoke.json
          git add \
            debug/v143-contextual-prune/ai-tab-branch-build-gate.json \
            debug/v143-contextual-prune/next-preview-route-smoke.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record V143 staged branch gate' || true
          git push origin HEAD:v143-contextual-prune-lobo

      - name: Enforce staged branch gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          build = json.loads(Path('debug/v143-contextual-prune/ai-tab-branch-build-gate.json').read_text())
          route = json.loads(Path('debug/v143-contextual-prune/next-preview-route-smoke.json').read_text())
          if build.get('passed') is not True:
              raise SystemExit(
                  'V143 staged gate failed: '
                  f"analyzer={build.get('analyzerQualityVerifierExitCode')}, "
                  f"preview={build.get('previewFeatureVerifierExitCode')}, "
                  f"install={build.get('installExitCode')}, "
                  f"build={build.get('nextBuildExitCode')}, "
                  f"serverReady={build.get('previewRouteServerReady')}, "
                  f"route={build.get('previewRouteSmokeExitCode')}"
              )
          if route.get('passed') is not True:
              raise SystemExit(f"V143 route smoke failed: {route.get('error')}")
          for data in (build, route):
              if data.get('actualVercelPreviewDeployment') is not False:
                  raise SystemExit('Safety failure: actual Vercel Preview was claimed')
              if data.get('vercelDeploymentAttempted') is not False:
                  raise SystemExit('Safety failure: Vercel deployment was attempted')
              if data.get('productionModified') is not False:
                  raise SystemExit('Safety failure: Production was modified')
              if data.get('productionPromotionAuthorized') is not False:
                  raise SystemExit('Safety failure: Production promotion was authorized')
          print('V143 STAGED BRANCH BUILD + ROUTE GATE PASSED')
          print(f"sourceCommit={build.get('sourceCommit')}")
          print('actualVercelPreviewDeployment=false')
          print('productionModified=false')
          PY

      - name: Stop built server
        if: always()
        shell: bash
        run: |
          if [ -f .branch-build-gate/next-server.pid ]; then
            kill "$(cat .branch-build-gate/next-server.pid)" 2>/dev/null || true
          fi
