name: Clean up tab preview card

on:
  push:
    paths:
      - '.github/workflows/cleanup-tab-preview.yml'

permissions:
  contents: read

jobs:
  verify-preview-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify preview cleanup is already applied
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'Tab Studio Preview' app/ai-tab/page.js

          if grep -Fq 'Review Your Tab Preview' app/ai-tab/page.js; then
            echo 'Old preview heading is still present.' >&2
            exit 1
          fi

          if grep -Fq 'Watermarked preview ready' app/ai-tab/page.js; then
            echo 'Old watermarked-preview heading is still present.' >&2
            exit 1
          fi

          if grep -Fq 'Full transcription locked' app/ai-tab/page.js; then
            echo 'Old preview lock overlay is still present.' >&2
            exit 1
          fi

          echo 'Preview cleanup is already applied; no source mutation is required.'
