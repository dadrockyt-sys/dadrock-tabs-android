name: V167 post-I005 active-only aggregate diagnosis

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v167-post-i005-active-only-analysis.yml

permissions:
  contents: write

concurrency:
  group: v167-post-i005-active-only-analysis-once
  cancel-in-progress: false

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: 384d4a6033bfaf778a26a0fa3be459b475f0b39d
  CONTEXTUAL_REPORT: debug/v167-single-song-calibration/contextual-guitar-recovery-sweep.json
  STATE_REPORT: debug/v167-single-song-calibration/state-split-guitar-sweep.json
  POOL: debug/v167-single-song-calibration/nearmiss-evidence-pool.json
  I003: debug/v167-single-song-calibration/iteration-003-generated.json
  I005: debug/v167-single-song-calibration/iteration-005-generated.json
  ANALYZER: validation/v167_single_song_calibration/analyze_post_i005_active_only_v167_rearm.py
  OUTPUT: debug/v167-single-song-calibration/post-i005-active-only-aggregate-analysis.json
  RECEIPT: debug/v167-single-song-calibration/post-i005-active-only-aggregate-analysis-receipt.json
  CUDA_VISIBLE_DEVICES: ""
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  analyze-once:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact corrected analysis rearm
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.21'

      - name: Verify corrected reference-blind aggregate boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v167-post-i005-active-only-analysis.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"

          test "$(git hash-object "$CONTEXTUAL_REPORT")" = "b00e25f5c1fd9f8c40b440156e049317e008ec1d"
          test "$(git hash-object "$STATE_REPORT")" = "d26e4128479f760c23fe6c449cc4b3ec5ad7219b"
          test "$(git hash-object "$POOL")" = "aa7da3a55344b1418a291f30fab9ca55858fc094"
          test "$(git hash-object "$I003")" = "758f8762632e916306aed9b036a6483af9431dc0"
          test "$(git hash-object "$I005")" = "8d68f4d7fac4e094bcd617b026befddd370d9368"
          test "$(git hash-object "$ANALYZER")" = "82ec287869102ab6af949afa174a2543768dbc55"
          test "$(git hash-object docs/checkpoints/CURRENT_STATE.md)" = "703e1b8628bc4de3b9b7e798560234060c0d3f0a"

          test ! -e "$OUTPUT"
          test ! -e "$RECEIPT"
          python -m py_compile "$ANALYZER"

          python - <<'PY'
          import hashlib
          from pathlib import Path

          checks = {
              'debug/v167-single-song-calibration/contextual-guitar-recovery-sweep.json': '6b661f6dfa27d31204f4e8a9035d286d5324440b947eb3e49db99205dad9320e',
              'debug/v167-single-song-calibration/state-split-guitar-sweep.json': 'f4dfd04849eab3f15290cadb2b9ff0a2903bc6174beb428b35c71aa7c7347562',
              'debug/v167-single-song-calibration/nearmiss-evidence-pool.json': '1c983784c2d12a22437a80387525789bcf55a2f4e4a5c7a96608c575bf709673',
              'debug/v167-single-song-calibration/iteration-003-generated.json': 'f15c6f40dd4b8479c2dfb7eab039cff98a23b45eb796265ffad08c5a8ae37115',
              'debug/v167-single-song-calibration/iteration-005-generated.json': '86329ebc25e589f566d466a7a65cae35a158c25f470b1c034973f3dbc7d38b31',
          }
          for path, expected in checks.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert actual == expected, (path, actual, expected)

          text = Path('validation/v167_single_song_calibration/analyze_post_i005_active_only_v167_rearm.py').read_text()
          for forbidden in ('frontend-reference-payload.json', 'score_frontend_reference.py', '--reference', '--scorer-code'):
              assert forbidden not in text, forbidden
          PY

      - name: Analyze exact I005 additions and frozen aggregate evidence
        shell: bash
        run: |
          set -euo pipefail
          python "$ANALYZER" \
            --contextual-report "$CONTEXTUAL_REPORT" \
            --state-split-report "$STATE_REPORT" \
            --pool "$POOL" \
            --i003 "$I003" \
            --i005 "$I005" \
            --output "$OUTPUT"

          python - <<'PY'
          import json
          analysis = json.load(open('debug/v167-single-song-calibration/post-i005-active-only-aggregate-analysis.json'))
          assert analysis['schema'] == 'dadrock.tabs.v167.post-i005-active-only-aggregate-analysis.v2'
          assert analysis['status'] == 'POST_I005_AGGREGATE_REFERENCE_BLIND_ANALYSIS_FROZEN'
          assert analysis['correction']['supersedesFailedAnalyzerAttempt'] is True
          assert analysis['policy']['professionalReferenceReadByAnalysis'] is False
          assert analysis['policy']['scorerReadByAnalysis'] is False
          assert analysis['policy']['newReferenceFacingScoreCalls'] == 0
          assert analysis['policy']['perEventReferenceMatchAssignmentsRead'] is False
          assert analysis['policy']['newRuleSelectedByThisAnalysis'] is False
          assert analysis['i005SelectedAdditionStructure']['additionCount'] == 48
          assert analysis['i005SelectedAdditionStructure']['uniqueSelectedSiteCount'] == 48
          assert analysis['stateSplitWholeRuleMechanism']['allFourNewRulesBeatI004'] is True
          print('onset pair:', json.dumps(analysis['contextualOnset050Vs065WholeRuleEvidence']['closestToI004StructurePair'], sort_keys=True))
          print('selected onset:', json.dumps(analysis['i005SelectedAdditionStructure']['onsetSupport'], sort_keys=True))
          print('onset survival:', json.dumps(analysis['i005SelectedAdditionStructure']['onsetThresholdSurvivalCounts'], sort_keys=True))
          print('active multiplicity:', json.dumps(analysis['i005SelectedAdditionStructure']['activeMidiCountAtSiteHistogram'], sort_keys=True))
          print('max ties:', json.dumps(analysis['i005SelectedAdditionStructure']['maxActiveTieCountAtSiteHistogram'], sort_keys=True))
          print('selected competition:', json.dumps(analysis['i005SelectedAdditionStructure']['preGridActiveMaxCandidateCountAtSelectedSiteHistogram'], sort_keys=True))
          print('interval categories:', json.dumps(analysis['i005SelectedAdditionStructure']['nearestDifferentActiveIntervalCategoryHistogram'], sort_keys=True))
          PY

      - name: Freeze corrected analysis receipt and self-seal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          output = Path('debug/v167-single-song-calibration/post-i005-active-only-aggregate-analysis.json')
          receipt_path = Path('debug/v167-single-song-calibration/post-i005-active-only-aggregate-analysis-receipt.json')
          analysis = json.loads(output.read_text())
          receipt = {
              'schema': 'dadrock.tabs.v167.post-i005-active-only-aggregate-analysis-receipt.v2',
              'version': 'V167',
              'status': 'POST_I005_ACTIVE_ONLY_AGGREGATE_ANALYSIS_FROZEN',
              'classification': 'SINGLE_SONG_TRAINING_CALIBRATION_ONLY',
              'workflowRunId': int(os.environ['GITHUB_RUN_ID']),
              'workflowRunNumber': int(os.environ['GITHUB_RUN_NUMBER']),
              'workflowRunAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'workflowHeadSha': os.environ['GITHUB_SHA'],
              'analysisSha256': hashlib.sha256(output.read_bytes()).hexdigest(),
              'analysisGitBlob': subprocess.check_output(['git', 'hash-object', str(output)], text=True).strip(),
              'implementation': {
                  'failedAnalyzerGitBlob': '86a32010f441fb518146f3717ae8d9ab3b94b8ea',
                  'correctedAnalyzerGitBlob': '82ec287869102ab6af949afa174a2543768dbc55',
              },
              'correction': analysis['correction'],
              'inputs': analysis['inputs'],
              'summary': {
                  'additionCount': analysis['i005SelectedAdditionStructure']['additionCount'],
                  'uniqueSelectedSiteCount': analysis['i005SelectedAdditionStructure']['uniqueSelectedSiteCount'],
                  'onsetSupport': analysis['i005SelectedAdditionStructure']['onsetSupport'],
                  'onsetThresholdSurvivalCounts': analysis['i005SelectedAdditionStructure']['onsetThresholdSurvivalCounts'],
                  'activeMidiCountAtSiteHistogram': analysis['i005SelectedAdditionStructure']['activeMidiCountAtSiteHistogram'],
                  'maxActiveTieCountAtSiteHistogram': analysis['i005SelectedAdditionStructure']['maxActiveTieCountAtSiteHistogram'],
                  'preGridActiveMaxCandidateCountAtSelectedSiteHistogram': analysis['i005SelectedAdditionStructure']['preGridActiveMaxCandidateCountAtSelectedSiteHistogram'],
                  'nearestDifferentActiveIntervalCategoryHistogram': analysis['i005SelectedAdditionStructure']['nearestDifferentActiveIntervalCategoryHistogram'],
                  'closestOnsetPair': analysis['contextualOnset050Vs065WholeRuleEvidence']['closestToI004StructurePair'],
                  'allowActiveNoHarmOnsetPairSummary': analysis['contextualOnset050Vs065WholeRuleEvidence']['allowActiveExcludeHarmonicOctave'],
              },
              'policy': analysis['policy'],
          }
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

          rm .github/workflows/v167-post-i005-active-only-analysis.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$OUTPUT" "$RECEIPT" .github/workflows/v167-post-i005-active-only-analysis.yml
          changed="$(git diff --cached --name-only)"
          if echo "$changed" | grep -Ev '^debug/v167-single-song-calibration/post-i005-active-only-aggregate-analysis(-receipt)?\.json$|^\.github/workflows/v167-post-i005-active-only-analysis\.yml$'; then
            echo 'Unexpected corrected post-I005 analysis path' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 3
          git commit -m "research: freeze corrected V167 post-I005 active-only aggregate diagnosis [skip ci]"
          git push origin HEAD:"$BRANCH"
