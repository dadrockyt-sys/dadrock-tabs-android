name: Songsterr Fresh Integrate Decoder Traces Valid Once

on:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-integrate-traces-valid-once.yml'

permissions:
  contents: write

jobs:
  patch-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out fresh branch
        uses: actions/checkout@v4
        with:
          ref: songsterr-fresh-pipeline-v1
          fetch-depth: 0

      - name: Integrate exact decoder traces into measurement canary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/songsterr-fresh-model-evidence-cross-run-measurement-canary.yml')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}:EXPECTED_ONE_MATCH:GOT:{count}')
              text = text.replace(old, new, 1)

          replace_once(
              "      - 'scripts/songsterr-fresh/compare_basic_pitch_decision_surfaces.py'\n      - 'scripts/songsterr-fresh/verify_demucs_model_asset.py'",
              "      - 'scripts/songsterr-fresh/compare_basic_pitch_decision_surfaces.py'\n      - 'scripts/songsterr-fresh/trace_basic_pitch_decoder_mechanisms.py'\n      - 'scripts/songsterr-fresh/compare_basic_pitch_decoder_traces.py'\n      - 'scripts/songsterr-fresh/verify_demucs_model_asset.py'",
              'trigger-paths',
          )

          observation_step = "\n".join([
              "          PY",
              "",
              "      - name: Replay exact Basic Pitch decoder mechanisms",
              "        shell: bash",
              "        run: |",
              "          set -euo pipefail",
              "          BASE=\"/tmp/songsterr-fresh-model-variation-${{ matrix.sample }}\"",
              "          python scripts/songsterr-fresh/trace_basic_pitch_decoder_mechanisms.py \\",
              "            \"$BASE/evidence-${{ matrix.sample }}.json\" \\",
              "            \"$BASE/basic-pitch-note-activations-${{ matrix.sample }}.json\" \\",
              "            \"$BASE/basic-pitch-decision-surface-${{ matrix.sample }}.json\" \\",
              "            --output \"$BASE/basic-pitch-decoder-trace-${{ matrix.sample }}.json\"",
              "",
              "      - name: Record observation runtime provenance",
          ])
          replace_once(
              "          PY\n\n      - name: Record observation runtime provenance",
              observation_step,
              'observation-trace-step',
          )

          replace_once(
              "            /tmp/songsterr-fresh-model-variation-${{ matrix.sample }}/basic-pitch-decision-surface-${{ matrix.sample }}.json\n            /tmp/songsterr-fresh-model-variation-${{ matrix.sample }}/demucs-model-asset.json",
              "            /tmp/songsterr-fresh-model-variation-${{ matrix.sample }}/basic-pitch-decision-surface-${{ matrix.sample }}.json\n            /tmp/songsterr-fresh-model-variation-${{ matrix.sample }}/basic-pitch-decoder-trace-${{ matrix.sample }}.json\n            /tmp/songsterr-fresh-model-variation-${{ matrix.sample }}/demucs-model-asset.json",
              'observation-upload',
          )

          replace_once(
              "          python scripts/songsterr-fresh/compare_basic_pitch_decision_surfaces.py --self-test\n",
              "          python scripts/songsterr-fresh/compare_basic_pitch_decision_surfaces.py --self-test\n          python scripts/songsterr-fresh/trace_basic_pitch_decoder_mechanisms.py --self-test\n          python scripts/songsterr-fresh/compare_basic_pitch_decoder_traces.py --self-test\n",
              'aggregate-self-tests',
          )

          trace_compare = "\n".join([
              "      - name: Measure all pairwise exact decoder-trace variation",
              "        shell: bash",
              "        run: |",
              "          set -euo pipefail",
              "          OUT=/tmp/songsterr-fresh-model-evidence-comparison",
              "          IN=/tmp/songsterr-fresh-model-evidence-observations",
              "          python scripts/songsterr-fresh/compare_basic_pitch_decoder_traces.py \\",
              "            \"$IN/basic-pitch-decoder-trace-a.json\" \"$IN/basic-pitch-decoder-trace-b.json\" --output \"$OUT/trace-comparison-ab.json\"",
              "          python scripts/songsterr-fresh/compare_basic_pitch_decoder_traces.py \\",
              "            \"$IN/basic-pitch-decoder-trace-a.json\" \"$IN/basic-pitch-decoder-trace-c.json\" --output \"$OUT/trace-comparison-ac.json\"",
              "          python scripts/songsterr-fresh/compare_basic_pitch_decoder_traces.py \\",
              "            \"$IN/basic-pitch-decoder-trace-b.json\" \"$IN/basic-pitch-decoder-trace-c.json\" --output \"$OUT/trace-comparison-bc.json\"",
              "",
          ])
          replace_once(
              "      - name: Build and validate measurement-only aggregate summary\n",
              trace_compare + "\n      - name: Build and validate measurement-only aggregate summary\n",
              'pairwise-trace-comparison',
          )

          trace_guard = "\n".join([
              "              if interpretation.get('unmatchedEventIsNotAutomaticallyThresholdFailure') is not True:",
              "                  raise SystemExit(f'DECISION_UNMATCHED_INTERPRETATION_CHANGED:{pair}')",
              "",
              "          for pair in ('ab', 'ac', 'bc'):",
              "              with open(root / f'trace-comparison-{pair}.json', 'r', encoding='utf-8') as handle:",
              "                  trace = json.load(handle)",
              "              if trace.get('measurementOnly') is not True or trace.get('referenceBlind') is not True:",
              "                  raise SystemExit(f'TRACE_COMPARISON_SCOPE_CHANGED:{pair}')",
              "              tb = trace.get('policyBoundary', {})",
              "              for field in (",
              "                  'thresholdsAppliedForAdmission',",
              "                  'admissionDecisionMade',",
              "                  'modelValidationComplete',",
              "                  'mayAdvanceDelivery',",
              "                  'durationAuthorityChanged',",
              "                  'changesDecodedEventInventory',",
              "                  'referenceTabUsed',",
              "                  'professionalScorerUsed',",
              "                  'legacyV143ScorerImported',",
              "              ):",
              "                  if tb.get(field) is not False:",
              "                      raise SystemExit(f'TRACE_COMPARISON_POLICY_BOUNDARY_CHANGED:{pair}:{field}:{tb.get(field)}')",
              "              ti = trace.get('interpretationBoundary', {})",
              "              if ti.get('observedVariationDoesNotDefineAdmissionTolerance') is not True:",
              "                  raise SystemExit(f'TRACE_VARIATION_BECAME_TOLERANCE:{pair}')",
              "              if ti.get('mechanismStabilityDoesNotPromoteModelValidation') is not True:",
              "                  raise SystemExit(f'TRACE_MECHANISM_STABILITY_BECAME_PROMOTIONAL:{pair}')",
              "          PY",
          ])
          replace_once(
              "              if interpretation.get('unmatchedEventIsNotAutomaticallyThresholdFailure') is not True:\n                  raise SystemExit(f'DECISION_UNMATCHED_INTERPRETATION_CHANGED:{pair}')\n          PY",
              trace_guard,
              'trace-nonpromotion-guard',
          )

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit canary integration and remove helper
        run: |
          rm .github/workflows/songsterr-fresh-integrate-traces-valid-once.yml
          git config user.name 'dadrockyt-sys'
          git config user.email 'Stephen.s.mcnally@gmail.com'
          git add .github/workflows/songsterr-fresh-model-evidence-cross-run-measurement-canary.yml .github/workflows/songsterr-fresh-integrate-traces-valid-once.yml
          git commit -m 'feat: integrate decoder traces into fresh model canary'
          git push origin HEAD:songsterr-fresh-pipeline-v1
