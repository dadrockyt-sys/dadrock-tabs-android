name: V143 Demucs Shift Offset Probe

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-demucs-shift-offset-probe.yml
      - analyzer/v143_demucs_shift_offset_probe_modal.py
      - analyzer/v143_shift_trace_audio_separator_cli.py

permissions:
  contents: write

jobs:
  demucs-shift-offset-probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Check out isolated research branch
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify probe inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s public/gomywayfullaitest.m4a
          test -s analyzer/v143_demucs_shift_offset_probe_modal.py
          test -s analyzer/v143_shift_trace_audio_separator_cli.py
          test -s analyzer/v143_seeded_audio_separator_cli.py
          echo "Demucs shift-offset probe inputs are present."

      - name: Run adaptive Demucs shift-offset probe on Modal
        shell: bash
        run: |
          set +e
          mkdir -p debug/v143-contextual-prune
          log=debug/v143-contextual-prune/demucs-shift-offset-probe.log
          output=debug/v143-contextual-prune/demucs-shift-offset-probe.json

          : > "$log"
          echo "commit=$GITHUB_SHA" >> "$log"
          echo "actor=$GITHUB_ACTOR" >> "$log"

          token_available=false
          attempted=false
          status=99

          if [ -n "${MODAL_TOKEN_ID:-}" ] && [ -n "${MODAL_TOKEN_SECRET:-}" ]; then
            token_available=true
            python -m pip install --disable-pip-version-check modal >> "$log" 2>&1
            install_status=$?
            if [ "$install_status" -eq 0 ]; then
              attempted=true
              python -m modal run analyzer/v143_demucs_shift_offset_probe_modal.py::diagnose >> "$log" 2>&1
              status=$?
            else
              status=$install_status
            fi
          else
            echo "Modal GitHub credentials are unavailable; probe not attempted." >> "$log"
          fi

          TOKEN_AVAILABLE="$token_available" ATTEMPTED="$attempted" STATUS="$status" python - <<'PY'
          import json
          import os
          from pathlib import Path

          log_path = Path("debug/v143-contextual-prune/demucs-shift-offset-probe.log")
          output = Path("debug/v143-contextual-prune/demucs-shift-offset-probe.json")
          text = log_path.read_text(encoding="utf-8", errors="replace")
          target_gate = "v143-demucs-shift-offset-probe"
          result = None
          decoder = json.JSONDecoder()
          for index, char in enumerate(text):
              if char != "{":
                  continue
              try:
                  value, _ = decoder.raw_decode(text[index:])
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict) and value.get("gate") == target_gate:
                  result = value

          payload = {
              "schemaVersion": 1,
              "gate": "v143-demucs-shift-offset-probe-action",
              "modalCredentialsAvailableInGitHubActions": os.environ["TOKEN_AVAILABLE"] == "true",
              "diagnosticAttempted": os.environ["ATTEMPTED"] == "true",
              "modalCommandExitCode": int(os.environ["STATUS"]) if os.environ["ATTEMPTED"] == "true" else None,
              "diagnosticResultFound": result is not None,
              "diagnosticResult": result,
              "logTail": text.splitlines()[-260:],
              "liveEndpointDeployedOrModified": False,
              "productionModified": False,
          }
          output.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

          exit 0

      - name: Preserve full probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-demucs-shift-offset-probe-log
          path: debug/v143-contextual-prune/demucs-shift-offset-probe.log
          if-no-files-found: error
          retention-days: 7

      - name: Commit compact probe result
        shell: bash
        run: |
          set -euo pipefail
          git add -- debug/v143-contextual-prune/demucs-shift-offset-probe.json
          if git diff --cached --quiet; then
            echo "No Demucs shift-offset result changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record V143 Demucs shift offset probe"
          git push origin HEAD:v143-contextual-prune-lobo

      - name: Report shift-offset state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("debug/v143-contextual-prune/demucs-shift-offset-probe.json").read_text(encoding="utf-8"))
          result = data.get("diagnosticResult") or {}
          summary = result.get("summary") or {}
          invariants = result.get("invariants") or {}

          checks = {
              "Modal credentials available": data.get("modalCredentialsAvailableInGitHubActions") is True,
              "Diagnostic attempted": data.get("diagnosticAttempted") is True,
              "Modal command exited zero": data.get("modalCommandExitCode") == 0,
              "Diagnostic result found": data.get("diagnosticResultFound") is True,
              "Demucs family lockstep": summary.get("allDirectCascadeFamiliesLockstep") is True,
              "RoFormer exact": summary.get("roformerPcmExactAcrossWorkers") is True,
              "Trace wrapper preserves randint": invariants.get("traceWrapperReturnsOriginalRandintValueUnchanged") is True,
              "Frozen model untouched": invariants.get("frozenModelModified") is False,
              "Frozen predictions untouched": invariants.get("frozenPredictionsModified") is False,
              "Thresholds untouched": invariants.get("thresholdsModified") is False,
              "Live endpoint untouched": invariants.get("liveEndpointDeployedOrModified") is False,
              "Production untouched": invariants.get("productionModified") is False,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Demucs shift-offset probe execution failed: " + ", ".join(failed))

          print("WORKERS", result.get("workerCount"))
          print("BATCHES", result.get("batchesRun"))
          print("DIRECT_FAMILIES", json.dumps(summary.get("directFamilyCounts"), sort_keys=True))
          print("BOTH_FAMILIES", summary.get("bothKnownFamiliesObserved"))
          print("DIRECT_SHIFT_SEQUENCES", json.dumps(summary.get("directShiftSequencesByFamily"), sort_keys=True))
          print("CASCADE_SHIFT_SEQUENCES", json.dumps(summary.get("cascadeShiftSequencesByFamily"), sort_keys=True))
          print("SAME_DIRECT_SHIFTS", summary.get("sameDirectShiftSequencesAcrossFamilies"))
          print("SAME_CASCADE_SHIFTS", summary.get("sameCascadeShiftSequencesAcrossFamilies"))
          print("PRODUCTION_MODIFIED", False)
          PY
