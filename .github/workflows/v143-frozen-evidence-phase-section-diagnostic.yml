name: V143 Frozen Evidence Phase Section Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-frozen-evidence-phase-section-diagnostic.yml
      - analyzer/v143_frozen_evidence_phase_section_diagnostic.py

permissions:
  contents: write

concurrency:
  group: v143-frozen-evidence-phase-section-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref_name == 'v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v143-contextual-prune-lobo

      - name: Verify protected runtime and frozen evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          test -f debug/v143-contextual-prune/frozen-approved-audio-preholdout-evidence.json
          test -f analyzer/v143_frozen_evidence_phase_section_diagnostic.py

      - name: Run reference-free CPU sectional diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python analyzer/v143_frozen_evidence_phase_section_diagnostic.py \
            debug/v143-contextual-prune/frozen-approved-audio-preholdout-evidence.json \
            debug/v143-contextual-prune/frozen-evidence-phase-section-diagnostic.json

      - name: Verify fail-closed invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('debug/v143-contextual-prune/frozen-evidence-phase-section-diagnostic.json').read_text())
          assert d['referenceFree'] is True
          assert d['professionalReferenceUsed'] is False
          assert d['referenceRuntimeInputUsed'] is False
          assert d['modalUsed'] is False
          assert d['productionModified'] is False
          assert d['protectedRuntimeModified'] is False
          assert d['candidateRenderProduced'] is False
          assert d['eventMutationProposed'] is False
          assert d['attackCount'] == 725
          inv = d['invariants']
          assert inv['all725AttacksRead'] is True
          assert inv['eventsMutated'] is False
          assert inv['attackGridMutated'] is False
          assert inv['pitchSelectionMutated'] is False
          assert inv['referenceConsulted'] is False
          assert inv['phaseSelectionPerformed'] is False
          PY

      - name: Persist diagnostic report only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add debug/v143-contextual-prune/frozen-evidence-phase-section-diagnostic.json
          if git diff --cached --quiet; then
            echo "Diagnostic report unchanged"
            exit 0
          fi
          git commit -m "diagnostic: persist sectional phase transition report"
          git push origin HEAD:v143-contextual-prune-lobo
