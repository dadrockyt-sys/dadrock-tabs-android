name: Astra Go My Way Three Role Failure Anatomy V1

on:
  push:
    branches: [astra-work]
    paths:
      - 'astra_backend/evaluation/analyze_gomyway_three_role_failure_anatomy_v1.py'
      - '.github/workflows/astra-gomyway-three-role-failure-anatomy-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-work
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download frozen prediction bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/37094392537 --jq .conclusion)" = "success"
          gh run download 37094392537             -n astra-gomyway-full-song-professional-benchmark-v1             -D upstream
          test -f upstream/gomyway_full_song_professional_benchmark_v1.json

      - name: Run failure anatomy
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=astra_backend:astra_backend/evaluation           python astra_backend/evaluation/analyze_gomyway_three_role_failure_anatomy_v1.py             --prediction-benchmark upstream/gomyway_full_song_professional_benchmark_v1.json             --intro-reference analyzer/fixtures/gomyway_professional_intro_reference_v1.json             --rhythm-reference public/gomyway-professional-rhythm-reference-17-113.json             --timing-map public/gomyway-professional-timing-map-v2.json             --bass-reference research/v154-professional-references/bass-professional-reference-machine-readable.json             --bass-timing research/v154-professional-references/bass-source-local-attack-timing.json             --lead-reference research/v154-professional-references/lead-professional-reference-machine-readable.json             --lead-timing research/v154-professional-references/lead-source-local-attack-timing.json             --output-json gomyway_three_role_failure_anatomy_v1.json

      - name: Summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("gomyway_three_role_failure_anatomy_v1.json"))
          print("# Go My Way Three-Role Failure Anatomy V1")
          print(f"- Targets: **{d['targetCount']}**")
          for role in ("rhythm","lead","bass"):
              x=d["roles"][role]
              print(f"## {role.title()}")
              print(f"- exact MIDI candidate available: **{x['rates'].get('exact_midi_available',0):.1%}**")
              print(f"- same pitch class / wrong octave: **{x['rates'].get('same_pitch_class_wrong_octave',0):.1%}**")
              print(f"- near pitch +/-1-2 semitones: **{x['rates'].get('near_pitch_1_2_semitones',0):.1%}**")
              print(f"- fourth/fifth-class relation: **{x['rates'].get('fourth_fifth_class_relation',0):.1%}**")
              print(f"- other wrong pitch only: **{x['rates'].get('other_wrong_pitch_only',0):.1%}**")
              print(f"- no prediction within 50 ms: **{x['rates'].get('no_prediction_within_50ms',0):.1%}**")
              print(f"- reference MIDI median: **{x['referenceRegister']['median']}**")
              print(f"- prediction MIDI median: **{x['predictionRegister']['median']}**")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: astra-gomyway-three-role-failure-anatomy-v1
          path: gomyway_three_role_failure_anatomy_v1.json
          retention-days: 30

      - if: always()
        run: rm -rf upstream
