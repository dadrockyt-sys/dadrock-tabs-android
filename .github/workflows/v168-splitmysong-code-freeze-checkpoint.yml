name: V168 SplitMySong code-freeze checkpoint

on:
  push:
    branches: [v143-contextual-prune-lobo]
    paths: [.github/workflows/v168-splitmysong-code-freeze-checkpoint.yml]

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 1
      - name: Append checkpoint and self-delete
        env:
          SECTION_B64: 
        run: |
          set -euo pipefail
          test "$(grep -c 'SplitMySong context preflight + one-shot generator code frozen' docs/checkpoints/CURRENT_STATE.md || true)" = "0"
          printf '%s' "$SECTION_B64" | base64 -d >> docs/checkpoints/CURRENT_STATE.md
          rm .github/workflows/v168-splitmysong-code-freeze-checkpoint.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/checkpoints/CURRENT_STATE.md .github/workflows/v168-splitmysong-code-freeze-checkpoint.yml
          git commit -m 'Checkpoint SplitMySong context and generator code freeze'
          git push origin HEAD:v143-contextual-prune-lobo
