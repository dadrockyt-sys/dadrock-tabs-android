name: V147 Phase E Normalized Context Once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v147-phase-e-normalized-context-once.yml

permissions:
  contents: write

concurrency:
  group: v147-phase-e-normalized-context-once
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fail closed on prior attempt and verify identities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v143-contextual-prune-lobo
          if git cat-file -e origin/v143-contextual-prune-lobo:debug/v147-phase-e-reference-free/normalized-context-attempt-sentinel.json 2>/dev/null; then
            echo 'Normalized-context attempt already exists; refusing rerun.' >&2
            exit 90
          fi
          test "$(git hash-object debug/v147-phase-e-reference-free/phase-e-normalized-context-addendum.json)" = "5e0dffcea24662c7b10288e2fe1d993aeb693dd7"
          test "$(git hash-object validation/v147_phase_e/analyze_normalized_context.py)" = "ff35b44b004e407a1ce09e83828061325d0f9947"
          test "$(git hash-object debug/v147-phase-e-reference-free/failure-analysis.json)" = "817189a1ec1d3aa6e6c15dc6e9f116becbf12690"
          test "$(sha256sum debug/v147-phase-c-real-audio/preserved-run-33038518285/candidate.json | awk '{print $1}')" = "c0215690d5bfd9d2d47b8784eee886e942fbd28c499f25c643635c45ff7a9636"
          test "$(sha256sum debug/v147-phase-c-real-audio/preserved-run-33038518285/decisions.json | awk '{print $1}')" = "3ec6c42730bf571c29258eca131c4e32da257c1ac6073e5319073818e8ac49b9"

      - name: Make reference surfaces unreadable
        shell: bash
        run: |
          set -euo pipefail
          chmod 000 public/Professionalexample.jpg 2>/dev/null || true
          chmod -R 000 debug/v144-rhythm-calibration/reference 2>/dev/null || true
          chmod -R 000 validation/rhythm_holdout/reference 2>/dev/null || true
          test ! -r public/Professionalexample.jpg
          test ! -r debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json

      - name: Persist normalized-context pre-analysis checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat > debug/v147-phase-e-reference-free/normalized-context-attempt-sentinel.json <<EOF
          {
            "schema": "dadrock.tabs.v147.phase-e-normalized-context-attempt.v1",
            "githubRunId": "${GITHUB_RUN_ID}",
            "workflowArmingCommit": "${GITHUB_SHA}",
            "preregistrationGitBlob": "5e0dffcea24662c7b10288e2fe1d993aeb693dd7",
            "analyzerGitBlob": "ff35b44b004e407a1ce09e83828061325d0f9947",
            "referenceReadable": false,
            "professionalImageReadable": false,
            "analysisCompleted": false
          }
          EOF
          cat >> docs/checkpoints/CURRENT_STATE.md <<EOF

          ## V147 Phase E normalized-context addendum — ARMED / PRE-EXECUTION — 2026-08-27 UTC
          - Purpose: normalize Phase-E raw change counts by accepted-baseline denominators and characterize the 18 introduced pitch-collision onsets; no candidate construction.
          - Addendum prereg blob \`5e0dffcea24662c7b10288e2fe1d993aeb693dd7\`; analyzer blob \`ff35b44b004e407a1ce09e83828061325d0f9947\`.
          - Run \`${GITHUB_RUN_ID}\`; arming commit \`${GITHUB_SHA}\`; durable rerun sentinel committed before analysis.
          - Gold/reference/professional image unreadable; audio/HPSS/CQT/Modal/GPU unused; thresholds unchanged; analysis completed: **NO**.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/v147-phase-e-reference-free/normalized-context-attempt-sentinel.json docs/checkpoints/CURRENT_STATE.md
          git commit -m 'docs: checkpoint V147 Phase E normalized-context boundary'
          for attempt in 1 2 3 4 5; do
            git fetch origin v143-contextual-prune-lobo
            if git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo; then break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq 5 ]; then exit 91; fi
            sleep $((attempt * 2))
          done

      - name: Run normalized context analysis
        shell: bash
        run: |
          set -euo pipefail
          python validation/v147_phase_e/analyze_normalized_context.py \
            --v5 debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json \
            --candidate debug/v147-phase-c-real-audio/preserved-run-33038518285/candidate.json \
            --decisions debug/v147-phase-c-real-audio/preserved-run-33038518285/decisions.json \
            --output debug/v147-phase-e-reference-free/normalized-context-analysis.json \
            --markdown debug/v147-phase-e-reference-free/normalized-context-analysis.md | tee debug/v147-phase-e-reference-free/normalized-context-output.txt

      - name: Verify, checkpoint result, and self-seal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          result_path = Path('debug/v147-phase-e-reference-free/normalized-context-analysis.json')
          result = json.loads(result_path.read_text(encoding='utf-8'))
          assert result['classification'] == 'reference-free-normalized-context-diagnostic-no-candidate-construction'
          assert result['overall']['changedEventCount'] == 247
          assert result['collisionAnalysis']['introducedPitchCollisionOnsetCount'] == 18
          assert all(value is False for value in result['safety'].values())
          digest = hashlib.sha256(result_path.read_bytes()).hexdigest()
          result['persistence'] = {'resultSha256': digest, 'githubRunId': os.environ['GITHUB_RUN_ID']}
          result_path.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          result = json.loads(result_path.read_text(encoding='utf-8'))
          overall = result['overall']
          collisions = result['collisionAnalysis']
          regs = result['eventRates']['byOriginalRegister']
          pcs = result['eventRates']['byOriginalPitchClass']
          onset_events = result['eventRates']['byAcceptedOnsetSize']
          onset_rates = result['onsetRates']['byAcceptedOnsetSize']
          top_regs = sorted(regs, key=lambda row: row['rateRatioVsOverall'], reverse=True)
          top_pcs = sorted(pcs, key=lambda row: row['rateRatioVsOverall'], reverse=True)
          top_onsets = sorted(onset_events, key=lambda row: row['rateRatioVsOverall'], reverse=True)
          block = f'''\n## V147 Phase E normalized-context addendum — COMPLETE / SEALED — 2026-08-27 UTC
          - Reference-free denominator analysis completed in run `{os.environ['GITHUB_RUN_ID']}`.
          - Overall substitution rate: **{overall['changedEventCount']}/{overall['acceptedEventCount']} = {overall['eventChangeRate']*100:.2f}%**; changed-onset rate: **{overall['changedOnsetCount']}/{overall['acceptedOnsetCount']} = {overall['onsetChangeRate']*100:.2f}%**.
          - Highest register change-rate ratio: `{top_regs[0]['key']}` = {top_regs[0]['changed']}/{top_regs[0]['population']} ({top_regs[0]['changeRate']*100:.2f}%, {top_regs[0]['rateRatioVsOverall']:.2f}x overall).
          - Highest pitch-class change-rate ratio: PC `{top_pcs[0]['key']}` = {top_pcs[0]['changed']}/{top_pcs[0]['population']} ({top_pcs[0]['changeRate']*100:.2f}%, {top_pcs[0]['rateRatioVsOverall']:.2f}x overall).
          - Highest event onset-size change-rate ratio: `{top_onsets[0]['key']}` = {top_onsets[0]['changed']}/{top_onsets[0]['population']} ({top_onsets[0]['changeRate']*100:.2f}%, {top_onsets[0]['rateRatioVsOverall']:.2f}x overall).
          - Full event onset-size normalized rows: `{onset_events}`; onset-level normalized rows: `{onset_rates}`.
          - Introduced pitch collisions: **{collisions['introducedPitchCollisionOnsetCount']}**, {collisions['fractionOfChangedOnsets']*100:.2f}% of changed onsets and {collisions['fractionOfPolyphonicChangedOnsets']*100:.2f}% of polyphonic changed onsets.
          - Collision causes `{collisions['causeCounts']}`; directions `{collisions['directionCounts']}`; collision pitch-class transitions `{collisions['pitchClassTransitions']}`.
          - No Gold/reference/image/audio/HPSS/CQT/Modal/GPU/candidate construction/search/retuning/main/Production access occurred.
          - Phase E diagnosis is now complete. Do not construct V148 from these observations until a separate V148 hypothesis/preregistration is frozen.
          '''
          with Path('docs/checkpoints/CURRENT_STATE.md').open('a', encoding='utf-8') as handle:
              handle.write(block)
          sentinel_path = Path('debug/v147-phase-e-reference-free/normalized-context-attempt-sentinel.json')
          sentinel = json.loads(sentinel_path.read_text(encoding='utf-8'))
          sentinel['analysisCompleted'] = True
          sentinel['resultSha256'] = digest
          sentinel_path.write_text(json.dumps(sentinel, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/v147-phase-e-normalized-context-once.yml
          git add \
            debug/v147-phase-e-reference-free/normalized-context-attempt-sentinel.json \
            debug/v147-phase-e-reference-free/normalized-context-analysis.json \
            debug/v147-phase-e-reference-free/normalized-context-analysis.md \
            debug/v147-phase-e-reference-free/normalized-context-output.txt \
            docs/checkpoints/CURRENT_STATE.md
          git commit -m 'debug: persist V147 normalized context analysis'
          for attempt in 1 2 3 4 5; do
            git fetch origin v143-contextual-prune-lobo
            if git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 92
