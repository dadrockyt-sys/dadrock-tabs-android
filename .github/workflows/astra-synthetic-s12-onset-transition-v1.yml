name: Astra synthetic S12 onset-transition robustness v1

on:
  push:
    branches: [astra-work]
    paths:
      - 'docs/astra/SYNTHETIC_ONSET_ENVELOPE_S12_LAUNCH_V1.json'

permissions:
  contents: read
  actions: read

jobs:
  pilot:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'
      - name: Install runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
      - name: Verify and run frozen S12 package
        run: PYTHONPATH=astra_backend python astra_backend/synthetic/s12_workflow_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: astra-synthetic-onset-envelope-s12-v1
          path: /tmp/astra-s12-evidence
          if-no-files-found: error
          retention-days: 30
