name: Songsterr Fresh Preserve Workbench Summary Test Once

on:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-preserve-workbench-summary-test-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: songsterr-fresh-pipeline-v1
      - name: Exercise preservation helper fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/songsterr-fresh/preserve_codespaces_workbench_measurement.sh
          ROOT="$RUNNER_TEMP/workbench"
          mkdir -p "$ROOT/runs/fixture"
          cat > "$ROOT/runs/fixture/workbench-measurement-summary.json" <<'JSON'
          {
            "contract": "songsterr-fresh-codespaces-workbench-measurement-v2",
            "version": 2,
            "sourceCommit": "3faf16b740846ebd3106d81cb1cf1dcefe1001d5",
            "workbenchOnly": true,
            "authorityEligible": false,
            "probeAloneEnrollsAuthority": false,
            "modelValidationComplete": false,
            "mayAdvanceDelivery": false,
            "durationAuthorityChanged": false,
            "customerEligibleEvents": 0,
            "timingsSeconds": {"structure": 31, "demucs": 236, "basicPitch": 11, "total": 283},
            "resources": {"demucsMaximumResidentSetKb": "2492104", "basicPitchMaximumResidentSetKb": "396552"},
            "structureDiagnostics": {
              "referenceBlind": true,
              "structureFrozen": true,
              "structureAccepted": true,
              "authorityEligible": false
            },
            "identities": {
              "guitarStemSha256": "1111111111111111111111111111111111111111111111111111111111111111",
              "noteInferenceSha256": "2222222222222222222222222222222222222222222222222222222222222222",
              "activationBundleSha256": "3333333333333333333333333333333333333333333333333333333333333333",
              "decisionSurfaceSha256": "4444444444444444444444444444444444444444444444444444444444444444",
              "canonicalEvidenceSha256": "5555555555555555555555555555555555555555555555555555555555555555"
            }
          }
          JSON
          SONGSTERR_FRESH_WORKBENCH_ROOT="$ROOT" bash scripts/songsterr-fresh/preserve_codespaces_workbench_measurement.sh
          python - <<'PY'
          import json
          p='docs/checkpoints/SONGSTERR_FRESH_CODESPACES_WORKBENCH_MEASUREMENT_V2.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['authorityEligible'] is False
          assert d['modelValidationComplete'] is False
          assert d['customerEligibleEvents'] == 0
          assert d['durationAuthorityChanged'] is False
          assert d['contract'] == 'songsterr-fresh-codespaces-workbench-measurement-v2'
          print('PRESERVATION_HELPER_SELF_TEST_PASS')
          PY
