name: Add BTS homepage callout

on:
  push:
    branches:
      - bts-homepage-callout

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: bts-homepage-callout

      - name: Add Backing Track Studio callout before search
        shell: bash
        run: |
          python -c 'from pathlib import Path; import base64; p=Path("app/page.js"); text=p.read_text(); marker="          {/* Search Form with Gradient Border */}\n"; block=base64.b64decode("").decode(); assert "Backing Track Studio launch callout" not in text; assert marker in text; p.write_text(text.replace(marker, block + marker, 1))'

      - name: Commit homepage change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          if git diff --cached --quiet; then
            echo "No homepage changes to commit"
            exit 0
          fi
          git commit -m "Add BTS homepage launch callout"
          git push origin HEAD:bts-homepage-callout
