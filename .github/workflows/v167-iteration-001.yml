name: V167 calibration iteration 001 shared global phase

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v167-iteration-001.yml

permissions:
  contents: write

concurrency:
  group: v167-calibration-iteration-001-once
  cancel-in-progress: false

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: 48c62a3f7f677151e82530f504a5045672cadf45
  MANIFEST: debug/v167-single-song-calibration/calibration-manifest.json
  SOURCE_CANDIDATE: debug/v166-cpu-autonomous/generated.json
  PHASE_SWEEP: debug/v167-single-song-calibration/grid-phase-sweep.json
  TRANSFORM: validation/v167_single_song_calibration/apply_global_phase_v167.py
  DIAGNOSTIC: validation/v167_single_song_calibration/diagnose_v167.py
  SCORER: validation/v154_cpu_multitrack/score_frontend_reference.py
  REFERENCE: research/v154-professional-references/scorer-ready/frontend-reference-payload.json
  OUTPUT_CANDIDATE: debug/v167-single-song-calibration/iteration-001-generated.json
  OUTPUT_SCORE: debug/v167-single-song-calibration/iteration-001-score.json
  OUTPUT_DIAGNOSTIC: debug/v167-single-song-calibration/iteration-001-diagnostic.json
  OUTPUT_RECEIPT: debug/v167-single-song-calibration/iteration-001-receipt.json

jobs:
  calibrate:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact V167 iteration 001 arm
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify iteration identities
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v167-iteration-001.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"
          test "$(git hash-object "$MANIFEST")" = "8d6e9723e77e9ec2159e765436db2e9d91982fb2"
          test "$(git hash-object "$SOURCE_CANDIDATE")" = "c36a4d1e14ca66235b51a866ad3908322834efff"
          test "$(git hash-object "$PHASE_SWEEP")" = "6def13224adf3d2dcdc505e7d804a2dd104f0a86"
          test "$(git hash-object "$TRANSFORM")" = "9b13b65a2b4c9fd6a801afe50a0ecc153de56b3c"
          test "$(git hash-object "$DIAGNOSTIC")" = "04affbbf88b66264b0b7b2a4dedd27da5c55f632"
          test "$(git hash-object "$SCORER")" = "9644e65719fbd361a9b39778ae9950c5e983e855"
          test "$(git hash-object "$REFERENCE")" = "2fbed60b543c0488934d8642c488aa06bf31bbf5"
          for p in "$OUTPUT_CANDIDATE" "$OUTPUT_SCORE" "$OUTPUT_DIAGNOSTIC" "$OUTPUT_RECEIPT"; do test ! -e "$p"; done
          python - <<'PY'
          import json
          m=json.load(open('debug/v167-single-song-calibration/calibration-manifest.json'))
          s=json.load(open('debug/v167-single-song-calibration/grid-phase-sweep.json'))
          assert m['methodology']['label']=='SINGLE_SONG_TRAINING_CALIBRATION'
          assert m['methodology']['directReferenceCopyIntoCandidateForbidden'] is True
          assert s['combinedGuitar']['best']['shiftGridSteps']==-12
          assert s['bass']['best']['shiftGridSteps']==-12
          PY

      - name: Apply deterministic shared -12 phase transform
        shell: bash
        run: |
          set -euo pipefail
          python "$TRANSFORM" \
            --input "$SOURCE_CANDIDATE" \
            --output "$OUTPUT_CANDIDATE" \
            --shift -12 \
            --source-blob c36a4d1e14ca66235b51a866ad3908322834efff \
            --phase-sweep-blob 6def13224adf3d2dcdc505e7d804a2dd104f0a86

      - name: Score and diagnose iteration 001
        shell: bash
        run: |
          set -euo pipefail
          python "$DIAGNOSTIC" \
            --candidate "$OUTPUT_CANDIDATE" \
            --reference "$REFERENCE" \
            --scorer "$SCORER" \
            --score-output "$OUTPUT_SCORE" \
            --diagnostic-output "$OUTPUT_DIAGNOSTIC"
          python - <<'PY'
          import json
          d=json.load(open('debug/v167-single-song-calibration/iteration-001-diagnostic.json'))
          g=d['recognitionPercent']['combinedGuitar']
          b=d['recognitionPercent']['bass']
          assert abs(g-40.36021285304953) < 1e-9, g
          assert abs(b-70.60063224446786) < 1e-9, b
          print('Iteration 001 Guitar %',g)
          print('Iteration 001 Bass %',b)
          PY

      - name: Freeze iteration 001 and self-seal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def blob(path): return subprocess.check_output(['git','hash-object',path],text=True).strip()
          c=json.load(open('debug/v167-single-song-calibration/iteration-001-generated.json'))
          d=json.load(open('debug/v167-single-song-calibration/iteration-001-diagnostic.json'))
          assert c['calibration']['iteration']==1
          assert c['calibration']['transform']['shiftGridSteps']==-12
          assert c['calibration']['transform']['midiChanged'] is False
          assert c['calibration']['transform']['scoredEventCardinalityChanged'] is False
          receipt={
            'schema':'dadrock.tabs.v167.single-song-calibration-iteration-receipt.v1',
            'version':'V167','iteration':1,'status':'ITERATION_FROZEN',
            'label':'SINGLE_SONG_TRAINING_CALIBRATION',
            'workflowRunId':int(os.environ['GITHUB_RUN_ID']),
            'workflowRunNumber':int(os.environ['GITHUB_RUN_NUMBER']),
            'workflowRunAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'workflowHeadSha':os.environ['GITHUB_SHA'],
            'change':{'type':'shared_absolute_grid_phase','shiftGridSteps':-12},
            'recognitionPercent':d['recognitionPercent'],
            'artifacts':{
              'candidateGitBlob':blob('debug/v167-single-song-calibration/iteration-001-generated.json'),
              'candidateSha256':sha('debug/v167-single-song-calibration/iteration-001-generated.json'),
              'scoreGitBlob':blob('debug/v167-single-song-calibration/iteration-001-score.json'),
              'scoreSha256':sha('debug/v167-single-song-calibration/iteration-001-score.json'),
              'diagnosticGitBlob':blob('debug/v167-single-song-calibration/iteration-001-diagnostic.json'),
              'diagnosticSha256':sha('debug/v167-single-song-calibration/iteration-001-diagnostic.json')
            },
            'provenance':{
              'sourceCandidateGitBlob':'c36a4d1e14ca66235b51a866ad3908322834efff',
              'phaseSweepGitBlob':'6def13224adf3d2dcdc505e7d804a2dd104f0a86',
              'transformGitBlob':'9b13b65a2b4c9fd6a801afe50a0ecc153de56b3c',
              'diagnosticGitBlob':'04affbbf88b66264b0b7b2a4dedd27da5c55f632',
              'scorerGitBlob':'9644e65719fbd361a9b39778ae9950c5e983e855',
              'professionalReferenceGitBlob':'2fbed60b543c0488934d8642c488aa06bf31bbf5'
            },
            'policy':{
              'calibrationOnly':True,'referenceFacingScore':True,
              'transformReadProfessionalReference':False,'directReferenceCopy':False,
              'humanCorrection':False,'generalizationClaim':False,
              'gpuCudaModalUsed':False,'mainOrProductionModified':False
            }
          }
          Path('debug/v167-single-song-calibration/iteration-001-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          rm .github/workflows/v167-iteration-001.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- debug/v167-single-song-calibration .github/workflows/v167-iteration-001.yml
          changed="$(git diff --cached --name-only)"
          if echo "$changed" | grep -Ev '^debug/v167-single-song-calibration/(iteration-001-generated\.json|iteration-001-score\.json|iteration-001-diagnostic\.json|iteration-001-receipt\.json)$|^\.github/workflows/v167-iteration-001\.yml$'; then
            echo 'Unexpected V167 iteration 001 path' >&2
            exit 1
          fi
          git commit -m "research: freeze V167 calibration iteration 001 global phase [skip ci]"
          git push origin HEAD:"$BRANCH"
