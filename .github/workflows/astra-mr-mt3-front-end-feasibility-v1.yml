name: Astra MR-MT3 front-end feasibility v1
on:
  push:
    branches: [astra-work]
    paths: ['docs/astra/MR_MT3_FRONT_END_FEASIBILITY_LAUNCH_V1.json']
permissions: { contents: read }
concurrency: { group: astra-mr-mt3-front-end-feasibility-v1, cancel-in-progress: false }
jobs:
  evaluate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}" }
      - name: Require exact authorization
        run: |
          python - <<'PY'
          import json
          a=json.load(open('docs/astra/MR_MT3_FRONT_END_REAL_AUTHORIZATION_V1.json'))
          l=json.load(open('docs/astra/MR_MT3_FRONT_END_FEASIBILITY_LAUNCH_V1.json'))
          s=a['scope']
          assert s['p1MediaAccessAuthorized'] and s['p2MediaAccessAuthorized']
          assert s['exactCaptures']==8 and s['optimizerStepsAuthorized']==0
          assert s['modelMutationAuthorized'] is False
          assert s['confidenceThresholdSearchAuthorized'] is False
          assert s['acceptedProgramsZeroBased']=='24-31'
          assert s['acceptedPitchRange']=='40-83'
          assert s['maxCpuMinutes']==60 and s['checkpointDownloads']==1
          assert s['automaticRetries']==0 and s['paidComputeDollars']==0
          assert s['p3Authorized'] is False and l['singleLaunch'] is True
          PY
      - uses: actions/setup-python@v5
        with: { python-version: '3.10.15' }
      - name: Install frozen Astra preparation runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg unzip
      - name: Prepare exact eight captures and retain selected direct-input audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p1 /tmp/p2 /tmp/sel /tmp/audio
          printf '{' > /tmp/audio-map.json
          first=1
          while IFS=$'\t' read -r performer file bytes md5 sha capture; do
            rm -rf /tmp/sel/*
            curl --fail --location --connect-timeout 30 --max-time 1500 --user-agent 'Astra-MRMT3-StageA/1.0' -o "/tmp/$file" "https://zenodo.org/records/14963133/files/$file?download=1"
            test "$(stat -c '%s' "/tmp/$file")" = "$bytes"
            test "$(md5sum "/tmp/$file" | awk '{print $1}')" = "$md5"
            test "$(sha256sum "/tmp/$file" | awk '{print $1}')" = "$sha"
            if [ "$performer" = P1 ]; then
              PYTHONPATH=astra_backend:astra_backend/evaluation python astra_backend/tiny_fit_pilot_v1.py extract-selected-source --archive "/tmp/$file" --capture-key "$capture" --output-dir /tmp/sel
              PYTHONPATH=astra_backend:astra_backend/evaluation python astra_backend/tiny_fit_pilot_v1.py prepare-capture --root /tmp/sel --capture-key "$capture" --corrections docs/astra/GUITARTECHS_PRIMARY_ALIGNMENT_CORRECTIONS_V1.json --output-dir /tmp/p1
            else
              PYTHONPATH=astra_backend:astra_backend/evaluation python astra_backend/evaluation/cross_performer_screen_v1.py extract-selected-source --archive "/tmp/$file" --capture-key "$capture" --output-dir /tmp/sel
              PYTHONPATH=astra_backend:astra_backend/evaluation python astra_backend/evaluation/cross_performer_screen_v1.py prepare-capture --root /tmp/sel --capture-key "$capture" --corrections docs/astra/GUITARTECHS_PRIMARY_ALIGNMENT_CORRECTIONS_V1.json --output-dir /tmp/p2
            fi
            audio="$(find /tmp/sel/directinput -maxdepth 1 -type f \( -iname '*.wav' -o -iname '*.mp3' \) -print -quit)"
            test -n "$audio"
            safe="$(printf '%s' "$capture" | sha256sum | cut -c1-16)"
            ext="${audio##*.}"; dest="/tmp/audio/${safe}.${ext}"; cp "$audio" "$dest"
            if [ "$first" = 0 ]; then printf ',' >> /tmp/audio-map.json; fi
            python - "$capture" "$dest" >> /tmp/audio-map.json <<'PY'
          import json,sys
          print(json.dumps(sys.argv[1])+":"+json.dumps(sys.argv[2]),end="")
          PY
            first=0
            rm -f "/tmp/$file"
          done <<'EOF'
          P1	P1_chords.zip	981741162	be9ef8bbdceb1912d565254e607a6d94	de4aa76ef4b86ce981496161b741dc39bd22dec5250da351e5e68a44da249326	P1|chords|Drop3_7|directinput
          P1	P1_scales.zip	453349723	9c0b98e8fb42a522df727ea8bf545e4f	79d7e9d148820867a9095697c9521e40a4b11c198384edfce1951de7219b3509	P1|scales|Ab|directinput
          P1	P1_singlenotes.zip	108626613	ca0c4674dde3805574685a313f7c39eb	130592ae5555476ea8e4070c0f3421794ef8b5e252dfa780745d07eedd0eb4a4	P1|singlenotes|allsinglenotes|directinput
          P1	P1_techniques.zip	326280863	18634a41a6db5a8de10d07eb3122a872	1e4b80a464182d345e129f3e1158b6c05690c60b5f9be4bde3fb26f23263236e	P1|techniques|PalmMute|directinput
          P2	P2_chords.zip	1150819056	eb6f74dd19162237189281688ad7ad2e	9d4a46261cc840d6a66412ad0ebffcfba1fbce579bec0205127190b7bd7a4bce	P2|chords|Drop3_7|directinput
          P2	P2_scales.zip	471254783	96664853872f51e5f8aa4447313b7cf5	d5efc7134764bd8124a712fd301d020d143a6e589eb8e1f2e0ddcbf94524ff17	P2|scales|Ab|directinput
          P2	P2_singlenotes.zip	116133457	40fbf03d8b04bb2cf42df20f36dc2254	d6b54e40d22113d6c0a663165cb2af63735897a35bb45fc6d0ed49c944b548d9	P2|singlenotes|allsinglenotes|directinput
          P2	P2_techniques.zip	395839610	f4189251ce50be25f06a173b2c2bba00	05fc065c010add9e5348095d7198fdc45b967c657e3e12ef8afdb74808371816	P2|techniques|PalmMute|directinput
          EOF
          printf '}' >> /tmp/audio-map.json
          python -m json.tool /tmp/audio-map.json >/dev/null
      - name: Install exact mt3-infer release in isolated venv
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/mt3venv
          /tmp/mt3venv/bin/pip install --disable-pip-version-check 'pip==24.0'
          /tmp/mt3venv/bin/pip download --no-deps --only-binary=:all: 'mt3-infer==0.2.0' -d /tmp
          wheel="$(find /tmp -maxdepth 1 -name 'mt3_infer-0.2.0-*.whl' -print -quit)"
          test "$(sha256sum "$wheel" | awk '{print $1}')" = "95209657fafab7eda0e5187f5fb9ae3438a18e2a4e30acd4786f3cda25389ff4"
          /tmp/mt3venv/bin/pip install --disable-pip-version-check "$wheel" \
            'transformers==4.57.5' 'torch==2.7.1' 'torchaudio==2.7.1' 'torchvision==0.22.1'
          /tmp/mt3venv/bin/python - <<'PY'
          import mt3_infer,torch,torchaudio,torchvision,transformers
          assert mt3_infer.__version__=='0.2.0'
          assert transformers.__version__=='4.57.5'
          assert torch.__version__.split('+')[0]=='2.7.1'
          assert torchaudio.__version__.split('+')[0]=='2.7.1'
          assert torchvision.__version__.split('+')[0]=='0.22.1'
          PY
      - name: Download and verify immutable MR-MT3 checkpoint once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mt3_models/mr_mt3
          curl --fail --location --connect-timeout 30 --max-time 900 -o /tmp/mt3_models/mr_mt3/mt3.pth 'https://huggingface.co/gudgud1014/MR-MT3/resolve/539c08b0fe551076db6108a5f5b2a57d774881ed/mt3.pth?download=true'
          test "$(stat -c '%s' /tmp/mt3_models/mr_mt3/mt3.pth)" = "183672643"
          test "$(sha256sum /tmp/mt3_models/mr_mt3/mt3.pth | awk '{print $1}')" = "b8a3807ed265059abd25ad7f68142c06c35e8f6144dcaa45bd55946a3745398f"
      - name: Run frozen MR-MT3 inference on exactly eight selected audios
        shell: bash
        env:
          MT3_CHECKPOINT_DIR: /tmp/mt3_models
        run: |
          set -euo pipefail
          mkdir -p /tmp/midi
          printf '{' > /tmp/midi-map.json
          first=1
          python - <<'PY' >/tmp/audio-map.tsv
          import json
          x=json.load(open('/tmp/audio-map.json'))
          for k in sorted(x): print(k+'\t'+x[k])
          PY
          while IFS=$'\t' read -r capture audio; do
            safe="$(printf '%s' "$capture" | sha256sum | cut -c1-16)"
            out="/tmp/midi/${safe}.mid"
            /tmp/mt3venv/bin/mt3-infer transcribe "$audio" -o "$out" -m mr_mt3 -d cpu --no-download
            test -s "$out"
            if [ "$first" = 0 ]; then printf ',' >> /tmp/midi-map.json; fi
            python - "$capture" "$out" >> /tmp/midi-map.json <<'PY'
          import json,sys
          print(json.dumps(sys.argv[1])+":"+json.dumps(sys.argv[2]),end="")
          PY
            first=0
          done </tmp/audio-map.tsv
          printf '}' >> /tmp/midi-map.json
          python -m json.tool /tmp/midi-map.json >/dev/null
      - name: Run frozen guitar projection and Stage-A scoring
        run: |
          python -m pip install --disable-pip-version-check 'mido==1.3.3'
          PYTHONPATH=astra_backend:astra_backend/evaluation python astra_backend/evaluation/mr_mt3_front_end_real_v1.py \
            --p1-dir /tmp/p1 --p2-dir /tmp/p2 --audio-map /tmp/audio-map.json \
            --midi-map /tmp/midi-map.json --checkpoint /tmp/mt3_models/mr_mt3/mt3.pth \
            --out /tmp/result.json
      - name: Verify hard boundaries
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/result.json')); e=x['execution']; f=x['frontEnd']
          assert e['optimizerStepsExecuted']==0 and e['thresholdSearchExecuted'] is False
          assert e['modelMutation'] is False and e['automaticRetry'] is False and e['p3Opened'] is False
          assert f['checkpointSha256']=='b8a3807ed265059abd25ad7f68142c06c35e8f6144dcaa45bd55946a3745398f'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astra-mr-mt3-front-end-feasibility-v1
          path: /tmp/result.json
          retention-days: 30
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/p1 /tmp/p2 /tmp/sel /tmp/audio /tmp/midi /tmp/mt3_models /tmp/mt3venv /tmp/audio-map.json /tmp/audio-map.tsv /tmp/midi-map.json /tmp/P1_*.zip /tmp/P2_*.zip /tmp/mt3_infer-*.whl
