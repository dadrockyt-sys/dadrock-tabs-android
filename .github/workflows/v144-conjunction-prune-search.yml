name: V144 Rhythm Conjunction Prune Search — Archived

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    name: Refuse replay of consumed calibration search
    runs-on: ubuntu-latest
    steps:
      - name: Historical protocol guard
        shell: bash
        run: |
          echo 'This V144 conjunction candidate family is historical and consumed.' >&2
          echo 'Use the persisted split report at debug/v144-rhythm-calibration/candidates/conjunction-prune-search.json.' >&2
          echo 'Its split selection was superseded by the full-gold invariant result.' >&2
          echo 'Do not rerun/reselect this family from later-stage evidence.' >&2
          exit 1
