name: V144 Current Pitch-Position Baseline Fit Diagnostic

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v144-current-pitch-position-fit-diagnostic.yml

permissions:
  contents: write

concurrency:
  group: v144-current-pitch-position-baseline-fit-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: "${{ github.event.head_commit.message == 'v144 execute current pitch-position baseline fit diagnostic' }}"
    name: Diagnose current pitch-position baseline fit mechanisms on CPU
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify immutable inputs and diagnostic-only implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          test "$(git hash-object debug/v143-contextual-prune/v5-professional-pdf/final-professional-holdout-result.json)" = "511fd244f231b66d08306f97b5a47ed41f5415c7"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json | awk '{print $1}')" = "7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2"
          test "$(sha256sum debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json | awk '{print $1}')" = "18fd868ae960dfcdd1ffb0110f1a9dfd8acc2ffeb46e247d1116cd54291526ac"
          test "$(git hash-object debug/v144-rhythm-calibration/selected/v144-pitch-position-selected-baseline.json)" = "45287a40fbbe88f411d2eca7db3cce072174eda8"
          test "$(git hash-object validation/v144_rhythm_calibration/analyze_current_baseline_fit_mechanisms.py)" = "7b6b0e51e1f0b8cfb69f7c0019845b7dbea74755"
          test "$(git hash-object modal/tests/test_v144_rhythm_current_baseline_fit_mechanisms.py)" = "e32a76b050d34761fdee3dd29f7115076ac90cf9"
          python -m py_compile validation/v144_rhythm_calibration/analyze_current_baseline_fit_mechanisms.py
          python modal/tests/test_v144_rhythm_current_baseline_fit_mechanisms.py -v

      - name: Run fit-only mechanism diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python validation/v144_rhythm_calibration/analyze_current_baseline_fit_mechanisms.py \
            debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json \
            debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json \
            debug/v144-rhythm-calibration/selected/v144-pitch-position-selected-baseline.json \
            modal/configs/v144_rhythm_context_split_config.json \
            debug/v144-rhythm-calibration/diagnostics/current-pitch-position-baseline-fit-mechanisms.json \
            > /tmp/v144-current-pitch-position-fit-diagnostic.log

      - name: Verify diagnostic isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('debug/v144-rhythm-calibration/diagnostics/current-pitch-position-baseline-fit-mechanisms.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          assert report['classification'] == 'v144-rhythm-current-baseline-fit-error-mechanisms'
          assert report['evaluationRole'] == 'gold-calibration-fit-only-current-baseline-mechanism-diagnostic'
          assert report['mayClaimUnseenGeneralization'] is False
          assert report['candidateConstructionPerformed'] is False
          assert report['candidateRankingPerformed'] is False
          assert report['candidateSelectionPerformed'] is False
          assert report['validationLabelsUsedForDiagnostic'] is False
          assert report['canaryLabelsUsedForDiagnostic'] is False
          baseline = report['baseline']
          assert baseline['name'] == 'pitch-position-shift-54a6e8d3aa91c422'
          assert baseline['eventCount'] == 1144
          assert baseline['eventSha256'] == '5b36270aaeafa73b2e25722e2576a40424ce5951dcfd2b5d769746bd9eb07e0d'
          assert baseline['generatedMeasureCount'] == 113
          assert baseline['baselineGeneratedMeasureSetPreserved'] is True
          assert len(baseline['reconstructionChain']) == 3
          assert report['constructionBoundary']['currentBaselineFitLabelsMayInformNextFamilyShape'] is True
          assert report['constructionBoundary']['validationLabelsMayInformNextFamilyShape'] is False
          assert report['constructionBoundary']['canaryLabelsMayInformNextFamilyShape'] is False
          assert report['constructionBoundary']['consumedFamiliesMayBeReplayedOrRetuned'] is False
          assert report['constructionBoundary']['runtimeReferenceInputAllowed'] is False
          assert report['constructionBoundary']['fixedSelectorThresholdsMayBeChangedFromThisDiagnostic'] is False
          assert report['constructionBoundary']['nextFamilyMustBeMateriallyNewAndPreRegistered'] is True
          assert report['safety']['v5Modified'] is False
          assert report['safety']['mainModified'] is False
          assert report['safety']['productionModified'] is False
          assert report['safety']['runtimeReferenceInputUsed'] is False
          assert report['safety']['modalGpuInvoked'] is False
          PY

      - name: Reverify frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          test "$(git hash-object debug/v143-contextual-prune/v5-professional-pdf/final-professional-holdout-result.json)" = "511fd244f231b66d08306f97b5a47ed41f5415c7"
          test "$(git hash-object debug/v144-rhythm-calibration/selected/v144-pitch-position-selected-baseline.json)" = "45287a40fbbe88f411d2eca7db3cce072174eda8"

      - name: Persist only diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          report='debug/v144-rhythm-calibration/diagnostics/current-pitch-position-baseline-fit-mechanisms.json'
          git add "$report"
          test "$(git diff --cached --name-only)" = "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Persist V144 current pitch-position fit diagnostic'
          for attempt in 1 2 3 4 5; do
            git fetch origin v143-contextual-prune-lobo
            if git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
