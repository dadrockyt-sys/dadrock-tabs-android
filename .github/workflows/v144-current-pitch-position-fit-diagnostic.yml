name: V144 Current Pitch-Position Baseline Fit Diagnostic — Archived

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    name: Refuse replay of consumed current-baseline fit diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: Refuse replay
        run: |
          echo "This fit-only current-baseline diagnostic is consumed and may not be replayed."
          exit 1
