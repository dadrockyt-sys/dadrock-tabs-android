name: Songsterr Fresh Record Trace Comparison Once

on:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-record-trace-comparison-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  compare-and-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out fresh branch
        uses: actions/checkout@v4
        with:
          ref: songsterr-fresh-pipeline-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download proven exact replay traces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/songsterr/replay /tmp/songsterr/out
          gh run download 34550328840 -n songsterr-fresh-decoder-replay-followup -D /tmp/songsterr/replay

      - name: Compare A B C decoder traces
        run: |
          python scripts/songsterr-fresh/compare_basic_pitch_decoder_traces.py /tmp/songsterr/replay/trace-a.json /tmp/songsterr/replay/trace-b.json --output /tmp/songsterr/out/trace-comparison-ab.json
          python scripts/songsterr-fresh/compare_basic_pitch_decoder_traces.py /tmp/songsterr/replay/trace-a.json /tmp/songsterr/replay/trace-c.json --output /tmp/songsterr/out/trace-comparison-ac.json
          python scripts/songsterr-fresh/compare_basic_pitch_decoder_traces.py /tmp/songsterr/replay/trace-b.json /tmp/songsterr/replay/trace-c.json --output /tmp/songsterr/out/trace-comparison-bc.json

      - name: Update canonical checkpoint and next steps
        env:
          RECORD_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          cp = Path('docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md')
          text = cp.read_text(encoding='utf-8')
          reports = {pair: json.loads(Path(f'/tmp/songsterr/out/trace-comparison-{pair}.json').read_text()) for pair in ('ab', 'ac', 'bc')}
          def summary(pair):
              m = reports[pair]['measurement']
              s = m['semanticInventory']
              d = m['decoderMechanism']
              v = m['commonEventVariation']
              return {
                  'common': s['commonPairedEventCount'],
                  'unmatched': s['unmatchedSemanticEventCount'],
                  'mechanismMismatch': d['commonMechanismMismatchCount'],
                  'startDifferent': v['decoderStartFrameDelta']['differentCount'],
                  'startMax': v['decoderStartFrameDelta']['maxAbsolute'],
                  'endDifferent': v['decoderEndFrameDelta']['differentCount'],
                  'endMax': v['decoderEndFrameDelta']['maxAbsolute'],
                  'sourceMax': v['sourceStartSecondsDelta']['maxAbsolute'],
                  'modelEndMax': v['diagnosticModelEndSecondsDelta']['maxAbsolute'],
                  'activationMax': v['noteSpanMeanActivationDelta']['maxAbsolute'],
              }
          ab = summary('ab')
          ac = summary('ac')
          bc = summary('bc')
          section_lines = [
              '## DECODER TRACE COMPARISON — IMPLEMENTED / REAL A-B-C MEASURED',
              '',
              '- `scripts/songsterr-fresh/compare_basic_pitch_decoder_traces.py`, contract `songsterr-fresh-basic-pitch-decoder-trace-comparison-v1`, commit `6a752b820db3e572ce23167f346954b80123de6b`.',
              '- Reference-blind, argument-order invariant, measurement-only, and fail-closed unless each input trace declares exact evidence replay plus all non-promotion guards. It compares semantic inventory, common-event decoder mechanism, and decoder frame-span variation; observed values cannot become admission tolerances.',
              '- Focused CI wiring commit `ce9f28b9ae4ecb5bc60331349f4e70ff2a6f8442`; run `34550527914`, job `103112287283`, success.',
              f"- Real trace comparison execution run `{os.environ['RECORD_RUN_ID']}` reused exact traces from replay artifact `10180559766` (`sha256:46f918d841c86f3c15c3c2177791d95fb0e414cd3a52196cd34625e490cb49e4`); no model rerun.",
              f"- A/B: {ab['common']} common paired events, {ab['unmatched']} unmatched semantic event, {ab['mechanismMismatch']} common mechanism mismatches; decoder-start differs for {ab['startDifferent']} common event (max {ab['startMax']} frames), decoder-end differs for {ab['endDifferent']} (max {ab['endMax']} frames). Max common source-start delta `{ab['sourceMax']}` s; diagnostic model-end delta `{ab['modelEndMax']}` s; note-span mean-activation delta `{ab['activationMax']}`.",
              f"- A/C: {ac['common']} common paired events, {ac['unmatched']} unmatched, {ac['mechanismMismatch']} mechanism mismatches; start/end different counts {ac['startDifferent']}/{ac['endDifferent']} with maxima {ac['startMax']}/{ac['endMax']} frames. A and C remain exact at trace level.",
              f"- B/C matches the A/B pattern: {bc['common']} common, {bc['unmatched']} unmatched, {bc['mechanismMismatch']} common mechanism mismatches; start/end maxima {bc['startMax']}/{bc['endMax']} frames.",
              '- Mechanism identity is stable for every common A/B/C semantic event in this sample. The only semantic inventory instability remains the B-only MIDI-55 threshold-onset event; this does not justify an admission band around 0.5.',
              '',
          ]
          section = '\n'.join(section_lines) + '\n'
          acceptance = '## CURRENT ACCEPTANCE STATE\n'
          section_heading = '## DECODER TRACE COMPARISON — IMPLEMENTED / REAL A-B-C MEASURED\n'
          if section_heading in text:
              start = text.index(section_heading)
              end = text.index(acceptance, start)
              text = text[:start] + section + text[end:]
          else:
              text = text.replace(acceptance, section + acceptance, 1)
          next_heading = '## FRESH-CHAT NEXT ENGINEERING STEPS\n'
          archive_marker = 'The archived V143/Gomyway pipeline remains out of scope unless explicitly requested.'
          next_lines = [
              '## FRESH-CHAT NEXT ENGINEERING STEPS',
              '',
              '1. Treat the A/B/C decision-surface inspection, exact decoder replay, and decoder-trace comparison as completed evidence. Do not rerun them merely to rediscover the current sample.',
              '2. Keep `modelValidationComplete:false`, customer-eligible events at 0, and duration research paused. The B-only MIDI-55 event is a proven `threshold-onset-pass` toggle around the fixed Basic Pitch onset threshold, but its observed margins and the 7/20-frame common-event span drift are measurement evidence only.',
              '3. Integrate exact decoder traces and pairwise decoder-trace comparisons into the decision-enabled cross-run measurement canary so future independent observations automatically preserve mechanism-level evidence. Keep this integration diagnostic-only and non-promotional.',
              '4. Before proposing any onset-boundary admission rule, look for an independent reference-blind justification for a decision uncertainty boundary. Do not derive a tolerance from the current observed margins, matrix maxima, frame spacing, CPU/vendor grouping, event frequency, or downstream agreement.',
              '5. If no independent bound exists, record that Policy B still lacks a justified admission contract for threshold-boundary inventory toggles. Do not manufacture one from more samples alone.',
              '6. If additional independent observations are later collected, use the existing frozen settings and automatic trace-comparison path; treat them as measurement/history evidence, not as a way to tune thresholds to this fixture.',
              '7. Keep the archived V143/Gomyway implementation/reference/pro scorer path out of scope and keep V2/V3 duration work paused until upstream model-evidence validation is actually resolved.',
              '',
          ]
          new_next = '\n'.join(next_lines) + '\n'
          if next_heading not in text or archive_marker not in text:
              raise SystemExit('checkpoint next-step markers missing; fail closed')
          start = text.index(next_heading)
          end = text.index(archive_marker, start)
          text = text[:start] + new_next + text[end:]
          stamp = datetime.now(ZoneInfo('America/Toronto')).strftime('%Y-%m-%d %H:%M America/Toronto')
          lines = text.splitlines()
          for index, line in enumerate(lines):
              if line.startswith('Updated: '):
                  lines[index] = f'Updated: {stamp}'
                  break
          cp.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit checkpoint and remove helper
        run: |
          rm .github/workflows/songsterr-fresh-record-trace-comparison-once.yml
          git config user.name 'dadrockyt-sys'
          git config user.email 'Stephen.s.mcnally@gmail.com'
          git add docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md .github/workflows/songsterr-fresh-record-trace-comparison-once.yml
          git commit -m 'docs: record real decoder trace comparison evidence'
          git push origin HEAD:songsterr-fresh-pipeline-v1

      - name: Upload real trace comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songsterr-fresh-decoder-trace-comparisons
          path: /tmp/songsterr/out
          if-no-files-found: warn
          retention-days: 14
