name: V144 Singleton Baseline FIT Residual Diagnostic One-Shot

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - debug/v144-rhythm-calibration/diagnostics/.singleton-baseline-fit-residual-trigger

permissions:
  contents: write

concurrency:
  group: v144-singleton-baseline-fit-residual-diagnostic-one-shot
  cancel-in-progress: false

jobs:
  diagnostic:
    if: "${{ github.event.head_commit.message == 'v144 execute singleton baseline fit residual diagnostic one-shot' }}"
    name: Accepted singleton baseline FIT aggregate residual diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact trigger revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact trigger and immutable diagnostic identities before labels
        shell: bash
        run: |
          set -euo pipefail
          trigger='debug/v144-rhythm-calibration/diagnostics/.singleton-baseline-fit-residual-trigger'
          report='debug/v144-rhythm-calibration/diagnostics/singleton-baseline-fit-residuals.json'
          test "$(git log -1 --format=%s)" = 'v144 execute singleton baseline fit residual diagnostic one-shot'
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "${changed}" = "${trigger}"
          test ! -e "${report}"

          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          test "$(git hash-object debug/v143-contextual-prune/v5-professional-pdf/final-professional-holdout-result.json)" = "511fd244f231b66d08306f97b5a47ed41f5415c7"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json | awk '{print $1}')" = "7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-rhythm-shadow.pdf | awk '{print $1}')" = "f4c1238e868cadfb90b8a359b1555b0b90e7740b9ebaa276aa394c8991f37ce5"
          test "$(sha256sum debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json | awk '{print $1}')" = "18fd868ae960dfcdd1ffb0110f1a9dfd8acc2ffeb46e247d1116cd54291526ac"

          test "$(git hash-object debug/v144-rhythm-calibration/selected/v144-singleton-onset-replacement-selected-baseline.json)" = "acd12ab68ad16b8faabf38ddc9e1cc0c1e7c4b68"
          test "$(git hash-object validation/v144_rhythm_calibration/analyze_singleton_baseline_fit_residuals.py)" = "27ac8699279db8fc0208d067479ad3751da1a630"
          test "$(git hash-object modal/tests/test_v144_rhythm_singleton_baseline_fit_residual_diagnostic.py)" = "6d45faeb70d1ed99de0d57161fa061e12b7f0a2f"
          test "$(git hash-object modal/tests/test_v144_rhythm_singleton_selected_baseline_reconstruction.py)" = "e6acdd8b49dc6d87f04f7cf89367c97a3ca49041"
          test "$(git hash-object validation/v144_rhythm_calibration/search_atomic_singleton_onset_replacements.py)" = "70880d26418d907cc702233af37bcc4b643e3a57"
          test "$(git hash-object modal/v144_rhythm_singleton_onset_replacement_policy.py)" = "1e05e66a3523f98944370837a59e5d6e7293f9ac"
          test "$(git hash-object validation/v144_rhythm_calibration/analyze_current_baseline_fit_mechanisms.py)" = "7b6b0e51e1f0b8cfb69f7c0019845b7dbea74755"
          test "$(git hash-object validation/v144_rhythm_calibration/analyze_current_baseline_fit_onset_topology.py)" = "b4ddb289e2e0e54177e51e1b4ff1140dd304ed46"
          test "$(git hash-object validation/v144_rhythm_calibration/analyze_split_baseline.py)" = "1569bf01554be345ca9199a85f700db7743501a5"
          test "$(git hash-object validation/rhythm_holdout/canonical.py)" = "088d44827fb23e20d9aeeb4944a672989af5846c"
          test "$(git hash-object validation/rhythm_holdout/score_rhythm_holdout.py)" = "cc4bf61a99f22bf87a6c255e5a81220fbc82223b"
          test "$(git hash-object modal/v144_rhythm_triple_conjunction_policy.py)" = "ef9768a127472d7ce0746fdf21164d33e5117ea4"
          test "$(git hash-object modal/v144_rhythm_pitch_shift_policy.py)" = "d9998c59acddba070069668d62bcb1c3cdaf2b05"
          test "$(git hash-object modal/v144_rhythm_pitch_position_shift_policy.py)" = "f69755b61bdcdf3a669847ce7e425289b4b0927f"
          test "$(git hash-object modal/v144_rhythm_staged_selector.py)" = "d176a9a69366e192e6fa75bc1039661e977f0bfa"
          test "$(git hash-object modal/v144_rhythm_measure_set_guard.py)" = "4a1364204dd1e720c09d835ec3995c165047de98"
          test "$(git hash-object modal/v144_rhythm_context_split_policy.py)" = "2da58508f2132660ad317ee63d5cb043d58285f0"
          test "$(git hash-object modal/configs/v144_rhythm_context_split_config.json)" = "9b93205cb47bc7718685b9d41b263778107801ce"

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          trigger = json.loads(Path('debug/v144-rhythm-calibration/diagnostics/.singleton-baseline-fit-residual-trigger').read_text(encoding='utf-8'))
          assert trigger['classification'] == 'v144-singleton-baseline-fit-residual-diagnostic-one-shot-trigger'
          assert trigger['baselineName'] == 'singleton-onset-replace-be9e9aa7a734e3cd'
          assert trigger['baselineEventSha256'] == '4e6f9f247134f79f30a5448515c52a6ca1012c1f1314c3458b448582999e3881'
          assert trigger['acceptedManifestBlob'] == 'acd12ab68ad16b8faabf38ddc9e1cc0c1e7c4b68'
          assert trigger['diagnosticBlob'] == '27ac8699279db8fc0208d067479ad3751da1a630'
          assert trigger['diagnosticTestBlob'] == '6d45faeb70d1ed99de0d57161fa061e12b7f0a2f'
          assert trigger['preLabelCpuRunId'] == 32996550172
          assert trigger['preLabelCpuJobId'] == 98267233982
          assert trigger['candidateConstructionAllowed'] is False
          assert trigger['candidateRankingAllowed'] is False
          assert trigger['candidateSelectionAllowed'] is False
          assert trigger['validationLabelsAllowed'] is False
          assert trigger['canaryLabelsAllowed'] is False
          assert trigger['runtimeReferenceAllowed'] is False
          assert trigger['modalGpuAllowed'] is False
          assert trigger['replayAllowed'] is False
          workflow_blob = subprocess.check_output(['git', 'hash-object', '.github/workflows/v144-singleton-baseline-fit-residual-diagnostic.yml'], text=True).strip()
          assert trigger['oneShotWorkflowBlob'] == workflow_blob
          PY

          python -m py_compile validation/v144_rhythm_calibration/analyze_singleton_baseline_fit_residuals.py
          python modal/tests/test_v144_rhythm_singleton_baseline_fit_residual_diagnostic.py -v
          python modal/tests/test_v144_rhythm_singleton_selected_baseline_reconstruction.py -v

      - name: Run accepted-singleton FIT aggregate diagnostic exactly once
        shell: bash
        run: |
          set -euo pipefail
          python validation/v144_rhythm_calibration/analyze_singleton_baseline_fit_residuals.py \
            debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json \
            debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json \
            debug/v144-rhythm-calibration/selected/v144-singleton-onset-replacement-selected-baseline.json \
            modal/configs/v144_rhythm_context_split_config.json \
            debug/v144-rhythm-calibration/diagnostics/singleton-baseline-fit-residuals.json \
            > /tmp/v144-singleton-fit-residuals.log

      - name: Verify aggregate-only diagnostic contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('debug/v144-rhythm-calibration/diagnostics/singleton-baseline-fit-residuals.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          assert report['schemaVersion'] == 14422
          assert report['classification'] == 'v144-rhythm-singleton-baseline-fit-residual-topology-mechanisms'
          assert report['evaluationRole'] == 'gold-calibration-fit-only-accepted-singleton-baseline-aggregate-diagnostic'
          assert report['mayClaimUnseenGeneralization'] is False
          assert report['candidateConstructionPerformed'] is False
          assert report['candidateRankingPerformed'] is False
          assert report['candidateSelectionPerformed'] is False
          assert report['candidateRuleOrShiftHistogramEmitted'] is False
          assert report['validationLabelsUsedForDiagnostic'] is False
          assert report['canaryLabelsUsedForDiagnostic'] is False

          baseline = report['baseline']
          assert baseline['name'] == 'singleton-onset-replace-be9e9aa7a734e3cd'
          assert baseline['eventCount'] == 1144
          assert baseline['eventSha256'] == '4e6f9f247134f79f30a5448515c52a6ca1012c1f1314c3458b448582999e3881'
          assert baseline['generatedMeasureCount'] == 113
          assert baseline['changedEventCountFromPriorBaseline'] == 110
          assert baseline['referenceFreeReconstructionBeforeLabels'] is True

          fit = report['fit']
          assert fit['generatedNoteCount'] == 643
          assert fit['referenceNoteCount'] == 594
          assert isinstance(fit['topology'], dict)
          assert isinstance(fit['cardinalityPairs'], dict)
          assert isinstance(fit['mechanisms'], dict)

          boundary = report['interpretationBoundary']
          assert boundary['aggregateFitResidualsOnly'] is True
          assert boundary['mayInformMateriallyDistinctFamilyUnit'] is True
          assert boundary['mayRankSpecificRuleOrShift'] is False
          assert boundary['validationMayInformFamilyShape'] is False
          assert boundary['canaryMayInformFamilyShape'] is False
          assert boundary['consumedFamilyResultsMayInformFamilyShape'] is False
          assert boundary['fixedSelectorThresholdsMayChange'] is False
          assert boundary['runtimeReferenceInputAllowed'] is False

          safety = report['safety']
          assert safety['v5Modified'] is False
          assert safety['mainModified'] is False
          assert safety['productionModified'] is False
          assert safety['runtimeReferenceInputUsed'] is False
          assert safety['modalGpuInvoked'] is False

          serialized = path.read_text(encoding='utf-8')
          for forbidden in ('"contextSignature"', '"sourceStringIndex"', '"sourcePitchClass"', '"targetStringIndex"', '"semitoneShift"', '"candidateName"'):
              assert forbidden not in serialized
          PY

      - name: Recheck protected identities after FIT read
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          test "$(git hash-object debug/v143-contextual-prune/v5-professional-pdf/final-professional-holdout-result.json)" = "511fd244f231b66d08306f97b5a47ed41f5415c7"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json | awk '{print $1}')" = "7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2"
          test "$(git hash-object debug/v144-rhythm-calibration/selected/v144-singleton-onset-replacement-selected-baseline.json)" = "acd12ab68ad16b8faabf38ddc9e1cc0c1e7c4b68"

      - name: Persist only aggregate diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          report='debug/v144-rhythm-calibration/diagnostics/singleton-baseline-fit-residuals.json'
          test -f "${report}"
          git status --short
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -v "^${report}$" || true)"
          test -z "${unexpected}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${report}"
          test "$(git diff --cached --name-only)" = "${report}"
          git commit -m 'v144: persist singleton baseline fit residual diagnostic'
          git push origin HEAD:v143-contextual-prune-lobo
