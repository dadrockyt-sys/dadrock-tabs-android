name: V147 Phase A CPU Proof

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v147-phase-a-cpu-proof.yml

permissions:
  contents: read

jobs:
  cpu-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen branch state
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU test dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest

      - name: Run frozen V147 tests and generated proof
        id: proof
        shell: bash
        run: |
          mkdir -p debug/v147-pitch-hypothesis
          set +e
          python -m pytest -q modal/tests/test_v147_pitch_hypothesis.py 2>&1 | tee debug/v147-pitch-hypothesis/pytest-output.txt
          pytest_status=${PIPESTATUS[0]}
          python -m modal.v147_pitch_hypothesis_cpu_proof --output debug/v147-pitch-hypothesis/cpu-generated-proof.json 2>&1 | tee debug/v147-pitch-hypothesis/proof-output.txt
          proof_status=${PIPESTATUS[0]}
          set -e

          export PYTEST_STATUS="$pytest_status"
          export PROOF_STATUS="$proof_status"
          export RUNNER_OS_VALUE="$RUNNER_OS"
          export RUNNER_ARCH_VALUE="$RUNNER_ARCH"
          export GITHUB_SHA_VALUE="$GITHUB_SHA"
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          import numpy
          import pytest

          root = Path('.')
          proof_path = root / 'debug/v147-pitch-hypothesis/cpu-generated-proof.json'
          proof_bytes = proof_path.read_bytes() if proof_path.exists() else b''

          def git_blob(path: str) -> str:
              return subprocess.check_output(['git', 'hash-object', path], text=True).strip()

          runtime = {
              'schema': 14702,
              'phase': 'V147-Phase-A',
              'evidenceClass': 'github-actions-cpu-generated-reference-free',
              'commitSha': os.environ['GITHUB_SHA_VALUE'],
              'runnerOs': os.environ['RUNNER_OS_VALUE'],
              'runnerArch': os.environ['RUNNER_ARCH_VALUE'],
              'pythonVersion': platform.python_version(),
              'numpyVersion': numpy.__version__,
              'pytestVersion': pytest.__version__,
              'pytestExitCode': int(os.environ['PYTEST_STATUS']),
              'proofExitCode': int(os.environ['PROOF_STATUS']),
              'proofFileSha256': hashlib.sha256(proof_bytes).hexdigest() if proof_bytes else None,
              'implementationBlob': git_blob('modal/v147_pitch_hypothesis.py'),
              'testsBlob': git_blob('modal/tests/test_v147_pitch_hypothesis.py'),
              'proofHarnessBlob': git_blob('modal/v147_pitch_hypothesis_cpu_proof.py'),
              'referenceFree': True,
              'calibrationReferenceRead': False,
              'goldRead': False,
              'modalGpuUsed': False,
              'liveAudioUsed': False,
              'productionIntegrated': False,
          }
          runtime['gate'] = 'GO' if runtime['pytestExitCode'] == 0 and runtime['proofExitCode'] == 0 else 'STOP'
          Path('debug/v147-pitch-hypothesis/runtime-evidence.json').write_text(
              json.dumps(runtime, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print('V147_RUNTIME_JSON=' + json.dumps(runtime, sort_keys=True, separators=(',', ':')))
          PY

          test "$pytest_status" -eq 0
          test "$proof_status" -eq 0

      - name: Upload exact V147 Phase A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v147-phase-a-cpu-proof
          path: |
            debug/v147-pitch-hypothesis/cpu-generated-proof.json
            debug/v147-pitch-hypothesis/runtime-evidence.json
            debug/v147-pitch-hypothesis/pytest-output.txt
            debug/v147-pitch-hypothesis/proof-output.txt
          if-no-files-found: error
