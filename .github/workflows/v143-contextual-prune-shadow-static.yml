name: V143 Contextual Prune Shadow Static Gate

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-contextual-prune-shadow-static.yml
      - analyzer/v143_contextual_prune_reference_free_carrier.py
      - analyzer/v143_contextual_prune_shadow_modal.py
      - analyzer/v143_contextual_prune_runtime.py
      - analyzer/check_v143_contextual_prune_shadow_static.py
      - analyzer/v143_fresh_section5_reference_free_capture.py
      - analyzer/v143_candidate_timing_adapter.py
      - analyzer/v143_modal_live_endpoint.py
      - analyzer/v143_modal_rhythm_router.py
      - analyzer/v143_reference_free_rhythm_pipeline.py
      - analyzer/v143_rhythm_runtime.py
      - analyzer/v143_production_engine.py
      - public/training/v143-musical-reconstruction-calibration/contextual-prune-frozen-model.json

permissions:
  contents: write

jobs:
  static-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out shadow branch
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile isolated shadow sources
        run: |
          python -m py_compile \
            analyzer/v143_contextual_prune_reference_free_carrier.py \
            analyzer/v143_contextual_prune_shadow_modal.py \
            analyzer/v143_contextual_prune_runtime.py \
            analyzer/check_v143_contextual_prune_shadow_static.py

      - name: Run shadow static safety gate
        shell: bash
        run: |
          set +e
          mkdir -p debug/v143-contextual-prune
          log=debug/v143-contextual-prune/shadow-static-action.log
          diagnostic=debug/v143-contextual-prune/shadow-static-action.json
          report=public/training/v143-musical-reconstruction-calibration/contextual-prune-shadow-static-report.json

          python analyzer/check_v143_contextual_prune_shadow_static.py > "$log" 2>&1
          status=$?

          STATUS="$status" \
          REPORT_EXISTS="$([ -s "$report" ] && echo true || echo false)" \
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          log_path = Path("debug/v143-contextual-prune/shadow-static-action.log")
          diagnostic_path = Path("debug/v143-contextual-prune/shadow-static-action.json")
          lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines()
          payload = {
              "schemaVersion": 1,
              "gate": "v143-contextual-prune-shadow-static-action",
              "exitCode": int(os.environ["STATUS"]),
              "reportExists": os.environ["REPORT_EXISTS"] == "true",
              "logTail": lines[-120:],
              "productionModified": False,
          }
          diagnostic_path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

          exit 0

      - name: Commit static report or diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            debug/v143-contextual-prune/shadow-static-action.log \
            debug/v143-contextual-prune/shadow-static-action.json

          report=public/training/v143-musical-reconstruction-calibration/contextual-prune-shadow-static-report.json
          if [ -s "$report" ]; then
            git add -- "$report"
          fi

          if git diff --cached --quiet; then
            echo "No shadow static artifacts changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record V143 contextual prune shadow static gate"
          git push origin HEAD:v143-contextual-prune-lobo

      - name: Enforce static gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("debug/v143-contextual-prune/shadow-static-action.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if int(data.get("exitCode", 1)) != 0:
              raise SystemExit("V143 contextual prune shadow static gate failed")
          if data.get("reportExists") is not True:
              raise SystemExit("V143 contextual prune shadow static report missing")
          print("V143 contextual prune shadow static gate passed")
          PY
