name: V147 Phase E Normalized Context Recovery Once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v147-phase-e-normalized-context-recovery-once.yml

permissions:
  contents: write

concurrency:
  group: v147-phase-e-normalized-context-recovery-once
  cancel-in-progress: false

jobs:
  recover:
    name: Recover deterministic normalized Phase E output
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact recovery revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify failed-attempt and reconciliation identities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v143-contextual-prune-lobo
          test "$(git hash-object debug/v147-phase-e-reference-free/phase-e-collision-definition-reconciliation.json)" = "40e43b756a55e4b62d2ed4b53b1c8c40792912eb"
          test "$(git hash-object validation/v147_phase_e/analyze_normalized_context.py)" = "ff35b44b004e407a1ce09e83828061325d0f9947"
          test "$(git hash-object debug/v147-phase-e-reference-free/failure-analysis.json)" = "817189a1ec1d3aa6e6c15dc6e9f116becbf12690"
          test "$(sha256sum debug/v147-phase-c-real-audio/preserved-run-33038518285/candidate.json | awk '{print $1}')" = "c0215690d5bfd9d2d47b8784eee886e942fbd28c499f25c643635c45ff7a9636"
          test "$(sha256sum debug/v147-phase-c-real-audio/preserved-run-33038518285/decisions.json | awk '{print $1}')" = "3ec6c42730bf571c29258eca131c4e32da257c1ac6073e5319073818e8ac49b9"
          python - <<'PY'
          import json
          from pathlib import Path
          sentinel = json.loads(Path('debug/v147-phase-e-reference-free/normalized-context-attempt-sentinel.json').read_text())
          assert sentinel['githubRunId'] == '33042691252'
          assert sentinel['analysisCompleted'] is False
          assert sentinel['referenceReadable'] is False
          assert sentinel['professionalImageReadable'] is False
          assert Path('.github/workflows/v147-phase-e-normalized-context-once.yml').exists()
          PY
          if git cat-file -e origin/v143-contextual-prune-lobo:debug/v147-phase-e-reference-free/normalized-context-recovery-sentinel.json 2>/dev/null; then
            echo 'Recovery sentinel already exists; refusing recovery rerun.' >&2
            exit 90
          fi

      - name: Make reference surfaces unreadable
        shell: bash
        run: |
          set -euo pipefail
          chmod 000 public/Professionalexample.jpg 2>/dev/null || true
          chmod -R 000 debug/v144-rhythm-calibration/reference 2>/dev/null || true
          chmod -R 000 validation/rhythm_holdout/reference 2>/dev/null || true
          test ! -r public/Professionalexample.jpg
          test ! -r debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json

      - name: Persist recovery boundary before re-materialization
        shell: bash
        run: |
          set -euo pipefail
          cat > debug/v147-phase-e-reference-free/normalized-context-recovery-sentinel.json <<EOF
          {
            "schema": "dadrock.tabs.v147.phase-e-normalized-context-recovery-sentinel.v1",
            "githubRunId": "${GITHUB_RUN_ID}",
            "workflowArmingCommit": "${GITHUB_SHA}",
            "originalFailedRunId": "33042691252",
            "reconciliationGitBlob": "40e43b756a55e4b62d2ed4b53b1c8c40792912eb",
            "analyzerGitBlob": "ff35b44b004e407a1ce09e83828061325d0f9947",
            "referenceReadable": false,
            "professionalImageReadable": false,
            "recoveryCompleted": false
          }
          EOF
          cat >> docs/checkpoints/CURRENT_STATE.md <<EOF

          ## V147 Phase E normalized-context persistence recovery — ARMED — 2026-08-27 UTC
          - Original normalized run \`33042691252\` completed its deterministic reference-free analysis but failed in persistence because an assertion conflated two collision definitions (18 net pitch-set-cardinality losses vs 19 newly duplicated MIDI identities).
          - Reconciliation frozen at \`debug/v147-phase-e-reference-free/phase-e-collision-definition-reconciliation.json\`, blob \`40e43b756a55e4b62d2ed4b53b1c8c40792912eb\`.
          - Recovery run \`${GITHUB_RUN_ID}\` is authorized only to re-materialize the exact deterministic analyzer blob \`ff35b44b004e407a1ce09e83828061325d0f9947\` from immutable preserved inputs and persist its output; it does not alter the analysis definition or construct a candidate.
          - Gold/reference/professional image are unreadable; audio/HPSS/CQT/Modal/GPU/candidate construction/search/retuning are prohibited.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/v147-phase-e-reference-free/normalized-context-recovery-sentinel.json docs/checkpoints/CURRENT_STATE.md
          git commit -m 'docs: checkpoint Phase E normalized recovery boundary'
          chmod 644 public/Professionalexample.jpg 2>/dev/null || true
          chmod -R u+rwX debug/v144-rhythm-calibration/reference 2>/dev/null || true
          chmod -R u+rwX validation/rhythm_holdout/reference 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch origin v143-contextual-prune-lobo
            if git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo; then break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq 5 ]; then exit 91; fi
            sleep $((attempt * 2))
          done
          chmod 000 public/Professionalexample.jpg 2>/dev/null || true
          chmod -R 000 debug/v144-rhythm-calibration/reference 2>/dev/null || true
          chmod -R 000 validation/rhythm_holdout/reference 2>/dev/null || true

      - name: Re-materialize exact successful normalized analysis
        shell: bash
        run: |
          set -euo pipefail
          test ! -r public/Professionalexample.jpg
          test ! -r debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json
          python validation/v147_phase_e/analyze_normalized_context.py \
            --v5 debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json \
            --candidate debug/v147-phase-c-real-audio/preserved-run-33038518285/candidate.json \
            --decisions debug/v147-phase-c-real-audio/preserved-run-33038518285/decisions.json \
            --output debug/v147-phase-e-reference-free/normalized-context-analysis.json \
            --markdown debug/v147-phase-e-reference-free/normalized-context-analysis.md | tee debug/v147-phase-e-reference-free/normalized-context-output.txt

      - name: Reconcile collision definitions and prepare envelope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          normalized_path = Path('debug/v147-phase-e-reference-free/normalized-context-analysis.json')
          parent_path = Path('debug/v147-phase-e-reference-free/failure-analysis.json')
          normalized = json.loads(normalized_path.read_text(encoding='utf-8'))
          parent = json.loads(parent_path.read_text(encoding='utf-8'))
          assert normalized['classification'] == 'reference-free-normalized-context-diagnostic-no-candidate-construction'
          assert normalized['overall']['changedEventCount'] == 247
          assert normalized['collisionAnalysis']['introducedPitchCollisionOnsetCount'] == 19
          net_loss = sum(1 for row in parent['changedOnsets'] if int(row['pitchSetCardinalityDelta']) < 0)
          assert net_loss == 18
          assert parent['pitchContext']['introducedPitchCollisionOnsets'] == 18
          assert normalized['collisionAnalysis']['causeCounts'] == {
              'changed-events-converged': 2,
              'changed-into-unchanged-existing-pitch': 17,
          }
          assert all(value is False for value in normalized['safety'].values())
          digest = hashlib.sha256(normalized_path.read_bytes()).hexdigest()
          markdown_digest = hashlib.sha256(Path('debug/v147-phase-e-reference-free/normalized-context-analysis.md').read_bytes()).hexdigest()
          envelope = {
              'schema': 'dadrock.tabs.v147.phase-e-normalized-context-recovery-envelope.v1',
              'classification': 'deterministic-reference-free-result-recovered-after-persistence-assertion-failure',
              'originalFailedRunId': 33042691252,
              'recoveryRunId': int(os.environ['GITHUB_RUN_ID']),
              'analyzerGitBlob': 'ff35b44b004e407a1ce09e83828061325d0f9947',
              'reconciliationGitBlob': '40e43b756a55e4b62d2ed4b53b1c8c40792912eb',
              'normalizedResultSha256': digest,
              'normalizedMarkdownSha256': markdown_digest,
              'collisionDefinitions': {
                  'netPitchSetCardinalityLossOnsets': net_loss,
                  'newDuplicateMidiIdentityOnsets': normalized['collisionAnalysis']['introducedPitchCollisionOnsetCount'],
              },
              'safety': normalized['safety'],
          }
          Path('debug/v147-phase-e-reference-free/normalized-context-recovery-envelope.json').write_text(
              json.dumps(envelope, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Persist recovered result, final checkpoint, and seal workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('debug/v147-phase-e-reference-free/normalized-context-analysis.json').read_text())
          envelope = json.loads(Path('debug/v147-phase-e-reference-free/normalized-context-recovery-envelope.json').read_text())
          overall = result['overall']
          collisions = result['collisionAnalysis']
          regs = result['eventRates']['byOriginalRegister']
          pcs = result['eventRates']['byOriginalPitchClass']
          strings = result['eventRates']['byOriginalStringIndex']
          event_onsets = result['eventRates']['byAcceptedOnsetSize']
          onset_rates = result['onsetRates']['byAcceptedOnsetSize']
          def top(rows):
              return max(rows, key=lambda row: row['rateRatioVsOverall'])
          tr, tp, ts, to = top(regs), top(pcs), top(strings), top(event_onsets)
          block = f'''\n## V147 Phase E normalized-context analysis — RECOVERED / COMPLETE / SEALED — 2026-08-27 UTC
          - Original run `33042691252` successfully computed the normalized analysis but failed only in post-analysis persistence. Recovery run `{envelope['recoveryRunId']}` re-materialized the **same frozen analyzer** from immutable preserved inputs with Gold/reference/image unreadable.
          - Normalized result SHA256 `{envelope['normalizedResultSha256']}`; analyzer blob `{envelope['analyzerGitBlob']}`; reconciliation blob `{envelope['reconciliationGitBlob']}`.
          - Collision-definition reconciliation: **18 net pitch-set-cardinality-loss onsets** and **19 newly duplicated-MIDI-identity onsets**. These are intentionally different metrics, not contradictory results.
          - Overall event substitution rate: **{overall['changedEventCount']}/{overall['acceptedEventCount']} = {overall['eventChangeRate']*100:.2f}%**. Overall changed-onset rate: **{overall['changedOnsetCount']}/{overall['acceptedOnsetCount']} = {overall['onsetChangeRate']*100:.2f}%**.
          - Highest normalized register rate: `{tr['key']}` = {tr['changed']}/{tr['population']} ({tr['changeRate']*100:.2f}%, {tr['rateRatioVsOverall']:.2f}x overall).
          - Highest normalized pitch-class rate: PC `{tp['key']}` = {tp['changed']}/{tp['population']} ({tp['changeRate']*100:.2f}%, {tp['rateRatioVsOverall']:.2f}x overall).
          - Highest normalized string rate: string `{ts['key']}` = {ts['changed']}/{ts['population']} ({ts['changeRate']*100:.2f}%, {ts['rateRatioVsOverall']:.2f}x overall).
          - Highest event-rate onset-size context: `{to['key']}` = {to['changed']}/{to['population']} ({to['changeRate']*100:.2f}%, {to['rateRatioVsOverall']:.2f}x overall).
          - Event rates by onset size: `{event_onsets}`. Onset-level rates by onset size: `{onset_rates}`.
          - New duplicate-MIDI identities arose on **{collisions['introducedPitchCollisionOnsetCount']} / {overall['changedOnsetCount']}** changed onsets ({collisions['fractionOfChangedOnsets']*100:.2f}%) and {collisions['fractionOfPolyphonicChangedOnsets']*100:.2f}% of polyphonic changed onsets. Causes: `{collisions['causeCounts']}`; directions: `{collisions['directionCounts']}`.
          - Phase E safety remained clean: no Gold/reference/professional image read; no audio/HPSS/CQT/Modal/L4/GPU; no candidate construction/search; no threshold retuning; no main/Production change.
          - Phase E diagnosis is complete. Next safe boundary is a **separate V148 hypothesis/preregistration only**; do not construct or score V148 until that protocol is frozen.
          '''
          with Path('docs/checkpoints/CURRENT_STATE.md').open('a', encoding='utf-8') as handle:
              handle.write(block)
          original = Path('debug/v147-phase-e-reference-free/normalized-context-attempt-sentinel.json')
          original_data = json.loads(original.read_text())
          original_data['analysisCompleted'] = True
          original_data['analysisStepSucceededInOriginalRun'] = True
          original_data['persistenceFailedInOriginalRun'] = True
          original_data['recoveredByRunId'] = str(envelope['recoveryRunId'])
          original_data['resultSha256'] = envelope['normalizedResultSha256']
          original.write_text(json.dumps(original_data, indent=2, sort_keys=True) + '\n')
          recovery = Path('debug/v147-phase-e-reference-free/normalized-context-recovery-sentinel.json')
          recovery_data = json.loads(recovery.read_text())
          recovery_data['recoveryCompleted'] = True
          recovery_data['resultSha256'] = envelope['normalizedResultSha256']
          recovery.write_text(json.dumps(recovery_data, indent=2, sort_keys=True) + '\n')
          PY
          chmod 644 public/Professionalexample.jpg 2>/dev/null || true
          chmod -R u+rwX debug/v144-rhythm-calibration/reference 2>/dev/null || true
          chmod -R u+rwX validation/rhythm_holdout/reference 2>/dev/null || true
          git rm .github/workflows/v147-phase-e-normalized-context-once.yml
          git rm .github/workflows/v147-phase-e-normalized-context-recovery-once.yml
          git add \
            debug/v147-phase-e-reference-free/normalized-context-attempt-sentinel.json \
            debug/v147-phase-e-reference-free/normalized-context-recovery-sentinel.json \
            debug/v147-phase-e-reference-free/normalized-context-analysis.json \
            debug/v147-phase-e-reference-free/normalized-context-analysis.md \
            debug/v147-phase-e-reference-free/normalized-context-output.txt \
            debug/v147-phase-e-reference-free/normalized-context-recovery-envelope.json \
            docs/checkpoints/CURRENT_STATE.md
          git commit -m 'debug: recover and seal V147 normalized context analysis'
          for attempt in 1 2 3 4 5; do
            git fetch origin v143-contextual-prune-lobo
            if git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 92
