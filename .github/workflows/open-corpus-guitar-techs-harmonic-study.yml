name: Open corpus Guitar-TECHS harmonic octave study

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - validation/open_corpus/analyze_guitar_techs_harmonic_octave_v169.py
      - .github/workflows/open-corpus-guitar-techs-harmonic-study.yml
  workflow_dispatch:

jobs:
  harmonic-study:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pinned CPU analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 soundfile==0.13.1 pretty_midi==0.2.11

      - name: Synthetic harmonic self-test
        run: python validation/open_corpus/analyze_guitar_techs_harmonic_octave_v169.py --self-test

      - name: Download and verify public Guitar-TECHS P1 single notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guitar-techs/input" "$RUNNER_TEMP/guitar-techs/output"
          cd "$RUNNER_TEMP/guitar-techs"
          curl -L --fail --retry 3 --retry-delay 3 \
            'https://zenodo.org/records/14963133/files/P1_singlenotes.zip?download=1' \
            -o P1_singlenotes.zip
          echo 'ca0c4674dde3805574685a313f7c39eb  P1_singlenotes.zip' | md5sum -c -
          sha256sum P1_singlenotes.zip | tee output/archive-sha256.txt
          unzip -j P1_singlenotes.zip \
            'P1_singlenotes/midi/midi_allsinglenotes.mid' \
            'P1_singlenotes/audio/directinput/directinput_allsinglenotes.wav' \
            'P1_singlenotes/audio/micamp/micamp_allsinglenotes.wav' \
            -d input

      - name: Run reference-grounded open-corpus harmonic study
        run: |
          python validation/open_corpus/analyze_guitar_techs_harmonic_octave_v169.py \
            --midi "$RUNNER_TEMP/guitar-techs/input/midi_allsinglenotes.mid" \
            --di "$RUNNER_TEMP/guitar-techs/input/directinput_allsinglenotes.wav" \
            --micamp "$RUNNER_TEMP/guitar-techs/input/micamp_allsinglenotes.wav" \
            --output "$RUNNER_TEMP/guitar-techs/output/harmonic-study-report.json"

      - name: Hash aggregate report
        shell: bash
        run: sha256sum "$RUNNER_TEMP/guitar-techs/output/harmonic-study-report.json" | tee "$RUNNER_TEMP/guitar-techs/output/report-sha256.txt"

      - name: Preserve aggregate-only research report
        uses: actions/upload-artifact@v4
        with:
          name: guitar-techs-harmonic-study-report
          path: |
            ${{ runner.temp }}/guitar-techs/output/archive-sha256.txt
            ${{ runner.temp }}/guitar-techs/output/harmonic-study-report.json
            ${{ runner.temp }}/guitar-techs/output/report-sha256.txt
          retention-days: 30
