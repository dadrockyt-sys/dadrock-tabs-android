name: V144 Rhythm Single-Signature Prune Search — Archived

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    name: Refuse replay of consumed calibration search
    runs-on: ubuntu-latest
    steps:
      - name: Historical protocol guard
        shell: bash
        run: |
          echo 'This V144 single-signature candidate family is historical and consumed.' >&2
          echo 'Use the persisted report at debug/v144-rhythm-calibration/candidates/single-signature-prune-search.json.' >&2
          echo 'Do not rerun/reselect this family from later validation evidence.' >&2
          exit 1
