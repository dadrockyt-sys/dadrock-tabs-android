name: V144 Rhythm Single-Signature Prune Search

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v144-single-signature-prune-search.yml
      - validation/v144_rhythm_calibration/search_single_signature_prunes.py
      - modal/v144_rhythm_context_split_policy.py
      - modal/v144_rhythm_staged_selector.py
      - modal/configs/v144_rhythm_context_split_config.json
      - debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json
      - debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v144-rhythm-single-signature-prune-search
  cancel-in-progress: false

jobs:
  search:
    name: Fit-lock single-signature prune candidate on CPU
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify immutable V5 and V144 gold inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          test "$(git hash-object debug/v143-contextual-prune/v5-professional-pdf/final-professional-holdout-result.json)" = "511fd244f231b66d08306f97b5a47ed41f5415c7"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json | awk '{print $1}')" = "7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-rhythm-shadow.pdf | awk '{print $1}')" = "f4c1238e868cadfb90b8a359b1555b0b90e7740b9ebaa276aa394c8991f37ce5"
          test "$(sha256sum debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json | awk '{print $1}')" = "18fd868ae960dfcdd1ffb0110f1a9dfd8acc2ffeb46e247d1116cd54291526ac"
          python modal/tests/test_v144_rhythm_staged_selector.py -v

      - name: Run fit-only single-signature search and staged gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .v144/search
          python validation/v144_rhythm_calibration/search_single_signature_prunes.py \
            debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json \
            debug/v144-rhythm-calibration/reference/professional-rhythm-gold-reference.json \
            modal/configs/v144_rhythm_context_split_config.json \
            debug/v144-rhythm-calibration/candidates/single-signature-prune-search.json \
            .v144/search/locked-events.json \
            --maximum-candidates 96 \
            > .v144/search/search.log

      - name: Verify fit-lock protocol semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('debug/v144-rhythm-calibration/candidates/single-signature-prune-search.json').read_text(encoding='utf-8'))
          assert report['classification'] == 'v144-rhythm-fit-only-single-signature-prune-search'
          assert report['mayClaimUnseenGeneralization'] is False
          assert report['candidateConstruction']['sourceLabels'] == 'fit-only-gross-unmatched-generated-notes'
          assert report['candidateConstruction']['runtimeRuleInputs'] == 'reference-free-context-signature-only'
          assert report['candidateConstruction']['candidateRuleShape'] == 'single-signature-prune'
          assert report['candidateConstruction']['candidateCount'] > 0
          assert report['candidateConstruction']['fitUnmatchedGeneratedNoteCount'] == 622
          assert report['candidateConstruction']['validationLabelsUsedForCandidateConstructionOrRanking'] is False
          assert report['candidateConstruction']['canaryLabelsUsedForCandidateConstructionOrRanking'] is False
          assert report['fitLock']['fitOnlyRanking'] is True
          assert report['fitLock']['validationReadDuringLock'] is False
          assert report['fitLock']['canaryReadDuringLock'] is False
          assert report['baseline']['fit']['gatedMetrics']['pitchContentF1'] == 0.21528861154446177
          assert report['baseline']['fit']['criticalMismatchCount'] == 1150
          assert report['alternateAfterGateFailureAllowed'] is False
          assert report['safety']['v5Modified'] is False
          assert report['safety']['productionModified'] is False
          assert report['safety']['mainModified'] is False
          assert report['safety']['runtimeReferenceInputUsed'] is False
          assert report['safety']['modalGpuInvoked'] is False
          if report['stoppedAt'] == 'fit':
              assert report['locked']['name'] == 'no-prune'
              assert report['validation'] is None
              assert report['canary'] is None
          elif report['stoppedAt'] == 'validation':
              assert report['locked']['name'] != 'no-prune'
              assert report['validation'] is not None
              assert report['validation']['passed'] is False
              assert report['canary'] is None
          elif report['stoppedAt'] == 'canary':
              assert report['validation']['passed'] is True
              assert report['canary']['passed'] is False
          elif report['stoppedAt'] == 'complete':
              assert report['validation']['passed'] is True
              assert report['canary']['passed'] is True
              assert report['selected'] == report['locked']['name']
          else:
              raise AssertionError(f"unexpected stoppedAt={report['stoppedAt']!r}")
          PY

      - name: Reprove locked candidate PDF-event identity independently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .v144/search/freeze
          python - <<'PY'
          import json
          from pathlib import Path

          locked = json.loads(Path('.v144/search/locked-events.json').read_text(encoding='utf-8'))
          events = locked['renderEvents']
          payload = {
              'instrument': 'rhythm',
              'renderEvents': events,
              'tempoBpm': 129.19921875,
              'timeSignature': '4/4',
              'tuning': 'E Standard',
              'structuredMode': True,
              'sourceAudioSha256': '215bd5a657c5326f08f132ae358595a95c30b39bb7493a52c2f910d5a608149f',
              'referenceFree': True,
              'professionalReferenceUsed': False,
              'referenceRuntimeInputUsed': False,
              'runtimeLabelsRequired': False,
              'v143RuntimeSafetyVerified': True,
          }
          Path('.v144/search/freeze-input.json').write_text(json.dumps(payload, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          python validation/rhythm_holdout/freeze_rhythm_analysis.py \
            .v144/search/freeze-input.json .v144/search/freeze \
            --source-commit "${GITHUB_SHA}" \
            > .v144/search/freeze.log

          cp lib/v143RenderContract.js .v144/search/v143RenderContract.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { validateV143RenderEvents } from './.v144/search/v143RenderContract.mjs';
          const locked = JSON.parse(await fs.readFile('.v144/search/locked-events.json', 'utf8'));
          const events = validateV143RenderEvents(locked.renderEvents || []);
          await fs.writeFile('.v144/search/renderer-event-evidence.json', JSON.stringify({
            schemaVersion: 1,
            renderEvents: events,
            runtimeSafetyVerified: true,
            runtimeLabelsRequired: false,
            referenceOpened: false,
            professionalReferenceUsed: false,
            productionModified: false,
          }) + '\n');
          NODE
          python validation/rhythm_holdout/verify_pdf_event_fidelity.py \
            .v144/search/freeze .v144/search/renderer-event-evidence.json \
            > .v144/search/pdf-event-fidelity.log

      - name: Attach locked-candidate fidelity proof to V144 report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path('debug/v144-rhythm-calibration/candidates/single-signature-prune-search.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          fidelity = json.loads(Path('.v144/search/freeze/rhythm-pdf-event-fidelity.json').read_text(encoding='utf-8'))
          assert fidelity['passed'] is True
          assert fidelity['pdfEventFidelity'] == 1.0
          assert fidelity['frozenEventSha256'] == fidelity['pdfEventSha256']
          assert fidelity['frozenEventCount'] == report['locked']['eventCount']
          report['lockedCandidatePdfFidelityProof'] = {
              'passed': True,
              'pdfEventFidelity': 1.0,
              'eventCount': fidelity['frozenEventCount'],
              'eventSha256': fidelity['frozenEventSha256'],
              'referenceOpenedDuringPdfFidelityCheck': False,
          }
          assert report['locked']['eventSha256'] == fidelity['frozenEventSha256']
          report['safety']['lockedCandidatePdfFidelityReproved'] = True
          report['safety']['lockedCandidatePdfFidelityReproofRequired'] = False
          if report['promotionAllowed']:
              assert report['selected'] == report['locked']['name']
              assert report['locked']['name'] != 'no-prune'
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Reverify immutable V5 after calibration work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = "7f72f8ed9b14af8bc93e95544195204d99c6bec1"
          test "$(git hash-object debug/v143-contextual-prune/v5-professional-pdf/final-professional-holdout-result.json)" = "511fd244f231b66d08306f97b5a47ed41f5415c7"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-render-stream.json | awk '{print $1}')" = "7c3399d3f5e05ecc8ac98d71d0e5300e1e78f63ae96c1642fe4a19debb4061b2"
          test "$(sha256sum debug/v143-contextual-prune/v5-professional-pdf/v5-rhythm-shadow.pdf | awk '{print $1}')" = "f4c1238e868cadfb90b8a359b1555b0b90e7740b9ebaa276aa394c8991f37ce5"

      - name: Persist only V144 search report
        shell: bash
        run: |
          set -euo pipefail
          report='debug/v144-rhythm-calibration/candidates/single-signature-prune-search.json'
          git add "$report"
          if git diff --cached --quiet; then
            echo 'V144 single-signature report already persisted.'
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Persist V144 single-signature prune calibration result'
          for attempt in 1 2 3 4 5; do
            git fetch origin v143-contextual-prune-lobo
            if git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
