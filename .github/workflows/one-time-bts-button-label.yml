name: One-time BTS checkout label patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-bts-button-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update BTS checkout label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/bts/page.js')
          text = path.read_text()
          old = 'Continue to $1 Checkout'
          new = 'Continue to PayPal or Token Input'
          if old not in text:
              raise SystemExit(f'Expected label not found: {old}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/one-time-bts-button-label.yml

      - name: Commit final BTS label change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/bts/page.js .github/workflows/one-time-bts-button-label.yml
          git commit -m 'Clarify BTS PayPal or token checkout button'
          git push origin main
