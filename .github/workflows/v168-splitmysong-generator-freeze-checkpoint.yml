name: V168 SplitMySong generator freeze checkpoint

on:
  push:
    branches: [v143-contextual-prune-lobo]
    paths: [.github/workflows/v168-splitmysong-generator-freeze-checkpoint.yml]

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0
      - name: Append checkpoint and self-delete
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=v143-contextual-prune-lobo
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"
          test "$(grep -c 'SplitMySong reference-blind generator frozen' docs/checkpoints/CURRENT_STATE.md || true)" = "0"
          cat >> docs/checkpoints/CURRENT_STATE.md <<'EOF'

