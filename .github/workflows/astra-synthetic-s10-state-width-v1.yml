name: Astra synthetic S10 identity-preserving state widening v1

on:
  push:
    branches:
      - astra-work
    paths:
      - 'docs/astra/SYNTHETIC_DATA_DIVERSITY_S10_LAUNCH_V1.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: astra-synthetic-s10-state-width-v1
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-22.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'
      - name: Verify authorization and source pins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          blob=lambda p: subprocess.check_output(['git','hash-object',p],text=True).strip()
          a=json.load(open('docs/astra/SYNTHETIC_DATA_DIVERSITY_S10_AUTHORIZATION_V1.json'))
          l=json.load(open('docs/astra/SYNTHETIC_DATA_DIVERSITY_S10_LAUNCH_V1.json'))
          assert a['schema']=='astra-synthetic-data-diversity-s10-authorization-v1'
          assert str(a['userInstruction']).startswith('I authorize')
          z=a['authorization']
          assert z['maxModels']==2 and z['maxOptimizerStepsPerModel']==500
          assert not z['automaticRetryAuthorized'] and not z['thresholdSearchAuthorized']
          assert not z['p1Authorized'] and not z['p2Authorized'] and not z['p3Authorized']
          assert not z['codespacesAuthorized'] and not z['vercelAuthorized']
          paths={
            'designGitBlob':'docs/astra/SYNTHETIC_DATA_DIVERSITY_S10_DESIGN_V1.md',
            'generatorGitBlob':'astra_backend/synthetic/s0_pilot_v1.py',
            's9DatasetGitBlob':'astra_backend/synthetic/s9_pilot_v1.py',
            'runnerGitBlob':'astra_backend/synthetic/s10_pilot_v1.py',
            'testsGitBlob':'astra_backend/synthetic/test_s10_pilot_v1.py',
            'runtimeLockGitBlob':'astra_backend/tabcnn_runtime/requirements.lock.txt',
            'workflowGitBlob':'.github/workflows/astra-synthetic-s10-state-width-v1.yml',
          }
          for k,p in paths.items():
              assert a['sourceIdentities'][k]==blob(p),(k,'auth')
              assert l['sourceIdentities'][k]==blob(p),(k,'launch')
          assert l['authorizationGitBlob']==blob('docs/astra/SYNTHETIC_DATA_DIVERSITY_S10_AUTHORIZATION_V1.json')
          PY
      - name: Install exact CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          python -m pip check
      - name: Run authorized S10 identity tests
        run: PYTHONPATH=astra_backend python astra_backend/synthetic/test_s10_pilot_v1.py
      - name: Regenerate exact S9 diversified dataset
        run: |
          mkdir -p /tmp/astra-s10
          PYTHONPATH=astra_backend python astra_backend/synthetic/s0_pilot_v1.py generate             --out /tmp/astra-s10/control.npz --receipt /tmp/astra-s10/control-render-receipt.json
          PYTHONPATH=astra_backend python astra_backend/synthetic/s9_pilot_v1.py build-intervention             --control-dataset /tmp/astra-s10/control.npz             --out /tmp/astra-s10/dataset.npz             --receipt /tmp/astra-s10/dataset-receipt.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/astra-s10/dataset-receipt.json'))
          assert r['interventionUniqueTrainChordVoicings']==30
          assert r['interventionSignatureSha256']=='de7a34d3dc51afa5ef5adc9105fe8796b00724ac5fceac61ab8083ea34dbda1d'
          assert r['validationTestBitIdentical'] and r['nonChordBitIdentical']
          PY
      - name: Run exactly two capped S10 arms
        run: |
          PYTHONPATH=astra_backend python astra_backend/synthetic/s10_pilot_v1.py             --dataset /tmp/astra-s10/dataset.npz             --out /tmp/astra-s10/result.json             --identity-out /tmp/astra-s10/identity.json             --control-model /tmp/astra-s10/control128.pt             --wide-model /tmp/astra-s10/wide192.pt
          python - <<'PY'
          import json
          x=json.load(open('/tmp/astra-s10/result.json'))
          assert x['execution']['modelCount']==2 and x['execution']['optimizerStepsTotal']<=1000
          assert all(x['identity']['preUpdate'].values())
          assert x['fixed']['thresholdSearch'] is False and x['execution']['automaticRetry'] is False
          assert not x['guards']['p1Accessed'] and not x['guards']['p2Accessed'] and not x['guards']['p3Opened']
          assert not x['guards']['codespacesUsed'] and not x['guards']['vercelUsed']
          PY
      - name: Upload bounded S10 evidence
        uses: actions/upload-artifact@v4
        with:
          name: astra-synthetic-data-diversity-s10-v1
          path: |
            /tmp/astra-s10/control-render-receipt.json
            /tmp/astra-s10/dataset-receipt.json
            /tmp/astra-s10/identity.json
            /tmp/astra-s10/result.json
            /tmp/astra-s10/control128.pt
            /tmp/astra-s10/wide192.pt
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/astra-s10
