name: V143 Contextual Prune Surviving-Band Provenance

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-contextual-prune-surviving-band-provenance.yml
      - analyzer/v143_contextual_prune_surviving_band_provenance_modal.py

permissions:
  contents: write

jobs:
  surviving-band-provenance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Check out isolated research branch
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify provenance inputs
        shell: bash
        run: |
          set -euo pipefail
          root=public/training/v143-musical-reconstruction-calibration
          test -s public/gomywayfullaitest.m4a
          test -s "$root/fresh-section2-reference-free-cache.json"
          test -s "$root/fresh-section3-reference-free-cache.json"
          test -s "$root/fresh-section4-reference-free-cache.json"
          test -s "$root/fresh-section5-reference-free-cache.json"
          test -s "$root/reserve-97-113-reference-free-cache.json"
          test -s "$root/fresh-section5-base027-frozen-events.json"
          test -s "$root/reserve-97-113-base027-frozen-events.json"
          test -s "$root/reserve-97-113-contextual-prune-frozen-events.json"
          test -s analyzer/v143_contextual_prune_surviving_band_provenance_modal.py
          echo "All surviving-band provenance inputs are present."

      - name: Run authoritative surviving-band provenance gate on Modal
        shell: bash
        run: |
          set +e
          mkdir -p debug/v143-contextual-prune
          log=debug/v143-contextual-prune/surviving-band-provenance.log
          diagnostic=debug/v143-contextual-prune/surviving-band-provenance.json

          : > "$log"
          echo "commit=$GITHUB_SHA" >> "$log"
          echo "actor=$GITHUB_ACTOR" >> "$log"

          token_available=false
          attempted=false
          status=99

          if [ -n "${MODAL_TOKEN_ID:-}" ] && [ -n "${MODAL_TOKEN_SECRET:-}" ]; then
            token_available=true
            python -m pip install --disable-pip-version-check modal >> "$log" 2>&1
            install_status=$?
            if [ "$install_status" -eq 0 ]; then
              attempted=true
              python -m modal run analyzer/v143_contextual_prune_surviving_band_provenance_modal.py::diagnose >> "$log" 2>&1
              status=$?
            else
              status=$install_status
            fi
          else
            echo "Modal GitHub credentials are unavailable; provenance gate not attempted." >> "$log"
          fi

          TOKEN_AVAILABLE="$token_available" \
          ATTEMPTED="$attempted" \
          STATUS="$status" \
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          log_path = Path("debug/v143-contextual-prune/surviving-band-provenance.log")
          output = Path("debug/v143-contextual-prune/surviving-band-provenance.json")
          text = log_path.read_text(encoding="utf-8", errors="replace")
          target_gate = "v143-contextual-prune-surviving-band-provenance"
          result = None
          decoder = json.JSONDecoder()
          for index, char in enumerate(text):
              if char != "{":
                  continue
              try:
                  value, _ = decoder.raw_decode(text[index:])
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict) and value.get("gate") == target_gate:
                  result = value

          payload = {
              "schemaVersion": 1,
              "gate": "v143-contextual-prune-surviving-band-provenance-action",
              "modalCredentialsAvailableInGitHubActions": os.environ["TOKEN_AVAILABLE"] == "true",
              "diagnosticAttempted": os.environ["ATTEMPTED"] == "true",
              "modalCommandExitCode": int(os.environ["STATUS"]) if os.environ["ATTEMPTED"] == "true" else None,
              "diagnosticResultFound": result is not None,
              "diagnosticResult": result,
              "logTail": text.splitlines()[-220:],
              "liveEndpointDeployedOrModified": False,
              "productionModified": False,
          }
          output.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

          exit 0

      - name: Preserve full provenance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-contextual-prune-surviving-band-provenance-log
          path: debug/v143-contextual-prune/surviving-band-provenance.log
          if-no-files-found: error
          retention-days: 7

      - name: Commit compact provenance result
        shell: bash
        run: |
          set -euo pipefail
          git add -- debug/v143-contextual-prune/surviving-band-provenance.json
          if git diff --cached --quiet; then
            echo "No surviving-band provenance result changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record V143 surviving-band provenance gate"
          git push origin HEAD:v143-contextual-prune-lobo

      - name: Report provenance gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("debug/v143-contextual-prune/surviving-band-provenance.json").read_text(encoding="utf-8")
          )
          result = data.get("diagnosticResult") or {}
          invariants = result.get("invariants") or {}
          execution_checks = {
              "Modal credentials available": data.get("modalCredentialsAvailableInGitHubActions") is True,
              "Diagnostic attempted": data.get("diagnosticAttempted") is True,
              "Modal command exited zero": data.get("modalCommandExitCode") == 0,
              "Diagnostic result found": data.get("diagnosticResultFound") is True,
              "Original band boundaries preserved": invariants.get("originalBandBoundariesPreserved") is True,
              "No monolithic carrier used": invariants.get("monolithicCarrierUsed") is False,
              "17-32 not claimed": invariants.get("measures17To32Claimed") is False,
              "Professional reference not opened": invariants.get("professionalReferenceOpened") is False,
              "Runtime labels not required": invariants.get("runtimeLabelsRequired") is False,
              "Live endpoint untouched": invariants.get("liveEndpointDeployedOrModified") is False,
              "Production untouched": invariants.get("productionModified") is False,
          }
          failed_execution = [name for name, ok in execution_checks.items() if not ok]
          if failed_execution:
              raise SystemExit(
                  "Surviving-band provenance execution failed: " + ", ".join(failed_execution)
              )

          for label in ("section2", "section3", "section4", "section5", "reserve"):
              band = (result.get("bands") or {}).get(label) or {}
              print(label.upper(), "PROVENANCE", band.get("provenanceReplayPassed"))
              print(label.upper(), "SEMANTIC_MISMATCH", json.dumps(band.get("semanticFirstMismatch"), sort_keys=True))
              print(label.upper(), "CAPTURE_MISMATCH", json.dumps(band.get("captureDiagnosticsFirstMismatch"), sort_keys=True))

          reserve = result.get("reserveScoring") or {}
          print("RESERVE_PARTIAL_TAIL", (reserve.get("context") or {}).get("partialTailInvariantPassed"))
          print("SECTION5_BASE_REPLAY", reserve.get("section5BaseReplayPassed"))
          print("SECTION5_BASE_SCORE_REPLAY", reserve.get("section5BaseScoreReplayPassed"))
          print("RESERVE_BASE_REPLAY", reserve.get("reserveBaseReplayPassed"))
          print("RESERVE_CANDIDATE_REPLAY", reserve.get("reserveCandidateReplayPassed"))
          print("RESERVE_SCORE_REPLAY", reserve.get("reserveScoreReplayPassed"))
          print("ALL_CARRIER_PROVENANCE", result.get("allCarrierProvenancePassed"))
          print("ALL_SURVIVING_BANDS_PROVENANCE", result.get("allSurvivingBandsProvenancePassed"))
          print("PRODUCTION_MODIFIED", False)

          if result.get("allSurvivingBandsProvenancePassed") is not True:
              raise SystemExit(
                  "Authoritative surviving-band provenance gate did not pass; inspect committed diagnostic."
              )
          PY
