name: V167 candidate evidence schema probe

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v167-candidate-evidence-probe.yml

permissions:
  contents: write

concurrency:
  group: v167-candidate-evidence-probe-once
  cancel-in-progress: false

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: b2e2478c9880fe012a9550e9c02795f0ea71e0b3
  CANDIDATE: debug/v167-single-song-calibration/iteration-001-generated.json
  PROBE: validation/v167_single_song_calibration/probe_candidate_evidence_v167.py
  OUTPUT: debug/v167-single-song-calibration/candidate-evidence-probe.json

jobs:
  probe:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact evidence-probe arm
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable candidate and probe
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v167-candidate-evidence-probe.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"
          test "$(git hash-object "$CANDIDATE")" = "1b73d6ece977fb976fa1c503997e6434d4e4811a"
          test "$(git hash-object "$PROBE")" = "3fafa2194ab5228f39292d110bef14592dacb909"
          test ! -e "$OUTPUT"

      - name: Probe candidate evidence schema
        shell: bash
        run: |
          set -euo pipefail
          python "$PROBE" --candidate "$CANDIDATE" --output "$OUTPUT"

      - name: Freeze probe and self-seal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('debug/v167-single-song-calibration/candidate-evidence-probe.json'))
          assert r['version']=='V167'
          assert r['policy']['referenceRead'] is False
          assert r['policy']['candidateModified'] is False
          print(json.dumps({
            'topLevelKeys':r['topLevelKeys'],
            'largestLists':r['largestLists'][:25],
            'numericFields':list(r['numericFieldSummary'])
          },indent=2,sort_keys=True))
          PY
          rm .github/workflows/v167-candidate-evidence-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$OUTPUT" .github/workflows/v167-candidate-evidence-probe.yml
          changed="$(git diff --cached --name-only)"
          if echo "$changed" | grep -Ev '^debug/v167-single-song-calibration/candidate-evidence-probe\.json$|^\.github/workflows/v167-candidate-evidence-probe\.yml$'; then
            echo 'Unexpected V167 evidence-probe path' >&2
            exit 1
          fi
          git commit -m "research: freeze V167 candidate evidence schema probe [skip ci]"
          git push origin HEAD:"$BRANCH"
