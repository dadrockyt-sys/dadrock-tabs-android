name: V143 combined content shadow v5 replay

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - '.github/workflows/v143-combined-content-shadow-v5-replay.yml'
      - 'analyzer/v143_contextual_prune_combined_content_shadow_v5_replay_validator.py'
      - 'analyzer/v143_contextual_prune_attack_shadow_v3_replay_validator.py'
      - 'analyzer/materialize_v143_precision_fixture.py'
      - 'analyzer/fixtures/v143_precision_v2_modal_capture_32805316807.json'
      - 'debug/v143-contextual-prune/electric-tabcnn-subfloor-attack-evidence.json'
      - 'debug/v143-contextual-prune/attack-shadow-v3-replay-validation.json'
      - 'debug/v143-contextual-prune/contextual-harmonic-primary-shadow-v4-validation.json'

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 1
      - name: Reverify protected and durable input identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object analyzer/v143_reference_free_rhythm_pipeline.py)" = '7f72f8ed9b14af8bc93e95544195204d99c6bec1'
          test "$(git hash-object debug/v143-contextual-prune/attack-shadow-v3-replay-validation.json)" = '53e43071efc244e07cf26ebfbc4697f91dd24fd8'
          test "$(git hash-object debug/v143-contextual-prune/contextual-harmonic-primary-shadow-v4-validation.json)" = '099b5ac472f397aa6aa67af477382d3498b3ddfa'
          test "$(sha256sum debug/v143-contextual-prune/attack-shadow-v3-replay-validation.json | awk '{print $1}')" = '039a42d06abdc60a111cd85f0db9ac07b81caf1c1d91fd65e260ffb6119b1892'
      - name: Materialize immutable paid capture CPU-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin c1451df43cc1162ed2b38aa3f3300b7af4d9b527
          python3 analyzer/materialize_v143_precision_fixture.py \
            --output-dir debug/v143-contextual-prune-ci/pinned-capture
      - name: Replay combined V3 attack plus V4 primary shadow
        shell: bash
        run: |
          set -euo pipefail
          python3 analyzer/v143_contextual_prune_combined_content_shadow_v5_replay_validator.py \
            debug/v143-contextual-prune-ci/pinned-capture/repaired-timing-precision-candidate-product.json \
            debug/v143-contextual-prune/electric-tabcnn-subfloor-attack-evidence.json \
            debug/v143-contextual-prune/attack-shadow-v3-replay-validation.json \
            debug/v143-contextual-prune/contextual-harmonic-primary-shadow-v4-validation.json \
            --output debug/v143-contextual-prune-ci/combined-content-shadow-v5-validation.json
      - name: Persist exact passing validation on research branch
        shell: bash
        run: |
          set -euo pipefail
          cp debug/v143-contextual-prune-ci/combined-content-shadow-v5-validation.json \
            debug/v143-contextual-prune/combined-content-shadow-v5-validation.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/v143-contextual-prune/combined-content-shadow-v5-validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist combined content shadow v5 validation'
            git push origin HEAD:v143-contextual-prune-lobo
          fi
      - name: Show validation result
        if: always()
        shell: bash
        run: |
          if test -f debug/v143-contextual-prune-ci/combined-content-shadow-v5-validation.json; then
            cat debug/v143-contextual-prune-ci/combined-content-shadow-v5-validation.json
            sha256sum debug/v143-contextual-prune-ci/combined-content-shadow-v5-validation.json
          fi
      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-combined-content-shadow-v5-validation
          path: debug/v143-contextual-prune-ci/combined-content-shadow-v5-validation.json
          if-no-files-found: warn
          retention-days: 1
