name: Astra tiny-fit capped P1 pilot

# Intentionally no workflow_dispatch. This workflow remains inert until a future
# commit adds the separately authorized launch document named below.
on:
  push:
    branches: [astra-work]
    paths:
      - 'docs/astra/TINY_FIT_PILOT_REAL_LAUNCH_V1.json'

permissions:
  contents: read

concurrency:
  group: astra-tiny-fit-capped-p1-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact authorized launch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'

      - name: Verify authorization launch and frozen source identities before media access
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/astra/TINY_FIT_PILOT_REAL_AUTHORIZATION_V1.json
          test -f docs/astra/TINY_FIT_PILOT_REAL_LAUNCH_V1.json
