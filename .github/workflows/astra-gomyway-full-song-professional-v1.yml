name: Astra Go My Way Full Song Professional Benchmark V1

on:
  push:
    branches: [astra-work]
    paths:
      - 'astra_backend/evaluation/evaluate_gomyway_full_song_professional_v1.py'
      - '.github/workflows/astra-gomyway-full-song-professional-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-gomyway-full-song-professional-v1
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Astra work
        uses: actions/checkout@v4
        with:
          ref: astra-work
          fetch-depth: 1

      - name: Checkout pinned main source assets
        uses: actions/checkout@v4
        with:
          ref: 74dacf322bb979c26a47786e2380c59d2d40e364
          path: .main-source
          fetch-depth: 1

      - name: Verify main/public source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .main-source rev-parse HEAD)" = "74dacf322bb979c26a47786e2380c59d2d40e364"
          test "$(git -C .main-source hash-object 'public/gomywayfullaitest.m4a')" = "5e34fb55fbd011c55b56bc40cc5d062735b3fcd0"
          test "$(git -C .main-source hash-object 'public/Gomywaybassreference.pdf')" = "9b39fec0e55d60d5ee509863dfc55c1d6bc1f4f4"
          test "$(git -C .main-source hash-object 'public/Gomywayleadreference.pdf')" = "3e5822be398f64b72d806970b27c22503d4e494c"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'scipy==1.11.4' soundfile torch onnxruntime
          python -m pip install 'basic-pitch==0.4.0'
          python - <<'PY'
          import numpy
          assert numpy.__version__ == '1.26.4'
          PY

      - name: Decode pinned full-song audio
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y             -i '.main-source/public/gomywayfullaitest.m4a'             -ar 44100 -ac 2 -c:a pcm_f32le             gomywayfullaitest-44100-stereo.wav
          ffprobe -v error -show_entries stream=sample_rate,channels -of json             gomywayfullaitest-44100-stereo.wav

      - name: Download and verify BS-Roformer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models/bs-roformer
          python - <<'PY'
          from pathlib import Path
          import hashlib, urllib.request
          p=Path("models/bs-roformer/bs_roformer_sw_6stem_fp16.onnx")
          urllib.request.urlretrieve(
              "https://huggingface.co/elicwhite/bs-roformer-sw-6stem-onnx/resolve/main/bs_roformer_sw_6stem_fp16.onnx",
              p,
          )
          expected="d3d2bac77a7023282cb5f35a5807179e34076b60589867b572275f1a8ec36444"
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"model SHA mismatch: {actual}")
          PY

      - name: Compile benchmark
        run: |
          python -m py_compile             astra_backend/evaluation/bs_roformer_sw_6stem_adapter_v1.py             astra_backend/evaluation/pretrained_note_front_end_v1.py             astra_backend/evaluation/score_note_onsets.py             astra_backend/evaluation/evaluate_s0_transcription_failure_attribution_v1.py             astra_backend/evaluation/evaluate_gomyway_full_song_professional_v1.py

      - name: Run full-song current-pipeline benchmark
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=astra_backend:astra_backend/evaluation           python astra_backend/evaluation/evaluate_gomyway_full_song_professional_v1.py             --audio-wav gomywayfullaitest-44100-stereo.wav             --audio-source-path 'main@74dacf322bb979c26a47786e2380c59d2d40e364:public/gomywayfullaitest.m4a'             --intro-reference analyzer/fixtures/gomyway_professional_intro_reference_v1.json             --later-reference public/gomyway-professional-rhythm-reference-17-113.json             --timing-map public/gomyway-professional-timing-map-v2.json             --model models/bs-roformer/bs_roformer_sw_6stem_fp16.onnx             --bass-pdf '.main-source/public/Gomywaybassreference.pdf'             --lead-pdf '.main-source/public/Gomywayleadreference.pdf'             --output-json gomyway_full_song_professional_benchmark_v1.json

      - name: Summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("gomyway_full_song_professional_benchmark_v1.json"))
          r=d["rhythmScore"]
          print("# Go My Way Full Song Professional Benchmark V1")
          print(f"- Rhythm targets: **{d['professionalReferences']['rhythm']['pitchedTargetCount']}**")
          print(f"- Whole mix events: **{d['predictionCounts']['wholeMix']}**")
          print(f"- Raw guitar events: **{d['predictionCounts']['rawGuitarStem']}**")
          print(f"- Raw bass events cached: **{d['predictionCounts']['rawBassStem']}**")
          print(f"- Whole-mix rhythm exact-MIDI/onset F1: **{r['wholeMixControl']['f1']:.4f}**")
          print(f"- Raw-guitar rhythm exact-MIDI/onset F1: **{r['rawGuitarStem']['f1']:.4f}**")
          print(f"- Separator delta vs whole mix: **{r['f1DeltaRawGuitarVsWholeMix']:+.4f}**")
          print(f"- Separator wall seconds: **{d['separator']['wallSeconds']:.1f}**")
          print(f"- Basic Pitch wall seconds (3 streams): **{d['transcriber']['wallSecondsForThreeStreams']:.1f}**")
          print("## Best raw-guitar measures")
          for row in r["highestF1Measures"][:10]:
              f=row["score"]["f1"]
              print(f"- m{row['measureNumber']}: F1={0.0 if f is None else f:.3f}, targets={row['referenceTargetCount']}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: astra-gomyway-full-song-professional-benchmark-v1
          path: gomyway_full_song_professional_benchmark_v1.json
          retention-days: 30

      - if: always()
        shell: bash
        run: |
          rm -rf .main-source models/bs-roformer
          rm -f gomywayfullaitest-44100-stereo.wav
