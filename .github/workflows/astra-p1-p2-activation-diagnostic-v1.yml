name: Astra P1-P2 activation domain diagnostic v1

on:
  push:
    branches:
      - astra-work
    paths:
      - 'docs/astra/P1_P2_ACTIVATION_DIAGNOSTIC_LAUNCH_V1.json'

permissions:
  actions: read
  contents: read

concurrency:
  group: astra-p1-p2-activation-domain-diagnostic-v1
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact authorized diagnostic launch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'

      - name: Verify explicit authorization and source pins before media access
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/astra/P1_P2_ACTIVATION_DIAGNOSTIC_AUTHORIZATION_V1.json
          test -f docs/astra/P1_P2_ACTIVATION_DIAGNOSTIC_LAUNCH_V1.json
          python - <<'PY'
          import json, subprocess
          def blob(path):
              return subprocess.check_output(['git','hash-object',path], text=True).strip()
          auth=json.load(open('docs/astra/P1_P2_ACTIVATION_DIAGNOSTIC_AUTHORIZATION_V1.json'))
          launch=json.load(open('docs/astra/P1_P2_ACTIVATION_DIAGNOSTIC_LAUNCH_V1.json'))
          assert auth['schema']=='astra-p1-p2-activation-diagnostic-authorization-v1'
          assert auth['authorization']['p1MediaAccessAuthorized'] is True
          assert auth['authorization']['p2MediaAccessAuthorized'] is True
          assert auth['authorization']['optimizerStepsAuthorized']==0
          assert auth['authorization']['thresholdSearchAuthorized'] is False
          assert auth['authorization']['p3Authorized'] is False
          assert launch['schema']=='astra-p1-p2-activation-diagnostic-launch-v1'
          assert launch['singleLaunch'] is True
          expected={
            'authorizationGitBlob':'docs/astra/P1_P2_ACTIVATION_DIAGNOSTIC_AUTHORIZATION_V1.json',
            'designGitBlob':'docs/astra/P1_P2_ACTIVATION_DIAGNOSTIC_DESIGN_V1.json',
            'diagnosticScriptGitBlob':'astra_backend/evaluation/p1_p2_activation_diagnostic_v1.py',
            'diagnosticTestsGitBlob':'astra_backend/evaluation/test_p1_p2_activation_diagnostic_v1.py',
            'p2ScreenScriptGitBlob':'astra_backend/evaluation/cross_performer_screen_v1.py',
            'decoderV2GitBlob':'astra_backend/evaluation/event_decoder_v2.py',
            'eventAdapterGitBlob':'astra_backend/evaluation/prepared_event_adapter_v1.py',
            'eventContractGitBlob':'astra_backend/evaluation/event_contract_v2.py',
            'tinyFitHarnessGitBlob':'astra_backend/tiny_fit_pilot_v1.py',
            'runtimeLockGitBlob':'astra_backend/tabcnn_runtime/requirements.lock.txt',
            'alignmentCorrectionsGitBlob':'docs/astra/GUITARTECHS_PRIMARY_ALIGNMENT_CORRECTIONS_V1.json',
            'p1EngineeringResultGitBlob':'docs/astra/TINY_FIT_V3_DECODER_V2_CHECK_RESULT_V2.json',
            'p2ScreenResultGitBlob':'docs/astra/P2_CROSS_PERFORMER_SCREEN_RESULT_V1.json',
            'workflowGitBlob':'.github/workflows/astra-p1-p2-activation-diagnostic-v1.yml',
          }
          for key,path in expected.items():
              actual=blob(path)
              assert launch['sourceIdentities'][key]==actual,(key,'launch')
              if key!='authorizationGitBlob':
                  assert auth['sourceIdentities'][key]==actual,(key,'authorization')
          PY
          echo "OPTIMIZER_STEPS_AUTHORIZED=0"
          echo "THRESHOLD_SEARCH_AUTHORIZED=false"
          echo "P3_OPENED=false"

      - name: Install exact frozen runtime and source tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check             --extra-index-url https://download.pytorch.org/whl/cpu             --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          python -m pip check
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip
          python - <<'PY'
          import numpy, torch
          assert numpy.__version__ == '1.21.6'
          assert torch.__version__ == '1.11.0+cpu'
          PY

      - name: Download exact frozen V3 model artifact
        uses: actions/download-artifact@v4
        with:
          name: astra-tiny-fit-capped-p1-pilot-v3
          path: /tmp/v3-artifact
          github-token: ${{ github.token }}
          repository: dadrockyt-sys/dadrock-tabs-android
          run-id: 36280547470

      - name: Verify frozen V3 artifact identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /tmp/v3-artifact/tiny-fit-model.pt | awk '{print $1}')" = "fba076f8b6e5fe177ba7b15e5d6780269194f530b2648037ac0763a4937eb67f"
          test "$(sha256sum /tmp/v3-artifact/tiny-fit-result.json | awk '{print $1}')" = "1bda3d5b7c790641742a99c07685c8d477938cd7426ad48f58d84928a3328647"

      - name: Prepare exact four frozen P1 control examples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p1-diagnostic /tmp/selected-p1
          while IFS=$'\t' read -r file bytes md5 sha capture; do
            rm -rf /tmp/selected-p1/*
            curl --fail --location --connect-timeout 30 --max-time 1500               --user-agent 'Astra-P1-P2-Activation-Diagnostic/1.0'               -o "/tmp/$file"               "https://zenodo.org/records/14963133/files/$file?download=1"
            test "$(stat -c '%s' "/tmp/$file")" = "$bytes"
            test "$(md5sum "/tmp/$file" | awk '{print $1}')" = "$md5"
            test "$(sha256sum "/tmp/$file" | awk '{print $1}')" = "$sha"
            PYTHONPATH=astra_backend:astra_backend/evaluation               python astra_backend/tiny_fit_pilot_v1.py extract-selected-source               --archive "/tmp/$file" --capture-key "$capture" --output-dir /tmp/selected-p1
            rm -f "/tmp/$file"
            PYTHONPATH=astra_backend:astra_backend/evaluation               python astra_backend/tiny_fit_pilot_v1.py prepare-capture               --root /tmp/selected-p1 --capture-key "$capture"               --corrections docs/astra/GUITARTECHS_PRIMARY_ALIGNMENT_CORRECTIONS_V1.json               --output-dir /tmp/p1-diagnostic
          done <<'EOF'
          P1_chords.zip	981741162	be9ef8bbdceb1912d565254e607a6d94	de4aa76ef4b86ce981496161b741dc39bd22dec5250da351e5e68a44da249326	P1|chords|Drop3_7|directinput
          P1_scales.zip	453349723	9c0b98e8fb42a522df727ea8bf545e4f	79d7e9d148820867a9095697c9521e40a4b11c198384edfce1951de7219b3509	P1|scales|Ab|directinput
          P1_singlenotes.zip	108626613	ca0c4674dde3805574685a313f7c39eb	130592ae5555476ea8e4070c0f3421794ef8b5e252dfa780745d07eedd0eb4a4	P1|singlenotes|allsinglenotes|directinput
          P1_techniques.zip	326280863	18634a41a6db5a8de10d07eb3122a872	1e4b80a464182d345e129f3e1158b6c05690c60b5f9be4bde3fb26f23263236e	P1|techniques|PalmMute|directinput
          EOF
          test "$(find /tmp/p1-diagnostic -name meta.json | wc -l)" = '4'

      - name: Prepare exact four homologous P2 examples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p2-diagnostic /tmp/selected-p2
          while IFS=$'\t' read -r file bytes md5 sha capture; do
            rm -rf /tmp/selected-p2/*
            curl --fail --location --connect-timeout 30 --max-time 1500               --user-agent 'Astra-P1-P2-Activation-Diagnostic/1.0'               -o "/tmp/$file"               "https://zenodo.org/records/14963133/files/$file?download=1"
            test "$(stat -c '%s' "/tmp/$file")" = "$bytes"
            test "$(md5sum "/tmp/$file" | awk '{print $1}')" = "$md5"
            test "$(sha256sum "/tmp/$file" | awk '{print $1}')" = "$sha"
            PYTHONPATH=astra_backend:astra_backend/evaluation               python astra_backend/evaluation/cross_performer_screen_v1.py extract-selected-source               --archive "/tmp/$file" --capture-key "$capture" --output-dir /tmp/selected-p2
            rm -f "/tmp/$file"
            PYTHONPATH=astra_backend:astra_backend/evaluation               python astra_backend/evaluation/cross_performer_screen_v1.py prepare-capture               --root /tmp/selected-p2 --capture-key "$capture"               --corrections docs/astra/GUITARTECHS_PRIMARY_ALIGNMENT_CORRECTIONS_V1.json               --output-dir /tmp/p2-diagnostic
          done <<'EOF'
          P2_chords.zip	1150819056	eb6f74dd19162237189281688ad7ad2e	9d4a46261cc840d6a66412ad0ebffcfba1fbce579bec0205127190b7bd7a4bce	P2|chords|Drop3_7|directinput
          P2_scales.zip	471254783	96664853872f51e5f8aa4447313b7cf5	d5efc7134764bd8124a712fd301d020d143a6e589eb8e1f2e0ddcbf94524ff17	P2|scales|Ab|directinput
          P2_singlenotes.zip	116133457	40fbf03d8b04bb2cf42df20f36dc2254	d6b54e40d22113d6c0a663165cb2af63735897a35bb45fc6d0ed49c944b548d9	P2|singlenotes|allsinglenotes|directinput
          P2_techniques.zip	395839610	f4189251ce50be25f06a173b2c2bba00	05fc065c010add9e5348095d7198fdc45b967c657e3e12ef8afdb74808371816	P2|techniques|PalmMute|directinput
          EOF
          test "$(find /tmp/p2-diagnostic -name meta.json | wc -l)" = '4'
          echo "OPTIMIZER_STEPS_EXECUTED=0"
          echo "P3_OPENED=false"

      - name: Run activation and domain-shift diagnostic
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=astra_backend:astra_backend/evaluation             python astra_backend/evaluation/p1_p2_activation_diagnostic_v1.py             --p1-dir /tmp/p1-diagnostic             --p2-dir /tmp/p2-diagnostic             --model /tmp/v3-artifact/tiny-fit-model.pt             --out /tmp/p1-p2-activation-diagnostic.json

      - name: Verify zero-optimizer diagnostic boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open('/tmp/p1-p2-activation-diagnostic.json'))
          assert x['schema']=='astra-p1-p2-activation-domain-shift-diagnostic-v1'
          assert x['execution']['optimizerStepsExecuted']==0
          assert x['execution']['thresholdsChanged'] is False
          assert x['execution']['thresholdSearchExecuted'] is False
          assert x['execution']['modelWeightsChanged'] is False
          assert x['execution']['p3Opened'] is False
          PY
          echo "OPTIMIZER_STEPS_EXECUTED=0"
          echo "THRESHOLD_SEARCH_EXECUTED=false"
          echo "P3_OPENED=false"

      - name: Upload bounded diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: astra-p1-p2-activation-domain-diagnostic-v1
          path: /tmp/p1-p2-activation-diagnostic.json
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup selected P1/P2 material
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/p1-diagnostic /tmp/p2-diagnostic /tmp/selected-p1 /tmp/selected-p2 /tmp/P1_*.zip /tmp/P2_*.zip /tmp/v3-artifact
          echo "OPTIMIZER_STEPS_EXECUTED=0"
          echo "P3_MEDIA_ACCESSED=false"
