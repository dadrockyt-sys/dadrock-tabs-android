name: V153 event-347 CPU Gold score once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v153-event347-cpu-score-once.yml

permissions:
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo
  SENTINEL: debug/v153-reference-free-strength/phase-c-score-attempt-sentinel.json
  OUTPUT: debug/v153-reference-free-strength/phase-c-score/score-result.json
  COMPLETE: debug/v153-reference-free-strength/phase-c-score-complete-sentinel.json
  CUDA_VISIBLE_DEVICES: ""

jobs:
  score-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Reference-free preflight before score-attempt consumption
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          test ! -e "$OUTPUT"
          test ! -e "$COMPLETE"
          test "$(git hash-object debug/v153-reference-free-strength/phase-c-scoring-preregistration.json)" = "361208d8e57c614e8a509eecb5680f0d6daf841b"
          test "$(git hash-object validation/v153_reference_free_strength/score_event347_once.py)" = "50f08090631ccd14701ff9f3a5d3324c7cf1f3b7"
          test "$(git hash-object "$SENTINEL")" = "1f1c89d1ddbf950275b2a15820a9f7d868d53740"
          test "$(git hash-object debug/v153-reference-free-strength/candidate/candidate.json)" = "975ab36c234b423d1b56e59588e960f7d9d7103f"
          test "$(git hash-object debug/v153-reference-free-strength/candidate/construction-proof.json)" = "efe6107df544086f62babf737ef044116ed551f0"
          test "$(git hash-object debug/v153-reference-free-strength/candidate/pdf-event-fidelity.json)" = "f6b1b7b463c9b55e2e70fb116d97f3508b6c269f"
          test "$(git hash-object debug/v153-reference-free-strength/candidate/preservation-manifest.json)" = "f690aeefd81090b4f558353cb3f30b7fe4dca0b9"
          test "$(git hash-object debug/v152-active-recurrence/phase-c-score/score-result.json)" = "05042410ecd5b9793e1182a1bb1dd63ae949ab51"
          python validation/v153_reference_free_strength/score_event347_once.py --help >/dev/null

      - name: Consume one-use attempt and checkpoint before Gold access
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          sentinel = Path(os.environ['SENTINEL'])
          data = json.loads(sentinel.read_text())
          if data.get('status') != 'ARMED_NOT_CONSUMED':
              raise SystemExit('V153 CPU score attempt is not cleanly armed')
          if data.get('goldOrReferenceRead') is not False or data.get('referenceParsed') is not False or data.get('scoreCallCount') != 0:
              raise SystemExit('V153 CPU score attempt already crossed reference boundary')
          if data.get('modalL4CudaGpuUsed') is not False:
              raise SystemExit('GPU flag mismatch')
          data['status'] = 'CONSUMED_BEFORE_GOLD_ACCESS'
          data['runId'] = os.environ['RUN_ID']
          data['runHeadSha'] = os.environ['HEAD_SHA']
          data['consumedAtUtc'] = datetime.now(timezone.utc).isoformat()
          sentinel.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')

          cp = Path('docs/checkpoints/CURRENT_STATE.md')
          text = cp.read_text()
          text = text.replace(
              'Active phase: **V153 Phase C CPU GOLD SCORE = PREREGISTERED / FROZEN / ARMED / BEFORE GOLD.',
              'Active phase: **V153 Phase C CPU GOLD SCORE = CONSUMED / BEFORE GOLD.'
          )
          text = text.replace(
              '- V153 Phase C CPU Gold score: **FROZEN / ARMED / BEFORE GOLD**.',
              '- V153 Phase C CPU Gold score: **ATTEMPT CONSUMED / BEFORE GOLD**.'
          )
          cp.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SENTINEL" docs/checkpoints/CURRENT_STATE.md
          git commit -m 'debug: consume V153 CPU score attempt before Gold [skip ci]'
          git push origin "HEAD:$BRANCH"

      - name: Run exactly one frozen CPU Gold score
        shell: bash
        run: |
          set -euo pipefail
          python validation/v153_reference_free_strength/score_event347_once.py --output "$OUTPUT" | tee /tmp/v153-score-summary.json
          sha256sum "$OUTPUT"

      - name: Verify persist score and completion checkpoint
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path(os.environ['OUTPUT'])
          payload = output.read_bytes()
          result_sha = hashlib.sha256(payload).hexdigest()
          result = json.loads(payload)
          if result.get('classification') != 'v153-event347-cpu-single-gold-calibration-score':
              raise SystemExit('classification mismatch')
          if (result.get('candidate') or {}).get('canonicalEventSha256') != 'df40a771219fb69ae3c129c90ef5351e64b89006ff678e484741ecf0418e3d4b':
              raise SystemExit('candidate identity mismatch')
          if (result.get('reference') or {}).get('sha256') != '18fd868ae960dfcdd1ffb0110f1a9dfd8acc2ffeb46e247d1116cd54291526ac':
              raise SystemExit('reference identity mismatch')
          if (result.get('safety') or {}).get('scoreCallCount') != 1 or (result.get('scoringChain') or {}).get('scoreCallCount') != 1:
              raise SystemExit('score call mismatch')
          if (result.get('safety') or {}).get('modalL4CudaGpuUsed') is not False:
              raise SystemExit('GPU use detected')
          if (result.get('safety') or {}).get('candidateModified') is not False:
              raise SystemExit('candidate modified')

          comp = result['comparison']
          vec = comp['candidateDisplayVectorPercent']
          base = comp['acceptedBaselineDisplayVectorPercent']
          prior = comp['v152DisplayVectorPercent']
          critical = int(result['score']['criticalMismatchCount'])
          db = int(comp['criticalMismatchDeltaVsAcceptedBaseline'])
          dp = int(comp['criticalMismatchDeltaVsV152'])

          complete = {
              'schema': 'dadrock.tabs.v153.event347.phase-c-score-completion.v1',
              'status': 'COMPLETE_RESULT_PERSISTED_SEAL_PENDING',
              'runId': os.environ['RUN_ID'],
              'completedAtUtc': datetime.now(timezone.utc).isoformat(),
              'scoreResultSha256': result_sha,
              'candidateEventSha256': 'df40a771219fb69ae3c129c90ef5351e64b89006ff678e484741ecf0418e3d4b',
              'candidateDisplayVectorPercent': vec,
              'acceptedBaselineDisplayVectorPercent': base,
              'v152DisplayVectorPercent': prior,
              'criticalMismatchCount': critical,
              'criticalMismatchDeltaVsAcceptedBaseline': db,
              'criticalMismatchDeltaVsV152': dp,
              'scoreCallCount': 1,
              'modalL4CudaGpuUsed': False,
              'candidateSearchRun': False,
              'alternateCandidateConstructed': False,
              'candidateModified': False,
              'automaticPromotion': False,
          }
          Path(os.environ['COMPLETE']).write_text(json.dumps(complete, indent=2, sort_keys=True) + '\n')

          sentinel = Path(os.environ['SENTINEL'])
          s = json.loads(sentinel.read_text())
          s['status'] = 'COMPLETE_RESULT_PERSISTED_SEAL_PENDING'
          s['goldOrReferenceRead'] = True
          s['referenceParsed'] = True
          s['scoreCallCount'] = 1
          s['resultSha256'] = result_sha
          sentinel.write_text(json.dumps(s, indent=2, sort_keys=True) + '\n')

          cp = Path('docs/checkpoints/CURRENT_STATE.md')
          text = cp.read_text()
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('Active phase: **V153 Phase C CPU GOLD SCORE ='):
                  lines[i] = 'Active phase: **V153 Phase C CPU GOLD SCORE = COMPLETE / RESULT PERSISTED / WORKFLOW SEAL PENDING. Exactly one CPU Gold calibration score was executed; no Modal/L4/CUDA/GPU was used. V153 event-347 candidate remains immutable.**'
          text = '\n'.join(lines) + '\n'
          text = text.replace('- V153 Phase C CPU Gold score: **ATTEMPT CONSUMED / BEFORE GOLD**.', '- V153 Phase C CPU Gold score: **COMPLETE / RESULT PERSISTED / WORKFLOW SEAL PENDING**.')
          text = text.replace('- Gold/reference read: **NO**.', '- Gold/reference read: **YES — exactly one sealed CPU calibration score boundary crossed**.')
          text = text.replace('- V153 score call count: **0**.', '- V153 score call count: **1**.')
          marker = '## V153 Phase C CPU Gold score — COMPLETE / RESULT PERSISTED / SEAL PENDING — 2026-08-27 UTC'
          if marker in text:
              raise SystemExit('duplicate completion checkpoint')
          text += f'''\n{marker}\n- Exactly one CPU-only Gold calibration score completed in run `{os.environ['RUN_ID']}`; score-result SHA256 **`{result_sha}`**.\n- V153 percentages (pitch content / pitch timing / string-fret timing / chord pitch-set / measure coverage / PDF fidelity): **{vec[0]:.3f} / {vec[1]:.3f} / {vec[2]:.3f} / {vec[3]:.3f} / {vec[4]:.3f} / {vec[5]:.3f}**.\n- Accepted baseline: **{base[0]:.3f} / {base[1]:.3f} / {base[2]:.3f} / {base[3]:.3f} / {base[4]:.3f} / {base[5]:.3f}**. V152: **{prior[0]:.3f} / {prior[1]:.3f} / {prior[2]:.3f} / {prior[3]:.3f} / {prior[4]:.3f} / {prior[5]:.3f}**.\n- Critical mismatches **{critical}**; delta vs accepted baseline **{db:+d}**; delta vs V152 **{dp:+d}**.\n- Safety: score calls **1**; candidate search/alternate candidate/candidate modification/tuning/audio recomputation/Modal/L4/CUDA/GPU/main/Production/promotion **NO**.\n- The scored V153 candidate is immutable and must not be retuned or rescored. CPU-only follow-up analysis may proceed at assistant discretion. Modal/L4/CUDA/GPU still requires fresh explicit user authorization.\n'''
          cp.write_text(text)
          PY
          git add "$OUTPUT" "$COMPLETE" "$SENTINEL" docs/checkpoints/CURRENT_STATE.md
          git commit -m 'docs: persist V153 CPU Gold score result [skip ci]'
          git push origin "HEAD:$BRANCH"

      - name: Upload score evidence
        uses: actions/upload-artifact@v4
        with:
          name: v153-event347-cpu-score-${{ github.run_id }}
          path: |
            debug/v153-reference-free-strength/phase-c-score-attempt-sentinel.json
            debug/v153-reference-free-strength/phase-c-score-complete-sentinel.json
            debug/v153-reference-free-strength/phase-c-score/score-result.json
          retention-days: 30
