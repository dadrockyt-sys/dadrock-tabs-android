name: V154 Bass Timing Skeleton Once

on:
  push:
    branches: [v143-contextual-prune-lobo]

permissions:
  contents: write

jobs:
  skeleton:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo
          fetch-depth: 1
      - name: Build compact reference-only timing skeleton
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v143-contextual-prune-lobo"
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          src=Path('research/v154-professional-references/bass-professional-reference-machine-readable.json')
          expected='a8e1d123f8a19e69d9c160d78aea7637b5a2012232b23e1f1ddff051e9bc40b3'
          b=src.read_bytes(); actual=hashlib.sha256(b).hexdigest()
          if actual != expected: raise SystemExit(f'Bass source sha mismatch {actual}')
          p=json.loads(b)
          rows=[]
          for m in p['measures']:
            ev=[]
            for e in m.get('events',[]):
              ev.append({
                'o': e.get('visualOrder'),
                'k': 'C' if e.get('continuationOnly') else ('X' if e.get('kind')=='deadNote' else 'N'),
                'm': e.get('midi'),
                'tieIn': bool(e.get('tieIn')),
                'tieOut': bool(e.get('tieOut')),
                'grace': bool(e.get('graceToNext')),
                'slurFrom': bool(e.get('slurFromPrevious')),
                'slurTo': bool(e.get('slurToNext')),
              })
            rows.append({
              'measure': m['measure'],
              'timeSignature': m.get('timeSignature'),
              'sourcePage': m.get('sourcePage'),
              'excludeFromScoring': bool(m.get('excludeFromScoring')),
              'events': ev,
            })
          out={
            'schema':'dadrock.tabs.v154.bass-timing-normalization-skeleton.v1',
            'sourceSha256':actual,
            'generatedCandidateRead':False,
            'scoringPerformed':False,
            'measures':rows,
          }
          dst=Path('research/v154-professional-references/bass-timing-normalization-skeleton.json')
          dst.write_text(json.dumps(out,separators=(',',':'))+'\n')
          print('measures',len(rows),'events',sum(len(x['events']) for x in rows))
          PY
      - name: Commit skeleton and seal workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dadrock-v154-bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/v154-bass-timing-skeleton-once.yml
          git add research/v154-professional-references/bass-timing-normalization-skeleton.json .github/workflows/v154-bass-timing-skeleton-once.yml
          git commit -m "v154: freeze Bass timing skeleton"
          git push origin HEAD:v143-contextual-prune-lobo
