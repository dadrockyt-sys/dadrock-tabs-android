name: V154 persist broad-Other artifact once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v154-persist-broad-other-artifact-once.yml

permissions:
  actions: read
  contents: write

env:
  BRANCH: v143-contextual-prune-lobo
  SOURCE_RUN_ID: "33096559281"
  SOURCE_ARTIFACT_ID: "9656706944"
  SOURCE_ARTIFACT_NAME: v154-broad-other-cpu-33096559281
  SOURCE_ARTIFACT_DIGEST: sha256:f0944432c37b369ac38cd25d058265a76f36b23e2f0bcf9808880d9e141dc518
  DEST: debug/v154-cpu-autonomous/broad-other-run-33096559281

jobs:
  persist:
    if: github.event.head_commit.message == 'ci: persist frozen V154 broad-Other artifact once'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: /tmp/v154-frozen-artifact
          github-token: ${{ github.token }}
          repository: dadrockyt-sys/dadrock-tabs-android
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Verify immutable generated output
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/v154-frozen-artifact/generated.json
          test -f /tmp/v154-frozen-artifact/generation-manifest.json
          test "$(sha256sum /tmp/v154-frozen-artifact/generated.json | awk '{print $1}')" = "1be86f86bb08e164342aa0c52db7a4d77beb938621e00d7d2e3b0e03f2dbfc37"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/v154-frozen-artifact')
          g=json.loads((root/'generated.json').read_text())
          m=json.loads((root/'generation-manifest.json').read_text())
          a=json.loads((root/'audio-identity.json').read_text())
          d=json.loads((root/'demucs-identity.json').read_text())
          assert m['runId']=='33096559281'
          assert m['runHeadSha']=='986e2a69a6cb877a203d2f8b04115914dc8fd2e6'
          assert m['generatedJsonSha256']=='1be86f86bb08e164342aa0c52db7a4d77beb938621e00d7d2e3b0e03f2dbfc37'
          assert m['combinedGuitarNoteCount']==1089 and m['bassNoteCount']==635
          assert m['referenceRead'] is False and m['referenceFacingScoreCalls']==0
          assert g['safety']['referenceRead'] is False and g['safety']['cudaGpuUsed'] is False
          assert len(g['streams']['combinedGuitar'])==1089 and len(g['streams']['bass'])==635
          assert a['normalizedWavSha256']=='3e61b7926eabc21b758c750f826c7426a29d6de5aafdd5c93f8045ecdc67f87e'
          assert d['otherStemSha256']=='c288232d1fff42f0fcf57e3e46dfd274428cb2d4e1c916f7fe663d28d42b1440'
          assert d['bassStemSha256']=='918670e9293b5aa633593fbe491ff520a045774ead7cbdba0a851301d4e86b0f'
          PY

      - name: Persist generated output and receipt, then self-seal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEST"
          cp /tmp/v154-frozen-artifact/generated.json "$DEST/generated.json"
          cp /tmp/v154-frozen-artifact/generation-manifest.json "$DEST/generation-manifest.json"
          cp /tmp/v154-frozen-artifact/audio-identity.json "$DEST/audio-identity.json"
          cp /tmp/v154-frozen-artifact/demucs-identity.json "$DEST/demucs-identity.json"
          cp /tmp/v154-frozen-artifact/pip-freeze.txt "$DEST/pip-freeze.txt"
          cp /tmp/v154-frozen-artifact/transcriber-summary.txt "$DEST/transcriber-summary.txt"
          python - <<'PY'
          import json
          from pathlib import Path
          receipt={
            'schema':'dadrock.tabs.v154.broad-other-artifact-receipt.v1',
            'sourceRunId':'33096559281',
            'sourceRunHeadSha':'986e2a69a6cb877a203d2f8b04115914dc8fd2e6',
            'sourceArtifactId':9656706944,
            'sourceArtifactName':'v154-broad-other-cpu-33096559281',
            'sourceArtifactDigest':'sha256:f0944432c37b369ac38cd25d058265a76f36b23e2f0bcf9808880d9e141dc518',
            'generatedJsonSha256':'1be86f86bb08e164342aa0c52db7a4d77beb938621e00d7d2e3b0e03f2dbfc37',
            'combinedGuitarNoteCount':1089,
            'bassNoteCount':635,
            'normalizedWavSha256':'3e61b7926eabc21b758c750f826c7426a29d6de5aafdd5c93f8045ecdc67f87e',
            'otherStemSha256':'c288232d1fff42f0fcf57e3e46dfd274428cb2d4e1c916f7fe663d28d42b1440',
            'bassStemSha256':'918670e9293b5aa633593fbe491ff520a045774ead7cbdba0a851301d4e86b0f',
            'referenceRead':False,
            'referenceFacingScoreCalls':0,
            'humanCorrection':False,
            'thresholdSweep':False,
            'modalUsed':False,
            'cudaGpuUsed':False,
            'mainOrProductionModified':False
          }
          Path('debug/v154-cpu-autonomous/broad-other-run-33096559281/artifact-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          rm .github/workflows/v154-persist-broad-other-artifact-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST" .github/workflows/v154-persist-broad-other-artifact-once.yml
          git commit -m 'v154: persist frozen broad-Other generated output and seal [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
