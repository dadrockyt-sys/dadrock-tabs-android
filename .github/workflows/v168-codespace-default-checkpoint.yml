name: V168 Codespaces default checkpoint

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v168-codespace-default-checkpoint.yml

permissions:
  contents: write

jobs:
  append-checkpoint:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Append verified Codespaces checkpoint
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d >> docs/checkpoints/CURRENT_STATE.md
          rm .github/workflows/v168-codespace-default-checkpoint.yml
          git config user.name 'dadrockyt-sys'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/checkpoints/CURRENT_STATE.md .github/workflows/v168-codespace-default-checkpoint.yml
          git commit -m 'Checkpoint Codespaces default CPU environment'
          git push origin HEAD:v143-contextual-prune-lobo
