name: V148 Checkpoint Import Failure Once

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v148-checkpoint-import-failure-once.yml

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Append durable failure/recovery checkpoint and self-seal
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v143-contextual-prune-lobo"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object docs/checkpoints/CURRENT_STATE.md)" = "9dc1ee83b521289d2d7f5c6e3d6168356ec9c408"
          test "$(git hash-object debug/v148-singleton-only/construction-attempt-sentinel.json)" = "52321ef300e7c54ea10d91b9ef98e6f287215f03"
          test "$(git hash-object validation/v148_singleton_only/construct_once.py)" = "bb43464f48cc8e0eade0f9e98229c859cb117986"
          test "$(git hash-object validation/v148_singleton_only/recover_import_path_once.py)" = "0bc6ab8795539eaab084cae5e60680ac0a2cba66"
          test "$(git hash-object debug/v148-singleton-only/import-path-recovery-preregistration.json)" = "c5825e8a345a52c2aa15f38527334d24eef409af"
          cat >> docs/checkpoints/CURRENT_STATE.md <<'EOF'

## V148 Phase B first construction attempt — FAILED CLOSED BEFORE CONSTRUCTION / RECOVERY FROZEN — 2026-08-27 UTC
- Original one-use construction workflow arming commit: `86ce4cf2a4e06048cca4cd65f1ddf199c840f2a6`.
- GitHub Actions run `33043698461`, job `98422759855`: **FAILURE** at step `Construct exactly one frozen V148 candidate`.
- The one-use attempt sentinel was correctly consumed first and durably committed at **`3fa9175a2a9b334dda48f63877ee9ef7e9ef703d`**; current sentinel blob `52321ef300e7c54ea10d91b9ef98e6f287215f03`, status `CONSUMED_BEFORE_CONSTRUCTION`.
- Exact failure from job logs: `ModuleNotFoundError: No module named 'modal'` while importing `modal.v147_phase_c_artifact_support` at module initialization in `validation/v148_singleton_only/construct_once.py`.
- This was an infrastructure/module-discovery failure only. Python exited at import time **before accepted-family reconstruction, before preserved V147 candidate/decision input reads, and before construction logic could execute**.
- Candidate output persisted: **NO**. V148 candidates constructed: **0**. Reference-facing score calls: **0**.
- No Gold/reference/professional image content was opened; no audio was read/decoded; no HPSS/CQT, Modal/L4/GPU, scorer, search, retuning, main/Production modification, or promotion occurred.
- The original frozen scientific constructor remains unchanged at blob **`bb43464f48cc8e0eade0f9e98229c859cb117986`**.
- Infrastructure-only launcher `validation/v148_singleton_only/recover_import_path_once.py` is frozen at blob **`0bc6ab8795539eaab084cae5e60680ac0a2cba66`**. Its only action is to prepend the repository root to Python `sys.path` and delegate to the unchanged constructor; it contains no musical/candidate logic.
- Recovery preregistration: `debug/v148-singleton-only/import-path-recovery-preregistration.json`; Git blob **`c5825e8a345a52c2aa15f38527334d24eef409af`**; freeze commit `f50c6e862a1d73bf26ff8d01824e577e96f687da`.
- Recovery keeps the same single candidate policy and expected gates: 1144 events, 113 measures, exactly **106 changed singleton events / 106 changed singleton onsets / 0 polyphonic changes**, deterministic replay, PDF event fidelity `1.0`, and maximum total constructed V148 candidates across failed+recovery runs = **1**.
- Reference-facing scoring authorization remains **FALSE**. Recovery must not score, inspect Gold/reference/image, use audio/HPSS/CQT/Modal/L4/GPU, change thresholds/weights/filters, construct variants, retune, touch main/Production, or promote.
- The failed original workflow remains present but its consumed sentinel prevents a legitimate rerun. Any recovery execution must use the separately frozen recovery boundary above and preserve the zero-prior-candidate proof.
EOF
          rm .github/workflows/v148-checkpoint-import-failure-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin v143-contextual-prune-lobo
          test "$(git rev-parse origin/v143-contextual-prune-lobo)" = "$GITHUB_SHA"
          git add docs/checkpoints/CURRENT_STATE.md .github/workflows/v148-checkpoint-import-failure-once.yml
          git commit -m "docs: checkpoint V148 import-path failure and recovery freeze"
          git push origin HEAD:v143-contextual-prune-lobo
