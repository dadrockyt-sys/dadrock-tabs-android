name: Songsterr Fresh Policy C DigitalOcean Blocker Once

on:
  push:
    branches:
      - songsterr-fresh-pipeline-v1
    paths:
      - '.github/workflows/songsterr-fresh-policy-c-do-payment-blocker-once.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: songsterr-fresh-pipeline-v1
          fetch-depth: 0
      - name: Record current external blocker
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          p=Path('docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md')
          t=p.read_text(encoding='utf-8')
          marker='- Current external blocker: provision/register one persistent Linux x64 host as the sole `songsterr-fresh-authority-v1` runner, build the dedicated venv, and run `mode=probe`. No real Policy C probe or canary has run yet.\n'
          replacement='- Current external blocker: DigitalOcean provisioning is blocked at account billing setup. Connected account reports status `warning`; SSH-key creation returned HTTP 403 with `You need to provide a payment method before trying to create resources under your account`. No Droplet, SSH key, Policy C probe, or canary was created by this attempt. After billing is enabled, provision the persistent Linux x64 host, register it as the sole `songsterr-fresh-authority-v1` runner, build the dedicated venv, and run `mode=probe`.\n'
          if marker not in t:
              raise SystemExit('CURRENT_EXTERNAL_BLOCKER_MARKER_CHANGED')
          t=t.replace(marker,replacement,1)
          lines=t.splitlines()
          stamp=datetime.now(ZoneInfo('America/Toronto')).strftime('%Y-%m-%d %H:%M America/Toronto')
          for i,line in enumerate(lines):
              if line.startswith('Updated: '):
                  lines[i]=f'Updated: {stamp}'
                  break
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Commit checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dadrockyt-sys'
          git config user.email 'Stephen.s.mcnally@gmail.com'
          git add docs/checkpoints/SONGSTERR_FRESH_PIPELINE_CURRENT_STATE.md
          git commit -m 'docs: record fresh Policy C DigitalOcean payment blocker'
          git push origin HEAD:songsterr-fresh-pipeline-v1
