name: Run full PDF download repair

on:
  push:
    paths:
      - '.github/workflows/run-fix-full-pdf-download.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Repair finished PDF request
        run: python .github/scripts/fix_full_pdf_download.py

      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ai-tab/page.js
          git diff --cached --quiet || git commit -m "Repair full PDF download and email request"
          git push
