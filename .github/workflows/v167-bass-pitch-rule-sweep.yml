name: V167 fixed Bass audio-evidence pitch-rule sweep

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v167-bass-pitch-rule-sweep.yml

permissions:
  contents: write

concurrency:
  group: v167-bass-pitch-rule-sweep-once
  cancel-in-progress: false

env:
  BRANCH: v143-contextual-prune-lobo
  EXPECTED_PARENT_HEAD: 95442e8a97d10bb8f8e3080c40d4a27a29d216b3
  CANDIDATE: debug/v167-single-song-calibration/iteration-002-generated.json
  REFERENCE: research/v154-professional-references/scorer-ready/frontend-reference-payload.json
  SCORER: validation/v154_cpu_multitrack/score_frontend_reference.py
  SWEEP_CODE: validation/v167_single_song_calibration/bass_pitch_rule_sweep_v167.py
  OUTPUT: debug/v167-single-song-calibration/bass-pitch-rule-sweep.json

jobs:
  sweep:
    if: github.ref == 'refs/heads/v143-contextual-prune-lobo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Bass pitch-rule arm
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify frozen calibration inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" "$GITHUB_SHA")" = ".github/workflows/v167-bass-pitch-rule-sweep.yml"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"
          test "$(git hash-object "$CANDIDATE")" = "7eba73700116ceeca580a8851abe399aed764834"
          test "$(git hash-object "$REFERENCE")" = "2fbed60b543c0488934d8642c488aa06bf31bbf5"
          test "$(git hash-object "$SCORER")" = "9644e65719fbd361a9b39778ae9950c5e983e855"
          test "$(git hash-object "$SWEEP_CODE")" = "2b59bb1dcb2b5724eb56457349639ec6eb6eca83"
          test ! -e "$OUTPUT"
          python - <<'PY'
          import json
          c=json.load(open('debug/v167-single-song-calibration/iteration-002-generated.json'))
          assert c['calibration']['iteration']==2
          assert c['calibration']['directReferenceEventCopy'] is False
          assert len(c['streams']['bass'])==402
          assert all('stateMidi' in e and 'medianPyinMidi' in e for e in c['streams']['bass'])
          PY

      - name: Sweep whole-stream Bass pitch rules
        shell: bash
        run: |
          set -euo pipefail
          python "$SWEEP_CODE" \
            --candidate "$CANDIDATE" \
            --reference "$REFERENCE" \
            --scorer "$SCORER" \
            --output "$OUTPUT"

      - name: Freeze Bass pitch-rule sweep and self-seal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('debug/v167-single-song-calibration/bass-pitch-rule-sweep.json'))
          assert r['version']=='V167'
          assert r['policy']['referenceSelectsWholeRuleOnly'] is True
          assert r['policy']['referenceSelectsIndividualEventMidi'] is False
          assert r['policy']['timingModified'] is False
          assert r['policy']['eventCardinalityModified'] is False
          assert r['policy']['alternativeMidiDerivedOnlyFromStoredAudioEvidence'] is True
          assert r['policy']['directReferenceCopy'] is False
          print(json.dumps({'baseline':r['baseline'],'best':r['best'],'deltaPercent':r['deltaRecognitionPercent']},indent=2,sort_keys=True))
          PY
          rm .github/workflows/v167-bass-pitch-rule-sweep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$OUTPUT" .github/workflows/v167-bass-pitch-rule-sweep.yml
          changed="$(git diff --cached --name-only)"
          if echo "$changed" | grep -Ev '^debug/v167-single-song-calibration/bass-pitch-rule-sweep\.json$|^\.github/workflows/v167-bass-pitch-rule-sweep\.yml$'; then
            echo 'Unexpected V167 Bass pitch-rule path' >&2
            exit 1
          fi
          git commit -m "research: freeze V167 fixed Bass audio-evidence pitch-rule sweep [skip ci]"
          git push origin HEAD:"$BRANCH"
