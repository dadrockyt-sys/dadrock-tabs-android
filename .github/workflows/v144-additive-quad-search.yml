name: V144 Rhythm Accepted-Baseline Additive Quad Search — Archived

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    name: Refuse replay of consumed additive quad calibration search
    runs-on: ubuntu-latest
    steps:
      - name: Refuse replay
        shell: bash
        run: |
          echo 'The V144 accepted-baseline additive quad search family is consumed and may not be replayed or retuned.' >&2
          exit 1
