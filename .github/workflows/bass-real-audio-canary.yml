name: Bass Real Audio Canary

on:
  workflow_dispatch:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - '.github/workflows/bass-real-audio-canary.yml'
      - 'analyzer/bass_real_audio_canary_modal.py'
      - 'analyzer/verify_bass_real_audio_canary.py'
      - 'analyzer/bass_professional_separator_scaffold.py'

concurrency:
  group: bass-real-audio-canary
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bass-real-audio-canary:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      RAW_PATH: .bass-canary/raw-bass-canary.json
      RESULT_PATH: debug/v143-contextual-prune/bass-real-audio-canary.json
      ACTION_PATH: debug/v143-contextual-prune/bass-real-audio-canary-action.json

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
        with:
          ref: v143-contextual-prune-lobo

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal CLI
        shell: bash
        run: python -m pip install --disable-pip-version-check modal

      - name: Run isolated real-audio Bass separator canary
        shell: bash
        run: |
          set +e
          mkdir -p .bass-canary/logs debug/v143-contextual-prune
          credentials=false
          status=99
          if [ -n "${MODAL_TOKEN_ID:-}" ] && [ -n "${MODAL_TOKEN_SECRET:-}" ]; then
            credentials=true
            timeout 1500s python -m modal run \
              analyzer/bass_real_audio_canary_modal.py::run \
              --audio-path public/gomywayfullaitest.m4a \
              --output-path "$RAW_PATH" \
              > .bass-canary/logs/modal.log 2>&1
            status=$?
          else
            echo 'Modal GitHub credentials unavailable; Bass canary not attempted.' \
              > .bass-canary/logs/modal.log
          fi
          echo "BASS_MODAL_CREDENTIALS=$credentials" >> "$GITHUB_ENV"
          echo "BASS_MODAL_STATUS=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Verify separation and reference-free pitch evidence
        shell: bash
        run: |
          set +e
          status=99
          if [ "${BASS_MODAL_STATUS:-99}" -eq 0 ] && [ -s "$RAW_PATH" ]; then
            python analyzer/verify_bass_real_audio_canary.py \
              --input "$RAW_PATH" \
              --output "$RESULT_PATH" \
              > .bass-canary/logs/verifier.log 2>&1
            status=$?
          else
            echo 'Verifier skipped because raw Bass canary output is unavailable.' \
              > .bass-canary/logs/verifier.log
          fi
          echo "BASS_VERIFY_STATUS=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Write compact action diagnostic
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          raw = Path(os.environ['RAW_PATH'])
          result = Path(os.environ['RESULT_PATH'])
          payload = {
              'schemaVersion': 1,
              'gate': 'bass-real-audio-canary-action',
              'modalCredentialsAvailableInGitHubActions': os.environ.get('BASS_MODAL_CREDENTIALS') == 'true',
              'modalExitCode': int(os.environ.get('BASS_MODAL_STATUS', '99')),
              'rawCanaryOutputPresent': raw.is_file() and raw.stat().st_size > 0,
              'verifierExitCode': int(os.environ.get('BASS_VERIFY_STATUS', '99')),
              'canaryEvidencePresent': result.is_file() and result.stat().st_size > 0,
              'approvedFixture': 'public/gomywayfullaitest.m4a',
              'referenceFree': True,
              'diagnosticOnly': True,
              'trainingRunAuthorized': False,
              'analyzerRoutingEnabled': False,
              'professionalStructuredIdentityEnabled': False,
              'pdfRendererEnabled': False,
              'liveEndpointDeployedOrModified': False,
              'vercelDeploymentAttempted': False,
              'productionModified': False,
              'productionPromotionAuthorized': False,
              'paidPurchaseAttempted': False,
              'customerTokenRedeemed': False,
              'customerEmailSent': False,
          }
          path = Path(os.environ['ACTION_PATH'])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, indent=2))
          PY

      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bass-real-audio-canary
          path: |
            .bass-canary/logs/
            .bass-canary/raw-bass-canary.json
            debug/v143-contextual-prune/bass-real-audio-canary.json
            debug/v143-contextual-prune/bass-real-audio-canary-action.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit compact Bass canary evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bass-canary-evidence
          cp "$ACTION_PATH" /tmp/bass-canary-evidence/action.json
          if [ -s "$RESULT_PATH" ]; then cp "$RESULT_PATH" /tmp/bass-canary-evidence/result.json; fi

          git fetch origin v143-contextual-prune-lobo
          git rebase origin/v143-contextual-prune-lobo

          cp /tmp/bass-canary-evidence/action.json "$ACTION_PATH"
          if [ -s /tmp/bass-canary-evidence/result.json ]; then cp /tmp/bass-canary-evidence/result.json "$RESULT_PATH"; fi
          git add "$ACTION_PATH"
          if [ -s "$RESULT_PATH" ]; then git add "$RESULT_PATH"; fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record Bass real-audio canary' || true
          git push origin HEAD:v143-contextual-prune-lobo

      - name: Enforce fail-closed Bass canary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          action = json.loads(Path(os.environ['ACTION_PATH']).read_text(encoding='utf-8'))
          if action.get('modalExitCode') != 0 or action.get('verifierExitCode') != 0:
              raise SystemExit(f'Bass real-audio canary execution failed: {action}')

          result = json.loads(Path(os.environ['RESULT_PATH']).read_text(encoding='utf-8'))
          if result.get('passed') is not True or result.get('realAudioBassCanaryPassed') is not True:
              raise SystemExit(f'Bass real-audio canary did not pass: {result}')
          if result.get('noteTimingTechniqueQualityProven') is not False:
              raise SystemExit('Bass canary must not claim note/timing/technique quality')
          for key in (
              'trainingRunAuthorized',
              'analyzerRoutingEnabled',
              'professionalStructuredIdentityEnabled',
              'pdfRendererEnabled',
              'liveEndpointDeployedOrModified',
              'vercelDeploymentAttempted',
              'productionModified',
              'productionPromotionAuthorized',
              'paidPurchaseAttempted',
              'customerTokenRedeemed',
              'customerEmailSent',
          ):
              if result.get(key) is not False:
                  raise SystemExit(f'Safety failure: {key} must remain false')
          print('BASS REAL-AUDIO SEPARATION + PITCH CANARY PASSED')
          PY
