name: v143 checkpoint feasibility replay result

on:
  push:
    branches:
      - v143-contextual-prune-lobo
    paths:
      - .github/workflows/v143-checkpoint-feasibility-replay-result.yml

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Append feasibility replay checkpoint
        shell: bash
        env:
          CHECKPOINT_B64: 
        run: |
          set -euo pipefail
          marker='## CONTINUATION CHECKPOINT — FEASIBILITY REPLAY RESULT'
          if ! grep -Fq "$marker" docs/checkpoints/CURRENT_STATE.md; then
            printf '\n' >> docs/checkpoints/CURRENT_STATE.md
            printf '%s' "$CHECKPOINT_B64" | base64 --decode >> docs/checkpoints/CURRENT_STATE.md
          fi
          git add docs/checkpoints/CURRENT_STATE.md
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record feasibility replay checkpoint'
          for attempt in 1 2 3 4; do
            git fetch origin v143-contextual-prune-lobo
            git rebase origin/v143-contextual-prune-lobo && git push origin HEAD:v143-contextual-prune-lobo && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
