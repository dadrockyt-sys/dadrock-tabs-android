name: Deploy BTS Modal Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'analyzer/modal_bts_separator.py'
      - 'analyzer/bts-audio-separation-requirements.txt'
      - '.github/workflows/deploy-bts-modal.yml'

permissions:
  contents: read

concurrency:
  group: deploy-bts-modal-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal CLI
        run: python -m pip install --upgrade modal

      - name: Validate Modal deployment credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo "MODAL_TOKEN_ID is missing"; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo "MODAL_TOKEN_SECRET is missing"; exit 1; }

      - name: Deploy Backing Track Studio worker
        run: modal deploy --env main analyzer/modal_bts_separator.py

      - name: Show deployed BTS app
        run: modal app list --env main

      - name: Show deployed BTS endpoint
        run: modal endpoint list --env main --json
