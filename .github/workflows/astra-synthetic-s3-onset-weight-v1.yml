name: Astra synthetic S3 onset-positive-weight pilot v1

on:
  push:
    branches: [astra-work]
    paths:
      - 'docs/astra/SYNTHETIC_DATA_DIVERSITY_S3_LAUNCH_V1.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: astra-synthetic-s3-onset-weight-v1
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-22.04
    timeout-minutes: 85
    steps:
      - name: Checkout exact authorized launch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'

      - name: Verify authorization launch and source pins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          def blob(path):
              return subprocess.check_output(['git','hash-object',path],text=True).strip()
          auth=json.load(open('docs/astra/SYNTHETIC_DATA_DIVERSITY_S3_AUTHORIZATION_V1.json'))
          launch=json.load(open('docs/astra/SYNTHETIC_DATA_DIVERSITY_S3_LAUNCH_V1.json'))
          assert auth['schema']=='astra-synthetic-data-diversity-s3-authorization-v1'
          assert auth['status']=='authorized_single_synthetic_only_onset_weight_pilot'
          assert auth['userInstruction']=='I authorize'
          a=auth['authorization']
          assert a['maxModels']==2 and a['maxOptimizerStepsPerModel']==500
          assert a['automaticRetryAuthorized'] is False and a['thresholdSearchAuthorized'] is False
          assert a['p1Authorized'] is False and a['p2Authorized'] is False and a['p3Authorized'] is False
          expected={
            'designGitBlob':'docs/astra/SYNTHETIC_DATA_DIVERSITY_S3_DESIGN_V1.md',
            'generatorGitBlob':'astra_backend/synthetic/s0_pilot_v1.py',
            'samplingGitBlob':'astra_backend/synthetic/s1_pilot_v1.py',
            'stateWeightGitBlob':'astra_backend/synthetic/s2_pilot_v1.py',
            'runnerGitBlob':'astra_backend/synthetic/s3_pilot_v1.py',
            'testsGitBlob':'astra_backend/synthetic/test_s3_pilot_v1.py',
            'runtimeLockGitBlob':'astra_backend/tabcnn_runtime/requirements.lock.txt',
            'workflowGitBlob':'.github/workflows/astra-synthetic-s3-onset-weight-v1.yml',
          }
          for key,path in expected.items():
              actual=blob(path)
              assert auth['sourceIdentities'][key]==actual,(key,'auth')
              assert launch['sourceIdentities'][key]==actual,(key,'launch')
          assert launch['authorizationGitBlob']==blob('docs/astra/SYNTHETIC_DATA_DIVERSITY_S3_AUTHORIZATION_V1.json')
          PY

      - name: Install exact CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check             --extra-index-url https://download.pytorch.org/whl/cpu             --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          python -m pip check

      - name: Run focused S3 tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=astra_backend python astra_backend/synthetic/test_s3_pilot_v1.py

      - name: Regenerate bounded synthetic corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/astra-s3
          PYTHONPATH=astra_backend python astra_backend/synthetic/s0_pilot_v1.py generate             --out /tmp/astra-s3/dataset.npz             --receipt /tmp/astra-s3/render-receipt.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/astra-s3/render-receipt.json'))
          assert x['examples']==294 and x['audioSeconds']==588.0
          assert x['withinCeilings'] is True and x['externalAudioAssets'] is False
          assert not x['guards']['p1Accessed'] and not x['guards']['p2Accessed'] and not x['guards']['p3Opened']
          PY

      - name: Run exactly two capped onset-weight arms
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=astra_backend python astra_backend/synthetic/s3_pilot_v1.py             --dataset /tmp/astra-s3/dataset.npz             --out /tmp/astra-s3/result.json             --identity-out /tmp/astra-s3/array-identity.json             --control-model /tmp/astra-s3/pos-weight-8.pt             --intervention-model /tmp/astra-s3/pos-weight-16.pt
          python - <<'PY'
          import json
          x=json.load(open('/tmp/astra-s3/result.json'))
          ident=json.load(open('/tmp/astra-s3/array-identity.json'))
          assert x['execution']['modelCount']==2
          assert x['execution']['optimizerStepsTotal']<=1000
          assert x['control']['fit']['optimizerSteps']<=500
          assert x['weight16']['fit']['optimizerSteps']<=500
          assert x['control']['fit']['initialModelSha256']==x['weight16']['fit']['initialModelSha256']
          assert ident['armsUseSameArrays'] is True and ident['armsUseSameBatchIndices'] is True
          assert x['batchPlan']['identicalAcrossArms'] is True
          assert x['fixed']['thresholdSearch'] is False and x['fixed']['thresholdRetuning'] is False
          assert x['execution']['automaticRetry'] is False
          assert not x['guards']['p1Accessed'] and not x['guards']['p2Accessed'] and not x['guards']['p3Opened']
          PY
          echo "THRESHOLD_SEARCH=false"
          echo "AUTOMATIC_RETRY=false"
          echo "P1_ACCESSED=false"
          echo "P2_ACCESSED=false"
          echo "P3_OPENED=false"

      - name: Upload bounded S3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: astra-synthetic-data-diversity-s3-v1
          path: |
            /tmp/astra-s3/render-receipt.json
            /tmp/astra-s3/array-identity.json
            /tmp/astra-s3/result.json
            /tmp/astra-s3/pos-weight-8.pt
            /tmp/astra-s3/pos-weight-16.pt
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/astra-s3
          echo "P1_ACCESSED=false"
          echo "P2_ACCESSED=false"
          echo "P3_OPENED=false"
