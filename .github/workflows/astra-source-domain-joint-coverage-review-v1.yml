name: Astra source-domain joint coverage review V1

# Frozen model-free review trigger.

on:
  push:
    branches: [astra-work]
    paths:
      - '.github/workflows/astra-source-domain-joint-coverage-review-v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  review:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.15'
      - name: Install frozen CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'pip==24.0'
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu --requirement astra_backend/tabcnn_runtime/requirements.lock.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Focused model-free coverage tests
        env:
          PYTHONPATH: astra_backend
        run: pytest -q astra_backend/synthetic/test_source_domain_joint_coverage_review_v1.py
      - name: Download exact frozen preparation
        uses: actions/download-artifact@v4
        with:
          name: astra-source-domain-simulator-preparation-v1
          path: /tmp/astra-source-domain-coverage
          github-token: ${{ github.token }}
          repository: dadrockyt-sys/dadrock-tabs-android
          run-id: '36475263654'
      - name: Run one model-free joint coverage review
        env:
          PYTHONPATH: astra_backend
        run: |
          python -m synthetic.source_domain_joint_coverage_review_v1             --control /tmp/astra-source-domain-coverage/datasets/s9-control.npz             --intervention /tmp/astra-source-domain-coverage/datasets/source-domain-intervention.npz             --challenge /tmp/astra-source-domain-coverage/datasets/source-domain-challenge.npz             --out /tmp/source-domain-joint-coverage-result-v1.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/source-domain-joint-coverage-result-v1.json'))
          e=x['execution']
          assert e['modelRun'] is False and e['modelsLoaded']==0 and e['modelInference'] is False
          assert e['optimizerSteps']==0 and e['waveformRenders']==0
          assert e['p1Accessed'] is False and e['p2Accessed'] is False and e['p3Opened'] is False
          assert x['trainingRowCount']==210
          print('SOURCE_DOMAIN_JOINT_COVERAGE_REVIEW_OK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astra-source-domain-joint-coverage-review-v1
          path: /tmp/source-domain-joint-coverage-result-v1.json
          retention-days: 30
